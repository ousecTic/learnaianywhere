  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

rksheet": "Feuille de travail", "kindPdf": "PDF", "kindApp": "Application"}, "sections": [{"id": "intro", "kicker": "Commencez ici", "title": "Introduction", "items": [{"id": "intro/01", "title": "Bienvenue dans le cours", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-intro-01.mp4", "vtt": "WEBVTT\n\n00:00.280 --> 00:01.960\nBonjour et bienvenue dans ce cours\n\n00:01.960 --> 00:03.560\noffline-first, Introduction à\n\n00:03.560 --> 00:07.320\nl'Intelligence Artificielle, proposé par LearnAIAnywhere.org.\n\n00:07.990 --> 00:09.490\nNous sommes une communauté mondiale\n\n00:09.490 --> 00:11.270\nd'enseignants et d'étudiants, et nous\n\n00:11.270 --> 00:13.070\nsommes ravis de vous accueillir ici\n\n00:13.070 --> 00:14.630\nalors que nous travaillons à rendre la\n\n00:14.630 --> 00:16.930\nculture de l'IA accessible à tous,\n\n00:16.930 --> 00:18.290\npartout dans le monde.\n\n00:18.290 --> 00:20.030\nL'histoire qu'on entend souvent à propos\n\n00:20.030 --> 00:21.690\nde l'IA, c'est qu'il s'agit d'une\n\n00:21.690 --> 00:23.490\nopposition entre les humains et ces\n\n00:23.490 --> 00:25.490\nmachines intelligentes, mais en réalité,\n\n00:25.490 --> 00:27.550\nl'IA n'est que le produit des choix humains.\n\n00:28.010 --> 00:30.110\nEt contrairement aux machines, nous, les\n\n00:30.110 --> 00:31.910\nhumains, choisissons ce qui nous tient à\n\n00:31.910 --> 00:33.770\ncœur, comme nos valeurs et nos communautés.\n\n00:34.310 --> 00:36.110\nL'objectif de notre cours est de donner\n\n00:36.110 --> 00:37.930\nà nos apprenants les connaissances et le\n\n00:37.930 --> 00:39.650\ndiscernement nécessaires pour devenir\n\n00:39.650 --> 00:41.330\ndes créateurs responsables et des\n\n00:41.330 --> 00:43.190\nutilisateurs critiques de ces outils d'IA.\n\n00:43.190 --> 00:44.590\nVous allez apprendre ce qu'est\n\n00:44.590 --> 00:46.710\nexactement l'intelligence artificielle,\n\n00:46.710 --> 00:48.350\nles éléments clés de l'apprentissage\n\n00:48.350 --> 00:50.170\nautomatique, comment fonctionne le\n\n00:50.170 --> 00:51.730\nmachine learning, ainsi que les\n\n00:51.730 --> 00:53.330\nprincipes de l'IA responsable.\n\n00:53.770 --> 00:55.310\nDécouvrez cela en créant votre\n\n00:55.310 --> 00:57.950\nclassificateur d'IA avec Mirror Pocket\n\n00:57.950 --> 00:59.870\npour comprendre les outils actuels.\n\n00:59.870 --> 01:02.590\nNos quatre leçons et la fiche d'activité\n\n01:02.590 --> 01:04.050\nvous guideront pas à pas.\n\n01:04.050 --> 01:07.130\nÀ la fin, vous aurez conçu votre projet\n\n01:07.130 --> 01:09.510\net développé une vision critique, prêt à\n\n01:09.510 --> 01:10.610\nprésenter vos résultats.\n\n01:10.610 --> 01:12.290\nNous sommes ravis de vous voir\n\n01:12.290 --> 01:14.690\ncontribuer à l'avenir de l'IA avec nous.\n\n01:15.060 --> 01:16.100\nOn se retrouve en cours !\n"}, {"id": "intro/02", "title": "Prérequis", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-intro-02.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:01.900\nTrès bien, bienvenue en classe.\n\n00:02.680 --> 00:04.300\nIl y a donc deux choses dont vous allez\n\n00:04.300 --> 00:04.900\navoir besoin.\n\n00:05.680 --> 00:07.280\nLa première chose, c'est que vous aurez\n\n00:07.280 --> 00:09.380\nbesoin d'un appareil équipé d'une webcam.\n\n00:10.460 --> 00:12.120\nCet appareil peut être un ordinateur\n\n00:12.120 --> 00:14.360\nportable, une tablette ou un téléphone.\n\n00:15.190 --> 00:17.510\nL'important, c'est qu'il ait une webcam,\n\n00:17.510 --> 00:19.290\ncar nous allons l'utiliser pour prendre\n\n00:19.290 --> 00:19.730\ndes photos.\n\n00:20.680 --> 00:22.260\nL'application que nous allons utiliser\n\n00:22.260 --> 00:23.880\ns'appelle Near Pocket, et c'est avec\n\n00:23.880 --> 00:25.460\nelle que nous allons concevoir notre\n\n00:25.460 --> 00:26.820\nclassificateur d'images.\n\n00:27.620 --> 00:29.160\nVous pouvez simplement y accéder en\n\n00:29.160 --> 00:30.980\nligne, ou si vous souhaitez l'utiliser\n\n00:30.980 --> 00:32.940\nhors ligne, il existe des applications\n\n00:32.940 --> 00:34.840\ndisponibles pour les appareils Windows\n\n00:34.840 --> 00:35.420\net Android.\n\n00:36.190 --> 00:38.210\nDonc, si vous utilisez un iPhone, vous\n\n00:38.210 --> 00:40.330\ndevrez y accéder via le site web à la place.\n\n00:41.620 --> 00:43.280\nL'autre chose, c'est que nous avons une\n\n00:43.280 --> 00:45.420\nfiche de projet optionnelle, et cette\n\n00:45.420 --> 00:47.280\nfiche va nous guider pour concevoir\n\n00:47.280 --> 00:49.740\nnotre classificateur d'IA au fur et à\n\n00:49.740 --> 00:51.880\nmesure que nous avançons dans chaque leçon.\n\n00:51.880 --> 00:54.700\nEt bien sûr, si vous ne souhaitez pas\n\n00:54.700 --> 00:56.600\nl'imprimer, vous pouvez simplement\n\n00:56.600 --> 00:58.080\nutiliser une feuille de papier\n\n00:58.080 --> 01:00.080\nordinaire, cela fera tout aussi bien\n\n01:00.080 --> 01:01.800\nl'affaire car les questions ne sont pas\n\n01:01.800 --> 01:02.320\ntrès longues.\n\n01:03.530 --> 01:04.990\nVoilà, c'est tout ce dont nous avons\n\n01:04.990 --> 01:07.290\nbesoin pour les prérequis, donc je vous\n\n01:07.290 --> 01:08.670\nretrouve dans la prochaine vidéo.\n"}, {"id": "intro/03", "title": "Légende des symboles", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-intro-03.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:01.040\nD'accord.\n\n00:01.040 --> 00:03.040\nBienvenue dans cette introduction à\n\n00:03.040 --> 00:06.080\nl'intelligence artificielle proposée par LearnAnywhere.org.\n\n00:06.940 --> 00:08.920\nAvant de commencer toutes les leçons,\n\n00:08.920 --> 00:10.700\nvous allez remarquer quelques symboles\n\n00:10.700 --> 00:11.960\nen bas à gauche de l'écran.\n\n00:12.690 --> 00:14.450\nSi vous voyez un livre, c'est simplement\n\n00:14.450 --> 00:16.110\nle symbole indiquant que nous allons\n\n00:16.110 --> 00:17.130\nenseigner quelque chose.\n\n00:17.500 --> 00:18.880\nSi vous voyez quelqu'un en train de\n\n00:18.880 --> 00:20.680\ncourir, cela signifie que nous allons\n\n00:20.680 --> 00:22.760\nfaire quelque chose d'interactif, comme\n\n00:22.760 --> 00:24.440\nun jeu ou une activité pratique.\n\n00:24.440 --> 00:26.980\nEt si vous voyez un nuage, cela veut\n\n00:26.980 --> 00:28.360\ndire que nous aurons l'occasion de\n\n00:28.360 --> 00:30.220\nréfléchir à ce que nous avons appris.\n\n00:30.630 --> 00:31.970\nTrès bien, on se retrouve dans la\n\n00:31.970 --> 00:32.470\nprochaine vidéo.\n"}]}, {"id": "lesson-1", "kicker": "Leçon 1", "title": "Qu'est-ce que l'IA", "items": [{"id": "lesson-1/01", "title": "Objectifs", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-1-01.mp4", "vtt": "WEBVTT\n\n00:00.780 --> 00:02.700\nTrès bien, bienvenue à la première leçon\n\n00:02.700 --> 00:05.520\nsur ce qu'est exactement l'intelligence artificielle.\n\n00:06.450 --> 00:08.690\nDonc, dans l'objectif de la leçon un,\n\n00:08.690 --> 00:10.630\nvous allez expliquer les principales\n\n00:10.630 --> 00:12.210\ncaractéristiques qui rendent quelque\n\n00:12.210 --> 00:14.170\nchose artificiellement intelligent, puis\n\n00:14.170 --> 00:16.270\nvous allez identifier des exemples d'IA\n\n00:16.270 --> 00:18.290\net de non-IA et expliquer pourquoi.\n"}, {"id": "lesson-1/02", "title": "Qu'est-ce que l'IA", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-1-02.mp4", "vtt": "WEBVTT\n\n00:01.340 --> 00:02.980\nAlors, avant même de commencer,\n\n00:02.980 --> 00:04.840\nréfléchissez à cette question :\n\n00:04.840 --> 00:06.820\nQu'est-ce qui, selon vous, rend les\n\n00:06.820 --> 00:07.800\nhumains intelligents ?\n\n00:07.800 --> 00:10.160\nMaintenant, mettez la vidéo en pause et\n\n00:10.160 --> 00:12.140\nprenez quelques secondes pour y réfléchir.\n\n00:14.300 --> 00:16.040\nD'accord, maintenant que vous avez eu un\n\n00:16.040 --> 00:17.920\npeu de temps, je voudrais d'abord dire\n\n00:17.920 --> 00:19.220\nque l'intelligence humaine est\n\n00:19.220 --> 00:21.300\nextrêmement complexe, mais nous pouvons\n\n00:21.300 --> 00:23.040\nexaminer deux caractéristiques clés.\n\n00:23.980 --> 00:25.940\nParmi les principales caractéristiques\n\n00:25.940 --> 00:28.020\nqui rendent l'humain intelligent, on\n\n00:28.020 --> 00:30.780\ntrouve son autonomie et sa capacité d'adaptation.\n\n00:30.780 --> 00:32.780\nDonc, quand je parle d'autonomie, il\n\n00:32.780 --> 00:34.840\ns'agit d'un humain qui agit et prend des\n\n00:34.840 --> 00:36.560\ndécisions par lui-même, et quand je\n\n00:36.560 --> 00:38.600\nparle d'adaptabilité, il s'agit de la\n\n00:38.600 --> 00:40.460\ncapacité d'un humain à apprendre de\n\n00:40.460 --> 00:42.300\nl'expérience et à s'améliorer.\n\n00:42.300 --> 00:44.320\nEt donc, un tas de personnes curieuses\n\n00:44.320 --> 00:46.220\nse sont demandé : « Comment pouvons-nous\n\n00:46.220 --> 00:48.220\nintégrer ces aspects de l'intelligence\n\n00:48.220 --> 00:48.860\ndans des machines ?\n\n00:49.450 --> 00:51.050\nEt c'est ainsi qu'est né le domaine de\n\n00:51.050 --> 00:53.090\nl'intelligence artificielle, un champ\n\n00:53.090 --> 00:54.930\nd'étude consacré à la création de\n\n00:54.930 --> 00:57.830\ntechnologies qui imitent le comportement intelligent.\n\n00:59.080 --> 01:01.000\nAinsi, parmi les éléments clés qui\n\n01:01.000 --> 01:02.540\ndonnent à l'IA une apparence\n\n01:02.540 --> 01:04.640\nd'intelligence, on retrouve aussi son\n\n01:04.640 --> 01:06.980\nautonomie et sa capacité d'adaptation.\n\n01:06.980 --> 01:08.360\nDonc, quand je parle d'autonomie, je\n\n01:08.360 --> 01:10.220\nfais simplement référence à la capacité\n\n01:10.220 --> 01:12.080\nd'une technologie à assister ou à\n\n01:12.080 --> 01:13.520\nfonctionner de manière indépendante.\n\n01:14.120 --> 01:16.060\nEt quand je parle d'adaptabilité, il\n\n01:16.060 --> 01:18.140\ns'agit de la capacité d'une technologie\n\n01:18.140 --> 01:20.420\nà s'améliorer à mesure qu'elle analyse\n\n01:20.420 --> 01:21.480\ndavantage de données.\n\n01:21.840 --> 01:23.120\nQuelques exemples auxquels on peut\n\n01:23.120 --> 01:25.360\npenser sont, par exemple, notre moteur\n\n01:25.360 --> 01:25.980\nde recherche.\n\n01:25.980 --> 01:28.280\nSi vous avez déjà utilisé Google, vous\n\n01:28.280 --> 01:30.080\navez interagi avec une forme d'IA.\n\n01:30.680 --> 01:32.240\nIl est autonome parce qu'il peut vous\n\n01:32.240 --> 01:34.980\naider en suggérant des mots de manière indépendante.\n\n01:35.370 --> 01:36.910\nComme vous pouvez le voir, pendant que\n\n01:36.910 --> 01:38.510\nje tape, je reçois toutes ces\n\n01:38.510 --> 01:40.490\ndifférentes suggestions, et il est\n\n01:40.490 --> 01:42.330\négalement adaptatif car il peut\n\n01:42.330 --> 01:44.390\naméliorer ses suggestions en analysant\n\n01:44.390 --> 01:46.630\nles recherches passées des utilisateurs\n\n01:46.630 --> 01:47.550\net bien plus encore.\n\n01:49.350 --> 01:50.790\nMaintenant, un bon exemple de ce qui\n\n01:50.790 --> 01:52.810\nn'est pas de l'IA, c'est une calculatrice.\n\n01:53.200 --> 01:55.440\nElle n'est pas autonome car elle ne fait\n\n01:55.440 --> 01:57.240\nque ce que vous lui demandez, donc vous\n\n01:57.240 --> 01:59.160\ndevez appuyer manuellement sur les\n\n01:59.160 --> 02:01.160\nboutons pour chaque opération que vous\n\n02:01.160 --> 02:03.100\nsouhaitez effectuer, et elle n'est\n\n02:03.100 --> 02:05.360\nsurtout pas adaptative car elle ne peut\n\n02:05.360 --> 02:07.340\npas analyser de nouvelles données et\n\n02:07.340 --> 02:09.120\nfonctionne toujours de la même manière.\n\n02:10.910 --> 02:12.270\nD'accord, maintenant c'est à vous.\n\n02:12.270 --> 02:13.950\nJouons à \"IA ou pas\".\n\n02:14.680 --> 02:15.980\nJe vais décrire une situation.\n\n02:16.370 --> 02:17.930\nVous allez observer si elle implique de\n\n02:17.930 --> 02:19.570\nl'autonomie et de l'adaptativité.\n\n02:19.720 --> 02:21.400\nVous allez décider s'il s'agit d'IA ou\n\n02:21.400 --> 02:23.420\nnon, et vous allez partager votre raisonnement.\n"}, {"id": "lesson-1/03", "title": "IA ou Pas", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=fr"}, {"id": "lesson-1/04", "title": "Comment l'IA peut nous aider", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-1-04.mp4", "vtt": "WEBVTT\n\n00:00.920 --> 00:02.900\nD'accord, alors après avoir joué au jeu\n\n00:02.900 --> 00:05.000\n« IA ou pas », voici une question pour vous.\n\n00:05.940 --> 00:08.460\nComment ces exemples d'IA aidaient-ils les gens ?\n\n00:09.360 --> 00:11.140\nN'hésitez pas à mettre la vidéo en pause\n\n00:11.140 --> 00:12.720\net à y réfléchir quelques secondes.\n\n00:15.050 --> 00:16.990\nL'IA peut améliorer la qualité de notre\n\n00:16.990 --> 00:19.210\ntravail, effectuer certaines parties de\n\n00:19.210 --> 00:21.510\nnos tâches pour nous libérer du temps ou\n\n00:21.510 --> 00:23.770\nsimplifier notre expérience au quotidien.\n\n00:23.770 --> 00:26.810\nAinsi, parmi les exemples concrets, des\n\n00:26.810 --> 00:28.690\nagriculteurs utilisent les technologies\n\n00:28.690 --> 00:31.390\nd'IA pour les aider à résoudre de vrais problèmes.\n\n00:32.290 --> 00:33.750\nVous savez, les agriculteurs utilisent\n\n00:33.750 --> 00:35.710\ndes outils d'IA comme Plant Village\n\n00:35.710 --> 00:38.010\nNiru, où ils peuvent prendre une photo\n\n00:38.010 --> 00:39.610\nd'une feuille de plante et voir si elle\n\n00:39.610 --> 00:41.610\nest malade ou non, et comment la traiter.\n\n00:42.570 --> 00:44.530\nCertains de ces agriculteurs utilisent\n\n00:44.530 --> 00:46.970\négalement un outil appelé FarmerChat,\n\n00:46.970 --> 00:48.610\nqui leur permet d'interagir avec un\n\n00:48.610 --> 00:50.310\nchatbot pour obtenir des conseils sur\n\n00:50.310 --> 00:52.390\nl'agriculture, ce qui les aide à prendre\n\n00:52.390 --> 00:54.090\nde meilleures décisions sur la façon de\n\n00:54.090 --> 00:55.930\ns'occuper de leurs cultures et de leur sol.\n\n00:56.990 --> 00:58.750\nSi l'on regarde dans le contexte des\n\n00:58.750 --> 01:01.110\nmédecins, beaucoup d'entre eux utilisent\n\n01:01.110 --> 01:02.670\nl'imagerie par IA, comme les\n\n01:02.670 --> 01:05.010\nradiographies, pour les aider à détecter\n\n01:05.010 --> 01:07.150\nces signes très subtils et difficiles de\n\n01:07.150 --> 01:09.250\nmaladies, ce qui les aide simplement à\n\n01:09.250 --> 01:10.590\nprendre de meilleures décisions.\n\n01:11.620 --> 01:14.120\nEt puis, Suki est l'un de ces outils où\n\n01:14.120 --> 01:15.980\nle médecin et le patient peuvent avoir\n\n01:15.980 --> 01:18.600\nune conversation, et l'IA prendra\n\n01:18.600 --> 01:20.660\nessentiellement des notes pour eux, ce\n\n01:20.660 --> 01:22.480\nqui permet au médecin de se concentrer\n\n01:22.480 --> 01:23.920\ndavantage sur les patients.\n\n01:25.920 --> 01:28.020\nDonc, l'une des choses importantes que\n\n01:28.020 --> 01:30.240\nnous allons continuer à souligner, c'est\n\n01:30.240 --> 01:33.140\nque la technologie de l'IA est un outil,\n\n01:33.140 --> 01:35.060\net je le dis non pas pour minimiser les\n\n01:35.060 --> 01:37.180\ncapacités de l'IA, mais plutôt pour\n\n01:37.180 --> 01:39.400\nrappeler que nous en sommes responsables.\n\n01:39.400 --> 01:41.720\nParce que, en fin de compte, ce sont les\n\n01:41.720 --> 01:43.900\ngens qui décident comment les utiliser\n\n01:43.900 --> 01:45.560\npour les choses qui leur tiennent à cœur.\n"}, {"id": "lesson-1/05", "title": "Quiz de récapitulation", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=fr"}, {"id": "lesson-1/06", "title": "Temps de projet", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-1-06.mp4", "vtt": "WEBVTT\n\n00:00.440 --> 00:02.080\nTrès bien, c'est l'heure du projet maintenant.\n\n00:02.920 --> 00:04.520\nAlors, si vous vous souvenez de Plant\n\n00:04.520 --> 00:06.620\nVillage Niru, les agriculteurs\n\n00:06.620 --> 00:08.500\nutilisaient cet outil de classification\n\n00:08.500 --> 00:10.440\npar IA pour prendre des photos de\n\n00:10.440 --> 00:11.980\nfeuilles de plantes afin de voir si\n\n00:11.980 --> 00:13.860\nleurs feuilles étaient malades ou non.\n\n00:13.860 --> 00:15.840\nEt maintenant, c'est à votre tour de\n\n00:15.840 --> 00:18.120\nconcevoir votre propre classificateur d'IA.\n\n00:18.120 --> 00:20.460\nAu cours des trois prochaines leçons,\n\n00:20.460 --> 00:21.940\nvous allez concevoir votre propre\n\n00:21.940 --> 00:23.840\nclassificateur d'IA sur le thème de\n\n00:23.840 --> 00:24.300\nvotre choix.\n\n00:24.790 --> 00:26.550\nCela peut être des feuilles de plantes,\n\n00:26.550 --> 00:28.690\ndes fournitures scolaires, ou tout ce à\n\n00:28.690 --> 00:29.730\nquoi vous pouvez penser.\n\n00:31.410 --> 00:33.530\nVoici quelques exemples réalisés par des\n\n00:33.530 --> 00:35.410\nélèves : certains ont fait le tour du\n\n00:35.410 --> 00:37.470\njardin de leur école pour prendre des\n\n00:37.470 --> 00:39.310\nphotos de feuilles de plantes afin de\n\n00:39.310 --> 00:41.070\ndistinguer les différentes feuilles\n\n00:41.070 --> 00:43.250\nprésentes dans leur jardin scolaire, et\n\n00:43.250 --> 00:45.010\nd'autres ont pris des photos de\n\n00:45.010 --> 00:46.810\ndifférents matériaux comme des verres en\n\n00:46.810 --> 00:48.530\nverre et des gobelets en plastique.\n\n00:49.260 --> 00:50.580\nCertains ont même fait preuve de\n\n00:50.580 --> 00:52.520\ncréativité en travaillant sur la langue\n\n00:52.520 --> 00:54.360\ndes signes, prenant des photos de\n\n00:54.360 --> 00:55.940\ndifférentes positions de la main pour\n\n00:55.940 --> 00:57.700\nvoir à quelles lettres elles correspondaient.\n\n00:58.980 --> 01:00.820\nDonc, après chaque leçon, vous allez\n\n01:00.820 --> 01:03.080\nécrire votre réponse sur votre fiche de travail.\n\n01:03.080 --> 01:05.380\nSi vous n'avez pas la fiche de travail,\n\n01:05.380 --> 01:06.740\nutilisez simplement une feuille de\n\n01:06.740 --> 01:07.920\npapier pour noter vos réponses.\n\n01:08.570 --> 01:09.870\nEt vous pouvez aussi travailler en\n\n01:09.870 --> 01:10.790\ngroupe si besoin.\n\n01:11.910 --> 01:13.850\nVoici donc la fiche de travail, et à la\n\n01:13.850 --> 01:15.650\nfin de tout cela, vous devriez l'avoir\n\n01:15.650 --> 01:17.610\nentièrement remplie après avoir terminé\n\n01:17.610 --> 01:18.090\nles leçons.\n\n01:20.060 --> 01:21.820\nD'accord, donc après toutes les leçons,\n\n01:21.830 --> 01:23.380\nvous devriez avoir complété votre fiche\n\n01:23.380 --> 01:25.520\nde travail et conçu votre classificateur\n\n01:25.520 --> 01:27.560\nd'IA pour le thème que vous avez choisi.\n\n01:27.870 --> 01:29.890\nEt donc, votre enseignant peut organiser\n\n01:29.890 --> 01:32.210\nune journée de présentation facultative\n\n01:32.210 --> 01:34.150\noù vous présenterez votre classificateur\n\n01:34.150 --> 01:36.730\nd'IA et vos réponses sur la fiche de travail.\n\n01:36.730 --> 01:39.850\nD'accord, commençons à répondre à la\n\n01:39.850 --> 01:41.550\npremière question de la fiche de travail.\n\n01:43.780 --> 01:45.300\nVous allez donc commencer par répondre\n\n01:45.300 --> 01:47.120\nuniquement à la leçon numéro un, qui\n\n01:47.120 --> 01:49.380\nconsiste à choisir votre thème de classification.\n\n01:49.380 --> 01:51.240\nChoisissez donc un thème que vous\n\n01:51.240 --> 01:52.400\nsouhaitez explorer pour votre\n\n01:52.400 --> 01:54.560\nclassification par IA et expliquez\n\n01:54.560 --> 01:55.580\npourquoi vous l'avez choisi.\n\n01:56.350 --> 01:58.010\nVoici un exemple de ce qu'un élève a\n\n01:58.010 --> 02:00.370\nécrit : « Je veux classer les fruits\n\n02:00.370 --> 02:02.150\nparce que j'adore les fruits et qu'ils\n\n02:02.150 --> 02:03.330\nsont faciles à trouver.\n\n02:03.330 --> 02:05.390\nBeaucoup de personnes autour de moi\n\n02:05.390 --> 02:07.550\ncultivent des fruits, donc je peux en\n\n02:07.550 --> 02:09.010\napporter différents types pour les\n\n02:09.010 --> 02:10.070\nutiliser dans mon projet. »\n"}, {"id": "lesson-1/07", "title": "Feuille de travail", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=fr"}]}, {"id": "lesson-2", "kicker": "Leçon 2", "title": "Les éléments clés de l'apprentissage automatique", "items": [{"id": "lesson-2/01", "title": "Objectifs", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-2-01.mp4", "vtt": "WEBVTT\n\n00:00.560 --> 00:02.540\nTrès bien, bienvenue à la leçon deux, où\n\n00:02.540 --> 00:04.140\nnous allons parler des éléments clés de\n\n00:04.140 --> 00:05.480\nl'apprentissage automatique.\n\n00:06.670 --> 00:08.510\nL'objectif de la leçon deux est que nous\n\n00:08.510 --> 00:10.150\nsoyons capables d'expliquer ce qu'est\n\n00:10.150 --> 00:11.390\nl'apprentissage automatique.\n\n00:11.780 --> 00:13.640\nNous allons identifier les éléments clés\n\n00:13.640 --> 00:15.340\nde l'apprentissage automatique.\n\n00:15.340 --> 00:17.860\nNous allons décrire pourquoi ou ce que\n\n00:17.860 --> 00:19.240\nfait chaque élément et comment ils\n\n00:19.240 --> 00:20.680\nfonctionnent ensemble, et vous allez\n\n00:20.680 --> 00:22.000\nexpliquer comment les données\n\n00:22.000 --> 00:23.400\ninfluencent l'efficacité de l'IA.\n"}, {"id": "lesson-2/02", "title": "Qu'est-ce que l'apprentissage automatique", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-2-02.mp4", "vtt": "WEBVTT\n\n00:00.880 --> 00:02.540\nD'accord, alors comment prépare-t-on\n\n00:02.540 --> 00:03.620\nexactement un examen ?\n\n00:04.420 --> 00:06.580\nRéfléchissez à cela pendant quelques secondes.\n\n00:07.050 --> 00:09.050\nAlors, quand un humain se prépare à un\n\n00:09.050 --> 00:10.790\nexamen, la première chose qu'il va\n\n00:10.790 --> 00:12.830\nfaire, c'est qu'il va devoir rassembler\n\n00:12.840 --> 00:14.970\ndes informations, et ces informations\n\n00:14.970 --> 00:17.130\npeuvent prendre la forme de notes prises en cours.\n\n00:17.540 --> 00:19.240\nUne fois que vous avez vos notes, vous\n\n00:19.240 --> 00:21.700\nallez les étudier, et ce qui se passe,\n\n00:21.700 --> 00:23.500\nc'est que votre cerveau va relier ces\n\n00:23.500 --> 00:25.100\nnouvelles informations à votre\n\n00:25.100 --> 00:27.700\nexpérience vécue pour mieux comprendre le monde.\n\n00:28.460 --> 00:30.320\nEt donc, ce qui se passe avec le temps,\n\n00:30.320 --> 00:31.740\nc'est que vous allez devenir mieux\n\n00:31.740 --> 00:33.720\npréparé pour passer l'examen à mesure\n\n00:33.720 --> 00:35.100\nque vous reliez de nouvelles\n\n00:35.100 --> 00:37.180\ninformations à vos connaissances précédentes.\n\n00:38.210 --> 00:39.690\nDonc, les quatre étapes de la\n\n00:39.690 --> 00:42.030\npréparation à un examen sont : le\n\n00:42.030 --> 00:43.620\ncerveau, ce cerveau prend\n\n00:43.620 --> 00:45.730\nessentiellement des notes, vous étudiez\n\n00:45.730 --> 00:47.910\nces notes, et en conséquence, vous avez\n\n00:47.910 --> 00:50.670\nun cerveau mieux préparé, prêt à passer l'examen.\n\n00:51.850 --> 00:54.130\nEt donc, c'est le cerveau qui fait l'apprentissage.\n\n00:54.560 --> 00:56.100\nLes notes, c'est essentiellement\n\n00:56.100 --> 00:58.060\nl'information que vous allez étudier.\n\n00:58.470 --> 01:00.210\nL'étude, c'est essentiellement le temps\n\n01:00.210 --> 01:02.290\net le processus de relier ces nouvelles\n\n01:02.290 --> 01:04.290\nidées à ce que vous savez déjà, et le\n\n01:04.290 --> 01:06.210\ncerveau préparé en est le résultat.\n\n01:06.630 --> 01:08.810\nDonc, après avoir étudié ces notes, vous\n\n01:08.810 --> 01:10.610\nêtes essentiellement prêt à passer l'examen.\n\n01:11.840 --> 01:14.060\nAinsi, l'apprentissage humain, et l'idée\n\n01:14.060 --> 01:16.240\nclé de l'apprentissage humain, c'est que\n\n01:16.240 --> 01:18.380\nvous construisez votre compréhension en\n\n01:18.380 --> 01:20.080\nreliant de nouvelles informations à\n\n01:20.080 --> 01:22.340\nvotre expérience vécue afin de donner du\n\n01:22.340 --> 01:23.060\nsens au monde.\n\n01:23.460 --> 01:25.580\nComment l'humain se compare-t-il à\n\n01:25.580 --> 01:27.830\nl'apprentissage automatique ?\n\n01:27.830 --> 01:30.160\nPlus précisément, il utilise des maths\n\n01:30.160 --> 01:32.180\npour trouver des motifs dans les données\n\n01:32.180 --> 01:33.420\net faire des prédictions.\n\n01:33.420 --> 01:36.320\nL'apprentissage automatique repose\n\n01:36.320 --> 01:37.720\nnotamment sur un modèle.\n\n01:38.560 --> 01:40.040\nCe modèle reçoit des données, et\n\n01:40.040 --> 01:42.200\nl'entraînement consiste essentiellement\n\n01:42.200 --> 01:44.200\nà essayer de trouver des motifs dans ces\n\n01:44.200 --> 01:46.080\ndonnées, puis vous obtenez un modèle\n\n01:46.080 --> 01:48.100\nentraîné, comme un classificateur de\n\n01:48.100 --> 01:50.020\nmaladies des plantes, qui peut prédire\n\n01:50.020 --> 01:51.780\nles maladies des plantes ou déterminer\n\n01:51.780 --> 01:53.120\nsi elles sont malades ou non.\n\n01:53.120 --> 01:54.960\nAinsi, les quatre éléments clés de\n\n01:54.960 --> 01:56.960\nl'apprentissage automatique en détail\n\n01:56.960 --> 01:58.620\nsont que le modèle est l'élément qui va\n\n01:58.620 --> 01:59.580\ncapturer le motif.\n\n02:00.160 --> 02:02.140\nLes données sont simplement les\n\n02:02.140 --> 02:04.280\ninformations que nous donnons au modèle\n\n02:04.280 --> 02:06.620\net sur lesquelles il va s'entraîner.\n\n02:06.620 --> 02:08.240\nL'entraînement est essentiellement le\n\n02:08.240 --> 02:10.860\nprocessus par lequel le modèle analyse\n\n02:10.860 --> 02:12.400\nles données pour trouver des motifs.\n\n02:12.960 --> 02:14.620\nEncore une fois, le modèle entraîné\n\n02:14.620 --> 02:16.600\ncorrespond essentiellement au résultat\n\n02:16.600 --> 02:18.720\nobtenu après que le modèle a terminé son\n\n02:18.720 --> 02:20.380\nentraînement, et il est donc prêt à\n\n02:20.380 --> 02:21.280\nfaire des prédictions.\n\n02:23.460 --> 02:25.320\nDonc, même si la machine traite\n\n02:25.320 --> 02:27.160\nl'information différemment, elles\n\n02:27.160 --> 02:28.940\npartagent en réalité des éléments\n\n02:28.940 --> 02:30.220\nsimilaires, n'est-ce pas ?\n\n02:30.220 --> 02:32.400\nDonc, le cerveau correspond au modèle,\n\n02:32.400 --> 02:34.300\nles notes aux données, l'étude à\n\n02:34.300 --> 02:36.260\nl'entraînement, et préparer le cerveau\n\n02:36.260 --> 02:37.540\nau modèle entraîné.\n\n02:37.540 --> 02:39.500\nCe n'est pas exactement la même chose,\n\n02:39.500 --> 02:41.600\nmais ils partagent des étapes similaires\n\n02:41.600 --> 02:43.180\ndans la façon dont ils abordent\n\n02:43.180 --> 02:44.780\nessentiellement leur apprentissage.\n"}, {"id": "lesson-2/04", "title": "Comment utiliser NeuroPocket", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-2-04.mp4", "vtt": "WEBVTT\n\n00:00.720 --> 00:02.460\nD'accord, nous avons parlé des éléments\n\n00:02.460 --> 00:04.260\nclés de l'apprentissage automatique,\n\n00:04.260 --> 00:05.780\ncomme le modèle, les données,\n\n00:05.780 --> 00:07.600\nl'entraînement et le modèle entraîné,\n\n00:07.600 --> 00:09.240\nmais il est vraiment difficile de voir\n\n00:09.240 --> 00:10.720\ncomment toutes ces parties s'assemblent.\n\n00:11.570 --> 00:13.450\nVoyons donc comment ces éléments clés\n\n00:13.450 --> 00:15.170\ns'assemblent en concevant un\n\n00:15.170 --> 00:17.870\nclassificateur d'IA avec Near Pocket.\n\n00:18.190 --> 00:19.330\nMais qu'est-ce que Near Pocket\n\n00:19.330 --> 00:19.930\nexactement ?\n\n00:20.730 --> 00:22.930\nNear Pocket est une application d'IA où\n\n00:22.930 --> 00:24.750\nvous pouvez ajouter des images,\n\n00:24.750 --> 00:26.790\nentraîner un modèle et voir comment l'IA\n\n00:26.790 --> 00:27.590\nreconnaît les choses.\n\n00:28.670 --> 00:30.570\nEt vous avez déjà vu quelques exemples\n\n00:30.570 --> 00:32.430\ndans Near Pocket dans l'exemple étudiant.\n\n00:33.300 --> 00:35.180\nVous avez vu que des étudiants ont pu\n\n00:35.180 --> 00:36.520\ndistinguer différentes feuilles de\n\n00:36.520 --> 00:38.840\nplantes, ils ont pu différencier divers\n\n00:38.840 --> 00:41.740\nmatériaux, et même la langue des signes également.\n\n00:42.600 --> 00:44.320\nNous allons donc apprendre à utiliser\n\n00:44.320 --> 00:46.680\nNear Pocket ensemble en réalisant chaque\n\n00:46.680 --> 00:47.340\nétape ensemble.\n\n00:47.750 --> 00:49.670\nAu fur et à mesure que vous avancez dans\n\n00:49.670 --> 00:51.790\nchaque étape, n'hésitez pas à mettre la\n\n00:51.790 --> 00:54.050\nvidéo en pause afin de pouvoir accomplir\n\n00:54.050 --> 00:56.150\nla tâche ou terminer l'étape avant de\n\n00:56.150 --> 00:57.150\npasser à la suivante.\n\n00:58.150 --> 00:59.550\nEt bien sûr, si vous travaillez en\n\n00:59.550 --> 01:01.270\ngroupe ou en classe, si vous terminez\n\n01:01.270 --> 01:03.310\nplus tôt, aidez simplement les autres\n\n01:03.310 --> 01:04.970\nautour de vous afin que nous puissions\n\n01:04.970 --> 01:06.550\npasser à l'étape suivante plus\n\n01:06.550 --> 01:07.530\nrapidement ensemble.\n\n01:09.670 --> 01:11.330\nTrès bien, donc la première chose que je\n\n01:11.330 --> 01:13.210\nvais faire, c'est ouvrir mon application\n\n01:13.210 --> 01:15.410\nNear Pocket, et je vais nommer le projet\n\n01:15.410 --> 01:16.790\n« Projet Fournitures Scolaires ».\n\n01:17.220 --> 01:18.960\nVous pouvez choisir n'importe quel nom,\n\n01:18.960 --> 01:20.480\nc'est simplement le nom de votre projet.\n\n01:20.480 --> 01:22.540\nEt une fois que vous cliquez sur Créer,\n\n01:22.540 --> 01:24.740\ncela va vous amener à l'intérieur de ce projet.\n\n01:24.740 --> 01:27.160\nJe peux en fait avoir plus de deux groupes.\n\n01:27.520 --> 01:28.880\nDans mon cas, je veux faire une\n\n01:28.880 --> 01:30.500\ndistinction entre les ciseaux et les\n\n01:30.500 --> 01:31.660\nstylos à l'intérieur.\n\n01:32.700 --> 01:34.340\nMaintenant, une fois que j'ai créé au\n\n01:34.340 --> 01:36.180\nmoins mes deux groupes, je vais ajouter\n\n01:36.180 --> 01:37.620\ndes photos pour chacun de ces groupes.\n\n01:38.010 --> 01:39.330\nDonc dans mon cas, comme j'ai des\n\n01:39.330 --> 01:41.130\nciseaux, je vais prendre quelques photos\n\n01:41.130 --> 01:41.610\nde ciseaux.\n\n01:42.500 --> 01:44.580\nDans ce cas, j'en ai pris environ six,\n\n01:44.580 --> 01:45.540\npuis j'ajoute les photos.\n\n01:45.970 --> 01:47.810\nVous pouvez en prendre plus si vous le souhaitez.\n\n01:48.170 --> 01:49.570\nEt maintenant, je vais prendre quelques\n\n01:49.570 --> 01:50.530\nphotos de stylos.\n\n01:51.350 --> 01:53.310\nEt dans mon cas, j'ai aussi pris six\n\n01:53.310 --> 01:54.050\nphotos de stylos.\n\n01:54.450 --> 01:55.630\nEt comme je l'ai dit, vous pourriez en\n\n01:55.630 --> 01:57.010\navoir des centaines si vous le vouliez.\n\n01:57.180 --> 01:58.580\nDans mon cas, je vais juste rapidement.\n\n01:59.220 --> 02:00.820\nEnsuite, vous allez ajouter des photos,\n\n02:00.820 --> 02:02.220\net maintenant vous avez ajouté des\n\n02:02.220 --> 02:02.980\ndonnées à vos groupes.\n\n02:03.610 --> 02:05.030\nMais vous pouvez avoir plus de deux\n\n02:05.030 --> 02:06.690\ngroupes si vous le souhaitez, donc\n\n02:06.690 --> 02:08.110\ntechniquement je pourrais créer un\n\n02:08.110 --> 02:09.630\ngroupe comme les gommes, mais pour\n\n02:09.630 --> 02:11.670\nsimplifier, on va s'en tenir à cela.\n\n02:12.470 --> 02:13.550\nEnsuite, vous allez passer à\n\n02:13.550 --> 02:14.710\nl'entraînement, puis vous allez\n\n02:14.710 --> 02:16.350\nsimplement cliquer sur le bouton\n\n02:16.350 --> 02:17.130\nEntraîner le modèle.\n\n02:17.530 --> 02:18.930\nEt cela va prendre quelques minutes,\n\n02:18.930 --> 02:20.390\ndonc nous allons simplement attendre.\n\n02:28.300 --> 02:30.470\nD'accord, testons maintenant notre modèle.\n\n02:31.240 --> 02:32.840\nDonc, ce que je vais faire en premier,\n\n02:32.840 --> 02:34.840\nc'est simplement prendre une photo de\n\n02:34.850 --> 02:37.080\nmon stylo dans une position différente\n\n02:37.090 --> 02:38.400\net voir s'il le classe correctement.\n\n02:38.790 --> 02:40.310\nEt vous pouvez voir qu'il indique que\n\n02:40.310 --> 02:40.940\nc'est un stylo.\n\n02:40.940 --> 02:43.550\nEt maintenant, je vais tester avec mes\n\n02:43.550 --> 02:45.430\nciseaux dans une autre position, il les\n\n02:45.430 --> 02:47.180\nclasse, et vous pouvez voir qu'il les\n\n02:47.180 --> 02:48.510\nreconnaît bien comme des ciseaux.\n\n02:48.990 --> 02:49.270\nTrès bien.\n\n02:49.510 --> 02:50.830\nVoilà donc votre classificateur d'IA.\n\n02:50.830 --> 02:52.490\nEt vous êtes toujours libre d'ajouter\n\n02:52.490 --> 02:54.790\nplus de données pour améliorer votre classificateur.\n"}, {"id": "lesson-2/03", "title": "Ouvrir NeuroPocket", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "Les outils d'IA peuvent faire des erreurs", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-2-05.mp4", "vtt": "WEBVTT\n\n00:00.840 --> 00:01.840\nD'accord, bienvenue à nouveau.\n\n00:02.320 --> 00:03.860\nAlors, après avoir eu un peu de temps\n\n00:03.860 --> 00:05.720\npour essayer Near Pocket, est-ce que\n\n00:05.720 --> 00:08.420\nvotre classificateur IA a toujours eu\n\n00:08.420 --> 00:08.960\nraison ?\n\n00:08.960 --> 00:10.940\nEt si ce n'est pas le cas, pourquoi\n\n00:10.940 --> 00:12.740\npensez-vous qu'il a fait cette erreur ?\n\n00:12.740 --> 00:14.740\nN'hésitez pas à mettre la vidéo en pause\n\n00:14.740 --> 00:16.160\net à y réfléchir quelques secondes.\n\n00:18.960 --> 00:20.640\nD'accord, donc ce qu'il faut savoir avec\n\n00:20.640 --> 00:22.420\nles outils d'IA, c'est qu'ils peuvent\n\n00:22.420 --> 00:24.160\ndonner des résultats inattendus.\n\n00:24.770 --> 00:26.390\nCe qui va vous sembler évident ne le\n\n00:26.390 --> 00:28.570\nsera pas forcément pour un outil d'IA.\n\n00:29.440 --> 00:31.220\nDonc, ce qu'il faut savoir avec les\n\n00:31.220 --> 00:33.200\noutils d'IA, c'est qu'ils ne comprennent\n\n00:33.200 --> 00:35.120\npas de la même manière que les humains.\n\n00:35.120 --> 00:37.840\nIls doivent analyser chaque détail de la\n\n00:37.840 --> 00:40.100\nphoto pour trouver des motifs, et\n\n00:40.100 --> 00:42.720\nparfois cela signifie qu'ils trouvent ou\n\n00:42.720 --> 00:44.660\nutilisent des motifs auxquels nous\n\n00:44.660 --> 00:45.600\nn'avions pas pensé.\n\n00:46.310 --> 00:48.250\nPar exemple, ici, on voit clairement une\n\n00:48.250 --> 00:50.250\npaire de ciseaux, mais comme elle est\n\n00:50.250 --> 00:52.070\nplacée au même endroit que le crayon de\n\n00:52.070 --> 00:53.790\ncouleur ici, et qu'elle est de la même\n\n00:53.790 --> 00:55.230\ncouleur, elle est classée comme un\n\n00:55.230 --> 00:55.990\ncrayon de couleur.\n\n00:57.740 --> 00:59.840\nEt aussi, ce qu'il faut savoir avec les\n\n00:59.840 --> 01:01.560\nsystèmes d'IA, c'est qu'ils sont\n\n01:01.560 --> 01:03.280\nfortement limités par leurs données.\n\n01:03.280 --> 01:04.880\nIls ne peuvent vraiment prédire qu'à\n\n01:04.880 --> 01:06.640\npartir de ce qu'ils ont déjà analysé.\n\n01:07.230 --> 01:08.730\nVous pouvez voir que notre\n\n01:08.730 --> 01:10.830\nclassificateur de maladies des plantes\n\n01:10.830 --> 01:12.830\néchoue parce qu'il n'a jamais vu ou\n\n01:12.830 --> 01:15.050\nanalysé de l'herbe auparavant, et vous\n\n01:15.050 --> 01:16.950\nvoyez clairement qu'il l'identifie comme\n\n01:16.950 --> 01:19.750\nune pêche saine, ce qui n'est pas le cas.\n\n01:19.750 --> 01:21.310\nEt cela ne s'applique pas seulement aux\n\n01:21.310 --> 01:23.610\nimages, mais aussi aux langues, n'est-ce pas ?\n\n01:24.340 --> 01:26.220\nUn outil d'IA ne peut répondre qu'en\n\n01:26.220 --> 01:27.940\nfonction des langues sur lesquelles il a\n\n01:27.940 --> 01:28.540\nété entraîné.\n\n01:28.950 --> 01:31.250\nDonc, dans ce cas, je parle en hindi,\n\n01:31.250 --> 01:32.930\ncomme par exemple : quel temps fait-il\n\n01:32.930 --> 01:33.390\naujourd'hui ?\n\n01:33.740 --> 01:34.320\nQuel est ton nom ?\n\n01:34.690 --> 01:35.550\nCombien font deux plus deux ?\n\n01:35.890 --> 01:37.530\nEt comme cet outil d'IA n'a jamais\n\n01:37.530 --> 01:39.850\nanalysé de données en hindi auparavant,\n\n01:39.850 --> 01:41.930\nil va simplement continuer à répéter la\n\n01:41.930 --> 01:43.970\nmême phrase en anglais, qu'il connaît :\n\n01:43.970 --> 01:45.490\n« Je vais bien, et toi ?\n\n01:45.490 --> 01:46.650\n» de façon répétitive.\n\n01:47.030 --> 01:48.890\nCela illustre vraiment ce concept selon\n\n01:48.890 --> 01:50.450\nlequel ce qui entre, sort.\n\n01:50.820 --> 01:52.800\nDonc, en apprentissage automatique, si\n\n01:52.800 --> 01:54.900\nles données sont limitées, cela signifie\n\n01:54.900 --> 01:56.900\nque la prédiction du modèle sera\n\n01:56.900 --> 01:57.800\négalement limitée.\n"}, {"id": "lesson-2/06", "title": "Quiz de récapitulation", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=fr"}, {"id": "lesson-2/07", "title": "Temps de projet", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-2-07.mp4", "vtt": "WEBVTT\n\n00:00.520 --> 00:01.920\nTrès bien, c'est l'heure du projet pour\n\n00:01.920 --> 00:02.880\nla leçon numéro deux.\n\n00:04.040 --> 00:05.500\nVous avez eu un peu de temps pour vous\n\n00:05.500 --> 00:07.080\nentraîner de votre côté, mais\n\n00:07.080 --> 00:08.540\nmaintenant, c'est à vous d'explorer\n\n00:08.540 --> 00:10.280\nvotre environnement et de collecter des\n\n00:10.280 --> 00:11.760\ndonnées sur le thème que vous avez\n\n00:11.760 --> 00:13.340\nchoisi lors de la première leçon.\n\n00:13.940 --> 00:15.620\nEt souvenez-vous, votre thème peut\n\n00:15.620 --> 00:17.620\ntoujours changer au fur et à mesure que\n\n00:17.620 --> 00:19.480\nvous avancez dans la fiche d'exercices.\n\n00:19.480 --> 00:21.320\nAussi, maintenant, vous devez vous\n\n00:21.320 --> 00:23.040\nassurer de répondre à la question de la\n\n00:23.040 --> 00:25.720\nleçon deux sur votre fiche d'exercices.\n\n00:25.720 --> 00:27.580\nDonc, la leçon numéro deux porte sur la\n\n00:27.580 --> 00:28.180\ncollecte de données.\n\n00:28.610 --> 00:30.250\nVous allez donc nous dire quels objets\n\n00:30.250 --> 00:31.970\nvous allez classer et comment vous allez\n\n00:31.970 --> 00:32.970\nrecueillir vos données.\n\n00:33.780 --> 00:35.480\nVoici un exemple de réponse d'un élève.\n\n00:36.270 --> 00:37.610\n« Les objets que je vais classer sont\n\n00:37.610 --> 00:39.850\nles bananes, les oranges et les avocats.\n\n00:39.850 --> 00:42.070\nJ'apporterai des fruits de chez moi ou\n\n00:42.070 --> 00:43.470\nj'irai dans le jardin de l'école pour\n\n00:43.470 --> 00:44.290\nprendre des photos.\n\n00:44.290 --> 00:46.030\n» D'accord ?\n\n00:46.030 --> 00:47.650\nDonc, vous allez répondre à la leçon\n\n00:47.650 --> 00:49.290\nnuméro deux, et aussi, si votre\n\n00:49.290 --> 00:51.050\nenseignant le permet, vous pouvez\n\n00:51.050 --> 00:52.370\négalement vous promener dans votre\n\n00:52.370 --> 00:53.930\nenvironnement pour prendre plus de\n\n00:53.930 --> 00:56.290\nphotos à ajouter à votre...\n\n00:56.290 --> 00:59.590\nou pour améliorer votre classificateur d'IA.\n"}, {"id": "lesson-2/08", "title": "Feuille de travail", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=fr"}]}, {"id": "lesson-3", "kicker": "Leçon 3", "title": "Comment les machines s'entraînent", "items": [{"id": "lesson-3/01", "title": "Objectifs", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-01.mp4", "vtt": "WEBVTT\n\n00:00.780 --> 00:02.560\nTrès bien, bienvenue à la leçon numéro\n\n00:02.560 --> 00:03.820\ntrois : Comment les machines\n\n00:03.820 --> 00:04.560\ns'entraînent-elles ?\n\n00:05.820 --> 00:07.380\nSi vous vous souvenez, dans la dernière\n\n00:07.380 --> 00:09.360\nleçon, nous avons parlé des éléments\n\n00:09.360 --> 00:11.380\nclés de l'apprentissage automatique, où\n\n00:11.380 --> 00:13.300\nvous avez votre modèle, et dans ce\n\n00:13.300 --> 00:15.510\nmodèle, vous lui fournissez des données,\n\n00:15.510 --> 00:17.630\npuis vous passez enfin par un processus\n\n00:17.630 --> 00:20.130\nd'entraînement où le modèle utilise ce\n\n00:20.130 --> 00:22.000\ntemps pour analyser toutes les données\n\n00:22.000 --> 00:23.640\nque vous lui avez données afin de\n\n00:23.650 --> 00:24.440\ntrouver des motifs.\n\n00:25.860 --> 00:27.440\nMais comment fonctionne réellement le\n\n00:27.440 --> 00:28.840\nprocessus d'entraînement en\n\n00:28.840 --> 00:30.230\napprentissage automatique ?\n\n00:30.990 --> 00:32.470\nC'est donc ce que nous allons comprendre\n\n00:32.470 --> 00:33.350\ndans la leçon trois.\n\n00:34.200 --> 00:36.460\nL'objectif est donc d'expliquer ce\n\n00:36.460 --> 00:38.460\nqu'est un algorithme et de donner des\n\n00:38.460 --> 00:39.380\nexemples concrets.\n\n00:40.110 --> 00:41.390\nVous allez expliquer pourquoi les\n\n00:41.390 --> 00:43.490\nmachines ont besoin d'algorithmes pour fonctionner.\n\n00:44.330 --> 00:46.050\nVous allez décrire les étapes qu'une\n\n00:46.050 --> 00:47.670\nmachine suit pendant l'entraînement.\n\n00:48.030 --> 00:49.870\nEt enfin, vous allez comparer la façon\n\n00:49.870 --> 00:51.970\ndont les humains et les machines\n\n00:51.970 --> 00:53.630\ntraitent l'information différemment.\n"}, {"id": "lesson-3/02", "title": "Jeu Describer Drawer — Instructions", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-02.mp4", "vtt": "WEBVTT\n\n00:00.480 --> 00:02.440\nD'accord, pour commencer, jouons au jeu\n\n00:02.440 --> 00:03.520\ndu décriveur-dessinateur.\n\n00:04.490 --> 00:06.670\nCe jeu nécessite deux joueurs ou plus,\n\n00:06.670 --> 00:08.430\nmais ne t'inquiète pas si tu es seul et\n\n00:08.430 --> 00:10.310\nque tu fais cette activité par toi-même.\n\n00:11.040 --> 00:12.860\nNous avons une démonstration vidéo de\n\n00:12.860 --> 00:14.460\nnous en train de jouer, pour que tu\n\n00:14.460 --> 00:15.680\npuisses voir comment ça fonctionne.\n\n00:16.430 --> 00:18.190\nDonc, lorsque tu trouveras quelqu'un\n\n00:18.190 --> 00:19.750\navec qui jouer, tu seras prêt.\n\n00:19.750 --> 00:20.870\nD'accord ?\n\n00:21.480 --> 00:23.200\nMais en attendant, parcourons quand même\n\n00:23.200 --> 00:23.860\nles instructions.\n\n00:24.940 --> 00:26.700\nVoici comment le jeu fonctionne : vous\n\n00:26.700 --> 00:27.880\nallez travailler en binômes.\n\n00:28.250 --> 00:30.370\nDonc, encore une fois, il faut au moins\n\n00:30.370 --> 00:30.970\ndeux personnes.\n\n00:30.970 --> 00:33.650\nUne personne sera le décrivant, et\n\n00:33.650 --> 00:35.310\nl'autre sera le dessinateur.\n\n00:36.220 --> 00:37.600\nSi vous avez un enseignant, cet\n\n00:37.600 --> 00:39.560\nenseignant va faire un dessin simple\n\n00:39.560 --> 00:41.500\navec trois à cinq formes basiques,\n\n00:41.500 --> 00:42.500\nplacées n'importe où.\n\n00:43.230 --> 00:45.150\nLe dessin peut donc être aussi simple\n\n00:45.150 --> 00:47.430\nque ceci, ou même aussi complexe que cela.\n\n00:48.740 --> 00:50.700\nEuh, s'il n'y a pas d'enseignant, c'est\n\n00:50.700 --> 00:52.220\nle décrivant qui fera le dessin.\n\n00:53.710 --> 00:55.550\nUne fois le dessin prêt, seul le\n\n00:55.550 --> 00:57.710\ndécrivant peut regarder le dessin.\n\n00:58.680 --> 01:00.540\nLe décrivant va alors expliquer au\n\n01:00.540 --> 01:03.240\ndessinateur comment reproduire ce dessin\n\n01:03.240 --> 01:04.340\nuniquement à l'oral.\n\n01:04.690 --> 01:07.050\nIls ne peuvent parler que de la façon de\n\n01:07.050 --> 01:07.950\nreproduire ce dessin.\n\n01:08.720 --> 01:10.280\nVos mains doivent être derrière votre dos.\n\n01:10.680 --> 01:12.760\nIl est strictement interdit de montrer du doigt.\n\n01:13.840 --> 01:15.580\nEt donc, pendant ce temps, pendant que\n\n01:15.590 --> 01:17.520\nle dessinateur essaie de reproduire le\n\n01:17.520 --> 01:19.540\ndessin, euh, après deux minutes, le\n\n01:19.540 --> 01:22.000\ndessinateur va comparer son dessin avec\n\n01:22.000 --> 01:24.000\nle dessin original ou celui de\n\n01:24.000 --> 01:25.980\nl'enseignant pour voir à quel point il\n\n01:25.980 --> 01:26.740\ns'en est approché.\n\n01:27.100 --> 01:28.620\nEt donc, une fois que tout cela est\n\n01:28.620 --> 01:29.920\nterminé, cela fait un tour.\n\n01:30.360 --> 01:32.480\nVous allez échanger les rôles et recommencer.\n\n01:32.880 --> 01:34.100\nLe décrivant devient alors le\n\n01:34.100 --> 01:36.180\ndessinateur, et le dessinateur devient\n\n01:36.180 --> 01:36.740\nle décrivant.\n\n01:37.990 --> 01:39.790\nD'accord, alors commençons à jouer à ce\n\n01:39.790 --> 01:40.220\njeu, d'accord ?\n\n01:40.610 --> 01:42.390\nEssayons donc de faire au moins deux\n\n01:42.390 --> 01:44.410\ntours, et je vous retrouve pour le prochain.\n"}, {"id": "lesson-3/03", "title": "Jeu Describer Drawer — Démonstration", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-03.mp4", "vtt": "WEBVTT\n\n00:02.240 --> 00:02.680\nD'accord.\n\n00:02.800 --> 00:06.620\nOn va faire une activité appelée le jeu\ndu descripteur et du dessinateur, et\n\n00:06.620 --> 00:07.530\nc'est très simple.\n\n00:08.230 --> 00:11.910\nMoi, le professeur, je vais faire un\ndessin très simple qui contiendra juste\n\n00:11.910 --> 00:13.190\ntrois formes géométriques.\n\n00:13.770 --> 00:17.640\nÇa peut être un carré, ça peut être un\ncercle, un triangle, un losange,\n\n00:17.640 --> 00:19.030\nn'importe quoi, d'accord?\n\n00:19.410 --> 00:22.500\nMais ce sont trois formes simples que\nvous pouvez placer comme vous le\n\n00:22.500 --> 00:22.940\nsouhaitez.\n\n00:23.610 --> 00:27.610\nEt donc ce que je vais faire ici, c'est\ndessiner quelque chose d'aussi simple que ça.\n\n00:32.730 --> 00:35.470\nC'est donc un exemple simple de ce que\nje vais dessiner.\n\n00:35.880 --> 00:39.570\nEt ce qui va se passer, c'est qu'en tant\nque prof, après avoir fait mes dessins,\n\n00:39.570 --> 00:41.760\nmes élèves vont travailler en binômes,\nd'accord?\n\n00:42.090 --> 00:46.560\nEt donc, euh, quand les élèves\ntravaillent en binômes, il y aura deux rôles.\n\n00:46.730 --> 00:49.550\nIl y aura le descripteur et il y aura le\ndessinateur.\n\n00:50.140 --> 00:53.030\nAlors, qui ici sera le descripteur pour\ncette partie?\n\n00:53.220 --> 00:54.770\nJe serai le descripteur.\n\n00:54.880 --> 00:56.900\nD'accord, et Karen sera la dessinatrice.\n\n00:57.300 --> 01:01.550\nL'idée, c'est que le descripteur est le\nseul autorisé à venir voir le dessin\n\n01:01.550 --> 01:06.030\ncaché et à retourner voir le dessinateur\npour lui dire comment le reproduire. Et\n\n01:06.030 --> 01:10.460\nl'astuce, c'est que le descripteur peut\nvenir autant de fois qu'il le souhaite.\n\n01:10.780 --> 01:14.380\nCependant, il ne peut donner que des\ninstructions verbales et doit se tenir\n\n01:14.380 --> 01:16.900\nderrière le dessinateur pour ne pas\nqu'ils se voient.\n\n01:17.510 --> 01:22.050\nTrès bien. Faisons une démonstration\npour voir comment ce jeu fonctionne.\n\n01:22.050 --> 01:23.500\nAlors, vous êtes prêts?\n\n01:24.010 --> 01:24.240\nOui.\n\n01:24.420 --> 01:25.590\nAttention, c'est parti.\n\n01:26.030 --> 01:27.140\nTu peux y aller, Mason.\n\n01:27.360 --> 01:30.090\nRegarde le dessin et donne les\ninstructions à Karen.\n\n01:31.330 --> 01:32.580\nC'est à toi, Mason.\n\n01:36.730 --> 01:37.210\nD'accord.\n\n01:39.930 --> 01:42.800\nAlors, la première chose, c'est de\ndessiner un carré.\n\n01:43.250 --> 01:43.710\nD'accord.\n\n01:49.410 --> 01:53.020\nAu milieu du carré, dessine\ntranquillement un cercle bien rond.\n\n01:55.960 --> 01:59.150\nEst-ce qu'il va toucher les bords du\ncarré ou être au centre?\n\n01:59.470 --> 02:00.870\nEuh, il sera au centre.\n\n02:00.950 --> 02:02.610\nIl ne touchera aucun des bords.\n\n02:02.730 --> 02:03.430\nÇa marche.\n\n02:04.590 --> 02:08.680\nD'accord. Alors, juste pour être bien\nclair, et en bas du carré, à l'extérieur,\n\n02:08.680 --> 02:12.420\nil y aura, comme tu peux l'imaginer, un\ntriangle qui pointe vers le bas.\n\n02:13.550 --> 02:14.130\nD'accord.\n\n02:15.610 --> 02:17.610\nEn utilisant la ligne du bas comme côté?\n\n02:18.380 --> 02:23.470\nC'est ça. Tu utilises les bords droit et\ngauche, et la pointe du triangle sera\n\n02:23.470 --> 02:24.860\nexactement au milieu.\n\n02:25.110 --> 02:25.530\nD'accord.\n\n02:25.570 --> 02:27.190\nBonnes instructions, Mason.\n\n02:28.290 --> 02:28.940\nTrès bien.\n\n02:28.950 --> 02:29.350\nOuais.\n\n02:29.450 --> 02:33.180\nBeau travail, tout le monde. Et comme\nvous pouvez le voir, ils ont réussi à\n\n02:33.180 --> 02:34.230\nreproduire ce dessin.\n\n02:34.730 --> 02:35.920\nEt voici le truc, d'accord?\n\n02:36.390 --> 02:39.310\nL'idée du jeu, c'est que ce n'était que\nle premier niveau.\n\n02:39.640 --> 02:44.340\nEn tant que prof, on peut corser le jeu\nen faisant des formes comme ça, vous voyez?\n\n02:44.590 --> 02:48.320\nOn peut placer les formes ainsi, faire\nun carré plus petit et mettre un\n\n02:48.320 --> 02:49.870\ntriangle au milieu, d'accord?\n\n02:50.590 --> 02:54.420\nL'idée clé, c'est de mettre les élèves\nau défi de donner des instructions\n\n02:54.420 --> 02:58.150\nclaires aux dessinateurs pour qu'ils\ncomprennent bien ce qu'ils doivent\n\n02:58.150 --> 02:58.730\nreproduire.\n\n02:59.520 --> 02:59.870\nTrès bien.\n\n03:00.850 --> 03:01.550\nMerci à vous.\n\n03:01.550 --> 03:02.110\nMerci.\n\n03:02.470 --> 03:04.100\nEt on se voit à la prochaine partie.\n"}, {"id": "lesson-3/04", "title": "Qu'est-ce qu'un algorithme", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-04.mp4", "vtt": "WEBVTT\n\n00:00.520 --> 00:01.520\nD'accord, bienvenue à nouveau.\n\n00:01.820 --> 00:03.460\nDonc, si vous avez eu l'occasion de\n\n00:03.460 --> 00:05.520\njouer au jeu « décrire ou dessiner »\n\n00:05.520 --> 00:07.500\navec quelqu'un, ou si vous avez pu\n\n00:07.500 --> 00:09.820\nregarder la démonstration en vidéo,\n\n00:09.820 --> 00:11.860\nnotre question pour vous est la suivante\n\n00:11.860 --> 00:13.360\n: quelles stratégies avez-vous\n\n00:13.360 --> 00:15.940\nutilisées, vous et votre partenaire, ou\n\n00:15.940 --> 00:17.940\navez-vous observées pour faciliter la\n\n00:17.940 --> 00:18.960\nreproduction du dessin ?\n\n00:18.960 --> 00:21.180\nAlors, mettez simplement la vidéo en\n\n00:21.180 --> 00:23.640\npause et réfléchissez-y pendant quelques secondes.\n\n00:26.440 --> 00:28.020\nTrès bien, maintenant que vous avez eu\n\n00:28.020 --> 00:29.840\nle temps d'y réfléchir, vous avez\n\n00:29.840 --> 00:31.520\npeut-être remarqué qu'ils utilisaient ce\n\n00:31.520 --> 00:33.440\nqu'on appelle la pensée étape par étape.\n\n00:34.420 --> 00:36.860\nDonc, la pensée étape par étape :\n\n00:36.860 --> 00:38.640\nlorsque vous jouiez au jeu avec votre\n\n00:38.640 --> 00:40.500\npartenaire, vous deviez donner des\n\n00:40.500 --> 00:42.460\ninstructions très claires, étape par\n\n00:42.460 --> 00:44.120\nétape, pour que la personne qui\n\n00:44.120 --> 00:45.960\ndessinait comprenne comment reproduire\n\n00:45.960 --> 00:47.000\nle dessin de l'enseignant.\n\n00:47.700 --> 00:49.860\nPar exemple, la personne a peut-être dit\n\n00:49.860 --> 00:52.160\nquelque chose comme : « D'abord, dessine\n\n00:52.160 --> 00:52.640\nun cercle.\n\n00:52.640 --> 00:55.200\nPuis, à l'intérieur de ce cercle,\n\n00:55.200 --> 00:56.920\ndessine un petit triangle. »\n\n00:57.190 --> 00:58.350\nMais vous pouvez constater que nous\n\n00:58.350 --> 00:59.670\navons donné des instructions très\n\n00:59.670 --> 01:01.050\nclaires, étape par étape.\n\n01:02.000 --> 01:03.720\nDonc, ce que vous venez de créer ou de\n\n01:03.720 --> 01:05.440\nvoir, c'était un algorithme.\n\n01:06.400 --> 01:08.400\nUn algorithme, c'est simplement toute\n\n01:08.400 --> 01:11.060\ninstruction claire, étape par étape,\n\n01:11.060 --> 01:12.200\npour accomplir une tâche.\n\n01:13.280 --> 01:14.660\nEt ce qu'il faut savoir à propos des\n\n01:14.660 --> 01:16.220\nalgorithmes, c'est qu'ils peuvent\n\n01:16.220 --> 01:18.920\ns'appliquer à n'importe quoi dans la vie.\n\n01:18.920 --> 01:20.320\nIl n'est pas nécessaire que ce soit\n\n01:20.320 --> 01:22.480\ntechnique, tant que l'algorithme est un\n\n01:22.480 --> 01:24.460\nensemble d'instructions étape par étape\n\n01:24.460 --> 01:25.580\npour accomplir une tâche.\n\n01:26.530 --> 01:29.190\nPar exemple, si je regarde ceci, les\n\n01:29.190 --> 01:31.270\nétapes pour préparer une tasse de thé :\n\n01:31.270 --> 01:33.390\nvous savez, la première étape, faire\n\n01:33.390 --> 01:34.030\nbouillir de l'eau.\n\n01:34.030 --> 01:36.330\nDeuxième étape, je dois ajouter un\n\n01:36.330 --> 01:37.030\nsachet de thé.\n\n01:37.610 --> 01:39.550\nTroisième étape, j'ai dû ajouter du\n\n01:39.550 --> 01:40.470\nsucre et du lait.\n\n01:40.470 --> 01:42.150\nEt enfin, quatrième étape, j'ai dû\n\n01:42.150 --> 01:43.630\nremuer et servir, n'est-ce pas ?\n\n01:43.910 --> 01:46.230\nC'est donc un exemple d'algorithme, car\n\n01:46.230 --> 01:48.470\nj'ai pu le décomposer étape par étape\n\n01:48.470 --> 01:50.590\npour accomplir la tâche de préparer une\n\n01:50.590 --> 01:51.130\ntasse de thé.\n\n01:52.530 --> 01:54.390\nNous utilisons donc des algorithmes tous\n\n01:54.390 --> 01:56.450\nles jours dans notre vie, chaque fois\n\n01:56.450 --> 01:58.710\nque nous faisons quelque chose étape par étape.\n\n01:58.710 --> 02:01.190\nCela peut être cuisiner, s'habiller,\n\n02:01.190 --> 02:03.090\nrésoudre un problème de mathématiques,\n\n02:03.090 --> 02:05.110\nou dans notre cas, simplement jouer à ce\n\n02:05.110 --> 02:05.690\njeu aussi.\n\n02:07.780 --> 02:09.340\nDonc, ma question pour vous est la\n\n02:09.340 --> 02:11.300\nsuivante : quelle est une chose à\n\n02:11.300 --> 02:12.760\nlaquelle vous pouvez penser que vous\n\n02:12.760 --> 02:14.820\nfaites chaque jour et qui peut avoir des\n\n02:14.820 --> 02:17.260\ninstructions claires étape par étape ou\n\n02:17.260 --> 02:18.780\ndes étapes bien définies ?\n\n02:18.780 --> 02:21.040\nAlors, mettez simplement la vidéo en\n\n02:21.040 --> 02:22.740\npause et réfléchissez-y un instant.\n\n02:26.340 --> 02:28.620\nD'accord, maintenant que vous avez eu le\n\n02:28.620 --> 02:30.760\ntemps d'y réfléchir, ce que nous voulons\n\n02:30.760 --> 02:33.340\nvraiment que vous compreniez, dans toute\n\n02:33.340 --> 02:35.320\ncette idée d'algorithmes, c'est que les\n\n02:35.320 --> 02:37.170\nmachines ont besoin d'algorithmes.\n\n02:37.560 --> 02:38.780\nEncore une fois, les machines ne\n\n02:38.780 --> 02:40.180\ncomprennent pas de la même manière que\n\n02:40.180 --> 02:41.660\nles humains, et c'est l'une des\n\n02:41.660 --> 02:43.180\nprincipales raisons pour lesquelles nous\n\n02:43.180 --> 02:45.040\ndevons donner des instructions claires,\n\n02:45.040 --> 02:45.820\nétape par étape.\n\n02:46.620 --> 02:48.840\nDonc, lorsque vous jouez à ce jeu ou que\n\n02:48.840 --> 02:51.180\nvous le regardez, le décrivant est comme\n\n02:51.180 --> 02:53.400\nl'humain qui donne les instructions, et\n\n02:53.400 --> 02:55.320\nle dessinateur est comme la machine qui\n\n02:55.320 --> 02:55.740\nles suit.\n"}, {"id": "lesson-3/05", "title": "L'algorithme d'apprentissage humain", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-05.mp4", "vtt": "WEBVTT\n\n00:00.940 --> 00:02.620\nD'accord, maintenant que vous comprenez\n\n00:02.620 --> 00:04.920\ncomment fonctionne un algorithme, voyons\n\n00:04.920 --> 00:06.740\ncomment nous pouvons créer un algorithme\n\n00:06.740 --> 00:07.320\npour apprendre.\n\n00:08.250 --> 00:10.230\nPour mieux comprendre cela, nous allons\n\n00:10.230 --> 00:12.550\njouer à un petit jeu qui s'appelle : À\n\n00:12.550 --> 00:15.430\nquel groupe cela appartient-il ?\n\n00:15.430 --> 00:17.450\nVoici ce qui va se passer : je vais vous\n\n00:17.450 --> 00:19.330\nmontrer une image, et vous allez\n\n00:19.330 --> 00:21.210\nsimplement me dire si elle appartient au\n\n00:21.210 --> 00:22.650\ngroupe A ou au groupe B.\n\n00:22.650 --> 00:25.130\nMais, le piège, c'est que je ne vais pas\n\n00:25.130 --> 00:26.090\nvous dire le motif.\n\n00:26.680 --> 00:28.240\nJe ne vais pas vous dire les règles.\n\n00:28.650 --> 00:30.650\nVotre tâche, c'est essentiellement de le\n\n00:30.650 --> 00:31.810\ndécouvrir par vous-même.\n\n00:32.210 --> 00:32.540\nD'accord ?\n\n00:33.210 --> 00:34.810\nAlors, commençons par la première image.\n\n00:36.530 --> 00:38.030\nD'accord, est-ce que cela va dans le\n\n00:38.030 --> 00:39.610\ngroupe A ou dans le groupe B ?\n\n00:40.750 --> 00:42.050\nFaites juste une supposition.\n\n00:42.050 --> 00:44.970\nCeci va dans le groupe B.\n\n00:44.970 --> 00:47.030\nEst-ce que cela va dans le groupe A ou\n\n00:47.030 --> 00:47.830\ndans le groupe B ?\n\n00:49.380 --> 00:50.620\nCelui-ci va dans le groupe A.\n\n00:50.620 --> 00:52.460\nEst-ce que celui-ci va dans le groupe A\n\n00:52.460 --> 00:53.260\nou dans le groupe B ?\n\n00:55.080 --> 00:56.320\nCelui-ci va dans le groupe B.\n\n00:56.320 --> 00:58.120\nEst-ce qu'il va dans le groupe A ou dans\n\n00:58.120 --> 00:58.780\nle groupe B ?\n\n01:00.500 --> 01:01.820\nCelui-ci va dans le groupe A.\n\n01:01.820 --> 01:02.780\nCelui-ci...\n\n01:02.780 --> 01:05.040\nEst-ce qu'il va dans le groupe A ou dans\n\n01:05.040 --> 01:05.660\nle groupe B ?\n\n01:07.240 --> 01:08.620\nCelui-ci va dans le groupe A.\n\n01:08.620 --> 01:10.880\nEst-ce que celui-ci va dans le groupe A\n\n01:10.880 --> 01:11.630\nou dans le groupe B ?\n\n01:14.100 --> 01:15.520\nCelui-ci va dans le groupe B.\n\n01:15.520 --> 01:17.520\nMaintenant, en voici un difficile.\n\n01:18.070 --> 01:20.110\nEst-ce que celui-ci va dans le groupe A\n\n01:20.110 --> 01:22.720\nou dans le groupe B ?\n\n01:22.720 --> 01:23.850\nCelui-ci va dans le groupe A.\n\n01:23.850 --> 01:25.290\nEt je suis sûr que vous l'avez\n\n01:25.290 --> 01:26.840\nprobablement déjà compris, mais est-ce\n\n01:26.840 --> 01:28.590\nque cela va dans le groupe A ou dans le\n\n01:28.590 --> 01:29.040\ngroupe B ?\n\n01:30.820 --> 01:32.140\nCelui-ci va dans le groupe A.\n\n01:32.140 --> 01:34.340\nEt enfin, est-ce que celui-ci va dans le\n\n01:34.340 --> 01:35.920\ngroupe A ou dans le groupe B ?\n\n01:37.390 --> 01:38.690\nCelui-ci va dans le groupe B.\n\n01:38.690 --> 01:40.710\nD'accord, alors quel était le motif ?\n\n01:40.710 --> 01:44.190\nEh bien, vous l'avez probablement déjà\n\n01:44.190 --> 01:46.210\ndécouvert : s'il y avait du noir à\n\n01:46.210 --> 01:48.150\nl'extrémité gauche, cela allait dans le\n\n01:48.150 --> 01:50.090\ngroupe A, et s'il y avait du noir à\n\n01:50.090 --> 01:52.030\nl'extrémité droite, cela allait dans le\n\n01:52.030 --> 01:52.470\ngroupe B.\n\n01:52.470 --> 01:54.730\nEt donc, ce que je trouve vraiment\n\n01:54.730 --> 01:56.810\nintéressant, c'est : comment peut-on\n\n01:56.810 --> 01:58.910\ns'améliorer pour décider si cela va dans\n\n01:58.910 --> 02:01.370\nle groupe A ou le groupe B alors que je\n\n02:01.370 --> 02:03.610\nne vous ai donné aucune règle, ou que je\n\n02:03.610 --> 02:05.670\nne vous ai pas expliqué de règles ou de\n\n02:05.670 --> 02:06.190\nmotifs ?\n\n02:06.590 --> 02:08.310\nN'hésitez donc pas à mettre la vidéo en\n\n02:08.310 --> 02:09.970\npause et à réfléchir à cela pendant\n\n02:09.970 --> 02:10.710\nquelques secondes.\n\n02:14.620 --> 02:15.940\nD'accord, donc l'algorithme\n\n02:15.940 --> 02:18.560\nd'apprentissage humain peut ressembler à ceci.\n\n02:19.510 --> 02:21.490\nEn gros, vous faites une supposition,\n\n02:21.490 --> 02:23.950\npuis vous vérifiez essentiellement votre\n\n02:23.950 --> 02:26.970\nréponse pour voir à quel point vous êtes\n\n02:26.970 --> 02:29.250\néloigné de la réponse réelle, ensuite\n\n02:29.250 --> 02:30.850\nvous ajustez votre attention sur\n\n02:30.850 --> 02:32.530\nd'autres caractéristiques, et vous\n\n02:32.530 --> 02:34.270\ncontinuez simplement à répéter ce\n\n02:34.270 --> 02:36.570\nprocessus jusqu'à ce que vous arriviez à\n\n02:36.570 --> 02:38.270\nun point où vous pouvez distinguer\n\n02:38.270 --> 02:40.330\ndifférents groupes sans qu'on ait besoin\n\n02:40.330 --> 02:41.330\nde vous donner des règles.\n\n02:42.650 --> 02:43.890\nEt donc, ce que je veux souligner à\n\n02:43.890 --> 02:45.670\npropos des humains, ce qui rend cela\n\n02:45.670 --> 02:47.350\nvraiment intéressant, c'est que nous\n\n02:47.350 --> 02:49.110\ncherchons ce qui nous semble important.\n\n02:50.010 --> 02:51.330\nEn tant qu'humains, nous sommes\n\n02:51.330 --> 02:52.770\nnaturellement très curieux.\n\n02:53.390 --> 02:55.250\nNous avons ces sentiments et ce fort\n\n02:55.250 --> 02:57.700\ndésir de trouver du sens en reliant des idées.\n\n02:58.480 --> 03:00.480\nPar exemple, si je vois juste un carré\n\n03:00.480 --> 03:02.880\nnoir sorti de nulle part, je me dis : «\n\n03:02.880 --> 03:04.640\nD'accord, eh bien, ce carré noir me\n\n03:04.640 --> 03:06.420\nsaute vraiment aux yeux », et je me\n\n03:06.420 --> 03:08.280\ndemande pourquoi il est à cet endroit.\n\n03:08.780 --> 03:10.740\nVous savez, au final,
