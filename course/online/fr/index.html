je suis juste\n\n03:10.740 --> 03:12.860\ntellement curieux de savoir comment tout\n\n03:12.860 --> 03:15.280\ncela se relie et ce que tout cela signifie.\n\n03:15.280 --> 03:16.520\nEt donc, quand l'algorithme\n\n03:16.520 --> 03:18.780\nd'apprentissage humain est en action, ce\n\n03:18.780 --> 03:20.860\nqui se passe, c'est que, tout d'abord,\n\n03:20.860 --> 03:22.740\nil faut faire une supposition éclairée,\n\n03:22.740 --> 03:23.240\nn'est-ce pas ?\n\n03:23.240 --> 03:25.280\nParce que vous ne savez pas ce qui va se passer.\n\n03:25.280 --> 03:27.180\nVous ne connaissez pas les caractéristiques.\n\n03:27.850 --> 03:30.470\nQuand on me demande : « Groupe A ou B ?\n\n03:30.470 --> 03:32.670\n», je réponds : « Disons le groupe A,\n\n03:32.670 --> 03:33.490\npuisqu'on débute.\n\n03:33.490 --> 03:35.550\n» C'est là que ça devient intéressant.\n\n03:36.010 --> 03:37.630\nDonc, à l'étape numéro deux, c'est là\n\n03:37.630 --> 03:39.770\nque vous commencez à vérifier votre réponse.\n\n03:39.770 --> 03:41.710\nDonc, à l'étape numéro deux, lorsque\n\n03:41.710 --> 03:43.430\nvous faites une supposition et que vous\n\n03:43.430 --> 03:45.210\nvoyez le résultat, cela va vous faire\n\n03:45.210 --> 03:46.290\nressentir quelque chose.\n\n03:46.880 --> 03:48.560\nPar exemple, chaque fois que j'ai dit\n\n03:48.560 --> 03:50.460\nque c'était en fait le groupe B, vous\n\n03:50.460 --> 03:52.060\npouvez voir que je suis un peu choqué.\n\n03:52.600 --> 03:54.380\nJe me dis : « Hein, vraiment ?\n\n03:54.380 --> 03:57.080\nPeut-être que cela a un rapport avec le\n\n03:57.080 --> 03:58.320\nfait d'être du côté droit. »\n\n03:59.350 --> 04:00.650\nEt donc, ce qu'il y a avec la\n\n04:00.650 --> 04:02.750\nvérification des réponses, c'est que\n\n04:02.750 --> 04:04.830\ncela va vous donner une émotion, que ce\n\n04:04.830 --> 04:07.710\nsoit la surprise, la curiosité ou l'intérêt.\n\n04:07.940 --> 04:09.640\nPeu importe ce que c'est, au final, vous\n\n04:09.640 --> 04:11.480\nallez vous demander ce que tout cela\n\n04:11.480 --> 04:13.740\nsignifie et comment tout cela s'articule.\n\n04:14.950 --> 04:16.650\nEt puis, l'étape numéro trois, c'est\n\n04:16.650 --> 04:18.910\nlorsque vous commencez à ajuster votre attention.\n\n04:19.040 --> 04:21.320\nDonc, la façon dont vous vous êtes senti\n\n04:21.320 --> 04:23.500\naprès votre dernière supposition va\n\n04:23.500 --> 04:25.600\ninfluencer ce sur quoi vous allez vous\n\n04:25.600 --> 04:26.960\nconcentrer pour la prochaine.\n\n04:26.960 --> 04:29.600\nVous pouvez voir ici que lorsque je pose\n\n04:29.600 --> 04:31.700\nla même question, « Est-ce que cela va\n\n04:31.700 --> 04:34.390\ndans le groupe A ou le groupe B ?\n\n04:34.390 --> 04:36.340\n» Je me dis : « Hein, d'accord, bon,\n\n04:36.340 --> 04:37.720\nc'est maintenant du côté gauche, donc\n\n04:37.720 --> 04:39.480\npeut-être que cela a un rapport avec le\n\n04:39.480 --> 04:40.030\ngroupe A. »\n\n04:40.930 --> 04:42.770\nEt quand je dis que c'est correct, vous\n\n04:42.770 --> 04:44.950\npouvez voir que je deviens immédiatement\n\n04:44.950 --> 04:46.010\ntrès enthousiaste.\n\n04:46.010 --> 04:48.110\nJe me dis : « Oh, je crois que je\n\n04:48.110 --> 04:49.830\ncommence à comprendre », n'est-ce pas ?\n\n04:49.830 --> 04:52.310\nEt donc, à force de répéter ce\n\n04:52.310 --> 04:54.510\nprocessus, avec le temps, vous allez\n\n04:54.510 --> 04:55.730\napprendre quelles sont les\n\n04:55.730 --> 04:57.670\ncaractéristiques qui comptent le plus\n\n04:57.670 --> 04:58.770\npour distinguer les groupes.\n\n04:59.800 --> 05:01.540\nD'accord, il se trouve qu'on peut en\n\n05:01.540 --> 05:03.140\nfait simuler ces algorithmes\n\n05:03.140 --> 05:05.480\nd'apprentissage dans des machines également.\n"}, {"id": "lesson-3/06", "title": "L'algorithme d'apprentissage automatique", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-06.mp4", "vtt": "WEBVTT\n\n00:01.020 --> 00:04.280\nD'accord, donc la dernière fois, nous\navons parlé de la façon dont nous\n\n00:04.280 --> 00:07.310\npouvons simuler ces algorithmes\nd'apprentissage dans des machines.\n\n00:07.950 --> 00:11.820\nEt donc, avant de comprendre cela, ce\nque nous devons comprendre, c'est ce\n\n00:11.820 --> 00:13.830\nqu'est exactement une caractéristique.\n\n00:14.470 --> 00:17.460\nLes caractéristiques sont donc\nsimplement des éléments d'information\n\n00:17.460 --> 00:19.250\nqui nous aident à distinguer les choses.\n\n00:19.400 --> 00:21.460\nPrenons, par exemple, ces deux choses\nici.\n\n00:22.090 --> 00:25.320\nEh bien, la première chose que je\nremarque, c'est qu'elles sont\n\n00:25.320 --> 00:29.440\ndifférentes en termes de forme. L'un est\nun carré, l'autre est un cercle, et ils\n\n00:29.440 --> 00:31.630\nsont aussi différents en termes de\ncouleur.\n\n00:32.170 --> 00:36.880\nCelui-ci est en fait un carré jaune, et\ncelui qui est à droite est un cercle bleu.\n\n00:37.720 --> 00:41.630\nCe sont donc essentiellement des\ncaractéristiques ou des informations qui\n\n00:41.630 --> 00:45.530\nm'aident à distinguer ces deux choses.\nEt donc, la façon dont les humains\n\n00:45.530 --> 00:49.720\nperçoivent les caractéristiques, c'est\nque, chaque fois que nous regardons une\n\n00:49.720 --> 00:52.760\nimage, nous la décomposons\nessentiellement en différentes\n\n00:52.760 --> 00:56.610\ncaractéristiques, puis nous nous\nconcentrons naturellement sur celle qui\n\n00:56.610 --> 00:59.000\nnous semble la plus importante, n'est-ce\npas?\n\n00:59.750 --> 01:03.990\nDonc, si nous examinons toutes ces\ndifférentes caractéristiques de cette\n\n01:03.990 --> 01:08.580\nimage, ce que nous constatons, c'est que,\nparce que ce carré noir est isolé et\n\n01:08.580 --> 01:13.290\nqu'il ressort, il semble tout simplement\nêtre le plus important parmi toutes ces\n\n01:13.290 --> 01:15.320\nautres caractéristiques également.\n\n01:15.740 --> 01:19.850\nCependant, la particularité des machines,\nc'est qu'elles ne devinent pas avec des\n\n01:19.850 --> 01:22.880\nsentiments, elles font en réalité des\nprédictions calculées.\n\n01:23.670 --> 01:26.760\nDonc, les machines ne considèrent pas\nces caractéristiques comme des\n\n01:26.760 --> 01:29.620\nsentiments, elles les traitent comme des\nnombres, n'est-ce pas?\n\n01:29.860 --> 01:33.940\nElles ne voient ni ne ressentent\nréellement quoi que ce soit. Donc, par\n\n01:33.940 --> 01:38.240\nexemple, pour pouvoir traiter cela,\nelles transforment le blanc en un et le\n\n01:38.240 --> 01:39.000\nnoir en zéro.\n\n01:40.770 --> 01:44.550\nAinsi, une bonne façon de vraiment voir\nla différence entre les humains et les\n\n01:44.550 --> 01:48.130\nmachines, et la manière dont nous\ntraitons les caractéristiques, c'est que\n\n01:48.130 --> 01:51.800\npour un humain, vous savez, chaque fois\nque nous voyons quelque chose qui se\n\n01:51.800 --> 01:55.630\ndémarque, comme un carré noir, on va se\ndire: « Eh bien, ça semble important »,\n\n01:55.630 --> 01:57.980\ndonc on va essentiellement faire une\nsupposition.\n\n01:59.120 --> 02:02.700\nMaintenant, ce qu'il faut savoir avec\nles machines, c'est que chaque fois\n\n02:02.700 --> 02:05.190\nqu'elles ...\neuh — vous pouvez voir ici qu'elles ne\n\n02:05.190 --> 02:08.630\nvoient pas réellement, elles\ntransforment simplement cela en chiffres,\n\n02:08.630 --> 02:12.510\npuis elles multiplient ces chiffres par\nune sorte d'importance, donc lesquelles\n\n02:12.510 --> 02:16.390\nde ces choses sont les plus importantes\npour déterminer le résultat, et ensuite\n\n02:16.390 --> 02:18.880\nelles font essentiellement une\nprédiction calculée.\n\n02:19.320 --> 02:23.320\nNe vous inquiétez pas pour les calculs,\nd'accord? Ce qui est important pour moi\n\n02:23.320 --> 02:27.270\nque vous compreniez, c'est qu'il y a, il\ny a, euh, tout simplement beaucoup de\n\n02:27.270 --> 02:30.400\nmathématiques impliquées dans le\nprocessus. Donc, l'algorithme\n\n02:30.400 --> 02:34.040\nd'entraînement en apprentissage\nautomatique, euh, vous pouvez voir qu'il\n\n02:34.040 --> 02:37.630\ncomporte à peu près le même nombre\nd'étapes: vous faites une prédiction\n\n02:37.630 --> 02:41.320\ncalculée, puis vous mesurez l'erreur,\nensuite vous ajustez votre équation\n\n02:41.320 --> 02:44.810\nmathématique, et vous répétez ce\nprocessus en continu. Donc, ce qu'il\n\n02:44.810 --> 02:48.240\nfaut savoir avec l'apprentissage\nautomatique, c'est qu'ils calculent\n\n02:48.240 --> 02:50.450\nessentiellement la prédiction, n'est-ce\npas?\n\n02:51.860 --> 02:56.880\nPlutôt que d'observer la caractéristique,\nils la multiplient par leur importance\n\n02:56.880 --> 03:01.400\nrespective pour le résultat final.\nEst-ce surtout la caractéristique un?\n\n03:01.800 --> 03:05.450\nEst-ce principalement la caractéristique\ndeux? Et ainsi de suite, n'est-ce pas?\n\n03:05.450 --> 03:08.830\nIl essaie de déterminer cela pour voir\ncomment il arrive à cette réponse.\n\n03:09.850 --> 03:14.040\nVoyons donc l'algorithme d'apprentissage\nautomatique en action. Donc, première\n\n03:14.040 --> 03:16.930\nétape, vous calculez essentiellement\nvotre prédiction.\n\n03:17.720 --> 03:22.070\nIls commencent donc par calculer les\ncaractéristiques sous forme de nombres,\n\n03:22.070 --> 03:25.900\npuis ils les additionnent avec des\nvaleurs d'importance aléatoires.\n\n03:26.230 --> 03:30.170\nParce que rappelez-vous, au début, vous\nsavez, très similaire aux humains, nous\n\n03:30.170 --> 03:33.750\ndevions faire une supposition au hasard.\nDonc, ces machines aussi, elles\n\n03:33.750 --> 03:36.830\nattribuent simplement au hasard\nl'importance de chacune de ces\n\n03:36.830 --> 03:37.690\ncaractéristiques.\n\n03:38.420 --> 03:41.480\nEt donc, elles arrivent à une sorte de\nprédiction calculée.\n\n03:42.150 --> 03:46.060\nDonc ensuite, après avoir fait cette\nprédiction, il faut mesurer l ’ erreur.\n\n03:46.580 --> 03:50.940\nCe que fait le modèle, c ’ est qu ’ il\ncompare essentiellement à quel point la\n\n03:50.940 --> 03:54.920\nprédiction calculée s ’ éloigne de la\nréponse correcte réelle, et cette\n\n03:54.920 --> 03:57.580\ndistance, c ’ est ce qu ’ on appelle l ’\nerreur.\n\n03:58.160 --> 04:01.770\nEt donc, cette erreur va être très\nimportante pour nous parce que ce que\n\n04:01.770 --> 04:05.790\nnous faisons, c ’ est que nous utilisons\ncette er- erreur, et nous l ’ utilisons\n\n04:05.790 --> 04:09.750\npour nous aider à ajuster l ’ importance\nde chaque caractéristique différemment\n\n04:09.750 --> 04:13.710\ndans notre équation, dans le but d ’\nobtenir moins d ’ erreur la prochaine fois.\n\n04:14.250 --> 04:18.350\nDonc, en gros, ce que nous faisons, c ’\nest que nous prenons cette erreur et\n\n04:18.350 --> 04:22.720\nensuite, en fait, nous la mettons à jour\ndifféremment pour chaque caractéristique\n\n04:22.720 --> 04:26.710\nafin de voir laquelle est, euh, euh, la\nplus importante pour déterminer le\n\n04:26.710 --> 04:30.810\nrésultat. Et ensuite, en gros, nous\narrivons à une sorte d ’ équation mise à\n\n04:30.810 --> 04:33.760\njour que nous allons réactualiser de\nmanière itérative.\n\n04:34.700 --> 04:38.710\nEt donc, après suffisamment de\nrépétitions, on obtient essentiellement\n\n04:38.710 --> 04:41.680\nun modèle entraîné capable de faire des\nprédictions.\n\n04:42.340 --> 04:46.110\nEt donc, vous pouvez voir ici que nous\navons une belle équation mathématique\n\n04:46.110 --> 04:50.030\nfinement ajustée qui peut prendre des\ndécisions assez précises, n ’ est-ce pas?\n\n04:50.030 --> 04:53.600\nVous pouvez voir qu ’ il est indiqué\nquatre-vingt-sept pour cent pour le\n\n04:53.600 --> 04:56.060\ngroupe B.\nDonc, l ’ idée principale, et ce n ’ est\n\n04:56.060 --> 04:59.980\npas grave si vous ne comprenez pas les\nmathématiques derrière tout ça, la seule\n\n04:59.980 --> 05:04.010\nchose que je veux que vous reteniez, c ’\nest qu ’ un modèle entraîné est basé sur\n\n05:04.010 --> 05:07.770\ndes équations mathématiques. Donc, les\nmodèles d ’ IA entraînés transforment\n\n05:07.770 --> 05:09.740\nessentiellement les données en nombres.\n\n05:09.830 --> 05:13.820\nIls effectuent beaucoup de calculs\ndessus, puis ils produisent également un\n\n05:13.820 --> 05:17.440\nnombre qui est ensuite converti en\nquelque chose qu ’ un humain peut\n\n05:17.440 --> 05:18.690\ncomprendre, d ’ accord?\n\n05:19.300 --> 05:23.470\nEt c ’ est pour cela que chaque détail\nde notre image ou de nos données compte\n\n05:23.470 --> 05:27.810\nvraiment, parce que chaque détail compte\ndans un modèle d ’ IA, car chaque nombre\n\n05:27.810 --> 05:30.030\ncompte dans une équation, n ’ est-ce pas?\n\n05:30.330 --> 05:34.080\nL ’ IA ne traite pas l ’ information de\nla même manière que nous, donc ses\n\n05:34.080 --> 05:37.670\nprédictions peuvent ne pas correspondre\nà nos attentes, n ’ est-ce pas?\n\n05:37.750 --> 05:41.560\nVous pouvez voir ici que chacun de ces\néléments peut représenter un nombre que\n\n05:41.560 --> 05:43.590\nnous allons calculer dans cette équation.\n\n05:43.710 --> 05:47.630\nEt donc, cette idée s ’ applique en fait\nà n ’ importe quel type de modèle d ’ IA,\n\n05:47.630 --> 05:48.350\nn ’ est-ce pas?\n\n05:48.510 --> 05:52.270\nDonc même, par exemple, les modèles de\nlangage ou les outils d ’ IA\n\n05:52.270 --> 05:56.130\nconversationnelle, ils prennent\nessentiellement vos mots, il faut les\n\n05:56.130 --> 06:00.170\ntransformer en nombres, faire des\ncalculs dessus, puis les retransformer\n\n06:00.170 --> 06:03.410\nen mots pour que vous puissiez\ncomprendre, n ’ est-ce pas?\n\n06:04.150 --> 06:08.520\nDonc, en gros, il s ’ agit surtout de\nfaire beaucoup de mathématiques, d ’\n\n06:08.520 --> 06:12.240\néquations et de calculs au final pour\narriver à une prédiction.\n\n06:14.130 --> 06:18.020\nDonc, ce que je veux vraiment que vous\nreteniez, c ’ est que l ’ IA, ce n ’ est\n\n06:18.020 --> 06:18.820\npas de la magie.\n\n06:18.970 --> 06:22.090\nC ’ est essentiellement des\nmathématiques guidées par des choix\n\n06:22.090 --> 06:22.490\nhumains.\n\n06:22.540 --> 06:26.630\nEt je ne dis pas cela pour le dénigrer,\nmais je veux vraiment que ce soit très\n\n06:26.630 --> 06:30.180\nclair: il s ’ agit simplement de\nmathématiques guidées par des choix\n\n06:30.180 --> 06:30.610\nhumains.\n\n06:31.380 --> 06:35.000\nDonc, par exemple, chaque fois que l ’\non parle de l ’ adaptabilité de l ’ IA,\n\n06:35.000 --> 06:35.700\nn ’ est-ce pas?\n\n06:35.790 --> 06:39.270\nL ’ IA s ’ adapte essentiellement en\nutilisant des algorithmes d ’\n\n06:39.270 --> 06:43.270\napprentissage écrits par des humains et\nqui tournent sur des machines. Comme\n\n06:43.270 --> 06:46.740\nnous l ’ avons mentionné et vu, cela\nnécessite beaucoup de calculs\n\n06:46.740 --> 06:49.470\nmathématiques, ce qui consomme beaucoup\nd ’ énergie.\n\n06:49.970 --> 06:54.180\nDonc, NearPod utilise en fait l ’\nénergie ou effectue les calculs\n\n06:54.180 --> 06:57.210\ndirectement sur votre appareil, n ’\nest-ce pas?\n\n06:57.290 --> 07:01.000\nAinsi, une grande partie des calculs\ncomplexes va consommer beaucoup d ’\n\n07:01.000 --> 07:05.180\nénergie, ce qui va réchauffer votre\nappareil et décharger la batterie, comme ceci.\n\n07:06.360 --> 07:10.080\nEn réalité, le coût environnemental de l\n’ IA, c ’ est que, même si NearPod\n\n07:10.080 --> 07:13.500\nfonctionne directement sur votre\nappareil, la plupart des IA tournent\n\n07:13.500 --> 07:17.460\ndans d ’ immenses bâtiments remplis de\nmilliers d ’ ordinateurs, n ’ est-ce pas?\n\n07:17.480 --> 07:21.410\nCes bâtiments consomment autant d ’\nélectricité que de petites villes et des\n\n07:21.410 --> 07:25.340\nmilliards de litres d ’ eau rien que\npour se refroidir afin de réaliser tous\n\n07:25.340 --> 07:27.690\nces différents types de calculs\nmathématiques.\n\n07:27.810 --> 07:31.450\nCela peut donc représenter un coût\nénorme pour notre environnement.\n\n07:32.420 --> 07:34.880\nL ’ autre aspect, c ’ est maintenant l ’\nautonomie de l ’ IA.\n\n07:35.020 --> 07:38.750\nEh bien, l ’ autonomie de l ’ IA, c ’\nest que, vous savez, l ’ IA fait des\n\n07:38.750 --> 07:42.820\nprédictions en trouvant ses propres\nschémas dans d ’ énormes quantités de données.\n\n07:43.420 --> 07:46.990\nEt donc, en tant qu ’ êtres humains,\nnous fournissons essentiellement des\n\n07:46.990 --> 07:50.560\nexemples ou des retours pour vraiment\naider à guider ses prédictions, n ’\n\n07:50.560 --> 07:54.070\nest-ce pas? Par exemple, c ’ est vous\nqui avez collecté les données pour\n\n07:54.070 --> 07:55.850\nentraîner votre application NearPod.\n\n07:55.920 --> 08:00.530\nEt donc, en réalité, dans l ’ ensemble,\nil y a beaucoup d ’ humains qui sont en\n\n08:00.530 --> 08:01.770\nfait derrière ces IA.\n\n08:02.110 --> 08:05.810\nVous savez, avec NearPod, c ’ était\njuste vous ou peut-être quelques autres\n\n08:05.810 --> 08:07.500\namis qui collectaient les données.\n\n08:07.870 --> 08:12.320\nMais la plupart des IA nécessitent des\nmillions de personnes pour nettoyer les\n\n08:12.320 --> 08:14.460\ndonnées et guider ces modèles d ’ IA.\n\n08:14.480 --> 08:18.030\nEt donc, sans ces choix humains, la\nmachine ne saurait tout simplement pas\n\n08:18.030 --> 08:19.630\ncomment trouver les bons schémas.\n\n08:19.740 --> 08:24.020\nDonc, au final, ce qu ’ il faut vraiment\ncomprendre sur le fonctionnement de l ’\n\n08:24.020 --> 08:27.990\nIA, c ’ est que les outils d ’ IA sont\nen réalité simplement le produit de\n\n08:27.990 --> 08:28.750\nchoix humains.\n"}, {"id": "lesson-3/07", "title": "Quiz de récapitulation", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=fr"}, {"id": "lesson-3/08", "title": "Temps de projet", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-3-08.mp4", "vtt": "WEBVTT\n\n00:00.460 --> 00:02.020\nD'accord, leçon numéro trois, c'est\n\n00:02.020 --> 00:02.740\nl'heure du projet.\n\n00:03.380 --> 00:05.080\nIl est donc temps pour vous de commencer\n\n00:05.080 --> 00:06.740\nà réfléchir à vos caractéristiques.\n\n00:06.740 --> 00:08.760\nAlors, en vous basant sur les données de\n\n00:08.760 --> 00:10.300\nla leçon deux, je veux que vous\n\n00:10.300 --> 00:12.580\nréfléchissiez un peu plus en profondeur.\n\n00:12.580 --> 00:14.300\nPensez aux caractéristiques clés que\n\n00:14.300 --> 00:16.520\nvous avez utilisées pour distinguer vos groupes.\n\n00:17.150 --> 00:18.470\nÉtait-ce peut-être la couleur ?\n\n00:18.990 --> 00:19.870\nÉtait-ce la taille ?\n\n00:20.340 --> 00:21.060\nÉtait-ce la forme ?\n\n00:21.420 --> 00:22.680\nQuelles autres caractéristiques\n\n00:22.680 --> 00:24.720\naviez-vous en tête pour différencier vos\n\n00:24.720 --> 00:26.040\ngroupes ?\n\n00:26.040 --> 00:27.840\nD'accord, donc vous allez répondre à\n\n00:27.840 --> 00:29.620\ncette question de la leçon trois sur\n\n00:29.620 --> 00:31.560\nvotre fiche, et si vous terminez en\n\n00:31.560 --> 00:34.020\navance, continuez simplement à améliorer\n\n00:34.020 --> 00:35.420\nvotre classificateur d'IA.\n\n00:35.790 --> 00:37.410\nSi votre enseignant le permet, sortez\n\n00:37.410 --> 00:39.070\npour collecter plus de données afin de\n\n00:39.070 --> 00:40.810\npouvoir continuer à travailler sur votre\n\n00:40.810 --> 00:41.730\nclassificateur d'IA.\n\n00:42.060 --> 00:43.780\nDonc, collectez plus de données si nécessaire.\n\n00:44.620 --> 00:46.080\nVoici un exemple de réponse pour la\n\n00:46.080 --> 00:48.460\nleçon trois, qui consiste à identifier\n\n00:48.460 --> 00:49.980\nles caractéristiques : quelles\n\n00:49.980 --> 00:51.940\ncaractéristiques votre classificateur\n\n00:51.940 --> 00:53.940\nutilisera-t-il pour catégoriser les données ?\n\n00:54.700 --> 00:56.780\nDans cet exemple, l'élève a dit ceci : «\n\n00:56.780 --> 00:58.920\nJ'utiliserai la couleur, la forme et la taille.\n\n00:58.920 --> 01:01.040\nPar exemple, les bananes sont longues et\n\n01:01.040 --> 01:02.940\njaunes, les oranges sont rondes et\n\n01:02.940 --> 01:05.500\norange, et les avocats sont ovales et verts.\n\n01:05.500 --> 01:07.360\nCes caractéristiques permettent de les\n\n01:07.360 --> 01:08.410\ndistinguer facilement. »\n"}, {"id": "lesson-3/09", "title": "Feuille de travail", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=fr"}]}, {"id": "lesson-4", "kicker": "Leçon 4", "title": "Les machines peuvent-elles être responsables", "items": [{"id": "lesson-4/01", "title": "Objectifs", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-01.mp4", "vtt": "WEBVTT\n\n00:00.360 --> 00:02.040\nD'accord, leçon numéro quatre : Les\n\n00:02.040 --> 00:03.840\nmachines peuvent-elles être responsables ?\n\n00:04.790 --> 00:06.610\nDonc, ce que nous allons apprendre dans\n\n00:06.610 --> 00:08.850\nl'objectif de la leçon quatre, c'est que\n\n00:08.850 --> 00:10.670\nnous allons expliquer comment les biais\n\n00:10.670 --> 00:12.070\ndans les données conduisent à des\n\n00:12.070 --> 00:13.850\nprédictions inexactes, expliquer\n\n00:13.850 --> 00:15.290\npourquoi les humains sont responsables\n\n00:15.290 --> 00:17.290\nde l'IA et comment réduire les préjudices.\n\n00:17.650 --> 00:19.390\nNous allons expliquer des moyens simples\n\n00:19.390 --> 00:21.530\nde protéger la vie privée des personnes,\n\n00:21.530 --> 00:23.210\net nous allons reconnaître comment les\n\n00:23.210 --> 00:24.610\nbiais, la vie privée et la\n\n00:24.610 --> 00:27.410\nresponsabilité sont liés à une IA responsable.\n"}, {"id": "lesson-4/02", "title": "Le défi Bearly a Dog", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-02.mp4", "vtt": "WEBVTT\n\n00:00.180 --> 00:02.420\nNous allons faire un défi appelé le défi\n\n00:02.420 --> 00:04.520\n« à peine un chien », et votre objectif\n\n00:04.520 --> 00:05.980\nest de construire un modèle qui\n\n00:05.980 --> 00:07.660\ndistingue les ours des chiens et qui\n\n00:07.660 --> 00:09.120\nréussit tous les cas de test.\n\n00:09.840 --> 00:11.640\nVotre contrainte est que vous avez 3\n\n00:11.640 --> 00:13.660\nminutes, vous pouvez choisir jusqu'à 10\n\n00:13.660 --> 00:15.080\nours et jusqu'à 10 chiens.\n\n00:15.920 --> 00:17.600\nPour trouver ce défi, retournez dans\n\n00:17.600 --> 00:19.060\nl'application Neural Pocket.\n\n00:19.440 --> 00:20.800\nVous allez voir quelque chose appelé le\n\n00:20.800 --> 00:22.200\ndéfi « essayer le biais ».\n\n00:22.200 --> 00:24.920\nCliquez dessus, cliquez sur « démarrer\n\n00:24.920 --> 00:26.800\nle défi », et vous verrez immédiatement\n\n00:26.800 --> 00:28.580\nque vous pouvez sélectionner jusqu'à dix\n\n00:28.580 --> 00:29.920\nours et jusqu'à dix chiens.\n\n00:30.570 --> 00:32.050\nEt comme vous l'avez fait avec Neural\n\n00:32.050 --> 00:33.770\nPocket, après avoir collecté vos\n\n00:33.770 --> 00:35.490\ndonnées, vous allez à l'entraînement,\n\n00:35.490 --> 00:37.350\npuis vous allez sur votre modèle où vous\n\n00:37.350 --> 00:39.470\nallez exécuter tous les cas de test et\n\n00:39.470 --> 00:40.910\nvoir si vous réussissez tout.\n\n00:42.050 --> 00:44.090\nD'accord, alors commençons ce défi, et\n\n00:44.090 --> 00:45.250\nje vous retrouve à la fin.\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "Qu'est-ce que le biais", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-03.mp4", "vtt": "WEBVTT\n\n00:01.220 --> 00:02.240\nTrès bien, bienvenue à nouveau.\n\n00:02.920 --> 00:04.620\nAlors, après avoir joué au défi « à\n\n00:04.620 --> 00:06.420\npeine un chien », voici une question pour vous.\n\n00:07.270 --> 00:08.990\nQuels ont été vos résultats, et pourquoi\n\n00:08.990 --> 00:10.340\npensez-vous qu'ils se sont produits ?\n\n00:11.430 --> 00:13.210\nAvez-vous réussi tous les cas de test ?\n\n00:13.670 --> 00:15.250\nEn avez-vous réussi certains ?\n\n00:15.250 --> 00:17.010\nLes avez-vous tous échoués ?\n\n00:17.010 --> 00:19.050\nMettez simplement la vidéo en pause et\n\n00:19.050 --> 00:20.450\nréfléchissez-y quelques secondes.\n\n00:22.760 --> 00:24.560\nTrès bien, donc si vous avez réussi tous\n\n00:24.560 --> 00:26.880\nles cas de test, cela pourrait être dû à\n\n00:26.880 --> 00:27.600\nun biais humain.\n\n00:28.020 --> 00:29.640\nMaintenant, ce qu'il faut savoir à\n\n00:29.640 --> 00:31.340\npropos des humains, c'est que nous\n\n00:31.340 --> 00:33.540\nvoyons tous le monde différemment parce\n\n00:33.540 --> 00:35.320\nque, eh bien, nous avons tous des\n\n00:35.320 --> 00:37.480\nexpériences de vie différentes, et nous\n\n00:37.480 --> 00:39.520\nappelons cette perspective limitée du\n\n00:39.520 --> 00:40.420\nmonde un biais.\n\n00:40.420 --> 00:42.080\nDonc, cette image illustre bien cela.\n\n00:42.230 --> 00:44.290\nVous voyez, il y a ces trois personnes,\n\n00:44.290 --> 00:46.550\net celle de gauche tient, par exemple,\n\n00:46.550 --> 00:48.270\nla trompe de l’éléphant et pense que\n\n00:48.270 --> 00:49.010\nc’est un serpent.\n\n00:49.870 --> 00:51.850\nEuh, la personne au milieu pense que\n\n00:51.850 --> 00:53.630\nc’est un mur, et celle qui tient la\n\n00:53.630 --> 00:55.150\nqueue pense essentiellement que c’est\n\n00:55.150 --> 00:55.710\nune corde.\n\n00:56.470 --> 00:58.270\nDonc, ils ont tous des expériences\n\n00:58.270 --> 01:00.830\ndifférentes à partir du même éléphant,\n\n01:00.830 --> 01:02.530\net c’est la raison pour laquelle ils ont\n\n01:02.530 --> 01:03.970\ncette perspective limitée.\n\n01:05.760 --> 01:07.300\nEt donc, ce qui se passe, c’est que\n\n01:07.300 --> 01:09.140\nnotre biais, ou notre perspective\n\n01:09.140 --> 01:11.320\nlimitée, peut vraiment influencer les\n\n01:11.320 --> 01:12.960\ncaractéristiques que nous choisissons\n\n01:12.960 --> 01:13.560\ndans nos données.\n\n01:14.410 --> 01:16.950\nPrenons, par exemple, le défi « barely a dog ».\n\n01:17.600 --> 01:19.580\nDonc, peut-être que quelqu’un n’a choisi\n\n01:19.580 --> 01:21.520\nque des ours noirs et des chiens blancs\n\n01:21.520 --> 01:23.040\nparce que c’est ce qu’il connaît le mieux.\n\n01:23.830 --> 01:25.590\nMais en réalité, les ours peuvent aussi\n\n01:25.590 --> 01:27.430\nêtre blancs, et les chiens peuvent aussi\n\n01:27.430 --> 01:28.050\nêtre noirs.\n\n01:29.100 --> 01:30.620\nEt ce à quoi ces données biaisées\n\n01:30.620 --> 01:32.320\npeuvent mener, c’est ce qu’on appelle le\n\n01:32.320 --> 01:33.540\nbiais algorithmique.\n\n01:34.440 --> 01:35.900\nDonc, chaque fois que des données\n\n01:35.900 --> 01:37.940\nbiaisées montrent à l’IA une vision\n\n01:37.940 --> 01:39.520\nlimitée au lieu de l’ensemble du\n\n01:39.520 --> 01:41.460\ntableau, eh bien, cela conduit\n\n01:41.460 --> 01:43.620\nessentiellement à des résultats inexacts.\n\n01:43.620 --> 01:45.820\nPar exemple, vous pouvez voir ici que,\n\n01:45.820 --> 01:47.680\nsouvenez-vous, dans notre ensemble de\n\n01:47.680 --> 01:49.620\ndonnées, nous avons fait en sorte que\n\n01:49.620 --> 01:51.620\ntous les ours soient noirs et tous les\n\n01:51.620 --> 01:52.260\nchiens soient blancs.\n\n01:52.990 --> 01:55.070\nDonc, chaque fois qu’il voyait un animal\n\n01:55.070 --> 01:56.770\nblanc, il l’associait à un chien.\n\n01:57.320 --> 01:59.120\nEt chaque fois qu’il voyait un animal\n\n01:59.120 --> 02:01.250\nnoir, il l’associait à un ours, n’est-ce pas ?\n\n02:01.890 --> 02:03.550\nDonc, en gros, notre biais ne montrait\n\n02:03.550 --> 02:06.470\nqu’une vision limitée par rapport à la réalité.\n\n02:08.780 --> 02:10.460\nDonc oui, notre ours a été mal classé\n\n02:10.460 --> 02:10.980\ncomme un chien.\n\n02:12.610 --> 02:13.950\nMaintenant, ce que je veux vraiment\n\n02:13.950 --> 02:16.330\npréciser, c’est que, vous savez, être\n\n02:16.330 --> 02:18.050\nbiaisé est quelque chose de parfaitement\n\n02:18.050 --> 02:18.850\nhumain, n’est-ce pas ?\n\n02:19.240 --> 02:21.240\nCela ne devient préoccupant que lorsque\n\n02:21.240 --> 02:23.260\nvous appliquez ce biais aux autres sans\n\n02:23.260 --> 02:25.360\ntenir compte de leur propre expérience\n\n02:25.360 --> 02:26.140\net de leurs valeurs.\n\n02:26.450 --> 02:28.610\nEt donc, en gros, nos données biaisées\n\n02:28.610 --> 02:30.410\npourraient potentiellement amener notre\n\n02:30.410 --> 02:32.870\nIA à exclure précisément les personnes\n\n02:32.870 --> 02:33.870\nque nous essayons d’aider.\n\n02:34.270 --> 02:35.630\nQuelques exemples de cela pourraient\n\n02:35.630 --> 02:37.110\nêtre, par exemple, des résultats\n\n02:37.110 --> 02:38.670\nmédicaux inexacts, n’est-ce pas ?\n\n02:39.390 --> 02:40.690\nParfois, l’IA peut analyser des\n\n02:40.690 --> 02:42.550\nradiographies et, vous savez, si elle\n\n02:42.550 --> 02:43.970\nn’a pas pu analyser suffisamment de\n\n02:43.970 --> 02:45.730\npatients pendant l’entraînement, elle\n\n02:45.730 --> 02:47.650\npeut en fait commettre des erreurs.\n\n02:47.650 --> 02:49.450\nVous pouvez donc voir qu’elle a donné\n\n02:49.450 --> 02:51.350\nune décision diagnostique incorrecte.\n\n02:51.350 --> 02:53.450\nEt le problème avec les médecins, c’est\n\n02:53.450 --> 02:55.190\nque s’ils font trop confiance aux\n\n02:55.190 --> 02:57.430\nrésultats, n’est-ce pas, et qu’ils ne\n\n02:57.430 --> 03:00.150\nvérifient pas une seconde fois, eh bien,\n\n03:00.150 --> 03:01.990\nquelqu’un peut en fait recevoir un\n\n03:01.990 --> 03:03.870\nmauvais diagnostic, et cela pourrait\n\n03:03.870 --> 03:04.770\nêtre vraiment grave.\n\n03:05.750 --> 03:07.690\nL’autre chose, c’est qu’il y a en fait\n\n03:07.690 --> 03:09.830\neu des cas où des arrestations ont eu\n\n03:09.830 --> 03:10.510\nlieu, n’est-ce pas ?\n\n03:10.940 --> 03:13.240\nParfois, un système d’IA a mal identifié\n\n03:13.240 --> 03:14.660\ndes personnes parce qu’il manquait\n\n03:14.660 --> 03:15.800\nessentiellement de données\n\n03:15.800 --> 03:17.680\nd’entraînement complètes sur différents\n\n03:17.680 --> 03:19.640\ntypes de visages et d’origines ethniques.\n\n03:20.360 --> 03:22.200\nEt cela a en fait conduit à ce que des\n\n03:22.200 --> 03:24.020\npersonnes comme Robert Williams soient\n\n03:24.020 --> 03:25.420\négalement arrêtées à tort.\n\n03:25.760 --> 03:27.360\nEt cela ne s’applique pas seulement aux\n\n03:27.360 --> 03:29.660\nimages, mais aussi au langage, n’est-ce pas ?\n\n03:30.020 --> 03:32.220\nParfois, les outils d’IA échouent parce\n\n03:32.220 --> 03:33.560\nque leurs données d’entraînement ne\n\n03:33.560 --> 03:35.300\ncontiennent pas suffisamment de cette\n\n03:35.300 --> 03:37.960\nlangue, de ce dialecte local ou de cet argot.\n\n03:37.960 --> 03:39.960\nIl y a eu, par exemple, un cas où un\n\n03:39.960 --> 03:41.760\nhomme saluait en arabe en disant\n\n03:41.760 --> 03:44.240\nbonjour, mais cela a été mal traduit par\n\n03:44.240 --> 03:46.280\n« attaquez-les », ce qui a conduit à\n\n03:46.280 --> 03:48.340\nl’arrestation injustifiée de cet homme,\n\n03:48.340 --> 03:49.560\nqui a ensuite été relâché.\n\n03:49.730 --> 03:51.310\nIl existe donc de nombreux cas\n\n03:51.310 --> 03:53.410\ndifférents où, lorsque nous ne tenons\n\n03:53.410 --> 03:55.210\npas compte de l’expérience ou de la\n\n03:55.210 --> 03:57.290\nsituation d’autrui, à cause de nos\n\n03:57.290 --> 03:59.690\nbiais, cela peut entraîner des inexactitudes.\n\n04:00.080 --> 04:01.300\nAlors voici ma question pour vous.\n\n04:02.100 --> 04:04.220\nQuand des erreurs se produisent, qui en\n\n04:04.220 --> 04:07.000\nest responsable, l’IA ou les humains, et\n\n04:07.000 --> 04:08.840\npourquoi pensez-vous cela ?\n\n04:08.840 --> 04:10.680\nNous répondrons à cette question dans la\n\n04:10.680 --> 04:11.460\nprochaine vidéo.\n"}, {"id": "lesson-4/04", "title": "Qui est responsable", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-04.mp4", "vtt": "WEBVTT\n\n00:00.600 --> 00:02.730\nTrès bien, alors regardons cette\nquestion.\n\n00:02.800 --> 00:07.140\nQuand des erreurs se produisent, qui est\nresponsable, l'IA ou les humains?\n\n00:07.930 --> 00:12.110\nMaintenant, si vous n'avez pas encore eu\nl'occasion de réfléchir à cette question,\n\n00:12.110 --> 00:15.770\nmettez simplement la vidéo en pause\nrapidement et réfléchissez-y pendant\n\n00:15.770 --> 00:19.840\nquelques secondes. D'accord, donc l'une\ndes choses les plus importantes que nous\n\n00:19.840 --> 00:23.860\nvoulons que vous compreniez à propos de\nces systèmes d'IA, c'est qu'ils ne sont\n\n00:23.860 --> 00:24.630\nque des outils.\n\n00:25.560 --> 00:27.830\nLes gens sont en fin de compte\nresponsables.\n\n00:27.980 --> 00:31.510\nLes outils d'IA ne se soucient pas des\nconséquences de leurs actions.\n\n00:31.600 --> 00:35.020\nD'après ce que nous avons vu, en dessous,\nil s'agit surtout de mathématiques.\n\n00:35.480 --> 00:39.310\nIl essaie de trouver des motifs entre\nses entrées et ses sorties à travers une\n\n00:39.310 --> 00:42.990\néquation mathématique, donc il n' y a\naucune émotion ou sentiment impliqué.\n\n00:43.480 --> 00:47.410\nEt ce que nous avons constaté, c'est que\nces outils d'IA ont été utilisés pour\n\n00:47.410 --> 00:51.350\nprovoquer des arrestations injustifiées,\nposer de mauvais diagnostics, et même\n\n00:51.350 --> 00:52.840\ncauser des accidents mortels.\n\n00:53.620 --> 00:57.620\nEt donc, la raison à cela, c'est que ce\nn'est qu'un outil, donc les personnes\n\n00:57.620 --> 01:02.090\nqui le conçoivent et l'utilisent sont en\nfin de compte responsables de ce qui se passe.\n\n01:03.060 --> 01:06.680\nEt maintenant que nous comprenons que\nles humains sont au centre de tout cela,\n\n01:06.680 --> 01:10.340\nquelles sont certaines des façons dont\nnous pouvons réduire les dommages causés\n\n01:10.340 --> 01:11.470\npar ces erreurs de l'IA?\n\n01:12.050 --> 01:15.160\nMettez la vidéo en pause et\nréfléchissez-y quelques secondes.\n\n01:16.860 --> 01:20.580\nNous pouvons donc examiner cela en\ntermes de deux rôles pour les humains et\n\n01:20.580 --> 01:24.400\nvoir comment ils peuvent réduire ces\npréjudices, à la fois du point de vue du\n\n01:24.400 --> 01:26.310\ncréateur et de celui de l'utilisateur.\n\n01:27.080 --> 01:31.680\nEn tant que créateur de ces outils d'IA,\nil est important d'ajouter une variété\n\n01:31.680 --> 01:35.690\nde données de haute qualité et\ndiversifiées afin de réduire les biais\n\n01:35.690 --> 01:36.870\nautant que possible.\n\n01:37.130 --> 01:41.180\nMais souvenez-vous, tous les humains\nsont biaisés car nous voyons tous les\n\n01:41.180 --> 01:45.340\nchoses sous un angle différent, il est\ndonc vraiment important d'écouter les\n\n01:45.340 --> 01:49.620\nperspectives différentes des autres et\nd'être honnête quant aux limites de vos\n\n01:49.620 --> 01:50.280\noutils d'IA.\n\n01:51.280 --> 01:54.960\nMaintenant, si vous êtes un utilisateur\nde ces outils d'IA, il est toujours\n\n01:54.960 --> 01:58.640\nimportant de vérifier à nouveau les\nrésultats de l'outil d'IA lorsqu'il y a\n\n01:58.640 --> 02:02.220\nun risque lié à votre décision, et de\nveiller à partager vos retours afin\n\n02:02.220 --> 02:04.660\nd'aider les créateurs à améliorer ces\noutils d'IA.\n\n02:06.030 --> 02:09.920\nPassons maintenant à un petit exercice\npour voir comment nous pouvons améliorer\n\n02:09.920 --> 02:11.960\nnotre classificateur d'ours et de chiens.\n\n02:12.520 --> 02:16.070\nAlors, en dehors des caractéristiques de\ncouleur noir et blanc dont nous avons\n\n02:16.070 --> 02:19.340\nparlé, où nous avons évoqué les ours\nnoirs et les chiens blancs, quelles\n\n02:19.340 --> 02:22.980\nautres caractéristiques et variations de\nces caractéristiques pourraient aider à\n\n02:22.980 --> 02:26.160\naméliorer notre classificateur? Très\nbien, mettez la vidéo en pause et\n\n02:26.160 --> 02:29.800\nréfléchissez-y pendant une minute, euh,\net voyez quelles autres caractéristiques\n\n02:29.800 --> 02:32.930\net quelles variations de ces\ncaractéristiques nous devrions également\n\n02:32.930 --> 02:33.760\nprendre en compte.\n\n02:37.300 --> 02:40.930\nTrès bien, il y a énormément de choses\nauxquelles nous pouvons penser pour\n\n02:40.930 --> 02:44.350\nréduire les biais et apporter plus de\nperspectives à nos modèles d'IA.\n\n02:44.620 --> 02:47.990\nMais, vous savez, comme vous l'avez vu,\nil y a une limitation dans les ours et\n\n02:47.990 --> 02:49.130\nles chiens que nous avons.\n\n02:49.300 --> 02:53.470\nIl faut donc considérer les types d'ours\net de chiens, s'ils sont bébés ou\n\n02:53.470 --> 02:57.010\nadultes, ainsi que les divers\nenvironnements et les différentes\n\n02:57.010 --> 03:01.000\ntailles; ce sont là autant de facteurs\nimportants auxquels vous devriez\n\n03:01.000 --> 03:01.580\nréfléchir.\n"}, {"id": "lesson-4/05", "title": "Confidentialité des données", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-05.mp4", "vtt": "WEBVTT\n\n00:00.800 --> 00:03.840\nD'accord, nous comprenons que des\ndonnées diversifiées sont importantes,\n\n00:03.840 --> 00:07.210\nmais ce n'est pas parce que nous pouvons\nles collecter que nous devons forcément\n\n00:07.210 --> 00:10.550\nle faire. Les données peuvent provenir\nde n'importe où, tout comme nous pouvons\n\n00:10.550 --> 00:12.430\nprendre des photos dans de nombreux\nendroits.\n\n00:12.990 --> 00:16.950\nPar exemple, sur cette photo du parc,\nnous avons des images d'humains et de\n\n00:16.950 --> 00:20.640\nchiens, et ce sont des données\npotentielles que nous pouvons ajouter à\n\n00:20.640 --> 00:21.610\nnotre modèle d'IA.\n\n00:22.320 --> 00:25.950\nCependant, toutes les données ne sont\npas disponibles pour être utilisées, et\n\n00:25.950 --> 00:29.680\nnous pouvons donc les considérer de deux\nmanières: les données publiques et les\n\n00:29.680 --> 00:30.440\ndonnées privées.\n\n00:31.160 --> 00:34.730\nLes données publiques sont donc des\ninformations que tout le monde peut voir,\n\n00:34.730 --> 00:37.560\nmais dont l'utilisation peut être\nsoumise à certaines règles.\n\n00:38.230 --> 00:42.540\nLes données privées, en revanche, sont\ndes informations qui peuvent identifier\n\n00:42.540 --> 00:46.450\nune personne ou révéler quelque chose de\npersonnel à son sujet, et leur\n\n00:46.450 --> 00:50.480\nutilisation ou consultation nécessite\ntoujours une autorisation. Quelques\n\n00:50.480 --> 00:54.620\nexemples de données privées pourraient\nêtre, par exemple, votre visage, vos\n\n00:54.620 --> 00:58.590\ne-mails et numéros de téléphone, vos\ninformations de santé ou médicales,\n\n00:58.590 --> 01:02.730\nvotre nom ou signature, vos informations\nfinancières, et même votre adresse\n\n01:02.730 --> 01:03.410\npersonnelle.\n\n01:04.160 --> 01:08.190\nToutes ces informations peuvent fournir\ndes données personnelles vous concernant.\n\n01:08.280 --> 01:12.360\nAlors, je veux que vous réfléchissiez à\ncette question: Et si un outil d'IA\n\n01:12.360 --> 01:15.890\nétait entraîné sur vos photos\npersonnelles sans votre permission?\n\n01:16.800 --> 01:18.590\nComment cela vous ferait-il sentir?\n\n01:18.710 --> 01:22.200\nMettez cette vidéo en pause et prenez\nquelques secondes pour y réfléchir.\n\n01:25.100 --> 01:28.900\nD'accord, il se peut que vous ressentiez\nbeaucoup d'émotions différentes.\n\n01:28.990 --> 01:33.020\nPeut-être que vous vous sentez violé,\npeut-être embarrassé, ou même en colère.\n\n01:33.440 --> 01:36.730\nCe qu'il est important de dire, c'est\nque peu importe l'émotion que vous\n\n01:36.730 --> 01:40.080\nressentez, vous avez droit à votre vie\nprivée, donc vous avez le droit de\n\n01:40.080 --> 01:43.000\ncontrôler la façon dont vos données\npersonnelles sont utilisées.\n\n01:43.510 --> 01:47.140\nCe qu'il faut savoir à propos des\ncréateurs, c'est qu'ils devraient être\n\n01:47.140 --> 01:51.030\ntrès, très clairs sur les données qu'ils\ncollectent et respecter vos choix si\n\n01:51.030 --> 01:51.800\nvous dites non.\n\n01:52.350 --> 01:55.810\nAlors, imaginons que vous ayez, vous\nsavez, différents types de données privées.\n\n01:55.960 --> 01:59.280\nVous pouvez leur donner la permission de\nvoir votre visage, mais ne pas leur\n\n01:59.280 --> 02:01.770\ndonner d'informations concernant vos\ndonnées financières.\n\n02:03.460 --> 02:07.180\nMais le fait est qu'il y a eu des cas où\ndes créateurs ont abusé de données\n\n02:07.180 --> 02:09.330\nprivées et ont dû en subir les\nconséquences.\n\n02:09.940 --> 02:13.690\nIl y avait une entreprise appelée Alva\nAlbum qui a été accusée d'utiliser les\n\n02:13.690 --> 02:17.050\nphotos de personnes pour entraîner des\nmodèles d'IA sans autorisation\n\n02:17.050 --> 02:20.950\nappropriée, et le gouvernement américain\ns'en est rendu compte et leur a ordonné\n\n02:20.950 --> 02:23.320\nde supprimer leurs données et leurs\nmodèles d'IA.\n\n02:25.430 --> 02:29.280\nDonc, maintenant que nous comprenons\ncela, je vais vous poser cette question:\n\n02:29.280 --> 02:32.730\ncomment pouvons-nous protéger la vie\nprivée lors de la création et de\n\n02:32.730 --> 02:34.400\nl'utilisation de ces outils d'IA?\n\n02:35.260 --> 02:38.350\nMettez cette vidéo en pause et\nréfléchissez-y quelques secondes.\n\n02:41.500 --> 02:45.340\nD'accord, nous pouvons donc l'aborder\nsous deux angles: du point de vue du\n\n02:45.340 --> 02:47.650\ncréateur et du point de vue de\nl'utilisateur.\n\n02:48.450 --> 02:51.540\nEn tant que créateur, vous devez\ntoujours demander la permission avant\n\n02:51.540 --> 02:53.150\nd'utiliser des données personnelles.\n\n02:53.600 --> 02:57.860\nVous devez être clair sur la façon dont\nelles sont utilisées et supprimer toute\n\n02:57.860 --> 03:00.490\ninformation personnelle qui n'est pas\nnécessaire.\n\n03:01.170 --> 03:04.300\nMaintenant, du point de vue de\nl'utilisateur, vous devriez lire comment\n\n03:04.300 --> 03:07.830\nvos données personnelles sont utilisées,\net vous devriez poser des questions sur\n\n03:07.830 --> 03:09.660\nla façon dont vos données sont\nexploitées.\n\n03:10.010 --> 03:13.850\nVous avez le droit sur vos informations\npersonnelles et pouvez refuser ou\n\n03:13.850 --> 03:15.290\nlimiter ce qui est partagé.\n\n03:16.790 --> 03:20.860\nTrès bien, faisons donc cet exercice sur\nla façon dont nous pouvons protéger la\n\n03:20.860 --> 03:24.760\nvie privée dans notre classificateur\nd'ours et de chiens. Supposons que nous\n\n03:24.760 --> 03:27.840\nayons cette photo ici et que nous\nvoulions l'ajouter à notre\n\n03:27.840 --> 03:29.920\nclassificateur ours-chien pour ce chien.\n\n03:30.290 --> 03:34.000\nComment vous assureriez-vous que cette\nphoto respecte la vie privée avant de\n\n03:34.000 --> 03:36.670\nl'utiliser dans notre classificateur\nours contre chien?\n\n03:37.310 --> 03:41.520\nEt juste pour vous prévenir, ce chien\nsur cette photo n'appartient à personne.\n\n03:41.520 --> 03:45.570\nTrès bien, mettez la vidéo en pause et\nréfléchissez à cela pendant quelques\n\n03:45.570 --> 03:46.070\nsecondes.\n\n03:48.930 --> 03:52.500\nD'accord, donc il y a quelques données\nprivées que nous avons trouvées dans\n\n03:52.500 --> 03:53.080\ncette photo.\n\n03:53.220 --> 03:55.890\nNous avons l'adresse de la maison de\ncette personne, la plaque\n\n03:55.890 --> 03:59.090\nd'immatriculation de sa voiture, et le\nvisage de la personne sur la photo.\n\n03:59.090 --> 04:01.630\nSupposons que nous voulions utiliser la\nphoto telle quelle.\n\n04:02.100 --> 04:04.750\nDans ces cas-là, il faut toujours\ndemander la permission.\n\n04:04.830 --> 04:08.470\nEnsuite, une fois que nous avons\neffectivement cette photo, l'autre chose\n\n04:08.470 --> 04:11.960\nà faire, c'est de supprimer toutes les\ndonnées privées qui ne sont pas\n\n04:11.960 --> 04:12.570\nnécessaires.\n\n04:12.790 --> 04:16.860\nLe point avec notre classificateur d ’\nours et de chiens, c ’ est que seul le\n\n04:16.860 --> 04:20.890\nchien nous intéresse, donc c ’ est une\nfaçon de protéger la vie privée de la\n\n04:20.890 --> 04:24.750\npersonne, en retirant simplement toutes\nles données, et vous pouvez aussi\n\n04:24.750 --> 04:29.090\nflouter les informations privées si vous\ndécidez de ne pas découper toute la photo.\n"}, {"id": "lesson-4/06", "title": "IA responsable", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-06.mp4", "vtt": "WEBVTT\n\n00:00.720 --> 00:02.620\nD'accord, donc nous avons parlé de cette\n\n00:02.620 --> 00:04.760\nidée de biais des données et de\n\n00:04.760 --> 00:06.700\nconfidentialité des données, et de la\n\n00:06.700 --> 00:08.300\nfaçon dont, au final, ce sont les\n\n00:08.300 --> 00:09.500\nhumains qui en sont responsables.\n\n00:10.230 --> 00:12.730\nC'est ce que nous appelons l'IA responsable.\n\n00:13.490 --> 00:15.290\nIl s'agit de s'assurer que les gens sont\n\n00:15.290 --> 00:17.330\ndes créateurs responsables et des\n\n00:17.330 --> 00:19.490\nutilisateurs critiques de ces outils d'IA.\n\n00:20.360 --> 00:22.060\nEt l'une des choses les plus importantes\n\n00:22.060 --> 00:23.840\nque je veux que vous reteniez, c'est que\n\n00:23.840 --> 00:26.120\nchacun d'entre nous joue un rôle dans la\n\n00:26.120 --> 00:28.660\nfaçon dont les outils d'IA sont conçus\n\n00:28.660 --> 00:29.360\net utilisés.\n\n00:30.100 --> 00:31.900\nRappelez-vous, et cela ne concerne pas\n\n00:31.900 --> 00:33.840\nseulement l'IA, mais la technologie en\n\n00:33.840 --> 00:35.740\ngénéral, que la technologie est en\n\n00:35.740 --> 00:38.520\nréalité simplement le produit de choix humains.\n"}, {"id": "lesson-4/07", "title": "Quiz de récapitulation", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=fr"}, {"id": "lesson-4/08", "title": "Temps de projet", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/fr-lesson-4-08.mp4", "vtt": "WEBVTT\n\n00:00.340 --> 00:04.600\nTrès bien, c'est l'heure du projet pour\nla leçon numéro quatre, notre dernière leçon.\n\n00:05.360 --> 00:08.470\nJe veux donc que vous élargissiez\nmaintenant votre perspective.\n\n00:08.920 --> 00:12.840\nPensez donc aux caractéristiques que\nvous avez utilisées pour distinguer les\n\n00:12.840 --> 00:16.490\ndifférents groupes lors de la leçon\ntrois, et voyez comment vous pouvez\n\n00:16.490 --> 00:19.990\najouter plus de variété, explorer\nd'autres caractéristiques, ou même\n\n00:19.990 --> 00:23.130\nobtenir des retours d'autres personnes\npour réduire ce biais.\n\n00:23.830 --> 00:27.500\nRappelez-vous, aucun classificateur\nn'est parfait, et cela fait simplement\n\n00:27.500 --> 00:29.150\npartie du fonctionnement de l'IA.\n\n00:29.590 --> 00:33.070\nExpliquez son biais et expliquez comment\nvous pourriez le réduire.\n\n00:34.240 --> 00:35.780\nC'est donc la dernière leçon.\n\n00:35.940 --> 00:36.910\nFélicitations.\n\n00:37.350 --> 00:41.020\nVous allez donc travailler sur la\nquestion de la leçon quatre, et si vous\n\n00:41.020 --> 00:44.580\nterminez en avance, et si votre\nenseignant vous y autorise, vous pouvez\n\n00:44.580 --> 00:48.090\ncontinuer à travailler sur votre\nclassificateur. Très bien, voici donc\n\n00:48.090 --> 00:50.840\nnotre dernière question: construire une\nIA responsable.\n\n00:51.710 --> 00:55.170\nQue pouvez-vous faire pour ajouter plus\nde variété à vos caractéristiques afin\n\n00:55.170 --> 00:56.110\nde réduire les biais?\n\n00:56.920 --> 00:58.690\nEt voici ce qu' a répondu l'élève.\n\n00:58.970 --> 01:00.740\n« Je prendrai des photos de fruits\n\n01:00.740 --> 01:02.720\nprovenant de différents endroits, pour\n\n01:02.720 --> 01:04.490\nque l'IA n'analyse pas seulement à\n\n01:04.490 --> 01:06.520\npartir d'un seul lieu, et je demanderai\n\n01:06.520 --> 01:08.390\naussi à mes amis de vérifier si cela\n\n01:08.390 --> 01:10.320\nfonctionne bien pour eux aussi. Et si\n\n01:10.320 --> 01:12.140\nj'utilise le visage de quelqu'un ou\n\n01:12.140 --> 01:14.070\nquelque chose de privé, je demanderai\n\n01:14.070 --> 01:15.320\nd'abord la permission. »\n\n01:15.770 --> 01:18.770\nRappelez-vous encore une fois,\nconcernant les informations privées: si\n\n01:18.770 --> 01:21.950\nvous utilisez quoi que ce soit qui\ncontient des informations personnelles,\n\n01:21.950 --> 01:23.640\nassurez-vous de demander la permission.\n"}, {"id": "lesson-4/09", "title": "Feuille de travail", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=4&lang=fr"}]}, {"id": "resources", "kicker": "Pour les enseignants et les élèves", "title": "Ressources", "items": [{"id": "resources/1", "title": "Guide de l'enseignant", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1_eTguFa0iCkNI3a26-YtXRVri-M_XhQFabdP7SHbh2w/preview", "size": 83412}, {"id": "resources/2", "title": "Feuille de travail", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1AEjy0zJc6IoMgxt0J-e5DwtpNca_aOk84QCkV5RPamY/preview", "size": 56552}, {"id": "resources/3", "title": "Feuille de travail (exemple)", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1eSxxVNeQvx5MGoxoW5Jy6T7AjodvuR63z5xcidNMLZA/preview", "size": 66470}, {"id": "resources/4", "title": "Diapositives", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/presentation/d/1-3IQhn18VmVBQ02pR8IHplJtp87qUU4vNs0SHOuohME/preview", "size": 7437553}]}]};

        var cls = 'it' + (done[item.id] ? ' done' : '') + (current === item ? ' current' : '');
        html += '<li><a class="' + cls + '" href="#/' + esc(item.id) + '"' + (current === item ? ' aria-current="page"' : '') + '>' +
          '<span class="status">' + icon('check') + '</span>' +
          '<span class="it-title">' + esc(item.title) + (done[item.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
          '<span class="it-kind" title="' + esc(kindText(item.kind)) + '">' + icon(item.kind) + '</span></a></li>';
      });
      html += '</ol></div>';
    });
    html += appSettingsLink('side-link app-settings');
    html += '<div class="side-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</div>';
    sideContent.innerHTML = html;
  }
  sideContent.addEventListener('click', function (e) {
    var head = e.target.closest('.group-head');
    if (!head) return;
    var id = head.getAttribute('data-section');
    expanded[id] = !expanded[id];
    head.setAttribute('aria-expanded', String(expanded[id]));
  });
  function scrollCurrentIntoView() {
    var el = sideContent.querySelector('.it.current');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Mobile drawer ----------
  function openMenu() {
    sidebar.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true');
    scrollCurrentIntoView();
  }
  function closeMenu() {
    sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  scrim.addEventListener('click', closeMenu);

  // ---------- Views ----------
  function firstOpenItem(list) {
    for (var i = 0; i < list.length; i++) if (!done[list[i].id]) return list[i];
    return list[0];
  }

  function renderHome() {
    var total = items.length, n = countDone(items);
    var resume = byId[state.last] || null;
    var primary = n === total ? null : (resume && !done[resume.id] ? resume : firstOpenItem(items));
    var html = '<div class="home"><section class="hero">' +
      '<span class="kicker">' + esc(t('brand')) + '</span>' +
      '<h1 tabindex="-1">' + esc(COURSE.courseName) + '</h1>' +
      '<p>' + esc(n === total ? t('heroFinished') : t('heroText')) + '</p>' +
      '<div class="hero-progress">' + esc(t('activitiesDone', { done: n, total: total })) +
      '<div class="bar"><span style="width:' + (100 * n / total) + '%"></span></div></div>' +
      '<div class="hero-actions">' +
      (primary
        ? '<a class="btn" href="#/' + esc(primary.id) + '">' + icon('play') + '<span>' +
          esc(n === 0 ? t('startCourse') : t('continue', { title: primary.title })) + '</span></a>'
        : '') +
      '<button class="btn secondary" type="button" data-open-np><span class="np-icon" aria-hidden="true"></span>' + esc(t('openNeuroPocket')) + '</button>' +
      '</div></section>' +
      '<h2 class="section-title">' + esc(t('lessons')) + '</h2><div class="cards">';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), len = section.items.length;
      var tag = sd === len ? '<span class="tag done">' + esc(t('tagDone')) + '</span>'
        : sd ? '<span class="tag progress">' + esc(t('tagInProgress')) + '</span>'
        : '<span class="tag">' + esc(t('activities', { total: len })) + '</span>';
      html += '<a class="card" href="#/' + esc(firstOpenItem(section.items).id) + '">' + tag +
        '<span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span>' +
        '<span class="card-meta">' + esc(t('sectionDone', { done: sd, total: len })) +
        '<span class="bar"><span style="width:' + (100 * sd / len) + '%"></span></span></span></a>';
    });
    html += '</div><p class="home-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</p>' +
      appSettingsLink('chip-btn home-settings') + '</div>';
    return html;
  }

  var pdfInline = navigator.pdfViewerEnabled === true ||
    (navigator.pdfViewerEnabled === undefined && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent));

  function renderItem(item) {
    var section = item.section;
    var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
