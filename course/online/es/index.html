  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

kindPdf": "PDF", "kindApp": "Aplicación"}, "sections": [{"id": "intro", "kicker": "Empieza aquí", "title": "Introducción", "items": [{"id": "intro/01", "title": "Bienvenido al curso", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-intro-01.mp4", "vtt": "WEBVTT\n\n00:00.100 --> 00:04.070\nHola y bienvenidos a este curso\noffline-first, Introducción a la\n\n00:04.070 --> 00:06.970\nInteligencia Artificial de\nLearnAIAnywhere.org.\n\n00:07.540 --> 00:11.540\nSomos una comunidad global de profesores\ny estudiantes, y estamos muy emocionados\n\n00:11.540 --> 00:15.390\nde tenerte aquí mientras trabajamos para\nhacer que la alfabetización en IA sea\n\n00:15.390 --> 00:19.190\naccesible para todos en todas partes.\nAhora, la historia que escuchamos sobre\n\n00:19.190 --> 00:22.190\nla IA es que se trata de humanos contra\nestas máquinas de IA.\n\n00:22.920 --> 00:26.720\nPero la verdad es que la IA es realmente\nsolo un producto de las decisiones\n\n00:26.720 --> 00:30.840\nhumanas. Y a diferencia de las máquinas,\nnosotros los humanos elegimos lo que nos\n\n00:30.840 --> 00:34.340\nimporta, como nuestros valores y\nnuestras comunidades. El objetivo de\n\n00:34.340 --> 00:37.790\nnuestro curso es brindar a nuestros\nestudiantes el conocimiento y el\n\n00:37.790 --> 00:41.540\ncriterio para convertirse en creadores\nresponsables y usuarios críticos de\n\n00:41.540 --> 00:45.350\nestas herramientas de IA. Vas a aprender\nexactamente qué es la inteligencia\n\n00:45.350 --> 00:49.050\nartificial, las partes clave del\naprendizaje automático, cómo funciona el\n\n00:49.050 --> 00:52.240\naprendizaje automático y las ideas\ndetrás de la IA responsable.\n\n00:53.330 --> 00:58.370\nAprenderás esto al diseñar tu propio\nclasificador de IA con NeuroPocket. Te\n\n00:58.370 --> 01:03.090\nguiaremos en cuatro lecciones con\nnuestra hoja de actividades. Al final,\n\n01:03.090 --> 01:08.390\ndiseñarás tu clasificador y comprenderás\ncómo funcionan estas herramientas, listo\n\n01:08.390 --> 01:10.180\npara presentar tu proyecto.\n\n01:10.580 --> 01:14.560\nNos alegra que participes en la creación\ny uso de la IA en nuestro mundo.\n\n01:14.610 --> 01:15.620\nNos vemos en clase.\n"}, {"id": "intro/02", "title": "Prerrequisito", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-intro-02.mp4", "vtt": "WEBVTT\n\n00:00.540 --> 00:02.020\nBien, bienvenidos a la clase.\n\n00:02.420 --> 00:04.510\nAsí que van a necesitar dos cosas.\n\n00:04.970 --> 00:08.910\nLa primera es que van a necesitar un\ndispositivo que tenga una cámara web.\n\n00:09.710 --> 00:13.870\nEste dispositivo puede ser una laptop,\nuna tableta o un teléfono.\n\n00:14.410 --> 00:17.990\nLo importante es que tenga una cámara\nweb porque la vamos a usar para tomar fotos.\n\n00:18.720 --> 00:23.030\nY la aplicación que vamos a usar se\nllama Near Pocket, y la vamos a utilizar\n\n00:23.030 --> 00:25.610\npara diseñar nuestro clasificador de\nimágenes.\n\n00:26.240 --> 00:30.620\nPueden acceder a ella en línea\nfácilmente, o si quieren usarla sin\n\n00:30.620 --> 00:35.610\nconexión, hay aplicaciones disponibles\npara dispositivos Windows y Android.\n\n00:36.190 --> 00:39.920\nAsí que si están usando un iPhone,\ntendrían que acceder a través del sitio\n\n00:39.920 --> 00:40.730\nweb en su lugar.\n\n00:41.770 --> 00:46.070\nLa otra cosa es que tenemos una hoja de\ntrabajo opcional para el proyecto. Y lo\n\n00:46.070 --> 00:49.700\nque hace esta hoja de trabajo del\nproyecto es guiarnos para diseñar\n\n00:49.700 --> 00:54.050\nnuestro clasificador de IA a medida que\navanzamos por cada una de las lecciones.\n\n00:54.950 --> 00:58.920\nY por supuesto, si no quieren imprimirla,\npueden usar una simple hoja de papel y\n\n00:58.920 --> 01:01.950\nhará el mismo trabajo porque las\npreguntas no son muy largas.\n\n01:03.080 --> 01:07.180\nBien, eso es todo lo que necesitamos\npara los requisitos previos, así que nos\n\n01:07.180 --> 01:08.260\nvemos en la próxima.\n"}, {"id": "intro/03", "title": "Clave de símbolos", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-intro-03.mp4", "vtt": "WEBVTT\n\n00:00.440 --> 00:04.210\nDe acuerdo. Bienvenidos a esta\nintroducción a la inteligencia\n\n00:04.210 --> 00:06.220\nartificial de LearnAnywhere.org.\n\n00:06.820 --> 00:10.360\nAntes de comenzar con todas las\nlecciones, notarás algunos símbolos en\n\n00:10.360 --> 00:11.900\nla esquina inferior izquierda.\n\n00:12.610 --> 00:17.050\nSi ves un libro, ese es simplemente un\nsímbolo que indica que vamos a enseñar algo.\n\n00:17.220 --> 00:21.340\nSi ves a alguien corriendo, significa\nque haremos algo interactivo, como un\n\n00:21.340 --> 00:23.010\njuego o una práctica práctica.\n\n00:23.160 --> 00:27.300\nY si ves una nube, eso significa que\ntendremos la oportunidad de reflexionar\n\n00:27.300 --> 00:28.900\nsobre lo que hemos aprendido.\n\n00:29.070 --> 00:30.880\nMuy bien, nos vemos en la próxima.\n"}]}, {"id": "lesson-1", "kicker": "Lección 1", "title": "Qué es la IA", "items": [{"id": "lesson-1/01", "title": "Objetivos", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-1-01.mp4", "vtt": "WEBVTT\n\n00:00.680 --> 00:04.190\nBienvenidos a la lección uno sobre qué\nes exactamente la inteligencia\n\n00:04.190 --> 00:04.760\nartificial.\n\n00:05.420 --> 00:10.030\nAsí que en el objetivo de la lección uno,\nvas a explicar las cualidades clave que\n\n00:10.030 --> 00:13.950\nhacen que algo sea inteligencia\nartificial, y luego vas a identificar\n\n00:13.950 --> 00:17.350\nejemplos de IA y de cosas que no son IA,\ny explicar por qué.\n"}, {"id": "lesson-1/02", "title": "Qué es la IA", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-1-02.mp4", "vtt": "WEBVTT\n\n00:01.260 --> 00:05.830\nAsí que antes de que empecemos, piensa\nen esta pregunta: ¿Qué crees que hace a\n\n00:05.830 --> 00:07.320\nlos humanos inteligentes?\n\n00:08.180 --> 00:11.370\nAhora pon pausa al video y piénsalo por\nunos segundos.\n\n00:13.300 --> 00:17.140\nBien, ahora que has tenido algo de\ntiempo, primero quiero decir que la\n\n00:17.140 --> 00:19.710\ninteligencia humana es extremadamente\ncompleja.\n\n00:20.260 --> 00:22.810\nPero podemos observar dos\ncaracterísticas clave.\n\n00:23.000 --> 00:26.760\nAlgunas de las características\nprincipales que hacen inteligente al ser\n\n00:26.760 --> 00:30.890\nhumano son su autonomía y adaptabilidad.\nAsí que cuando hablo de autonomía, me\n\n00:30.890 --> 00:34.110\nrefiero a un humano que actúa y toma\ndecisiones por sí mismo.\n\n00:34.420 --> 00:38.100\nY cuando hablo de adaptabilidad, me\nrefiero a la capacidad del ser humano\n\n00:38.100 --> 00:40.190\npara aprender de la experiencia y\nmejorar.\n\n00:41.050 --> 00:45.090\nAsí que un montón de personas curiosas\nse preguntaron, ¿cómo podemos construir\n\n00:45.090 --> 00:47.660\nestos aspectos de la inteligencia en las\nmáquinas?\n\n00:48.230 --> 00:52.140\nY ahí es donde nació el campo de la\ninteligencia artificial, un área de\n\n00:52.140 --> 00:56.320\nestudio sobre cómo crear tecnología que\nimite el comportamiento inteligente.\n\n00:57.410 --> 01:01.490\nAsí que algunas de las cosas clave que\nhacen que la IA parezca inteligente\n\n01:01.490 --> 01:03.780\ntambién son su autonomía y adaptabilidad.\n\n01:04.510 --> 01:08.340\nAsí que cuando hablo de autonomía,\nrealmente me refiero a la capacidad de\n\n01:08.340 --> 01:11.700\nuna tecnología para asistir o funcionar\nde manera independiente.\n\n01:12.330 --> 01:16.990\nY cuando hablo de adaptabilidad, es la\ncapacidad de una tecnología para mejorar\n\n01:16.990 --> 01:18.850\na medida que analiza más datos.\n\n01:20.090 --> 01:24.010\nAlgunos ejemplos que podemos considerar\nson, por ejemplo, nuestro motor de\n\n01:24.010 --> 01:28.260\nbúsqueda. Si alguna vez has usado Google,\nhas interactuado con algún tipo de IA.\n\n01:28.880 --> 01:32.600\nEs autónoma porque puede ayudarte\nsugiriendo palabras de manera\n\n01:32.600 --> 01:33.450\nindependiente.\n\n01:33.660 --> 01:37.550\nComo puedes ver, mientras escribo,\nrecibo todas estas sugerencias\n\n01:37.550 --> 01:41.820\ndiferentes, y también es adaptable\nporque puede mejorar sus sugerencias\n\n01:41.820 --> 01:45.290\nanalizando las búsquedas anteriores de\nlas personas y más.\n\n01:47.060 --> 01:50.790\nAhora, un buen ejemplo de algo que no es\nIA es una calculadora.\n\n01:50.890 --> 01:54.600\nNo es autónoma porque solo hace lo que\ntú le indicas, así que tienes que\n\n01:54.600 --> 01:57.930\npresionar manualmente los botones para\ntodo lo que quieras hacer.\n\n01:58.630 --> 02:02.990\nY especialmente no es adaptable porque\nno puede analizar nuevos datos y siempre\n\n02:02.990 --> 02:04.560\nfunciona de la misma manera.\n\n02:05.990 --> 02:07.290\nBien, ahora es tu turno.\n\n02:07.590 --> 02:09.030\nVamos a jugar a \"¿IA o no?\"\n\n02:09.610 --> 02:11.140\nVoy a describir una situación.\n\n02:11.440 --> 02:14.240\nVas a observar si implica autonomía y\nadaptabilidad.\n\n02:14.700 --> 02:18.690\nVas a decidir si es IA o no, y vas a\ncompartir tu razonamiento.\n"}, {"id": "lesson-1/03", "title": "IA o No", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=es"}, {"id": "lesson-1/04", "title": "Cómo la IA nos puede ayudar", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-1-04.mp4", "vtt": "WEBVTT\n\n00:00.700 --> 00:04.850\nBien, entonces, después de jugar al\njuego de '¿IA o no?', aquí tienes una\n\n00:04.850 --> 00:09.460\npregunta para ti. ¿Cómo estaban ayudando\nestas aplicaciones de IA a las personas?\n\n00:09.460 --> 00:13.320\nSi quieres, puedes pausar el video y\npensarlo durante unos segundos.\n\n00:15.570 --> 00:20.240\nAlgunas de las formas en que la IA nos\nayuda son: mejora la calidad del trabajo,\n\n00:20.240 --> 00:24.730\nrealiza partes de nuestras tareas para\nque podamos enfocarnos en otras y hace\n\n00:24.730 --> 00:29.330\nque todo sea más sencillo. Por ejemplo,\nlos agricultores usan herramientas como\n\n00:29.330 --> 00:33.820\nPlant Village Niru, donde pueden tomar\nuna foto de la hoja de una planta para\n\n00:33.820 --> 00:36.770\nver si está enferma y cómo tratarla en\ntiempo real.\n\n00:37.950 --> 00:42.260\nAlgunos de estos agricultores también\nutilizan algo llamado FarmerChat, que es\n\n00:42.260 --> 00:46.690\nuna forma de interactuar con un chatbot\npara recibir consejos sobre agricultura,\n\n00:46.690 --> 00:50.280\nlo que les permite tomar mejores\ndecisiones sobre cómo cuidar sus\n\n00:50.280 --> 00:51.290\ncultivos y suelos.\n\n00:52.390 --> 00:57.390\nEn medicina, muchos doctores usan\nimágenes de IA, como radiografías, para\n\n00:57.390 --> 01:02.260\ndetectar signos de enfermedades muy\npequeños y difíciles, ayudándoles a\n\n01:02.260 --> 01:04.000\ntomar mejores decisiones.\n\n01:04.930 --> 01:09.170\nY luego, Suki es una de esas\nherramientas en las que el médico y el\n\n01:09.170 --> 01:13.920\npaciente pueden conversar, y la IA\nbásicamente toma notas por ellos, lo que\n\n01:13.920 --> 01:17.190\npermite al médico concentrarse más en\nlos pacientes.\n\n01:19.170 --> 01:23.960\nAsí que una de las cosas más importantes\nque vamos a seguir enfatizando es que la\n\n01:23.960 --> 01:28.330\ntecnología de IA es una herramienta, y\nlo digo no como una forma de restar\n\n01:28.330 --> 01:32.890\nimportancia a las capacidades de la IA,\nsino más bien como un recordatorio de\n\n01:32.890 --> 01:37.500\nque somos responsables de ella, porque\nla cuestión es que las personas deciden\n\n01:37.500 --> 01:40.130\ncómo usarlas para las cosas que les\nimportan.\n"}, {"id": "lesson-1/05", "title": "Cuestionario de repaso", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=es"}, {"id": "lesson-1/06", "title": "Hora del proyecto", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-1-06.mp4", "vtt": "WEBVTT\n\n00:00.320 --> 00:02.670\nMuy bien, es hora del proyecto ahora.\n\n00:03.190 --> 00:07.260\nAsí que si recuerdas Plant Village Niru,\nlos agricultores usaban esta herramienta\n\n00:07.260 --> 00:11.330\nde clasificación por IA para tomar fotos\nde las hojas de las plantas y ver si sus\n\n00:11.330 --> 00:12.760\nhojas estaban enfermas o no.\n\n00:13.530 --> 00:19.020\nY ahora es tu turno de diseñar tu propio\nclasificador de IA. En las próximas tres\n\n00:19.020 --> 00:23.820\nlecciones, vas a diseñar tu propio\nclasificador de IA sobre el tema que\n\n00:23.820 --> 00:24.300\nelijas.\n\n00:24.910 --> 00:29.310\nEso podría ser hojas de plantas, útiles\nescolares, o cualquier cosa que se te\n\n00:29.310 --> 00:29.720\nocurra.\n\n00:31.250 --> 00:35.440\nY algunos ejemplos que han hecho los\nestudiantes es que, por ejemplo, algunos\n\n00:35.440 --> 00:39.470\nrecorrieron el jardín de su escuela para\ntomar fotos de hojas de plantas y\n\n00:39.470 --> 00:43.660\ndistinguir entre las diferentes hojas de\nplantas en su jardín escolar. Y, eh,\n\n00:43.660 --> 00:47.910\nalgunos han tomado diferentes fotos de\nmateriales como vasos de vidrio y vasos\n\n00:47.910 --> 00:48.570\nde plástico.\n\n00:49.400 --> 00:53.480\nE incluso algunos se han puesto\ncreativos y han hecho lenguaje de señas,\n\n00:53.480 --> 00:57.950\ndonde tomaron fotos de varias posiciones\nde las manos para ver qué letras eran.\n\n00:57.950 --> 01:02.140\nAsí que después de cada lección, vas a\nescribir tu respuesta en tu hoja de\n\n01:02.140 --> 01:06.670\ntrabajo. Si no tienes la hoja de trabajo,\nsimplemente usa una hoja de papel para\n\n01:06.670 --> 01:08.110\nregistrar tus respuestas.\n\n01:08.950 --> 01:13.440\nY también puedes trabajar en grupo si es\nnecesario. Así que esta es la hoja de\n\n01:13.440 --> 01:17.810\ntrabajo, y al final de esto, deberías\ntenerla completamente llena después de\n\n01:17.810 --> 01:19.150\nterminar las lecciones.\n\n01:21.070 --> 01:24.910\nBien, así que después de todas las\nlecciones, deberías haber completado tu\n\n01:24.910 --> 01:28.280\nhoja de trabajo y diseñado tu\nclasificador de IA para el tema que\n\n01:28.280 --> 01:28.750\nelegiste.\n\n01:28.980 --> 01:33.060\nY así, tu profesor puede organizar un\ndía de presentaciones opcional donde\n\n01:33.060 --> 01:36.980\npresentes tu clasificador de IA y tus\nrespuestas de la hoja de trabajo.\n\n01:38.340 --> 01:41.780\nBien, así que vamos a empezar\nrespondiendo la primera pregunta de la\n\n01:41.780 --> 01:42.600\nhoja de trabajo.\n\n01:44.650 --> 01:48.640\nVas a comenzar respondiendo solo la\nlección número uno, que es elegir tu\n\n01:48.640 --> 01:49.880\ntema de clasificación.\n\n01:50.340 --> 01:54.820\nAsí que elige un tema que te gustaría\nexplorar para tu clasificación de IA y\n\n01:54.820 --> 01:56.490\nexplica por qué lo elegiste.\n\n01:57.080 --> 02:00.130\nEste es un ejemplo de lo que ha escrito\nun estudiante:\n\n02:00.130 --> 02:02.140\n\"Quiero clasificar frutas porque me\n\n02:02.140 --> 02:04.200\nencantan las frutas y son fáciles de\n\n02:04.200 --> 02:05.980\nencontrar. Muchas personas a mi\n\n02:05.980 --> 02:07.930\nalrededor cultivan frutas, así que\n\n02:07.930 --> 02:10.120\npuedo traer diferentes tipos para usar\n\n02:10.120 --> 02:11.030\nen mi proyecto.\"\n"}, {"id": "lesson-1/07", "title": "Hoja de trabajo", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=es"}]}, {"id": "lesson-2", "kicker": "Lección 2", "title": "Las partes clave del aprendizaje automático", "items": [{"id": "lesson-2/01", "title": "Objetivos", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-2-01.mp4", "vtt": "WEBVTT\n\n00:00.420 --> 00:04.280\nBien, bienvenidos a la lección dos,\ndonde vamos a hablar sobre las partes\n\n00:04.280 --> 00:06.050\nclave del aprendizaje automático.\n\n00:07.020 --> 00:10.920\nAsí que el objetivo de la lección dos es\nque podamos explicar qué es el\n\n00:10.920 --> 00:14.440\naprendizaje automático. Vamos a\nidentificar las partes clave del\n\n00:14.440 --> 00:18.340\naprendizaje automático. Vamos a\ndescribir por qué o para qué sirve cada\n\n00:18.340 --> 00:22.360\nparte y cómo funcionan juntas, y vas a\nexplicar cómo los datos afectan el\n\n00:22.360 --> 00:24.590\ndesempeño de la inteligencia artificial.\n"}, {"id": "lesson-2/02", "title": "Qué es el aprendizaje automático", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-2-02.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:03.940\nBien, entonces, ¿cómo te preparas\nexactamente para un examen?\n\n00:04.480 --> 00:08.810\nPiensa en esto solo por unos segundos.\nBien, cuando una persona se prepara para\n\n00:08.810 --> 00:13.200\nun examen, lo primero que va a hacer es\nrecopilar información, y esa información\n\n00:13.200 --> 00:15.480\npuede venir en forma de apuntes de clase.\n\n00:16.330 --> 00:20.850\nEntonces, una vez que tienes tus apuntes,\nvas a estudiarlos, y lo que sucede es\n\n00:20.850 --> 00:25.360\nque tu cerebro va a conectar esa nueva\ninformación con tus experiencias vividas\n\n00:25.360 --> 00:27.390\npara poder entender mejor el mundo.\n\n00:27.660 --> 00:32.190\nY lo que sucede con el tiempo es que te\nvas a volver mejor preparado para tomar\n\n00:32.190 --> 00:36.430\nel examen a medida que conectas la nueva\ninformación con tus conocimientos\n\n00:36.430 --> 00:36.900\nprevios.\n\n00:37.830 --> 00:42.660\nAsí que las cuatro partes de prepararse\npara un examen son: el cerebro, que\n\n00:42.660 --> 00:47.560\nbásicamente toma apuntes, estudias esos\napuntes y, como resultado, tienes un\n\n00:47.560 --> 00:50.370\ncerebro más preparado para rendir el\nexamen.\n\n00:51.470 --> 00:54.120\nAsí que el cerebro es el que realiza el\naprendizaje.\n\n00:54.750 --> 00:57.720\nLos apuntes son básicamente la\ninformación que vas a estudiar.\n\n00:57.830 --> 01:02.510\nEl estudio es básicamente el tiempo y el\nproceso de conectar estas nuevas ideas\n\n01:02.510 --> 01:06.050\ncon lo que ya sabes, y el cerebro\npreparado es el resultado.\n\n01:06.320 --> 01:10.720\nAsí que después de haber estudiado esos\napuntes, básicamente estás listo para\n\n01:10.720 --> 01:11.640\ntomar el examen.\n\n01:12.660 --> 01:16.920\nEntonces, el aprendizaje humano, y la\nidea clave del aprendizaje humano, es\n\n01:16.920 --> 01:21.180\nque construyes comprensión al conectar\nnueva información con tu experiencia\n\n01:21.180 --> 01:23.310\nvivida, para poder entender el mundo.\n\n01:24.130 --> 01:27.790\n¿Entonces, cómo se compara exactamente\nel aprendizaje humano con el aprendizaje\n\n01:27.790 --> 01:28.310\nautomático?\n\n01:28.420 --> 01:32.690\nBueno, lo interesante del aprendizaje\nautomático, y entraremos en más detalles\n\n01:32.690 --> 01:36.950\nsobre lo que queremos decir con esto, es\nque básicamente utiliza instrucciones\n\n01:36.950 --> 01:40.780\nmatemáticas para encontrar patrones en\nlos datos y hacer predicciones.\n\n01:41.080 --> 01:44.980\nY así, una de las partes del aprendizaje\nautomático es que existe un modelo.\n\n01:45.090 --> 01:49.190\nEse modelo recibe datos, y básicamente\nel entrenamiento es donde intentamos\n\n01:49.190 --> 01:53.240\nencontrar patrones en esos datos, y\nluego tienes un modelo entrenado, como\n\n01:53.240 --> 01:57.340\nun clasificador de enfermedades de\nplantas, que puede predecir enfermedades\n\n01:57.340 --> 02:01.170\nen plantas o si está enferma o no. Así\nque las cuatro partes clave del\n\n02:01.170 --> 02:05.660\naprendizaje automático en detalle son:\nel modelo es lo que va a capturar el patrón.\n\n02:06.670 --> 02:10.740\nLos datos son simplemente la información\nque le damos al modelo sobre la que va a\n\n02:10.740 --> 02:11.200\nentrenar.\n\n02:12.240 --> 02:16.260\nEl entrenamiento es básicamente el\nproceso que utiliza el modelo para\n\n02:16.260 --> 02:18.630\nanalizar los datos y encontrar patrones.\n\n02:18.770 --> 02:22.760\nY de nuevo, el modelo entrenado es\nbásicamente el resultado después de que\n\n02:22.760 --> 02:26.640\nel modelo ha terminado de entrenar, y\npor lo tanto está listo para hacer\n\n02:26.640 --> 02:27.350\npredicciones.\n\n02:29.370 --> 02:33.560\nAsí que, aunque la máquina procesa la\ninformación de manera diferente, en\n\n02:33.560 --> 02:37.570\nrealidad ambas comparten partes\nsimilares, ¿verdad? Así que cerebro es\n\n02:37.570 --> 02:41.930\nal modelo, apuntes son a los datos,\nestudiar es al entrenamiento, y preparar\n\n02:41.930 --> 02:43.900\nel cerebro es al modelo entrenado.\n\n02:44.290 --> 02:48.360\nNo son exactamente iguales, pero sí\ncomparten etapas similares en la forma\n\n02:48.360 --> 02:50.860\nen que, esencialmente, abordan su\naprendizaje.\n"}, {"id": "lesson-2/04", "title": "Cómo usar NeuroPocket", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-2-04.mp4", "vtt": "WEBVTT\n\n00:00.500 --> 00:05.220\nBien, ya hablamos sobre las partes clave\ndel aprendizaje automático, como el\n\n00:05.220 --> 00:09.940\nmodelo, los datos, el entrenamiento y el\nmodelo entrenado, pero realmente es\n\n00:09.940 --> 00:12.640\ndifícil ver cómo se unen todas estas\npartes.\n\n00:13.480 --> 00:18.290\nAsí que veamos cómo se unen estas partes\nclave diseñando un clasificador de IA\n\n00:18.290 --> 00:19.290\ncon Near Pocket.\n\n00:20.040 --> 00:21.990\n¿Pero qué es exactamente Near Pocket?\n\n00:22.450 --> 00:26.940\nNear Pocket es una aplicación de IA\ndonde puedes agregar imágenes, entrenar\n\n00:26.940 --> 00:29.430\nun modelo y ver cómo la IA reconoce\ncosas.\n\n00:30.380 --> 00:34.230\nY ya has visto algunos ejemplos en Near\nPocket en el ejemplo del estudiante.\n\n00:34.320 --> 00:38.220\nHas visto que los estudiantes pudieron\ndistinguir entre diferentes hojas de\n\n00:38.220 --> 00:42.110\nplantas, pudieron diferenciar entre\ndistintos materiales, e incluso también\n\n00:42.110 --> 00:43.220\nel lenguaje de señas.\n\n00:44.010 --> 00:48.130\nAsí que vamos a aprender Near Pocket\njuntos, haciendo cada paso juntos.\n\n00:48.690 --> 00:52.720\nA medida que avances en cada paso,\nsiéntete libre de pausar el video para\n\n00:52.720 --> 00:56.970\nque puedas completar la tarea o terminar\nel paso antes de pasar al siguiente.\n\n00:57.800 --> 01:02.020\nY por supuesto, si estás trabajando en\ngrupo o en un aula, si terminas antes,\n\n01:02.020 --> 01:06.180\nsimplemente ayuda a los que están a tu\nalrededor para que podamos avanzar al\n\n01:06.180 --> 01:08.020\nsiguiente paso más rápido juntos.\n\n01:10.040 --> 01:14.220\nBien, así que lo primero que voy a hacer\nes abrir mi aplicación Near Pocket, y\n\n01:14.220 --> 01:17.260\nvoy a nombrar el proyecto como Proyecto\nÚtiles Escolares.\n\n01:17.480 --> 01:21.020\nPuede ser cualquier nombre que quieras,\nes solo el nombre de tu proyecto, y una\n\n01:21.020 --> 01:23.830\nvez que hagas clic en Crear, te llevará\ndentro de ese proyecto.\n\n01:24.540 --> 01:27.230\nAsí que en realidad puedo tener más de\ndos grupos.\n\n01:27.400 --> 01:31.300\nEn mi caso, quiero categorizar entre\ntijeras y bolígrafos dentro de ese\n\n01:31.300 --> 01:31.800\nproyecto.\n\n01:32.550 --> 01:36.280\nAhora, cuando ya haya creado al menos\nmis dos grupos, voy a añadir algunas\n\n01:36.280 --> 01:40.270\nfotos para cada uno de esos grupos. Así\nque en mi caso, como tengo tijeras, voy\n\n01:40.270 --> 01:42.210\na tomar algunas fotos de unas tijeras.\n\n01:42.930 --> 01:46.550\nEn este caso, tomé aproximadamente seis\nfotos, y luego agrego las fotos.\n\n01:46.680 --> 01:48.500\nPuedes tomar más fotos si así lo deseas.\n\n01:49.080 --> 01:52.050\nY ahora voy a tomar algunas fotos de\nunos bolígrafos.\n\n01:52.530 --> 01:55.310\nY en mi caso, también tomé seis fotos de\nbolígrafos.\n\n01:55.420 --> 01:57.890\nY como dije, podrías tener cientos si\nquisieras.\n\n01:58.100 --> 02:01.800\nEn mi caso, solo lo estoy haciendo\nrápido. Luego vas a añadir fotos, y\n\n02:01.800 --> 02:03.990\nahora ya has agregado datos a tus grupos.\n\n02:04.620 --> 02:08.750\nPero podrías tener más de dos grupos si\nquisieras, así que técnicamente podría\n\n02:08.750 --> 02:12.820\ncrear un grupo como borradores, pero\npara simplificar, nos vamos a quedar con\n\n02:12.820 --> 02:16.950\nesto. Luego vas a pasar al entrenamiento,\ny simplemente vas a hacer clic en el\n\n02:16.950 --> 02:18.290\nbotón de Entrenar Modelo.\n\n02:18.670 --> 02:21.410\nEsto va a tomar unos minutos, así que\nsolo vamos a esperar.\n\n02:29.760 --> 02:31.710\nBien, ahora probemos nuestro modelo.\n\n02:31.750 --> 02:35.580\nAsí que lo primero que voy a hacer es\ntomar una foto de mi bolígrafo en una\n\n02:35.580 --> 02:38.370\nposición diferente y ver si lo clasifica\ncorrectamente.\n\n02:38.570 --> 02:42.850\nY puedes ver que dice que es un\nbolígrafo. Y ahora voy a probar con mis\n\n02:42.850 --> 02:46.820\ntijeras en otra posición diferente, lo\nclasifica, y puedes ver que\n\n02:46.820 --> 02:48.720\nefectivamente lo llama tijeras.\n\n02:48.980 --> 02:51.310\nMuy bien. Así que ese es tu clasificador\nde IA.\n\n02:51.800 --> 02:55.060\nY siempre puedes agregar más datos para\nmejorar tu clasificador.\n"}, {"id": "lesson-2/03", "title": "Abrir NeuroPocket", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "Las herramientas de IA pueden cometer errores", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-2-05.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:02.470\nBien, así que bienvenidos de nuevo.\n\n00:02.610 --> 00:06.740\nEntonces, después de que tuviste algo de\ntiempo para probar Near Pocket, ¿tu\n\n00:06.740 --> 00:10.880\nclasificador de IA siempre fue correcto?\nY si no fue así, ¿por qué crees que\n\n00:10.880 --> 00:11.870\ncometió ese error?\n\n00:12.530 --> 00:16.410\nAsí que siéntete libre de pausar el\nvideo y pensarlo por unos segundos.\n\n00:19.150 --> 00:23.580\nBien, lo que sucede con las herramientas\nde IA es que pueden darte resultados\n\n00:23.580 --> 00:24.280\ninesperados.\n\n00:24.710 --> 00:27.720\nLo que para ti es obvio, no\nnecesariamente lo será para una\n\n00:27.720 --> 00:28.650\nherramienta de IA.\n\n00:29.250 --> 00:33.200\nAsí que lo que sucede con las\nherramientas de IA es que no entienden\n\n00:33.200 --> 00:37.800\nde la misma manera que los humanos, por\nlo que tienen que analizar cada detalle\n\n00:37.800 --> 00:39.860\nde la foto para encontrar patrones.\n\n00:40.480 --> 00:44.490\nY a veces eso significa que encuentran\npatrones o utilizan patrones que\n\n00:44.490 --> 00:48.950\nnosotros no habíamos considerado antes.\nPor ejemplo, aquí puedes ver claramente\n\n00:48.950 --> 00:53.180\nque tenemos una tijera, pero como está\nen la misma posición que el lápiz de\n\n00:53.180 --> 00:56.790\ncolor y es del mismo color, la clasifica\ncomo un lápiz de color.\n\n00:58.590 --> 01:03.260\nY además, lo que pasa con los sistemas\nde IA es que están muy limitados por sus datos.\n\n01:03.390 --> 01:07.220\nRealmente solo pueden predecir en\nfunción de lo que han analizado antes.\n\n01:07.720 --> 01:11.930\nAsí que puedes ver que nuestro\nclasificador de enfermedades de plantas\n\n01:11.930 --> 01:16.620\nfalla porque nunca ha visto ni analizado\ncésped antes, y puedes ver claramente\n\n01:16.620 --> 01:21.250\nque lo llama un durazno sano, cuando no\nlo es. Y esto no solo se aplica a las\n\n01:21.250 --> 01:24.000\nimágenes, sino también a los idiomas,\n¿verdad?\n\n01:24.800 --> 01:28.260\nUna herramienta de IA solo puede\nresponder en función de los idiomas con\n\n01:28.260 --> 01:29.340\nlos que fue entrenada.\n\n01:29.470 --> 01:32.480\nAsí que en este caso, estoy hablando en\nhindi, como,\n\n01:32.480 --> 01:34.660\n\"¿Cómo está el clima hoy? ¿Cuál es tu\n\n01:34.660 --> 01:36.540\nnombre? ¿Cuánto es dos más dos?\"\n\n01:36.780 --> 01:41.060\nY como esta herramienta de IA nunca ha\nanalizado datos en hindi antes,\n\n01:41.060 --> 01:45.590\nsimplemente va a seguir repitiendo la\nmisma frase en inglés, que es lo que\n\n01:45.590 --> 01:48.640\nconoce: \"I am good, and you?\" de forma\nrepetitiva.\n\n01:49.010 --> 01:53.080\nAsí que esto realmente nos lleva al\nconcepto de que lo que entra, sale.\n\n01:53.200 --> 01:57.000\nEn el aprendizaje automático, si los\ndatos son limitados, eso significa que\n\n01:57.000 --> 01:59.360\nla predicción del modelo también será\nlimitada.\n"}, {"id": "lesson-2/06", "title": "Cuestionario de repaso", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=es"}, {"id": "lesson-2/07", "title": "Hora del proyecto", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-2-07.mp4", "vtt": "WEBVTT\n\n00:00.380 --> 00:03.090\nBien, es hora del proyecto para la\nlección número dos.\n\n00:03.960 --> 00:08.610\nYa tuviste algo de tiempo para practicar\npor tu cuenta, pero ahora es tu turno de\n\n00:08.610 --> 00:13.330\nexplorar tu entorno y recopilar datos\nsobre el tema que elegiste en la lección uno.\n\n00:13.880 --> 00:17.780\nY recuerda, tu tema siempre puede\ncambiar a medida que avanzas en la hoja\n\n00:17.780 --> 00:21.520\nde trabajo. Además, ahora debes\nasegurarte de responder la pregunta de\n\n00:21.520 --> 00:23.530\nla lección dos en tu hoja de trabajo.\n\n00:25.380 --> 00:29.330\nAsí que la lección número dos trata\nsobre la recopilación de datos. Entonces,\n\n00:29.330 --> 00:33.130\nnos vas a contar qué elementos vas a\nclasificar y cómo vas a recopilar tus\n\n00:33.130 --> 00:36.400\ndatos. Un ejemplo de respuesta de un\nestudiante es el siguiente.\n\n00:37.000 --> 00:39.540\n\"Los elementos que voy a clasificar son\n\n00:39.540 --> 00:42.010\nplátanos, naranjas y aguacates. Traeré\n\n00:42.010 --> 00:44.550\nfrutas de mi casa o iré al huerto de la\n\n00:44.550 --> 00:46.240\nescuela para tomar fotos.\"\n\n00:47.170 --> 00:47.940\n¿De acuerdo?\n\n00:48.000 --> 00:52.630\nAsí que vas a responder a la lección\nnúmero dos, y también, si tu profesor lo\n\n00:52.630 --> 00:57.320\npermite, puedes recorrer tu entorno para\ntomar más fotos y agregarlas a tu ...\n\n00:57.320 --> 00:59.580\no para mejorar tu clasificador de IA.\n"}, {"id": "lesson-2/08", "title": "Hoja de trabajo", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=es"}]}, {"id": "lesson-3", "kicker": "Lección 3", "title": "Cómo se entrenan las máquinas", "items": [{"id": "lesson-3/01", "title": "Objetivos", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-01.mp4", "vtt": "WEBVTT\n\n00:00.620 --> 00:04.970\nBien, bienvenidos a la lección número\ntres: ¿cómo entrenan las máquinas?\n\n00:05.870 --> 00:10.100\nSi recuerdas, en la última lección\nhablamos sobre las partes clave del\n\n00:10.100 --> 00:14.880\naprendizaje automático, donde tienes tu\nmodelo, y en ese modelo le das datos, y\n\n00:14.880 --> 00:19.290\nluego finalmente pasa por un proceso de\nentrenamiento en el que el modelo\n\n00:19.290 --> 00:23.890\nutiliza ese tiempo para analizar todos\nlos datos que le has dado y encontrar\n\n00:23.890 --> 00:24.440\npatrones.\n\n00:25.970 --> 00:29.370\nPero, ¿cómo funciona realmente el\nproceso de entrenamiento en el\n\n00:29.370 --> 00:30.620\naprendizaje automático?\n\n00:31.140 --> 00:35.950\nY eso es lo que vamos a entender en la\nlección tres. Así que el objetivo es que\n\n00:35.950 --> 00:39.960\nvas a explicar qué es un algoritmo y dar\nejemplos de la vida real.\n\n00:40.640 --> 00:44.410\nVas a explicar por qué las máquinas\nnecesitan algoritmos para funcionar.\n\n00:44.940 --> 00:49.250\nVas a describir los pasos que sigue una\nmáquina durante el entrenamiento. Y\n\n00:49.250 --> 00:53.260\nfinalmente, vas a comparar cómo los\nhumanos y las máquinas procesan la\n\n00:53.260 --> 00:55.120\ninformación de manera diferente.\n"}, {"id": "lesson-3/02", "title": "Juego Describer Drawer — Instrucciones", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-02.mp4", "vtt": "WEBVTT\n\n00:00.260 --> 00:04.000\nBien, para empezar, vamos a jugar al\njuego del describidor y el dibujante.\n\n00:04.670 --> 00:09.560\nEste juego requiere dos o más jugadores,\npero no te preocupes si no tienes a otra\n\n00:09.560 --> 00:12.060\npersona contigo y lo estás haciendo solo.\n\n00:12.580 --> 00:16.630\nTenemos un video de demostración en el\nque jugamos el juego, así que puedes ver\n\n00:16.630 --> 00:17.360\ncómo funciona.\n\n00:17.860 --> 00:22.110\nAsí que, para cuando encuentres a\nalguien con quien jugar, ya estarás listo.\n\n00:22.560 --> 00:26.040\n¿De acuerdo? Pero mientras tanto, vamos\na repasar las instrucciones.\n\n00:26.810 --> 00:31.720\nLa forma en que funciona el juego es que\nvas a trabajar en parejas. Así que, de\n\n00:31.720 --> 00:35.940\nnuevo, necesitas tener al menos dos\npersonas. Una persona será quien\n\n00:35.940 --> 00:38.270\ndescriba y la otra será quien dibuje.\n\n00:39.160 --> 00:43.840\nSi tienes un profesor, ese profesor hará\nun dibujo sencillo con tres a cinco\n\n00:43.840 --> 00:46.140\nformas básicas en cualquier posición.\n\n00:46.610 --> 00:51.070\nAsí que el dibujo puede ser tan simple\ncomo esto, e incluso puede ser tan\n\n00:51.070 --> 00:52.240\ncomplejo como esto.\n\n00:53.350 --> 00:57.200\nSi no hay ningún profesor, la persona\nque describe será quien haga el dibujo.\n\n00:58.390 --> 01:03.880\nAhora, una vez que el dibujo esté listo,\nsolo la persona que describe puede mirar\n\n01:03.880 --> 01:04.570\nel dibujo.\n\n01:05.320 --> 01:09.770\nEntonces, la persona que describe le va\na decir a la persona que dibuja cómo\n\n01:09.770 --> 01:13.210\nrecrear ese dibujo solo a través de\ninstrucciones verbales.\n\n01:13.410 --> 01:16.550\nSolo pueden hablar sobre cómo recrear\nese dibujo.\n\n01:17.030 --> 01:20.800\nTus manos deben estar detrás de tu\nespalda. No se permite señalar en\n\n01:20.800 --> 01:21.310\nabsoluto.\n\n01:22.130 --> 01:26.860\nY entonces, durante ese tiempo, mientras\nla persona que dibuja intenta recrear\n\n01:26.860 --> 01:31.340\nese dibujo, después de dos minutos, la\npersona que dibuja va a comparar su\n\n01:31.340 --> 01:35.770\ndibujo con el dibujo real o el dibujo\ndel profesor para ver qué tan cerca\n\n01:35.770 --> 01:36.200\nestuvo.\n\n01:36.630 --> 01:40.360\nY finalmente, después de que todo eso\nesté completo, esa es una ronda.\n\n01:40.480 --> 01:42.850\nVas a intercambiar roles y repetir.\n\n01:42.910 --> 01:47.130\nAsí que ahora la persona que describe se\nconvierte en la que dibuja y la que\n\n01:47.130 --> 01:51.750\ndibuja se convierte en la que describe.\nBien, entonces empecemos a jugar este juego.\n\n01:52.160 --> 01:56.150\n¿De acuerdo? Así que intentemos hacer al\nmenos dos rondas, y nos vemos en la\n\n01:56.150 --> 01:56.570\npróxima.\n"}, {"id": "lesson-3/03", "title": "Juego Describer Drawer — Demostración", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-03.mp4", "vtt": "WEBVTT\n\n00:02.240 --> 00:06.390\nBien, vamos a hacer una actividad\nllamada el juego del descriptor y el\n\n00:06.390 --> 00:07.000\ndibujante.\n\n00:07.360 --> 00:08.650\nY el juego es muy sencillo.\n\n00:09.270 --> 00:13.170\nYo, el profesor, voy a hacer un dibujo\nmuy simple que solo contendrá tres\n\n00:13.170 --> 00:14.200\nformas geométricas.\n\n00:14.790 --> 00:18.780\nPodría ser un cuadrado, un círculo, un\ntriángulo, un rombo, podría ser\n\n00:18.780 --> 00:20.160\ncualquier cosa, ¿verdad?\n\n00:20.440 --> 00:24.470\nPero básicamente son tres formas simples\nque puedes colocar como tú quieras.\n\n00:25.210 --> 00:26.480\nY lo que voy a hacer aquí ...\n\n00:26.800 --> 00:29.700\nEs que voy a dibujar algo tan simple\ncomo esto.\n\n00:34.830 --> 00:37.800\nAsí que este es un ejemplo sencillo de\nlo que voy a dibujar.\n\n00:38.270 --> 00:42.310\nY lo que va a pasar es que, como\nprofesor, tras crear mis dibujos, ahora\n\n00:42.310 --> 00:43.680\ntendré a mis profesores.\n\n00:43.970 --> 00:46.820\nO mis alumnos van a trabajar en parejas,\n¿de acuerdo?\n\n00:46.960 --> 00:50.800\nY básicamente, cuando los alumnos\ntrabajen en parejas, habrá dos roles.\n\n00:50.860 --> 00:55.360\nEstará el descriptor y estará el\ndibujante. Entonces, ¿quién de aquí va a\n\n00:55.360 --> 00:57.540\nser el descriptor en esta posición?\n\n00:58.590 --> 00:59.430\nYo seré el descriptor.\n\n00:59.430 --> 01:01.230\nBien, y Karen va a ser la dibujante.\n\n01:01.690 --> 01:05.940\nAsí que, de nuevo, la idea es que el\ndescriptor es el único que puede venir a\n\n01:05.940 --> 01:08.120\nla parte trasera de este dibujo oculto.\n\n01:08.660 --> 01:13.090\nY básicamente volver con el dibujante\npara darle instrucciones de cómo recrear\n\n01:13.090 --> 01:13.830\nesos dibujos.\n\n01:14.430 --> 01:18.180\nY el truco es que el descriptor puede\nvenir tantas veces como quiera.\n\n01:18.570 --> 01:22.080\nSin embargo, solo pueden dar\ninstrucciones verbales y deben estar\n\n01:22.080 --> 01:23.890\ndetrás del dibujante para darlas.\n\n01:24.280 --> 01:27.000\nPara que no se vean el uno al otro. Muy\nbien.\n\n01:27.480 --> 01:30.890\nAsí que vamos a mostrar una demostración\nde cómo va a funcionar este juego.\n\n01:31.440 --> 01:33.110\nEntonces, ¿están listos?\n\n01:33.110 --> 01:33.630\nSí.\n\n01:33.720 --> 01:34.880\nPreparados, vamos.\n\n01:35.460 --> 01:39.310\nPuedes subir Mason, ver el dibujo y\ndarle las instrucciones a Karen.\n\n01:40.540 --> 01:41.720\nTú puedes, Mason.\n\n01:41.720 --> 01:42.280\nVale.\n\n01:49.290 --> 01:51.210\nLo primero es dibujar un cuadrado.\n\n01:51.210 --> 01:51.790\nVale.\n\n01:57.880 --> 02:01.260\nEn medio del cuadrado, dibuja\ncuidadosamente un círculo.\n\n02:04.180 --> 02:07.140\n¿Va a tocar los bordes del cuadrado o en\nel centro?\n\n02:07.900 --> 02:09.610\nEhm, estará en el centro.\n\n02:09.710 --> 02:11.350\nNo tocará ninguno de los bordes.\n\n02:11.350 --> 02:12.090\nEntendido.\n\n02:13.160 --> 02:13.430\nVale.\n\n02:13.430 --> 02:13.980\nVale.\n\n02:13.980 --> 02:18.240\nY en la parte inferior del cuadrado,\nestará fuera del cuadrado, y será un\n\n02:18.240 --> 02:20.130\ntriángulo apuntando hacia abajo.\n\n02:20.970 --> 02:21.210\nVale.\n\n02:23.300 --> 02:25.820\n¿Usando la línea inferior como borde?\n\n02:25.820 --> 02:26.320\nCorrecto.\n\n02:26.460 --> 02:30.940\nUsarías el borde derecho y el izquierdo,\ne irá exactamente en el medio como la\n\n02:30.940 --> 02:32.100\npunta del triángulo.\n\n02:32.220 --> 02:32.800\nEntendido.\n\n02:32.820 --> 02:34.210\nBuenas instrucciones, Mason.\n\n02:35.770 --> 02:36.110\nMuy bien.\n\n02:36.110 --> 02:36.630\nMuy bien.\n\n02:37.130 --> 02:41.020\nBuen trabajo. Buen trabajo, chicos. Y\ncomo pueden ver allí, fueron capaces de\n\n02:41.020 --> 02:41.990\nrecrear ese dibujo.\n\n02:42.470 --> 02:46.800\nY ahora aquí está el asunto, ¿verdad? La\nidea de este juego es que ese era solo\n\n02:46.800 --> 02:47.690\nel primer nivel.\n\n02:48.020 --> 02:52.870\nComo profesor, puedes complicar el juego\ncada vez más haciendo formas como esta, ¿ven?\n\n02:53.000 --> 02:57.260\nPuedes poner tus formas en esta posición\ny tal vez hacer un cuadrado más pequeño\n\n02:57.260 --> 02:59.520\ny poner un triángulo en medio de este,\n¿no?\n\n03:00.200 --> 03:04.410\nBásicamente, la idea clave es que\nqueremos retar a nuestros alumnos a dar\n\n03:04.410 --> 03:06.630\ninstrucciones claras a los dibujantes.\n\n03:07.080 --> 03:09.350\nPara que puedan entender bien qué\nrecrear.\n\n03:09.410 --> 03:10.080\nMuy bien.\n\n03:10.080 --> 03:11.010\nGracias, chicos.\n\n03:11.010 --> 03:11.730\nGracias.\n\n03:11.730 --> 03:13.440\nY nos vemos en el próximo juego.\n"}, {"id": "lesson-3/04", "title": "Qué es un algoritmo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-04.mp4", "vtt": "WEBVTT\n\n00:00.320 --> 00:01.640\nBien, bienvenidos de nuevo.\n\n00:01.700 --> 00:06.120\nAsí que si tuviste la oportunidad de\njugar al juego de describir o dibujar\n\n00:06.120 --> 00:10.240\ncon alguien, o pudiste ver la\ndemostración en video, nuestra pregunta\n\n00:10.240 --> 00:14.360\npara ti es la siguiente: ¿qué\nestrategias usaron tú y tu compañero, o\n\n00:14.360 --> 00:17.990\nviste que usaron, para que fuera más\nfácil recrear el dibujo?\n\n00:19.320 --> 00:22.740\nAsí que solo pausa el video y piénsalo\npor unos segundos.\n\n00:25.460 --> 00:29.760\nBien, ahora que tuviste algo de tiempo\npara pensarlo, tal vez hayas notado que\n\n00:29.760 --> 00:32.610\nestaban usando algo llamado pensamiento\npaso a paso.\n\n00:33.460 --> 00:38.190\nAsí que el pensamiento paso a paso, al\njugar el juego con tu compañero, tenías\n\n00:38.190 --> 00:42.370\nque dar instrucciones muy claras y\ndetalladas para que la persona que\n\n00:42.370 --> 00:46.060\ndibujaba pudiera entender cómo recrear\nel dibujo del maestro.\n\n00:46.830 --> 00:50.510\nPor ejemplo, la persona pudo haber dicho\nalgo como esto:\n\n00:50.510 --> 00:52.720\n\"Primero dibuja un círculo, luego\n\n00:52.720 --> 00:54.870\ndentro de ese círculo, dibuja un\n\n00:54.870 --> 00:56.140\ntriángulo pequeño.\"\n\n00:56.430 --> 01:00.270\nPero puedes notar que dimos\ninstrucciones muy claras y paso a paso.\n\n01:00.990 --> 01:04.180\nAsí que lo que acabas de crear o ver fue\nun algoritmo.\n\n01:04.800 --> 01:08.900\nUn algoritmo es simplemente cualquier\ninstrucción clara y paso a paso para\n\n01:08.900 --> 01:10.030\ncompletar una tarea.\n\n01:10.920 --> 01:15.160\nY lo interesante de los algoritmos es\nque pueden aplicarse a cualquier cosa en la vida.\n\n01:15.340 --> 01:19.820\nNo tiene que ser algo técnico, siempre y\ncuando ese algoritmo sea un conjunto de\n\n01:19.820 --> 01:22.650\ninstrucciones paso a paso para completar\nuna tarea.\n\n01:23.400 --> 01:28.670\nEntonces, por ejemplo, si observo esto,\nlos pasos para preparar una taza de té,\n\n01:28.670 --> 01:34.010\nsabes, el primer paso fue hervir agua,\nel segundo paso, agregar una bolsa de té,\n\n01:34.010 --> 01:39.280\nel tercer paso, añadir azúcar y leche, y\nfinalmente, el cuarto paso, revolver y\n\n01:39.280 --> 01:40.360\nservir, ¿verdad?\n\n01:40.810 --> 01:46.100\nAsí que este es un ejemplo de algoritmo\nporque pude desglosarlo paso a paso para\n\n01:46.100 --> 01:49.110\ncompletar la tarea de preparar una taza\nde té.\n\n01:50.350 --> 01:54.830\nAsí que usamos algoritmos todos los días\nen nuestra vida cada vez que hacemos\n\n01:54.830 --> 01:55.830\nalgo paso a paso.\n\n01:56.190 --> 02:00.440\nEso puede ser cocinar, vestirse,\nresolver un problema de matemáticas o,\n\n02:00.440 --> 02:03.660\nen nuestro caso, simplemente jugar este\njuego también.\n\n02:05.540 --> 02:10.520\nAsí que mi pregunta para ti es esta:\n¿qué es algo en lo que puedas pensar que\n\n02:10.520 --> 02:15.640\nhaces todos los días y que pueda tener\ninstrucciones claras paso a paso o pasos\n\n02:15.640 --> 02:16.100\nclaros?\n\n02:16.760 --> 02:19.310\nAsí que solo pausa el video y piénsalo\nun momento.\n\n02:22.600 --> 02:27.190\nBien, ahora que has tenido tiempo para\npensarlo, lo que realmente queremos que\n\n02:27.190 --> 02:30.940\nentiendas, toda esta idea de los\nalgoritmos, es que las máquinas\n\n02:30.940 --> 02:35.420\nnecesitan algoritmos. De nuevo, las\nmáquinas no entienden de la misma manera\n\n02:35.420 --> 02:39.650\nque los humanos, y esa es una de las\nrazones más importantes por las que\n\n02:39.650 --> 02:42.510\nnecesitamos dar instrucciones claras\npaso a paso.\n\n02:43.450 --> 02:47.930\nAsí que cuando juegas ese juego o ves\nese juego, el que describe es como el\n\n02:47.930 --> 02:52.780\nhumano que da las instrucciones, y el\nque dibuja es como la máquina que las sigue.\n"}, {"id": "lesson-3/05", "title": "El algoritmo de aprendizaje humano", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-05.mp4", "vtt": "WEBVTT\n\n00:00.720 --> 00:04.920\nBien, ahora que entiendes cómo funciona\nun algoritmo, vamos a entender cómo\n\n00:04.920 --> 00:07.250\npodemos crear un algoritmo para aprender.\n\n00:07.920 --> 00:12.270\nPara comprender esto mejor, vamos a\njugar un pequeño juego llamado ¿a qué\n\n00:12.270 --> 00:13.230\ngrupo pertenece?\n\n00:14.020 --> 00:18.450\nLo que va a pasar es que te voy a\nmostrar una imagen y solo tienes que\n\n00:18.450 --> 00:21.270\ndecirme si pertenece al grupo A o al\ngrupo B.\n\n00:21.270 --> 00:24.480\nAhora, el truco es que no te voy a decir\nel patrón.\n\n00:24.840 --> 00:26.460\nNo te voy a decir las reglas.\n\n00:26.520 --> 00:29.160\nTu tarea es, básicamente, averiguarlo\npor ti mismo.\n\n00:29.260 --> 00:32.360\n¿De acuerdo? Así que empecemos con la\nprimera imagen.\n\n00:33.840 --> 00:36.390\nBien, ¿esto va al grupo A o al grupo B?\n\n00:37.170 --> 00:42.940\nSolo haz una suposición. Esto de aquí va\nal grupo B. ¿Esto va al grupo A o al\n\n00:42.940 --> 00:43.540\ngrupo B?\n\n00:44.850 --> 00:49.040\nEste de aquí va al grupo A. ¿Este va al\ngrupo A o al grupo B?\n\n00:50.550 --> 00:56.510\nEste de aquí va al grupo B. ¿Va al grupo\nA o al grupo B? Este de aquí va al grupo\n\n00:56.510 --> 00:57.260\nA.\nEste ...\n\n00:57.260 --> 00:59.720\n¿Este va al grupo A o al grupo B?\n\n01:01.120 --> 01:05.530\nEste de aquí va al grupo A. ¿Este va al\ngrupo A o al grupo B?\n\n01:07.720 --> 01:11.600\nEste de aquí va al grupo B.\nAhora viene uno complicado. ¿Este va al\n\n01:11.600 --> 01:12.840\ngrupo A o al grupo B?\n\n01:14.370 --> 01:18.050\nEste va al grupo A.\nY seguro que ya lo has descubierto, pero\n\n01:18.050 --> 01:20.100\n¿esto va al grupo A o al grupo B?\n\n01:21.670 --> 01:25.990\nEste de aquí va al grupo A.\nY por último, ¿este va al grupo A o al\n\n01:25.990 --> 01:26.520\ngrupo B?\n\n01:27.780 --> 01:30.960\nEste va al grupo B.\nBien, ¿cuál era el patrón? Bueno,\n\n01:30.960 --> 01:35.050\nprobablemente ya te diste cuenta: si\nhabía algún negro en el extremo\n\n01:35.050 --> 01:39.700\nizquierdo, era del grupo A, y si había\nalgún negro en el extremo derecho, era\n\n01:39.700 --> 01:42.820\ndel grupo B.\nY creo que lo realmente interesante es,\n\n01:42.820 --> 01:47.100\n¿cómo mejoras para decidir si algo va al\ngrupo A o al grupo B cuando no\n\n01:47.100 --> 01:51.750\nnecesitaba decirte ninguna regla, o\ncuando no te dije ninguna regla o patrón?\n\n01:51.750 --> 01:56.220\nAsí que siéntete libre de pausar el\nvideo y reflexionar sobre esto durante\n\n01:56.220 --> 01:57.070\nunos segundos.\n\n02:01.530 --> 02:06.330\nBien, entonces el algoritmo de\naprendizaje humano puede verse algo así.\n\n02:06.330 --> 02:11.550\nBásicamente, haces una suposición, luego\nesencialmente verificas tu respuesta\n\n02:11.550 --> 02:16.350\npara ver qué tan lejos estás de la\nrespuesta real, y después ajustas tu\n\n02:16.350 --> 02:21.090\nenfoque en otras características, y\nsimplemente sigues repitiendo este\n\n02:21.090 --> 02:26.240\nproceso hasta llegar a un punto en el\nque puedas distinguir entre diferentes\n\n02:26.240 --> 02:28.230\ngrupos sin que te den reglas.\n\n02:29.830 --> 02:34.370\nLo que resulta realmente interesante de\nlos humanos es que siempre buscamos lo\n\n02:34.370 --> 02:38.490\nque nos parece importante. Somos\ncuriosos por naturaleza y sentimos ese\n\n02:38.490 --> 02:42.960\nfuerte deseo de encontrar un significado\nprofundo al conectar diversas ideas.\n\n02:43.720 --> 02:48.720\nSi veo un cuadrado negro, pienso: 'me\nllama la atención', y me pregunto, ¿por\n\n02:48.720 --> 02:53.910\nqué ahí? Tengo curiosidad por saber cómo\nse conecta y qué significa todo. Cuando\n\n02:53.910 --> 02:58.650\nel algoritmo de aprendizaje humano actúa,\ntienes que hacer una suposición\n\n02:58.650 --> 03:00.090\nfundamentada, ¿verdad?\n\n03:00.850 --> 03:02.450\nPorque no sabes qué va a pasar.\n\n03:02.490 --> 03:04.210\nNo conoces las características.\n\n03:04.750 --> 03:08.160\nSi me preguntan:\n\"¿Va al grupo A o al B?\", digo:\n\n03:08.160 --> 03:13.450\n\"Al A, pues estamos empezando\". Aquí\nviene lo interesante. En el paso dos,\n\n03:13.450 --> 03:15.190\ncompruebas tu respuesta.\n\n03:16.000 --> 03:20.620\nEntonces, en el paso número dos, cuando\nhaces una suposición y ves el resultado,\n\n03:20.620 --> 03:24.480\neso te va a hacer sentir algo. Por\nejemplo, cuando dije que esto en\n\n03:24.480 --> 03:28.230\nrealidad es el grupo B, puedes ver que\nestoy un poco sorprendido.\n\n03:28.620 --> 03:29.340\nEstoy como,\n\n03:29.340 --> 03:31.750\n\"¿Eh, en serio? Quizás esto tenga que\n\n03:31.750 --> 03:33.970\nver con estar en el lado derecho.\"\n\n03:34.820 --> 03:39.700\nY lo interesante de comprobar las\nrespuestas es que lo que va a hacer es\n\n03:39.700 --> 03:44.780\ndarte una emoción, ya sea sentirte\nsorprendido, quizás curioso, interesado.\n\n03:45.010 --> 03:49.370\nSabes, sea lo que sea, al final te vas a\npreguntar, ¿qué significa todo esto y\n\n03:49.370 --> 03:50.560\ncómo se conecta todo?\n\n03:51.440 --> 03:55.010\nY luego, el paso número tres es cuando\nempiezas a ajustar tu enfoque.\n\n03:55.460 --> 03:59.840\nAsí que, según cómo te sentiste después\nde tu última suposición, eso va a\n\n03:59.840 --> 04:04.400\nafectar en qué te vas a enfocar en la\nsiguiente. Así que puedes ver aquí que\n\n04:04.400 --> 04:08.350\ncuando hago la misma pregunta,\n\"¿Esto va al grupo A o al grupo B?\"\n\n04:08.350 --> 04:09.020\nEstoy como,\n\n04:09.020 --> 04:11.030\n\"Eh, bueno, ahora está en el lado\n\n04:11.030 --> 04:13.220\nizquierdo, así que quizás esto tenga\n\n04:13.220 --> 04:15.220\nque ver con estar en el grupo A.\"\n\n04:16.420 --> 04:19.790\nY cuando digo que esto es correcto,\npuedes ver que inmediatamente me\n\n04:19.790 --> 04:20.540\nemociono mucho.\n\n04:20.700 --> 04:23.750\nEstoy como,\n\"Oh, creo que empiezo a entender esto,\"\n\n04:23.750 --> 04:28.210\n¿verdad? Y así, a medida que sigues\nrepitiendo este proceso, con el tiempo\n\n04:28.210 --> 04:32.430\nvas a aprender cuáles de estas\ncaracterísticas son las más importantes\n\n04:32.430 --> 04:36.830\npara distinguir los grupos. Bien,\nresulta que en realidad podemos simular\n\n04:36.830 --> 04:39.950\nestos algoritmos de aprendizaje en\nmáquinas también.\n"}, {"id": "lesson-3/06", "title": "El algoritmo de aprendizaje automático", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-06.mp4", "vtt": "WEBVTT\n\n00:01.020 --> 00:05.600\nBien, la última vez hablamos sobre cómo\npodemos simular estos algoritmos de\n\n00:05.600 --> 00:07.330\naprendizaje en las máquinas.\n\n00:07.950 --> 00:11.520\nY antes de entender eso, lo que\nnecesitamos comprender es qué es\n\n00:11.520 --> 00:15.820\nexactamente una característica. Entonces,\nlas características son simplemente\n\n00:15.820 --> 00:19.160\npiezas de información que nos ayudan a\ndistinguir las cosas.\n\n00:19.510 --> 00:21.570\nPor ejemplo, tomemos estas dos cosas\naquí.\n\n00:22.200 --> 00:25.560\nBueno, lo primero que noto es que son\ndiferentes en cuanto a su forma.\n\n00:25.930 --> 00:30.640\nUno de ellos es un cuadrado, el otro es\nun círculo, y también son diferentes en\n\n00:30.640 --> 00:31.610\ncuanto al color.\n\n00:32.010 --> 00:36.240\nAsí que este es en realidad un cuadrado\namarillo, y el que está a la derecha es\n\n00:36.240 --> 00:37.110\nun círculo azul.\n\n00:37.930 --> 00:42.120\nEntonces, básicamente, estas son\ncaracterísticas o información que me\n\n00:42.120 --> 00:46.870\nayudan a distinguir estas dos cosas. Y\nasí, la manera en que los humanos vemos\n\n00:46.870 --> 00:51.430\nlas características es que, cada vez que\nmiramos una imagen, básicamente la\n\n00:51.430 --> 00:55.190\ndescomponemos en diferentes\ncaracterísticas, y luego, de forma\n\n00:55.190 --> 00:59.320\nnatural, nos enfocamos en la que nos\nparece más importante, ¿verdad?\n\n00:59.970 --> 01:03.850\nAsí que, si observamos todas estas\ndiferentes características de esta\n\n01:03.850 --> 01:07.610\nimagen, lo que encontramos es que,\ndebido a que la posición de este\n\n01:07.610 --> 01:11.890\ncuadrado negro está sola y resalta,\nsimplemente parece ser la más importante\n\n01:11.890 --> 01:14.570\nentre todas estas otras características\ntambién.\n\n01:15.030 --> 01:19.250\nSin embargo, lo interesante de las\nmáquinas es que no adivinan basándose en\n\n01:19.250 --> 01:22.890\nsentimientos, sino que en realidad hacen\npredicciones calculadas.\n\n01:23.700 --> 01:27.470\nAsí que las máquinas no tratan estas\ncaracterísticas como sentimientos.\n\n01:27.540 --> 01:32.020\nEllas tratan estas características como\nnúmeros, ¿verdad? En realidad, no ven ni\n\n01:32.020 --> 01:32.750\nsienten nada.\n\n01:33.370 --> 01:37.180\nAsí que, por ejemplo, para poder\nprocesarlo, convierten el blanco en uno\n\n01:37.180 --> 01:38.200\ny el negro en cero.\n\n01:39.850 --> 01:43.820\nY una buena manera de ver realmente la\ndiferencia entre los humanos y las\n\n01:43.820 --> 01:47.610\nmáquinas y cómo procesamos las\ncaracterísticas es que, para un humano,\n\n01:47.610 --> 01:51.080\ncuando vemos algo que resalta, como un\ncuadrado negro, pensamos:\n\n01:51.080 --> 01:55.490\n\"Bueno, eso parece importante\", así que\nbásicamente vamos a hacer una suposición.\n\n01:56.520 --> 02:00.310\nAhora, lo interesante de las máquinas es\nque, cuando ellas, eh ...\n\n02:00.310 --> 02:02.690\npuedes ver aquí que en realidad no lo\nven.\n\n02:02.870 --> 02:07.470\nBásicamente convierten eso en números, y\nluego lo multiplican por algún tipo de\n\n02:07.470 --> 02:11.480\nimportancia, es decir, cuáles de estas\ncosas son más importantes para\n\n02:11.480 --> 02:15.670\ndeterminar el resultado, y entonces,\nesencialmente, hacen una predicción\n\n02:15.670 --> 02:16.260\ncalculada.\n\n02:16.660 --> 02:20.460\nNo te preocupes por las matemáticas, ¿de\nacuerdo? Lo importante que quiero que\n\n02:20.460 --> 02:23.430\nentiendas es que hay, hay, eh,\nsimplemente muchas matemáticas\n\n02:23.430 --> 02:24.760\ninvolucradas en el proceso.\n\n02:25.590 --> 02:30.450\nAsí que el algoritmo de entrenamiento de\naprendizaje automático, eh, puedes ver\n\n02:30.450 --> 02:35.250\nque tiene una cantidad similar de pasos,\ndonde haces una predicción calculada,\n\n02:35.250 --> 02:40.240\nluego mides el error, después ajustas tu\necuación matemática, y sigues repitiendo\n\n02:40.240 --> 02:41.050\neste proceso.\n\n02:42.010 --> 02:46.330\nEntonces, lo interesante del aprendizaje\nautomático es que básicamente calculan\n\n02:46.330 --> 02:47.610\nla predicción, ¿verdad?\n\n02:48.100 --> 02:52.390\nEntonces, en lugar de ver realmente la\ncaracterística, toman la característica\n\n02:52.390 --> 02:56.120\ny la multiplican por, bien, ¿qué tan\nimportante es cada una de estas\n\n02:56.120 --> 02:59.010\ncaracterísticas para determinar el\nresultado, verdad?\n\n02:59.470 --> 03:01.580\n¿Es principalmente la característica uno?\n\n03:01.680 --> 03:03.650\n¿Es principalmente la característica dos?\n\n03:03.730 --> 03:07.660\nY así sucesivamente, ¿verdad? Está\ntratando de decidir eso para ver cómo\n\n03:07.660 --> 03:08.880\nllega a esa respuesta.\n\n03:09.770 --> 03:13.330\nAsí que veamos el algoritmo de\naprendizaje automático en acción.\n\n03:13.330 --> 03:16.850\nEntonces, el primer paso es básicamente\ncalcular tu predicción.\n\n03:17.630 --> 03:22.110\nEntonces, comienzan calculando las\ncaracterísticas como números, y luego\n\n03:22.110 --> 03:26.210\nbásicamente las suman junto con valores\nde importancia aleatorios.\n\n03:26.550 --> 03:30.540\nPorque recuerda, al principio, sabes,\nmuy similar a los humanos, tuvimos que\n\n03:30.540 --> 03:34.360\nhacer una suposición al azar. Así que\ntambién estas máquinas, simplemente\n\n03:34.360 --> 03:38.440\nestán poniendo algo aleatorio sobre cuál\nde estas características es realmente\n\n03:38.440 --> 03:41.740\nimportante. Y así llegan a una especie\nde predicción calculada.\n\n03:42.730 --> 03:46.710\nEntonces, después de hacer esa\npredicción, tenemos que medir el error.\n\n03:47.310 --> 03:52.470\nAsí que lo que hace el modelo es que\nbásicamente compara qué tan lejos estuvo\n\n03:52.470 --> 03:57.690\nla predicción calculada de la respuesta\ncorrecta real, y a esta distancia es a\n\n03:57.690 --> 03:59.390\nlo que llamamos el error.\n\n04:00.230 --> 04:03.890\nEste error va a ser fundamental para\nnosotros porque lo utilizamos\n\n04:03.890 --> 04:07.940\ndirectamente para ajustar la importancia\nde cada característica de manera\n\n04:07.940 --> 04:12.170\ndistinta en nuestra ecuación, buscando\nasí tener menos error en la siguiente\n\n04:12.170 --> 04:13.410\npredicción del modelo.\n\n04:14.270 --> 04:18.830\nAsí que, básicamente, lo que hacemos es\ntomar ese error y luego, básicamente, lo\n\n04:18.830 --> 04:23.320\nactualizamos de manera diferente para\ncada característica para ver cuál es, eh,\n\n04:23.320 --> 04:26.490\neh, más importante a la hora de\ndeterminar el resultado.\n\n04:27.220 --> 04:31.150\nY luego, básicamente, llegamos a una\nespecie de ecuación actualizada que\n\n04:31.150 --> 04:33.650\nvamos a ir actualizando de manera\nreiterativa.\n\n04:34.430 --> 04:38.410\nY así, después de suficientes\nrepeticiones, básicamente tienes un\n\n04:38.410 --> 04:41.210\nmodelo entrenado que puede hacer\npredicciones.\n\n04:41.880 --> 04:46.320\nY así, puedes ver aquí que tenemos una\necuación matemática bien ajustada que\n\n04:46.320 --> 04:49.220\npuede tomar decisiones bastante precisas,\n¿verdad?\n\n04:49.460 --> 04:52.810\nPuedes ver que dice ochenta y siete por\nciento grupo B.\n\n04:52.810 --> 04:57.850\nAsí que la idea clave, y está bien si no\nentiendes las matemáticas detrás de esto,\n\n04:57.850 --> 05:02.190\nlo único que quiero que entiendas es que\nun modelo entrenado se basa en\n\n05:02.190 --> 05:03.620\necuaciones matemáticas.\n\n05:04.390 --> 05:08.390\nAsí que los modelos de IA entrenados\nbásicamente convierten los datos en\n\n05:08.390 --> 05:12.620\nnúmeros. Realizan muchos cálculos con\nesos datos, y luego también generan un\n\n05:12.620 --> 05:16.690\nnúmero que después se convierte en algo\nque un humano pueda entender, ¿de\n\n05:16.690 --> 05:17.140\nacuerdo?\n\n05:18.040 --> 05:23.310\nY por eso cada detalle de nuestra imagen\no de nuestros datos realmente importa,\n\n05:23.310 --> 05:28.260\nporque cada detalle es importante en los\nmodelos de IA, ya que cada número\n\n05:28.260 --> 05:30.490\nimporta en una ecuación, ¿verdad?\n\n05:31.060 --> 05:35.540\nLa IA no procesa la información de la\nmisma manera que nosotros, así que sus\n\n05:35.540 --> 05:39.610\npredicciones pueden no coincidir\nrealmente con nuestras expectativas,\n\n05:39.610 --> 05:44.030\n¿verdad? Así que puedes ver aquí que\ncada uno de estos puede representar un\n\n05:44.030 --> 05:46.600\nnúmero que vamos a calcular en esa\necuación.\n\n05:47.040 --> 05:51.210\nY esta idea se aplica en general a\ncualquier tipo de modelo de IA, ¿verdad?\n\n05:51.490 --> 05:55.140\nAsí que incluso, por ejemplo, los\nmodelos de lenguaje o las herramientas\n\n05:55.140 --> 05:59.200\nde IA conversacional, básicamente toman\ntus palabras, las convierten en números,\n\n05:59.200 --> 06:03.120\nhacen cálculos con ellos y luego los\nconvierten de nuevo en palabras para que\n\n06:03.120 --> 06:04.510\npuedas entenderlo, ¿verdad?\n\n06:05.330 --> 06:09.150\nAsí que básicamente, mucho de esto\nconsiste en hacer muchas matemáticas,\n\n06:09.150 --> 06:12.740\necuaciones y cálculos al final del día\npara llegar a una predicción.\n\n06:14.700 --> 06:18.870\nAsí que lo principal que quiero que\nentiendas es que la IA no es magia.\n\n06:19.100 --> 06:22.600\nBásicamente es matemáticas guiadas por\ndecisiones humanas.\n\n06:22.700 --> 06:27.180\nY digo esto no para restarle importancia,\nsino porque quiero que quede muy claro\n\n06:27.180 --> 06:30.800\nque realmente es solo matemáticas\nguiadas por decisiones humanas.\n\n06:31.010 --> 06:35.210\nPor ejemplo, cuando hablamos de la\nadaptabilidad de la IA, la IA se adapta\n\n06:35.210 --> 06:39.290\nbásicamente usando los algoritmos de\naprendizaje que fueron escritos por\n\n06:39.290 --> 06:41.650\nhumanos y que se ejecutan en una máquina.\n\n06:42.320 --> 06:47.040\nComo mencionamos y vimos, esto requiere\nmuchos cálculos matemáticos, lo cual\n\n06:47.040 --> 06:48.420\nconsume mucha energía.\n\n06:49.040 --> 06:53.220\nAsí que NearPod básicamente está usando\nla energía o, mejor dicho, está\n\n06:53.220 --> 06:56.200\ncalculando directamente en tu\ndispositivo, ¿verdad?\n\n06:56.460 --> 07:01.060\nLos cálculos complejos consumen mucha\nenergía, calentando tu dispositivo y\n\n07:01.060 --> 07:05.540\nagotando la batería. El costo ambiental\nde la IA es real; aunque NearPod\n\n07:05.540 --> 07:10.260\nfunciona en tu dispositivo, la mayoría\nde las IAs operan en centros de datos\n\n07:10.260 --> 07:14.740\nmasivos. Estos edificios consumen tanta\nenergía como ciudades y miles de\n\n07:14.740 --> 07:18.460\nmillones de galones de agua para\nenfriarse y procesar datos.\n\n07:18.460 --> 07:22.240\nDefinitivamente es un gran costo para\nnuestro medio ambiente.\n\n07:23.850 --> 07:2
