6.270\nLa otra cuestión es ahora la autonomía\nde la IA.\n\n07:26.480 --> 07:30.500\nBueno, la autonomía de la IA es como, ya\nsabes, la IA hace predicciones\n\n07:30.500 --> 07:34.110\nencontrando sus propios patrones en\nenormes cantidades de datos.\n\n07:34.900 --> 07:38.160\nY así, como humanos, básicamente\nproporcionamos ejemplos o\n\n07:38.160 --> 07:42.560\nretroalimentación para realmente ayudar\na guiar sus predicciones, ¿verdad? Por\n\n07:42.560 --> 07:46.560\nejemplo, tú fuiste quien recopiló los\ndatos para entrenar tu aplicación\n\n07:46.560 --> 07:47.020\nNearPod.\n\n07:47.380 --> 07:51.310\nAsí que, en realidad, sabes, en el\npanorama general, hay muchos humanos que\n\n07:51.310 --> 07:53.170\nestán realmente detrás de estas IA.\n\n07:53.640 --> 07:57.960\nSabes, con NearPod, eras solo tú o tal\nvez algunos otros amigos los que\n\n07:57.960 --> 08:02.760\nrecopilaban los datos, pero la mayoría\nde las IA requieren millones de personas\n\n08:02.760 --> 08:05.790\npara limpiar los datos y guiar esos\nmodelos de IA.\n\n08:06.110 --> 08:10.010\nY sin esas decisiones humanas, la\nmáquina simplemente no sabría cómo\n\n08:10.010 --> 08:11.990\nencontrar esos patrones correctos.\n\n08:12.190 --> 08:16.100\nAsí que, al final del día, lo que\nrealmente quieres entender sobre cómo\n\n08:16.100 --> 08:20.350\nfunciona la IA es que las herramientas\nde IA son en realidad solo un producto\n\n08:20.350 --> 08:21.800\nde las decisiones humanas.\n"}, {"id": "lesson-3/07", "title": "Cuestionario de repaso", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=es"}, {"id": "lesson-3/08", "title": "Hora del proyecto", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-3-08.mp4", "vtt": "WEBVTT\n\n00:00.360 --> 00:04.060\nBien, lección número tres, hora del\nproyecto. Así que es momento de que\n\n00:04.060 --> 00:06.230\nempieces a pensar en tus características.\n\n00:06.760 --> 00:10.510\nEntonces, basándote en los datos de la\nlección dos, quiero que pienses un poco\n\n00:10.510 --> 00:11.100\nmás a fondo.\n\n00:11.640 --> 00:15.850\nPiensa en las características clave que\nusaste para diferenciar tus grupos.\n\n00:16.450 --> 00:17.860\n¿Fue tal vez el color?\n\n00:18.240 --> 00:19.310\n¿Fue el tamaño?\n\n00:19.410 --> 00:20.340\n¿Fue la forma?\n\n00:20.420 --> 00:24.790\n¿Qué otras características estabas\nconsiderando que distinguían a tus\n\n00:24.790 --> 00:29.730\ngrupos? Bien, así que vas a responder\neso en la pregunta de la lección tres en\n\n00:29.730 --> 00:34.740\ntu hoja de trabajo, y si terminas antes,\nsigue mejorando tu clasificador de IA.\n\n00:35.120 --> 00:38.720\nSi tu profesor lo permite, sal a\nrecolectar más datos para que puedas\n\n00:38.720 --> 00:40.950\nseguir trabajando en tu clasificador de\nIA.\n\n00:41.330 --> 00:45.470\nAsí que recolecta más datos si es\nnecesario. Entonces, una respuesta de\n\n00:45.470 --> 00:49.540\nejemplo para la lección tres, que es\nidentificar características: ¿qué\n\n00:49.540 --> 00:53.320\ncaracterísticas usará tu clasificador\npara categorizar los datos?\n\n00:54.080 --> 00:57.910\nAsí que en este ejemplo, el estudiante\ndijo lo siguiente:\n\n00:57.910 --> 01:00.520\n\"Usaré el color, la forma y el tamaño.\n\n01:00.520 --> 01:03.120\nPor ejemplo, los plátanos son largos y\n\n01:03.120 --> 01:05.720\namarillos, las naranjas son redondas y\n\n01:05.720 --> 01:08.330\nnaranjas, y los aguacates son ovalados\n\n01:08.330 --> 01:10.860\ny verdes. Estas características hacen\n\n01:10.860 --> 01:12.920\nque sea fácil diferenciarlos.\"\n"}, {"id": "lesson-3/09", "title": "Hoja de trabajo", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=es"}]}, {"id": "lesson-4", "kicker": "Lección 4", "title": "Pueden las máquinas ser responsables", "items": [{"id": "lesson-4/01", "title": "Objetivos", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-01.mp4", "vtt": "WEBVTT\n\n00:00.180 --> 00:03.790\nBien, lección número cuatro: ¿Pueden las\nmáquinas ser responsables?\n\n00:04.450 --> 00:08.630\nAsí que lo que vamos a aprender en el\nobjetivo de la lección cuatro es que\n\n00:08.630 --> 00:12.990\nvamos a explicar cómo el sesgo en los\ndatos conduce a predicciones inexactas,\n\n00:12.990 --> 00:17.060\nexplicar por qué los humanos son\nresponsables de la IA y cómo reducir el\n\n00:17.060 --> 00:21.130\ndaño. Vamos a explicar formas sencillas\nde proteger la privacidad de las\n\n00:21.130 --> 00:24.620\npersonas y vamos a reconocer cómo el\nsesgo, la privacidad y la\n\n00:24.620 --> 00:27.600\nresponsabilidad se relacionan con una IA\nresponsable.\n"}, {"id": "lesson-4/02", "title": "El reto Bearly a Dog", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-02.mp4", "vtt": "WEBVTT\n\n00:00.100 --> 00:04.200\nVamos a hacer un reto llamado el desafío\napenas un perro, y tu objetivo es\n\n00:04.200 --> 00:08.580\nconstruir un modelo que distinga entre\nosos y perros y que pase todos los casos\n\n00:08.580 --> 00:09.140\nde prueba.\n\n00:09.760 --> 00:14.190\nLa restricción es que tienes 3 minutos,\npuedes elegir hasta 10 osos y puedes\n\n00:14.190 --> 00:15.540\nelegir hasta 10 perros.\n\n00:16.140 --> 00:20.120\nPara encontrar este desafío, debes\nvolver a la aplicación Neural Pocket.\n\n00:20.120 --> 00:24.440\nVas a ver algo llamado desafío de prueba\nde sesgo. Haz clic en él, haz clic en\n\n00:24.440 --> 00:28.930\ncomenzar desafío, e inmediatamente verás\nque puedes seleccionar hasta diez osos y\n\n00:28.930 --> 00:29.940\nhasta diez perros.\n\n00:30.820 --> 00:35.120\nY al igual que has estado usando Neural\nPocket, después de recolectar tus datos,\n\n00:35.120 --> 00:39.420\nvas a entrenamiento y luego a tu modelo,\ndonde vas a ejecutar todos los casos de\n\n00:39.420 --> 00:41.050\nprueba y ver si apruebas todo.\n\n00:42.050 --> 00:45.290\nBien, así que comencemos con este\ndesafío, y los veré al final.\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "Qué es el sesgo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-03.mp4", "vtt": "WEBVTT\n\n00:01.100 --> 00:04.960\nBien, así que bienvenidos de nuevo.\nDespués de jugar el reto de apenas un\n\n00:04.960 --> 00:06.680\nperro, aquí tienes una pregunta.\n\n00:07.330 --> 00:10.570\n¿Cuáles fueron tus resultados y por qué\ncrees que sucedieron?\n\n00:11.280 --> 00:13.690\n¿Lograste pasar todos los casos de\nprueba?\n\n00:13.850 --> 00:16.750\n¿Pasaste algunos de ellos? ¿Fallaste\ntodos?\n\n00:17.500 --> 00:20.590\nAsí que pausa el video y piénsalo por\nunos segundos.\n\n00:22.830 --> 00:27.370\nBien, si no pudiste pasar todos los\ncasos de prueba, esto podría deberse a\n\n00:27.370 --> 00:31.980\nun sesgo humano. Ahora, lo interesante\nde los humanos es que todos vemos el\n\n00:31.980 --> 00:36.590\nmundo de manera diferente porque, bueno,\ntodos tenemos experiencias de vida\n\n00:36.590 --> 00:40.820\ndistintas, y a esta perspectiva limitada\ndel mundo la llamamos sesgo.\n\n00:41.720 --> 00:44.090\nEsta imagen hace un buen trabajo\nexplicándolo.\n\n00:44.360 --> 00:48.600\nYa sabes, tienes a estas tres personas,\ny la persona de la izquierda tiene, como,\n\n00:48.600 --> 00:51.350\nla trompa del elefante y piensa que es\nuna serpiente.\n\n00:52.030 --> 00:56.000\nEh, la persona en el medio piensa que es\nuna pared, y la persona con la cola\n\n00:56.000 --> 00:58.060\npiensa que, básicamente, es una cuerda.\n\n00:58.540 --> 01:02.580\nAsí que todos tienen experiencias\ndiferentes con el mismo elefante, y esa\n\n01:02.580 --> 01:05.670\nes la razón por la que tienen esta\nperspectiva limitada.\n\n01:07.270 --> 01:11.580\nY lo que sucede es que nuestro sesgo o\nnuestra perspectiva limitada puede\n\n01:11.580 --> 01:15.640\nafectar realmente las características\nque elegimos en nuestros datos.\n\n01:15.860 --> 01:18.680\nPor ejemplo, tomemos el reto de 'apenas\nun perro'.\n\n01:18.780 --> 01:23.500\nAsí que tal vez alguien solo haya\nelegido osos negros y perros blancos\n\n01:23.500 --> 01:26.030\nporque quizás son los que más conoce.\n\n01:26.560 --> 01:30.650\nPero la realidad es que los osos también\npueden ser blancos, y los perros también\n\n01:30.650 --> 01:31.570\npueden ser negros.\n\n01:32.420 --> 01:37.000\nY lo que puede resultar de estos datos\nsesgados es algo llamado sesgo\n\n01:37.000 --> 01:37.800\nalgorítmico.\n\n01:38.060 --> 01:42.150\nAsí que, cada vez que unos datos\nsesgados muestran a la IA una visión\n\n01:42.150 --> 01:46.790\nlimitada en lugar de la imagen completa,\nesto básicamente conduce a resultados\n\n01:46.790 --> 01:51.540\ninexactos. Por ejemplo, aquí puedes ver\nque, recuerda que en nuestro conjunto de\n\n01:51.540 --> 01:56.050\ndatos, nos aseguramos de que todos los\nosos fueran negros y todos los perros\n\n01:56.050 --> 02:00.510\nfueran blancos. Así que cada vez que\nveía un animal blanco, lo asociaba con\n\n02:00.510 --> 02:01.050\nun perro.\n\n02:01.870 --> 02:06.820\nY cada vez que veía un animal negro, lo\nasociaba con un oso, ¿verdad? Así que,\n\n02:06.820 --> 02:11.840\nbásicamente, nuestro sesgo solo mostraba\nuna visión limitada en comparación con\n\n02:11.840 --> 02:12.610\nla realidad.\n\n02:14.800 --> 02:19.930\nAsí que sí, nuestro oso fue clasificado\nerróneamente como un perro. Ahora, lo\n\n02:19.930 --> 02:24.590\nque realmente quiero dejar claro es que,\nya sabes, ser parcial es algo\n\n02:24.590 --> 02:26.620\nperfectamente humano, ¿verdad?\n\n02:26.920 --> 02:31.340\nSolo empieza a ser un problema cuando\naplicas ese sesgo a otros sin considerar\n\n02:31.340 --> 02:33.350\nsus propias experiencias y valores.\n\n02:34.010 --> 02:38.640\nY básicamente, nuestros datos sesgados\npodrían guiar a nuestra IA a excluir\n\n02:38.640 --> 02:42.700\nprecisamente a las personas a las que en\nrealidad queremos ayudar.\n\n02:42.960 --> 02:46.510\nAlgunos ejemplos de esto podrían ser,\npor ejemplo, resultados médicos\n\n02:46.510 --> 02:47.500\ninexactos, ¿verdad?\n\n02:48.060 --> 02:52.390\nAsí que a veces la IA puede analizar\nradiografías y, ya sabes, si no logra\n\n02:52.390 --> 02:56.710\nanalizar suficientes pacientes durante\nel entrenamiento, en realidad puede\n\n02:56.710 --> 02:57.660\ncometer errores.\n\n02:58.360 --> 03:02.720\nAsí que puedes ver que dio una decisión\ndiagnóstica incorrecta. Y lo que pasa\n\n03:02.720 --> 03:06.970\ncon los médicos es que, si confían\ndemasiado en los resultados, ¿verdad?, y\n\n03:06.970 --> 03:11.050\nno los verifican dos veces, bueno,\nalguien podría recibir un diagnóstico\n\n03:11.050 --> 03:15.530\nequivocado, y eso podría ser realmente\ngrave. La otra cosa es que, de hecho, ha\n\n03:15.530 --> 03:19.600\nhabido casos en los que ha habido\narrestos, ¿verdad? A veces, el sistema\n\n03:19.600 --> 03:23.800\nde IA ha identificado erróneamente a\npersonas porque básicamente carece de\n\n03:23.800 --> 03:28.040\ndatos de entrenamiento completos sobre\ndiferentes tipos de rostros y razas.\n\n03:29.190 --> 03:32.950\nY esto en realidad ha llevado a que\npersonas como Robert William sean\n\n03:32.950 --> 03:34.720\narrestadas injustamente también.\n\n03:35.610 --> 03:39.910\nY esto ni siquiera se aplica solo a\nimágenes, sino también al lenguaje,\n\n03:39.910 --> 03:44.830\n¿verdad? A veces, las herramientas de IA\nfallan porque sus datos de entrenamiento\n\n03:44.830 --> 03:49.010\nno incluyen suficiente de ese idioma,\nese dialecto local o esa jerga.\n\n03:49.340 --> 03:53.520\nHubo, por ejemplo, una ocasión en la que\nun hombre saludó en árabe diciendo\n\n03:53.520 --> 03:57.860\nbuenos días, pero eso fue mal traducido\ncomo atáquenlos, lo que provocó que el\n\n03:57.860 --> 04:01.360\nhombre fuera arrestado injustamente,\naunque luego fue liberado.\n\n04:01.660 --> 04:06.680\nAsí que hay muchísimos casos diferentes\nen los que, cuando no tomamos en cuenta\n\n04:06.680 --> 04:11.190\nla experiencia o situación de otra\npersona, debido a nuestro sesgo, eso\n\n04:11.190 --> 04:12.920\npuede causar inexactitudes.\n\n04:13.200 --> 04:17.560\nAsí que aquí va mi pregunta para ti.\nCuando ocurren errores, ¿quién es\n\n04:17.560 --> 04:22.040\nresponsable, la IA o los humanos, y por\nqué crees eso? Responderemos esa\n\n04:22.040 --> 04:23.870\npregunta en el próximo video.\n"}, {"id": "lesson-4/04", "title": "Quién es responsable", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-04.mp4", "vtt": "WEBVTT\n\n00:00.600 --> 00:02.960\nMuy bien, echemos un vistazo a esta\npregunta.\n\n00:03.030 --> 00:07.380\nCuando ocurren errores, ¿quién es\nresponsable, la IA o los humanos?\n\n00:08.120 --> 00:11.880\nAhora, si no has tenido la oportunidad\nde pensar en esta pregunta, simplemente\n\n00:11.880 --> 00:14.570\npausa el video rápidamente y piénsalo\npor unos segundos.\n\n00:16.340 --> 00:21.170\nBien, una de las cosas más importantes\nque queremos que entiendas sobre estos\n\n00:21.170 --> 00:23.900\nsistemas de IA es que son solo\nherramientas.\n\n00:24.610 --> 00:27.290\nEn última instancia, las personas son\nresponsables.\n\n00:27.450 --> 00:30.980\nLas herramientas de IA no se preocupan\npor los resultados de sus acciones.\n\n00:31.060 --> 00:34.070\nPor lo que hemos visto, en el fondo es\nmucha matemática.\n\n00:34.540 --> 00:38.740\nEstá tratando de encontrar patrones\nentre sus entradas y salidas a través de\n\n00:38.740 --> 00:43.100\nuna ecuación matemática, así que no hay\nemociones ni sentimientos involucrados.\n\n00:43.100 --> 00:47.190\nY lo que hemos visto es que estas\nherramientas de IA se han utilizado para\n\n00:47.190 --> 00:51.110\nprovocar arrestos injustificados,\ndiagnosticar erróneamente a alguien e\n\n00:51.110 --> 00:55.300\nincluso causar accidentes mortales. Y la\nrazón de esto es porque es solo una\n\n00:55.300 --> 00:59.840\nherramienta, así que las personas que la\ncrean y la usan son, en última instancia,\n\n00:59.840 --> 01:01.520\nresponsables de lo que sucede.\n\n01:02.950 --> 01:07.350\nY ahora que entendemos que los humanos\nestán en el centro de esto, ¿cuáles son\n\n01:07.350 --> 01:11.300\nalgunas de las formas en que podemos\nreducir el daño causado por estos\n\n01:11.300 --> 01:12.270\nerrores de la IA?\n\n01:12.850 --> 01:15.770\nAsí que pausa el video y piensa en esto\npor unos segundos.\n\n01:17.520 --> 01:21.880\nPodemos analizar esto en términos de dos\nroles para los humanos y cómo pueden\n\n01:21.880 --> 01:25.500\nreducir estos daños: desde la\nperspectiva del creador y desde la\n\n01:25.500 --> 01:26.880\nperspectiva del usuario.\n\n01:27.680 --> 01:31.740\nAhora, como creador de estas\nherramientas de IA, es importante que\n\n01:31.740 --> 01:36.490\nañadas una variedad de datos de alta\ncalidad y diversos para reducir el sesgo\n\n01:36.490 --> 01:37.560\nlo mejor posible.\n\n01:37.830 --> 01:41.630\nPero recuerda, todos tenemos sesgos\nporque vemos las cosas desde\n\n01:41.630 --> 01:45.980\nperspectivas distintas, así que es\nfundamental escuchar a los demás y ser\n\n01:45.980 --> 01:49.370\nhonesto sobre las limitaciones de tus\nherramientas de IA.\n\n01:50.310 --> 01:55.020\nSi usas estas herramientas de IA,\nsiempre verifica los resultados cuando\n\n01:55.020 --> 01:59.800\nhaya riesgos en tu decisión y comparte\ntu feedback para mejorarlas. Ahora\n\n01:59.800 --> 02:04.640\npractiquemos en este ejercicio mejorando\nel clasificador de osos y perros.\n\n02:05.420 --> 02:09.340\nEntonces, además de las características\nde color blanco y negro de las que\n\n02:09.340 --> 02:12.930\nhablamos, donde mencionamos osos negros\ny perros blancos, ¿qué otras\n\n02:12.930 --> 02:17.060\ncaracterísticas y variaciones de esas\ncaracterísticas podrían ayudar a mejorar\n\n02:17.060 --> 02:20.980\nnuestro clasificador? Bien, así que\npausa el video y piensa en esto por un\n\n02:20.980 --> 02:24.310\nminuto, eh, y ve qué otras\ncaracterísticas y variedades de esas\n\n02:24.310 --> 02:26.720\ncaracterísticas también deberíamos\nconsiderar.\n\n02:30.210 --> 02:34.260\nBien, hay muchísimas cosas en las que\npodríamos pensar sobre cómo podemos\n\n02:34.260 --> 02:38.030\nreducir el sesgo y aportar más\nperspectiva a nuestros modelos de IA.\n\n02:38.320 --> 02:42.380\nPero, como has visto, hay una limitación\nen los osos y perros que tenemos. Así\n\n02:42.380 --> 02:45.980\nque, ya sabes, solo considerando\ndiferentes tipos de osos, diferentes\n\n02:45.980 --> 02:50.150\ntipos de perros, decidiendo si esos osos\ny perros están en su forma de bebé o de\n\n02:50.150 --> 02:54.160\nadulto, los diferentes entornos en los\nque se encuentran, y especialmente los\n\n02:54.160 --> 02:58.010\ndiferentes tamaños también. Y hay\nmuchísimas cosas en las que pensar, pero\n\n02:58.010 --> 03:00.810\nestas son algunas de las cosas que\npodrías considerar.\n"}, {"id": "lesson-4/05", "title": "Privacidad de datos", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-05.mp4", "vtt": "WEBVTT\n\n00:00.800 --> 00:04.690\nBien, entendemos que los datos diversos\nson importantes, pero solo porque\n\n00:04.690 --> 00:07.280\npodamos recopilar los datos, ¿deberíamos\nhacerlo?\n\n00:08.060 --> 00:11.840\nAhora, los datos pueden provenir de\ncualquier lugar, al igual que podemos\n\n00:11.840 --> 00:15.300\ntomar fotos en muchos sitios. Por\nejemplo, en esta foto del parque,\n\n00:15.300 --> 00:19.440\ntenemos imágenes de personas y perros, y\nestos son datos potenciales que podemos\n\n00:19.440 --> 00:21.070\nagregar a nuestro modelo de IA.\n\n00:21.880 --> 00:26.740\nSin embargo, no todos los datos están\ndisponibles para su uso, así que podemos\n\n00:26.740 --> 00:30.400\nverlo de dos maneras: datos públicos\nversus datos privados.\n\n00:31.070 --> 00:34.800\nEntonces, los datos públicos son\ninformación que cualquiera puede ver,\n\n00:34.800 --> 00:37.450\npero que puede tener reglas sobre cómo\nse utiliza.\n\n00:38.140 --> 00:42.190\nAhora, los datos privados son\ninformación que puede identificar a\n\n00:42.190 --> 00:47.180\nalguien o compartir algo personal sobre\nesa persona, y siempre requieren permiso\n\n00:47.180 --> 00:48.760\npara ser usados o vistos.\n\n00:50.090 --> 00:54.510\nAlgunos ejemplos de datos privados\npueden ser, por ejemplo, tu rostro, tus\n\n00:54.510 --> 00:58.630\ncorreos electrónicos y números de\nteléfono, tu información de salud o\n\n00:58.630 --> 01:03.410\nmédica, tu nombre o firma, información\nfinanciera e incluso tu dirección de casa.\n\n01:03.850 --> 01:07.610\nToda esta información puede proporcionar\ndatos personales sobre ti.\n\n01:07.700 --> 01:11.350\nAsí que quiero que pienses en esta\npregunta: ¿Qué pasaría si una\n\n01:11.350 --> 01:15.410\nherramienta de IA se entrenara con tus\nfotos personales sin tu permiso?\n\n01:16.220 --> 01:17.800\n¿Cómo te haría sentir eso?\n\n01:17.860 --> 01:21.340\nAsí que pon en pausa este video y piensa\nen esto por unos segundos.\n\n01:24.250 --> 01:27.260\nBien, tal vez sientas muchos tipos\ndiferentes de emociones.\n\n01:27.350 --> 01:31.730\nQuizás te sientas vulnerado, tal vez te\nsientas avergonzado, o incluso enojado.\n\n01:32.150 --> 01:36.450\nLo importante que hay que decir es que,\nsin importar la emoción que tengas,\n\n01:36.450 --> 01:40.690\ntienes derecho a tu privacidad, así que\ntienes derecho a controlar cómo se\n\n01:40.690 --> 01:42.550\nutiliza tu información personal.\n\n01:43.060 --> 01:47.640\nLo que sucede con los creadores es que\ndeben ser muy, muy claros sobre qué\n\n01:47.640 --> 01:51.230\ndatos recopilan y respetar tus\ndecisiones si dices que no.\n\n01:51.750 --> 01:55.380\nAsí que supongamos que tienes, ya sabes,\ndiferentes tipos de datos privados.\n\n01:55.380 --> 01:58.820\nPuedes darles permiso para ver tu rostro,\npero quizás no les des ninguna\n\n01:58.820 --> 02:01.090\ninformación para que vean tus datos\nfinancieros.\n\n02:02.890 --> 02:07.020\nPero la cuestión es que ha habido casos\nen los que los creadores han hecho un\n\n02:07.020 --> 02:10.780\nmal uso de los datos privados y han\nenfrentado consecuencias. Hubo una\n\n02:10.780 --> 02:14.370\nempresa llamada Alva Album que fue\nacusada de usar las fotos de las\n\n02:14.370 --> 02:18.560\npersonas para entrenar modelos de IA sin\nel permiso adecuado, y el gobierno de\n\n02:18.560 --> 02:22.640\nEstados Unidos se dio cuenta y les\nordenó eliminar sus datos y modelos de IA.\n\n02:24.950 --> 02:29.620\nAsí que, dado que ahora entendemos esto,\nte voy a hacer esta pregunta: ¿Cómo\n\n02:29.620 --> 02:34.040\npodemos proteger la privacidad al crear\ny usar estas herramientas de IA?\n\n02:34.780 --> 02:37.090\nPausa este video y piénsalo por unos\nsegundos.\n\n02:40.250 --> 02:44.850\nBien, podemos verlo desde dos roles:\ndesde la perspectiva del creador y desde\n\n02:44.850 --> 02:46.490\nla perspectiva del usuario.\n\n02:47.200 --> 02:51.970\nAhora, como creador, siempre debes pedir\npermiso antes de usar datos personales.\n\n02:52.390 --> 02:56.860\nDebes ser claro sobre cómo se van a usar\ny eliminar cualquier información\n\n02:56.860 --> 02:58.720\npersonal que no sea necesaria.\n\n02:59.360 --> 03:03.050\nAhora, desde la perspectiva del usuario,\ndebes leer cómo se utiliza tu\n\n03:03.050 --> 03:07.280\ninformación personal y hacer preguntas\nsobre cómo se está usando tu información.\n\n03:07.560 --> 03:11.850\nTienes derecho a tu información personal\ny puedes decir que no o limitar lo que\n\n03:11.850 --> 03:12.520\nse comparte.\n\n03:14.030 --> 03:18.040\nBien, hagamos este ejercicio sobre cómo\npodemos proteger la privacidad en\n\n03:18.040 --> 03:22.330\nnuestro clasificador de osos y perros.\nSupongamos que tenemos esta foto aquí y\n\n03:22.330 --> 03:26.020\nqueremos agregarla a nuestro\nclasificador de osos y perros, en este\n\n03:26.020 --> 03:27.130\ncaso, de este perro.\n\n03:27.530 --> 03:31.680\n¿Cómo te asegurarías de que esta foto\nrespete la privacidad antes de usarla en\n\n03:31.680 --> 03:33.940\nnuestro clasificador de osos versus\nperros?\n\n03:34.540 --> 03:37.920\nY solo para que lo sepas, este perro en\nla foto no tiene dueño.\n\n03:39.440 --> 03:42.770\nBien, así que pausa el video y piensa en\nesto por unos segundos.\n\n03:45.460 --> 03:49.610\nBien, el asunto es que encontramos\nalgunos datos privados dentro de esta foto.\n\n03:49.760 --> 03:53.570\nTenemos la dirección de la casa de esta\npersona, la matrícula de su auto y el\n\n03:53.570 --> 03:57.480\nrostro de la persona en la imagen. Así\nque supongamos que queremos usar la foto\n\n03:57.480 --> 03:58.190\ntal cual está.\n\n03:58.640 --> 04:01.320\nEn esos casos, siempre deberíamos pedir\npermiso.\n\n04:01.420 --> 04:05.140\nAhora bien, una vez que realmente\ntenemos esta foto, lo otro que debemos\n\n04:05.140 --> 04:08.550\nhacer es eliminar todos los datos\nprivados que no sean necesarios.\n\n04:08.720 --> 04:13.210\nLo importante de nuestro clasificador de\nosos y perros es que solo nos interesa\n\n04:13.210 --> 04:17.530\nel perro, así que esta es una forma de\nproteger la privacidad de la persona,\n\n04:17.530 --> 04:21.450\nsimplemente eliminando todos los datos,\ny también puedes difuminar la\n\n04:21.450 --> 04:24.730\ninformación privada si decides no\nrecortar toda la imagen.\n"}, {"id": "lesson-4/06", "title": "IA responsable", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-06.mp4", "vtt": "WEBVTT\n\n00:00.520 --> 00:04.860\nBien, entonces hablamos sobre la idea\ndel sesgo de datos y la privacidad de\n\n00:04.860 --> 00:09.560\nlos datos, y cómo, al final del día, los\nhumanos son responsables de estas cosas.\n\n00:10.140 --> 00:12.180\nA esto lo llamamos IA responsable.\n\n00:12.600 --> 00:16.380\nSe trata de asegurarse de que las\npersonas sean creadores responsables y\n\n00:16.380 --> 00:18.770\nusuarios críticos de estas herramientas\nde IA.\n\n00:19.470 --> 00:23.610\nY una de las cosas más importantes que\nquiero que recuerdes es que cada uno de\n\n00:23.610 --> 00:28.130\nnosotros juega un papel en la forma en\nque se crean y utilizan las herramientas de IA.\n\n00:28.700 --> 00:33.340\nRecuerda, y esto no es algo específico\nsolo de la IA, sino de la tecnología en\n\n00:33.340 --> 00:38.040\ngeneral, que la tecnología es realmente\nsolo el producto de decisiones humanas.\n"}, {"id": "lesson-4/07", "title": "Cuestionario de repaso", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=es"}, {"id": "lesson-4/08", "title": "Hora del proyecto", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/es-lesson-4-08.mp4", "vtt": "WEBVTT\n\n00:00.340 --> 00:04.410\nBien, es hora del proyecto para la\nlección número cuatro, nuestra última\n\n00:04.410 --> 00:04.870\nlección.\n\n00:05.640 --> 00:07.830\nAhora quiero que amplíes tu perspectiva.\n\n00:08.230 --> 00:12.240\nAsí que piensa en las características\nque usaste para distinguir entre los\n\n00:12.240 --> 00:16.640\ndiferentes grupos en la lección tres, y\nobserva cómo puedes agregar más variedad,\n\n00:16.640 --> 00:20.710\nexplorar otras características o incluso\nobtener retroalimentación de otras\n\n00:20.710 --> 00:22.460\npersonas para reducir ese sesgo.\n\n00:23.130 --> 00:27.260\nRecuerda, ningún clasificador es\nperfecto, y eso es simplemente parte de\n\n00:27.260 --> 00:31.900\ncómo funciona la inteligencia artificial.\nExplica su sesgo y explica cómo podrías\n\n00:31.900 --> 00:32.480\nreducirlo.\n\n00:33.830 --> 00:35.370\nAsí que esta es la última lección.\n\n00:35.530 --> 00:36.460\nFelicidades.\n\n00:36.860 --> 00:41.370\nAhora vas a trabajar en la pregunta de\nla lección cuatro, y si terminas antes y\n\n00:41.370 --> 00:45.830\ntu profesor lo permite, puedes seguir\ntrabajando en tu clasificador. Muy bien,\n\n00:45.830 --> 00:49.820\nesta es nuestra última pregunta:\nconstruir una inteligencia artificial\n\n00:49.820 --> 00:53.350\nresponsable. ¿Qué puedes hacer para\nagregar más variedad a tus\n\n00:53.350 --> 00:55.380\ncaracterísticas y reducir el sesgo?\n\n00:56.520 --> 00:58.390\nY esto fue lo que respondió el\nestudiante.\n\n00:58.720 --> 01:00.650\n\"Voy a tomar fotos de frutas de\n\n01:00.650 --> 01:02.950\ndiferentes lugares, para que la IA no\n\n01:02.950 --> 01:04.940\nsolo analice de un solo sitio, y\n\n01:04.940 --> 01:07.120\ntambién les pediré a mis amigos que\n\n01:07.120 --> 01:09.360\nrevisen si les funciona bien a ellos\n\n01:09.360 --> 01:11.720\ntambién. Y si uso la cara de alguien o\n\n01:11.720 --> 01:14.090\nalgo privado, primero pediré permiso.\"\n\n01:14.500 --> 01:18.550\nAsí que recuerda, de nuevo, volviendo al\ntema de la información privada. Si usas\n\n01:18.550 --> 01:22.440\ncualquier cosa que contenga información\npersonal, asegúrate de pedir permiso.\n"}, {"id": "lesson-4/09", "title": "Hoja de trabajo", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=4&lang=es"}]}, {"id": "resources", "kicker": "Para docentes y estudiantes", "title": "Recursos", "items": [{"id": "resources/1", "title": "Guía del profesor", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1QFGuJNEmzzcTu1SHwm1SOVTwwVHW25xTrZ9hAJdsFSs/preview", "size": 96198}, {"id": "resources/2", "title": "Hoja de trabajo", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1oSO2OdY3lIW3d5UnzakayuOuuUrwdscppLpnr0scUN4/preview", "size": 59062}, {"id": "resources/3", "title": "Hoja de trabajo (ejemplo)", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1r9N_38q0di7yE8Vo7HNDEIqvxMacMZoZra3v80LoXto/preview", "size": 70325}, {"id": "resources/4", "title": "Diapositivas", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/presentation/d/1Yyo5v3w6LcALin1hytiQtYKP4bp-EL5SmSydrLel9EE/preview", "size": 7437144}]}]};

    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), open = !!expanded[section.id];
      html += '<div class="group">' +
        '<button class="group-head" type="button" data-section="' + esc(section.id) + '" aria-expanded="' + open + '">' +
        '<span class="group-titles"><span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span></span>' +
        '<span class="g-count' + (sd === section.items.length ? ' all' : '') + '">' + sd + '/' + section.items.length + '</span>' +
        '<span class="flip">' + icon('chev', 'chev') + '</span></button><ol class="group-items">';
      section.items.forEach(function (item) {
        var cls = 'it' + (done[item.id] ? ' done' : '') + (current === item ? ' current' : '');
        html += '<li><a class="' + cls + '" href="#/' + esc(item.id) + '"' + (current === item ? ' aria-current="page"' : '') + '>' +
          '<span class="status">' + icon('check') + '</span>' +
          '<span class="it-title">' + esc(item.title) + (done[item.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
          '<span class="it-kind" title="' + esc(kindText(item.kind)) + '">' + icon(item.kind) + '</span></a></li>';
      });
      html += '</ol></div>';
    });
    html += appSettingsLink('side-link app-settings');
    html += '<div class="side-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</div>';
    sideContent.innerHTML = html;
  }
  sideContent.addEventListener('click', function (e) {
    var head = e.target.closest('.group-head');
    if (!head) return;
    var id = head.getAttribute('data-section');
    expanded[id] = !expanded[id];
    head.setAttribute('aria-expanded', String(expanded[id]));
  });
  function scrollCurrentIntoView() {
    var el = sideContent.querySelector('.it.current');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Mobile drawer ----------
  function openMenu() {
    sidebar.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true');
    scrollCurrentIntoView();
  }
  function closeMenu() {
    sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  scrim.addEventListener('click', closeMenu);

  // ---------- Views ----------
  function firstOpenItem(list) {
    for (var i = 0; i < list.length; i++) if (!done[list[i].id]) return list[i];
    return list[0];
  }

  function renderHome() {
    var total = items.length, n = countDone(items);
    var resume = byId[state.last] || null;
    var primary = n === total ? null : (resume && !done[resume.id] ? resume : firstOpenItem(items));
    var html = '<div class="home"><section class="hero">' +
      '<span class="kicker">' + esc(t('brand')) + '</span>' +
      '<h1 tabindex="-1">' + esc(COURSE.courseName) + '</h1>' +
      '<p>' + esc(n === total ? t('heroFinished') : t('heroText')) + '</p>' +
      '<div class="hero-progress">' + esc(t('activitiesDone', { done: n, total: total })) +
      '<div class="bar"><span style="width:' + (100 * n / total) + '%"></span></div></div>' +
      '<div class="hero-actions">' +
      (primary
        ? '<a class="btn" href="#/' + esc(primary.id) + '">' + icon('play') + '<span>' +
          esc(n === 0 ? t('startCourse') : t('continue', { title: primary.title })) + '</span></a>'
        : '') +
      '<button class="btn secondary" type="button" data-open-np><span class="np-icon" aria-hidden="true"></span>' + esc(t('openNeuroPocket')) + '</button>' +
      '</div></section>' +
      '<h2 class="section-title">' + esc(t('lessons')) + '</h2><div class="cards">';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), len = section.items.length;
      var tag = sd === len ? '<span class="tag done">' + esc(t('tagDone')) + '</span>'
        : sd ? '<span class="tag progress">' + esc(t('tagInProgress')) + '</span>'
        : '<span class="tag">' + esc(t('activities', { total: len })) + '</span>';
      html += '<a class="card" href="#/' + esc(firstOpenItem(section.items).id) + '">' + tag +
        '<span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span>' +
        '<span class="card-meta">' + esc(t('sectionDone', { done: sd, total: len })) +
        '<span class="bar"><span style="width:' + (100 * sd / len) + '%"></span></span></span></a>';
    });
    html += '</div><p class="home-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</p>' +
      appSettingsLink('chip-btn home-settings') + '</div>';
    return html;
  }

  var pdfInline = navigator.pdfViewerEnabled === true ||
    (navigator.pdfViewerEnabled === undefined && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent));

  function renderItem(item) {
    var section = item.section;
    var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
