  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

, "title": "تعارف", "items": [{"id": "intro/01", "title": "کورس میں خوش آمدید", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-intro-01.mp4", "vtt": "WEBVTT\n\n00:00.000 --> 00:05.600\nہیلو، اور LearnAIAnywhere.org کی جانب سے\nآرٹیفیشل انٹیلیجنس کے اس آف لائن فرسٹ کورس\n\n00:05.600 --> 00:10.500\nمیں خوش آمدید۔ ہم اساتذہ اور طلبہ کی ایک عالمی\nبرادری ہیں، اور ہمیں آپ کو یہاں پا کر بہت\n\n00:10.500 --> 00:15.640\nخوشی ہوئی ہے کیونکہ ہم ہر جگہ ہر کسی کے لیے\nاے آئی خواندگی کو قابلِ رسائی بنانے کے لیے\n\n00:15.640 --> 00:20.860\nکام کر رہے ہیں۔ اب اے آئی کے بارے میں جو\nکہانی ہم سنتے ہیں وہ یہ ہے کہ یہ انسانوں اور\n\n00:20.860 --> 00:26.560\nان اے آئی مشینوں کے درمیان مقابلہ ہے۔\nلیکن سچ یہ ہے کہ اے آئی دراصل انسانی\n\n00:26.560 --> 00:30.220\nانتخاب کا ہی ایک نتیجہ ہے۔ اور\nمشینوں کے برعکس، ہم انسان یہ انتخاب\n\n00:30.220 --> 00:33.440\nکرتے ہیں کہ ہمیں کن چیزوں کی\nپرواہ ہے، جیسے کہ ہماری اقدار اور\n\n00:33.440 --> 00:36.720\nہماری کمیونٹیز۔ ہمارے کورس کا\nمقصد اپنے سیکھنے والوں کو وہ\n\n00:36.720 --> 00:39.880\nعلم اور سمجھ بوجھ فراہم کرنا\nہے جس سے وہ ان اے آئی ٹولز کے\n\n00:39.880 --> 00:44.160\nذمہ دار تخلیق کار اور تنقیدی\nصارفین بن سکیں۔ آپ سیکھیں گے کہ\n\n00:44.160 --> 00:47.820\nآرٹیفیشل انٹیلیجنس اصل میں کیا\nہے، مشین لرننگ کے اہم حصے کیا\n\n00:47.820 --> 00:51.780\nہیں، مشین لرننگ کیسے کام کرتی ہے،\nاور ذمہ دارانہ اے آئی کے پیچھے\n\n00:51.780 --> 00:55.580\nکیا خیالات کارفرما ہیں۔ آپ یہ سب\nکچھ NeuroPocket کے ساتھ اپنا اے آئی\n\n00:55.580 --> 00:58.960\nکلاسیفائر ڈیزائن کر کے سیکھیں گے،\nجو اس بات کو سمجھنے کے لیے ایک\n\n00:58.960 --> 01:02.600\nمضبوط بنیاد فراہم کرتا ہے کہ\nبہت سے جدید اے آئی ٹولز کیسے کام\n\n01:02.600 --> 01:05.760\nکرتے ہیں۔ ہم اپنی اے آئی ڈیزائن\nایکٹیویٹی شیٹ کا استعمال کرتے\n\n01:05.760 --> 01:07.640\nہوئے اپنے چار اسباق کے ذریعے\n\n01:07.640 --> 01:09.460\nقدم بہ قدم آپ کی رہنمائی کریں گے۔\n\n01:09.460 --> 01:11.080\nکورس کے اختتام تک آپ اپنا\n\n01:11.080 --> 01:12.980\nاے آئی کلاسیفائر ڈیزائن کر لیں گے،\n\n01:12.980 --> 01:15.200\nاے آئی ٹولز کی فعالیت کو سمجھ سکیں گے،\n\n01:15.200 --> 01:17.420\nاور اپنا پروجیکٹ اور دلیل پیش کرنے\n\n01:17.420 --> 01:18.780\nکے لیے مکمل تیار ہوں گے۔\n\n01:18.780 --> 01:21.200\nآپ کو یہاں دیکھ کر خوشی ہوئی، خاص طور پر\n\n01:21.200 --> 01:23.160\nیہ جان کر کہ آپ دنیا بھر میں اے آئی کی\n\n01:23.160 --> 01:25.080\nتشکیل میں شامل ہیں۔ کلاس میں ملتے ہیں۔\n"}, {"id": "intro/02", "title": "پیشگی تقاضے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-intro-02.mp4", "vtt": "WEBVTT\n\n00:00.210 --> 00:02.450\nٹھیک ہے، کلاس میں خوش آمدید۔\n\n00:02.450 --> 00:04.830\nتو آپ کو دو چیزوں کی ضرورت ہوگی۔\n\n00:04.830 --> 00:09.410\nپہلی چیز یہ ہے کہ آپ کے پاس ایک ایسا\nآلہ ہونا چاہیے جس میں ویب کیم ہو۔\n\n00:09.410 --> 00:14.790\nتو یہ آلہ لیپ ٹاپ ہو سکتا ہے،\nٹیبلٹ ہو سکتا ہے یا فون ہو سکتا ہے۔\n\n00:14.790 --> 00:19.650\nاہم بات یہ ہے کہ اس میں ویب کیم ہو کیونکہ ہم\nاسے تصویریں لینے کے لیے استعمال کرنے والے ہیں۔\n\n00:19.650 --> 00:25.690\nتو جو ایپ ہم استعمال کرنے والے ہیں وہ\nNeuroPocket کہلاتی ہے، اور یہی وہ ایپ ہے جسے ہم\n\n00:25.690 --> 00:26.830\nاپنے امیج کلاسیفائر\n\n00:26.830 --> 00:28.750\nکو ڈیزائن کرنے کے لیے استعمال کریں گے۔\n\n00:29.230 --> 00:32.070\nتو آپ اسے آسانی سے آن\nلائن استعمال کر سکتے ہیں،\n\n00:32.070 --> 00:34.970\nیا اگر آپ اسے آف لائن\nاستعمال کرنا چاہتے ہیں\n\n00:34.970 --> 00:37.310\nتو ونڈوز اور اینڈرائیڈ ڈیوائسز کے لیے\n\n00:37.310 --> 00:38.310\nایپس دستیاب ہیں۔\n\n00:38.310 --> 00:40.450\nتو اگر آپ آئی فون استعمال کر رہے ہیں\n\n00:40.450 --> 00:43.530\nتو آپ کو اس کے بجائے ویب سائٹ\nکے ذریعے استعمال کرنا ہوگا۔\n\n00:44.610 --> 00:48.430\nدوسری بات یہ ہے کہ ہمارے پاس ایک\nاختیاری پروجیکٹ ورک شیٹ موجود ہے،\n\n00:48.430 --> 00:54.470\nاور یہ ورک شیٹ ہر سبق کے دوران اپنے اے آئی\nکلاسیفائر کو ڈیزائن کرنے میں ہماری رہنمائی\n\n00:54.470 --> 00:55.290\nفراہم کرے گی۔\n\n00:55.290 --> 00:58.590\nاور یقیناً اگر آپ اسے پرنٹ نہیں کرنا چاہتے\n\n00:58.590 --> 01:01.370\nتو آپ کاغذ کی ایک سادہ شیٹ\nبھی استعمال کر سکتے ہیں،\n\n01:01.370 --> 01:05.130\nاور یہ بھی وہی کام کرے گی کیونکہ\nسوالات بہت زیادہ طویل نہیں ہیں۔\n\n01:06.010 --> 01:09.090\nٹھیک ہے، تو پیشگی تقاضوں کے\nلیے ہمیں بس اتنا ہی چاہیے۔\n\n01:09.090 --> 01:11.210\nتو میں آپ لوگوں سے اگلی\nویڈیو میں ملتا ہوں۔\n"}, {"id": "intro/03", "title": "علامات کی کلید", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-intro-03.mp4", "vtt": "WEBVTT\n\n00:00.180 --> 00:05.220\nٹھیک ہے، LearnAIAnywhere.org کی جانب سے\nمصنوعی ذہانت، آرٹیفیشل انٹیلیجنس کے اس تعارفی\n\n00:05.220 --> 00:11.320\nسیشن میں خوش آمدید۔ تو تمام اسباق شروع کرنے سے\nپہلے آپ بائیں جانب نیچے کونے میں کچھ علامتیں\n\n00:11.320 --> 00:17.680\nدیکھیں گے۔ اگر آپ کو کتاب نظر آئے تو یہ محض\nایک علامت ہے کہ ہم کچھ سکھانے والے ہیں۔ اگر\n\n00:17.680 --> 00:22.220\nآپ کو کوئی بھاگتا ہوا نظر آئے تو اس کا مطلب\nہے کہ ہم کچھ انٹرایکٹو کرنے والے ہیں، جیسے\n\n00:22.220 --> 00:24.380\nکہ کوئی گیم یا عملی مشق۔ اور اگر\n\n00:24.380 --> 00:28.740\nآپ کو بادل نظر آئے تو اس کا مطلب ہے\nکہ ہم نے جو کچھ سیکھا ہے اس پر غور\n\n00:28.740 --> 00:32.280\nکرنے کا موقع ملے گا۔ ٹھیک ہے، میں\nآپ سب سے اگلے سبق میں ملوں گا۔\n"}]}, {"id": "lesson-1", "kicker": "سبق 1", "title": "مصنوعی ذہانت کیا ہے", "items": [{"id": "lesson-1/01", "title": "مقاصد", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-1-01.mp4", "vtt": "WEBVTT\n\n00:00.430 --> 00:05.930\nٹھیک ہے، مصنوعی ذہانت (آرٹیفیشل انٹیلیجنس)\nاصل میں کیا ہے، اس پر پہلے سبق میں خوش آمدید۔\n\n00:05.930 --> 00:11.790\nتو پہلے سبق کا مقصد یہ ہے کہ آپ ان اہم\nخصوصیات کی وضاحت کریں گے جو کسی چیز کو مصنوعی\n\n00:11.790 --> 00:17.250\nطور پر ذہین بناتی ہیں، اور پھر آپ مصنوعی ذہانت\nاور غیر مصنوعی ذہانت کی مثالوں کی نشاندہی کریں\n\n00:17.250 --> 00:18.490\nگے اور وجہ بتائیں گے۔\n"}, {"id": "lesson-1/02", "title": "مصنوعی ذہانت کیا ہے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-1-02.mp4", "vtt": "WEBVTT\n\n00:01.010 --> 00:07.450\nتو شروع کرنے سے پہلے اس سوال پر غور کریں: آپ\nکے خیال میں انسان کو کیا چیز ذہین بناتی ہے؟\n\n00:07.450 --> 00:13.680\nاب ویڈیو کو روکیں اور بس چند سیکنڈ\nکے لیے اس بارے میں سوچیں۔ ٹھیک\n\n00:13.680 --> 00:19.360\nہے، اب جب کہ آپ کے پاس کچھ وقت تھا، میں سب سے\nپہلے یہ کہنا چاہتا ہوں کہ انسانی ذہانت انتہائی\n\n00:19.360 --> 00:25.360\nپیچیدہ ہے، لیکن ہم دو اہم خصوصیات پر غور کر\nسکتے ہیں۔ انسان کو ذہین بنانے والی کچھ اہم\n\n00:25.360 --> 00:28.320\nخصوصیات اس کی خودمختاری\nاور مطابقت پذیری ہیں۔\n\n00:28.320 --> 00:30.940\nتو جب میں خودمختاری کہتا ہوں\n\n00:30.940 --> 00:33.900\nتو اس کا مطلب ہے کہ انسان خود عمل کرتا ہے\n\n00:33.900 --> 00:35.780\nاور اپنے فیصلے خود کرتا ہے۔\n\n00:35.780 --> 00:38.120\nاور جب میں مطابقت پذیری کی بات کرتا ہوں\n\n00:38.120 --> 00:40.040\nتو اس سے مراد تجربے سے سیکھنے\n\n00:40.040 --> 00:42.680\nاور خود کو بہتر بنانے کی انسانی صلاحیت ہے۔\n\n00:42.680 --> 00:44.560\nتو کچھ متجسس لوگوں نے سوچا\n\n00:44.560 --> 00:48.080\nکہ ہم مشینوں میں ذہانت کے ان\nپہلوؤں کو کیسے لا سکتے ہیں،\n\n00:48.080 --> 00:50.200\nاور یہیں سے مصنوعی ذہانت\n\n00:50.200 --> 00:52.040\n(اے آئی) کا شعبہ وجود میں آیا،\n\n00:52.040 --> 00:54.680\nجو ایسی ٹیکنالوجی بنانے کا مطالعہ ہے\n\n00:54.680 --> 00:56.860\nجو ذہین رویے کی نقل کرتی ہے۔\n\n00:57.580 --> 01:00.800\nتو کچھ اہم چیزیں جو\nاے آئی کو ذہین بناتی ہیں\n\n01:00.800 --> 01:04.240\nوہ بھی اس کی خودمختاری\nاور مطابقت پذیری ہی ہیں۔\n\n01:04.840 --> 01:07.240\nتو جب میں خودمختاری کی بات کرتا ہوں\n\n01:07.240 --> 01:08.720\nتو میرا مطلب صرف یہ ہے\n\n01:08.720 --> 01:11.640\nکہ ٹیکنالوجی کی آزادانہ طور پر مدد کرنے\n\n01:11.640 --> 01:13.080\nیا کام کرنے کی صلاحیت۔\n\n01:13.080 --> 01:15.540\nاور جب میں مطابقت پذیری کی بات کرتا ہوں\n\n01:15.540 --> 01:17.700\nتو یہ ٹیکنالوجی کی وہ صلاحیت ہے\n\n01:17.700 --> 01:20.240\nجس سے وہ مزید ڈیٹا کا تجزیہ کرتے ہوئے\n\n01:20.240 --> 01:21.480\nخود کو بہتر بناتی ہے۔\n\n01:21.480 --> 01:23.760\nتو ہم کچھ مثالوں کے بارے میں سوچ سکتے ہیں،\n\n01:23.760 --> 01:25.600\nجیسے کہ ہمارا سرچ انجن۔\n\n01:25.600 --> 01:27.740\nاگر آپ نے گوگل استعمال کیا ہے\n\n01:27.740 --> 01:29.700\nتو آپ اے آئی سے تعامل کر چکے ہیں۔\n\n01:29.700 --> 01:31.460\nیہ خودمختار ہے کیونکہ یہ\n\n01:31.460 --> 01:33.480\nالفاظ تجویز کر کے مدد کرتا ہے۔\n\n01:33.480 --> 01:35.120\nجیسا کہ آپ دیکھ سکتے ہیں،\n\n01:35.120 --> 01:38.040\nٹائپنگ کے دوران مجھے یہ\nتمام تجاویز مل رہی ہیں۔\n\n01:38.040 --> 01:39.780\nاور یہ مطابقت پذیر بھی ہے\n\n01:39.780 --> 01:41.640\nکیونکہ یہ لوگوں کی ماضی کی سرچز\n\n01:41.640 --> 01:43.380\nاور مزید ڈیٹا کا تجزیہ کر کے\n\n01:43.380 --> 01:45.400\nاپنی تجاویز کو بہتر بنا سکتا ہے۔\n\n01:46.840 --> 01:49.340\nاب اے آئی نہ ہونے کی ایک اچھی مثال\n\n01:49.340 --> 01:50.120\nکیلکولیٹر ہے۔\n\n01:50.120 --> 01:51.520\nیہ خودمختار نہیں ہے\n\n01:51.520 --> 01:54.140\nکیونکہ یہ صرف وہی کرتا\nہے جو آپ اسے بتاتے ہیں،\n\n01:54.140 --> 01:56.280\nلہٰذا آپ کو ہر اس کام کے لیے\n\n01:56.280 --> 01:57.560\nجو آپ کروانا چاہتے ہیں\n\n01:57.560 --> 01:59.480\nدستی طور پر بٹن دبانے پڑتے ہیں۔\n\n01:59.480 --> 02:02.260\nاور یہ خاص طور پر مطابقت پذیر نہیں ہے\n\n02:02.260 --> 02:04.380\nکیونکہ یہ نئے ڈیٹا کا تجزیہ نہیں کر سکتا\n\n02:04.380 --> 02:06.800\nاور یہ ہمیشہ ایک ہی طریقے سے کام کرتا ہے۔\n\n02:07.980 --> 02:09.360\nٹھیک ہے، اب آپ کی باری ہے۔\n\n02:09.360 --> 02:11.760\nآئیے \"اے آئی یا نہیں\" کا کھیل کھیلتے ہیں۔\n\n02:11.760 --> 02:14.160\nمیں ایک صورتحال بیان کرنے جا رہا ہوں۔\n\n02:14.160 --> 02:17.320\nآپ دیکھیں گے کہ کیا اس میں\nخودمختاری اور مطابقت پذیری ہے،\n\n02:17.320 --> 02:19.800\nفیصلہ کریں گے کہ یہ اے آئی ہے یا نہیں،\n\n02:19.800 --> 02:21.360\nاور اپنی وجہ بتائیں گے۔\n"}, {"id": "lesson-1/03", "title": "مصنوعی ذہانت ہے یا نہیں", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=ur"}, {"id": "lesson-1/04", "title": "مصنوعی ذہانت ہماری مدد کیسے کر سکتی ہے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-1-04.mp4", "vtt": "WEBVTT\n\n00:00.370 --> 00:06.330\nٹھیک ہے، تو \"اے آئی یا نہیں\" گیم کھیلنے\nکے بعد میرے پاس آپ کے لیے ایک سوال ہے۔\n\n00:06.330 --> 00:09.930\nیہ اے آئی کی مثالیں لوگوں\nکی کس طرح مدد کر رہی تھیں؟\n\n00:09.930 --> 00:13.710\nتو آپ ویڈیو کو روک کر چند سیکنڈ\nکے لیے اس بارے میں سوچ سکتے ہیں۔\n\n00:15.550 --> 00:19.470\nاے آئی ٹیکنالوجیز ہمارے کام\nکا معیار بہتر بنا سکتی ہیں،\n\n00:19.470 --> 00:25.490\nکچھ کام خود کر کے ہمیں دوسرے اہم کاموں کے\nلیے وقت دے سکتی ہیں، اور ہمارے تجربے کو بھی\n\n00:25.490 --> 00:26.970\nآسان بنا سکتی ہیں۔\n\n00:26.970 --> 00:31.810\nاے آئی ٹولز سے حقیقی مسائل حل\nکرنے والوں میں کسان شامل ہیں۔\n\n00:31.810 --> 00:36.930\nوہ PlantVillage Nuru جیسے ٹولز\nسے پودوں کے پتوں کی تصویر لے کر\n\n00:36.930 --> 00:40.710\nبیماری کی تشخیص اور علاج\nکے طریقے جان سکتے ہیں۔\n\n00:40.710 --> 00:44.010\nکچھ کسان Farmer Chat استعمال کرتے ہیں،\n\n00:44.010 --> 00:48.430\nجس سے وہ چیٹ بوٹ کے ذریعے\nکاشتکاری کے مشورے لے کر\n\n00:48.430 --> 00:52.550\nاپنی فصلوں اور مٹی کی دیکھ\nبھال کے بہتر فیصلے کر پاتے ہیں۔\n\n00:52.550 --> 00:55.330\nاگر ہم ڈاکٹروں کے تناظر میں دیکھیں\n\n00:55.330 --> 00:59.210\nتو بہت سے ڈاکٹر ایکس رے جیسی\nاے آئی امیجنگ کا استعمال کر رہے ہیں\n\n00:59.210 --> 01:04.110\nتاکہ بیماریوں کی ان بہت مشکل اور باریک\nعلامات کو تلاش کرنے میں مدد مل سکے،\n\n01:04.110 --> 01:07.050\nاور یہ انہیں بہتر فیصلے\nکرنے میں مدد دیتا ہے۔\n\n01:07.050 --> 01:12.530\nاور پھر Suki ایک ایسی چیز ہے جہاں ڈاکٹر\nاور مریض آپس میں بات چیت کر سکتے ہیں\n\n01:12.530 --> 01:15.610\nاور اے آئی بنیادی طور پر\nان کے لیے نوٹس لے لیتا ہے،\n\n01:15.610 --> 01:19.090\nجس سے ڈاکٹر کو مریضوں پر زیادہ\nتوجہ دینے کا موقع ملتا ہے۔\n\n01:20.610 --> 01:24.210\nتو ایک اہم بات جس پر ہم\nمسلسل زور دیتے رہیں گے\n\n01:24.210 --> 01:27.330\nوہ یہ ہے کہ اے آئی\nٹیکنالوجی ایک آلہ (ٹول) ہے۔\n\n01:27.330 --> 01:30.990\nاور میں یہ بات اے آئی کی صلاحیتوں\nکو کم کرنے کے لیے نہیں کہہ رہا ہوں،\n\n01:30.990 --> 01:34.470\nبلکہ ایک یاد دہانی کے طور پر کہہ\nرہا ہوں کہ ہم اس کے ذمہ دار ہیں،\n\n01:34.470 --> 01:37.550\nکیونکہ اصل بات یہ ہے کہ\nلوگ خود فیصلہ کرتے ہیں\n\n01:37.550 --> 01:40.930\nکہ وہ ان چیزوں کو اپنے مطلب کے\nکاموں کے لیے کیسے استعمال کریں۔\n"}, {"id": "lesson-1/05", "title": "جائزہ کوئز", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=ur"}, {"id": "lesson-1/06", "title": "پروجیکٹ کا وقت", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-1-06.mp4", "vtt": "WEBVTT\n\n00:00.210 --> 00:05.370\nٹھیک ہے، اب پروجیکٹ کا وقت ہے۔ تو اگر آپ\nکو PlantVillage Nuru یاد ہو، تو کسان پودوں\n\n00:05.370 --> 00:10.370\nکے پتوں کی بیماری کی تشخیص کے لیے اس اے آئی\nکلاسیفائر ٹول کا استعمال کرتے تھے، تاکہ یہ\n\n00:10.370 --> 00:13.190\nدیکھ سکیں کہ آیا ان کے\nپتے بیمار ہیں یا نہیں۔\n\n00:13.190 --> 00:17.450\nاور اب آپ کی باری ہے کہ آپ اپنا خود\nکا اے آئی کلاسیفائر ڈیزائن کریں۔\n\n00:17.450 --> 00:23.270\nاگلے تین اسباق میں آپ اپنی پسند کے کسی بھی\nموضوع پر اپنا اے آئی کلاسیفائر ڈیزائن کریں گے۔\n\n00:23.270 --> 00:24.950\nیہ پودوں کے پتے ہو سکتے ہیں،\n\n00:24.950 --> 00:26.570\nاسکول کا سامان ہو سکتا ہے،\n\n00:26.570 --> 00:28.490\nیا کچھ بھی جو آپ سوچ سکتے ہیں۔\n\n00:29.690 --> 00:32.690\nتو طلبہ کے کیے گئے کچھ\nکاموں کی مثال یہ ہے کہ\n\n00:32.690 --> 00:36.490\nکچھ نے اپنے اسکول کے باغ میں جا\nکر پودوں کے پتوں کی تصویریں لیں\n\n00:36.490 --> 00:38.530\nتاکہ وہ اپنے اسکول کے باغ میں موجود\n\n00:38.530 --> 00:40.910\nمختلف پودوں کے پتوں میں فرق کر سکیں،\n\n00:40.910 --> 00:45.610\nاور کچھ نے شیشے کے گلاس اور پلاسٹک کے\nگلاس جیسی چیزوں کی مختلف تصویریں لیں۔\n\n00:45.610 --> 00:47.790\nاور کچھ نے تو تخلیقی کام بھی کیا،\n\n00:47.790 --> 00:53.470\nجیسے کہ اشاروں کی زبان (سائن لینگویج)، جہاں\nانہوں نے ہاتھ کی مختلف پوزیشنز کی تصویریں لیں\n\n00:53.470 --> 00:55.870\nتاکہ یہ جان سکیں کہ وہ کون سے حروف ہیں۔\n\n00:56.770 --> 01:00.810\nتو ہر سبق کے بعد آپ اپنی ورک\nشیٹ پر اپنا جواب لکھیں گے۔\n\n01:00.810 --> 01:06.310\nاگر آپ کے پاس ورک شیٹ نہیں ہے تو بس اپنے جوابات\nلکھنے کے لیے کاغذ کا ایک سادہ ٹکڑا استعمال کریں،\n\n01:06.310 --> 01:09.810\nاور اگر ضرورت ہو تو آپ گروپس\nمیں مل کر بھی کام کر سکتے ہیں۔\n\n01:09.810 --> 01:15.670\nتو یہ رہی ورک شیٹ، اور اسباق مکمل کرنے\nکے بعد آپ کو یہ سب مکمل کر لینا چاہیے۔\n\n01:17.230 --> 01:21.970\nٹھیک ہے، تو تمام اسباق کے بعد آپ\nکو اپنی ورک شیٹ مکمل کر لینی چاہیے\n\n01:21.970 --> 01:26.210\nاور اپنے منتخب کردہ تھیم کے لیے اپنا\nاے آئی کلاسیفائر ڈیزائن کر لینا چاہیے۔\n\n01:26.210 --> 01:29.950\nاور ہو سکتا ہے کہ آپ کے استاد ایک\nاختیاری پریزنٹیشن کا دن مقرر کریں\n\n01:29.950 --> 01:33.510\nجہاں آپ اپنا اے آئی کلاسیفائر اور\nورک شیٹ کے جوابات پیش کر سکیں۔\n\n01:34.530 --> 01:38.970\nٹھیک ہے، تو چلیے ورک شیٹ پر پہلے\nسوال کا جواب دینا شروع کرتے ہیں۔\n\n01:40.450 --> 01:44.070\nتو آپ صرف سبق نمبر ایک کا\nجواب دینے سے شروعات کریں گے،\n\n01:44.070 --> 01:47.070\nجو کہ اپنے کلاسیفیکیشن\nتھیم کا انتخاب کرنا ہے۔\n\n01:47.070 --> 01:51.850\nتو ایک ایسا تھیم منتخب کریں جسے آپ اپنی اے آئی\nکلاسیفیکیشن کے لیے ایکسپلور کرنا چاہتے ہیں\n\n01:51.850 --> 01:54.430\nاور وضاحت کریں کہ آپ\nنے اسے کیوں منتخب کیا۔\n\n01:54.430 --> 01:57.090\nتو یہ ایک طالب علم کی لکھی\nہوئی تحریر کی مثال ہے:\n\n01:57.090 --> 02:02.430\n\"میں پھلوں کی درجہ بندی کرنا چاہتا ہوں کیونکہ\nمجھے پھل پسند ہیں اور انہیں تلاش کرنا آسان ہے۔\n\n02:02.430 --> 02:07.930\nمیرے اردگرد بہت سے لوگ پھل اگاتے ہیں، اس لیے میں\nاپنے پروجیکٹ کے لیے مختلف قسم کے پھل لا سکتا ہوں۔\"\n"}, {"id": "lesson-1/07", "title": "ورک شیٹ", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=ur"}]}, {"id": "lesson-2", "kicker": "سبق 2", "title": "مشین لرننگ کے اہم حصے", "items": [{"id": "lesson-2/01", "title": "مقاصد", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-2-01.mp4", "vtt": "WEBVTT\n\n00:00.080 --> 00:05.780\nٹھیک ہے، سبق نمبر دو میں خوش آمدید، جہاں ہم\nمشین لرننگ کے اہم حصوں کے بارے میں بات کریں\n\n00:05.780 --> 00:11.200\nگے۔ تو سبق نمبر دو کا مقصد یہ ہے کہ ہم یہ\nوضاحت کرنے کے قابل ہو جائیں گے کہ مشین لرننگ\n\n00:11.200 --> 00:16.380\nکیا ہے۔ ہم مشین لرننگ کے اہم حصوں کی نشاندہی\nکریں گے۔ ہم یہ بیان کریں گے کہ ہر حصہ کیا\n\n00:16.380 --> 00:21.720\nکرتا ہے اور وہ کیسے ایک ساتھ کام کرتے ہیں،\nاور آپ یہ وضاحت کریں گے کہ ڈیٹا اس بات پر کیسے\n\n00:21.720 --> 00:25.100\nاثر انداز ہوتا ہے کہ اے آئی\nکتنی اچھی طرح کام کرتا ہے۔\n"}, {"id": "lesson-2/02", "title": "مشین لرننگ کیا ہے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-2-02.mp4", "vtt": "WEBVTT\n\n00:00.370 --> 00:04.030\nٹھیک ہے، تو آپ امتحان کی\nتیاری اصل میں کیسے کرتے ہیں؟\n\n00:04.030 --> 00:06.990\nبس کچھ سیکنڈ کے لیے اس بارے میں سوچیں۔\n\n00:06.990 --> 00:12.210\nٹھیک ہے، تو جب کوئی انسان امتحان کی تیاری\nکر رہا ہوتا ہے تو سب سے پہلی چیز جو آپ کریں\n\n00:12.210 --> 00:17.950\nگے وہ یہ ہے کہ آپ کو کچھ معلومات اکٹھی کرنی\nہوں گی، اور وہ معلومات کلاس میں لیے گئے نوٹس\n\n00:17.950 --> 00:19.170\nکی شکل میں ہو سکتی ہیں۔\n\n00:19.170 --> 00:23.470\nتو ایک بار جب آپ کے پاس اپنے نوٹس آ\nجائیں تو آپ ان نوٹس کا مطالعہ کریں گے،\n\n00:23.470 --> 00:28.410\nاور ہوتا یہ ہے کہ آپ کا دماغ ان نئی\nمعلومات کو آپ کے ذاتی تجربات سے جوڑتا ہے\n\n00:28.410 --> 00:30.750\nتاکہ دنیا کو بہتر طور پر سمجھ سکے۔\n\n00:30.750 --> 00:36.430\nاور پھر وقت کے ساتھ ساتھ ہوتا یہ ہے کہ آپ\nامتحان دینے کے لیے بہتر طور پر تیار ہو جاتے ہیں،\n\n00:36.430 --> 00:40.970\nکیونکہ آپ نئی معلومات کو اپنے\nپچھلے علم کے ساتھ جوڑ رہے ہوتے ہیں۔\n\n00:41.930 --> 00:45.130\nتو امتحان کی تیاری کے چار حصے ہیں: دماغ،\n\n00:45.130 --> 00:47.450\nتو دماغ بنیادی طور پر نوٹس لیتا ہے،\n\n00:47.450 --> 00:49.470\nآپ ان نوٹس کا مطالعہ کرتے ہیں،\n\n00:49.470 --> 00:53.930\nاور پھر نتیجے کے طور پر آپ کا دماغ\nامتحان دینے کے لیے زیادہ تیار ہو جاتا ہے۔\n\n00:54.630 --> 00:58.130\nاور اس طرح دماغ ہی وہ چیز\nہے جو سیکھنے کا عمل کرتی ہے۔\n\n00:58.130 --> 01:01.650\nنوٹس بنیادی طور پر وہ معلومات\nہیں جن کا آپ مطالعہ کریں گے۔\n\n01:01.650 --> 01:06.470\nمطالعہ بنیادی طور پر ان نئے خیالات\nکو اس علم سے جوڑنے کا وقت اور عمل ہے\n\n01:06.470 --> 01:07.850\nجو آپ پہلے سے رکھتے ہیں،\n\n01:07.850 --> 01:11.070\nاور اس کا نتیجہ ایک تیار شدہ\nدماغ کی صورت میں نکلتا ہے۔\n\n01:11.070 --> 01:13.870\nتو جب آپ ان نوٹس کا\nمطالعہ مکمل کر لیتے ہیں\n\n01:13.870 --> 01:17.090\nتو آپ بنیادی طور پر امتحان\nدینے کے لیے تیار ہو جاتے ہیں۔\n\n01:17.890 --> 01:22.810\nاور اسی لیے انسانی سیکھنے کا عمل، اور\nانسانی سیکھنے کا بنیادی تصور یہ ہے\n\n01:22.810 --> 01:27.290\nکہ آپ نئی معلومات کو اپنے ذاتی تجربات\nسے جوڑ کر سمجھ بوجھ پیدا کرتے ہیں\n\n01:27.290 --> 01:29.510\nتاکہ آپ دنیا کو بہتر طور پر سمجھ سکیں۔\n\n01:29.510 --> 01:31.330\nتو انسانی سیکھنے کا عمل\n\n01:31.330 --> 01:33.050\nمشین لرننگ کے مقابلے میں\n\n01:33.050 --> 01:34.110\nاصل میں کیسا ہے؟\n\n01:34.110 --> 01:36.910\nدیکھیں، مشین لرننگ کے\nبارے میں خاص بات یہ ہے،\n\n01:36.910 --> 01:39.150\nاور ہم اس کی مزید تفصیلات میں جائیں گے\n\n01:39.150 --> 01:40.790\nکہ اس سے ہماری کیا مراد ہے،\n\n01:40.790 --> 01:42.270\nکہ یہ بنیادی طور پر\n\n01:42.270 --> 01:43.950\nڈیٹا میں پیٹرنز تلاش کرنے\n\n01:43.950 --> 01:45.530\nاور پیش گوئیاں کرنے کے لیے\n\n01:45.530 --> 01:47.550\nریاضیاتی ہدایات کا استعمال کرتی ہے۔\n\n01:47.550 --> 01:49.750\nاور مشین لرننگ کے کچھ حصوں میں سے\n\n01:49.750 --> 01:51.650\nایک یہ ہے کہ اس میں ایک ماڈل ہوتا ہے۔\n\n01:51.650 --> 01:57.690\nوہ ماڈل ڈیٹا لیتا ہے، اور بنیادی طور پر ٹریننگ\nوہ عمل ہے جہاں ہم اس ڈیٹا میں پیٹرنز تلاش\n\n01:57.690 --> 01:58.810\nکرنے کی کوشش کرتے ہیں،\n\n01:58.810 --> 02:03.610\nاور پھر آپ کے پاس ایک ٹرینڈ ماڈل ہوتا ہے، جیسے\nکہ پودوں کی بیماریوں کی درجہ بندی کرنے والا،\n\n02:03.610 --> 02:08.670\nجو پودوں کی بیماریوں کی پیش گوئی کر سکتا ہے\nیا یہ بتا سکتا ہے کہ پودا بیمار ہے یا نہیں۔\n\n02:08.670 --> 02:11.970\nتو مشین لرننگ کے چار\nاہم حصوں کی تفصیل یہ ہے\n\n02:11.970 --> 02:14.590\nکہ ماڈل وہ چیز ہے جو پیٹرن کو پکڑے گا۔\n\n02:14.590 --> 02:17.330\nڈیٹا بس وہ معلومات ہے جو\nہم ماڈل کو فراہم کرتے ہیں\n\n02:17.330 --> 02:18.510\nجس پر وہ ٹریننگ کرے گا۔\n\n02:19.330 --> 02:21.350\nٹریننگ بنیادی طور پر وہ عمل ہے\n\n02:21.350 --> 02:25.630\nجسے ماڈل ڈیٹا کا تجزیہ کر کے پیٹرنز\nتلاش کرنے کے لیے استعمال کرتا ہے۔\n\n02:25.630 --> 02:28.930\nاور ایک بار پھر، ٹرینڈ ماڈل بنیادی طور پر\n\n02:28.930 --> 02:31.670\nماڈل کی ٹریننگ مکمل ہونے\nکے بعد کا نتیجہ ہوتا ہے،\n\n02:31.670 --> 02:34.810\nاور اس طرح یہ پیش گوئیاں\nکرنے کے لیے تیار ہو جاتا ہے۔\n\n02:36.350 --> 02:40.510\nتو اگرچہ مشین معلومات کو\nمختلف طریقے سے پروسیس کرتی ہے،\n\n02:40.510 --> 02:44.750\nلیکن درحقیقت دونوں پھر بھی\nملتے جلتے حصے رکھتے ہیں، ہے نا؟\n\n02:44.750 --> 02:50.310\nتو دماغ سے ماڈل، نوٹس سے ڈیٹا، پڑھائی\nسے ٹریننگ، تیار دماغ سے ٹرینڈ ماڈل۔\n\n02:50.310 --> 02:52.190\nوہ بالکل ایک جیسے تو نہیں ہیں،\n\n02:52.190 --> 02:57.110\nلیکن وہ سیکھنے کے بنیادی طریقۂ کار کے\nلحاظ سے ملتے جلتے مراحل ضرور رکھتے ہیں۔\n"}, {"id": "lesson-2/04", "title": "NeuroPocket کیسے استعمال کریں", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-2-04.mp4", "vtt": "WEBVTT\n\n00:00.240 --> 00:06.180\nٹھیک ہے، تو ہم نے مشین لرننگ کے اہم حصوں کے\nبارے میں بات کی، جیسے ماڈل، ڈیٹا، ٹریننگ اور\n\n00:06.180 --> 00:12.380\nٹرینڈ ماڈل، لیکن یہ دیکھنا واقعی مشکل ہے\nکہ یہ مختلف حصے آپس میں کیسے جڑتے ہیں۔ تو\n\n00:12.380 --> 00:17.500\nآئیے دیکھتے ہیں کہ یہ اہم حصے NeuroPocket کے\nساتھ ایک اے آئی کلاسیفائر ڈیزائن کر کے کیسے\n\n00:17.500 --> 00:23.500\nاکٹھے ہوتے ہیں۔ تو آخر NeuroPocket ہے\nکیا؟ NeuroPocket ایک اے آئی ایپ ہے جہاں آپ\n\n00:23.500 --> 00:25.720\nتصاویر شامل کر سکتے ہیں، ایک ماڈل\n\n00:25.720 --> 00:27.640\nکو ٹرین کر سکتے ہیں، اور دیکھ سکتے ہیں\n\n00:27.640 --> 00:29.560\nکہ اے آئی چیزوں کو کیسے پہچانتا ہے۔\n\n00:29.560 --> 00:31.980\nاور آپ طلبہ کی مثالوں میں\n\n00:31.980 --> 00:34.360\nNeuroPocket کی کچھ مثالیں\nپہلے ہی دیکھ چکے ہیں۔\n\n00:34.360 --> 00:35.760\nآپ نے دیکھا ہے کہ طلبہ\n\n00:35.760 --> 00:37.560\nپودوں کے مختلف پتوں کے درمیان\n\n00:37.560 --> 00:38.900\nفرق کرنے کے قابل تھے،\n\n00:38.900 --> 00:41.400\nوہ مختلف مواد کے درمیان فرق کر سکتے تھے،\n\n00:41.400 --> 00:43.340\nاور یہاں تک کہ اشاروں کی زبان\n\n00:43.340 --> 00:44.540\n(سائن لینگویج) میں بھی۔\n\n00:44.540 --> 00:47.960\nتو ہم ہر قدم کو ساتھ مل کر مکمل کرتے ہوئے\n\n00:47.960 --> 00:49.180\nNeuroPocket سیکھیں گے۔\n\n00:49.760 --> 00:52.180\nلہٰذا جیسے جیسے آپ ہر قدم سے گزریں،\n\n00:52.180 --> 00:54.100\nبلا جھجک ویڈیو کو روک دیں\n\n00:54.100 --> 00:56.340\nتاکہ آپ اگلے قدم پر جانے سے پہلے\n\n00:56.340 --> 00:58.060\nاپنا کام یا وہ مرحلہ\n\n00:58.060 --> 00:58.980\nمکمل کر سکیں۔\n\n00:58.980 --> 01:01.580\nاور یقیناً اگر آپ گروپس میں\n\n01:01.580 --> 01:03.100\nیا کلاس روم میں کام کر رہے ہیں،\n\n01:03.100 --> 01:04.880\nاگر آپ جلدی ختم کر لیتے ہیں\n\n01:04.880 --> 01:07.000\nتو بس اپنے اردگرد دوسروں کی مدد کریں\n\n01:07.000 --> 01:09.120\nتاکہ ہم سب مل کر اگلے مرحلے پر\n\n01:09.120 --> 01:10.100\nتیزی سے جا سکیں۔\n\n01:11.820 --> 01:15.000\nٹھیک ہے، تو سب سے پہلی چیز\nجو میں کروں گا وہ یہ ہے\n\n01:15.000 --> 01:16.680\nکہ اپنی NeuroPocket ایپ کھولوں گا،\n\n01:16.680 --> 01:19.380\nاور میں پروجیکٹ کا نام \"اسکول\nسپلائیز پروجیکٹ\" رکھوں گا۔\n\n01:19.380 --> 01:21.460\nیہ کوئی بھی نام ہو سکتا ہے جو آپ چاہیں،\n\n01:21.460 --> 01:23.280\nیہ صرف آپ کے پروجیکٹ کا نام ہے۔\n\n01:23.280 --> 01:25.920\nاور ایک بار جب آپ Create پر کلک کریں گے\n\n01:25.920 --> 01:28.120\nتو یہ آپ کو اس پروجیکٹ کے اندر لے جائے گا۔\n\n01:28.120 --> 01:30.660\nتو میں دراصل دو سے زیادہ\nگروپس بھی رکھ سکتا ہوں۔\n\n01:30.660 --> 01:35.100\nمیرے معاملے میں، میں قینچی اور پین\nکے درمیان درجہ بندی کرنا چاہتا ہوں۔\n\n01:35.720 --> 01:38.580\nاب جب میں نے کم از کم\nاپنے دو گروپس بنا لیے ہیں\n\n01:38.580 --> 01:42.360\nتو اب میں ان میں سے ہر گروپ کے\nلیے کچھ تصاویر شامل کروں گا۔\n\n01:42.360 --> 01:44.740\nتو میرے معاملے میں\nچونکہ میرے پاس قینچی ہے،\n\n01:44.740 --> 01:46.640\nمیں قینچی کی کچھ تصاویر لوں گا۔\n\n01:46.640 --> 01:49.160\nاس معاملے میں میں نے تقریباً چھ تصاویر لیں\n\n01:49.160 --> 01:51.100\nاور پھر میں نے تصاویر شامل کر دیں۔\n\n01:51.100 --> 01:53.500\nاگر آپ چاہیں تو اس سے\nزیادہ بھی لے سکتے ہیں۔\n\n02:00.660 --> 02:04.020\nجیسا کہ میں نے کہا، اگر آپ چاہیں تو\nآپ کے پاس سینکڑوں تصاویر ہو سکتی ہیں۔\n\n02:04.020 --> 02:09.500\nمیں بس جلدی کر رہا ہوں۔ آپ تصاویر شامل\nکریں گے اور گروپس میں ڈیٹا ڈال دیں گے۔\n\n02:09.500 --> 02:15.600\nآپ دو سے زیادہ گروپس بھی رکھ سکتے ہیں، جیسے\nربڑ (ایریزر) کا گروپ، لیکن آسانی کے لیے ہم\n\n02:15.600 --> 02:16.900\nاسی پر قائم رہیں گے۔\n\n02:16.900 --> 02:21.680\nپھر آپ ٹریننگ کی طرف بڑھیں گے اور پھر\nآپ بس Train Model کے بٹن پر کلک کریں گے،\n\n02:21.680 --> 02:23.420\nاور اس میں کچھ منٹ لگیں گے،\n\n02:23.420 --> 02:25.340\nاس لیے ہم بس انتظار کریں گے۔\n\n02:33.560 --> 02:35.880\nٹھیک ہے، تو اب اپنے ماڈل کو ٹیسٹ کرتے ہیں۔\n\n02:35.880 --> 02:37.500\nتو میں سب سے پہلے یہ کروں گا\n\n02:37.500 --> 02:40.600\nکہ میں اپنے پین کی ایک مختلف\nپوزیشن میں تصویر لوں گا\n\n02:40.600 --> 02:44.080\nاور دیکھوں گا کہ کیا یہ اسے\nصحیح طریقے سے کلاسیفائی کرتا ہے۔\n\n02:44.080 --> 02:46.000\nیہ بتا رہا ہے کہ یہ ایک پین ہے۔\n\n02:46.000 --> 02:49.020\nاب میں قینچی کو مختلف\nپوزیشن میں ٹیسٹ کروں گا،\n\n02:49.020 --> 02:50.660\nیہ اسے کلاسیفائی کرے گا،\n\n02:50.660 --> 02:52.440\nاور واقعی قینچی ہی بتائے گا۔\n\n02:52.440 --> 02:54.700\nتو یہ ہے آپ کا اے آئی کلاسیفائر،\n\n02:54.700 --> 02:56.500\nجسے بہتر بنانے کے لیے آپ\n\n02:56.500 --> 02:58.200\nمزید ڈیٹا شامل کر سکتے ہیں۔\n"}, {"id": "lesson-2/03", "title": "NeuroPocket کھولیں", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "مصنوعی ذہانت کے ٹولز غلطیاں کر سکتے ہیں", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-2-05.mp4", "vtt": "WEBVTT\n\n00:00.400 --> 00:05.840\nٹھیک ہے، تو واپسی پر خوش آمدید۔ تو NeuroPocket\nکے ساتھ کچھ وقت گزارنے کے بعد، کیا آپ کا\n\n00:05.840 --> 00:07.880\nاے آئی کلاسیفائر ہمیشہ درست تھا؟\n\n00:07.880 --> 00:11.240\nاور اگر نہیں، تو آپ کے خیال\nمیں اس نے وہ غلطی کیوں کی؟\n\n00:11.240 --> 00:15.020\nتو بلا جھجک ویڈیو کو روکیں اور\nاس بارے میں چند سیکنڈ سوچیں۔\n\n00:17.820 --> 00:23.320\nٹھیک ہے، تو اے آئی ٹولز کے بارے میں بات یہ\nہے کہ وہ آپ کو غیر متوقع نتائج دے سکتے ہیں۔\n\n00:23.320 --> 00:27.040\nجو چیز آپ کے لیے واضح ہوگی وہ\nاے آئی ٹول کے لیے واضح نہیں ہوگی۔\n\n00:27.040 --> 00:31.280\nتو اے آئی ٹولز کے بارے میں بات یہ\nہے کہ وہ انسانوں کی طرح نہیں سمجھتے،\n\n00:31.280 --> 00:36.640\nاس لیے انہیں پیٹرنز تلاش کرنے کے لیے تصویر\nکی ہر ایک تفصیل کا تجزیہ کرنا پڑتا ہے۔\n\n00:36.640 --> 00:41.560\nاور بعض اوقات اس کا مطلب یہ ہوتا ہے\nکہ وہ ایسے پیٹرنز تلاش کر لیتے ہیں\n\n00:41.560 --> 00:45.180\nیا استعمال کرتے ہیں جن پر ہم\nنے پہلے غور نہیں کیا ہوتا۔\n\n00:45.180 --> 00:50.020\nتو مثال کے طور پر آپ یہاں دیکھ سکتے ہیں\nکہ ہمارے پاس واضح طور پر ایک قینچی ہے،\n\n00:50.020 --> 00:55.560\nلیکن چونکہ یہ اسی پوزیشن میں ہے جہاں یہاں\nرنگین پینسل ہے اور اس کا رنگ بھی وہی ہے،\n\n00:55.560 --> 00:58.640\nتو اسے رنگین پینسل کے طور\nپر درجہ بندی کیا گیا ہے۔\n\n00:58.640 --> 01:04.040\nاور اے آئی سسٹمز کے بارے میں بات یہ ہے کہ وہ\nاپنے ڈیٹا کی وجہ سے کافی حد تک محدود ہوتے ہیں۔\n\n01:04.040 --> 01:10.120\nوہ دراصل صرف اسی چیز کی بنیاد پر پیش گوئی\nکر سکتے ہیں جس کا وہ پہلے تجزیہ کر چکے ہوں۔\n\n01:10.120 --> 01:14.080\nتو آپ دیکھ سکتے ہیں کہ ہمارا پودوں کی\nبیماریوں کا کلاسیفائر ناکام ہو جاتا ہے\n\n01:14.080 --> 01:17.560\nکیونکہ اس نے پہلے کبھی گھاس کو\nنہیں دیکھا یا اس کا تجزیہ نہیں کیا،\n\n01:17.560 --> 01:22.360\nاور آپ واضح طور پر دیکھ سکتے ہیں کہ\nیہ اسے ایک صحت مند آڑو قرار دیتا ہے،\n\n01:22.360 --> 01:23.540\nحالانکہ ایسا نہیں ہے۔\n\n01:23.540 --> 01:27.240\nاور یہ صرف تصاویر پر ہی لاگو نہیں\nہوتا بلکہ زبانوں پر بھی ہوتا ہے،\n\n01:27.240 --> 01:30.580\nہے نا؟ ایک اے آئی ٹول صرف اسی\nزبان کی بنیاد پر جواب دے سکتا ہے\n\n01:30.580 --> 01:31.960\nجس پر اسے ٹرین کیا گیا ہو۔\n\n01:31.960 --> 01:34.540\nتو اس معاملے میں میں\nہندی میں بات کر رہا ہوں،\n\n01:34.540 --> 01:36.120\nجیسے کہ \"آج موسم کیسا ہے؟\n\n01:36.120 --> 01:38.860\nآپ کا نام کیا ہے؟ دو جمع دو کتنا ہوتا ہے؟\"\n\n01:38.860 --> 01:43.080\nاور چونکہ اس اے آئی ٹول نے پہلے\nکبھی ہندی ڈیٹا کا تجزیہ نہیں کیا،\n\n01:43.080 --> 01:46.960\nاس لیے یہ بس وہی انگریزی جملہ\nدہراتا رہے گا جو اسے آتا ہے،\n\n01:46.960 --> 01:49.700\nیعنی \"میں ٹھیک ہوں، اور آپ؟\" بار بار۔\n\n01:49.700 --> 01:54.960\nتو یہ دراصل اسی تصور کی طرف جاتا ہے\nکہ جو اندر جائے گا وہی باہر آئے گا۔\n\n01:54.960 --> 02:01.860\nتو مشین لرننگ میں اگر ڈیٹا محدود ہے تو اس کا\nمطلب ہے کہ ماڈل کی پیش گوئی بھی محدود ہی ہوگی۔\n"}, {"id": "lesson-2/06", "title": "جائزہ کوئز", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=ur"}, {"id": "lesson-2/07", "title": "پروجیکٹ کا وقت", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-2-07.mp4", "vtt": "WEBVTT\n\n00:00.110 --> 00:05.710\nٹھیک ہے، سبق نمبر دو کے لیے پروجیکٹ کا وقت ہو\nگیا ہے۔ تو آپ کو NeuroPocket میں پریکٹس کرنے\n\n00:05.710 --> 00:10.890\nکے لیے کچھ وقت ملا، لیکن اب آپ کا وقت ہے کہ\nآپ اپنے ماحول کو دریافت کریں اور سبق نمبر\n\n00:10.890 --> 00:16.430\nایک میں منتخب کردہ تھیم کے لیے ڈیٹا اکٹھا\nکریں۔ اور یاد رکھیں، جیسے جیسے آپ ورک شیٹ مکمل\n\n00:16.430 --> 00:19.110\nکریں گے آپ کا تھیم ہمیشہ تبدیل ہو سکتا ہے۔\n\n00:19.110 --> 00:21.830\nنیز اب آپ کو اس بات کو یقینی بنانا ہوگا\n\n00:21.830 --> 00:25.230\nکہ آپ اپنی ورک شیٹ پر سبق\nنمبر دو کے سوال کا جواب دیں۔\n\n00:25.230 --> 00:28.070\nتو سبق نمبر دو ڈیٹا اکٹھا\nکرنے کے بارے میں ہے۔\n\n00:28.070 --> 00:32.110\nتو آپ ہمیں بتائیں گے کہ آپ\nکن اشیاء کی درجہ بندی کریں گے\n\n00:32.110 --> 00:34.270\nاور آپ اپنا ڈیٹا کیسے اکٹھا کریں گے۔\n\n00:34.270 --> 00:36.910\nتو ایک طالب علم کی طرف\nسے جواب کی مثال یہ ہے:\n\n00:36.910 --> 00:39.250\n\"جن اشیاء کی میں درجہ بندی کروں گا\n\n00:39.250 --> 00:41.430\nوہ کیلے، مالٹے اور ایووکاڈو ہیں۔\n\n00:41.430 --> 00:43.330\nمیں اپنے گھر سے پھل لاؤں گا\n\n00:43.330 --> 00:47.230\nیا تصویریں لینے کے لیے اسکول\nکے باغ میں جاؤں گا۔\" ٹھیک ہے،\n\n00:47.230 --> 00:49.410\nتو آپ سبق نمبر دو کا جواب دیں گے،\n\n00:49.410 --> 00:51.410\nاور اگر آپ کے اساتذہ اجازت دیں\n\n00:51.410 --> 00:53.290\nتو آپ اپنے ماحول میں گھوم پھر کر\n\n00:53.290 --> 00:54.910\nمزید تصاویر بھی لے سکتے ہیں\n\n00:54.910 --> 00:57.370\nتاکہ انہیں اپنے اے آئی\nکلاسیفائر میں شامل کر سکیں\n\n00:57.370 --> 00:59.210\nیا اسے بہتر بنا سکیں۔\n"}, {"id": "lesson-2/08", "title": "ورک شیٹ", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=ur"}]}, {"id": "lesson-3", "kicker": "سبق 3", "title": "مشینیں کیسے تربیت پاتی ہیں", "items": [{"id": "lesson-3/01", "title": "مقاصد", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-01.mp4", "vtt": "WEBVTT\n\n00:00.370 --> 00:04.650\nٹھیک ہے، سبق نمبر تین میں خوش\nآمدید: مشینیں کیسے تربیت پاتی ہیں؟\n\n00:05.170 --> 00:10.230\nتو اگر آپ کو پچھلا سبق یاد ہو تو ہم نے مشین\nلرننگ کے اہم حصوں کے بارے میں بات کی تھی،\n\n00:10.230 --> 00:14.230\nجہاں آپ کے پاس آپ کا ماڈل ہوتا ہے،\nاور اس ماڈل کو آپ ڈیٹا دیتے ہیں،\n\n00:14.230 --> 00:19.750\nاور پھر آخر کار ایک تربیتی عمل سے گزرتے ہیں\nجہاں ماڈل اس وقت کو استعمال کرتے ہوئے اس\n\n00:19.750 --> 00:24.430\nتمام ڈیٹا کا تجزیہ کرتا ہے جو آپ نے اسے\nدیا ہوتا ہے، تاکہ پیٹرنز تلاش کر سکے۔\n\n00:25.430 --> 00:29.290\nلیکن مشین لرننگ کا تربیتی\nعمل دراصل کیسے کام کرتا ہے؟\n\n00:29.290 --> 00:33.090\nاور یہی وہ چیز ہے جو ہم سبق\nنمبر تین میں سمجھنے والے ہیں۔\n\n00:33.090 --> 00:36.790\nتو مقصد یہ ہے کہ آپ وضاحت کریں\nگے کہ الگورتھم کیا ہوتا ہے\n\n00:36.790 --> 00:38.850\nاور حقیقی زندگی کی مثالیں دیں گے۔\n\n00:39.270 --> 00:43.650\nآپ وضاحت کریں گے کہ مشینوں کو کام کرنے\nکے لیے الگورتھمز کی ضرورت کیوں ہوتی ہے۔\n\n00:43.650 --> 00:48.070\nآپ ان مراحل کو بیان کریں گے جن پر\nایک مشین تربیت کے دوران عمل کرتی ہے۔\n\n00:48.070 --> 00:53.750\nاور پھر آخر میں آپ موازنہ کریں گے کہ انسان اور\nمشینیں معلومات کو مختلف طریقے سے کیسے پروسیس\n\n00:53.750 --> 00:54.090\nکرتے ہیں۔\n"}, {"id": "lesson-3/02", "title": "بیان کرو اور بناؤ کھیل — ہدایات", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-02.mp4", "vtt": "WEBVTT\n\n00:00.000 --> 00:05.540\nٹھیک ہے، تو شروعات کرنے کے لیے آئیے \"بیان\nکرنے والا اور ڈرائنگ کرنے والا\" کھیل کھیلتے\n\n00:05.540 --> 00:10.360\nہیں۔ اس کے لیے دو یا دو سے زیادہ کھلاڑیوں کی\nضرورت ہوگی، لیکن اگر آپ کے ساتھ کوئی دوسرا\n\n00:10.360 --> 00:15.340\nکھلاڑی نہیں ہے اور آپ یہ اکیلے کر رہے ہیں تو\nفکر نہ کریں۔ ہمارے پاس یہ کھیل کھیلتے ہوئے\n\n00:15.340 --> 00:20.640\nہماری ویڈیو ڈیمونسٹریشن موجود ہے تاکہ آپ\nدیکھ سکیں کہ یہ کیسے کام کرتا ہے۔ تو جب تک آپ\n\n00:20.640 --> 00:24.040\nکو کھیلنے کے لیے کوئی ساتھی\nملے گا، آپ اس کے لیے تیار\n\n00:24.040 --> 00:29.660\nہوں گے، ٹھیک ہے؟ لیکن تب تک آئیے\nہدایات کو دیکھ لیتے ہیں۔ تو یہ\n\n00:29.660 --> 00:33.240\nکھیل اس طرح کام کرتا ہے کہ آپ\nجوڑوں میں کام کریں گے، تو ایک\n\n00:33.240 --> 00:37.520\nبار پھر، آپ کے پاس کم از کم\nدو لوگ ہونے چاہئیں۔ تو ایک شخص\n\n00:37.520 --> 00:40.840\nبیان کرنے والا ہوگا اور دوسرا\nشخص ڈرائنگ کرنے والا ہوگا۔\n\n00:40.840 --> 00:45.460\nتو اگر آپ کے پاس کوئی استاد\nموجود ہے تو وہ استاد تین سے پانچ\n\n00:45.460 --> 00:48.880\nبنیادی اشکال کے ساتھ کسی بھی\nپوزیشن میں ایک سادہ سی ڈرائنگ\n\n00:48.880 --> 00:53.780\nبنائے گا۔ تو ڈرائنگ اتنی سادہ\nبھی ہو سکتی ہے اور یہ اتنی پیچیدہ\n\n00:53.780 --> 00:59.500\nبھی ہو سکتی ہے۔ اگر کوئی استاد\nنہیں ہے تو بیان کرنے والا ڈرائنگ\n\n00:59.500 --> 01:05.340\nبنائے گا۔ اب جب ایک بار ڈرائنگ\nتیار ہو جائے تو صرف بیان کرنے والا\n\n01:05.340 --> 01:09.260\nہی ڈرائنگ کو دیکھ سکتا ہے۔ تو\nبیان کرنے والا ڈرائنگ کرنے والے\n\n01:09.260 --> 01:13.200\nکو بتائے گا کہ اس ڈرائنگ کو صرف\nزبانی ہدایات کے ذریعے دوبارہ\n\n01:13.200 --> 01:15.160\nکیسے بنانا ہے۔ وہ صرف اس بارے میں\n\n01:15.160 --> 01:17.000\nبات کر سکتے ہیں کہ اس ڈرائنگ کو دوبارہ\n\n01:17.000 --> 01:19.240\nکیسے بنایا جائے۔ آپ کے ہاتھ آپ کی کمر\n\n01:19.240 --> 01:21.100\nکے پیچھے ہونے چاہئیں۔ کسی بھی قسم\n\n01:21.100 --> 01:22.700\nکا اشارہ کرنا بالکل منع ہے۔\n\n01:22.700 --> 01:25.180\nاور اس دوران جیسے جیسے\n\n01:25.180 --> 01:27.220\nڈرائنگ بنانے والا اس ڈرائنگ کو دوبارہ\n\n01:27.220 --> 01:28.560\nبنانے کی کوشش کرتا ہے،\n\n01:28.560 --> 01:31.260\nدو منٹ کے بعد ڈرائنگ بنانے والا\n\n01:31.260 --> 01:32.940\nاپنی ڈرائنگ کا اصل ڈرائنگ\n\n01:32.940 --> 01:35.260\nیا استاد کی ڈرائنگ سے موازنہ کرے گا\n\n01:35.260 --> 01:38.280\nتاکہ یہ دیکھ سکے کہ وہ\nاس کے کتنے قریب تھے۔\n\n01:38.280 --> 01:40.940\nاور آخر کار جب یہ سب مکمل ہو جائے گا\n\n01:40.940 --> 01:42.160\nتو یہ ایک راؤنڈ ہوگا۔\n\n01:42.160 --> 01:44.700\nآپ کردار تبدیل کریں گے اور اسے دہرائیں گے۔\n\n01:44.700 --> 01:47.360\nتو بیان کرنے والا ڈرائنگ\nبنانے والا بن جائے گا\n\n01:47.360 --> 01:50.040\nاور ڈرائنگ بنانے والا\nبیان کرنے والا بن جائے گا۔\n\n01:50.040 --> 01:52.780\nٹھیک ہے، تو چلیے یہ کھیل شروع کرتے ہیں۔\n\n01:52.780 --> 01:56.120\nٹھیک ہے، تو چلیے کم از کم دو\nراؤنڈ کرنے کی کوشش کرتے ہیں،\n\n01:56.120 --> 01:58.320\nاور میں آپ لوگوں سے\nاگلی ویڈیو میں ملوں گا۔\n"}, {"id": "lesson-3/03", "title": "بیان کرو اور بناؤ کھیل — مظاہرہ", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-03.mp4", "vtt": "WEBVTT\n\n00:01.980 --> 00:07.640\nٹھیک ہے، تو ہم ایک سرگرمی کرنے جا رہے ہیں\nجسے ڈسکرائبر ڈرائر گیم کہتے ہیں، اور یہ کھیل\n\n00:07.640 --> 00:08.940\nبہت سادہ ہے۔\n\n00:08.940 --> 00:15.140\nمیں بطور استاد ایک بہت سادہ سی ڈرائنگ بنانے جا\nرہا ہوں جس میں صرف تین جیومیٹرک شکلیں ہوں گی۔\n\n00:15.620 --> 00:21.140\nوہ یا تو ایک مربع ہو سکتا ہے، ایک دائرہ ہو\nسکتا ہے، ایک مثلث ہو سکتی ہے، ایک ہیرا ہو\n\n00:21.140 --> 00:23.000\nسکتا ہے، کچھ بھی ہو سکتا ہے، ٹھیک ہے؟\n\n00:23.000 --> 00:28.220\nلیکن یہ بنیادی طور پر تین سادہ شکلیں ہیں جنہیں\nآپ اپنی مرضی کے مطابق کسی بھی طرح رکھ سکتے ہیں۔\n\n00:28.220 --> 00:34.300\nاور اب میں یہاں جو کرنے جا رہا ہوں وہ یہ ہے\nکہ میں شاید اس جیسی کوئی سادہ سی چیز بناؤں گا۔\n\n00:38.780 --> 00:41.660\nتو یہ ایک سادہ سی مثال ہے\nجو میں بنانے جا رہا ہوں۔\n\n00:42.140 --> 00:46.580\nاور اب ہوگا یہ کہ بطور استاد\nاپنی ڈرائنگ بنانے کے بعد\n\n00:46.580 --> 00:50.680\nاب میرے طلبہ جوڑوں میں کام کریں گے۔\n\n00:50.680 --> 00:54.780\nاور بنیادی طور پر جب طلبہ\nجوڑوں میں کام کرتے ہیں\n\n00:54.780 --> 00:55.920\nتو دو کردار ہوں گے:\n\n00:55.920 --> 00:58.800\nایک ڈسکرائبر ہوگا اور ایک ڈرائر ہوگا۔\n\n00:59.300 --> 01:02.320\nتو یہاں اس پوزیشن میں ڈسکرائبر کون بنے گا؟\n\n01:02.320 --> 01:03.780\n\"میں ڈسکرائبر بنوں گا۔\"\n\n01:03.780 --> 01:06.140\nٹھیک ہے، اور کیرن ڈرائر بنے گی۔\n\n01:06.140 --> 01:10.460\nتو پھر سے، سارا خیال یہ ہے\nکہ ڈسکرائبر وہ واحد شخص ہے\n\n01:10.460 --> 01:13.640\nجسے اس چھپی ہوئی ڈرائنگ\nکے پیچھے آنے کی اجازت ہے،\n\n01:13.640 --> 01:17.620\nاور بنیادی طور پر ڈرائر کے\nپاس واپس جا کر ہدایات دینے کی\n\n01:17.620 --> 01:20.100\nکہ اس ڈرائنگ کو دوبارہ کیسے بنایا جائے۔\n\n01:20.100 --> 01:24.220\nاور چال یہ ہے کہ ڈسکرائبر\nجتنی بار چاہے آ سکتا ہے،\n\n01:24.220 --> 01:26.700\nتاہم وہ صرف زبانی ہدایات دے سکتے ہیں،\n\n01:26.700 --> 01:30.420\nاور انہیں وہ ہدایات دینے کے لیے\nڈرائر کے پیچھے کھڑا ہونا چاہیے\n\n01:30.420 --> 01:32.480\nتاکہ وہ ایک دوسرے کو نہ دیکھ سکیں۔\n\n01:33.200 --> 01:36.040\nٹھیک ہے، تو آئیے اصل میں\nایک مظاہرہ دکھاتے ہیں\n\n01:36.040 --> 01:38.240\nکہ یہ کھیل کیسے کام کرے گا۔\n\n01:38.240 --> 01:39.740\nتو کیا آپ لوگ تیار ہیں؟\n\n01:39.740 --> 01:42.380\nتیار ہو جاؤ، شروع کرتے ہیں!\n\n01:42.380 --> 01:44.320\nتم اوپر جا سکتے ہو، میسن۔\n\n01:44.320 --> 01:47.220\nڈرائنگ دیکھو اور کیرن کو ہدایات دو۔\n\n01:47.940 --> 01:49.800\nتم یہ کر سکتے ہو، میسن۔\n\n01:53.200 --> 01:54.480\nٹھیک ہے۔\n\n01:54.480 --> 02:00.420\n\"تو پہلی چیز ایک مربع بنانا ہے۔\" ٹھیک ہے۔\n\n02:05.420 --> 02:08.580\n\"اب آپ مربع کے بالکل بیچ میں\n\n02:08.580 --> 02:10.060\nایک دائرہ بنائیں۔\"\n\n02:12.300 --> 02:15.000\n\"کیا یہ مربع کے کناروں کو چھوئے گا\n\n02:15.000 --> 02:16.180\nیا مرکز میں ہوگا؟\"\n\n02:16.180 --> 02:18.260\n\"یہ مرکز میں ہوگا،\n\n02:18.260 --> 02:21.280\nیہ کسی بھی کنارے کو نہیں\nچھوئے گا۔\" ٹھیک ٹھاک۔\n\n02:22.220 --> 02:23.060\nٹھیک ہے۔\n\n02:23.060 --> 02:27.260\n\"اور مربع کے نیچے، یہ مربع سے باہر ہوگا،\n\n02:27.260 --> 02:32.780\nاور یہ نیچے کی طرف اشارہ کرنے\nوالی ایک مثلث ہوگی۔\" ٹھیک ہے۔\n\n02:34.200 --> 02:38.600\n\"نیچے والی لائن کو کنارے کے طور\nپر استعمال کرتے ہوئے؟\" \"درست۔\n\n02:38.600 --> 02:41.480\nآپ دائیں کنارے اور بائیں\nکنارے کا استعمال کریں گے،\n\n02:41.480 --> 02:45.140\nاور یہ بالکل درمیان میں مثلث کے\nنوک کے طور پر جائے گا۔\" ٹھیک ٹھاک۔\n\n02:45.140 --> 02:46.540\nاچھی ہدایات ہیں، میسن۔\n\n02:47.900 --> 02:48.780\nٹھیک ہے،\n\n02:48.780 --> 02:50.340\nاچھا کام کیا دوستو۔\n\n02:50.340 --> 02:54.240\nاور جیسا کہ آپ وہاں دیکھ سکتے ہیں، وہ اس\nڈرائنگ کو دوبارہ بنانے میں کامیاب رہے۔\n\n02:54.240 --> 02:55.620\nاور اب بات یہ ہے،\n\n02:56.280 --> 03:00.080\nاس کھیل کا سارا خیال یہ ہے کہ\nوہ واقعی صرف پہلا لیول تھا۔\n\n03:00.080 --> 03:04.940\nبطور استاد آپ اس طرح کی شکلیں بنا کر\nاس کھیل کو بتدریج مشکل بنا سکتے ہیں۔\n\n03:04.940 --> 03:08.080\nآپ اپنی شکلوں کو اس\nپوزیشن میں رکھ سکتے ہیں،\n\n03:08.080 --> 03:10.400\nاور شاید ایک چھوٹا مربع بنا سکتے ہیں\n\n03:10.400 --> 03:12.740\nاور اس کے بیچ میں ایک مثلث رکھ سکتے ہیں۔\n\n03:13.760 --> 03:15.980\nبنیادی طور پر کلیدی خیال یہ ہے\n\n03:15.980 --> 03:19.220\nکہ ہم صرف اپنے طلبہ کو چیلنج\nکرنے کے قابل ہونا چاہتے ہیں\n\n03:19.220 --> 03:22.080\nکہ وہ بنیادی طور پر\nڈرائرز کو واضح ہدایات دیں\n\n03:22.080 --> 03:24.020\nتاکہ وہ واضح طور پر سمجھ سکیں\n\n03:24.020 --> 03:26.440\nکہ کیا دوبارہ بنانا ہے۔ ٹھیک ہے،\n\n03:27.380 --> 03:28.860\nشکریہ دوستو، شکریہ،\n\n03:28.860 --> 03:30.940\nاور اگلے کھیل میں آپ سب سے ملیں گے۔\n"}, {"id": "lesson-3/04", "title": "الگورتھم کیا ہے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-04.mp4", "vtt": "WEBVTT\n\n00:00.080 --> 00:06.000\nٹھیک ہے، خوش آمدید۔ تو اگر آپ کو کسی کے ساتھ \"بیان\nکرنے والا اور ڈرائنگ کرنے والا\" کھیل کھیلنے کا\n\n00:06.000 --> 00:12.060\nموقع ملا، یا ویڈیو ڈیمونسٹریشن دیکھ پائے،\nتو ہمارا آپ سے سوال یہ ہے: آپ نے اور\n\n00:12.060 --> 00:18.020\nآپ کے ساتھی نے ڈرائنگ کو دوبارہ بنانے میں\nآسانی پیدا کرنے کے لیے کون سی حکمت عملی استعمال\n\n00:18.020 --> 00:23.140\nکی یا دیکھی؟ تو بس ویڈیو کو روکیں اور\nچند سیکنڈ کے لیے اس بارے میں سوچیں۔\n\n00:25.220 --> 00:29.900\nٹھیک ہے، تو اب جب کہ آپ کو اس بارے\nمیں سوچنے کا کچھ وقت مل گیا ہے،\n\n00:29.900 --> 00:33.480\nشاید آپ نے غور کیا ہو کہ وہ مرحلہ وار سوچ\n\n00:33.480 --> 00:36.600\n(اسٹیپ بائی اسٹیپ تھنکنگ) نامی\nچیز کا استعمال کر رہے تھے۔\n\n00:36.600 --> 00:38.600\nتو مرحلہ وار سوچ:\n\n00:38.600 --> 00:41.020\nجیسے آپ اپنے ساتھی کے\nساتھ کھیل کھیلتے ہیں،\n\n00:41.020 --> 00:45.140\nآپ کو ڈرائنگ بنانے والے کو بہت\nواضح مرحلہ وار ہدایات دینی پڑتی ہیں\n\n00:45.140 --> 00:48.840\nتاکہ وہ سمجھ سکے کہ استاد کی\nڈرائنگ کو دوبارہ کیسے بنانا ہے۔\n\n00:48.840 --> 00:52.960\nتو مثال کے طور پر اس شخص\nنے شاید کچھ اس طرح کہا ہو:\n\n00:52.960 --> 00:57.060\n\"پہلے ایک دائرہ بنائیں، پھر اس دائرے\nکے اندر ایک چھوٹی تکون بنائیں۔\"\n\n00:57.060 --> 01:00.700\nلیکن آپ بتا سکتے ہیں کہ ہم نے\nبہت واضح مرحلہ وار ہدایات دیں۔\n\n01:00.700 --> 01:05.600\nتو جو کچھ آپ نے ابھی بنایا\nیا دیکھا وہ ایک الگورتھم تھا۔\n\n01:05.600 --> 01:10.860\nالگورتھم کسی بھی کام کو مکمل کرنے کے\nلیے صرف واضح مرحلہ وار ہدایات کا نام ہے۔\n\n01:11.580 --> 01:16.980\nاور الگورتھم کے بارے میں خاص بات یہ ہے کہ اس\nکا اطلاق زندگی میں کسی بھی چیز پر ہو سکتا ہے۔\n\n01:16.980 --> 01:18.940\nاس کا تکنیکی ہونا ضروری نہیں ہے،\n\n01:18.940 --> 01:24.980\nبس یہ کہ وہ الگورتھم کسی کام کو مکمل کرنے\nکے لیے مرحلہ وار ہدایات کا ایک مجموعہ ہو۔\n\n01:24.980 --> 01:29.940\nتو مثال کے طور پر اگر میں اس کو دیکھوں،\nچائے کا کپ بنانے کے مراحل، آپ جانتے ہیں،\n\n01:29.940 --> 01:32.940\nمجھے پہلا قدم یہ لینا\nتھا کہ پانی اُبالنا ہے۔\n\n01:32.940 --> 01:35.820\nدوسرا مرحلہ، مجھے چائے کا بیگ ڈالنا تھا۔\n\n01:35.820 --> 01:41.180\nتیسرا مرحلہ، مجھے چینی اور دودھ شامل کرنا تھا،\nاور آخر میں چوتھا مرحلہ، مجھے اسے ہلانا اور\n\n01:41.180 --> 01:42.220\nپیش کرنا تھا، ٹھیک ہے؟\n\n01:42.220 --> 01:47.660\nتو یہ الگورتھم کی ایک مثال ہے کیونکہ میں\nچائے کا ایک کپ بنانے کے کام کو مکمل کرنے کے\n\n01:47.660 --> 01:50.600\nلیے اسے مرحلہ وار تقسیم کرنے کے قابل تھا۔\n\n01:51.320 --> 01:56.760\nتو ہم اپنی زندگی میں ہر روز الگورتھم کا استعمال\nکرتے ہیں جب بھی ہم کوئی کام مرحلہ وار کرتے ہیں۔\n\n01:56.760 --> 01:58.580\nیہ کھانا پکانا ہو سکتا ہے،\n\n01:58.580 --> 02:00.080\nیہ کپڑے پہننا ہو سکتا ہے،\n\n02:00.080 --> 02:02.280\nریاضی کا کوئی سوال حل کرنا ہو سکتا ہے،\n\n02:02.280 --> 02:05.180\nیا ہمارے معاملے میں بس یہ\nگیم کھیلنا بھی ہو سکتا ہے۔\n\n02:06.580 --> 02:08.560\nتو میرا آپ سے سوال یہ ہے:\n\n02:08.560 --> 02:11.600\nایسی کون سی چیز ہے جس کے\nبارے میں آپ سوچ سکتے ہیں\n\n02:11.600 --> 02:13.140\nجو آپ روزانہ کرتے ہیں\n\n02:13.140 --> 02:16.360\nاور جس کے لیے واضح مرحلہ\nوار ہدایات ہو سکتی ہیں،\n\n02:16.360 --> 02:18.200\nیا جس کے واضح مراحل ہیں؟\n\n02:18.200 --> 02:21.720\nتو بس ویڈیو کو روکیں اور\nتھوڑی دیر اس بارے میں سوچیں۔\n\n02:24.910 --> 02:28.670\nٹھیک ہے، تو اب جب کہ آپ کو اس بارے\nمیں سوچنے کا کچھ وقت مل گیا ہے،\n\n02:28.670 --> 02:32.570\nہم دراصل یہ چاہتے ہیں کہ آپ\nالگورتھمز کے اس پورے تصور کو سمجھیں،\n\n02:32.570 --> 02:34.990\nکہ مشینوں کو الگورتھمز کی ضرورت ہوتی ہے۔\n\n02:34.990 --> 02:37.670\nدوبارہ، مشینیں انسانوں\nکی طرح نہیں سمجھتیں،\n\n02:37.670 --> 02:40.170\nاور یہی سب سے بڑی وجوہات میں سے ایک ہے\n\n02:40.170 --> 02:43.350\nکہ ہمیں واضح مرحلہ وار\nہدایات دینے کی ضرورت ہوتی ہے۔\n\n02:43.350 --> 02:45.150\nتو جب آپ وہ گیم کھیل رہے ہوتے ہیں\n\n02:45.150 --> 02:46.990\nیا وہ گیم دیکھ رہے ہوتے ہیں،\n\n02:46.990 --> 02:52.490\nتو بیان کرنے والا (ڈسکرائبر) اس انسان کی طرح\nہوتا ہے جو ہدایات دے رہا ہے، اور ڈرائنگ کرنے\n\n02:52.490 --> 02:55.550\nوالا اس مشین کی طرح ہوتا\nہے جو ان پر عمل کر رہی ہے۔\n"}, {"id": "lesson-3/05", "title": "انسانی سیکھنے کا الگورتھم", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-05.mp4", "vtt": "WEBVTT\n\n00:00.530 --> 00:05.410\nٹھیک ہے، تو اب جب آپ سمجھ گئے ہیں کہ الگورتھم\nکیسے کام کرتا ہے، تو آئیے سمجھتے ہیں کہ\n\n00:05.410 --> 00:10.630\nہم سیکھنے کے لیے الگورتھم کیسے بنا سکتے\nہیں۔ تو اسے بہتر طور پر سمجھنے کے لیے ہم ایک\n\n00:10.630 --> 00:15.990\nچھوٹا سا کھیل کھیلیں گے جس کا نام ہے \"یہ کس\nگروپ سے تعلق رکھتا ہے؟\" اور ہوگا یہ کہ میں\n\n00:15.990 --> 00:21.410\nآپ کو ایک تصویر دکھاؤں گا اور آپ نے بس مجھے\nیہ بتانا ہے کہ آیا یہ گروپ A میں جاتی ہے\n\n00:21.410 --> 00:27.730\nیا گروپ B میں۔ اب ترکیب یہ ہے کہ میں آپ کو پیٹرن\nنہیں بتاؤں گا، میں آپ کو اصول نہیں بتاؤں گا۔\n\n00:27.730 --> 00:31.470\nآپ کا کام بنیادی طور پر یہ\nخود معلوم کرنا ہے، ٹھیک ہے؟\n\n00:32.130 --> 00:35.050\nتو چلیے پہلی تصویر سے شروع کرتے ہیں۔\n\n00:35.730 --> 00:36.510\nٹھیک ہے،\n\n00:36.510 --> 00:38.030\nتو کیا یہ گروپ A میں جائے گی\n\n00:38.030 --> 00:38.690\nیا گروپ B میں؟\n\n00:39.550 --> 00:40.850\nبس اندازہ لگائیں۔\n\n00:42.130 --> 00:44.550\nیہ والی گروپ B میں جاتی ہے۔\n\n00:44.550 --> 00:47.050\nکیا یہ گروپ A میں جائے گی\n\n00:47.050 --> 00:48.170\nیا گروپ B میں؟\n\n00:49.310 --> 00:51.150\nیہ والی گروپ A میں جاتی ہے۔\n\n00:51.150 --> 00:53.210\nکیا یہ والی گروپ A میں جائے گی\n\n00:53.210 --> 00:53.970\nیا گروپ B میں؟\n\n00:55.350 --> 00:57.450\nیہ والی گروپ B میں جاتی ہے۔\n\n00:57.450 --> 01:00.950\nکیا یہ گروپ A میں جائے گی یا گروپ B میں؟\n\n01:02.150 --> 01:03.970\nیہ والی گروپ A میں جاتی ہے۔\n\n01:03.970 --> 01:07.790\nیہ والی گروپ A میں جائے گی یا گروپ B میں؟\n\n01:08.750 --> 01:10.790\nیہ والی گروپ A میں جاتی ہے۔\n\n01:10.790 --> 01:14.750\nکیا یہ والی گروپ A میں\nجائے گی یا گروپ B میں؟\n\n01:16.780 --> 01:18.900\nیہ والی گروپ B میں جاتی ہے۔\n\n01:18.900 --> 01:21.400\nاب یہ ایک مشکل والی ہے۔\n\n01:21.400 --> 01:24.020\nکیا یہ والی گروپ A میں\nجائے گی یا گروپ B میں؟\n\n01:25.240 --> 01:27.020\nیہ والی گروپ A میں جاتی ہے۔\n\n01:27.020 --> 01:30.320\nاور مجھے یقین ہے کہ آپ نے شاید\nپہلے ہی اندازہ لگا لیا ہوگا،\n\n01:30.320 --> 01:33.200\nلیکن کیا یہ گروپ A میں\nجائے گی یا گروپ B میں؟\n\n01:34.540 --> 01:36.180\nیہ والی گروپ A میں جاتی ہے۔\n\n01:36.180 --> 01:40.420\nاور آخر میں، کیا یہ والی گروپ\nA میں جائے گی یا گروپ B میں؟\n\n01:41.560 --> 01:45.100\nیہ والی گروپ B میں جاتی ہے۔ ٹھیک ہے،\n\n01:45.100 --> 01:46.920\nتو پیٹرن کیا تھا؟\n\n01:48.220 --> 01:51.020\nخیر، اگر آپ نے شاید\nپہلے ہی پتا لگا لیا ہو،\n\n01:51.020 --> 01:53.640\nتو اگر بائیں کنارے پر کوئی کالا نشان تھا\n\n01:53.640 --> 01:54.680\nتو وہ گروپ A تھا،\n\n01:54.680 --> 01:58.080\nاور اگر دائیں کنارے پر کوئی کالا\nنشان تھا تو وہ گروپ B میں تھا۔\n\n01:58.080 --> 02:02.080\nاور اس لیے مجھے لگتا ہے کہ جو\nچیز واقعی دلچسپ ہے وہ یہ ہے\n\n02:02.080 --> 02:05.400\nکہ آپ اس بات کا فیصلہ کرنے\nمیں بہتر کیسے بنتے ہیں\n\n02:05.400 --> 02:07.580\nکہ آیا یہ گروپ A میں گیا یا گروپ B میں،\n\n02:07.580 --> 02:10.700\nجب مجھے آپ کو کوئی اصول\nبتانے کی ضرورت نہیں پڑی،\n\n02:10.700 --> 02:13.780\nیا جب میں نے آپ کو کوئی\nاصول یا پیٹرن نہیں بتایا؟\n\n02:13.780 --> 02:18.080\nتو بلا جھجک ویڈیو کو روکیں اور\nکچھ سیکنڈ کے لیے اس پر غور کریں۔\n\n02:21.680 --> 02:25.720\nٹھیک ہے، تو انسانی سیکھنے کا\nالگورتھم کچھ اس طرح نظر آ سکتا ہے۔\n\n02:26.420 --> 02:28.500\nبنیادی طور پر آپ ایک اندازہ لگاتے ہیں،\n\n02:28.500 --> 02:30.980\nپھر آپ بنیادی طور پر\nاپنے جواب کو چیک کرتے ہیں\n\n02:30.980 --> 02:33.860\nیہ دیکھنے کے لیے کہ آپ\nاصل جواب سے کتنے دور ہیں،\n\n02:33.860 --> 02:37.160\nاور پھر آپ اپنی توجہ دوسری\nخصوصیات پر مرکوز کرتے ہیں،\n\n02:37.160 --> 02:39.420\nاور پھر آپ بس اس عمل کو دہراتے رہتے ہیں\n\n02:39.420 --> 02:41.620\nجب تک کہ آپ اس مقام پر نہ پہنچ جائیں\n\n02:41.620 --> 02:43.560\nجہاں آپ بغیر کوئی اصول بتائے\n\n02:43.560 --> 02:45.540\nمختلف گروپس کے درمیان فرق کر سکیں۔\n\n02:46.300 --> 02:49.540\nتو انسانوں کے بارے میں جو\nبات میں واضح کرنا چاہتا ہوں،\n\n02:49.540 --> 02:51.880\nجو اسے واقعی دلچسپ بناتی ہے،\n\n02:51.880 --> 02:54.600\nوہ یہ ہے کہ ہم وہ چیز تلاش کرتے ہیں\n\n02:54.600 --> 02:56.380\nجو اہم محسوس ہوتی ہے۔\n\n02:56.380 --> 02:58.320\nتو انسان ہونے کے ناتے\n\n02:58.320 --> 03:00.540\nہم فطری طور پر بہت متجسس ہوتے ہیں۔\n\n03:00.540 --> 03:03.120\nہمارے اندر یہ احساسات اور معنی تلاش کرنے\n\n03:03.120 --> 03:05.360\nاور خیالات کو جوڑنے کی شدید خواہش ہوتی ہے۔\n\n03:05.360 --> 03:07.960\nتو مثال کے طور پر اگر میں اچانک کہیں سے\n\n03:07.960 --> 03:10.360\nکالا مربع دیکھ لوں تو میں سوچتا ہوں،\n\n03:10.360 --> 03:12.140\n\"ٹھیک ہے، وہ کالا مربع\n\n03:12.140 --> 03:14.180\nیقینی طور پر مجھے نمایاں نظر آ رہا ہے،\"\n\n03:14.180 --> 03:16.260\nاور جیسے، یہ اس پوزیشن میں\n\n03:16.260 --> 03:17.720\nکیوں ہے؟ آپ جانتے ہیں،\n\n03:17.720 --> 03:20.120\nآخر میں، میں صرف اس بارے میں\n\n03:20.120 --> 03:22.040\nبہت متجسس ہوں کہ یہ سب\n\n03:22.040 --> 03:24.420\nکیسے جڑتا ہے اور اس سب کا کیا مطلب ہے۔\n\n03:24.420 --> 03:26.200\nاور جب انسانی سیکھنے کا الگورتھم\n\n03:26.200 --> 03:27.860\nعمل میں ہوتا ہے تو آپ جانتے ہیں\n\n03:27.860 --> 03:30.180\nکیا ہوتا ہے؟ سب سے پہلے آپ کو ایک باخبر\n\n03:30.180 --> 03:32.140\nاندازہ لگانا پڑتا ہے، نا؟ کیونکہ آپ\n\n03:32.140 --> 03:34.060\nنہیں جانتے کہ کیا ہونے والا ہے، آپ\n\n03:34.060 --> 03:36.340\nخصوصیات نہیں جانتے۔ تو جب بھی\n\n03:36.340 --> 03:38.100\nمجھ سے پوچھا جاتا ہے، \"کیا یہ گروپ\n\n03:38.100 --> 03:40.440\nA میں جاتا ہے یا گروپ\nB میں؟\" آپ جانتے ہیں،\n\n03:40.440 --> 03:41.780\nمیں بس کہتا ہوں، \"ٹھیک ہے،\n\n03:41.780 --> 03:44.180\nخیر، میرا اندازہ ہے کہ یہ گروپ A\n\n03:44.180 --> 03:46.380\nہے کیونکہ ہم ابھی شروعات کر رہے ہیں۔\"\n\n03:46.380 --> 03:48.540\nاور یہیں سے چیزیں دلچسپ ہو جاتی ہیں۔\n\n03:48.540 --> 03:50.220\nتو دوسرے مرحلے پر آپ\n\n03:50.220 --> 03:52.200\nاپنے جواب کی جانچ پڑتال شروع کرتے ہیں۔\n\n03:52.200 --> 03:55.840\nتو دوسرے مرحلے میں جب آپ اندازہ\nلگاتے ہیں اور نتیجہ دیکھتے ہیں\n\n03:55.840 --> 03:57.900\nتو اس سے آپ کو کچھ محسوس ہوتا ہے۔\n\n03:57.900 --> 04:01.900\nتو مثال کے طور پر جب بھی میں\nنے کہا کہ یہ دراصل گروپ B ہے\n\n04:01.900 --> 04:04.000\nتو آپ دیکھ سکتے ہیں کہ\nمیں تھوڑا سا حیران ہوں۔\n\n04:04.000 --> 04:09.240\nمیں کہتا ہوں، \"اوہ، واقعی؟ شاید\nاس کا تعلق دائیں جانب ہونے سے ہے۔\"\n\n04:10.200 --> 04:13.360\nاور جواب چیک کرنے کے بارے میں بات یہ ہے\n\n04:13.360 --> 04:19.180\nکہ یہ آپ کو حیرت، شاید تجسس\nیا دلچسپی کا احساس دلائے گا۔\n\n04:19.180 --> 04:25.100\nآپ جانتے ہیں، جو کچھ بھی ہو، آپ آخر کار سوچیں\nگے کہ اس سب کا کیا مطلب ہے اور یہ سب آپس میں\n\n04:25.100 --> 04:25.920\nکیسے جڑتا ہے۔\n\n04:25.920 --> 04:31.040\nاور پھر تیسرا مرحلہ وہ ہے جب آپ اپنی\nتوجہ کو درست کرنا شروع کرتے ہیں۔\n\n04:31.040 --> 04:34.780\nتو آپ نے اپنے پچھلے اندازے\nکے بعد کیسا محسوس کیا،\n\n04:34.780 --> 04:40.740\nاس کی بنیاد پر یہ طے ہوگا کہ آپ اپنے اگلے\nاندازے میں کس چیز پر توجہ مرکوز کریں گے۔\n\n04:40.740 --> 04:43.280\nتو آپ یہاں دیکھ سکتے ہیں کہ\nجب میں وہی سوال پوچھتا ہوں،\n\n04:43.280 --> 04:45.140\n\"کیا یہ گروپ A میں جاتا ہے یا گروپ B میں؟\"\n\n04:45.140 --> 04:47.460\nمیں کہتا ہوں، \"اوہ،\n\n04:47.460 --> 04:49.860\nٹھیک ہے، اب یہ بائیں جانب ہے،\n\n04:49.860 --> 04:52.660\nتو شاید اس کا تعلق گروپ A میں ہونے سے ہے۔\"\n\n04:53.140 --> 04:54.940\nاور جب میں کہتا ہوں کہ یہ درست ہے\n\n04:54.940 --> 04:57.720\nتو آپ دیکھ سکتے ہیں کہ میں\nفوراً بہت پرجوش ہو جاتا ہوں۔\n\n04:57.720 --> 04:59.140\nمیں کہتا ہوں، \"اوہ،\n\n04:59.140 --> 05:01.920\nمجھے لگتا ہے کہ میں اسے سمجھنا\nشروع کر رہا ہوں،\" ہے نا؟\n\n05:01.920 --> 05:04.740\nاور جیسے جیسے آپ اس\nعمل کو دہراتے رہتے ہیں،\n\n05:04.740 --> 05:06.380\nوقت کے ساتھ ساتھ آپ سیکھ جائیں گے\n\n05:06.380 --> 05:10.680\nکہ گروپس میں فرق کرنے کے لیے ان میں سے کون\nسی خصوصیات سب سے زیادہ اہمیت رکھتی ہیں۔\n\n05:11.940 --> 05:17.140\nٹھیک ہے، تو پتا چلتا ہے کہ ہم دراصل ان سیکھنے\nکے الگورتھمز (لرننگ الگورتھمز) کی مشینوں میں بھی\n\n05:17.140 --> 05:17.940\nنقل کر سکتے ہیں۔\n"}, {"id": "lesson-3/06", "title": "مشین لرننگ کا الگورتھم", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-06.mp4", "vtt": "WEBVTT\n\n00:00.780 --> 00:06.120\nٹھیک ہے، تو پچھلی بار ہم نے بات کی تھی کہ ہم\nلرننگ الگورتھمز کو مشینوں میں کیسے سیمولیٹ\n\n00:06.120 --> 00:11.740\nکر سکتے ہیں، اور اس سے پہلے کہ ہم اسے سمجھیں،\nہمیں یہ سمجھنے کی ضرورت ہے کہ فیچر اصل\n\n00:11.740 --> 00:17.160\nمیں کیا ہوتا ہے۔ تو فیچرز بس معلومات کے وہ\nٹکڑے ہوتے ہیں جو ہمیں چیزوں میں فرق کرنے\n\n00:17.160 --> 00:22.880\nمیں مدد کرتے ہیں۔ تو مثال کے طور پر یہاں ان\nدو چیزوں کو ہی لے لیں۔ خیر، پہلی چیز جو میں\n\n00:22.880 --> 00:28.200\nنے نوٹ کی وہ یہ ہے کہ وہ شکل کے لحاظ سے مختلف\nہیں۔ ان میں سے ایک مربع ہے اور دوسری ایک\n\n00:28.200 --> 00:30.140\nدائرہ ہے، اور وہ رنگ کے لحاظ سے بھی\n\n00:30.140 --> 00:35.400\nمختلف ہیں۔ تو یہ دراصل ایک پیلا\nمربع ہے، اور جو دائیں جانب ہے وہ\n\n00:35.400 --> 00:40.800\nایک نیلا دائرہ ہے۔ تو یہ بنیادی\nطور پر فیچرز یا معلومات ہیں\n\n00:40.800 --> 00:45.040\nجو مجھے ان دو چیزوں میں فرق\nکرنے میں مدد کرتی ہیں۔ اور انسان\n\n00:45.040 --> 00:48.980\nجس طرح فیچرز کو دیکھتا ہے وہ\nیہ ہے کہ، آپ جانتے ہیں، جب بھی\n\n00:48.980 --> 00:52.420\nہم کسی تصویر کو دیکھتے ہیں\nتو ہم بنیادی طور پر اسے مختلف\n\n00:52.420 --> 00:55.920\nخصوصیات میں تقسیم کر دیتے ہیں،\nاور پھر ہم قدرتی طور پر اس پر\n\n00:55.920 --> 00:59.060\nتوجہ مرکوز کرتے ہیں جو\nسب سے اہم محسوس ہوتی ہے۔\n\n00:59.060 --> 01:03.020\nتو اگر ہم اس تصویر کی ان\nتمام مختلف خصوصیات کو دیکھیں\n\n01:03.020 --> 01:06.140\nتو ہمیں یہ پتا چلتا ہے\nکہ چونکہ یہ کالا مربع\n\n01:06.140 --> 01:09.160\nاپنی جگہ پر اکیلا ہے اور\nیہ نمایاں نظر آتا ہے،\n\n01:09.160 --> 01:11.700\nتو یہ باقی تمام خصوصیات کے مقابلے میں\n\n01:11.700 --> 01:13.380\nسب سے اہم محسوس ہوتا ہے۔\n\n01:13.380 --> 01:17.080\nتاہم مشینوں کے بارے میں بات\nیہ ہے کہ وہ احساسات کے ساتھ\n\n01:17.080 --> 01:18.140\nاندازہ نہیں لگاتیں،\n\n01:18.140 --> 01:20.940\nوہ دراصل حسابی پیش گوئیاں کر رہی ہوتی ہیں۔\n\n01:20.940 --> 01:25.100\nتو مشینیں ان خصوصیات کو\nاحساسات کے طور پر نہیں لیتیں،\n\n01:25.100 --> 01:27.860\nوہ ان خصوصیات کو اعداد کے طور پر لیتی ہیں۔\n\n01:27.860 --> 01:30.720\nوہ دراصل کچھ بھی دیکھتی\nیا محسوس نہیں کرتیں۔\n\n01:30.720 --> 01:32.740\nتو مثال کے طور پر،\n\n01:32.740 --> 01:34.900\nتاکہ وہ اسے دراصل پروسیس کر سکیں،\n\n01:34.900 --> 01:38.420\nوہ سفید کو ایک اور کالے\nکو صفر میں بدل دیتی ہیں۔\n\n01:38.420 --> 01:41.580\nاور اس لیے انسانوں اور\nمشینوں کے درمیان فرق کو،\n\n01:41.580 --> 01:44.660\nاور یہ کہ ہم خصوصیات کو\nکیسے پروسیس کرتے ہیں،\n\n01:44.660 --> 01:47.020\nاسے سمجھنے کا ایک اچھا طریقہ یہ ہے\n\n01:47.020 --> 01:50.560\nکہ ایک انسان کے لیے، جب بھی\nہم کوئی ایسی چیز دیکھتے ہیں\n\n01:50.560 --> 01:52.980\nجو نمایاں ہو، جیسے کہ کالا مربع،\n\n01:52.980 --> 01:55.660\nتو ہم سوچتے ہیں، \"اچھا، یہ اہم لگتا ہے\"،\n\n01:55.660 --> 01:58.380\nتو ہم بنیادی طور پر ایک\nاندازہ لگا لیتے ہیں۔\n\n01:58.380 --> 02:00.660\nاب مشینوں کے بارے میں بات یہ ہے،\n\n02:00.660 --> 02:02.980\nجیسا کہ آپ یہاں دیکھ سکتے ہیں،\n\n02:02.980 --> 02:04.940\nکہ وہ دراصل اسے دیکھتی نہیں ہیں۔\n\n02:04.940 --> 02:07.540\nوہ بنیادی طور پر اسے\nنمبروں میں بدل دیتی ہیں،\n\n02:07.540 --> 02:11.460\nاور پھر وہ بنیادی طور پر اسے کسی\nقسم کی اہمیت سے ضرب دیتی ہیں،\n\n02:11.460 --> 02:15.180\nکہ ان میں سے کون سی چیزیں نتیجہ\nطے کرنے میں سب سے زیادہ اہم ہیں،\n\n02:15.180 --> 02:18.340\nاور پھر وہ بنیادی طور پر\nایک حسابی پیش گوئی کرتی ہیں۔\n\n02:18.340 --> 02:19.880\nریاضی کی فکر نہ کریں۔\n\n02:20.560 --> 02:22.800\nاہم بات جو میں چاہتا ہوں کہ آپ سمجھیں\n\n02:22.800 --> 02:26.680\nوہ یہ ہے کہ اس عمل میں بہت\nزیادہ ریاضی شامل ہوتی ہے۔\n\n02:26.680 --> 02:29.340\nتو مشین لرننگ ٹریننگ الگورتھم،\n\n02:29.340 --> 02:33.620\nآپ دیکھ سکتے ہیں کہ اس میں\nبھی اسی طرح کے مراحل ہوتے ہیں،\n\n02:33.620 --> 02:37.000\nجہاں ایسا ہوتا ہے کہ آپ ایک\nحسابی پیش گوئی کرتے ہیں،\n\n02:37.000 --> 02:38.960\nپھر آپ غلطی کی پیمائش کرتے ہیں،\n\n02:38.960 --> 02:41.640\nپھر آپ اپنی ریاضی کی\nمساوات کو درست کرتے ہیں،\n\n02:41.640 --> 02:43.720\nاور پھر آپ اس عمل کو دہراتے رہتے ہیں۔\n\n02:43.720 --> 02:46.480\nتو مشین لرننگ کے بارے میں بات یہ ہے\n\n02:46.480 --> 02:49.440\nکہ وہ بنیادی طور پر پیش\nگوئی کا حساب لگاتے ہیں۔\n\n02:50.000 --> 02:53.660\nتو فیچر کو دیکھنے کے\nبجائے وہ فیچر کو لیتے ہیں\n\n02:53.660 --> 02:55.120\nاور اسے ضرب دیتے ہیں، کہ ہر فیچر\nنتیجہ طے کرنے میں کتنا اہم ہے۔\n\n02:59.340 --> 03:01.900\nٹھیک ہے، کیا یہ زیادہ تر فیچر 1 ہے؟\n\n03:01.900 --> 03:04.820\nکیا یہ زیادہ تر فیچر 2 ہے؟ اور اسی طرح۔\n\n03:04.820 --> 03:06.900\nٹھیک ہے، یہ فیصلہ کرنے کی کوشش کر رہا ہے\n\n03:06.900 --> 03:09.180\nتاکہ یہ دیکھے کہ یہ اس\nجواب تک کیسے پہنچتا ہے۔\n\n03:09.720 --> 03:10.500\nتو آئیے\n\n03:10.500 --> 03:12.800\nمشین لرننگ الگورتھم کو\nکام کرتے ہوئے دیکھتے ہیں۔\n\n03:13.460 --> 03:15.040\nتو پہلا قدم یہ ہے\n\n03:15.040 --> 03:16.240\nکہ آپ بنیادی طور پر\n\n03:16.240 --> 03:18.000\nاپنی پیش گوئی کا حساب لگاتے ہیں۔\n\n03:18.000 --> 03:20.300\nتو وہ فیچرز کو نمبروں کے طور پر\n\n03:20.300 --> 03:21.660\nشمار کر کے شروع کرتے ہیں،\n\n03:21.660 --> 03:26.060\nاور پھر وہ بنیادی طور پر انہیں بے ترتیب\nاہمیت کی اقدار کے ساتھ جمع کرتے ہیں،\n\n03:26.060 --> 03:32.120\nکیونکہ یاد رکھیں، شروع میں، آپ جانتے ہیں، انسانوں\nکی طرح ہمیں ایک بے ترتیب اندازہ لگانا پڑتا تھا۔\n\n03:32.120 --> 03:35.840\nتو اسی طرح یہ مشینیں بھی بس\nکچھ بے ترتیب ڈال رہی ہوتی ہیں\n\n03:35.840 --> 03:38.440\nکہ ان میں سے کون سا فیچر اصل میں اہم ہے،\n\n03:38.440 --> 03:42.060\nاور اس طرح وہ کسی قسم کی حسابی\nپیش گوئی تک پہنچ جاتے ہیں۔\n\n03:42.060 --> 03:44.820\nتو پھر اس پیش گوئی کو کرنے کے بعد\n\n03:44.820 --> 03:47.020\nہمیں غلطی کی پیمائش کرنی پڑتی ہے۔\n\n03:47.020 --> 03:49.120\nتو ماڈل یہ کرتا ہے\n\n03:49.120 --> 03:51.620\nکہ وہ بنیادی طور پر موازنہ کرتا ہے\n\n03:51.620 --> 03:53.340\nکہ حسابی پیش گوئی\n\n03:53.340 --> 03:55.820\nاصل درست جواب سے کتنی دور تھی،\n\n03:55.820 --> 03:58.400\nاور اس فاصلے کو ہم غلطی کہتے ہیں۔\n\n03:58.400 --> 04:01.580\nاور اس لیے یہ غلطی ہمارے لیے بہت اہم ہوگی،\n\n04:01.580 --> 04:04.180\nکیونکہ ہم اس غلطی کو استعمال کرتے ہوئے\n\n04:04.180 --> 04:05.460\nاپنی مساوات میں\n\n04:05.460 --> 04:06.920\nہر فیچر کی اہمیت کو\n\n04:06.920 --> 04:08.880\nمختلف انداز میں ایڈجسٹ کرتے ہیں\n\n04:08.880 --> 04:11.280\nتاکہ اگلی بار غلطی کم سے کم ہو۔\n\n04:11.280 --> 04:13.140\nتو بنیادی طور پر\n\n04:13.140 --> 04:14.940\nہم یہ کرتے ہیں کہ ہم اس غلطی\n\n04:14.940 --> 04:16.760\nکو لیتے ہیں اور پھر ہم اسے ہر\n\n04:16.760 --> 04:18.460\nفیچر کے لیے مختلف انداز میں\n\n04:18.460 --> 04:20.580\nاپ ڈیٹ کرتے ہیں تاکہ یہ دیکھ سکیں\n\n04:20.580 --> 04:22.720\nکہ کون سا فیچر نتیجے\n\n04:22.720 --> 04:24.320\nکا تعین کرنے میں زیادہ اہم ہے،\n\n04:24.320 --> 04:26.700\nاور پھر بنیادی طور پر ہم ایک ایسی\n\n04:26.700 --> 04:28.540\nاپ ڈیٹ شدہ مساوات تک پہنچتے ہیں\n\n04:28.540 --> 04:31.320\nجسے ہم بار بار اپ ڈیٹ کرتے رہیں گے۔\n\n04:31.320 --> 04:37.620\nاور اس طرح کافی تکرار کے بعد آپ کے پاس بنیادی\nطور پر ایک تربیت یافتہ ماڈل تیار ہو جاتا ہے\n\n04:37.620 --> 04:39.220\nجو پیش گوئیاں کر سکتا ہے۔\n\n04:39.220 --> 04:45.200\nاور اس لیے آپ یہاں دیکھ سکتے ہیں کہ ہمارے پاس\nایک بہترین فائن ٹیونڈ ریاضیاتی مساوات موجود ہے\n\n04:45.200 --> 04:47.260\nجو کافی درست فیصلے کر سکتی ہے۔\n\n04:47.260 --> 04:50.720\nآپ دیکھ سکتے ہیں کہ یہ 87\nفیصد گروپ B بتا رہا ہے۔\n\n04:50.720 --> 04:55.760\nتو بنیادی خیال یہ ہے، اور اگر آپ اس میں\nشامل ریاضی کو نہیں سمجھتے تو کوئی بات نہیں،\n\n04:55.760 --> 05:02.220\nبس میں یہ چاہتا ہوں کہ آپ یہ سمجھیں کہ ایک تربیت\nیافتہ ماڈل ریاضی کی مساواتوں پر مبنی ہوتا ہے۔\n\n05:02.220 --> 05:06.980\nتو تربیت یافتہ اے آئی ماڈلز بنیادی طور\nپر ڈیٹا کو اعداد میں تبدیل کرتے ہیں،\n\n05:06.980 --> 05:12.060\nوہ اس پر بہت سارے حساب کتاب کرتے ہیں،\nاور پھر وہ ایک نمبر بھی آؤٹ پٹ کرتے ہیں\n\n05:12.060 --> 05:16.120\nجسے بعد میں ایسی چیز میں تبدیل کر\nدیا جاتا ہے جسے انسان سمجھ سکے۔\n\n05:16.120 --> 05:22.180\nاور اسی لیے ہماری تصویر یا\nڈیٹا کی ہر ایک تفصیل واقعی\n\n05:22.180 --> 05:23.020\nاہمیت رکھتی ہے،\n\n05:23.020 --> 05:26.460\nکیونکہ اے آئی ماڈلز میں\nہر تفصیل اہم ہوتی ہے،\n\n05:26.460 --> 05:30.360\nکیونکہ ایک مساوات میں ہر\nنمبر اہمیت رکھتا ہے، ہے نا؟\n\n05:30.360 --> 05:33.660\nاے آئی معلومات کو اس طرح پروسیس\nنہیں کرتا جیسے ہم کرتے ہیں،\n\n05:33.660 --> 05:37.440\nاس لیے اس کی پیش گوئیاں درحقیقت ہماری\nتوقعات سے میل نہیں کھا سکتی ہیں۔\n\n05:37.440 --> 05:42.680\nتو آپ یہاں دیکھ سکتے ہیں کہ ان میں سے\nہر ایک اس نمبر کی نمائندگی کر سکتا ہے\n\n05:42.680 --> 05:45.600\nجس کا حساب ہم اس مساوات میں کرنے والے ہیں۔\n\n05:45.600 --> 05:49.780\nاور یہ خیال عام طور پر کسی بھی قسم\nکے اے آئی ماڈل پر لاگو ہوتا ہے۔\n\n05:49.780 --> 05:54.980\nتو یہاں تک کہ لینگویج ماڈلز یا\nبات چیت کرنے والے اے آئی ٹولز،\n\n05:54.980 --> 05:57.260\nوہ بنیادی طور پر آپ کے الفاظ لیتے ہیں،\n\n05:57.260 --> 05:59.440\nآپ کو انہیں نمبروں میں بدلنا پڑتا ہے،\n\n05:59.440 --> 06:01.100\nآپ ان پر ریاضی کرتے ہیں،\n\n06:01.100 --> 06:03.860\nاور پھر آپ انہیں واپس\nالفاظ میں بدل دیتے ہیں\n\n06:03.860 --> 06:06.660\nتاکہ آپ بنیادی طور پر\nاسے سمجھ سکیں، ہے نا؟\n\n06:07.060 --> 06:09.180\nتو بنیادی طور پر اس کا زیادہ تر حصہ\n\n06:09.180 --> 06:10.920\nبہت زیادہ ریاضی، مساوات\n\n06:10.920 --> 06:13.180\nاور حساب کتاب کرنے پر مشتمل ہوتا ہے،\n\n06:13.180 --> 06:15.460\nآخر کار ایک پیش گوئی تک پہنچنے کے لیے۔\n\n06:16.940 --> 06:19.520\nتو اہم بات جو میں آپ کو سمجھانا چاہتا ہوں\n\n06:19.520 --> 06:21.560\nوہ یہ ہے کہ اے آئی کوئی جادو نہیں ہے۔\n\n06:21.560 --> 06:26.200\nیہ بنیادی طور پر ایسی ریاضی ہے جس\nکی رہنمائی انسانی فیصلوں سے ہوتی ہے۔\n\n06:26.200 --> 06:28.940\nمیں یہ بات اس کی اہمیت کم\nکرنے کے لیے نہیں کہہ رہا،\n\n06:28.940 --> 06:34.220\nبلکہ یہ واضح رہے کہ یہ صرف ریاضی ہے جس\nکی رہنمائی انسانی فیصلوں سے ہوتی ہے۔\n\n06:34.220 --> 06:38.200\nمثال کے طور پر جب ہم اے آئی\nکی ڈھلنے کی صلاحیت دیکھتے ہیں،\n\n06:38.200 --> 06:44.280\nتو وہ ان لرننگ الگورتھمز سے خود کو ڈھالتا ہے\nجو انسانوں نے لکھے ہیں اور مشین پر چلتے ہیں۔\n\n06:44.280 --> 06:47.300\nتو جیسا کہ ہم نے ذکر کیا\nاو
