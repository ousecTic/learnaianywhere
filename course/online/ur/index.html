ر جیسا کہ ہم نے دیکھا،\n\n06:47.300 --> 06:50.640\nاس کے لیے بہت زیادہ ریاضیاتی\nحساب کتاب کی ضرورت ہوتی ہے،\n\n06:50.640 --> 06:52.560\nجس میں بہت زیادہ توانائی لگتی ہے۔\n\n06:52.560 --> 06:56.820\nتو NeuroPocket بنیادی طور پر\nتوانائی استعمال کر رہا ہے،\n\n06:56.820 --> 07:00.120\nیا آپ کے ڈیوائس پر ہی حساب کتاب کر رہا ہے۔\n\n07:00.120 --> 07:04.760\nتو بہت زیادہ بھاری ریاضیاتی حساب کتاب\nبہت زیادہ توانائی استعمال کرے گا،\n\n07:04.760 --> 07:06.480\nجس سے آپ کا ڈیوائس گرم ہو جائے گا،\n\n07:06.480 --> 07:08.620\nاور یہ بیٹری کو بھی\nختم کرے گا، کچھ اس طرح۔\n\n07:09.700 --> 07:13.100\nاب حقیقت یہ ہے کہ اے آئی\nکی ماحولیاتی قیمت یہ ہے\n\n07:13.100 --> 07:16.100\nکہ اگرچہ NeuroPocket آپ کے\nڈیوائس پر ہی کام کرتا ہے،\n\n07:16.100 --> 07:18.700\nلیکن زیادہ تر اے آئی کے بارے میں بات یہ ہے\n\n07:18.700 --> 07:20.700\nکہ وہ بڑی بڑی عمارتوں میں چلتے ہیں\n\n07:20.700 --> 07:22.520\nجو ہزاروں کمپیوٹرز سے بھری ہوتی ہیں۔\n\n07:22.520 --> 07:25.360\nتو یہ عمارتیں اتنی بجلی استعمال کرتی ہیں\n\n07:25.360 --> 07:26.820\nجتنی چھوٹے شہر کرتے ہیں،\n\n07:26.820 --> 07:30.960\nاور اربوں گیلن پانی صرف خود کو\nٹھنڈا رکھنے کے لیے استعمال ہوتا ہے\n\n07:30.960 --> 07:34.380\nتاکہ یہ مختلف قسم کے\nریاضیاتی حساب کتاب کر سکیں۔\n\n07:34.380 --> 07:38.500\nتو یہ یقینی طور پر ہمارے ماحول کے\nلیے ایک بہت بڑی قیمت ہو سکتی ہے۔\n\n07:38.500 --> 07:41.740\nاب دوسری بات اے آئی کی خودمختاری ہے۔\n\n07:41.740 --> 07:44.560\nخیر، اے آئی کی خودمختاری کا مطلب یہ ہے\n\n07:44.560 --> 07:47.540\nکہ، آپ جانتے ہیں، اے آئی\nڈیٹا کی بڑی مقدار میں\n\n07:47.540 --> 07:49.700\nاپنے پیٹرنز تلاش کر کے پیش گوئیاں کرتا ہے۔\n\n07:49.700 --> 07:51.420\nتو بطور انسان\n\n07:51.420 --> 07:52.680\nہم بنیادی طور پر\n\n07:52.680 --> 07:54.520\nمثالیں یا فیڈ بیک فراہم کرتے ہیں\n\n07:54.520 --> 07:56.500\nتاکہ اس کی پیش گوئیوں کی رہنمائی میں\n\n07:56.500 --> 07:57.580\nمدد کر سکیں، ہے نا؟\n\n07:57.580 --> 07:59.720\nتو مثال کے طور پر آپ ہی وہ شخص تھے\n\n07:59.720 --> 08:01.000\nجس نے اپنی NeuroPocket ایپ کو\n\n08:01.000 --> 08:02.760\nٹرین کرنے کے لیے ڈیٹا اکٹھا کیا۔\n\n08:02.760 --> 08:04.260\nاور اس طرح، آپ جانتے ہیں،\n\n08:04.260 --> 08:05.820\nمجموعی طور پر دیکھا جائے\n\n08:05.820 --> 08:09.320\nتو بہت سے انسان ہیں جو دراصل ان\nاے آئی کے پیچھے کام کر رہے ہیں۔\n\n08:09.320 --> 08:12.940\nآپ جانتے ہیں، NeuroPocket\nکے معاملے میں یہ صرف آپ تھے\n\n08:12.940 --> 08:15.780\nیا شاید کچھ اور دوست جو\nڈیٹا اکٹھا کر رہے تھے،\n\n08:15.780 --> 08:18.260\nلیکن زیادہ تر اے آئی کو ڈیٹا صاف کرنے\n\n08:18.260 --> 08:22.200\nاور ان اے آئی ماڈلز کی رہنمائی کے\nلیے لاکھوں لوگوں کی ضرورت ہوتی ہے۔\n\n08:22.200 --> 08:24.840\nاور اس لیے ان انسانی فیصلوں کے بغیر\n\n08:24.840 --> 08:26.700\nمشین کو یہ معلوم ہی نہیں ہوگا\n\n08:26.700 --> 08:28.840\nکہ وہ درست پیٹرنز کیسے تلاش کرے۔\n\n08:28.840 --> 08:34.880\nتو آخر میں، اے آئی کے کام کرنے کے طریقے\nکے بارے میں جو اصل بات آپ سمجھیں وہ\n\n08:34.880 --> 08:38.700\nیہ ہے کہ اے آئی ٹولز دراصل\nانسانی فیصلوں کا ہی نتیجہ ہیں۔\n"}, {"id": "lesson-3/07", "title": "جائزہ کوئز", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=ur"}, {"id": "lesson-3/08", "title": "پروجیکٹ کا وقت", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-3-08.mp4", "vtt": "WEBVTT\n\n00:00.050 --> 00:05.430\nٹھیک ہے، سبق نمبر تین، پروجیکٹ کا وقت۔ تو اب\nوقت آ گیا ہے کہ آپ اپنی خصوصیات کے بارے میں\n\n00:05.430 --> 00:11.230\nسوچنا شروع کریں۔ تو اپنے دوسرے سبق کے ڈیٹا کی\nبنیاد پر میں چاہتا ہوں کہ آپ تھوڑا اور گہرائی\n\n00:11.230 --> 00:16.110\nسے سوچیں۔ ان اہم خصوصیات کے بارے میں سوچیں جو\nآپ نے اپنے گروپس کو الگ کرنے کے لیے استعمال\n\n00:16.110 --> 00:22.130\nکی تھیں۔ کیا وہ شاید رنگ تھا؟ کیا وہ\nسائز تھا؟ کیا وہ شکل تھی؟ اور کون سی\n\n00:22.130 --> 00:25.790\nخصوصیات تھیں جن کے بارے میں آپ سوچ رہے\nتھے جنہوں نے آپ کے گروپس کو ایک دوسرے سے\n\n00:25.790 --> 00:29.810\nالگ کیا؟ ٹھیک ہے، تو آپ اپنی ورک\nشیٹ پر سبق نمبر تین کے سوال کے لیے\n\n00:29.810 --> 00:33.650\nاس کا جواب دیں گے، اور اگر آپ جلدی\nفارغ ہو جائیں تو بس اپنے اے آئی\n\n00:33.650 --> 00:37.610\nکلاسیفائر کو بہتر بناتے رہیں۔\nاگر آپ کے استاد اجازت دیں تو باہر\n\n00:37.610 --> 00:41.710\nجا کر مزید ڈیٹا اکٹھا کریں تاکہ آپ\nاپنے اے آئی کلاسیفائر پر کام جاری\n\n00:41.710 --> 00:46.350\nرکھ سکیں۔ تو اگر ضرورت ہو تو\nمزید ڈیٹا اکٹھا کریں۔ تو سبق نمبر\n\n00:46.350 --> 00:48.030\nتین کے لیے ایک جواب کی مثال،\n\n00:48.030 --> 00:50.030\nجو کہ خصوصیات کی شناخت ہے:\n\n00:50.030 --> 00:52.430\nآپ کا کلاسیفائر ڈیٹا کی درجہ بندی\n\n00:52.430 --> 00:54.690\nکرنے کے لیے کن خصوصیات کا استعمال کرے گا؟\n\n00:54.690 --> 00:56.130\nتو اس مثال میں\n\n00:56.130 --> 00:57.630\nطالب علم نے یہ کہا:\n\n00:57.630 --> 01:00.810\n\"میں رنگ، شکل اور جسامت\nکا استعمال کروں گا۔\n\n01:00.810 --> 01:02.210\nمثال کے طور پر،\n\n01:02.210 --> 01:04.110\nکیلے لمبے اور پیلے ہوتے ہیں،\n\n01:04.110 --> 01:06.310\nمالٹے گول اور نارنجی ہوتے ہیں،\n\n01:06.310 --> 01:08.830\nاور ایووکاڈو بیضوی اور سبز ہوتے ہیں۔\n\n01:08.830 --> 01:10.250\nیہ خصوصیات انہیں\n\n01:10.250 --> 01:12.350\nالگ الگ پہچاننا آسان بناتی ہیں۔\"\n"}, {"id": "lesson-3/09", "title": "ورک شیٹ", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=ur"}]}, {"id": "lesson-4", "kicker": "سبق 4", "title": "کیا مشینیں ذمہ دار ہو سکتی ہیں", "items": [{"id": "lesson-4/01", "title": "مقاصد", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-01.mp4", "vtt": "WEBVTT\n\n00:00.000 --> 00:04.200\nٹھیک ہے، سبق نمبر چار: کیا\nمشینیں ذمہ دار ہو سکتی ہیں؟\n\n00:04.200 --> 00:10.240\nتو سبق نمبر چار کے مقصد میں ہم یہ سیکھیں\nگے کہ ڈیٹا کا تعصب کس طرح غلط پیش گوئیوں کا\n\n00:10.240 --> 00:15.640\nباعث بنتا ہے، اور یہ وضاحت کریں گے کہ انسان\nاے آئی کے لیے کیوں ذمہ دار ہیں اور نقصان کو\n\n00:15.640 --> 00:17.220\nکیسے کم کیا جا سکتا ہے۔\n\n00:17.220 --> 00:22.680\nہم لوگوں کی پرائیویسی (رازداری) کے تحفظ کے\nآسان طریقے بیان کریں گے، اور ہم یہ سمجھیں گے\n\n00:22.680 --> 00:26.280\nکہ تعصب، پرائیویسی اور\nذمہ داری کس طرح ذمہ دار\n\n00:26.280 --> 00:27.680\nاے آئی سے جڑے ہوئے ہیں۔\n"}, {"id": "lesson-4/02", "title": "Bearly a Dog چیلنج", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-02.mp4", "vtt": "WEBVTT\n\n00:00.000 --> 00:05.000\nہم ایک چیلنج کرنے جا رہے ہیں جس کا نام ہے\nBearly a Dog چیلنج، اور آپ کا مقصد ایک ایسا ماڈل\n\n00:05.000 --> 00:10.680\nبنانا ہے جو ریچھوں اور کتوں میں فرق بتا سکے\nاور تمام ٹیسٹ کیسز کو پاس کرے۔ آپ کی شرط یہ\n\n00:10.680 --> 00:17.000\nہے کہ آپ کے پاس تین منٹ ہیں، آپ زیادہ سے\nزیادہ دس ریچھ اور دس کتے منتخب کر سکتے ہیں۔ اس\n\n00:17.000 --> 00:21.660\nچیلنج کو تلاش کرنے کے لیے آپ NeuroPocket ایپ\nپر واپس جائیں۔ آپ کو وہاں Try Bias Challenge\n\n00:21.660 --> 00:24.180\nکے نام سے کچھ نظر آئے گا۔ اس پر کلک کریں،\n\n00:24.180 --> 00:26.460\nStart Challenge پر کلک\nکریں، اور آپ فوراً دیکھیں گے\n\n00:26.460 --> 00:29.100\nکہ آپ دس ریچھ اور دس کتے\nتک منتخب کر سکتے ہیں۔\n\n00:29.100 --> 00:32.600\nاب بالکل اسی طرح جیسے آپ\nNeuroPocket استعمال کرتے رہے ہیں،\n\n00:32.600 --> 00:34.140\nاپنا ڈیٹا اکٹھا کرنے کے بعد\n\n00:34.140 --> 00:36.640\nآپ ٹریننگ پر جائیں اور\nپھر اپنے ماڈل پر جائیں\n\n00:36.640 --> 00:38.220\nجہاں آپ تمام ٹیسٹ کیسز چلائیں گے\n\n00:38.220 --> 00:40.280\nاور دیکھیں گے کہ کیا آپ\nسب کچھ پاس کر لیتے ہیں۔\n\n00:40.940 --> 00:43.040\nٹھیک ہے، تو چلیے اس\nچیلنج کا آغاز کرتے ہیں،\n\n00:43.040 --> 00:44.840\nاور میں آپ لوگوں سے اس\nکے اختتام پر ملوں گا۔\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "تعصب کیا ہے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-03.mp4", "vtt": "WEBVTT\n\n00:00.820 --> 00:06.100\nٹھیک ہے، تو واپسی پر خوش آمدید۔ تو Bearly\na Dog چیلنج کھیلنے کے بعد آپ کے لیے ایک\n\n00:06.100 --> 00:10.820\nسوال ہے: آپ کے نتائج کیا رہے اور\nآپ کے خیال میں ایسا کیوں ہوا؟\n\n00:11.280 --> 00:13.600\nتو کیا آپ تمام ٹیسٹ کیسز میں کامیاب رہے؟\n\n00:13.600 --> 00:15.440\nکیا آپ ان میں سے کچھ میں کامیاب ہوئے؟\n\n00:15.440 --> 00:17.000\nکیا آپ ان سب میں ناکام رہے؟\n\n00:17.580 --> 00:20.820\nتو بس ویڈیو کو روکیں اور چند\nسیکنڈ کے لیے اس بارے میں سوچیں۔\n\n00:22.290 --> 00:29.070\nٹھیک ہے، تو اگر آپ تمام ٹیسٹ کیسز پاس نہیں کر سکے\nتو اس کی وجہ انسانی تعصب (ہیومن بائیس) ہو سکتی ہے۔\n\n00:29.070 --> 00:30.910\nاب انسانوں کے بارے میں بات یہ ہے\n\n00:30.910 --> 00:33.850\nکہ ہم سب دنیا کو مختلف نظر سے دیکھتے ہیں،\n\n00:33.850 --> 00:37.510\nکیونکہ، خیر، ہم سب کے زندگی\nکے تجربات مختلف ہوتے ہیں،\n\n00:37.510 --> 00:41.530\nاور دنیا کے اس محدود نقطۂ\nنظر کو ہم تعصب کہتے ہیں۔\n\n00:41.530 --> 00:44.590\nتو یہ تصویر اسے سمجھانے\nمیں اچھا کام کرتی ہے۔\n\n00:44.590 --> 00:46.850\nآپ جانتے ہیں، یہاں یہ تین لوگ ہیں،\n\n00:46.850 --> 00:49.910\nاور بائیں طرف والا شخص جیسے\nہاتھی کی سونڈ کو پکڑے ہوئے ہے\n\n00:49.910 --> 00:51.710\nاور سمجھتا ہے کہ یہ سانپ ہے۔\n\n00:52.690 --> 00:55.190\nدرمیان والا شخص سمجھتا\nہے کہ یہ ایک دیوار ہے،\n\n00:55.190 --> 00:58.490\nاور جس کے پاس دم ہے وہ سمجھتا\nہے کہ یہ دراصل ایک رسی ہے۔\n\n00:58.490 --> 01:02.310\nتو ان سب کے ایک ہی ہاتھی کے\nبارے میں تجربات مختلف ہیں،\n\n01:02.310 --> 01:05.470\nاور یہی وجہ ہے کہ ان کا نقطۂ نظر محدود ہے۔\n\n01:06.810 --> 01:11.030\nاور پھر ہوتا یہ ہے کہ ہمارا\nتعصب، یا ہمارا محدود نقطۂ نظر،\n\n01:11.030 --> 01:13.570\nواقعی ان خصوصیات کو متاثر کر سکتا ہے\n\n01:13.570 --> 01:15.650\nجو ہم اپنے ڈیٹا میں منتخب کرتے ہیں۔\n\n01:15.650 --> 01:18.690\nتو مثال کے طور پر Bearly\na Dog چیلنج کو ہی لے لیں۔\n\n01:18.690 --> 01:23.090\nتو ہو سکتا ہے کہ کسی نے صرف کالے\nریچھ اور سفید کتے چن لیے ہوں،\n\n01:23.090 --> 01:25.370\nکیونکہ شاید وہ ان سے زیادہ واقف ہیں۔\n\n01:25.370 --> 01:29.430\nلیکن حقیقت یہ ہے کہ ریچھ\nسفید بھی ہو سکتے ہیں\n\n01:29.430 --> 01:31.330\nاور کتے بھی کالے ہو سکتے ہیں۔\n\n01:31.330 --> 01:34.210\nاور اس متعصب ڈیٹا کا نتیجہ\n\n01:34.210 --> 01:36.730\nالگورتھمک تعصب کی صورت میں نکل سکتا ہے۔\n\n01:36.730 --> 01:40.250\nتو جب بھی متعصب ڈیٹا اے آئی\nکو مکمل تصویر کے بجائے\n\n01:40.250 --> 01:41.870\nایک محدود نظریہ دکھاتا ہے،\n\n01:41.870 --> 01:44.850\nتو یہ بنیادی طور پر غلط\nنتائج کی طرف لے جاتا ہے۔\n\n01:45.430 --> 01:48.090\nتو مثال کے طور پر آپ یہاں دیکھ سکتے ہیں،\n\n01:48.090 --> 01:50.210\nکہ یاد رکھیں، ہمارے ڈیٹا سیٹ میں\n\n01:50.210 --> 01:52.310\nہم نے اس بات کو یقینی بنایا تھا\n\n01:52.310 --> 01:55.170\nکہ تمام ریچھ کالے ہوں\nاور تمام کتے سفید ہوں۔\n\n01:55.170 --> 01:57.890\nتو جب بھی اس نے کوئی سفید جانور دیکھا\n\n01:57.890 --> 01:59.990\nتو اس نے اسے کتے کے طور پر پہچانا،\n\n01:59.990 --> 02:02.530\nاور جب بھی اس نے کوئی کالا جانور دیکھا\n\n02:02.530 --> 02:04.470\nتو اس نے اسے ریچھ سمجھ لیا۔\n\n02:04.470 --> 02:06.130\nٹھیک ہے؟ تو بنیادی طور پر\n\n02:06.130 --> 02:10.310\nہمارا تعصب حقیقت کے مقابلے میں\nصرف ایک محدود نظریہ دکھا رہا تھا۔\n\n02:11.590 --> 02:14.990\nتو ہاں، ہمارے ریچھ کو\nغلطی سے کتا سمجھ لیا گیا۔\n\n02:16.150 --> 02:19.950\nاب میں جس بات کے بارے میں\nبالکل صاف گو رہنا چاہتا ہوں\n\n02:19.950 --> 02:25.010\nوہ یہ ہے کہ، آپ جانتے ہیں، تعصب\nکا شکار ہونا بالکل انسانی فطرت ہے۔\n\n02:25.010 --> 02:29.730\nیہ تب ہی تشویش کا باعث بنتا ہے جب\nآپ اسے دوسروں کے تجربات اور اقدار\n\n02:29.730 --> 02:32.190\nکو مدِنظر رکھے بغیر ان پر لاگو کرتے ہیں۔\n\n02:32.190 --> 02:38.290\nاور اس لیے بنیادی طور پر ہمارا متعصب\nڈیٹا ممکنہ طور پر ہمارے اے آئی کو انہی\n\n02:38.290 --> 02:43.250\nلوگوں کو خارج کرنے کی طرف لے جا سکتا ہے جن\nکی ہم دراصل مدد کرنے کی کوشش کر رہے ہیں۔\n\n02:43.250 --> 02:47.250\nتو اس کی کچھ مثالیں غلط\nطبی نتائج جیسی ہو سکتی ہیں۔\n\n02:47.910 --> 02:53.850\nتو کبھی کبھی اے آئی ایکس رے کا تجزیہ کرتا ہے،\nاور آپ جانتے ہیں، اگر وہ ٹریننگ کے دوران کافی\n\n02:53.850 --> 02:57.330\nمریضوں کا تجزیہ نہ کر پائے تو\nوہ دراصل غلطیاں کر سکتا ہے۔\n\n02:57.330 --> 03:00.670\nتو آپ دیکھ سکتے ہیں کہ اس\nنے غلط تشخیصی فیصلہ دیا۔\n\n03:00.670 --> 03:05.910\nاور ڈاکٹروں کے معاملے میں بات یہ ہے کہ اگر\nوہ نتائج پر ضرورت سے زیادہ بھروسہ کریں،\n\n03:05.910 --> 03:10.450\nٹھیک ہے، اور دوبارہ چیک نہ کریں، تو\nکسی کو دراصل غلط تشخیص مل سکتی ہے،\n\n03:10.450 --> 03:12.290\nاور یہ بہت برا ہو سکتا ہے۔\n\n03:12.850 --> 03:18.170\nایک اور بات یہ ہے کہ دراصل ایسے کیسز بھی\nہوئے ہیں جہاں گرفتاریاں ہوئی ہیں، ٹھیک ہے؟\n\n03:18.170 --> 03:21.330\nتو کبھی کبھی اے آئی سسٹم نے\nلوگوں کی غلط شناخت کی ہے،\n\n03:21.330 --> 03:26.270\nکیونکہ بنیادی طور پر ان کے پاس مختلف قسم کے\nچہروں اور نسلوں کے بارے میں مکمل ٹریننگ ڈیٹا\n\n03:26.270 --> 03:27.170\nکی کمی ہوتی ہے،\n\n03:27.170 --> 03:32.490\nاور اس وجہ سے رابرٹ ولیمز جیسے لوگوں\nکو بھی غلطی سے گرفتار کیا گیا ہے۔\n\n03:32.490 --> 03:35.390\nاور یہ صرف تصویروں تک ہی محدود نہیں ہے،\n\n03:35.390 --> 03:37.490\nبلکہ زبان پر بھی لاگو ہوتا ہے۔\n\n03:37.490 --> 03:40.450\nکبھی کبھی اے آئی ٹولز\nاس لیے ناکام ہو جاتے ہیں\n\n03:40.450 --> 03:45.950\nکیونکہ ان کے ٹریننگ ڈیٹا میں اس زبان، مقامی لہجے\nیا بول چال کے الفاظ کی کافی مقدار نہیں ہوتی۔\n\n03:45.950 --> 03:49.870\nایک ایسا واقعہ بھی ہوا تھا جہاں\nایک آدمی نے عربی میں صبح بخیر کہا،\n\n03:49.870 --> 03:53.210\nلیکن اس کا غلط ترجمہ \"ان\nپر حملہ کرو\" کر دیا گیا،\n\n03:53.210 --> 03:56.250\nجس کی وجہ سے اس آدمی کو\nغلطی سے گرفتار کر لیا گیا،\n\n03:56.250 --> 03:59.190\nلیکن، آپ جانتے ہیں، بعد\nمیں اسے رہا کر دیا گیا۔\n\n03:59.190 --> 04:02.390\nتو ایسے بہت سے مختلف کیسز موجود ہیں\n\n04:02.390 --> 04:04.990\nجہاں جب ہم اپنے تعصب کی وجہ سے\n\n04:04.990 --> 04:06.810\nکسی دوسرے کے تجربے\n\n04:06.810 --> 04:09.430\nیا صورتحال کو مدِنظر نہیں رکھتے\n\n04:09.430 --> 04:11.610\nتو یہ غلطیوں کا باعث بن سکتا ہے۔\n\n04:11.610 --> 04:13.270\nتو میرا آپ سے یہ سوال ہے:\n\n04:13.270 --> 04:15.330\nجب غلطیاں ہوتی ہیں\n\n04:15.330 --> 04:16.750\nتو ذمہ دار کون ہے،\n\n04:16.750 --> 04:18.310\nاے آئی یا انسان؟\n\n04:18.310 --> 04:20.070\nاور آپ ایسا کیوں سوچتے ہیں؟\n\n04:20.070 --> 04:22.910\nہم اس سوال کا جواب اگلی ویڈیو میں دیں گے۔\n"}, {"id": "lesson-4/04", "title": "ذمہ دار کون ہے", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-04.mp4", "vtt": "WEBVTT\n\n00:00.340 --> 00:06.880\nٹھیک ہے، تو آئیے اس سوال پر ایک نظر ڈالتے\nہیں: جب غلطیاں ہوتی ہیں تو کون ذمہ دار ہے،\n\n00:06.880 --> 00:08.060\nاے آئی یا انسان؟\n\n00:08.060 --> 00:13.640\nاب اگر آپ کو اس سوال کے بارے میں سوچنے کا\nموقع نہیں ملا ہے تو بس جلدی سے ویڈیو کو روکیں\n\n00:13.640 --> 00:15.240\nاور چند سیکنڈ کے لیے اس پر غور کریں۔\n\n00:16.780 --> 00:20.520\nٹھیک ہے، تو سب سے اہم چیزوں\nمیں سے ایک جو ہم چاہتے ہیں\n\n00:20.520 --> 00:22.860\nکہ آپ ان اے آئی سسٹمز کے بارے میں سمجھیں\n\n00:22.860 --> 00:25.300\nوہ یہ ہے کہ یہ صرف ٹولز ہیں۔\n\n00:26.100 --> 00:27.880\nآخر کار انسان ہی ذمہ دار ہیں۔\n\n00:27.880 --> 00:31.460\nاے آئی ٹولز کو اپنے اعمال کے\nنتائج کی کوئی پرواہ نہیں ہوتی۔\n\n00:31.460 --> 00:35.040\nجیسا کہ ہم نے دیکھا ہے، اس کے\nپیچھے بہت سارا ریاضی کا کام ہے۔\n\n00:35.040 --> 00:37.580\nیہ ایک ریاضیاتی مساوات کے ذریعے\n\n00:37.580 --> 00:41.680\nاپنے ان پٹس اور آؤٹ پٹس کے درمیان\nپیٹرن تلاش کرنے کی کوشش کر رہا ہوتا ہے،\n\n00:41.680 --> 00:44.880\nلہٰذا اس میں کوئی جذبات\nیا احساسات شامل نہیں ہوتے۔\n\n00:44.880 --> 00:49.760\nاور ہم نے جو دیکھا ہے، ان اے آئی ٹولز\nکا استعمال غلط گرفتاریوں کا سبب بننے،\n\n00:49.760 --> 00:54.840\nکسی کی غلط تشخیص کرنے، اور یہاں تک کہ مہلک\nحادثات کا باعث بننے کے لیے بھی کیا گیا ہے۔\n\n00:54.840 --> 00:57.760\nاور اس کی وجہ یہ ہے کہ یہ صرف ایک ٹول ہے،\n\n00:57.760 --> 01:00.400\nلہٰذا جو لوگ اسے بناتے\nاور استعمال کرتے ہیں\n\n01:00.400 --> 01:03.120\nوہی آخر کار جو کچھ ہوتا\nہے اس کے ذمہ دار ہیں۔\n\n01:03.740 --> 01:07.600\nتو اب جب کہ ہم یہ سمجھ چکے ہیں\nکہ انسان اس کے مرکز میں ہیں،\n\n01:07.600 --> 01:13.380\nتو وہ کون سے طریقے ہیں جن سے ہم ان اے آئی کی\nغلطیوں سے ہونے والے نقصان کو کم کر سکتے ہیں؟\n\n01:13.380 --> 01:17.220\nتو ویڈیو کو روکیں اور اس بارے\nمیں چند سیکنڈ کے لیے سوچیں۔\n\n01:18.720 --> 01:22.280\nتو ہم اسے انسانوں کے دو کرداروں\nکے حوالے سے دیکھ سکتے ہیں\n\n01:22.280 --> 01:24.680\nکہ وہ ان نقصانات کو کیسے کم کر سکتے ہیں:\n\n01:24.680 --> 01:28.600\nایک تخلیق کار کے نقطۂ نظر سے،\nاور دوسرا صارف کے نقطۂ نظر سے۔\n\n01:28.600 --> 01:32.880\nاب ان اے آئی ٹولز کے تخلیق\nکار کے طور پر یہ ضروری ہے\n\n01:32.880 --> 01:36.380\nکہ آپ تعصب کو اپنی بہترین\nصلاحیتوں کے مطابق کم کرنے کے لیے\n\n01:36.380 --> 01:38.920\nاعلیٰ معیار اور متنوع ڈیٹا شامل کریں۔\n\n01:38.920 --> 01:41.920\nلیکن یاد رکھیں، تمام انسان متعصب ہوتے ہیں\n\n01:41.920 --> 01:44.840\nکیونکہ ہم سب چیزوں کو مختلف\nنقطۂ نظر سے دیکھتے ہیں،\n\n01:44.840 --> 01:47.760\nاس لیے دوسرے لوگوں کے\nمختلف نقطۂ نظر کو سننا\n\n01:47.760 --> 01:51.940\nاور اپنے اے آئی ٹولز کی حدود کے\nبارے میں ایماندار ہونا بہت ضروری ہے۔\n\n01:52.400 --> 01:54.880\nاب اگر آپ ان اے آئی ٹولز کے صارف ہیں\n\n01:54.880 --> 01:58.380\nتو یہ ہمیشہ اہم ہے کہ جب آپ\nکے فیصلے میں کوئی خطرہ شامل ہو\n\n01:58.380 --> 02:01.000\nتو آپ اے آئی ٹولز کے\nنتائج کو دوبارہ چیک کریں،\n\n02:01.000 --> 02:02.660\nاور اس بات کو یقینی بنائیں\n\n02:02.660 --> 02:07.200\nکہ ان اے آئی ٹولز کو بہتر بنانے میں مدد کے\nلیے تخلیق کاروں کے ساتھ فیڈ بیک شیئر کریں۔\n\n02:07.200 --> 02:09.560\nتو اب آئیے اس مشق پر تھوڑا کام کرتے ہیں\n\n02:09.560 --> 02:12.840\nکہ ہم اپنے ریچھ اور کتے کے\nکلاسیفائر کو کیسے بہتر بنا سکتے ہیں۔\n\n02:12.840 --> 02:15.420\nتو سیاہ اور سفید رنگ کی خصوصیات کے علاوہ\n\n02:15.420 --> 02:17.080\nجن کے بارے میں ہم نے بات کی،\n\n02:17.080 --> 02:20.300\nجہاں ہم نے کالے ریچھوں\nاور سفید کتوں کا ذکر کیا،\n\n02:20.300 --> 02:21.880\nاور کون سی خصوصیات\n\n02:21.880 --> 02:23.940\nاور ان خصوصیات میں تغیرات\n\n02:23.940 --> 02:26.820\nہمارے کلاسیفائر کو بہتر\nبنانے میں مدد کر سکتے ہیں؟\n\n02:27.420 --> 02:29.040\nٹھیک ہے، تو ویڈیو کو روکیں\n\n02:29.040 --> 02:30.900\nاور ایک منٹ کے لیے اس بارے میں سوچیں،\n\n02:30.900 --> 02:36.340\nاور دیکھیں کہ ہمیں اور کن خصوصیات اور\nان خصوصیات کی اقسام پر غور کرنا چاہیے۔\n\n02:38.670 --> 02:42.610\nٹھیک ہے، تو ایسی بہت سی چیزیں ہیں\nجن کے بارے میں ہم سوچ سکتے ہیں\n\n02:42.610 --> 02:44.970\nکہ ہم تعصب کو کیسے کم کر سکتے ہیں\n\n02:44.970 --> 02:48.790\nاور اپنے اے آئی ماڈلز میں مزید\nنقطۂ نظر کیسے شامل کر سکتے ہیں۔\n\n02:48.790 --> 02:53.410\nجیسا کہ آپ نے دیکھا، ہمارے پاس\nریچھوں اور کتوں کی تعداد محدود ہے۔\n\n02:53.410 --> 02:56.970\nمختلف اقسام کے ریچھوں\nاور کتوں پر غور کرنا،\n\n02:56.970 --> 02:58.870\nیہ دیکھنا کہ وہ بچے ہیں\n\n02:58.870 --> 03:00.790\nیا بالغ، ان کا ماحول،\n\n03:00.790 --> 03:02.950\nاور خاص طور پر ان کے مختلف\n\n03:02.950 --> 03:04.510\nسائز کو سمجھنا اہم ہے۔\n\n03:04.510 --> 03:06.350\nاور سوچنے کے لیے بہت سی چیزیں ہیں،\n\n03:06.350 --> 03:09.070\nلیکن یہ کچھ ایسی چیزیں ہیں\nجن پر آپ غور کر سکتے ہیں۔\n"}, {"id": "lesson-4/05", "title": "ڈیٹا کی رازداری", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-05.mp4", "vtt": "WEBVTT\n\n00:00.430 --> 00:06.690\nٹھیک ہے، تو ہم یہ سمجھتے ہیں کہ متنوع ڈیٹا\nاہمیت رکھتا ہے، لیکن صرف اس لیے کہ ہم ڈیٹا\n\n00:06.690 --> 00:12.050\nاکٹھا کر سکتے ہیں، کیا ہمیں ایسا کرنا چاہیے؟\nاب ڈیٹا کہیں سے بھی آ سکتا ہے، بالکل اسی طرح\n\n00:12.050 --> 00:18.030\nجیسے ہم کئی جگہوں پر تصویریں لے سکتے ہیں۔\nتو مثال کے طور پر پارک کی اس تصویر میں ہمارے\n\n00:18.030 --> 00:23.210\nپاس انسانوں اور کتوں کی تصویریں ہیں، اور یہ\nممکنہ ڈیٹا ہے جسے ہم اپنے اے آئی ماڈل میں\n\n00:23.210 --> 00:24.310\nشامل کر سکتے ہیں۔\n\n00:24.310 --> 00:29.330\nتاہم تمام ڈیٹا استعمال کے لیے دستیاب نہیں ہوتا،\nاور اس لیے ہم اسے دو طریقوں سے دیکھ سکتے ہیں:\n\n00:29.330 --> 00:31.090\nعوامی بمقابلہ نجی ڈیٹا۔\n\n00:31.630 --> 00:36.890\nتو عوامی ڈیٹا وہ معلومات ہے جسے کوئی بھی\nدیکھ سکتا ہے، لیکن اس کے استعمال کے حوالے سے\n\n00:36.890 --> 00:38.130\nکچھ اصول ہو سکتے ہیں۔\n\n00:38.130 --> 00:42.830\nاب نجی ڈیٹا، یہ وہ معلومات\nہے جو کسی کی شناخت کر سکتی ہے\n\n00:42.830 --> 00:45.310\nیا ان کے بارے میں کچھ\nذاتی شیئر کر سکتی ہے،\n\n00:45.310 --> 00:49.470\nاور اسے استعمال کرنے اور دیکھنے\nکے لیے ہمیشہ اجازت درکار ہوتی ہے۔\n\n00:50.370 --> 00:53.290\nتو نجی ڈیٹا کی کچھ مثالیں یہ ہو سکتی ہیں،\n\n00:53.290 --> 00:59.450\nجیسے آپ کا چہرہ، آپ کی ای میلز اور\nفون نمبرز، آپ کی صحت یا طبی معلومات،\n\n00:59.450 --> 01:01.610\nنام یا دستخط، مالی معلومات،\n\n01:01.610 --> 01:08.050\nاور یہاں تک کہ آپ کا گھر کا پتہ۔ یہ تمام معلومات\nآپ کے بارے میں ذاتی ڈیٹا فراہم کر سکتی ہیں۔\n\n01:08.050 --> 01:10.690\nتو میں چاہتا ہوں کہ آپ\nاس سوال پر غور کریں:\n\n01:10.690 --> 01:16.030\nکیا ہوگا اگر کوئی اے آئی ٹول آپ کی اجازت کے\nبغیر آپ کی ذاتی تصاویر پر ٹرین کیا گیا ہو؟\n\n01:16.530 --> 01:18.310\nاس سے آپ کو کیسا محسوس ہوگا؟\n\n01:18.310 --> 01:21.890\nتو اس ویڈیو کو روکیں اور بس چند\nسیکنڈ کے لیے اس بارے میں سوچیں۔\n\n01:24.780 --> 01:28.460\nٹھیک ہے، تو شاید آپ کئی مختلف\nقسم کے جذبات محسوس کر رہے ہوں۔\n\n01:28.460 --> 01:31.120\nشاید آپ کو اپنی پرائیویسی\nکی خلاف ورزی محسوس ہو،\n\n01:31.120 --> 01:33.000\nشاید آپ شرمندگی محسوس کریں،\n\n01:33.000 --> 01:34.320\nشاید آپ کو غصہ آئے۔\n\n01:34.320 --> 01:37.160\nاہم بات یہ ہے کہ آپ کو چاہے\nکوئی بھی جذبہ محسوس ہو،\n\n01:37.160 --> 01:39.220\nآپ کو اپنی پرائیویسی کا حق حاصل ہے،\n\n01:39.220 --> 01:41.300\nلہٰذا آپ کو یہ اختیار حاصل ہے\n\n01:41.300 --> 01:44.620\nکہ آپ کنٹرول کریں کہ آپ کا ذاتی\nڈیٹا کیسے استعمال ہو رہا ہے۔\n\n01:44.620 --> 01:47.600\nتخلیق کاروں کے بارے میں بات یہ\nہے کہ انہیں بہت واضح ہونا چاہیے\n\n01:47.600 --> 01:49.600\nکہ وہ کون سا ڈیٹا اکٹھا کر رہے ہیں،\n\n01:49.600 --> 01:52.880\nاور اگر آپ انکار کریں تو انہیں آپ\nکے فیصلوں کا احترام کرنا چاہیے۔\n\n01:52.880 --> 01:57.280\nتو فرض کریں کہ آپ کے پاس، آپ جانتے\nہیں، مختلف قسم کا نجی ڈیٹا موجود ہے۔\n\n01:57.280 --> 01:59.980\nآپ انہیں اپنا چہرہ دیکھنے\nکی اجازت تو دے سکتے ہیں،\n\n01:59.980 --> 02:04.000\nلیکن ہو سکتا ہے کہ آپ انہیں اپنی\nمالی معلومات دیکھنے کی اجازت نہ دیں۔\n\n02:04.000 --> 02:07.040\nلیکن بات یہ ہے کہ ایسے واقعات پیش آئے ہیں\n\n02:07.040 --> 02:10.220\nجہاں تخلیق کاروں نے نجی\nڈیٹا کا غلط استعمال کیا ہے\n\n02:10.220 --> 02:12.400\nاور انہیں نتائج کا سامنا کرنا پڑا ہے۔\n\n02:12.400 --> 02:15.620\nEveralbum نامی ایک کمپنی تھی\nجس پر الزام لگایا گیا تھا\n\n02:15.620 --> 02:18.080\nکہ اس نے مناسب اجازت کے\nبغیر لوگوں کی تصاویر کو\n\n02:18.080 --> 02:20.360\nاے آئی ماڈلز کی تربیت کے لیے استعمال کیا،\n\n02:20.360 --> 02:22.340\nاور امریکی حکومت نے اس کا نوٹس لیا\n\n02:22.340 --> 02:25.440\nاور انہیں اپنا ڈیٹا اور اے آئی\nماڈلز ڈیلیٹ کرنے کا حکم دیا۔\n\n02:26.940 --> 02:29.120\nتو اب جب کہ ہم یہ سمجھ چکے ہیں،\n\n02:29.120 --> 02:30.900\nمیں آپ سے یہ سوال پوچھوں گا:\n\n02:30.900 --> 02:33.940\nان اے آئی ٹولز کو بناتے\nاور استعمال کرتے وقت\n\n02:33.940 --> 02:36.440\nہم پرائیویسی کی حفاظت کیسے کر سکتے ہیں؟\n\n02:36.440 --> 02:39.720\nاس ویڈیو کو روکیں اور چند\nسیکنڈ کے لیے اس بارے میں سوچیں۔\n\n02:42.700 --> 02:45.640\nٹھیک ہے، تو ہم اسے دو کرداروں\nکے لحاظ سے دیکھ سکتے ہیں:\n\n02:45.640 --> 02:49.200\nایک تخلیق کار کے نقطۂ نظر سے\nاور دوسرا صارف کے نقطۂ نظر سے۔\n\n02:49.200 --> 02:53.880\nاب ایک تخلیق کار کے طور پر آپ کو\nذاتی ڈیٹا استعمال کرنے سے پہلے\n\n02:53.880 --> 02:55.400\nہمیشہ اجازت لینی چاہیے۔\n\n02:55.400 --> 02:59.000\nآپ کو یہ واضح کرنے کی ضرورت ہے کہ\nاسے کیسے استعمال کیا جا رہا ہے،\n\n02:59.000 --> 03:02.580\nاور کوئی بھی ایسی ذاتی معلومات\nہٹا دینی چاہیے جس کی ضرورت نہ ہو۔\n\n03:02.580 --> 03:05.800\nاب ایک صارف کے نقطۂ نظر\nسے، آپ کو یہ پڑھنا چاہیے\n\n03:05.800 --> 03:08.240\nکہ آپ کا ذاتی ڈیٹا کیسے استعمال ہو رہا ہے،\n\n03:08.240 --> 03:10.340\nاور آپ کو سوالات پوچھنے چاہئیں\n\n03:10.340 --> 03:12.740\nکہ آپ کا ڈیٹا کس طرح\nاستعمال کیا جا رہا ہے۔\n\n03:12.740 --> 03:14.960\nآپ کو اپنی ذاتی معلومات پر حق حاصل ہے،\n\n03:14.960 --> 03:16.700\nاور آپ انکار کر سکتے ہیں\n\n03:16.700 --> 03:19.740\nیا جو کچھ شیئر کیا جا رہا\nہے اسے محدود کر سکتے ہیں۔\n\n03:19.740 --> 03:22.040\nٹھیک ہے، تو آئیے یہ مشق کرتے ہیں\n\n03:22.040 --> 03:24.500\nکہ ہم اپنے ریچھ اور کتے کے کلاسیفائر میں\n\n03:24.500 --> 03:26.840\nپرائیویسی کی حفاظت کیسے کر سکتے ہیں۔\n\n03:26.840 --> 03:29.560\nتو فرض کریں کہ ہمارے پاس یہاں یہ تصویر ہے،\n\n03:29.560 --> 03:32.300\nاور ہم اسے اپنے ریچھ\nاور کتے کے کلاسیفائر میں\n\n03:32.300 --> 03:34.140\nاس کتے کے لیے شامل کرنا چاہتے ہیں۔\n\n03:34.140 --> 03:36.240\nآپ اس بات کو کیسے یقینی بنائیں گے\n\n03:36.240 --> 03:39.780\nکہ یہ تصویر ہمارے ریچھ\nبمقابلہ کتے کے کلاسیفائر میں\n\n03:39.780 --> 03:42.160\nاستعمال ہونے سے پہلے\nپرائیویسی کا خیال رکھتی ہے؟\n\n03:42.160 --> 03:46.200\nاور بس آپ کی اطلاع کے لیے، اس تصویر\nمیں موجود کتے کا کوئی مالک نہیں ہے۔\n\n03:46.200 --> 03:50.280\nٹھیک ہے، تو ویڈیو کو روکیں اور اس\nبارے میں چند سیکنڈ کے لیے سوچیں۔\n\n03:52.880 --> 03:58.000\nٹھیک ہے، تو بات یہ ہے کہ ہمیں اس\nتصویر میں کچھ نجی ڈیٹا ملا ہے۔\n\n03:58.000 --> 04:00.240\nاس میں ہمارے پاس اس شخص کے گھر کا پتہ،\n\n04:00.240 --> 04:03.480\nان کی کار کا لائسنس اور\nاس شخص کا چہرہ موجود ہے۔\n\n04:03.480 --> 04:07.880\nتو فرض کریں کہ ہم اس تصویر کو بالکل\nاسی طرح استعمال کرنا چاہتے ہیں،\n\n04:07.880 --> 04:10.860\nایسے معاملات میں ہمیں\nہمیشہ اجازت لینی چاہیے۔\n\n04:10.860 --> 04:14.040\nاب بات یہ ہے کہ ایک بار جب\nہمارے پاس یہ تصویر آ جائے،\n\n04:14.040 --> 04:15.040\nتو آپ جانتے ہیں،\n\n04:15.040 --> 04:19.080\nدوسری بات یہ ہے کہ بس وہ تمام نجی\nڈیٹا ہٹا دیں جس کی ضرورت نہیں ہے۔\n\n04:19.080 --> 04:22.020\nہمارے ریچھ اور کتے کے\nکلاسیفائر کے بارے میں بات یہ ہے\n\n04:22.020 --> 04:23.660\nکہ ہمیں صرف کتے سے غرض ہے،\n\n04:23.660 --> 04:27.120\nلہٰذا یہ کسی شخص کی پرائیویسی\nکو محفوظ رکھنے کا ایک طریقہ ہے\n\n04:27.120 --> 04:29.860\nکہ بس تمام غیر ضروری\nڈیٹا کو نکال دیا جائے۔\n\n04:29.860 --> 04:32.640\nاور اگر آپ پوری تصویر کو\nکاٹنے کا فیصلہ نہیں کرتے،\n\n04:32.640 --> 04:35.520\nتو آپ نجی معلومات کو دھندلا\n(بلر) بھی کر سکتے ہیں۔\n"}, {"id": "lesson-4/06", "title": "ذمہ دار مصنوعی ذہانت", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-06.mp4", "vtt": "WEBVTT\n\n00:00.240 --> 00:06.040\nٹھیک ہے، تو ہم نے ڈیٹا کے تعصب اور ڈیٹا کی\nپرائیویسی کے اس تصور کے بارے میں بات کی، اور\n\n00:06.040 --> 00:09.280\nیہ کہ آخر کار انسان ہی\nان چیزوں کے ذمہ دار ہیں۔\n\n00:09.280 --> 00:12.260\nاسی کو ہم ذمہ دارانہ اے آئی کہتے ہیں۔\n\n00:12.260 --> 00:18.960\nاس کا مقصد یہ یقینی بنانا ہے کہ لوگ ان اے آئی\nٹولز کے ذمہ دار تخلیق کار اور تنقیدی صارفین بنیں۔\n\n00:18.960 --> 00:24.960\nاور سب سے اہم بات جو میں چاہتا ہوں کہ آپ\nیاد رکھیں وہ یہ ہے کہ ہم میں سے ہر ایک کا\n\n00:24.960 --> 00:28.260\nاے آئی ٹولز کے بننے اور استعمال\nہونے کے طریقے کو تشکیل دینے میں\n\n00:28.260 --> 00:33.140\nکردار ہے۔ یاد رکھیں، اور یہ صرف\nاے آئی تک محدود نہیں ہے بلکہ عام\n\n00:33.140 --> 00:37.000\nطور پر ٹیکنالوجی کے بارے میں بھی\nہے، کہ ٹیکنالوجی دراصل انسانی\n\n00:37.000 --> 00:38.260\nفیصلوں کا ہی نتیجہ ہے۔\n"}, {"id": "lesson-4/07", "title": "جائزہ کوئز", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=ur"}, {"id": "lesson-4/08", "title": "پروجیکٹ کا وقت", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/ur-lesson-4-08.mp4", "vtt": "WEBVTT\n\n00:00.080 --> 00:06.260\nٹھیک ہے، تو اب سبق نمبر چار کے لیے پروجیکٹ\nکا وقت ہے، جو ہمارا آخری سبق ہے۔ تو میں چاہتا\n\n00:06.260 --> 00:12.280\nہوں کہ اب آپ اپنے نقطۂ نظر کو وسیع کریں۔ اب\nان خصوصیات کے بارے میں سوچیں جو آپ نے سبق تین\n\n00:12.280 --> 00:16.620\nمیں مختلف گروپس کے درمیان فرق کرنے کے لیے\nاستعمال کی تھیں، اور دیکھیں کہ آپ کس طرح مزید\n\n00:16.620 --> 00:21.820\nورائٹی شامل کر سکتے ہیں، دوسری خصوصیات کو\nتلاش کر سکتے ہیں، یا اس تعصب کو کم کرنے کے لیے\n\n00:21.820 --> 00:25.020\nدوسرے لوگوں سے فیڈ بیک بھی\nلے سکتے ہیں۔ یاد رکھیں، کوئی\n\n00:25.020 --> 00:27.020\nبھی کلاسیفائر مکمل نہیں ہوتا، اور یہ\n\n00:27.020 --> 00:28.800\nاے آئی کے کام کرنے کا ایک حصہ ہے۔\n\n00:28.800 --> 00:30.980\nاس کے تعصب کی وضاحت کریں اور\n\n00:30.980 --> 00:32.960\nبتائیں کہ آپ اسے کیسے کم کر سکتے ہیں۔\n\n00:33.820 --> 00:35.060\nتو یہ آخری\n\n00:35.060 --> 00:36.600\nسبق ہے، مبارک ہو!\n\n00:36.600 --> 00:38.880\nتو آپ اپنے سبق نمبر چار\n\n00:38.880 --> 00:40.860\nکے سوال پر کام کرنے والے ہیں، اور اگر\n\n00:40.860 --> 00:42.800\nآپ جلدی فارغ ہو جاتے ہیں اور اگر آپ کے\n\n00:42.800 --> 00:44.960\nاستاد اجازت دیں تو آپ اپنے کلاسیفائر\n\n00:44.960 --> 00:46.260\nپر کام جاری رکھ سکتے ہیں۔\n\n00:47.060 --> 00:48.980\nٹھیک ہے، تو یہ ہمارا آخری سوال\n\n00:48.980 --> 00:51.040\nہے: ذمہ دار اے آئی کی تعمیر۔\n\n00:51.540 --> 00:52.820\nتعصب کو کم کرنے کے لیے\n\n00:52.820 --> 00:54.740\nآپ اپنی خصوصیات میں مزید ورائٹی\n\n00:54.740 --> 00:56.000\nلانے کے لیے کیا کر سکتے ہیں؟\n\n00:56.560 --> 00:58.480\nاور تو یہ وہ جواب ہے جو\n\n00:58.480 --> 01:00.860\nطالب علم نے دیا: \"میں مختلف جگہوں\n\n01:00.860 --> 01:02.360\nسے پھلوں کی تصاویر لوں گا\n\n01:02.360 --> 01:04.520\nتاکہ اے آئی صرف ایک جگہ سے تجزیہ\n\n01:04.520 --> 01:06.660\nنہ کرے، اور میں اپنے دوستوں سے بھی کہوں گا\n\n01:06.660 --> 01:08.580\nکہ وہ چیک کریں کہ کیا یہ ان کے لیے\n\n01:08.580 --> 01:10.420\nبھی ٹھیک کام کر رہا ہے۔ اور اگر میں کسی\n\n01:10.420 --> 01:12.700\nکا چہرہ یا کوئی نجی چیز استعمال کروں گا\n\n01:12.700 --> 01:14.180\nتو میں پہلے اجازت لوں گا۔\"\n\n01:14.180 --> 01:15.880\nتو یاد رکھیں، ایک بار پھر\n\n01:15.880 --> 01:17.940\nنجی معلومات کی طرف واپس آتے ہیں:\n\n01:17.940 --> 01:19.940\nاگر آپ کوئی ایسی چیز استعمال کرتے ہیں\n\n01:19.940 --> 01:21.520\nجس میں کوئی ذاتی معلومات شامل ہوں\n\n01:21.520 --> 01:23.180\nتو اجازت لینا یقینی بنائیں۔\n"}, {"id": "lesson-4/09", "title": "ورک شیٹ", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=4&lang=ur"}]}, {"id": "resources", "kicker": "اساتذہ اور طلبہ کے لیے", "title": "وسائل", "items": [{"id": "resources/1", "title": "اساتذہ کے لیے رہنما", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1Tja-c5fOWdJHeqZjejaXre23MyECkk3EqY80X_VTOBE/preview", "size": 103747}, {"id": "resources/2", "title": "ورک شیٹ", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1lM2HA8BfqiMFW09rwOMKMRu_qn8JVUXSmvtyK0bjjiE/preview", "size": 80776}, {"id": "resources/3", "title": "ورک شیٹ (مثال)", "type": "pdf", "kind": "PDF", "src": "https://doc       '<p>Run <code>python -I scripts/build_course.py assemble</code> to create START HERE.html.</p></div></div>';
    pager.hidden = true;
    return;
  }

  // ---------- Text and direction ----------
  var UI = COURSE.ui;
  var RTL = COURSE.dir === 'rtl';
  document.documentElement.lang = COURSE.lang;
  document.documentElement.dir = COURSE.dir;

  // t('position', { n: 2, total: 7 }) -> "2 of 7" in the package's language.
  function t(key, vars) {
    var s = UI[key] == null ? key : String(UI[key]);
    if (vars) {
      Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(String(vars[k])); });
    }
    return s;
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-text]'), function (el) { el.textContent = t(el.getAttribute('data-text')); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-label]'), function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-label'))); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-title]'), function (el) { el.title = t(el.getAttribute('data-title')); });

  // ---------- Data ----------
  var SECTIONS = COURSE.sections;
  var items = [];
  var byId = {};
  SECTIONS.forEach(function (section) {
    section.items.forEach(function (item, i) {
      item.section = section;
      item.indexInSection = i;
      item.index = items.length;
      items.push(item);
      byId[item.id] = item;
    });
  });
  var KIND_TEXT = { Video: 'kindVideo', Quiz: 'kindQuiz', Worksheet: 'kindWorksheet', PDF: 'kindPdf', App: 'kindApp' };
  function kindText(kind) { return t(KIND_TEXT[kind] || 'kindApp'); }

  var ICONS = {
    Video: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor" stroke="none"/>',
    Quiz: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.3"/><path d="M12 16.9v.1"/>',
    Worksheet: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
    Activity: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
    PDF: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
    App: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 2.5V6M14.5 2.5V6M9.5 18v3.5M14.5 18v3.5M2.5 9.5H6M2.5 14.5H6M18 9.5h3.5M18 14.5h3.5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
    external: '<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
    full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'
  };

  // Inside the Android app (course/app), the page is served by the app, which adds the
  // Capacitor bridge: it has app settings, and PDFs open in the phone's PDF viewer.
  var cap = window.Capacitor;
  var inApp = !!(cap && cap.nativePromise && cap.isNativePlatform && cap.isNativePlatform());
  function appSettingsLink(cls) {
    return inApp ? '<button class="' + cls + '" type="button" data-app-settings>' + icon('settings') + esc(t('appSettings')) + '</button>' : '';
  }
  document.addEventListener('click', function (e) {
    if (!inApp) return;
    if (e.target.closest('[data-app-settings]')) {
      cap.nativePromise('CoursePack', 'openShell', { screen: 'settings' });
      return;
    }
    var a = e.target.closest('a[href]');
    var href = a && a.getAttribute('href');
    if (href && /\.pdf$/i.test(href)) {
      e.preventDefault();
      cap.nativePromise('CoursePack', 'openFile', { path: decodeURIComponent(href), type: 'application/pdf' })
        .catch(function (err) { if (err && err.code === 'noViewer') alert(t('noPdfViewer')); });
    }
  });
  function icon(name, cls) {
    return '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.Activity) + '</svg>';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtSize(bytes) {
    if (!bytes) return '';
    return bytes > 1e6 ? Math.round(bytes / 1e6) + ' MB' : Math.max(1, Math.round(bytes / 1e3)) + ' KB';
  }

  // ---------- Progress (saved on this device, per package) ----------
  // Pages opened from disk can share storage, so the key includes the package id
  // to keep two languages' progress apart.
  var STORE_KEY = 'aile_course_' + COURSE.package;
  var state = { completed: [], last: null };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && Array.isArray(saved.completed)) state = { completed: saved.completed, last: saved.last || null };
  } catch (e) { /* storage unavailable: progress lasts for this visit only */ }
  var done = {};
  state.completed.forEach(function (id) { if (byId[id]) done[id] = true; });

  function save() {
    state.completed = Object.keys(done);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  function setDone(id, value) {
    if (!!done[id] === value) return;
    if (value) done[id] = true; else delete done[id];
    save();
    renderSidebar();
    updateDoneBtn();
    // Tick the step under the content in place: re-rendering the view would restart a video.
    var step = view.querySelector('.steps a[href="#/' + id + '"]');
    if (step) {
      step.classList.toggle('done', value);
      var title = step.querySelector('.it-title');
      var sr = title.querySelector('.sr-only');
      if (value && !sr) title.insertAdjacentHTML('beforeend', '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>');
      if (!value && sr) sr.remove();
    }
  }
  function countDone(list) {
    return list.reduce(function (n, it) { return n + (done[it.id] ? 1 : 0); }, 0);
  }

  // ---------- Routing ----------
  var current = null; // current item, or null on the home screen
  var expanded = {};

  function routeId() {
    var h = location.hash || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (h.charAt(0) === '/') h = h.slice(1);
    return decodeURIComponent(h);
  }
  function go(item) {
    location.hash = item ? '#/' + item.id : '#/';
  }
  function onRoute() {
    var id = routeId();
    current = byId[id] || null;
    if (id && !current) { history.replaceState(null, '', '#/'); }
    if (current) {
      expanded[current.section.id] = true;
      state.last = current.id;
      save();
    }
    closeMenu();
    renderView();
    renderSidebar();
    renderPager();
    scrollCurrentIntoView();
  }

  // ---------- Sidebar ----------
  function renderSidebar() {
    var total = items.length, n = countDone(items);
    var html = '';
    html += '<a class="side-link' + (current ? '' : ' current') + '" href="#/">' + icon('home') + esc(t('courseHome')) + '</a>';
    html += '<div class="side-progress">' + esc(t('yourProgress', { done: n, total: total })) +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + n + '"><span style="width:' + (100 * n / total) + '%"></span></div></div>';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), open = !!expanded[section.id];
      html += '<div class="group">' +
        '<button class="group-head" type="button" data-section="' + esc(section.id) + '" aria-expanded="' + open + '">' +
        '<span class="group-titles"><span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span></span>' +
        '<span class="g-count' + (sd === section.items.length ? ' all' : '') + '">' + sd + '/' + section.items.length + '</span>' +
        '<span class="flip">' + icon('chev', 'chev') + '</span></button><ol class="group-items">';
      section.items.forEach(function (item) {
        var cls = 'it' + (done[item.id] ? ' done' : '') + (current === item ? ' current' : '');
        html += '<li><a class="' + cls + '" href="#/' + esc(item.id) + '"' + (current === item ? ' aria-current="page"' : '') + '>' +
          '<span class="status">' + icon('check') + '</span>' +
          '<span class="it-title">' + esc(item.title) + (done[item.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
          '<span class="it-kind" title="' + esc(kindText(item.kind)) + '">' + icon(item.kind) + '</span></a></li>';
      });
      html += '</ol></div>';
    });
    html += appSettingsLink('side-link app-settings');
    html += '<div class="side-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</div>';
    sideContent.innerHTML = html;
  }
  sideContent.addEventListener('click', function (e) {
    var head = e.target.closest('.group-head');
    if (!head) return;
    var id = head.getAttribute('data-section');
    expanded[id] = !expanded[id];
    head.setAttribute('aria-expanded', String(expanded[id]));
  });
  function scrollCurrentIntoView() {
    var el = sideContent.querySelector('.it.current');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Mobile drawer ----------
  function openMenu() {
    sidebar.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true');
    scrollCurrentIntoView();
  }
  function closeMenu() {
    sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  scrim.addEventListener('click', closeMenu);

  // ---------- Views ----------
  function firstOpenItem(list) {
    for (var i = 0; i < list.length; i++) if (!done[list[i].id]) return list[i];
    return list[0];
  }

  function renderHome() {
    var total = items.length, n = countDone(items);
    var resume = byId[state.last] || null;
    var primary = n === total ? null : (resume && !done[resume.id] ? resume : firstOpenItem(items));
    var html = '<div class="home"><section class="hero">' +
      '<span class="kicker">' + esc(t('brand')) + '</span>' +
      '<h1 tabindex="-1">' + esc(COURSE.courseName) + '</h1>' +
      '<p>' + esc(n === total ? t('heroFinished') : t('heroText')) + '</p>' +
      '<div class="hero-progress">' + esc(t('activitiesDone', { done: n, total: total })) +
      '<div class="bar"><span style="width:' + (100 * n / total) + '%"></span></div></div>' +
      '<div class="hero-actions">' +
      (primary
        ? '<a class="btn" href="#/' + esc(primary.id) + '">' + icon('play') + '<span>' +
          esc(n === 0 ? t('startCourse') : t('continue', { title: primary.title })) + '</span></a>'
        : '') +
      '<button class="btn secondary" type="button" data-open-np><span class="np-icon" aria-hidden="true"></span>' + esc(t('openNeuroPocket')) + '</button>' +
      '</div></section>' +
      '<h2 class="section-title">' + esc(t('lessons')) + '</h2><div class="cards">';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), len = section.items.length;
      var tag = sd === len ? '<span class="tag done">' + esc(t('tagDone')) + '</span>'
        : sd ? '<span class="tag progress">' + esc(t('tagInProgress')) + '</span>'
        : '<span class="tag">' + esc(t('activities', { total: len })) + '</span>';
      html += '<a class="card" href="#/' + esc(firstOpenItem(section.items).id) + '">' + tag +
        '<span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span>' +
        '<span class="card-meta">' + esc(t('sectionDone', { done: sd, total: len })) +
        '<span class="bar"><span style="width:' + (100 * sd / len) + '%"></span></span></span></a>';
    });
    html += '</div><p class="home-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</p>' +
      appSettingsLink('chip-btn home-settings') + '</div>';
    return html;
  }

  var pdfInline = navigator.pdfViewerEnabled === true ||
    (navigator.pdfViewerEnabled === undefined && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent));

  function renderItem(item) {
    var section = item.section;
    var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
