its predictions may not actually\n\n76\n00:04:58.920 --> 00:05:03.100\nmatch our expectations. So you can see\nover here that each of these can be a\n\n77\n00:05:03.100 --> 00:05:06.560\nrepresenting of a number that we're\ngoing to be calculating in that equation.\n\n78\n00:05:07.080 --> 00:05:12.100\nAnd so this idea just applies to just\nin general, any type of AI model, right?\n\n79\n00:05:12.220 --> 00:05:16.980\nSo even like language models or conversational\nAI tools, they basically take your\n\n80\n00:05:16.980 --> 00:05:21.820\nwords, you have to turn them into numbers,\nyou do math on them, and then you turn\n\n81\n00:05:21.820 --> 00:05:24.880\nthem back into words so you can\nbasically understand it, right?\n\n82\n00:05:25.260 --> 00:05:30.980\nSo basically a lot of it is doing a lot\nof math equations and calculations at the\n\n83\n00:05:30.980 --> 00:05:33.000\nend of the day to come\nup with a prediction.\n\n84\n00:05:34.520 --> 00:05:39.100\nSo, the key thing that I want you\nto get at is that AI isn't magic.\n\n85\n00:05:39.540 --> 00:05:42.260\nIt's basically math that's\nguided by human choices.\n\n86\n00:05:42.460 --> 00:05:46.980\nAnd I say this not to undermine it, but I\nwant it to be very distinct that it really\n\n87\n00:05:46.980 --> 00:05:49.580\nis just math that's\nguided by human choices.\n\n88\n00:05:50.360 --> 00:05:55.180\nSo, for example, whenever we look at AI\nadaptiveness, right, AI adapts basically\n\n89\n00:05:55.180 --> 00:05:59.300\nusing the learning algorithms that was\nwritten from humans that runs on machine.\n\n90\n00:05:59.300 --> 00:06:05.120\nSo, as we mentioned and as we saw, this\nrequires a lot of math calculation, which\n\n91\n00:06:05.120 --> 00:06:10.640\ntakes a lot of energy. So, NeuroPocket\nis basically using the energy or is\n\n92\n00:06:10.640 --> 00:06:13.160\ncalculating right on your device, right?\n\n93\n00:06:13.160 --> 00:06:17.200\nSo, a lot of the heavy math is going to\nuse a lot of energy, making your device get\n\n94\n00:06:17.200 --> 00:06:19.880\nwarm and it's going to drain\nsome batteries, like so.\n\n95\n00:06:20.680 --> 00:06:26.480\nNow, the reality is the environmental cost of\nAI is that while NeuroPocket works right on\n\n96\n00:06:26.480 --> 00:06:31.340\nyour device, the thing about most AIs is\nthat they run on giant buildings filled\n\n97\n00:06:31.340 --> 00:06:33.440\nwith thousands of computers, right?\n\n98\n00:06:33.440 --> 00:06:37.940\nSo these buildings use as much as\nelectricity as small cities and billions of\n\n99\n00:06:37.940 --> 00:06:41.180\ngallons of water just to keep themselves\ncool in order to do a lot of these\n\n100\n00:06:41.180 --> 00:06:42.860\ndifferent types of math calculations.\n\n101\n00:06:42.860 --> 00:06:46.040\nSo it could definitely be a\nhuge cost to our environment.\n\n102\n00:06:47.020 --> 00:06:49.080\nThe other thing is now AI's autonomy.\n\n103\n00:06:49.440 --> 00:06:53.240\nWell, AI autonomy is like, you know,\nAI makes predictions by finding its own\n\n104\n00:06:53.240 --> 00:06:55.720\npatterns in massive amounts of data.\n\n105\n00:06:56.620 --> 00:07:01.160\nAnd so as humans, we basically provide\nexamples or feedback to really help guide its\n\n106\n00:07:01.160 --> 00:07:05.700\nprediction. So for example, you were the\none that collected data to train your\n\n107\n00:07:05.700 --> 00:07:08.640\nNeuroPocket app. And so there's actually,\n\n108\n00:07:09.580 --> 00:07:13.080\nin the big scheme of things, there's a lot\nof humans that are actually behind these\n\n109\n00:07:13.080 --> 00:07:17.580\nAI. With NeuroPocket, it was just either\nyou or maybe a few other friends that were\n\n110\n00:07:17.580 --> 00:07:22.220\ncollecting the data. But most AI requires\nmillions of people to clean up the data\n\n111\n00:07:22.220 --> 00:07:23.940\nand to guide those AI models.\n\n112\n00:07:24.400 --> 00:07:29.300\nAnd so without those human choices, the machine\njust wouldn't know how to find those right patterns.\n\n113\n00:07:31.040 --> 00:07:35.180\nSo at the end of the day, really what you\nwant to understand about how AI works is\n\n114\n00:07:35.180 --> 00:07:39.000\nthat AI tools are really just\na product of human choices.\n"}, {"id": "lesson-3/07", "title": "Recap Quiz", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=en"}, {"id": "lesson-3/08", "title": "Project Time", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-08.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:02.360\nOkay, lesson number three, project time.\n\n2\n00:00:02.820 --> 00:00:05.240\nIt's time for you to start\nthinking about your features.\n\n3\n00:00:05.780 --> 00:00:09.400\nBased on your lesson two data, I want\nyou to think a little bit more deeper.\n\n4\n00:00:09.900 --> 00:00:13.900\nThink about the key features that you\nuse to distinguish your groups apart.\n\n5\n00:00:14.400 --> 00:00:17.000\nWas it maybe the color? Was it the size?\n\n6\n00:00:17.220 --> 00:00:21.860\nWas it the shape? What other features\nwere you thinking about that distinguished\n\n7\n00:00:21.860 --> 00:00:26.360\nyour groups apart? Okay, so you're going\nto answer that for lesson three question on\n\n8\n00:00:26.360 --> 00:00:29.980\nyour worksheet. And if you finish early,\njust keep improving your AI classifier.\n\n9\n00:00:29.980 --> 00:00:34.080\nIf your teacher allows it, go out there\nto collect more data so you can continue\n\n10\n00:00:34.080 --> 00:00:35.440\nworking on your AI classifier.\n\n11\n00:00:35.780 --> 00:00:37.080\nSo collect more data if needed.\n\n12\n00:00:37.960 --> 00:00:41.740\nSo an example response for Lesson\n3, which is identifying features.\n\n13\n00:00:42.260 --> 00:00:45.940\nWhat features will your classifier\nuse to categorize the data?\n\n14\n00:00:46.340 --> 00:00:48.280\nSo in this example, the student said this.\n\n15\n00:00:48.680 --> 00:00:50.740\nI will use color, shape, and size.\n\n16\n00:00:51.160 --> 00:00:54.240\nFor example, bananas are long and yellow.\n\n17\n00:00:54.720 --> 00:00:56.400\nOranges are round and orange.\n\n18\n00:00:56.640 --> 00:00:59.000\nAnd avocados are oval and green.\n\n19\n00:00:59.000 --> 00:01:01.960\nthese features make\nthem easy to tell apart.\n"}, {"id": "lesson-3/09", "title": "Worksheet", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=en"}]}, {"id": "lesson-4", "kicker": "Lesson 4", "title": "Can Machines Be Responsible", "items": [{"id": "lesson-4/01", "title": "Objectives", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-01.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:01.460\nOkay, lesson number four.\n\n2\n00:00:01.660 --> 00:00:03.320\nCan machines be responsible?\n\n3\n00:00:04.000 --> 00:00:06.920\nSo what we're going to be learning in\nlesson four's objective is we're going to\n\n4\n00:00:06.920 --> 00:00:11.840\nexplain how data bias leads to inaccurate\npredictions, explain why humans are\n\n5\n00:00:11.840 --> 00:00:14.220\nresponsible for AI and how to reduce harm.\n\n6\n00:00:14.380 --> 00:00:18.380\nWe're going to explain simple ways to\nprotect people's privacy, and we're going to\n\n7\n00:00:18.380 --> 00:00:23.720\nrecognize how bias, privacy, and\nresponsibility connects to responsible AI.\n"}, {"id": "lesson-4/02", "title": "Bearly a Dog Challenge", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-02.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:02.440\nWe're going to do a challenge\ncalled the Bearly a Dog challenge.\n\n2\n00:00:02.900 --> 00:00:06.980\nAnd your goal is to build a model that\ntells bears and dogs apart that passes all\n\n3\n00:00:06.980 --> 00:00:11.420\ntest cases. Your constraint is that you\nhave three minutes, you can pick up to 10\n\n4\n00:00:11.420 --> 00:00:13.820\nbears, and you can pick up to 10 dogs.\n\n5\n00:00:14.260 --> 00:00:16.980\nTo find this challenge, you go\nback to the NeuroPocket app.\n\n6\n00:00:17.100 --> 00:00:19.400\nYou're going to see something\ncalled Try Bias Challenge.\n\n7\n00:00:19.860 --> 00:00:23.700\nClick on it, click Start Challenge, and\nyou're going to immediately see that you can\n\n8\n00:00:23.700 --> 00:00:26.040\nselect up to 10 bears and the 10 dogs.\n\n9\n00:00:26.520 --> 00:00:30.100\nAnd just like how you've been using\nNeuroPocket, it after you collect your data, you\n\n10\n00:00:30.100 --> 00:00:33.540\ngo to training, and then you go to your\nmodel where you're going to run all test\n\n11\n00:00:33.540 --> 00:00:35.420\ncases and see if you pass everything.\n\n12\n00:00:36.460 --> 00:00:39.560\nOK, so let's get started with this challenge,\nand I'll see you guys in the end of it.\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "What is Bias", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-03.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.960 --> 00:00:05.160\nOkay. So, welcome back. So, after playing\nthe Bearly a Dog challenge, here's a\n\n2\n00:00:05.160 --> 00:00:09.220\nquestion for you. What were your results\nand why do you think they happened?\n\n3\n00:00:09.940 --> 00:00:11.960\nSo, did you pass all the test cases?\n\n4\n00:00:12.260 --> 00:00:14.740\nDid you pass some of them?\nDid you fail all of them?\n\n5\n00:00:15.380 --> 00:00:17.820\nSo, just pause the video and\nthink about it for a few seconds.\n\n6\n00:00:20.000 --> 00:00:25.020\nOkay. So, if you were able to pass all\nthe test cases, this could be because of\n\n7\n00:00:25.020 --> 00:00:28.960\nhuman bias. Now, the thing about humans\nis that we all see the world differently\n\n8\n00:00:28.960 --> 00:00:31.660\nbecause, well, we all have\ndifferent life experiences.\n\n9\n00:00:32.140 --> 00:00:35.380\nAnd we call this limited\nperspective of the world bias.\n\n10\n00:00:35.900 --> 00:00:38.080\nSo this image does a good\njob of explaining it.\n\n11\n00:00:38.280 --> 00:00:42.480\nYou know, you have these three people and\nthe person on the left has like the trunk\n\n12\n00:00:42.480 --> 00:00:44.200\nof the elephant and thinks it's a snake.\n\n13\n00:00:44.680 --> 00:00:48.740\nThe person in the middle thinks that it's\na wall and the person with the tail thinks\n\n14\n00:00:48.740 --> 00:00:53.020\nit's essentially a rope. So they all\nhave different experiences from the same\n\n15\n00:00:53.020 --> 00:00:57.100\nelephant. And so that is a reason why\nthey have these limited perspective.\n\n16\n00:00:58.400 --> 00:01:03.560\nAnd so what happens is that our bias, or\nour limited perspective, can really affect\n\n17\n00:01:03.560 --> 00:01:05.340\nthe features we choose in our data.\n\n18\n00:01:05.820 --> 00:01:08.400\nSo take, for example, the\nBearly a Dog challenge.\n\n19\n00:01:08.720 --> 00:01:13.240\nSo maybe someone might have just only\npicked black bears and white dogs, because\n\n20\n00:01:13.240 --> 00:01:15.180\nmaybe that's what they're\nmost familiar with.\n\n21\n00:01:15.440 --> 00:01:21.260\nBut the reality is bears can also be white,\nand dogs can also be black as well, too.\n\n22\n00:01:21.720 --> 00:01:25.980\nAnd what this biased data can result to\nis something called algorithmic bias.\n\n23\n00:01:26.780 --> 00:01:30.840\nSo whenever our bias data shows AI a\nlimited view instead of the full picture,\n\n24\n00:01:31.860 --> 00:01:33.680\nthis basically leads\nto inaccurate results.\n\n25\n00:01:34.460 --> 00:01:38.760\nSo for example, you can see over here that,\nremember in our data set, we made sure\n\n26\n00:01:38.760 --> 00:01:41.580\nthat the bears were all black\nand the dogs were all white.\n\n27\n00:01:42.060 --> 00:01:46.280\nSo whenever it saw an animal that\nwas white, it associated it as a dog.\n\n28\n00:01:46.680 --> 00:01:50.980\nAnytime it basically saw an animal that\nwas black, it associated it as a bear,\n\n29\n00:01:51.120 --> 00:01:55.600\nright? So basically, our bias was only\nshowing a limited view than the reality.\n\n30\n00:01:57.520 --> 00:02:00.560\nSo yes, our bear was classified as a dog.\n\n31\n00:02:01.600 --> 00:02:06.040\nNow, the thing I want to really be upfront\nabout, though, is that being biased is a\n\n32\n00:02:06.040 --> 00:02:07.560\nperfectly human thing, right?\n\n33\n00:02:07.560 --> 00:02:12.000\nIt only starts becoming a concern\nwhenever you apply it to others without\n\n34\n00:02:12.000 --> 00:02:14.860\nconsidering their own\nexperience and values.\n\n35\n00:02:15.480 --> 00:02:21.440\nAnd so basically, our biased data could\npotentially guide our AI to exclude the\n\n36\n00:02:21.440 --> 00:02:23.500\nvery people that we're\nactually trying to help.\n\n37\n00:02:24.300 --> 00:02:27.840\nSo some examples of this could be\nlike inaccurate medical results.\n\n38\n00:02:28.520 --> 00:02:33.740\nSo sometimes AI may analyze x-rays, and\nif they are not able to analyze enough\n\n39\n00:02:33.740 --> 00:02:36.760\npatients during training, they\ncan actually make mistakes.\n\n40\n00:02:37.220 --> 00:02:40.180\nSo you can see that it gave the\nincorrect diagnostic decision.\n\n41\n00:02:40.720 --> 00:02:44.940\nAnd the thing about doctors is that if they\noverly trust the results, and they don't\n\n42\n00:02:44.940 --> 00:02:49.180\ndouble check, well, someone could actually\nget the wrong diagnosis and that could be\n\n43\n00:02:49.180 --> 00:02:53.880\nreally bad. The other thing is, is that\nthere's actually been cases where there has\n\n44\n00:02:53.880 --> 00:02:58.720\nbeen arrest, right? So sometimes AI system\nhas misidentified people because they\n\n45\n00:02:58.720 --> 00:03:02.620\nbasically lack full training data on\nvarious different types of faces and race.\n\n46\n00:03:02.920 --> 00:03:07.160\nAnd so this has actually led to people like\nRobert Williams being wrongly arrested as\n\n47\n00:03:07.160 --> 00:03:12.500\nwell too. And this doesn't even just apply\nto just images as well too, but also just\n\n48\n00:03:12.500 --> 00:03:16.280\nlanguage as well, right? sometimes AI tools\nfailed because their training data doesn't\n\n49\n00:03:16.280 --> 00:03:19.420\nhave enough of that language,\nthat local dialect or that slang.\n\n50\n00:03:19.720 --> 00:03:24.040\nThere was like a time where a man in Arabic\nwas greeting good morning, but that was\n\n51\n00:03:24.040 --> 00:03:28.500\nactually mistranslated as \"attack them\",\ncausing the man to be wrongly arrested, but\n\n52\n00:03:28.500 --> 00:03:33.160\nlater released. So there's tons of these\ndifferent cases where when we're not\n\n53\n00:03:33.160 --> 00:03:36.740\naccounting for somebody\nelse's experience or situation\n\n54\n00:03:37.380 --> 00:03:40.180\nbecause of our bias that\nit can cause inaccuracy.\n\n55\n00:03:41.660 --> 00:03:43.060\nSo here's my question to you.\n\n56\n00:03:43.060 --> 00:03:46.360\nWhen mistakes do happen,\nwho is responsible?\n\n57\n00:03:47.020 --> 00:03:50.080\nThe AI or humans, and why do you think so?\n\n58\n00:03:50.580 --> 00:03:52.000\nWe'll answer that\nquestion in the next one.\n"}, {"id": "lesson-4/04", "title": "Who is Responsible", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-04.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:02.360\nAll right, so let's have\na look at this question.\n\n2\n00:00:02.900 --> 00:00:04.980\nWhen mistakes happen, who is responsible?\n\n3\n00:00:05.460 --> 00:00:09.920\nThe AI or humans? Now, if you haven't had\na chance to think about this question,\n\n4\n00:00:10.160 --> 00:00:13.100\njust quickly pause the video and\nthink about it for a few seconds.\n\n5\n00:00:14.800 --> 00:00:19.320\nOkay, so one of the most important things\nthat we want you to understand about these\n\n6\n00:00:19.320 --> 00:00:21.880\nAI systems is that they're just tools.\n\n7\n00:00:22.320 --> 00:00:24.200\nPeople are ultimately responsible.\n\n8\n00:00:24.780 --> 00:00:27.540\nAI tools don't care about\nthe results of their actions.\n\n9\n00:00:27.540 --> 00:00:30.740\nFrom what we've seen,\nunderneath it is a lot of math.\n\n10\n00:00:30.960 --> 00:00:34.920\nIt's trying to find patterns between its\ninputs and outputs through a math equation,\n\n11\n00:00:34.920 --> 00:00:37.420\nso there's no emotions\nor feelings involved.\n\n12\n00:00:37.900 --> 00:00:42.640\nAnd what we have seen, these AI tools\nhave been used to cause false arrests, to\n\n13\n00:00:42.640 --> 00:00:45.760\nmisdiagnose somebody, and to\neven cause fatal accidents.\n\n14\n00:00:46.420 --> 00:00:49.020\nAnd so the reason for this\nis because it's just a tool.\n\n15\n00:00:49.420 --> 00:00:54.120\nSo the people who build and use it are\nultimately responsible for what happens.\n\n16\n00:00:54.900 --> 00:00:58.720\nAnd so now that we understand that\nhumans are at the center of this.\n\n17\n00:00:59.140 --> 00:01:02.780\nWhat are some of the ways we can\nreduce harm from these AI mistakes?\n\n18\n00:01:03.360 --> 00:01:06.420\nSo pause the video and think\nabout this for a few seconds.\n\n19\n00:01:07.900 --> 00:01:12.020\nSo we can look at this in terms of two\nroles for humans and how they can reduce\n\n20\n00:01:12.020 --> 00:01:16.120\nthese harms from a creator perspective\nand from a user perspective.\n\n21\n00:01:16.720 --> 00:01:20.780\nNow, as a creator of these AI tools, it is\nimportant that you add a variety of high\n\n22\n00:01:20.780 --> 00:01:24.820\nquality and diverse data to reduce the\nbias to the best of your abilities.\n\n23\n00:01:24.820 --> 00:01:28.780\nBut remember, all humans are biased\nbecause we all see things in a different\n\n24\n00:01:28.780 --> 00:01:32.240\nperspective. So it's really important\nto listen to other people's different\n\n25\n00:01:32.240 --> 00:01:36.400\nperspectives and to be honest about\nthe limitations of your AI tools.\n\n26\n00:01:37.060 --> 00:01:40.740\nNow if you're a user of these AI tools,\nit's always important that you double check\n\n27\n00:01:40.740 --> 00:01:44.900\nthe AI tools results when there's any\nrisk involved in your decision and to make\n\n28\n00:01:44.900 --> 00:01:48.380\nsure to share feedback to help improve\nthese AI tools to the creators.\n\n29\n00:01:49.960 --> 00:01:54.540\nSo now let's work a little bit on this\nexercise on how we can improve our bear and\n\n30\n00:01:54.540 --> 00:01:58.520\ndog classifier. So besides the black and\nwhite color features that we talked about\n\n31\n00:01:58.520 --> 00:02:02.720\nwhere we talked about black bears and white\ndogs, what other features and variation\n\n32\n00:02:02.720 --> 00:02:05.540\nof those features could\nhelp improve our classifier?\n\n33\n00:02:06.460 --> 00:02:11.780\nOK, so pause the video and think about this\nfor a minute and see what other features\n\n34\n00:02:11.780 --> 00:02:14.080\nand variety of those features\nwe should also consider.\n\n35\n00:02:16.860 --> 00:02:21.920\nOkay, so there's tons of things that we\ncan think about and how we can reduce the\n\n36\n00:02:21.920 --> 00:02:27.040\nbias and add more perspective to our AI\nmodels, but as you've seen, there's a\n\n37\n00:02:27.040 --> 00:02:28.840\nlimitation of bears and dogs that we have.\n\n38\n00:02:29.100 --> 00:02:33.360\nSo just considering different types of\nbears, different types of dogs, deciding\n\n39\n00:02:33.360 --> 00:02:37.220\nwhether or not those bears and dogs are in\ntheir baby and adult forms, the different\n\n40\n00:02:37.220 --> 00:02:40.500\nenvironments that they're in, and\nespecially the different sizes as well too.\n\n41\n00:02:40.520 --> 00:02:44.200\nAnd there's tons of things to think about, but these\nare some of the things that you could consider.\n"}, {"id": "lesson-4/05", "title": "Data Privacy", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-05.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.380\nOkay, so we understand that diverse data\nmatters, but just because we can collect\n\n2\n00:00:05.380 --> 00:00:09.500\nthe data, should we? Now data can come\nfrom anywhere, just like how we can take\n\n3\n00:00:09.500 --> 00:00:14.280\nphotos in many places. So for example,\nthis picture of the park, we have photos of\n\n4\n00:00:14.280 --> 00:00:18.340\nhumans and dogs, and these are potential\ndata that we can add to our AI model.\n\n5\n00:00:18.780 --> 00:00:22.260\nHowever, not all data is available to use.\n\n6\n00:00:22.640 --> 00:00:26.140\nAnd so we can look at it in two\nways, public versus private data.\n\n7\n00:00:26.500 --> 00:00:30.940\nSo public data is information that\nanyone can see, but may have rules for\n\n8\n00:00:30.940 --> 00:00:36.300\nhow it's being used. Now, private data,\nthat's information that can identify someone\n\n9\n00:00:36.300 --> 00:00:38.360\nor share something personal about them.\n\n10\n00:00:38.600 --> 00:00:41.560\nAnd this always requires\npermission for use and seeing.\n\n11\n00:00:42.620 --> 00:00:47.440\nSo some examples of private data could\nbe like your face, your emails and phone\n\n12\n00:00:47.440 --> 00:00:52.780\nnumbers, your health or medical info, name\nor signature, financial info, and even\n\n13\n00:00:52.780 --> 00:00:57.560\nyour home address. All of this information\ncan provide personal data about you.\n\n14\n00:00:58.380 --> 00:01:00.040\nSo I want you to think\nabout this question.\n\n15\n00:01:00.520 --> 00:01:04.860\nWhat if an AI tool was trained on your\npersonal photos without your permission?\n\n16\n00:01:05.360 --> 00:01:06.660\nHow would that make you feel?\n\n17\n00:01:07.160 --> 00:01:10.080\nSo pause this video and just think\nabout this for a few seconds.\n\n18\n00:01:12.900 --> 00:01:16.100\nOkay, so maybe you feel a lot\nof different types of emotions.\n\n19\n00:01:16.280 --> 00:01:18.760\nMaybe you feel violated.\nMaybe you feel embarrassed.\n\n20\n00:01:19.000 --> 00:01:23.240\nMaybe you feel angry. The important thing\nto say is that no matter what emotion you\n\n21\n00:01:23.240 --> 00:01:25.460\nhave, you have a right to your privacy.\n\n22\n00:01:26.200 --> 00:01:29.320\nSo you have the right to control how\nyour personal data is being used.\n\n23\n00:01:29.620 --> 00:01:33.680\nThe thing about creators is that they\nshould be very, very clear about what data\n\n24\n00:01:33.680 --> 00:01:36.940\nthey collect and respect\nyour choices if you say no.\n\n25\n00:01:37.240 --> 00:01:39.940\nSo let's say that you had\ndifferent types of private data.\n\n26\n00:01:40.080 --> 00:01:43.440\nYou can give permission to them to see\nyour face, but may not give them any\n\n27\n00:01:43.440 --> 00:01:45.280\ninformation to see your financial info.\n\n28\n00:01:46.080 --> 00:01:50.420\nBut the thing is, there's been cases where\ncreators have misused private data and\n\n29\n00:01:50.420 --> 00:01:54.900\nhave faced consequences. There was a\ncompany called Everalbum that was actually\n\n30\n00:01:54.900 --> 00:01:59.760\naccused of using people's photos to train\nAI models without proper permission, and\n\n31\n00:01:59.760 --> 00:02:03.700\nthe US government caught on and ordered\nthem to delete their data and AI models.\n\n32\n00:02:05.380 --> 00:02:08.600\nSo given that we understand this now,\nI'm going to ask you this question.\n\n33\n00:02:08.940 --> 00:02:13.220\nHow can we protect privacy when\ncreating and using these AI tools?\n\n34\n00:02:13.220 --> 00:02:16.400\nPause this video and think\nabout it for a few seconds.\n\n35\n00:02:19.220 --> 00:02:24.020\nOkay, so we can look at it in terms of two\nroles, from a creator perspective and a\n\n36\n00:02:24.020 --> 00:02:28.900\nuser perspective. Now, as a creator, you\nshould always ask for permission before\n\n37\n00:02:28.900 --> 00:02:34.180\nusing personal data. You need to be clear\nabout how it's being used and remove any\n\n38\n00:02:34.180 --> 00:02:36.620\npersonal information that is not needed.\n\n39\n00:02:37.140 --> 00:02:41.040\nNow, from a user perspective, you should\nread how your personal data is being used\n\n40\n00:02:41.040 --> 00:02:44.120\nand you should ask questions\non how your data is being used.\n\n41\n00:02:44.400 --> 00:02:49.740\nYou have the right to your personal information\nand can say no or limit what is being shared.\n\n42\n00:02:51.100 --> 00:02:55.280\nOkay, so let's do this exercise on how we\ncan protect privacy in our Bear and Dog\n\n43\n00:02:55.280 --> 00:02:59.460\nClassifier. So let's say that we have this\nphoto over here and that we want to add\n\n44\n00:02:59.460 --> 00:03:01.740\nit to our Bear Dog Classifier on this dog.\n\n45\n00:03:02.040 --> 00:03:06.540\nHow would you make sure this photo respects\nprivacy before using it in our Bear\n\n46\n00:03:06.540 --> 00:03:11.540\nversus Dog Classifier? And just a heads up,\nthis dog in this photo is not owned by anyone.\n\n47\n00:03:13.060 --> 00:03:15.760\nOkay, so pause the video and think\nabout this for a few seconds.\n\n48\n00:03:18.200 --> 00:03:23.460\nOkay, so the thing is, there's a few private\ndata that we found inside this photo.\n\n49\n00:03:23.640 --> 00:03:27.540\nWe have this person's house address, their\ncar license, and the person's face inside\n\n50\n00:03:27.540 --> 00:03:31.000\nthere. So let's say that we\nwant to use the photo as is.\n\n51\n00:03:31.120 --> 00:03:33.760\nIn those cases, we should\nalways ask for permission.\n\n52\n00:03:34.380 --> 00:03:38.760\nNow the thing is, once we actually have\nthis photo, The other thing is that just\n\n53\n00:03:38.760 --> 00:03:41.020\nremove all the private\ndata that's not needed.\n\n54\n00:03:41.440 --> 00:03:45.580\nThe thing about our bear and dog classifier\nis that we only care about the dog, so\n\n55\n00:03:45.580 --> 00:03:49.340\nthis is a way to protect the person's\nprivacy by just taking all the data out.\n\n56\n00:03:49.760 --> 00:03:52.560\nThen you can also blur the\nprivate information as well too,\n\n57\n00:03:52.760 --> 00:03:54.920\nif you decide not to cut\nthe whole entire picture.\n"}, {"id": "lesson-4/06", "title": "Responsible AI", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-06.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.700\nOkay, so we talked about this idea of data\nbias and data privacy and how at the end\n\n2\n00:00:05.700 --> 00:00:08.140\nof the day, humans are\nresponsible for these things.\n\n3\n00:00:08.460 --> 00:00:10.800\nThis is what we call responsible AI.\n\n4\n00:00:11.200 --> 00:00:15.980\nIt's about making sure people are responsible\ncreators and critical users of these\n\n5\n00:00:15.980 --> 00:00:20.860\nAI tools. And one of the most important\nthings I want you to remember is that every\n\n6\n00:00:20.860 --> 00:00:25.080\none of us plays a role in shaping\nhow AI tools are made and used.\n\n7\n00:00:25.080 --> 00:00:30.260\nRemember, and this is not just specific\nto AI, but technology in general, that\n\n8\n00:00:30.260 --> 00:00:33.720\ntechnology is really just\nthe product of human choices.\n"}, {"id": "lesson-4/07", "title": "Recap Quiz", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=en"}, {"id": "lesson-4/08", "title": "Project Time", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-4-08.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:04.380\nOkay, so it's project time for\nlesson number four, our last lesson.\n\n2\n00:00:04.960 --> 00:00:07.660\nSo I want you to now\nexpand your perspective.\n\n3\n00:00:08.200 --> 00:00:11.640\nSo now think about the features that you\nuse to distinguish between the different\n\n4\n00:00:11.640 --> 00:00:16.240\ngroups from lesson three, and see how\nyou can add more variety, explore other\n\n5\n00:00:16.240 --> 00:00:20.140\nfeatures, or even get feedback from\nother people to reduce that bias.\n\n6\n00:00:20.600 --> 00:00:25.120\nRemember, no classifier is perfect,\nand that's just part of how AI works.\n\n7\n00:00:25.560 --> 00:00:28.680\nExplain its bias and explain\nhow you might reduce it.\n\n8\n00:00:29.380 --> 00:00:31.700\nSo this is the last\nlesson, congratulations.\n\n9\n00:00:32.700 --> 00:00:36.520\nSo you're gonna be working on your lesson\nfour question and if you finish early and\n\n10\n00:00:36.520 --> 00:00:39.540\nif your teacher allows it, you can\nkeep working on your classifier.\n\n11\n00:00:40.540 --> 00:00:42.280\nAll right, so this is our last question.\n\n12\n00:00:42.660 --> 00:00:47.540\nBuilding responsible AI. What can you do\nto add more variety to your features to\n\n13\n00:00:47.540 --> 00:00:50.640\nreduce bias? And so this is\nwhat the student responded.\n\n14\n00:00:51.020 --> 00:00:55.360\nI will take pictures of fruits from different\nplaces so the AI does not only analyze\n\n15\n00:00:55.360 --> 00:01:00.200\nfrom one place and I will also ask my friends\nto check if it works well for them too\n\n16\n00:01:00.200 --> 00:01:04.840\nand if I use someone's face or something\nprivate I will ask for permission first.\n\n17\n00:01:05.360 --> 00:01:09.280\nSo remember again back to the private\ninformation if you use anything that contains\n\n18\n00:01:09.280 --> 00:01:11.980\nany personal information make\nsure to ask for permission.\n"}, {"id": "lesson-4/09", "title": "Worksheet", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=4&lang=en"}]}, {"id": "resources", "kicker": "For teachers and students", "title": "Resources", "items": [{"id": "resources/1", "title": "Teacher Guide", "type": "pdf", "kind": "PDF", "src": "https:/     var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
