  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

  var COURSE = {"package": "en", "lang": "en", "dir": "ltr", "version": "1.1", "courseName": "AI Literacy for Everyone", "neuropocket": "/course/online/neuropocket.html?lang=en", "captionLabel": "English", "ui": {"brand": "Learn AI Anywhere", "heroText": "Watch short videos, take quizzes, and train your own AI with NeuroPocket.", "heroFinished": "You finished the whole course. Amazing work! Revisit any lesson below, or keep building with NeuroPocket.", "startCourse": "Start the course", "continue": "Continue: {title}", "openNeuroPocket": "Open NeuroPocket", "neuroPocketButtonTitle": "Open the NeuroPocket app", "lessons": "Lessons", "activitiesDone": "{done} of {total} activities done", "sectionDone": "{done} of {total} done", "activities": "{total} activities", "tagDone": "Done", "tagInProgress": "In progress", "introKicker": "Start here", "resourcesKicker": "For teachers and students", "openMenu": "Open course menu", "closeMenu": "Close course menu", "courseContents": "Course contents", "courseHome": "Course home", "yourProgress": "Your progress: {done} of {total} done", "previous": "Previous", "next": "Next", "finish": "Finish", "backToHome": "Back to course home", "position": "{n} of {total}", "markDone": "Mark as done", "done": "Done", "doneForScreenReaders": "(done)", "openPdf": "Open PDF", "pdfDocument": "PDF document", "fullScreen": "Full screen", "loadingNeuroPocket": "Loading NeuroPocket…", "challengePrompt": "Your turn! Can you teach NeuroPocket to tell bears from dogs?", "tryChallenge": "Try the challenge", "backToCourse": "Back to course", "version": "Version {version}", "appSettings": "App settings", "noPdfViewer": "There is no app on this phone that opens PDF files. Install one, such as Google Drive, then try again.", "kindVideo": "Video", "kindQuiz": "Quiz", "kindWorksheet": "Worksheet", "kindPdf": "PDF", "kindApp": "App"}, "sections": [{"id": "intro", "kicker": "Start here", "title": "Introduction", "items": [{"id": "intro/01", "title": "Welcome to the Course", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-intro-01.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:04.360\nHi, and welcome to this offline first course\nintroduction to artificial intelligence\n\n2\n00:00:04.360 --> 00:00:06.460\nfrom learnaianywhere.org.\n\n3\n00:00:06.880 --> 00:00:10.500\nWe're a global community of teachers and\nstudents and we're super excited to have\n\n4\n00:00:10.500 --> 00:00:14.500\nyou here as we work to make AI literacy\naccessible to everyone everywhere.\n\n5\n00:00:15.240 --> 00:00:19.320\nNow the story we hear about AI is that\nit's humans versus these AI machines.\n\n6\n00:00:19.660 --> 00:00:23.120\nBut the truth is AI is really\njust a product of human choices.\n\n7\n00:00:23.560 --> 00:00:27.800\nAnd unlike machines, we humans choose\nwhat we care about, like our values in our\n\n8\n00:00:27.800 --> 00:00:31.960\ncommunities. Our course goal is to give\nlearners the knowledge and judgment to\n\n9\n00:00:31.960 --> 00:00:35.720\nbecome responsible creators and\ncritical users of these AI tools.\n\n10\n00:00:36.180 --> 00:00:39.700\nYou're going to be learning on what\nexactly is artificial intelligence, the key\n\n11\n00:00:39.700 --> 00:00:43.680\nparts of machine learning, how machine\nlearning works, and the ideas behind\n\n12\n00:00:43.680 --> 00:00:48.040\nresponsible AI. You're going to learn all\nthis by designing your own AI classifier\n\n13\n00:00:48.040 --> 00:00:52.240\nwith NeuroPocket, which builds a strong\nfoundation for understanding how many modern\n\n14\n00:00:52.240 --> 00:00:56.360\nAI tools work, will guide you step by\nstep through our four lessons using our AI\n\n15\n00:00:56.360 --> 00:01:00.880\ndesign activity sheet. And by the end,\nyou'll design your own AI classifier and\n\n16\n00:01:00.880 --> 00:01:05.340\ndevelop a critical understanding of how AI\ntools work, ready to present your project\n\n17\n00:01:05.340 --> 00:01:09.740\nand your reasoning. We're super happy to\nhave you here and shaping how AI is created\n\n18\n00:01:09.740 --> 00:01:12.480\nand used in our world from\nanywhere. We'll see you in class.\n"}, {"id": "intro/02", "title": "Prerequisite", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-intro-02.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.620 --> 00:00:02.180\nOkay, welcome to the class.\n\n2\n00:00:02.540 --> 00:00:04.840\nSo there's going to be two\nthings you're going to need.\n\n3\n00:00:05.340 --> 00:00:08.540\nThe first thing is you're going to need\nto have a device that contains a webcam.\n\n4\n00:00:09.340 --> 00:00:14.260\nAnd so this device can be a laptop, it\ncould be a tablet, it could be a phone.\n\n5\n00:00:14.700 --> 00:00:18.320\nThe important thing is it has a webcam\nbecause we're going to be using it to take\n\n6\n00:00:18.320 --> 00:00:22.320\npictures. And so the app that we're\ngoing to be using is something called\n\n7\n00:00:22.320 --> 00:00:25.880\nNeuroPocket. And this is what we're\ngoing to be using to design our image\n\n8\n00:00:25.880 --> 00:00:29.480\nclassifier. So you can\nsimply access this online.\n\n9\n00:00:29.480 --> 00:00:34.480\nor if you wanna access it offline, there\nis apps available for Windows and Android\n\n10\n00:00:34.480 --> 00:00:39.540\ndevices. So if you're using an iPhone, you would\nhave to access it through the website instead.\n\n11\n00:00:40.400 --> 00:00:43.120\nThe other thing is we have an\noptional project worksheet.\n\n12\n00:00:43.600 --> 00:00:48.020\nAnd so what this project worksheet does is\nthat it's going to guide us to design our\n\n13\n00:00:48.020 --> 00:00:50.860\nAI classifier as we go\nthrough each of the lessons.\n\n14\n00:00:51.320 --> 00:00:54.860\nAnd of course, if you don't want to print\nit out, you could just use a simple sheet\n\n15\n00:00:54.860 --> 00:00:58.260\nof paper and it will do the same job\nbecause the questions aren't very long.\n\n16\n00:00:59.160 --> 00:01:02.120\nOkay, so that's all we\nneed for the prerequisites.\n\n17\n00:01:02.920 --> 00:01:04.220\nSo I'll see you guys in the next one.\n"}, {"id": "intro/03", "title": "Symbol Key", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-intro-03.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:04.780\nOkay, welcome to this introduction to\nartificial intelligence from learnaianywhere.org.\n\n2\n00:00:04.780 --> 00:00:07.280\nSo before we go\nthrough all the lessons,\n\n3\n00:00:07.620 --> 00:00:10.120\nyou're going to notice some\nsymbols on the bottom left corner.\n\n4\n00:00:10.720 --> 00:00:14.220\nIf you see a book, that's simply a symbol\nthat we're going to be teaching something.\n\n5\n00:00:14.780 --> 00:00:18.120\nIf you see somebody running, it means we're\ngoing to do something interactive, like\n\n6\n00:00:18.120 --> 00:00:19.660\na game or hands-on practice.\n\n7\n00:00:20.240 --> 00:00:24.320\nAnd if you see a cloud, that means we're\ngoing to have the opportunity to reflect on\n\n8\n00:00:24.320 --> 00:00:27.440\nwhat we have learned. All right,\nI'll see you all in the next one.\n"}]}, {"id": "lesson-1", "kicker": "Lesson 1", "title": "What is AI", "items": [{"id": "lesson-1/01", "title": "Objectives", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-1-01.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:04.840\nOkay, welcome to lesson one on what\nexactly is artificial intelligence.\n\n2\n00:00:05.560 --> 00:00:09.340\nSo in lesson one's objective, you're going\nto explain the key qualities that make\n\n3\n00:00:09.340 --> 00:00:10.600\nsomething artificial intelligent.\n\n4\n00:00:11.000 --> 00:00:15.680\nAnd then you're going to identify the\nexamples of AI and not AI and explain why.\n"}, {"id": "lesson-1/02", "title": "What is AI", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-1-02.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.940 --> 00:00:03.880\nSo, before we even get started,\nthink about this question.\n\n2\n00:00:04.360 --> 00:00:06.700\nWhat do you think makes\nhumans intelligent?\n\n3\n00:00:07.620 --> 00:00:10.340\nNow, pause the video and just\nthink about it for a few seconds.\n\n4\n00:00:12.260 --> 00:00:16.300\nOkay. Now that you have some time, I want\nto first say that human intelligence is\n\n5\n00:00:16.300 --> 00:00:19.860\nextremely complex. But we\ncan look at two key traits.\n\n6\n00:00:20.500 --> 00:00:24.940\nSome of the key traits that make human\nintelligence is autonomy and adaptivity.\n\n7\n00:00:25.680 --> 00:00:29.740\nSo, when I say autonomy, it's a human that\nacts and makes decisions on their own.\n\n8\n00:00:30.180 --> 00:00:34.900\nAnd when I say adaptivity, it's a human's\nability to learn from experience and improve.\n\n9\n00:00:35.820 --> 00:00:39.820\nAnd so, a bunch of curious people\nwondered, how can we build these aspects of\n\n10\n00:00:39.820 --> 00:00:41.340\nintelligence in machines?\n\n11\n00:00:41.820 --> 00:00:44.980\nAnd that's where the field of\nartificial intelligence came to be.\n\n12\n00:00:45.320 --> 00:00:49.720\nA field of study about building technology\nthat imitates intelligent behavior.\n\n13\n00:00:50.760 --> 00:00:55.160\nAnd so, some of the key things that make\nAI seem intelligent is also its autonomy\n\n14\n00:00:55.160 --> 00:00:57.620\nand adaptivity. So when I say autonomy,\n\n15\n00:00:58.440 --> 00:01:02.760\nI'm really just saying a technology's\ncapability to assist or operate independently.\n\n16\n00:01:03.400 --> 00:01:09.340\nAnd when I say adaptivity, it's a technology's\ncapability to improve as it analyzes more data.\n\n17\n00:01:10.520 --> 00:01:13.920\nAnd so some examples we could\nthink of is like our search engine.\n\n18\n00:01:14.280 --> 00:01:17.300\nIf you have ever used Google, you\nhave engaged with some sort of AI.\n\n19\n00:01:17.960 --> 00:01:21.520\nIt's autonomous because it can assist\nyou by suggesting words independently.\n\n20\n00:01:21.780 --> 00:01:25.140\nAs you can see, as I'm typing, you\ncan see I'm getting all these various\n\n21\n00:01:25.140 --> 00:01:29.880\nsuggestions. And it's also being adaptive\nbecause it can improve its suggestions by\n\n22\n00:01:29.880 --> 00:01:32.460\nanalyzing people's past searches and more.\n\n23\n00:01:33.740 --> 00:01:36.720\nNow, a good example of\nnot AI is a calculator.\n\n24\n00:01:36.960 --> 00:01:39.940\nIt's not autonomous because\nit only does what you tell it.\n\n25\n00:01:40.080 --> 00:01:43.880\nSo you have to manually press the buttons\nfor everything you want to get done.\n\n26\n00:01:44.300 --> 00:01:47.380\nAnd this is especially not\nadaptive because it can't\n\n27\n00:01:47.380 --> 00:01:50.840\nanalyze new data and it\nalways works the same way.\n\n28\n00:01:52.080 --> 00:01:53.420\nOkay, now it's your turn.\n\n29\n00:01:53.700 --> 00:01:57.780\nLet's play AI or Not. I'm going to describe\na situation, you're going to observe\n\n30\n00:01:57.780 --> 00:02:01.660\nwhether it involves autonomy and adaptivity,\nyou're going to decide if it's AI or not,\n\n31\n00:02:02.000 --> 00:02:03.340\nand you're going to share your reasoning.\n"}, {"id": "lesson-1/03", "title": "AI or Not", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=en"}, {"id": "lesson-1/04", "title": "How AI Can Help Us", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-1-04.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.680 --> 00:00:04.500\nOkay. So after playing the AI or\nnot game, here's a question for you.\n\n2\n00:00:05.020 --> 00:00:07.220\nHow were these AI examples helping people?\n\n3\n00:00:08.080 --> 00:00:11.260\nSo feel free to pause the video and\nthink about it for a few seconds.\n\n4\n00:00:13.300 --> 00:00:18.300\nOkay. So some of the ways AI technologies\ncan help us is it can improve the quality\n\n5\n00:00:18.300 --> 00:00:23.300\nof our work. It can also do parts of\nour work so we can focus on other tasks.\n\n6\n00:00:23.460 --> 00:00:25.720\nOr it can also make\nour experience simpler.\n\n7\n00:00:25.720 --> 00:00:30.660\nSo, some examples of people using AI tools\nto help them solve real problems could be\n\n8\n00:00:30.660 --> 00:00:35.440\nfarmers. Farmers are using these AI tools\nlike PlantVillage Nuru, where they can\n\n9\n00:00:35.440 --> 00:00:39.420\ntake a picture of a plant leaf and see\nwhether or not it's sick or not, and how to\n\n10\n00:00:39.420 --> 00:00:43.120\ntreat it. Some of these farmers also use\nsomething called Farmer Chat, which is a\n\n11\n00:00:43.120 --> 00:00:48.460\nway for them to engage with a chatbot to\nget these advice on farming, so it makes\n\n12\n00:00:48.460 --> 00:00:51.740\nthem have better decisions on how they\ncan take care of their crops and soil.\n\n13\n00:00:51.740 --> 00:00:56.200\nwell. If we look in the context of doctors,\na lot of these doctors are using AI\n\n14\n00:00:56.200 --> 00:01:00.760\nimagings like x-rays to help them scan\nfor those very difficult tiny signs of\n\n15\n00:01:00.760 --> 00:01:04.200\nsicknesses, and it just helps\nthem make better decisions.\n\n16\n00:01:05.020 --> 00:01:09.720\nAnd then Suki is one of those things\nwhere the doctor and patient can have\n\n17\n00:01:09.720 --> 00:01:13.280\nconversation, and the AI will essentially\ntake notes for them, and this allows the\n\n18\n00:01:13.280 --> 00:01:15.320\ndoctor to focus more on the patients.\n\n19\n00:01:16.660 --> 00:01:22.480\nSo one of the big things we're going to\nkeep emphasizing is that AI technology is a\n\n20\n00:01:22.480 --> 00:01:28.240\ntool. And I say that not as a way to undermine\nthe capabilities of AI, but more as a\n\n21\n00:01:28.240 --> 00:01:30.700\nreminder that we are responsible for it.\n\n22\n00:01:30.920 --> 00:01:34.700\nBecause the thing is, people decide how to\nuse them for the things they care about.\n"}, {"id": "lesson-1/05", "title": "Recap Quiz", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=en"}, {"id": "lesson-1/06", "title": "Project Time", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-1-06.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.700 --> 00:00:02.400\nAlrighty, project time now.\n\n2\n00:00:02.840 --> 00:00:07.280\nSo if you remember PlantVillage Nuru,\nfarmers use this AI classifier tool\n\n3\n00:00:07.280 --> 00:00:10.720\nto take pictures of plant leaves to see\nwhether or not their leaves were sick or\n\n4\n00:00:10.720 --> 00:00:14.320\nnot. And now it's your turn to\ndesign your own AI classifier.\n\n5\n00:00:14.880 --> 00:00:19.720\nIn the next three lessons, you're going to\ndesign your own AI classifier on whatever\n\n6\n00:00:19.720 --> 00:00:23.860\ntheme you choose. That could be plant\nleaves, that could be school supplies, it\n\n7\n00:00:23.860 --> 00:00:25.460\ncould be whatever you could think of.\n\n8\n00:00:26.620 --> 00:00:30.120\nAnd so some examples that students have\ndone is that You know, some of them went\n\n9\n00:00:30.120 --> 00:00:34.220\naround their school garden to take pictures\nof plant leaves to distinguish between\n\n10\n00:00:34.220 --> 00:00:36.180\nthe various plant leaves\nin their school garden.\n\n11\n00:00:36.740 --> 00:00:41.220\nAnd some have taken different pictures\nof materials like glass cups and plastic\n\n12\n00:00:41.220 --> 00:00:45.440\ncups. And even some have gone creative where\nthey did sign language, where they took\n\n13\n00:00:45.440 --> 00:00:49.140\npictures of various hand positions\nto see what letters they were.\n\n14\n00:00:50.180 --> 00:00:53.520\nSo after each lesson, you're gonna\nwrite your response on your worksheet.\n\n15\n00:00:53.920 --> 00:00:57.400\nIf you do not have the worksheet, just\nsimply use a piece of paper to record your\n\n16\n00:00:57.400 --> 00:01:00.900\nresponses. and you can also work\ntogether in groups if needed.\n\n17\n00:01:01.700 --> 00:01:05.440\nSo this is the worksheet, and by the end\nof this, you should have it all completed\n\n18\n00:01:05.440 --> 00:01:06.980\nafter you finish the lessons.\n\n19\n00:01:08.720 --> 00:01:12.820\nOkay, so after all lessons, you should\nhave completed your worksheet and designed\n\n20\n00:01:12.820 --> 00:01:15.020\nyour AI classifier for your chosen theme.\n\n21\n00:01:15.340 --> 00:01:19.460\nAnd so your teacher may set up an optional\npresentation day where you present your\n\n22\n00:01:19.460 --> 00:01:21.960\nAI classifier and your\nworksheet responses.\n\n23\n00:01:23.360 --> 00:01:27.220\nOkay, so let's start answering the\nfirst question on the worksheet.\n\n24\n00:01:28.920 --> 00:01:32.540\nYou're going to start with only answering\nlesson number 1, which is choose your\n\n25\n00:01:32.540 --> 00:01:36.380\nclassification theme. Choose a theme\nthat you will like to explore for your AI\n\n26\n00:01:36.380 --> 00:01:39.280\nclassification and\nexplain why you chose it.\n\n27\n00:01:39.740 --> 00:01:41.600\nThis is an example of\nwhat a student has wrote.\n\n28\n00:01:42.320 --> 00:01:46.700\nI want to classify fruits because I\nlove fruits and they are easy to find.\n\n29\n00:01:47.120 --> 00:01:51.520\nMany people around me grow fruits so I can\nbring different kinds to use for my project.\n"}, {"id": "lesson-1/07", "title": "Worksheet", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=en"}]}, {"id": "lesson-2", "kicker": "Lesson 2", "title": "The Key Parts of Machine Learning", "items": [{"id": "lesson-2/01", "title": "Objectives", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-2-01.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.140\nOkay, welcome to lesson two, where we're going\nto talk about the key parts of machine learning.\n\n2\n00:00:06.100 --> 00:00:10.280\nSo lesson two's objective is we're going\nto be able to explain what machine learning\n\n3\n00:00:10.280 --> 00:00:13.620\nis. We're going to identify the\nkey parts of machine learning.\n\n4\n00:00:13.760 --> 00:00:17.320\nWe're going to describe why or what each\npart does and how they work together.\n\n5\n00:00:17.800 --> 00:00:21.060\nAnd you're going to explain how\ndata affects how well AI works.\n"}, {"id": "lesson-2/02", "title": "What is Machine Learning", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-2-02.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.480 --> 00:00:03.360\nOkay. So how exactly do\nyou prepare for an exam?\n\n2\n00:00:03.940 --> 00:00:05.620\nThink about this just for a few seconds.\n\n3\n00:00:07.120 --> 00:00:11.160\nOkay. So when a human is preparing for an\nexam, the first thing you're going to do\n\n4\n00:00:11.160 --> 00:00:13.100\nis you're going to need to\ncollect some information.\n\n5\n00:00:13.540 --> 00:00:16.500\nAnd that information can come\ninto the form of notes in class.\n\n6\n00:00:17.260 --> 00:00:20.840\nSo once you have your notes, you're going\nto study those notes and what happens is\n\n7\n00:00:20.840 --> 00:00:23.540\nyour brain is going to connect\nthose new information to\n\n8\n00:00:23.540 --> 00:00:26.300\nyour lived experience to\nbetter make sense in the world.\n\n9\n00:00:26.820 --> 00:00:30.720\nAnd so what happens over time is you're\ngoing to become better prepared to taking\n\n10\n00:00:30.720 --> 00:00:35.480\nthat exam as you connect new\ninformation to your previous knowledge.\n\n11\n00:00:36.220 --> 00:00:39.180\nSo the four parts of\npreparing for exam is brains.\n\n12\n00:00:39.860 --> 00:00:41.620\nThat brain basically take notes.\n\n13\n00:00:41.980 --> 00:00:46.300\nYou study those notes. And then as a result,\nyou have a more prepared brain ready to\n\n14\n00:00:46.300 --> 00:00:50.240\ntake the exam. And so the brain is\nthe thing that does the learning.\n\n15\n00:00:50.820 --> 00:00:53.680\nThe notes is basically the\ninformation you're going to study.\n\n16\n00:00:54.260 --> 00:00:58.840\nThe studying is basically the time and\nprocess of connecting these new ideas to what\n\n17\n00:00:58.840 --> 00:01:02.040\nyou already know and the\nprepared brain is the result.\n\n18\n00:01:02.400 --> 00:01:07.500\nSo, after you have done the studying of those\nnotes, you're ready to essentially take the exam.\n\n19\n00:01:08.640 --> 00:01:11.580\nAnd so, human learning and the key idea\nof human learning is that you're building\n\n20\n00:01:11.580 --> 00:01:16.580\nunderstanding by connecting new information\nto your lived experience so you can make\n\n21\n00:01:16.580 --> 00:01:21.180\nsense of the world. So, how exactly is\nhuman learning compared to machine learning?\n\n22\n00:01:21.760 --> 00:01:24.880\nWell, the thing about machine learning\nand we'll go into more details of what we\n\n23\n00:01:24.880 --> 00:01:29.780\nmean by this is that it's essentially\nusing mathematical instructions to find\n\n24\n00:01:29.780 --> 00:01:32.400\npatterns in data to make predictions.\n\n25\n00:01:33.200 --> 00:01:37.400\nAnd so some of the parts of machine learning\nis that there is a model, that model\n\n26\n00:01:37.400 --> 00:01:41.720\ntakes in data and basically training is\nwhere you try to find patterns in that data\n\n27\n00:01:41.720 --> 00:01:45.820\nand then you have a trained model like a\nplant disease classifier that can predict\n\n28\n00:01:45.820 --> 00:01:48.340\nplant diseases or\nwhether it's sick or not.\n\n29\n00:01:49.060 --> 00:01:52.740\nAnd so the four key parts of machine learning\ninto detail is the model is the thing\n\n30\n00:01:52.740 --> 00:01:54.600\nthat is going to be capturing the pattern.\n\n31\n00:01:54.600 --> 00:01:59.060\nThe data is simply the information we give\nto the model that it's going to train on.\n\n32\n00:01:59.920 --> 00:02:04.460\nThe training is basically the process\nwhere the model uses to analyze the data to\n\n33\n00:02:04.460 --> 00:02:09.680\nfind patterns. And again, the trained\nmodel is basically the results of after the\n\n34\n00:02:09.680 --> 00:02:10.920\nmodel has finished training.\n\n35\n00:02:11.060 --> 00:02:12.920\nAnd so it's ready to make predictions.\n\n36\n00:02:14.500 --> 00:02:20.320\nSo even though the machine process information\ndifferently, they actually still both\n\n37\n00:02:20.320 --> 00:02:26.040\nshare similar parts. So brain to model,\nnotes to data, study to training, prepared\n\n38\n00:02:26.040 --> 00:02:30.100\nbrain to trained model. They're not exactly\nthe same, but they do share that similar\n\n39\n00:02:30.100 --> 00:02:32.860\nstages of how they essentially\napproach their learning.\n"}, {"id": "lesson-2/04", "title": "How to Use NeuroPocket", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-2-04.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.240\nOkay, so we talked about the key parts\nof machine learning like model, data,\n\n2\n00:00:05.640 --> 00:00:07.180\ntraining, and trained model.\n\n3\n00:00:07.520 --> 00:00:10.860\nBut it's really hard to see how\nthese different parts come together.\n\n4\n00:00:11.320 --> 00:00:15.860\nSo let's see how these key parts come\ntogether by designing an AI classifier with\n\n5\n00:00:15.860 --> 00:00:18.860\nNeuroPocket. So what\nexactly is NeuroPocket?\n\n6\n00:00:19.420 --> 00:00:24.240\nNeuroPocket is an AI app where you can\nadd images, train a model, and see how AI\n\n7\n00:00:24.240 --> 00:00:29.000\nrecognizes things. And you have already\nseen some examples of NeuroPocket in the\n\n8\n00:00:29.000 --> 00:00:32.760\nstudent examples. You have seen students\nwere able to distinguish between different\n\n9\n00:00:32.760 --> 00:00:37.440\nplant leaves. They were able to distinguish\nbetween different materials and even\n\n10\n00:00:37.440 --> 00:00:38.820\nsign language as well too.\n\n11\n00:00:38.860 --> 00:00:43.040\nSo we're going to be learning NeuroPocket\ntogether by doing each step together.\n\n12\n00:00:43.420 --> 00:00:48.180\nSo as you go through each step, feel free\nto pause the video so you can complete the\n\n13\n00:00:48.180 --> 00:00:51.820\ntask or complete the step before\nyou go on to the next one.\n\n14\n00:00:51.820 --> 00:00:56.740\nAnd, of course, if you're working in\ngroups or in a classroom, if you do finish\n\n15\n00:00:56.740 --> 00:01:01.080\nearly, just help others around you so we\ncan move to the next step faster together.\n\n16\n00:01:02.720 --> 00:01:06.660\nOkay, so the first thing I want to do is\nopen up my NeuroPocket app, and I'm going\n\n17\n00:01:06.660 --> 00:01:09.060\nto name the project\nSchool Supplies Project.\n\n18\n00:01:09.240 --> 00:01:11.580\nIt could be any name you want,\nit's just the name of your project.\n\n19\n00:01:11.860 --> 00:01:14.540\nAnd once you click Create, it's going\nto bring you inside that project.\n\n20\n00:01:15.100 --> 00:01:17.640\nSo I can actually have\nmore than two groups.\n\n21\n00:01:17.640 --> 00:01:22.260\nin my case I want to categorize\nbetween scissors and pens aside there.\n\n22\n00:01:22.700 --> 00:01:26.860\nNow when I created at least my two groups,\nI'm going to now add some photos for each\n\n23\n00:01:26.860 --> 00:01:29.780\nof those groups. So in my case because\nI have scissors, I'm going to take some\n\n24\n00:01:29.780 --> 00:01:34.920\nphotos of some scissors. In this case I\ntook approximately about six and then I\n\n25\n00:01:34.920 --> 00:01:37.600\nadded photos. You can take\nmore than that if you want to.\n\n26\n00:01:37.680 --> 00:01:40.360\nAnd then I'm going to take\nsome photos of some pens now.\n\n27\n00:01:40.640 --> 00:01:44.280\nAnd in my case I also\ntook six pen pictures.\n\n28\n00:01:44.480 --> 00:01:46.480\nLike I said, you could have\nhundreds if you wanted to.\n\n29\n00:01:46.560 --> 00:01:47.940\nIn my case, I'm just going quick.\n\n30\n00:01:48.400 --> 00:01:51.620\nThen you're going to add photos, and\nnow you've added data to your groups.\n\n31\n00:01:52.120 --> 00:01:55.620\nBut you can have more than two groups\nif you wanted to, so technically I could\n\n32\n00:01:55.620 --> 00:01:59.080\ncreate a group like erasers, but for\nsimplicity, we're going to stick with this.\n\n33\n00:01:59.460 --> 00:02:02.400\nThen you're going to move into training,\nand then you're just going to click on the\n\n34\n00:02:02.400 --> 00:02:06.560\ntrain model button, and this is going to take a\nfew minutes, so we're just going to wait this out.\n\n35\n00:02:14.500 --> 00:02:16.600\nOkay, so let's test our model now.\n\n36\n00:02:16.980 --> 00:02:20.700\nSo what I'm going to first do is I'm\njust going to take a photo of my pen in a\n\n37\n00:02:20.700 --> 00:02:24.280\ndifferent position and see if it classifies\nit correctly and you can see it says as\n\n38\n00:02:24.280 --> 00:02:29.180\na pen and then now I'm going to test with\nmy scissors in another different position\n\n39\n00:02:29.180 --> 00:02:32.460\nclassifies it and you can see\nindeed it calls it a scissor.\n\n40\n00:02:32.780 --> 00:02:35.500\nAlright, so that's your AI\nclassifier and you're always\n\n41\n00:02:35.500 --> 00:02:37.780\nfree to add more data to\nimprove your classifier.\n"}, {"id": "lesson-2/03", "title": "Open NeuroPocket", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "AI Tools Can Make Mistakes", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-2-05.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.580 --> 00:00:05.460\nOkay. So welcome back. So after you had\nsome time to play with NeuroPocket, was your\n\n2\n00:00:05.460 --> 00:00:07.240\nAI classifier always correct?\n\n3\n00:00:07.860 --> 00:00:10.120\nAnd if not, why do you\nthink it made that mistake?\n\n4\n00:00:10.700 --> 00:00:13.740\nSo feel free to pause the video and\nthink about it for a few seconds.\n\n5\n00:00:16.380 --> 00:00:21.620\nOkay. So the thing about AI tools is that\nthey can give you unexpected results.\n\n6\n00:00:22.040 --> 00:00:25.780\nWhat's going to be obvious to you isn't\ngoing to be obvious to an AI tool.\n\n7\n00:00:25.780 --> 00:00:30.600\nSo the thing about AI tools is that they\ndon't understand the same way as humans do.\n\n8\n00:00:31.080 --> 00:00:35.400\nSo they have to analyze every single\ndetail on the photo to find patterns.\n\n9\n00:00:35.860 --> 00:00:39.380\nAnd sometimes that means that they find\npatterns or use patterns that we haven't\n\n10\n00:00:39.380 --> 00:00:43.400\nconsidered before. So for example, you\ncan see over here that we clearly have a\n\n11\n00:00:43.400 --> 00:00:48.520\nscissor, but because it's in the same\nposition as the color pencil here and it's the\n\n12\n00:00:48.520 --> 00:00:51.780\nsame color, it's classified\nas a color pencil.\n\n13\n00:00:52.720 --> 00:00:57.100\nAnd also, the thing about AI systems is\nthat they're just heavily limited by its\n\n14\n00:00:57.100 --> 00:01:00.720\ndata. They can only really predict\nbased on what they have analyzed before.\n\n15\n00:01:01.300 --> 00:01:05.540\nSo you can see our plant disease classifier\nfails because it has never seen or\n\n16\n00:01:05.540 --> 00:01:09.860\nanalyzed grass before. And you can see clearly\nthat it calls it healthy peach, which it's not.\n\n17\n00:01:10.680 --> 00:01:15.160\nAnd this doesn't just apply to images,\nbut also languages as well too, right?\n\n18\n00:01:15.360 --> 00:01:19.020\nA AI tool can only respond based\non the languages it was trained on.\n\n19\n00:01:19.020 --> 00:01:22.960\nSo in this case, I'm speaking in Hindi,\nlike, what is the weather like today?\n\n20\n00:01:23.400 --> 00:01:25.620\nWhat is your name? What is two plus two?\n\n21\n00:01:26.060 --> 00:01:30.160\nAnd because this AI tool has never analyzed\nHindi data before, it's just going to\n\n22\n00:01:30.160 --> 00:01:35.340\nkeep repeating the same English phrase, which is\nwhat it knows, I am good and you, repetitively.\n\n23\n00:01:36.160 --> 00:01:40.440\nSo this really just goes into this\nconcept of like what comes in comes out.\n\n24\n00:01:40.760 --> 00:01:45.260\nSo machine learning, if the data is limited,\nthat means the model prediction will\n\n25\n00:01:45.260 --> 00:01:47.440\nalso be limited as well too.\n"}, {"id": "lesson-2/06", "title": "Recap Quiz", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=en"}, {"id": "lesson-2/07", "title": "Project Time", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-2-07.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:02.580\nOkay. Project time for lesson number two.\n\n2\n00:00:03.360 --> 00:00:07.840\nSo you had some time to practice in\nNeuroPocket, but now it's your time to explore\n\n3\n00:00:07.840 --> 00:00:11.440\nyour environment and collect data for\nthe theme you chose in lesson one.\n\n4\n00:00:11.820 --> 00:00:14.880\nAnd remember, your theme can always\nchange as you go through the worksheet.\n\n5\n00:00:15.540 --> 00:00:19.940\nAlso, now you have to make sure to answer the\nquestion for lesson two on your worksheet.\n\n6\n00:00:21.620 --> 00:00:23.680\nSo for lesson number two\nis about data collection.\n\n7\n00:00:23.980 --> 00:00:27.360\nSo you're going to tell us what items\nwill you classify and how you're going to\n\n8\n00:00:27.360 --> 00:00:32.280\ngather your data. So an example response\nfrom a student is this, the items I will\n\n9\n00:00:32.280 --> 00:00:35.600\nclassify are bananas,\noranges, and avocados.\n\n10\n00:00:36.080 --> 00:00:40.280\nI'll bring fruits from my home or go\nto school garden to take pictures.\n\n11\n00:00:41.180 --> 00:00:45.520\nOkay. So you're going to respond to\nlesson number 2, and also if your teachers\n\n12\n00:00:45.520 --> 00:00:47.760\nallows it, you can also\ngo around your environment\n\n13\n00:00:47.760 --> 00:00:51.560\nto take more photos or to\nimprove your AI classifier.\n"}, {"id": "lesson-2/08", "title": "Worksheet", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=en"}]}, {"id": "lesson-3", "kicker": "Lesson 3", "title": "How Do Machines Train", "items": [{"id": "lesson-3/01", "title": "Objectives", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-01.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.520 --> 00:00:02.460\nOkay. Welcome to lesson number three.\n\n2\n00:00:02.880 --> 00:00:04.200\nHow do machines train?\n\n3\n00:00:05.100 --> 00:00:09.100\nSo if you remember in the last lesson,\nwe talked about the key parts of machine\n\n4\n00:00:09.100 --> 00:00:10.720\nlearning where you have your model.\n\n5\n00:00:11.200 --> 00:00:15.960\nIn that model you give a data and then\nfinally go through a training process where\n\n6\n00:00:15.960 --> 00:00:20.920\nthe model uses that time to analyze all the\ndata that you have given it to find patterns.\n\n7\n00:00:22.000 --> 00:00:25.920\nBut how does the machine learning\ntraining process actually work?\n\n8\n00:00:26.440 --> 00:00:28.580\nAnd so that's what we're going\nto understand in lesson three.\n\n9\n00:00:28.580 --> 00:00:33.220\nSo the objective is you're going to explain\nwhat an algorithm is and give real-life\n\n10\n00:00:33.220 --> 00:00:37.580\nexamples. You're going to explain\nwhy machines need algorithms to work.\n\n11\n00:00:37.820 --> 00:00:40.940\nYou're going to describe the steps\na machine follows during training.\n\n12\n00:00:41.460 --> 00:00:45.060\nAnd then finally, you're going to\ncompare how humans and machines process\n\n13\n00:00:45.060 --> 00:00:46.660\ninformation differently.\n"}, {"id": "lesson-3/02", "title": "Describer Drawer Game — Instructions", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-02.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:03.380\nOkay, so to start this off, let's\nplay the Describer Drawer game.\n\n2\n00:00:03.920 --> 00:00:08.280\nIt's going to require two or more players,\nbut don't worry if you don't have another\n\n3\n00:00:08.280 --> 00:00:10.280\nplayer with you and you're\ndoing this by yourself.\n\n4\n00:00:10.620 --> 00:00:14.740\nWe do have video demonstration of us playing\nthe game, so you can see how it works.\n\n5\n00:00:15.220 --> 00:00:19.860\nSo by the time that you're able to find a\nperson to play with, you'll be able to be\n\n6\n00:00:19.860 --> 00:00:23.880\nready for it, okay? But let's still\nwalk through the instruction until then.\n\n7\n00:00:24.440 --> 00:00:27.380\nSo the way how the game works is that\nyou're going to be working in pairs.\n\n8\n00:00:27.620 --> 00:00:29.680\nSo again, need to have\nat least two people.\n\n9\n00:00:30.200 --> 00:00:34.260\nSo one person is going to be the describer\nand one person is going to be the drawer.\n\n10\n00:00:34.700 --> 00:00:39.460\nSo if you do have a teacher, that teacher\nis going to make a simple drawing with\n\n11\n00:00:39.460 --> 00:00:42.200\nthree to five basic\nshapes in any position.\n\n12\n00:00:42.280 --> 00:00:47.500\nSo the drawing can look as simple as this\nand it can even look as complex as this.\n\n13\n00:00:48.300 --> 00:00:52.660\nIf there isn't any teacher, the\ndescriber is going to make the drawing.\n\n14\n00:00:53.880 --> 00:00:59.260\nNow, once a drawing is ready, only\nthe describer may look at the drawing.\n\n15\n00:00:59.800 --> 00:01:04.800\nSo the describer is going to tell the\ndrawer how to recreate that drawing only\n\n16\n00:01:04.800 --> 00:01:06.520\nthrough verbal instructions.\n\n17\n00:01:06.520 --> 00:01:09.740\nThey can only talk about how\nto recreate that drawing.\n\n18\n00:01:10.140 --> 00:01:11.660\nYour hands should be behind your back.\n\n19\n00:01:11.700 --> 00:01:13.940\nThere is no pointing allowed at all.\n\n20\n00:01:14.560 --> 00:01:19.240\nAnd so during that time, as the drawer\ntries to recreate that drawing, after two\n\n21\n00:01:19.240 --> 00:01:23.460\nminutes, The Drawer is going to compare\ntheir drawing with the actual drawing or the\n\n22\n00:01:23.460 --> 00:01:26.340\nTeacher's drawing to see\nhow close they were to it.\n\n23\n00:01:27.080 --> 00:01:30.000\nAnd so finally, after that is\nall completed, that's one round.\n\n24\n00:01:30.260 --> 00:01:32.160\nYou're going to switch roles and repeat.\n\n25\n00:01:32.600 --> 00:01:36.720\nSo the Describer now becomes the Drawer\nand the Drawer becomes the Describer.\n\n26\n00:01:37.860 --> 00:01:40.060\nOkay, so let's start playing this game.\n\n27\n00:01:40.480 --> 00:01:44.140\nOkay, so let's try to do at least two rounds\nand I'll see you guys in the next one.\n"}, {"id": "lesson-3/03", "title": "Describer Drawer Game — Demonstration", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-03.mp4", "vtt": "WEBVTT\n\n1\n00:00:02.120 --> 00:00:06.900\nOkay, so we're going to be doing an activity\ncalled the Describer Drawer game, and\n\n2\n00:00:06.900 --> 00:00:11.560\nthe game is very simple. I, the teacher,\nam going to be drawing a very simple\n\n3\n00:00:11.560 --> 00:00:14.780\ndrawing that's just going to\ncontain three geometric shapes.\n\n4\n00:00:15.000 --> 00:00:20.420\nThat could be either a square, it could\nbe a circle, it could be a triangle, it\n\n5\n00:00:20.420 --> 00:00:22.140\ncould be a diamond, it\ncould be anything, right?\n\n6\n00:00:22.220 --> 00:00:26.560\nBut it's basically three simple shapes\nthat you can position any way you want to.\n\n7\n00:00:27.100 --> 00:00:32.860\nAnd so what I'm going to do here is I'm going\nto draw maybe something as simple as this.\n\n8\n00:00:36.980 --> 00:00:39.700\nSo this is a simple example\nthat I'm going to be drawing.\n\n9\n00:00:40.200 --> 00:00:44.020\nAnd so what's going to be happening is as\na teacher, after I create my drawings, now\n\n10\n00:00:44.020 --> 00:00:47.360\nI'm going to have my teachers or my\nstudents are going to be working in pairs,\n\n11\n00:00:47.640 --> 00:00:51.500\nright? And so basically when the students\nwork in pairs, there's going to be two\n\n12\n00:00:51.500 --> 00:00:54.660\nroles. There's going to be the describer\nand there's going to be the drawer.\n\n13\n00:00:54.660 --> 00:00:57.780\nSo who here is going to be the\ndescriber in this position?\n\n14\n00:00:58.120 --> 00:01:00.840\nI'll be the describer. Okay, and\nKaren's going to be the drawer.\n\n15\n00:01:01.420 --> 00:01:05.860\nSo again, the whole idea is that the\ndescriber is the only person that's allowed to\n\n16\n00:01:05.860 --> 00:01:11.180\ncome to the back of this hidden drawing\nand basically come back to the drawer to\n\n17\n00:01:11.180 --> 00:01:13.580\ngive instructions of how\nto recreate that drawings.\n\n18\n00:01:14.220 --> 00:01:18.100\nAnd so the trick is, is that the describer\ncan come as many times as they want to.\n\n19\n00:01:18.360 --> 00:01:22.540\nHowever, they can only give verbal\ninstructions and they must stand behind the\n\n20\n00:01:22.540 --> 00:01:24.080\ndrawer to give those instructions.\n\n21\n00:01:24.080 --> 00:01:25.840\nSo you don't see each other.\n\n22\n00:01:25.960 --> 00:01:30.140\nAll right, so let's actually show a\ndemonstration how this game is going to work.\n\n23\n00:01:30.680 --> 00:01:34.700\nSo You guys ready? Steady, let's go.\n\n24\n00:01:35.060 --> 00:01:41.540\nYou can go out Mason. See the drawing and give\nthe instructions to Karen You got this Mason\n\n25\n00:01:45.180 --> 00:01:45.740\nOkay\n\n26\n00:01:48.220 --> 00:01:51.040\nSo the first thing is draw a square\n\n27\n00:01:57.240 --> 00:02:01.820\nIn the middle of the\nsquare, draw a circle.\n\n28\n00:02:04.640 --> 00:02:07.620\nIs it going to be touching the edges\nof the square or in the center?\n\n29\n00:02:08.480 --> 00:02:12.100\nIt will be in the center, it won't\nbe touching any of the edges.\n\n30\n00:02:14.640 --> 00:02:20.540\nAnd at the bottom of the square, it\nwill be outside the square and it\n\n31\n00:02:20.540 --> 00:02:26.400\nwould be a triangle\npointing downwards using the\n\n32\n00:02:26.400 --> 00:02:32.120\nbottom line as an edge correct you would\nuse the right edge and left edge and it\n\n33\n00:02:32.120 --> 00:02:37.340\nwill go exactly in the middle as the point\nof the triangle nice instructions Mason\n\n34\n00:02:37.340 --> 00:02:43.200\nall right good job guys and as you\ncan see over there they were able to\n\n35\n00:02:43.200 --> 00:02:47.340\nrecreate that drawing and now here's the\nthing right the whole idea of this game is\n\n36\n00:02:47.340 --> 00:02:49.020\nthat that was just really the first level.\n\n37\n00:02:49.280 --> 00:02:53.640\nAs a teacher, you can increasingly make\nthis game harder by like doing shapes like\n\n38\n00:02:53.640 --> 00:02:57.520\nthis, right? You can put your shapes in\nthis position and maybe make a smaller\n\n39\n00:02:57.520 --> 00:03:00.540\nsquare and put a triangle in\nthe middle of this one, right?\n\n40\n00:03:01.040 --> 00:03:05.480\nBasically, the key idea is that we just\nwant to be able to challenge our students to\n\n41\n00:03:05.480 --> 00:03:09.860\nessentially give clear instructions to\nthe drawers so they can clearly understand\n\n42\n00:03:09.860 --> 00:03:11.780\nwhat to recreate. All right!\n\n43\n00:03:12.660 --> 00:03:15.700\nThank you guys, and we'll see\nyou guys in the next game.\n"}, {"id": "lesson-3/04", "title": "What is an Algorithm", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-04.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:04.480\nOkay, welcome back. So if you had the chance\nto play the Describer Drawer game with\n\n2\n00:00:04.480 --> 00:00:07.420\nsomeone, or you were able to\nwatch the video demonstration,\n\n3\n00:00:08.220 --> 00:00:09.540\nour question to you is this.\n\n4\n00:00:09.980 --> 00:00:15.940\nWhat strategies did you and your partner use or\nseen to make it easier to recreate the drawing?\n\n5\n00:00:16.860 --> 00:00:19.760\nSo just pause the video and\nthink about it for a few seconds.\n\n6\n00:00:22.100 --> 00:00:25.960\nOkay, so now that you have some time to\nthink about it, maybe you have noticed that\n\n7\n00:00:25.960 --> 00:00:28.500\nthey were using something\ncalled step-by-step thinking.\n\n8\n00:00:29.260 --> 00:00:33.400\nSo step-by-step thinking, so as you play\nthe game with your partner, you had to give\n\n9\n00:00:33.400 --> 00:00:39.120\nvery clear step-by-step instruction for the\ndrawer to understand how to recreate the\n\n10\n00:00:39.120 --> 00:00:43.160\nteacher's drawing. So for example, the\nperson may have said something like this,\n\n11\n00:00:43.460 --> 00:00:47.920\nfirst draw a circle, then inside\nthat circle draw a small triangle.\n\n12\n00:00:48.520 --> 00:00:51.820\nBut you can tell that we gave very\nclear step-by-step instruction.\n\n13\n00:00:52.560 --> 00:00:55.640\nSo, what you just created\nor saw was an algorithm.\n\n14\n00:00:56.320 --> 00:01:01.440\nAn algorithm is just any clear step-by-step\ninstruction to completing a task.\n\n15\n00:01:02.100 --> 00:01:05.820\nAnd the thing about algorithms is\nthat it can apply to anything in life.\n\n16\n00:01:05.940 --> 00:01:07.280\nIt doesn't have to be technical.\n\n17\n00:01:07.780 --> 00:01:12.400\nAs long as that algorithm is a set of\nstep-by-step instruction for completing a\n\n18\n00:01:12.400 --> 00:01:17.500\ntask. So, for example, if I were to look\nat this steps to making a cup of tea.\n\n19\n00:01:17.920 --> 00:01:19.960\nYou know, I had to first step boil water.\n\n20\n00:01:20.280 --> 00:01:22.360\nStep two, I had to add a tea bag.\n\n21\n00:01:22.600 --> 00:01:24.700\nStep three, I had to add sugar and milk.\n\n22\n00:01:24.860 --> 00:01:27.780\nAnd finally, step four, I\nhad to stir and serve, right?\n\n23\n00:01:27.780 --> 00:01:31.820\nSo this is an example of an algorithm\nbecause I was able to break it down step by\n\n24\n00:01:31.820 --> 00:01:35.000\nstep to completing a task\nof making a cup of tea.\n\n25\n00:01:35.860 --> 00:01:38.740\nSo we use algorithms\nevery day in our life.\n\n26\n00:01:38.740 --> 00:01:42.800\nWhenever we do something step by step, that\ncould be cooking, that could be getting\n\n27\n00:01:42.800 --> 00:01:47.540\ndressed, solving a math problem, or, in our\ncase, just playing this game as well, too.\n\n28\n00:01:49.040 --> 00:01:51.160\nSo my question to you is this.\n\n29\n00:01:51.280 --> 00:01:55.640\nWhat is something that you could think\nabout that you do every day that can have\n\n30\n00:01:55.640 --> 00:01:58.580\nclear step-by-step instructions\nor has clear steps?\n\n31\n00:01:59.020 --> 00:02:01.840\nSo just pause the video and\njust think about it for a bit.\n\n32\n00:02:04.880 --> 00:02:08.720\nOkay, so now that you have some time to\nthink about it, the thing that we really\n\n33\n00:02:08.720 --> 00:02:14.060\nwant you to understand, again, this whole idea\nof algorithms, is that machines need algorithms.\n\n34\n00:02:15.100 --> 00:02:18.880\nAgain, machines don't understand the same\nway like humans, and that's one of the\n\n35\n00:02:18.880 --> 00:02:22.020\nbiggest reasons why we need to give\na clear step-by-step instruction.\n\n36\n00:02:22.600 --> 00:02:26.720\nSo when you're playing that game or seeing\nthat game, the describer is like the human\n\n37\n00:02:26.720 --> 00:02:30.520\ngiving instruction, and the drawer\nis like the machine following them.\n"}, {"id": "lesson-3/05", "title": "The Human Learning Algorithm", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-05.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.500 --> 00:00:05.180\nOkay, so now that you understand how an\nalgorithm works, let's understand how we can\n\n2\n00:00:05.180 --> 00:00:06.740\ncreate an algorithm for learning.\n\n3\n00:00:07.380 --> 00:00:10.980\nSo to better understand this, we're going\nto play a little game called which group\n\n4\n00:00:10.980 --> 00:00:15.200\ndoes it belong to? And so what's going to\nhappen is I'm going to show you a picture,\n\n5\n00:00:15.220 --> 00:00:19.420\nand you're just going to tell me whether\nor not it goes to group A or group B.\n\n6\n00:00:19.940 --> 00:00:22.740\nNow the trick is I'm not\ngoing to tell you the pattern.\n\n7\n00:00:22.920 --> 00:00:24.400\nI'm not going to tell you the rules.\n\n8\n00:00:24.720 --> 00:00:27.640\nYour job is to essentially\nfigure that out yourself.\n\n9\n00:00:28.180 --> 00:00:30.940\nOkay? So let's start\nwith the first picture.\n\n10\n00:00:32.420 --> 00:00:35.620\nOkay, so does this go\nto group A or group B?\n\n11\n00:00:35.800 --> 00:00:40.380\nJust take a guess. This\nhere goes to group B.\n\n12\n00:00:41.260 --> 00:00:43.760\nDoes this go to group A or group B?\n\n13\n00:00:44.760 --> 00:00:46.960\nThis one here goes to group A.\n\n14\n00:00:47.780 --> 00:00:50.180\nDoes this one go to group A or group B?\n\n15\n00:00:51.400 --> 00:00:53.440\nThis one here goes to group B.\n\n16\n00:00:54.080 --> 00:00:56.660\nDoes it go to group A or group B?\n\n17\n00:00:57.760 --> 00:00:59.940\nThis one here goes to group A.\n\n18\n00:01:00.740 --> 00:01:03.380\nDoes this one go to group A or group B?\n\n19\n00:01:04.480 --> 00:01:06.420\nThis one here goes to group A.\n\n20\n00:01:07.160 --> 00:01:10.200\nDoes this one go to group A or group B?\n\n21\n00:01:11.860 --> 00:01:14.400\nThis one here goes to group B.\n\n22\n00:01:15.660 --> 00:01:18.980\nNow here's a tricky one. Does\nthis one go to group A or group B?\n\n23\n00:01:19.880 --> 00:01:25.080\nThis one goes to group A, and I'm sure you\nprobably figured it out already, but does\n\n24\n00:01:25.080 --> 00:01:26.800\nthis go to group A or group B?\n\n25\n00:01:27.860 --> 00:01:30.120\nThis one here goes to group A.\n\n26\n00:01:30.640 --> 00:01:34.520\nAnd finally, does this one\ngo to group A or group B?\n\n27\n00:01:35.480 --> 00:01:37.220\nThis one goes to group B.\n\n28\n00:01:38.700 --> 00:01:41.380\nOkay, so what was the pattern?\n\n29\n00:01:42.600 --> 00:01:47.100\nWell, if you've probably already found out,\nif there was any blacks at the left end,\n\n30\n00:01:47.460 --> 00:01:52.860\nthat was group A. And if there was any\nblack at the right end, that was in group B.\n\n31\n00:01:54.020 --> 00:01:59.720\nAnd so I think what's really interesting\nis how do you get better at deciding\n\n32\n00:01:59.720 --> 00:02:04.460\nbetween whether or not I went to group A\nor group B when I didn't need to tell you\n\n33\n00:02:04.460 --> 00:02:07.240\nany rules or when I didn't\ntell you any rules or patterns?\n\n34\n00:02:07.800 --> 00:02:11.540\nSo feel free to pause the video and\njust reflect on this for a few seconds.\n\n35\n00:02:14.480 --> 00:02:18.700\nOkay. So, the human learning algorithm\ncan look something like this.\n\n36\n00:02:19.220 --> 00:02:21.000\nBasically, you take a guess.\n\n37\n00:02:21.740 --> 00:02:25.980\nThen you essentially check your answer to\nsee how far off you are from the actual\n\n38\n00:02:25.980 --> 00:02:29.720\nanswer. And then you adjust your\nfocus on other characteristics.\n\n39\n00:02:30.140 --> 00:02:34.180\nAnd then you just keep repeating this\nprocess until you come to a point where you\n\n40\n00:02:34.180 --> 00:02:38.180\ncan distinguish between different\ngroups without having to be given rules.\n\n41\n00:02:38.780 --> 00:02:42.080\nAnd so the thing I want to point out\nabout humans, what makes this really\n\n42\n00:02:42.080 --> 00:02:44.840\ninteresting, is that we look\nfor what feels important.\n\n43\n00:02:45.400 --> 00:02:48.100\nSo as humans, we're just\nnaturally very curious.\n\n44\n00:02:48.420 --> 00:02:52.960\nWe have these feelings and this strong\ndesire to find meaning and connecting ideas.\n\n45\n00:02:53.440 --> 00:02:57.380\nSo for example, if I just see a black\nsquare out of nowhere, I'm like, okay, well\n\n46\n00:02:57.380 --> 00:02:59.600\nthat black square\ndefinitely stands out to me.\n\n47\n00:03:00.020 --> 00:03:01.920\nAnd like, why is it in that position?\n\n48\n00:03:02.120 --> 00:03:05.840\nYou know, at the end of the day, I'm just\nso curious about how does this all connect\n\n49\n00:03:05.840 --> 00:03:07.180\nand what does this all mean?\n\n50\n00:03:07.780 --> 00:03:11.860\nAnd so when the human learning algorithm\nis in action, you know, what happens is\n\n51\n00:03:11.860 --> 00:03:14.400\nlike, first of all, you have to\nmake an educated guess, right?\n\n52\n00:03:14.680 --> 00:03:16.100\nBecause you don't know\nwhat's going to happen.\n\n53\n00:03:16.200 --> 00:03:19.380\nYou don't know the characteristics.\nSo whenever I'm asked,\n\n54\n00:03:19.520 --> 00:03:21.960\ndoes this go to group A or\ngroup B, you know, I just say,\n\n55\n00:03:22.100 --> 00:03:24.900\nokay, well, I guess it's group A\nsince we're just getting started.\n\n56\n00:03:25.920 --> 00:03:27.380\nAnd so this is where\nthings get interesting.\n\n57\n00:03:27.960 --> 00:03:30.760\nSo at step number two, that's when\nyou start checking your answer.\n\n58\n00:03:31.140 --> 00:03:35.220\nSo at step number two, when you make a\nguess and you see the result, that is going\n\n59\n00:03:35.220 --> 00:03:36.540\nto make you feel something.\n\n60\n00:03:37.020 --> 00:03:41.260\nSo for example, whenever I said that this\nis actually Group B, you can see that I'm\n\n61\n00:03:41.260 --> 00:03:44.020\na little bit shocked.\nI'm like, huh, really?\n\n62\n00:03:44.520 --> 00:03:47.680\nMaybe this has to do with\nbeing on the right side.\n\n63\n00:03:48.320 --> 00:03:52.900\nAnd so the thing about checking answers is\nthat what it's going to do is give you an\n\n64\n00:03:52.900 --> 00:03:56.700\nemotion of either feeling surprised,\nmaybe curious, interested.\n\n65\n00:03:57.240 --> 00:04:01.880\nWhatever it is, you're just going to\nultimately wonder what this is all mean and how\n\n66\n00:04:01.880 --> 00:04:03.220\ndoes it all connect together.\n\n67\n00:04:03.680 --> 00:04:06.980\nAnd then step number three is when\nyou start to adjust your focus.\n\n68\n00:04:07.520 --> 00:04:11.200\nSo based on how you felt after your last\nguess is going to affect what you're going\n\n69\n00:04:11.200 --> 00:04:12.800\nto focus on in your next one.\n\n70\n00:04:13.340 --> 00:04:16.940\nSo you can see over here that when I ask\nthe same question, does this go to group A\n\n71\n00:04:16.940 --> 00:04:22.940\nor group B, I'm like, huh, okay, well,\nit's on the left side now, so maybe this\n\n72\n00:04:22.940 --> 00:04:25.140\nhas to do with being on group A.\n\n73\n00:04:25.640 --> 00:04:29.600\nAnd when I say that this is correct, you\ncan see I get immediately very excited.\n\n74\n00:04:29.720 --> 00:04:32.380\nI'm like, oh, I think I'm\nstarting to get this, right?\n\n75\n00:04:32.380 --> 00:04:37.080\nAnd so as you keep repeating this process,\nover time, you're going to learn which of\n\n76\n00:04:37.080 --> 00:04:40.460\nthese characteristics matter most\nfor telling the groups apart.\n\n77\n00:04:41.760 --> 00:04:46.880\nOK, so it turns out we can actually simulate this\nlearning algorithms into machines as well, too.\n"}, {"id": "lesson-3/06", "title": "The Machine Learning Algorithm", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/en-lesson-3-06.mp4", "vtt": "WEBVTT\n\n1\n00:00:00.760 --> 00:00:05.740\nOkay, so last time we talked about how we\ncan simulate this learning algorithms into\n\n2\n00:00:05.740 --> 00:00:10.160\nmachines. And so before we understand that,\nthe thing we need to understand is what\n\n3\n00:00:10.160 --> 00:00:15.300\nexactly is a feature. So features are just\npieces of information that help us tell\n\n4\n00:00:15.300 --> 00:00:18.340\nthings apart. So take for\nexample these two things here.\n\n5\n00:00:18.760 --> 00:00:21.640\nWell, the first thing I notice is that\nthey're different in terms of shape.\n\n6\n00:00:21.940 --> 00:00:24.400\nOne of them is a square,\nthe other one is a circle.\n\n7\n00:00:24.760 --> 00:00:26.940\nAnd they're also different\nin terms of color.\n\n8\n00:00:27.360 --> 00:00:29.180\nSo this is actually a yellow square.\n\n9\n00:00:29.800 --> 00:00:33.220\nAnd the one that's on the\nright side is a blue circle.\n\n10\n00:00:34.080 --> 00:00:39.440\nSo these are basically features or information\nfor me to help me tell these two things apart.\n\n11\n00:00:41.120 --> 00:00:45.260\nAnd so the way how humans see features\nis that any time we look at an image, we\n\n12\n00:00:45.260 --> 00:00:47.680\nbasically break it down into\ndifferent characteristics.\n\n13\n00:00:48.080 --> 00:00:51.600\nAnd then we naturally focus on\nthe one that feels most important.\n\n14\n00:00:52.260 --> 00:00:56.260\nSo if we looked at all of these different\nfeatures of this image, what we find is\n\n15\n00:00:56.260 --> 00:01:00.640\nthat because this black square position is\nby itself and it just stands out, it just\n\n16\n00:01:00.640 --> 00:01:05.220\nfeels like it's most important out of all\nof these other type of features as well too.\n\n17\n00:01:06.580 --> 00:01:10.080\nHowever, the thing about machines is\nthat they aren't guessing with feelings,\n\n18\n00:01:10.280 --> 00:01:13.480\nthey're actually making\ncalculated predictions.\n\n19\n00:01:14.400 --> 00:01:18.800\nSo machines don't treat these features\nas feelings, they treat these features as\n\n20\n00:01:18.800 --> 00:01:21.960\nnumbers, right? They don't\nactually see or feel anything.\n\n21\n00:01:22.440 --> 00:01:26.180\nSo for example, in order for them to\nactually process it, you know, they turn the\n\n22\n00:01:26.180 --> 00:01:28.620\nwhite into one and the black into zero.\n\n23\n00:01:30.220 --> 00:01:34.080\nAnd so a good way to really see the\ndifference between humans and machines and how\n\n24\n00:01:34.080 --> 00:01:39.120\nwe process features is that for a human,\nyou know, whenever we see something that\n\n25\n00:01:39.120 --> 00:01:42.940\nstands out like a black square, we're going\nto be like, well, that feels important,\n\n26\n00:01:42.940 --> 00:01:44.960\nso we're going to basically take a guess.\n\n27\n00:01:45.640 --> 00:01:49.760\nNow, the thing about machines is that\nwhenever they, you can see over here that they\n\n28\n00:01:49.760 --> 00:01:53.740\ndon't actually see it, they basically\nchange that into numbers, and then they\n\n29\n00:01:53.740 --> 00:01:57.860\nbasically multiply that by some sort of\nimportance, so which of these things are\n\n30\n00:01:57.860 --> 00:02:01.920\nmost important at determining the\noutcome, and then they essentially make a\n\n31\n00:02:01.920 --> 00:02:04.740\ncalculated prediction. Don't\nworry about the math, right?\n\n32\n00:02:05.020 --> 00:02:09.100\nThe important thing I want you to understand\nis that there's just a lot of math\n\n33\n00:02:09.100 --> 00:02:10.420\nthat's involved in the process.\n\n34\n00:02:11.080 --> 00:02:15.500\nSo the machine learning training algorithm,\nyou can see it has like a similar amount\n\n35\n00:02:15.500 --> 00:02:19.820\nof steps where where it's like you make\na calculated prediction, then you measure\n\n36\n00:02:19.820 --> 00:02:24.160\nthe error, then you adjust your math\nequation, and then you keep repeating this\n\n37\n00:02:24.160 --> 00:02:29.300\nprocess. So the thing about machine learning\nis that they basically calculate the\n\n38\n00:02:29.300 --> 00:02:33.520\nprediction, right? So instead of actually\nseeing the feature, they take the feature\n\n39\n00:02:33.520 --> 00:02:37.960\nand they multiply it by, okay, how\nimportant are each of these features at\n\n40\n00:02:37.960 --> 00:02:40.160\ndetermining the outcome, right?\n\n41\n00:02:40.200 --> 00:02:42.040\nIs it mostly feature one?\n\n42\n00:02:42.160 --> 00:02:44.780\nIs it mostly feature two and so on, right?\n\n43\n00:02:44.780 --> 00:02:48.200\nIt's trying to decide that to\nsee how it gets to that answer.\n\n44\n00:02:49.120 --> 00:02:51.420\nSo let's see the machine\nlearning algorithm in action.\n\n45\n00:02:52.400 --> 00:02:55.000\nSo step number one, you basically\ncalculate your prediction.\n\n46\n00:02:55.760 --> 00:02:59.980\nSo they start by calculating the features\nas numbers, and then they basically add\n\n47\n00:02:59.980 --> 00:03:02.980\nthem together with\nrandom important values.\n\n48\n00:03:03.280 --> 00:03:06.960\nBecause remember, in the beginning, very\nsimilar to humans, we had to make a random\n\n49\n00:03:06.960 --> 00:03:11.440\nguess. So also, these machines, they are\njust putting something random of which of\n\n50\n00:03:11.440 --> 00:03:12.840\nthese features is actually important.\n\n51\n00:03:12.840 --> 00:03:16.060\nAnd so they come up with some\nsort of calculated prediction.\n\n52\n00:03:16.840 --> 00:03:20.400\nSo then after we make that prediction,\nthen we have to measure error.\n\n53\n00:03:20.860 --> 00:03:25.300\nSo what the model does is that it basically\ncompares how far off the calculated\n\n54\n00:03:25.300 --> 00:03:28.380\nprediction was from the\nactual correct answer.\n\n55\n00:03:28.520 --> 00:03:31.420\nAnd this distance is\nwhat we call the error.\n\n56\n00:03:32.060 --> 00:03:36.200\nAnd so this error is going to be very\nimportant to us because what we do is that we\n\n57\n00:03:36.200 --> 00:03:41.140\nuse that error and we use it to help us\nadjust the importance of each feature\n\n58\n00:03:41.140 --> 00:03:45.100\ndifferently in our equation, aiming\nfor less error in the next one.\n\n59\n00:03:45.540 --> 00:03:50.660\nSo basically what we do is we take that\nerror and then we basically update it\n\n60\n00:03:50.660 --> 00:03:55.540\ndifferently for each feature to see which\none is more important at determining the\n\n61\n00:03:55.540 --> 00:03:59.940\noutcome. And then we basically come up with\nsome sort of updated equation that we're\n\n62\n00:03:59.940 --> 00:04:01.940\ngoing to re-iteratively update.\n\n63\n00:04:02.700 --> 00:04:07.860\nAnd so after enough repetition, you\nbasically have a trained model that can make\n\n64\n00:04:07.860 --> 00:04:12.840\npredictions. And so you can see over\nhere that we have a nice, fine-tuned math\n\n65\n00:04:12.840 --> 00:04:15.560\nequation that can make some\npretty accurate decisions.\n\n66\n00:04:15.800 --> 00:04:18.220\nRight, you can see it says 87% group B.\n\n67\n00:04:19.400 --> 00:04:23.380\nSo the key idea, and it's okay if you don't\nunderstand the math that goes into it,\n\n68\n00:04:23.420 --> 00:04:27.700\nlike the only thing I want you to understand\nis that a trained model is based on\n\n69\n00:04:27.700 --> 00:04:32.920\nmath equations. So trained AI models basically\nturn data into numbers, they do a lot\n\n70\n00:04:32.920 --> 00:04:37.740\nof calculations into it, and then they also\noutput a number which later is converted\n\n71\n00:04:37.740 --> 00:04:40.560\ninto something that a\nhuman can understand.\n\n72\n00:04:41.580 --> 00:04:47.440\nAnd so this is why every single\ndetail of our image or data\n\n73\n00:04:47.440 --> 00:04:51.580\nreally matters because every detail matters\nin our AI models because every number\n\n74\n00:04:51.580 --> 00:04:53.080\nmatters in an equation.\n\n75\n00:04:53.940 --> 00:04:58.920\nAI doesn't process information the way we\ndo, so
