रूप से प्रेडिक्शन को कैलकुलेट\n\n02:45.120 --> 02:45.880\nकरते हैं, है ना?\n\n02:46.660 --> 02:49.320\nतो वास्तव में फीचर को देखने के बजाय, वे\n\n02:49.320 --> 02:52.160\nफीचर लेते हैं, और उसे गुणा करते हैं, ठीक\n\n02:52.160 --> 02:54.820\nहै, परिणाम निर्धारित करने में इनमें से\n\n02:54.820 --> 02:57.540\nप्रत्येक फीचर कितना महत्वपूर्ण है, है ना?\n\n02:58.080 --> 02:59.700\nक्या यह ज्यादातर फीचर वन है?\n\n03:00.150 --> 03:01.770\nक्या यह ज्यादातर फीचर टू है?\n\n03:02.220 --> 03:02.960\nऔर इसी तरह, है ना?\n\n03:03.310 --> 03:05.170\nयह यह देखने के लिए तय करने की कोशिश कर\n\n03:05.170 --> 03:06.890\nरहा है कि वह उस उत्तर तक कैसे पहुँचता है।\n\n03:07.970 --> 03:09.710\nतो चलिए मशीन लर्निंग एल्गोरिदम को काम\n\n03:09.710 --> 03:10.450\nकरते हुए देखते हैं।\n\n03:11.660 --> 03:14.220\nतो स्टेप नंबर वन, आप मूल रूप से अपने\n\n03:14.220 --> 03:16.480\nप्रेडिक्शन को कैलकुलेट करते हैं। तो वे\n\n03:16.480 --> 03:18.960\nफीचर्स को नंबर्स के रूप में कैलकुलेट\n\n03:18.960 --> 03:22.000\nकरके शुरू करते हैं, और फिर वे मूल रूप से\n\n03:22.000 --> 03:23.960\nउन्हें रैंडम इम्पोर्टेंस वैल्यूज के साथ\n\n03:23.960 --> 03:24.440\nजोड़ देते हैं।\n\n03:24.660 --> 03:26.960\nक्योंकि याद रखें, शुरुआत में, आप जानते\n\n03:26.960 --> 03:29.960\nहैं, इंसानों की तरह ही, हमें एक रैंडम\n\n03:29.960 --> 03:32.080\nअंदाज़ा लगाना पड़ता था। तो ये मशीनें भी,\n\n03:32.080 --> 03:34.460\nबस रैंडम तरीके से चुनती हैं कि इनमें से\n\n03:34.460 --> 03:36.360\nकौन सा फीचर वास्तव में महत्वपूर्ण है।\n\n03:36.870 --> 03:39.470\nऔर इस तरह वे एक तरह की कैलकुलेटेड\n\n03:39.470 --> 03:42.550\nप्रेडिक्शन पर पहुँचते हैं। तो फिर हम--\n\n03:42.550 --> 03:45.210\nउस प्रेडिक्शन के बाद, हमें एरर को मापना होता है।\n\n03:45.890 --> 03:48.210\nतो मॉडल यह करता है कि वह मूल रूप से\n\n03:48.210 --> 03:51.010\nतुलना करता है कि कैलकुलेटेड प्रेडिक्शन\n\n03:51.010 --> 03:53.870\nसही उत्तर से कितनी दूर थी, और इसी दूरी\n\n03:53.870 --> 03:54.870\nको हम एरर कहते हैं।\n\n03:55.770 --> 03:57.830\nऔर इसलिए यह एरर हमारे लिए बहुत\n\n03:57.830 --> 04:00.130\nमहत्वपूर्ण होने वाली है क्योंकि हम उस\n\n04:00.130 --> 04:03.410\nएरर का उपयोग करते हैं, और हम इसका उपयोग\n\n04:03.410 --> 04:06.290\nअपनी इक्वेशन में प्रत्येक फीचर के महत्व\n\n04:06.290 --> 04:08.650\nको अलग तरह से एडजस्ट करने के लिए करते\n\n04:08.650 --> 04:10.950\nहैं, ताकि अगली बार एरर कम हो।\n\n04:11.810 --> 04:14.530\nतो हम करते यह हैं कि उस एरर को लेते हैं\n\n04:14.530 --> 04:16.830\nऔर फिर हर फीचर के लिए उसे अलग तरह से\n\n04:16.830 --> 04:19.790\nअपडेट करते हैं ताकि देख सकें कि कौन सा\n\n04:19.790 --> 04:22.210\nपरिणाम तय करने में ज्यादा महत्वपूर्ण है।\n\n04:22.950 --> 04:25.850\nऔर फिर हम मूल रूप से एक तरह की अपडेटेड\n\n04:25.860 --> 04:28.310\nइक्वेशन के साथ आते हैं जिसे हम बार-बार,\n\n04:28.320 --> 04:29.610\nअह, अपडेट करने वाले हैं।\n\n04:30.410 --> 04:33.190\nऔर इसलिए पर्याप्त दोहराव के बाद, आपके\n\n04:33.190 --> 04:36.110\nपास मूल रूप से एक ट्रेंड मॉडल होता है जो\n\n04:36.110 --> 04:37.270\nप्रेडिक्शन कर सकता है।\n\n04:38.090 --> 04:40.490\nऔर इसलिए आप यहाँ देख सकते हैं कि हमारे\n\n04:40.490 --> 04:42.930\nपास एक अच्छी फाइन-ट्यून्ड, अह, मैथ\n\n04:42.930 --> 04:45.710\nइक्वेशन है जो काफी सटीक निर्णय ले सकती है, है ना?\n\n04:46.110 --> 04:48.830\nआप देख सकते हैं कि यह सतासी प्रतिशत\n\n04:48.830 --> 04:51.450\nग्रुप बी कहता है। तो मुख्य विचार, और कोई\n\n04:51.450 --> 04:53.510\nबात नहीं अगर आप इसमें लगने वाली गणित को\n\n04:53.510 --> 04:56.410\nनहीं समझते हैं, जैसे, मैं बस इतना चाहता\n\n04:56.410 --> 04:59.390\nहूँ कि आप समझें कि एक ट्रेंड मॉडल, मैथ\n\n04:59.390 --> 05:01.150\nइक्वेशंस पर आधारित होता है।\n\n05:01.780 --> 05:03.860\nतो ट्रेंड एआई मॉडल मूल रूप से डेटा को\n\n05:03.860 --> 05:05.100\nनंबरों में बदल देते हैं।\n\n05:05.440 --> 05:08.040\nवे इसमें बहुत सारी कैलकुलेशन करते हैं,\n\n05:08.040 --> 05:10.060\nऔर फिर वे एक नंबर भी आउटपुट करते हैं\n\n05:10.060 --> 05:12.420\nजिसे बाद में किसी ऐसी चीज़ में बदल दिया\n\n05:12.420 --> 05:14.380\nजाता है जिसे इंसान समझ सके, ठीक है?\n\n05:15.340 --> 05:18.580\nऔर इसीलिए हमारी इमेज या डेटा का हर एक\n\n05:18.580 --> 05:21.180\nविवरण वास्तव में मायने रखता है क्योंकि\n\n05:21.180 --> 05:23.800\nएआई मॉडल में हर विवरण मायने रखता है\n\n05:23.800 --> 05:26.120\nक्योंकि एक इक्वेशन में हर नंबर मायने\n\n05:26.120 --> 05:26.820\nरखता है, है ना?\n\n05:27.450 --> 05:29.430\nएआई जानकारी को उस तरह से प्रोसेस नहीं\n\n05:29.430 --> 05:32.030\nकरता जैसे हम करते हैं, इसलिए इसकी\n\n05:32.030 --> 05:33.870\nप्रेडिक्शन वास्तव में हमारी उम्मीदों से\n\n05:33.870 --> 05:35.370\nमेल नहीं खा सकती हैं, है ना?\n\n05:35.370 --> 05:37.850\nतो आप यहाँ देख सकते हैं कि इनमें से\n\n05:37.850 --> 05:40.510\nप्रत्येक एक नंबर का प्रतिनिधित्व कर सकता\n\n05:40.510 --> 05:42.610\nहै जिसे हम उस इक्वेशन में कैलकुलेट करने\n\n05:42.610 --> 05:43.090\nजा रहे हैं।\n\n05:43.410 --> 05:45.970\nऔर इसलिए यह विचार सामान्य रूप से किसी भी\n\n05:45.970 --> 05:48.510\nप्रकार के एआई मॉडल पर लागू होता है, है ना?\n\n05:49.070 --> 05:52.230\nतो जैसे लैंग्वेज मॉडल या कन्वर्सेशनल एआई\n\n05:52.230 --> 05:54.210\nटूल्स आपके शब्दों को लेते हैं, उन्हें\n\n05:54.210 --> 05:56.690\nनंबरों में बदलते हैं, उन पर गणित करते\n\n05:56.690 --> 05:59.010\nहैं, फिर वापस शब्दों में बदलते हैं, ताकि\n\n05:59.010 --> 06:00.210\nआप इसे समझ सकें, है ना?\n\n06:01.110 --> 06:03.550\nतो मूल रूप से, दिन के अंत में प्रेडिक्शन\n\n06:03.550 --> 06:05.770\nके साथ आने के लिए बहुत सारी मैथ, अह,\n\n06:05.770 --> 06:07.930\nइक्वेशंस और कैलकुलेशन करना ही सब कुछ है।\n\n06:10.060 --> 06:11.680\nतो मुख्य बात जो मैं चाहता हूँ कि आप\n\n06:11.680 --> 06:14.420\nसमझें वह यह है कि एआई कोई जादू नहीं है।\n\n06:14.900 --> 06:17.400\nयह मूल रूप से गणित है जो मानवीय विकल्पों\n\n06:17.400 --> 06:18.400\nद्वारा निर्देशित है।\n\n06:18.520 --> 06:20.760\nऔर मैं यह इसे कम आंकने के लिए नहीं कह\n\n06:20.760 --> 06:23.260\nरहा हूँ, बल्कि मैं, मैं चाहता हूँ कि यह\n\n06:23.260 --> 06:25.200\nबहुत स्पष्ट हो कि यह वास्तव में सिर्फ\n\n06:25.200 --> 06:27.400\nगणित है जो मानवीय विकल्पों द्वारा\n\n06:27.400 --> 06:29.880\nनिर्देशित है। तो, उदाहरण के लिए, जब भी\n\n06:29.880 --> 06:32.260\nहम एआई एडेप्टेडनेस को देखते हैं, है ना,\n\n06:32.260 --> 06:34.660\nएआई मूल रूप से इंसानों द्वारा लिखे गए\n\n06:34.660 --> 06:37.240\nलर्निंग एल्गोरिदम का उपयोग करके एडेप्ट\n\n06:37.240 --> 06:38.840\nकरता है जो मशीन पर चलते हैं।\n\n06:39.420 --> 06:41.900\nतो जैसा कि हमने उल्लेख किया, और जैसा कि\n\n06:41.900 --> 06:43.820\nहमने देखा, इसके लिए बहुत सारी मैथ\n\n06:43.820 --> 06:46.580\nकैलकुलेशन की आवश्यकता होती है जिसमें\n\n06:46.580 --> 06:49.940\nबहुत अधिक ऊर्जा लगती है। तो NeuroPocket\n\n06:49.940 --> 06:52.740\nअसल में ऊर्जा का उपयोग कर रहा है या, या\n\n06:52.740 --> 06:54.720\nसीधे आपके डिवाइस पर गणना कर रहा है, है ना?\n\n06:55.190 --> 06:57.350\nतो बहुत सारी भारी गणनाओं में बहुत अधिक\n\n06:57.350 --> 06:59.210\nऊर्जा खर्च होगी, जिससे आपका डिवाइस गर्म\n\n06:59.210 --> 07:01.450\nहो जाएगा, और इस तरह बैटरी भी खत्म होगी।\n\n07:02.960 --> 07:05.940\nअब, असलियत यह है कि AI की पर्यावरणीय\n\n07:05.940 --> 07:08.920\nलागत यह है कि जबकि NeuroPocket सीधे आपके\n\n07:08.920 --> 07:11.560\nडिवाइस पर काम करता है, अधिकांश AI के\n\n07:11.560 --> 07:13.560\nबारे में बात यह है कि वे हजारों\n\n07:13.560 --> 07:16.140\nकंप्यूटरों से भरी विशाल इमारतों में चलते\n\n07:16.140 --> 07:16.860\nहैं, है ना?\n\n07:17.300 --> 07:20.000\nतो ये इमारतें छोटे शहरों जितनी बिजली और\n\n07:20.000 --> 07:23.040\nअरबों गैलन पानी का उपयोग करती हैं, सिर्फ\n\n07:23.040 --> 07:26.020\nइन चीजों को ठंडा रखने के लिए ताकि वे कई\n\n07:26.020 --> 07:28.460\nअलग-अलग प्रकार की गणितीय गणनाएं कर सकें।\n\n07:28.810 --> 07:30.960\nतो यह निश्चित रूप से हमारे पर्यावरण के\n\n07:30.960 --> 07:32.390\nलिए एक बड़ी कीमत हो सकती है।\n\n07:33.470 --> 07:35.450\nदूसरी बात अब AI की स्वायत्तता है।\n\n07:35.810 --> 07:38.570\nखैर, AI स्वायत्तता ऐसी है जैसे, आप जानते\n\n07:38.570 --> 07:41.010\nहैं, AI भारी मात्रा में डेटा में अपने\n\n07:41.010 --> 07:43.570\nस्वयं के पैटर्न ढूंढकर भविष्यवाणियां\n\n07:43.570 --> 07:43.990\nकरता है।\n\n07:44.290 --> 07:46.710\nइसलिए इंसानों के रूप में हम इसकी\n\n07:46.710 --> 07:48.930\nभविष्यवाणी को निर्देशित करने के लिए\n\n07:48.930 --> 07:51.890\nउदाहरण या फीडबैक देते हैं। उदाहरण के\n\n07:51.890 --> 07:54.850\nलिए, आपने अपने NeuroPocket ऐप को\n\n07:54.850 --> 07:57.790\nप्रशिक्षित करने के लिए डेटा इकट्ठा किया\n\n07:57.790 --> 08:01.210\nथा। असल में, इन AI के पीछे बहुत सारे\n\n08:01.210 --> 08:02.120\nइंसान होते हैं।\n\n08:02.770 --> 08:05.310\nआप जानते हैं, NeuroPocket के साथ, यह या\n\n08:05.310 --> 08:08.130\nतो आप थे या शायद कुछ अन्य दोस्त थे जो\n\n08:08.130 --> 08:10.610\nडेटा एकत्र कर रहे थे। लेकिन अधिकांश AI\n\n08:10.610 --> 08:13.310\nको डेटा को साफ करने और उन AI मॉडलों को\n\n08:13.310 --> 08:15.130\nनिर्देशित करने के लिए लाखों लोगों की\n\n08:15.130 --> 08:17.230\nआवश्यकता होती है। और इसलिए उन मानवीय\n\n08:17.230 --> 08:19.650\nविकल्पों के बिना, मशीन को पता ही नहीं\n\n08:19.650 --> 08:22.150\nचलेगा कि उन सही पैटर्नों को कैसे खोजा\n\n08:22.150 --> 08:25.330\nजाए। तो अंत में, वास्तव में आप AI के काम\n\n08:25.330 --> 08:27.630\nकरने के तरीके के बारे में जो समझना चाहते\n\n08:27.630 --> 08:30.910\nहैं वह यह है कि AI उपकरण वास्तव में\n\n08:30.910 --> 08:32.910\nमानवीय विकल्पों का ही एक परिणाम हैं।\n"}, {"id": "lesson-3/07", "title": "पुनरावलोकन क्विज़", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=hi"}, {"id": "lesson-3/08", "title": "प्रोजेक्ट का समय", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-08.mp4", "vtt": "WEBVTT\n\n00:00.520 --> 00:02.500\nठीक है, पाठ नंबर तीन, प्रोजेक्ट का समय।\n\n00:03.240 --> 00:05.500\nतो अब समय है कि आप अपनी विशेषताओं के\n\n00:05.500 --> 00:07.900\nबारे में सोचना शुरू करें। तो आपके पाठ दो\n\n00:07.900 --> 00:09.660\nके डेटा के आधार पर, मैं चाहता हूँ कि आप\n\n00:09.660 --> 00:11.040\nथोड़ा और गहराई से सोचें।\n\n00:11.550 --> 00:13.430\nउन मुख्य विशेषताओं के बारे में सोचें\n\n00:13.430 --> 00:15.450\nजिनका इस्तेमाल आपने अपने समूहों को अलग\n\n00:15.450 --> 00:16.330\nकरने के लिए किया था।\n\n00:17.040 --> 00:18.040\nक्या वह शायद रंग था?\n\n00:18.780 --> 00:19.540\nक्या वह साइज था?\n\n00:19.990 --> 00:20.730\nक्या वह आकार था?\n\n00:21.190 --> 00:23.450\nआप और किन-किन विशेषताओं के बारे में सोच\n\n00:23.450 --> 00:26.210\nरहे थे जिनसे आपके समूह एक दूसरे से अलग हुए?\n\n00:27.260 --> 00:30.120\nठीक है, तो आप वर्कशीट पर पाठ तीन के सवाल\n\n00:30.120 --> 00:32.460\nका जवाब देंगे, और जल्दी खत्म करने पर\n\n00:32.460 --> 00:34.840\nअपने एआई क्लासिफायर को बेहतर बनाते रहें।\n\n00:35.240 --> 00:37.280\nअगर आपके टीचर इजाजत दें, तो और डेटा\n\n00:37.280 --> 00:39.460\nजुटाने बाहर जाएं ताकि आप अपने एआई\n\n00:39.460 --> 00:41.000\nक्लासिफायर पर काम जारी रख सकें।\n\n00:41.530 --> 00:44.950\nतो जरूरत पड़ने पर और डेटा इकट्ठा करें।\n\n00:44.950 --> 00:47.710\nतो पाठ तीन का एक उदाहरण जवाब, जो\n\n00:47.710 --> 00:50.490\nविशेषताओं की पहचान है, आपका क्लासिफायर\n\n00:50.490 --> 00:52.410\nडेटा बांटने के लिए किन विशेषताओं का\n\n00:52.410 --> 00:53.170\nइस्तेमाल करेगा?\n\n00:53.970 --> 00:56.850\nतो इस उदाहरण में, छात्र ने यह कहा: \"मैं\n\n00:56.850 --> 00:59.790\nरंग, आकार और साइज का उपयोग करूँगा।\n\n00:59.790 --> 01:02.430\nउदाहरण के लिए, केले लंबे और पीले होते\n\n01:02.430 --> 01:05.350\nहैं, संतरे गोल और नारंगी होते हैं, और\n\n01:05.350 --> 01:08.170\nएवोकैडो अंडाकार और हरे होते हैं। ये\n\n01:08.170 --> 01:11.110\nविशेषताएं उन्हें एक दूसरे से अलग पहचानना\n\n01:11.110 --> 01:12.450\nबहुत आसान बना देती हैं।\"\n"}, {"id": "lesson-3/09", "title": "वर्कशीट", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=hi"}]}, {"id": "lesson-4", "kicker": "पाठ 4", "title": "क्या मशीनें जिम्मेदार हो सकती हैं", "items": [{"id": "lesson-4/01", "title": "उद्देश्य", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-01.mp4", "vtt": "WEBVTT\n\n00:00.340 --> 00:02.500\nठीक है, पाठ संख्या चार: क्या मशीनें\n\n00:02.500 --> 00:03.560\nजिम्मेदार हो सकती हैं?\n\n00:04.530 --> 00:07.010\nतो इस पाठ चार के उद्देश्य में हम यह\n\n00:07.010 --> 00:09.390\nसीखेंगे कि डेटा पक्षपात कैसे गलत\n\n00:09.390 --> 00:11.530\nभविष्यवाणियों की ओर ले जाता है, यह\n\n00:11.530 --> 00:14.190\nसमझाएंगे कि एआई के लिए इंसान जिम्मेदार\n\n00:14.190 --> 00:16.450\nक्यों हैं और नुकसान को कैसे कम किया जा\n\n00:16.450 --> 00:16.890\nसकता है।\n\n00:17.350 --> 00:19.750\nहम लोगों की गोपनीयता की रक्षा करने के\n\n00:19.750 --> 00:22.550\nसरल तरीकों को समझाएंगे, और यह पहचानेंगे\n\n00:22.550 --> 00:25.570\nकि पक्षपात, गोपनीयता और जिम्मेदारी किस\n\n00:25.570 --> 00:27.410\nतरह जिम्मेदार एआई से जुड़ते हैं।\n"}, {"id": "lesson-4/02", "title": "बेयरली अ डॉग चैलेंज", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-02.mp4", "vtt": "WEBVTT\n\n00:00.260 --> 00:02.560\nहमारा चैलेंज है 'Bear-ly a Dog\n\n00:02.560 --> 00:05.260\nChallenge', जहाँ आपको ऐसा मॉडल बनाना है\n\n00:05.260 --> 00:08.220\nजो भालू और कुत्तों में अंतर कर सभी टेस्ट\n\n00:08.220 --> 00:10.960\nकेस पास कर सके। आपके पास सिर्फ तीन मिनट\n\n00:10.960 --> 00:13.960\nहैं, और आप अधिकतम दस भालू और दस कुत्ते\n\n00:13.960 --> 00:17.040\nचुन सकते हैं। इसे Neural Pocket ऐप पर खोजें।\n\n00:17.570 --> 00:20.030\nवहाँ 'Try Bias Challenge' पर क्लिक करें,\n\n00:20.030 --> 00:22.550\nफिर 'Start Challenge' दबाएँ। यहाँ आप\n\n00:22.550 --> 00:25.170\nअधिकतम दस भालू और दस कुत्ते चुन सकते\n\n00:25.170 --> 00:27.510\nहैं। Neural Pocket की तरह, डेटा लेकर\n\n00:27.510 --> 00:29.930\nट्रेनिंग करें और फिर मॉडल के सभी टेस्ट\n\n00:29.930 --> 00:32.570\nकेस चलाकर देखें कि क्या वे पास होते हैं।\n\n00:32.570 --> 00:35.070\nचलिए चैलेंज शुरू करते हैं, अंत में मिलते हैं।\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "पूर्वाग्रह क्या है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-03.mp4", "vtt": "WEBVTT\n\n00:01.240 --> 00:03.460\nठीक है, तो एक बार फिर से स्वागत है। तो\n\n00:03.460 --> 00:05.280\n'बमुश्किल एक कुत्ता' चैलेंज खेलने के\n\n00:05.280 --> 00:06.600\nबाद, आपके लिए एक सवाल है।\n\n00:07.410 --> 00:09.710\nआपके परिणाम क्या थे, और आपको क्यों लगता\n\n00:09.710 --> 00:10.510\nहै कि ऐसा हुआ?\n\n00:11.520 --> 00:13.460\nतो क्या आपने सभी टेस्ट केस पास कर लिए थे?\n\n00:13.840 --> 00:15.460\nक्या आपने उनमें से कुछ पास किए थे?\n\n00:15.460 --> 00:16.740\nक्या आप सभी में फेल हो गए थे?\n\n00:17.520 --> 00:19.400\nतो बस वीडियो को रोकें और कुछ सेकंड के\n\n00:19.400 --> 00:20.360\nलिए इस बारे में सोचें।\n\n00:22.810 --> 00:25.150\nठीक है, अगर आप सभी टेस्ट केस पास नहीं कर\n\n00:25.150 --> 00:27.910\nपाए, तो इसका कारण मानव पक्षपात हो सकता है।\n\n00:28.710 --> 00:31.610\nअब, इंसानों के बारे में बात यह है कि हम\n\n00:31.610 --> 00:33.910\nसभी दुनिया को अलग-अलग तरीके से देखते\n\n00:33.910 --> 00:36.530\nहैं, क्योंकि, खैर, हमारे जीवन के अनुभव\n\n00:36.530 --> 00:38.990\nअलग-अलग होते हैं, और हम दुनिया के इस\n\n00:38.990 --> 00:41.370\nसीमित दृष्टिकोण को पक्षपात कहते हैं। तो\n\n00:41.370 --> 00:43.610\nयह तस्वीर इसे समझाने का अच्छा काम करती\n\n00:43.610 --> 00:46.250\nहै। देखिए, यहाँ तीन लोग हैं, और बाईं ओर\n\n00:46.250 --> 00:48.550\nवाला व्यक्ति हाथी की सूंड को पकड़ता है\n\n00:48.550 --> 00:50.030\nऔर सोचता है कि यह एक साँप है।\n\n00:50.680 --> 00:52.880\nमध्य में जो व्यक्ति है, उसे लगता है कि\n\n00:52.880 --> 00:55.320\nयह एक दीवार है, और जिसकी पूंछ है, उसे\n\n00:55.320 --> 00:58.400\nलगता है कि यह असल में एक रस्सी है। तो वे\n\n00:58.400 --> 01:00.820\nसभी एक ही हाथी से अलग-अलग अनुभव प्राप्त\n\n01:00.820 --> 01:03.080\nकरते हैं, और यही कारण है कि उनके\n\n01:03.080 --> 01:04.220\nदृष्टिकोण सीमित हैं।\n\n01:05.950 --> 01:08.650\nऔर होता यह है कि हमारा पक्षपात या सीमित\n\n01:08.650 --> 01:11.210\nदृष्टिकोण वास्तव में हमारे द्वारा डेटा\n\n01:11.210 --> 01:13.190\nमें चुनी गई विशेषताओं को प्रभावित कर\n\n01:13.190 --> 01:13.630\nसकता है।\n\n01:13.890 --> 01:16.170\nतो उदाहरण के लिए, 'बमुश्किल कुत्ता'\n\n01:16.170 --> 01:16.830\nचुनौती को लें।\n\n01:17.200 --> 01:19.680\nतो हो सकता है कि किसी ने सिर्फ काले भालू\n\n01:19.680 --> 01:21.680\nऔर सफेद कुत्तों को ही चुना हो क्योंकि\n\n01:21.680 --> 01:23.860\nशायद वे इन्हीं से सबसे ज्यादा परिचित हैं।\n\n01:24.590 --> 01:27.010\nलेकिन असलियत यह है कि भालू भी सफेद हो\n\n01:27.010 --> 01:29.290\nसकते हैं, और कुत्ते भी काले हो सकते हैं।\n\n01:30.290 --> 01:32.750\nऔर इस पक्षपाती डेटा का परिणाम कुछ ऐसा हो\n\n01:32.750 --> 01:35.090\nसकता है जिसे एल्गोरिदमिक पक्षपात कहा\n\n01:35.090 --> 01:35.530\nजाता है।\n\n01:35.960 --> 01:38.580\nतो जब भी कोई पक्षपाती डेटा एआई को पूरी\n\n01:38.590 --> 01:41.120\nतस्वीर की बजाय एक सीमित दृष्टिकोण दिखाता\n\n01:41.120 --> 01:43.640\nहै, तो यह मूलतः गलत परिणामों की ओर ले\n\n01:43.640 --> 01:44.090\nजाता है।\n\n01:45.230 --> 01:47.350\nतो उदाहरण के लिए, आप यहाँ देख सकते हैं\n\n01:47.350 --> 01:49.330\nकि हमारे डेटा सेट में हमने यह सुनिश्चित\n\n01:49.330 --> 01:51.650\nकिया था कि सभी भालू काले हों और सभी\n\n01:51.650 --> 01:52.510\nकुत्ते सफेद हों।\n\n01:53.460 --> 01:55.840\nतो जब भी उसने किसी सफेद जानवर को देखा,\n\n01:55.840 --> 01:57.660\nउसने उसे कुत्ते के रूप में पहचाना।\n\n01:58.180 --> 02:00.480\nऔर जब भी उसने किसी काले जानवर को देखा,\n\n02:00.480 --> 02:02.440\nउसने उसे भालू के रूप में पहचाना, है ना?\n\n02:02.440 --> 02:05.900\nतो मूल रूप से, हमारा पक्षपात वास्तविकता\n\n02:05.900 --> 02:08.000\nकी तुलना में केवल एक सीमित दृष्टिकोण\n\n02:08.000 --> 02:08.680\nदिखा रहा था।\n\n02:10.930 --> 02:13.070\nतो हाँ, हमारे भालू को कुत्ते के रूप में\n\n02:13.070 --> 02:17.550\nगलत वर्गीकृत कर दिया गया। अब, जिस बात को\n\n02:17.550 --> 02:20.070\nमैं वास्तव में स्पष्ट करना चाहता हूँ, वह\n\n02:20.070 --> 02:22.710\nयह है कि, आप जानते हैं, पक्षपाती होना\n\n02:22.710 --> 02:24.650\nपूरी तरह से मानवीय बात है, है ना?\n\n02:24.650 --> 02:27.150\nयह केवल तब चिंता का विषय बनता है जब आप\n\n02:27.150 --> 02:29.390\nइसे दूसरों पर लागू करते हैं बिना उनकी\n\n02:29.390 --> 02:31.570\nअपनी अनुभव और मूल्यों को ध्यान में रखे।\n\n02:32.260 --> 02:35.200\nऔर इसी तरह, हमारा पक्षपाती डेटा हमारी\n\n02:35.200 --> 02:37.520\nएआई को उन लोगों को बाहर करने के लिए\n\n02:37.520 --> 02:39.880\nप्रेरित कर सकता है, जिन्हें हम वास्तव\n\n02:39.880 --> 02:41.160\nमें मदद करना चाहते हैं।\n\n02:41.540 --> 02:43.480\nतो इसके कुछ उदाहरण हो सकते हैं जैसे कि\n\n02:43.480 --> 02:44.860\nगलत चिकित्सा परिणाम, है ना?\n\n02:45.700 --> 02:47.700\nतो कभी-कभी एआई एक्स-रे का विश्लेषण कर\n\n02:47.700 --> 02:50.400\nसकती है, और, आप जानते हैं, अगर वे\n\n02:50.400 --> 02:52.420\nप्रशिक्षण के दौरान पर्याप्त मरीजों का\n\n02:52.420 --> 02:54.840\nविश्लेषण नहीं कर पाती हैं, तो वे वास्तव\n\n02:54.840 --> 02:57.560\nमें गलतियाँ कर सकती हैं। तो आप देख सकते\n\n02:57.560 --> 02:59.420\nहैं कि इसने गलत निदान निर्णय दिया।\n\n03:00.250 --> 03:02.210\nऔर डॉक्टरों के बारे में बात यह है कि अगर\n\n03:02.210 --> 03:04.490\nवे परिणामों पर जरूरत से ज्यादा भरोसा कर\n\n03:04.490 --> 03:06.930\nलें, है ना, और वे दोबारा जांच न करें, तो\n\n03:06.930 --> 03:08.870\nकिसी को वास्तव में गलत निदान मिल सकता\n\n03:08.870 --> 03:10.910\nहै, और वह वाकई में बहुत बुरा हो सकता है।\n\n03:11.940 --> 03:14.260\nएक और बात यह है कि वास्तव में ऐसे मामले\n\n03:14.260 --> 03:16.140\nभी हुए हैं जहाँ गिरफ्तारी हुई है, है ना?\n\n03:16.610 --> 03:18.890\nतो कभी-कभी एआई सिस्टम ने लोगों की गलत\n\n03:18.890 --> 03:21.030\nपहचान कर ली है क्योंकि उनके पास विभिन्न\n\n03:21.030 --> 03:22.990\nप्रकार के चेहरों और नस्लों का पूरा\n\n03:22.990 --> 03:24.450\nप्रशिक्षण डेटा नहीं होता है।\n\n03:25.160 --> 03:27.740\nऔर इसी वजह से रॉबर्ट विलियम जैसे लोगों\n\n03:27.740 --> 03:29.840\nकी भी गलत तरीके से गिरफ्तारी हो चुकी है।\n\n03:30.990 --> 03:32.750\nऔर यह सिर्फ तस्वीरों पर ही लागू नहीं\n\n03:32.750 --> 03:34.930\nहोता, बल्कि भाषा पर भी लागू होता है, है ना?\n\n03:34.930 --> 03:38.070\nकभी-कभी एआई टूल्स इसलिए फेल हो जाते हैं\n\n03:38.070 --> 03:40.750\nक्योंकि उनके प्रशिक्षण डेटा में उस भाषा,\n\n03:40.750 --> 03:43.190\nस्थानीय बोली या स्लैंग की पर्याप्त\n\n03:43.190 --> 03:44.310\nमात्रा नहीं होती है।\n\n03:44.630 --> 03:46.810\nऐसा एक समय था जब एक आदमी ने अरबी में\n\n03:46.810 --> 03:49.290\nसुप्रभात कहा, लेकिन उसका गलत अनुवाद 'उन\n\n03:49.290 --> 03:51.390\nपर हमला करो' के रूप में किया गया, जिससे\n\n03:51.390 --> 03:53.570\nउस आदमी को गलत तरीके से गिरफ्तार कर लिया\n\n03:53.570 --> 03:55.850\nगया, हालांकि बाद में उसे रिहा कर दिया गया।\n\n03:56.800 --> 03:59.280\nतो ऐसे बहुत सारे अलग-अलग मामले हैं जहाँ\n\n03:59.280 --> 04:02.060\nजब हम किसी और के अनुभव या स्थिति का\n\n04:02.060 --> 04:04.260\nध्यान नहीं रखते, अपनी पूर्वाग्रह के\n\n04:04.260 --> 04:06.580\nकारण, तो यह गलतियां पैदा कर सकता है।\n\n04:06.810 --> 04:07.790\nतो मेरा आपसे सवाल है।\n\n04:08.750 --> 04:10.750\nजब गलतियाँ होती हैं, तो उसके लिए कौन\n\n04:10.750 --> 04:13.330\nजिम्मेदार है, एआई या इंसान, और आप ऐसा\n\n04:13.330 --> 04:14.110\nक्यों सोचते हैं?\n\n04:14.110 --> 04:17.050\nहम इस सवाल का जवाब अगले हिस्से में देंगे।\n"}, {"id": "lesson-4/04", "title": "कौन जिम्मेदार है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-04.mp4", "vtt": "WEBVTT\n\n00:00.740 --> 00:02.940\nठीक है, तो आइए इस सवाल पर नज़र डालते हैं।\n\n00:03.300 --> 00:05.140\nजब गलतियाँ होती हैं, तो ज़िम्मेदार कौन\n\n00:05.140 --> 00:06.160\nहै, एआई या इंसान?\n\n00:07.280 --> 00:08.980\nअगर आपने इस सवाल के बारे में सोचने का\n\n00:08.980 --> 00:10.620\nमौका नहीं लिया है, तो जल्दी से वीडियो को\n\n00:10.620 --> 00:12.900\nरोकें और कुछ सेकंड के लिए इस पर विचार करें।\n\n00:14.830 --> 00:17.250\nठीक है, तो सबसे महत्वपूर्ण बातों में से\n\n00:17.250 --> 00:19.630\nएक जो हम चाहते हैं कि आप इन एआई सिस्टम्स\n\n00:19.630 --> 00:22.030\nके बारे में समझें, वह यह है कि ये सिर्फ\n\n00:22.030 --> 00:22.810\nउपकरण हैं।\n\n00:23.590 --> 00:25.710\nआखिरकार, ज़िम्मेदारी इंसानों की ही होती है।\n\n00:26.110 --> 00:28.170\nएआई टूल्स को उनके कार्यों के परिणामों की\n\n00:28.170 --> 00:29.150\nकोई परवाह नहीं होती।\n\n00:29.540 --> 00:31.780\nजैसा कि हमने देखा है, इसके पीछे बहुत\n\n00:31.780 --> 00:32.480\nसारा गणित है।\n\n00:33.140 --> 00:35.100\nयह अपने इनपुट और आउटपुट के बीच पैटर्न\n\n00:35.100 --> 00:37.420\nखोजने की कोशिश करता है, वह भी एक गणितीय\n\n00:37.420 --> 00:40.100\nसमीकरण के ज़रिए, इसलिए इसमें कोई भावनाएँ\n\n00:40.100 --> 00:42.140\nया एहसास शामिल नहीं होते। और जैसा कि\n\n00:42.140 --> 00:44.800\nहमने देखा है, इन एआई टूल्स का इस्तेमाल\n\n00:44.800 --> 00:47.380\nझूठी गिरफ्तारी कराने, किसी का गलत निदान\n\n00:47.380 --> 00:49.780\nकरने, यहाँ तक कि घातक दुर्घटनाएँ कराने\n\n00:49.780 --> 00:50.740\nके लिए भी किया गया है।\n\n00:51.440 --> 00:53.700\nऔर इसका कारण यह है कि यह सिर्फ एक उपकरण\n\n00:53.700 --> 00:55.780\nहै, इसलिए जो लोग इसे बनाते और इस्तेमाल\n\n00:55.780 --> 00:58.340\nकरते हैं, वे ही अंततः इसके परिणामों के\n\n00:58.340 --> 00:59.320\nलिए ज़िम्मेदार होते हैं।\n\n01:00.400 --> 01:02.700\nतो अब जब हम समझ चुके हैं कि इंसान इस\n\n01:02.700 --> 01:05.020\nप्रक्रिया के केंद्र में हैं, तो ऐसे कौन\n\n01:05.020 --> 01:07.700\nसे तरीके हैं जिनसे हम इन एआई की गलतियों\n\n01:07.700 --> 01:09.620\nसे होने वाले नुकसान को कम कर सकते हैं?\n\n01:10.300 --> 01:12.000\nतो वीडियो को रोकें और इस बारे में कुछ\n\n01:12.000 --> 01:12.760\nसेकंड के लिए सोचें।\n\n01:14.720 --> 01:16.960\nहम इसे इंसानों की दो भूमिकाओं के नजरिए\n\n01:16.960 --> 01:19.200\nसे देख सकते हैं और यह समझ सकते हैं कि वे\n\n01:19.200 --> 01:21.680\nइन नुकसानों को कैसे कम कर सकते हैं—एक\n\n01:21.680 --> 01:23.720\nनिर्माता के दृष्टिकोण से और एक\n\n01:23.720 --> 01:26.500\nउपयोगकर्ता के दृष्टिकोण से। अब, इन एआई\n\n01:26.500 --> 01:28.740\nटूल्स के निर्माता के रूप में, यह जरूरी\n\n01:28.740 --> 01:31.180\nहै कि आप पक्षपात को अपनी पूरी क्षमता से\n\n01:31.180 --> 01:33.720\nकम करने के लिए उच्च गुणवत्ता और विविधता\n\n01:33.720 --> 01:35.040\nवाले डेटा का समावेश करें।\n\n01:35.140 --> 01:37.740\nलेकिन याद रखें, सभी इंसान पक्षपाती होते\n\n01:37.740 --> 01:39.840\nहैं क्योंकि हम सभी चीजों को अलग-अलग\n\n01:39.840 --> 01:42.180\nनजरिए से देखते हैं, इसलिए दूसरों के\n\n01:42.180 --> 01:45.040\nअलग-अलग नजरिए को सुनना और अपने एआई टूल्स\n\n01:45.040 --> 01:47.220\nकी सीमाओं के बारे में ईमानदार रहना बहुत\n\n01:47.220 --> 01:47.660\nजरूरी है।\n\n01:48.600 --> 01:51.080\nअब, अगर आप इन एआई टूल्स के उपयोगकर्ता\n\n01:51.080 --> 01:53.620\nहैं, तो यह हमेशा जरूरी है कि जब भी आपके\n\n01:53.620 --> 01:56.080\nनिर्णय में कोई जोखिम शामिल हो, तो आप एआई\n\n01:56.080 --> 01:58.440\nटूल के परिणामों की दोबारा जांच करें, और\n\n01:58.440 --> 02:00.280\nइन एआई टूल्स को बेहतर बनाने के लिए\n\n02:00.280 --> 02:02.400\nनिर्माताओं को फीडबैक देना न भूलें। तो अब\n\n02:02.400 --> 02:04.220\nआइए इस अभ्यास पर थोड़ा काम करते हैं कि\n\n02:04.220 --> 02:06.240\nहम अपने भालू और कुत्ते के वर्गीकरणकर्ता\n\n02:06.240 --> 02:08.480\nको कैसे बेहतर बना सकते हैं। तो काले और\n\n02:08.480 --> 02:10.920\nसफेद रंग की विशेषताओं के अलावा, जिनके\n\n02:10.920 --> 02:13.280\nबारे में हमने बात की थी—जहाँ हमने काले\n\n02:13.280 --> 02:15.260\nभालुओं और सफेद कुत्तों की चर्चा की\n\n02:15.260 --> 02:17.900\nथी—ऐसी और कौन सी विशेषताएँ और उन\n\n02:17.900 --> 02:20.200\nविशेषताओं के कौन-कौन से रूपांतर हमारे\n\n02:20.200 --> 02:22.660\nवर्गीकरणकर्ता को बेहतर बनाने में मदद कर सकते हैं?\n\n02:23.470 --> 02:23.690\nठीक है।\n\n02:23.850 --> 02:26.050\nतो वीडियो को रोकें और एक मिनट के लिए इस\n\n02:26.050 --> 02:28.270\nबारे में सोचें, और देखें कि हमें और\n\n02:28.270 --> 02:30.590\nकौन-कौन सी विशेषताएँ और उन विशेषताओं की\n\n02:30.590 --> 02:32.250\nविविधता पर भी विचार करना चाहिए।\n\n02:35.420 --> 02:35.660\nठीक है।\n\n02:36.380 --> 02:38.200\nतो ऐसी बहुत सारी बातें हैं जिनके बारे\n\n02:38.200 --> 02:40.140\nमें हम सोच सकते हैं कि हम अपने एआई\n\n02:40.140 --> 02:42.360\nमॉडल्स में पक्षपात कैसे कम कर सकते हैं\n\n02:42.360 --> 02:44.500\nऔर उसमें और अधिक दृष्टिकोण कैसे जोड़ सकते हैं।\n\n02:44.910 --> 02:47.130\nलेकिन, जैसा कि आपने देखा है, हमारे पास\n\n02:47.130 --> 02:49.050\nभालुओं और कुत्तों की एक सीमा है।\n\n02:49.400 --> 02:51.480\nतो, आप जानते हैं, सिर्फ अलग-अलग प्रकार\n\n02:51.480 --> 02:53.400\nके भालुओं, अलग-अलग प्रकार के कुत्तों पर\n\n02:53.400 --> 02:55.920\nविचार करना, यह तय करना कि वे भालू और\n\n02:55.920 --> 02:59.220\nकुत्ते अपने शावक या वयस्क रूप में हैं या\n\n02:59.220 --> 03:01.720\nनहीं, वे किस तरह के वातावरण में हैं, और\n\n03:01.720 --> 03:04.080\nखासकर उनके अलग-अलग आकार भी, और सोचने के\n\n03:04.080 --> 03:05.740\nलिए बहुत सारी बातें हैं, लेकिन ये कुछ\n\n03:05.740 --> 03:07.460\nचीजें हैं जिन पर आप विचार कर सकते हैं।\n"}, {"id": "lesson-4/05", "title": "डेटा गोपनीयता", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-05.mp4", "vtt": "WEBVTT\n\n00:01.000 --> 00:02.920\nठीक है, तो हम समझते हैं कि विविध डेटा\n\n00:02.920 --> 00:05.020\nमहत्वपूर्ण है, लेकिन सिर्फ इसलिए कि हम\n\n00:05.020 --> 00:07.460\nडेटा इकट्ठा कर सकते हैं, क्या हमें करना चाहिए?\n\n00:08.370 --> 00:10.570\nअब, डेटा कहीं से भी आ सकता है, ठीक वैसे\n\n00:10.570 --> 00:12.430\nही जैसे हम कई जगहों पर फोटो ले सकते हैं।\n\n00:12.830 --> 00:15.310\nतो उदाहरण के लिए, इस पार्क की तस्वीर में\n\n00:15.310 --> 00:17.310\nहमारे पास इंसानों और कुत्तों की फोटो\n\n00:17.310 --> 00:20.090\nहैं, और ये ऐसे संभावित डेटा हैं जिन्हें\n\n00:20.090 --> 00:22.970\nहम अपने एआई मॉडल में जोड़ सकते हैं।\n\n00:22.970 --> 00:25.510\nहालांकि, हर डेटा उपयोग के लिए उपलब्ध\n\n00:25.510 --> 00:28.030\nनहीं होता, और इसलिए हम इसे दो तरह से देख\n\n00:28.030 --> 00:30.730\nसकते हैं: सार्वजनिक बनाम निजी डेटा।\n\n00:31.450 --> 00:33.990\nतो सार्वजनिक डेटा वह जानकारी है जिसे कोई\n\n00:33.990 --> 00:36.590\nभी देख सकता है, लेकिन इसके उपयोग के लिए\n\n00:36.590 --> 00:37.730\nकुछ नियम हो सकते हैं।\n\n00:38.540 --> 00:40.980\nअब, निजी डेटा वह जानकारी है जो किसी\n\n00:40.980 --> 00:43.400\nव्यक्ति की पहचान कर सकती है या उसके बारे\n\n00:43.400 --> 00:45.840\nमें कुछ व्यक्तिगत साझा कर सकती है, और\n\n00:45.840 --> 00:48.300\nइसका उपयोग या देखना हमेशा अनुमति के बिना\n\n00:48.300 --> 00:49.000\nसंभव नहीं है।\n\n00:50.400 --> 00:52.860\nतो निजी डेटा के कुछ उदाहरण हो सकते हैं,\n\n00:52.860 --> 00:56.040\nजैसे आपका चेहरा, आपके ईमेल और फोन नंबर,\n\n00:56.040 --> 00:58.740\nआपकी स्वास्थ्य या मेडिकल जानकारी, नाम या\n\n00:58.740 --> 01:01.760\nहस्ताक्षर, वित्तीय जानकारी, और यहां तक\n\n01:01.760 --> 01:03.460\nकि आपका घर का पता भी।\n\n01:03.850 --> 01:05.730\nइन सभी जानकारियों से आपके बारे में\n\n01:05.730 --> 01:07.030\nव्यक्तिगत डेटा मिल सकता है।\n\n01:07.380 --> 01:09.040\nतो मैं चाहता हूँ कि आप इस सवाल के बारे\n\n01:09.040 --> 01:11.560\nमें सोचें: अगर कोई एआई टूल आपकी\n\n01:11.560 --> 01:13.700\nव्यक्तिगत तस्वीरों पर बिना आपकी अनुमति\n\n01:13.700 --> 01:15.380\nके प्रशिक्षित किया जाए तो क्या होगा?\n\n01:15.380 --> 01:17.580\nइससे आपको कैसा महसूस होगा?\n\n01:17.930 --> 01:19.650\nतो इस वीडियो को रोकें और कुछ सेकंड के\n\n01:19.650 --> 01:20.650\nलिए इस बारे में सोचें।\n\n01:23.820 --> 01:25.920\nठीक है, तो शायद आप कई तरह की भावनाएँ\n\n01:25.920 --> 01:26.860\nमहसूस कर रहे हों।\n\n01:27.290 --> 01:29.770\nशायद आपको निजता के उल्लंघन पर शर्मिंदगी\n\n01:29.770 --> 01:32.670\nया गुस्सा महसूस हो। सबसे महत्वपूर्ण बात\n\n01:32.670 --> 01:35.830\nयह है कि चाहे आपकी कोई भी भावना हो, आपको\n\n01:35.830 --> 01:37.790\nअपनी निजता का अधिकार है और अपने\n\n01:37.790 --> 01:40.830\nव्यक्तिगत डेटा पर नियंत्रण रखने का भी।\n\n01:40.830 --> 01:43.330\nरचनाकारों को यह स्पष्ट होना चाहिए कि वे\n\n01:43.330 --> 01:45.890\nकौन सा डेटा एकत्र करते हैं और आपके मना\n\n01:45.890 --> 01:48.290\nकरने पर आपके फैसले का सम्मान करना चाहिए।\n\n01:48.950 --> 01:51.350\nतो मान लीजिए कि आपके पास अलग-अलग प्रकार\n\n01:51.350 --> 01:52.210\nका निजी डेटा है।\n\n01:52.500 --> 01:54.580\nआप उन्हें अपना चेहरा दिखा सकते हैं, पर\n\n01:54.580 --> 01:56.980\nवित्तीय जानकारी नहीं। कई बार क्रिएटर्स\n\n01:56.980 --> 01:59.140\nने डेटा का दुरुपयोग किया है और परिणाम\n\n01:59.140 --> 02:01.900\nभुगते हैं। अल्वा एलबम नामक कंपनी पर बिना\n\n02:01.900 --> 02:04.220\nअनुमति लोगों की तस्वीरों से एआई मॉडल\n\n02:04.220 --> 02:06.800\nट्रेन करने का आरोप लगा था, जिसके बाद\n\n02:06.800 --> 02:09.740\nअमेरिकी सरकार ने उन्हें डेटा और एआई मॉडल\n\n02:09.740 --> 02:10.960\nहटाने का आदेश दिया।\n\n02:13.090 --> 02:15.290\nतो अब जब हम इसे समझ चुके हैं, तो मैं\n\n02:15.290 --> 02:17.730\nआपसे यह सवाल पूछना चाहता हूँ: इन एआई\n\n02:17.730 --> 02:20.030\nटूल्स को बनाते और इस्तेमाल करते समय हम\n\n02:20.030 --> 02:22.030\nगोपनीयता की सुरक्षा कैसे कर सकते हैं?\n\n02:22.880 --> 02:24.900\nइस वीडियो को रोकें और कुछ सेकंड के लिए\n\n02:24.900 --> 02:25.740\nइस बारे में सोचें।\n\n02:29.080 --> 02:31.440\nठीक है, तो हम इसे दो भूमिकाओं के नजरिए\n\n02:31.440 --> 02:34.000\nसे देख सकते हैं—एक निर्माता के दृष्टिकोण\n\n02:34.000 --> 02:37.000\nसे और एक उपयोगकर्ता के दृष्टिकोण से। अब,\n\n02:37.000 --> 02:39.120\nएक निर्माता के रूप में, आपको हमेशा\n\n02:39.120 --> 02:41.180\nव्यक्तिगत डेटा का उपयोग करने से पहले\n\n02:41.180 --> 02:42.040\nअनुमति लेनी चाहिए।\n\n02:42.480 --> 02:44.840\nआपको यह स्पष्ट करना चाहिए कि इसका उपयोग\n\n02:44.840 --> 02:47.360\nकैसे किया जा रहा है और किसी भी अनावश्यक\n\n02:47.360 --> 02:49.400\nव्यक्तिगत जानकारी को हटा देना चाहिए।\n\n02:50.120 --> 02:53.440\nअब, एक उपयोगकर्ता के दृष्टिकोण से, आपको\n\n02:53.440 --> 02:56.080\nयह पढ़ना चाहिए कि आपकी व्यक्तिगत जानकारी\n\n02:56.080 --> 02:58.620\nका उपयोग कैसे किया जा रहा है, और आपको यह\n\n02:58.620 --> 03:00.780\nपूछना चाहिए कि आपके डेटा का उपयोग किस\n\n03:00.780 --> 03:02.620\nतरह से हो रहा है। आपको अपनी व्यक्तिगत\n\n03:02.620 --> 03:05.160\nजानकारी पर अधिकार है और आप ना कह सकते\n\n03:05.160 --> 03:07.060\nहैं या यह सीमित कर सकते हैं कि क्या साझा\n\n03:07.060 --> 03:09.120\nकिया जाए। ठीक है, तो चलिए यह अभ्यास करते\n\n03:09.120 --> 03:10.680\nहैं कि हम अपने भालू और कुत्ते के\n\n03:10.680 --> 03:13.020\nवर्गीकरण टूल में गोपनीयता की सुरक्षा\n\n03:13.020 --> 03:14.900\nकैसे कर सकते हैं। तो मान लीजिए कि हमारे\n\n03:14.900 --> 03:17.060\nपास यह फोटो है और हम इसे अपने\n\n03:17.060 --> 03:19.300\nभालू-कुत्ता वर्गीकरण टूल में इस कुत्ते\n\n03:19.300 --> 03:20.240\nके लिए जोड़ना चाहते हैं।\n\n03:20.400 --> 03:22.520\nआप कैसे सुनिश्चित करेंगे कि इस फोटो में\n\n03:22.520 --> 03:24.840\nगोपनीयता का सम्मान किया गया है, इससे\n\n03:24.840 --> 03:27.220\nपहले कि आप इसे हमारे भालू बनाम कुत्ता\n\n03:27.220 --> 03:29.160\nवर्गीकरण टूल में इस्तेमाल करें?\n\n03:29.160 --> 03:31.380\nऔर एक बात ध्यान देने वाली है, इस फोटो\n\n03:31.380 --> 03:33.560\nमें जो कुत्ता है, वह किसी का पालतू नहीं\n\n03:33.560 --> 03:35.220\nहै। ठीक है, तो वीडियो को रोकें और इस\n\n03:35.220 --> 03:36.400\nबारे में कुछ सेकंड के लिए सोचें।\n\n03:39.180 --> 03:41.740\nठीक है, तो बात यह है कि, हमें इस फोटो के\n\n03:41.740 --> 03:43.340\nअंदर कुछ निजी डेटा मिले हैं।\n\n03:43.680 --> 03:45.900\nहमारे पास इस व्यक्ति का घर का पता, उनकी\n\n03:45.900 --> 03:47.780\nकार का लाइसेंस और उस व्यक्ति का चेहरा\n\n03:47.780 --> 03:48.220\nइसमें है।\n\n03:49.130 --> 03:51.190\nतो मान लीजिए कि हम फोटो को वैसे ही\n\n03:51.190 --> 03:53.230\nइस्तेमाल करना चाहते हैं जैसे वह है। ऐसे\n\n03:53.230 --> 03:55.510\nमामलों में, हमें हमेशा अनुमति लेनी चाहिए।\n\n03:56.280 --> 03:59.160\nअब बात यह है कि, जब हमारे पास यह फोटो आ\n\n03:59.170 --> 04:01.460\nही गई है, तो दूसरी बात यह है कि उसमें से\n\n04:01.460 --> 04:03.780\nवह सारा निजी डेटा हटा दें जिसकी जरूरत\n\n04:03.780 --> 04:04.190\nनहीं है।\n\n04:04.530 --> 04:06.530\nहमारे भालू और कुत्ते के क्लासिफायर के\n\n04:06.530 --> 04:08.930\nबारे में बात यह है कि हमें सिर्फ कुत्ते\n\n04:08.930 --> 04:11.290\nकी परवाह है, तो यह व्यक्ति की गोपनीयता\n\n04:11.290 --> 04:13.890\nकी रक्षा करने का एक तरीका है—सारा डेटा\n\n04:13.890 --> 04:16.270\nहटा देना, और अगर आप पूरी तस्वीर को नहीं\n\n04:16.270 --> 04:18.770\nकाटना चाहते, तो आप निजी जानकारी को ब्लर\n\n04:18.770 --> 04:19.530\nभी कर सकते हैं।\n"}, {"id": "lesson-4/06", "title": "जिम्मेदार एआई", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-06.mp4", "vtt": "WEBVTT\n\n00:00.700 --> 00:03.080\nठीक है, तो हमने डेटा पक्षपात और डेटा\n\n00:03.080 --> 00:05.200\nगोपनीयता के विचार के बारे में बात की थी\n\n00:05.200 --> 00:07.600\nऔर यह कि आखिरकार, इन चीज़ों के लिए इंसान\n\n00:07.600 --> 00:08.480\nही ज़िम्मेदार होते हैं।\n\n00:09.240 --> 00:11.120\nइसे ही हम जिम्मेदार एआई कहते हैं।\n\n00:11.820 --> 00:13.960\nयह सुनिश्चित करने के बारे में है कि लोग\n\n00:13.960 --> 00:16.320\nइन एआई टूल्स के जिम्मेदार निर्माता और\n\n00:16.320 --> 00:17.840\nविवेकपूर्ण उपयोगकर्ता बनें।\n\n00:18.700 --> 00:21.100\nऔर सबसे महत्वपूर्ण बात जो मैं चाहता हूँ\n\n00:21.100 --> 00:24.060\nकि आप याद रखें, वह यह है कि हम में से हर\n\n00:24.060 --> 00:26.820\nकोई यह तय करने में भूमिका निभाता है कि\n\n00:26.820 --> 00:29.340\nएआई टूल्स कैसे बनाए और इस्तेमाल किए\n\n00:29.340 --> 00:32.500\nजाएं। याद रखिए, और यह सिर्फ एआई तक सीमित\n\n00:32.500 --> 00:34.820\nनहीं है, बल्कि तकनीक के लिए भी लागू होता\n\n00:34.820 --> 00:37.340\nहै, कि तकनीक वास्तव में इंसानी फैसलों का\n\n00:37.340 --> 00:38.340\nही नतीजा होती है।\n"}, {"id": "lesson-4/07", "title": "पुनरावलोकन क्विज़", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=hi"}, {"id": "lesson-4/08", "title": "प्रोजेक्ट का समय", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-4-08.mp4", "vtt": "WEBVTT\n\n00:00.500 --> 00:02.500\nठीक है, तो अब समय है प्रोजेक्ट का, पाठ\n\n00:02.500 --> 00:04.680\nसंख्या चार के लिए, जो हमारा आखिरी पाठ है।\n\n00:05.630 --> 00:07.870\nतो अब मैं चाहता हूँ कि आप अपना दृष्टिकोण\n\n00:07.870 --> 00:08.570\nऔर व्यापक करें।\n\n00:09.250 --> 00:11.750\nअब उन विशेषताओं पर गौर करें जो आपने पाठ\n\n00:11.750 --> 00:13.930\nतीन में समूहों में अंतर करने हेतु\n\n00:13.930 --> 00:16.330\nइस्तेमाल की थीं। देखें कि आप उनमें\n\n00:16.330 --> 00:19.390\nविविधता कैसे जोड़ सकते हैं, अन्य पहलुओं\n\n00:19.390 --> 00:21.670\nको खोज सकते हैं, या फीडबैक से पक्षपात\n\n00:21.670 --> 00:23.630\nकैसे कम कर सकते हैं। कोई भी\n\n00:23.630 --> 00:25.750\nवर्गीकरणकर्ता सटीक नहीं होता। इसके\n\n00:25.750 --> 00:27.950\nपक्षपात और उसे कम करने के तरीके बताएं।\n\n00:27.950 --> 00:28.890\nयह आखिरी पाठ है।\n\n00:29.350 --> 00:29.790\nबधाई हो।\n\n00:30.650 --> 00:32.850\nअब आप अपना पाठ चार का प्रश्न हल करेंगे,\n\n00:32.850 --> 00:34.750\nऔर अगर आप जल्दी खत्म कर लेते हैं और आपके\n\n00:34.750 --> 00:36.650\nशिक्षक अनुमति देते हैं, तो आप अपने\n\n00:36.650 --> 00:38.650\nवर्गीकरणकर्ता पर काम जारी रख सकते हैं।\n\n00:39.960 --> 00:41.920\nठीक है, तो यह हमारा आखिरी सवाल\n\n00:41.920 --> 00:45.200\nहै—जिम्मेदार एआई बनाना। आप अपने फीचर्स\n\n00:45.200 --> 00:47.100\nमें और विविधता जोड़ने के लिए क्या कर\n\n00:47.100 --> 00:49.020\nसकते हैं ताकि पक्षपात कम हो सके?\n\n00:50.060 --> 00:51.680\nऔर यह है जो छात्र ने उत्तर दिया।\n\n00:52.300 --> 00:54.540\n\"मैं फलों की तस्वीरें अलग-अलग जगहों से\n\n00:54.540 --> 00:56.820\nलूंगा, ताकि एआई केवल एक ही जगह से\n\n00:56.820 --> 00:59.140\nविश्लेषण न करे, और मैं अपने दोस्तों से\n\n00:59.150 --> 01:01.560\nभी पूछूंगा कि क्या यह उनके लिए भी अच्छी\n\n01:01.560 --> 01:03.840\nतरह काम करता है। और अगर मैं किसी का\n\n01:03.840 --> 01:05.800\nचेहरा या कोई निजी चीज़ इस्तेमाल करता\n\n01:05.800 --> 01:08.210\nहूँ, तो मैं पहले अनुमति लूंगा।\" तो याद\n\n01:08.210 --> 01:10.280\nरखें, एक बार फिर, निजी जानकारी की बात पर\n\n01:10.280 --> 01:12.500\nलौटते हैं। अगर आप कुछ भी ऐसा इस्तेमाल\n\n01:12.500 --> 01:14.580\nकरते हैं जिसमें कोई व्यक्तिगत जानकारी\n\n01:14.580 --> 01:17.240\nहो, तो पहले अनुमति लेना सुनिश्चित करें।\n"}, {"id": "lesson-4/09", "title": "वर्कशीट", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=4&lang=hi"}]}, {"id": "resources", "kicker": "शिक्षकों और विद्यार्थियों के लिए", "title": "संसाधन", "items": [{"id": "resources/1", "title": "शिक्षक गाइड", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1qkSTZovHUN-MzG445qzpi3OZpBZQfwUECmTWqXRkMOY/preview", "size": 118924}, {"id": "resources/2", "title": "वर्कशीट", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/11gpyDNlKemB7qVkz5zn2UMH2TBAktnfn1P4         html += '<li><a class="' + cls + '" href="#/' + esc(item.id) + '"' + (current === item ? ' aria-current="page"' : '') + '>' +
          '<span class="status">' + icon('check') + '</span>' +
          '<span class="it-title">' + esc(item.title) + (done[item.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
          '<span class="it-kind" title="' + esc(kindText(item.kind)) + '">' + icon(item.kind) + '</span></a></li>';
      });
      html += '</ol></div>';
    });
    html += appSettingsLink('side-link app-settings');
    html += '<div class="side-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</div>';
    sideContent.innerHTML = html;
  }
  sideContent.addEventListener('click', function (e) {
    var head = e.target.closest('.group-head');
    if (!head) return;
    var id = head.getAttribute('data-section');
    expanded[id] = !expanded[id];
    head.setAttribute('aria-expanded', String(expanded[id]));
  });
  function scrollCurrentIntoView() {
    var el = sideContent.querySelector('.it.current');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Mobile drawer ----------
  function openMenu() {
    sidebar.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true');
    scrollCurrentIntoView();
  }
  function closeMenu() {
    sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  scrim.addEventListener('click', closeMenu);

  // ---------- Views ----------
  function firstOpenItem(list) {
    for (var i = 0; i < list.length; i++) if (!done[list[i].id]) return list[i];
    return list[0];
  }

  function renderHome() {
    var total = items.length, n = countDone(items);
    var resume = byId[state.last] || null;
    var primary = n === total ? null : (resume && !done[resume.id] ? resume : firstOpenItem(items));
    var html = '<div class="home"><section class="hero">' +
      '<span class="kicker">' + esc(t('brand')) + '</span>' +
      '<h1 tabindex="-1">' + esc(COURSE.courseName) + '</h1>' +
      '<p>' + esc(n === total ? t('heroFinished') : t('heroText')) + '</p>' +
      '<div class="hero-progress">' + esc(t('activitiesDone', { done: n, total: total })) +
      '<div class="bar"><span style="width:' + (100 * n / total) + '%"></span></div></div>' +
      '<div class="hero-actions">' +
      (primary
        ? '<a class="btn" href="#/' + esc(primary.id) + '">' + icon('play') + '<span>' +
          esc(n === 0 ? t('startCourse') : t('continue', { title: primary.title })) + '</span></a>'
        : '') +
      '<button class="btn secondary" type="button" data-open-np><span class="np-icon" aria-hidden="true"></span>' + esc(t('openNeuroPocket')) + '</button>' +
      '</div></section>' +
      '<h2 class="section-title">' + esc(t('lessons')) + '</h2><div class="cards">';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), len = section.items.length;
      var tag = sd === len ? '<span class="tag done">' + esc(t('tagDone')) + '</span>'
        : sd ? '<span class="tag progress">' + esc(t('tagInProgress')) + '</span>'
        : '<span class="tag">' + esc(t('activities', { total: len })) + '</span>';
      html += '<a class="card" href="#/' + esc(firstOpenItem(section.items).id) + '">' + tag +
        '<span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span>' +
        '<span class="card-meta">' + esc(t('sectionDone', { done: sd, total: len })) +
        '<span class="bar"><span style="width:' + (100 * sd / len) + '%"></span></span></span></a>';
    });
    html += '</div><p class="home-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</p>' +
      appSettingsLink('chip-btn home-settings') + '</div>';
    return html;
  }

  var pdfInline = navigator.pdfViewerEnabled === true ||
    (navigator.pdfViewerEnabled === undefined && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent));

  function renderItem(item) {
    var section = item.section;
    var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
