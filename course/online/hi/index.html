  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

ाँ से शुरू करें", "title": "परिचय", "items": [{"id": "intro/01", "title": "कोर्स में आपका स्वागत है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-intro-01.mp4", "vtt": "WEBVTT\n\n00:00.340 --> 00:03.480\nLearnAIAnywhere.org के इस 'आर्टिफिशियल\n\n00:03.480 --> 00:05.720\nइंटेलिजेंस परिचय' कोर्स में आपका स्वागत\n\n00:05.720 --> 00:09.100\nहै। हम एक वैश्विक समुदाय हैं और एआई\n\n00:09.100 --> 00:11.700\nसाक्षरता को हर जगह सुलभ बनाने के लिए\n\n00:11.700 --> 00:14.780\nउत्साहित हैं। अक्सर एआई को इंसानों बनाम\n\n00:14.780 --> 00:17.680\nमशीनों की जंग बताया जाता है, लेकिन सच यह\n\n00:17.680 --> 00:20.560\nहै कि एआई सिर्फ मानवीय विकल्पों का ही\n\n00:20.560 --> 00:21.180\nनतीजा है।\n\n00:21.730 --> 00:24.250\nऔर मशीनों के विपरीत, हम इंसान यह चुनते\n\n00:24.250 --> 00:26.730\nहैं कि हमें किस बात की परवाह है, जैसे\n\n00:26.730 --> 00:28.810\nहमारे मूल्य और हमारी समुदायें। हमारे\n\n00:28.810 --> 00:30.410\nकोर्स का उद्देश्य है कि हम अपने\n\n00:30.410 --> 00:32.790\nशिक्षार्थियों को वह ज्ञान और विवेक दें,\n\n00:32.790 --> 00:34.910\nजिससे वे इन एआई टूल्स के जिम्मेदार\n\n00:34.910 --> 00:37.230\nनिर्माता और आलोचनात्मक उपयोगकर्ता बन\n\n00:37.230 --> 00:39.130\nसकें। आप सीखेंगे कि आर्टिफिशियल\n\n00:39.130 --> 00:41.310\nइंटेलिजेंस वास्तव में क्या है, मशीन\n\n00:41.310 --> 00:43.370\nलर्निंग के मुख्य हिस्से कौन से हैं, मशीन\n\n00:43.370 --> 00:45.730\nलर्निंग कैसे काम करती है, और जिम्मेदार\n\n00:45.730 --> 00:47.190\nएआई के पीछे के विचार क्या हैं।\n\n00:47.640 --> 00:50.040\nआप मिरर पॉकेट के जरिए अपना एआई\n\n00:50.040 --> 00:52.920\nक्लासिफायर डिजाइन करके सीखेंगे कि आधुनिक\n\n00:52.920 --> 00:55.720\nएआई टूल्स कैसे काम करते हैं। हम चार\n\n00:55.720 --> 00:58.560\nचरणों में आपका मार्गदर्शन करेंगे। अंत\n\n00:58.560 --> 01:01.700\nतक, आप अपना क्लासिफायर बना लेंगे और एआई\n\n01:01.700 --> 01:04.520\nकी गहरी समझ विकसित कर लेंगे, ताकि आप\n\n01:04.520 --> 01:06.500\nअपने प्रोजेक्ट पेश करने के लिए तैयार हों।\n\n01:06.820 --> 01:09.000\nआपका यहाँ स्वागत है, यह तय करने में कि\n\n01:09.000 --> 01:11.100\nएआई हमारे संसार में कैसे बनता और\n\n01:11.100 --> 01:11.840\nइस्तेमाल होता है।\n\n01:12.100 --> 01:13.200\nहम कक्षा में आपसे मिलेंगे।\n"}, {"id": "intro/02", "title": "पूर्वापेक्षा", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-intro-02.mp4", "vtt": "WEBVTT\n\n00:00.680 --> 00:02.280\nठीक है, क्लास में आपका स्वागत है।\n\n00:03.060 --> 00:04.820\nतो आपको दो चीज़ों की ज़रूरत होगी।\n\n00:05.630 --> 00:08.010\nपहली चीज़ यह है कि आपके पास एक वेबकैम\n\n00:08.010 --> 00:09.170\nवाला डिवाइस होना चाहिए।\n\n00:10.230 --> 00:12.610\nऔर यह डिवाइस लैपटॉप, टैबलेट या फोन हो\n\n00:12.610 --> 00:15.250\nसकता है। ज़रूरी बात यह है कि इसमें\n\n00:15.250 --> 00:16.930\nवेबकैम हो क्योंकि हम इसका इस्तेमाल\n\n00:16.930 --> 00:18.210\nतस्वीरें लेने के लिए करेंगे।\n\n00:19.170 --> 00:21.570\nऔर हम जिस ऐप का इस्तेमाल करेंगे उसका नाम\n\n00:21.570 --> 00:24.370\nन्यूरोपॉकेट है, और हम इसका इस्तेमाल अपना\n\n00:24.370 --> 00:26.570\nइमेज क्लासिफायर डिज़ाइन करने के लिए करेंगे।\n\n00:27.340 --> 00:29.620\nतो आप इसे ऑनलाइन एक्सेस कर सकते हैं, या\n\n00:29.620 --> 00:32.180\nयदि आप इसे ऑफलाइन एक्सेस करना चाहते हैं,\n\n00:32.180 --> 00:34.360\nतो विंडोज और एंड्रॉइड डिवाइस के लिए ऐप\n\n00:34.360 --> 00:34.940\nउपलब्ध हैं।\n\n00:35.590 --> 00:37.530\nतो अगर आप आईफोन इस्तेमाल कर रहे हैं, तो\n\n00:37.530 --> 00:39.250\nआपको इसके बजाय वेबसाइट के ज़रिए इसे\n\n00:39.250 --> 00:40.170\nएक्सेस करना होगा।\n\n00:41.380 --> 00:43.060\nदूसरी चीज़ यह है कि हमारे पास एक\n\n00:43.060 --> 00:44.740\nवैकल्पिक प्रोजेक्ट वर्कशीट है।\n\n00:45.040 --> 00:47.460\nऔर यह प्रोजेक्ट वर्कशीट हमें हर लेसन के\n\n00:47.460 --> 00:49.980\nसाथ अपना एआई क्लासिफायर डिज़ाइन करने में\n\n00:49.980 --> 00:50.640\nगाइड करेगी।\n\n00:51.570 --> 00:53.750\nऔर ज़ाहिर है, अगर आप इसे प्रिंट नहीं\n\n00:53.750 --> 00:56.000\nकरना चाहते हैं, तो आप बस एक सादे कागज़\n\n00:56.000 --> 00:57.770\nका इस्तेमाल कर सकते हैं, और यह वही काम\n\n00:57.770 --> 00:59.530\nकरेगा क्योंकि सवाल बहुत लंबे नहीं हैं।\n\n01:00.620 --> 01:02.680\nठीक है, तो प्री-रिक्विज़िट्स के लिए बस\n\n01:02.680 --> 01:04.340\nइतना ही चाहिए, तो मैं आपसे अगले वीडियो\n\n01:04.340 --> 01:04.780\nमें मिलूँगा।\n"}, {"id": "intro/03", "title": "प्रतीक कुंजी", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-intro-03.mp4", "vtt": "WEBVTT\n\n00:00.600 --> 00:03.120\nठीक है। learn anywhere dot org के\n\n00:03.120 --> 00:05.040\nआर्टिफिशियल इंटेलिजेंस के इस परिचय में\n\n00:05.040 --> 00:05.840\nआपका स्वागत है।\n\n00:06.620 --> 00:08.800\nतो सभी पाठों को शुरू करने से पहले, आप\n\n00:08.800 --> 00:10.600\nनीचे बाएं कोने में कुछ प्रतीकों को\n\n00:10.600 --> 00:11.030\nदेखेंगे।\n\n00:11.930 --> 00:13.950\nयदि आप एक किताब देखते हैं, तो यह बस एक\n\n00:13.950 --> 00:15.830\nप्रतीक है कि हम कुछ सिखाने जा रहे हैं।\n\n00:16.200 --> 00:18.180\nयदि आप किसी को दौड़ते हुए देखते हैं, तो\n\n00:18.180 --> 00:19.900\nइसका मतलब है कि हम कुछ इंटरैक्टिव\n\n00:19.900 --> 00:21.880\nकरेंगे, जैसे कोई खेल या व्यावहारिक\n\n00:21.880 --> 00:22.360\nअभ्यास।\n\n00:22.720 --> 00:24.920\nऔर यदि आप एक बादल देखते हैं, तो इसका\n\n00:24.920 --> 00:27.340\nमतलब है कि हमें जो कुछ भी सीखा है उस पर\n\n00:27.340 --> 00:28.860\nविचार करने का अवसर मिलेगा।\n\n00:29.170 --> 00:31.010\nठीक है, मैं आप सभी से अगले वीडियो में मिलूँगा।\n"}]}, {"id": "lesson-1", "kicker": "पाठ 1", "title": "एआई क्या है", "items": [{"id": "lesson-1/01", "title": "उद्देश्य", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-1-01.mp4", "vtt": "WEBVTT\n\n00:00.840 --> 00:02.540\nठीक है, पहले पाठ में आपका स्वागत है,\n\n00:02.540 --> 00:04.300\nजहाँ हम जानेंगे कि आर्टिफिशियल\n\n00:04.300 --> 00:05.580\nइंटेलिजेंस असल में क्या है।\n\n00:06.460 --> 00:09.380\nतो पहले पाठ के उद्देश्य में, आप उन मुख्य\n\n00:09.380 --> 00:11.680\nगुणों को समझाएँगे जो किसी चीज़ को AI\n\n00:11.680 --> 00:14.480\nबनाते हैं, और फिर आप AI और गैर-AI\n\n00:14.480 --> 00:17.520\nउदाहरणों को पहचानेंगे और बताएँगे कि ऐसा क्यों है।\n"}, {"id": "lesson-1/02", "title": "एआई क्या है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-1-02.mp4", "vtt": "WEBVTT\n\n00:01.400 --> 00:03.960\nतो इससे पहले कि हम शुरू करें, इस सवाल के\n\n00:03.960 --> 00:06.120\nबारे में सोचें: आपको क्या लगता है कि\n\n00:06.120 --> 00:07.760\nइंसान बुद्धिमान क्यों होते हैं?\n\n00:08.820 --> 00:10.940\nअब वीडियो को रोकें और कुछ सेकंड के लिए\n\n00:10.940 --> 00:11.860\nइसके बारे में सोचें।\n\n00:14.080 --> 00:17.160\nठीक है, अब जब आपके पास कुछ समय है, तो\n\n00:17.160 --> 00:19.160\nमैं पहले यह कहना चाहता हूँ कि मानवीय\n\n00:19.160 --> 00:21.960\nबुद्धिमत्ता बेहद जटिल है, लेकिन हम दो\n\n00:21.960 --> 00:23.680\nमुख्य विशेषताओं को देख सकते हैं।\n\n00:23.960 --> 00:26.000\nइंसानों को बुद्धिमान बनाने वाली कुछ\n\n00:26.000 --> 00:28.120\nमुख्य विशेषताएं इसकी स्वायत्तता और\n\n00:28.120 --> 00:29.100\nअनुकूलन क्षमता हैं।\n\n00:29.970 --> 00:31.810\nतो जब मैं स्वायत्तता कहता हूँ, तो इसका\n\n00:31.810 --> 00:34.170\nमतलब है कि इंसान अपने आप काम करता है और\n\n00:34.170 --> 00:34.910\nनिर्णय लेता है।\n\n00:35.250 --> 00:38.110\nऔर जब मैं अनुकूलन क्षमता कहता हूँ, तो यह\n\n00:38.110 --> 00:40.490\nअनुभव से सीखने और सुधार करने की मानवीय\n\n00:40.490 --> 00:40.990\nक्षमता है।\n\n00:41.900 --> 00:44.560\nऔर इसलिए बहुत से जिज्ञासु लोगों ने सोचा\n\n00:44.560 --> 00:46.460\nकि हम मशीनों में बुद्धिमत्ता के इन\n\n00:46.460 --> 00:47.840\nपहलुओं को कैसे बना सकते हैं?\n\n00:48.790 --> 00:50.970\nऔर यहीं से आर्टिफिशियल इंटेलिजेंस का\n\n00:50.970 --> 00:53.290\nक्षेत्र अस्तित्व में आया, जो बुद्धिमान\n\n00:53.290 --> 00:55.750\nव्यवहार की नकल करने वाली तकनीक बनाने के\n\n00:55.750 --> 00:58.040\nबारे में अध्ययन का एक क्षेत्र है।\n\n00:59.020 --> 01:01.560\nऔर इसलिए कुछ मुख्य चीजें जो एआई को\n\n01:01.560 --> 01:04.240\nबुद्धिमान बनाती हैं, वे इसकी स्वायत्तता\n\n01:04.240 --> 01:06.800\nऔर अनुकूलन क्षमता भी हैं। तो जब मैं\n\n01:06.800 --> 01:08.780\nस्वायत्तता कहता हूँ, तो मैं वास्तव में\n\n01:08.780 --> 01:11.480\nस्वतंत्र रूप से सहायता करने या संचालित\n\n01:11.480 --> 01:13.500\nकरने की तकनीक की क्षमता कह रहा हूँ।\n\n01:14.120 --> 01:16.520\nऔर जब मैं अनुकूलन क्षमता कहता हूँ, तो यह\n\n01:16.520 --> 01:19.000\nअधिक डेटा का विश्लेषण करने के साथ सुधार\n\n01:19.000 --> 01:21.460\nकरने की तकनीक की क्षमता है। और इसलिए कुछ\n\n01:21.460 --> 01:23.340\nउदाहरण जिनके बारे में हम सोच सकते हैं,\n\n01:23.340 --> 01:25.400\nवे हैं, जैसे, हमारा सर्च इंजन।\n\n01:25.980 --> 01:28.280\nयदि आपने कभी गूगल का उपयोग किया है, तो\n\n01:28.280 --> 01:30.380\nआपने किसी प्रकार के एआई के साथ काम किया\n\n01:30.380 --> 01:32.560\nहै। यह स्वायत्त है क्योंकि यह स्वतंत्र\n\n01:32.560 --> 01:34.920\nरूप से शब्दों का सुझाव देकर आपकी सहायता\n\n01:34.920 --> 01:36.880\nकर सकता है। और जैसा कि आप देख सकते हैं,\n\n01:36.880 --> 01:38.720\nजैसे ही मैं टाइप कर रहा हूँ, आप देख सकते\n\n01:38.720 --> 01:40.800\nहैं कि मुझे ये सभी विभिन्न सुझाव मिल रहे\n\n01:40.800 --> 01:42.940\nहैं। और यह अनुकूलनशील भी है क्योंकि यह\n\n01:42.940 --> 01:44.900\nलोगों की पिछली खोजों और बहुत कुछ का\n\n01:44.900 --> 01:47.660\nविश्लेषण करके अपने सुझावों में सुधार कर सकता है।\n\n01:49.250 --> 01:51.770\nअब, एआई नहीं होने का एक अच्छा उदाहरण\n\n01:51.770 --> 01:52.530\nकैलकुलेटर है।\n\n01:52.850 --> 01:54.770\nयह स्वायत्त नहीं है क्योंकि यह केवल वही\n\n01:54.770 --> 01:57.230\nकरता है जो आप इसे बताते हैं, इसलिए आपको\n\n01:57.230 --> 01:59.670\nजो कुछ भी करना है उसके लिए मैन्युअल रूप\n\n01:59.670 --> 02:00.730\nसे बटन दबाने होंगे।\n\n02:01.550 --> 02:04.010\nऔर यह विशेष रूप से अनुकूलनशील नहीं है\n\n02:04.010 --> 02:06.030\nक्योंकि यह नए डेटा का विश्लेषण नहीं कर\n\n02:06.030 --> 02:08.550\nसकता है, और यह हमेशा एक ही तरह से काम\n\n02:08.550 --> 02:09.010\nकरता है।\n\n02:10.700 --> 02:13.780\nठीक है, अब आपकी बारी है। चलो एआई या नहीं खेलते हैं।\n\n02:14.490 --> 02:16.050\nमैं एक स्थिति का वर्णन करने जा रहा हूँ।\n\n02:16.420 --> 02:18.500\nआप देखेंगे कि इसमें स्वायत्तता और\n\n02:18.500 --> 02:21.260\nअनुकूलन क्षमता है या नहीं, फिर तय करेंगे\n\n02:21.260 --> 02:23.500\nकि यह एआई है और अपना तर्क बताएंगे।\n"}, {"id": "lesson-1/03", "title": "एआई या नहीं", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=hi"}, {"id": "lesson-1/04", "title": "एआई हमारी कैसे मदद कर सकता है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-1-04.mp4", "vtt": "WEBVTT\n\n00:00.860 --> 00:02.660\nठीक है, तो 'एआई या नहीं' गेम खेलने के\n\n00:02.660 --> 00:04.000\nबाद, आपके लिए एक सवाल है।\n\n00:04.930 --> 00:07.210\nये एआई उदाहरण लोगों की मदद कैसे कर रहे थे?\n\n00:08.310 --> 00:10.590\nतो बेझिझक वीडियो को रोकें और कुछ सेकंड\n\n00:10.590 --> 00:11.630\nके लिए इसके बारे में सोचें।\n\n00:13.930 --> 00:16.370\nठीक है, तो एआई तकनीक हमारी मदद कई तरह से\n\n00:16.370 --> 00:18.490\nकर सकती है जैसे यह हमारे काम की क्वालिटी\n\n00:18.490 --> 00:20.750\nसुधार सकती है, यह हमारे काम के कुछ\n\n00:20.750 --> 00:22.990\nहिस्से कर सकती है ताकि हम अन्य कामों पर\n\n00:22.990 --> 00:25.850\nध्यान दे सकें, या यह हमारे अनुभव को सरल\n\n00:25.850 --> 00:28.810\nबना सकती है। तो वास्तविक समस्याओं को हल\n\n00:28.810 --> 00:30.930\nकरने के लिए एआई टूल्स का उपयोग करने वाले\n\n00:30.930 --> 00:33.670\nलोगों के कुछ उदाहरण किसान हो सकते हैं।\n\n00:33.670 --> 00:36.190\nआप जानते हैं, किसान प्लांटविलेज नुरु\n\n00:36.190 --> 00:38.830\nजैसे इन एआई टूल्स का उपयोग कर रहे हैं,\n\n00:38.830 --> 00:40.850\nजहाँ वे पौधे की पत्ती की तस्वीर ले सकते\n\n00:40.850 --> 00:43.150\nहैं और देख सकते हैं कि वह बीमार है या\n\n00:43.150 --> 00:45.430\nनहीं और उसका इलाज कैसे किया जाए।\n\n00:46.300 --> 00:48.800\nइनमें से कुछ किसान फार्मरचैट नामक चीज़\n\n00:48.800 --> 00:51.180\nका भी उपयोग करते हैं, जो उनके लिए खेती\n\n00:51.180 --> 00:53.640\nपर सलाह लेने के लिए चैटबॉट के साथ जुड़ने\n\n00:53.640 --> 00:56.440\nका एक तरीका है, जिससे वे अपनी फसलों और\n\n00:56.440 --> 00:58.720\nमिट्टी की देखभाल करने के बारे में बेहतर\n\n00:58.720 --> 00:59.660\nनिर्णय ले पाते हैं।\n\n01:00.720 --> 01:03.420\nअगर हम डॉक्टरों के संदर्भ में देखें, तो\n\n01:03.420 --> 01:05.960\nवे बीमारियों के उन बहुत कठिन और बारीक\n\n01:05.960 --> 01:08.620\nसंकेतों को पहचानने के लिए एक्स-रे जैसी\n\n01:08.620 --> 01:11.420\nएआई इमेजिंग का उपयोग कर रहे हैं, जिससे\n\n01:11.420 --> 01:13.680\nउन्हें बेहतर निर्णय लेने में मदद मिलती है।\n\n01:14.650 --> 01:17.050\nऔर सुकी जैसी चीज़ों से डॉक्टर और मरीज़\n\n01:17.050 --> 01:19.870\nकी बातचीत के नोट्स एआई खुद तैयार कर लेता\n\n01:19.870 --> 01:21.810\nहै, जिससे डॉक्टर मरीज़ों पर ज़्यादा\n\n01:21.810 --> 01:22.670\nध्यान दे पाते हैं।\n\n01:24.660 --> 01:26.620\nतो एक बड़ी बात जिस पर हम ज़ोर देते\n\n01:26.620 --> 01:29.600\nरहेंगे वह यह है कि एआई तकनीक एक टूल है,\n\n01:29.600 --> 01:32.540\nऔर मैं यह एआई की क्षमताओं को कम आंकने के\n\n01:32.540 --> 01:34.900\nलिए नहीं, बल्कि यह याद दिलाने के लिए कह\n\n01:34.900 --> 01:36.720\nरहा हूँ कि हम इसके लिए ज़िम्मेदार हैं।\n\n01:37.140 --> 01:39.280\nक्योंकि बात यह है कि, लोग ही तय करते हैं\n\n01:39.280 --> 01:41.300\nकि अपनी ज़रूरी चीज़ों के लिए इनका उपयोग\n\n01:41.300 --> 01:41.900\nकैसे करना है।\n"}, {"id": "lesson-1/05", "title": "पुनरावलोकन क्विज़", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=hi"}, {"id": "lesson-1/06", "title": "प्रोजेक्ट का समय", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-1-06.mp4", "vtt": "WEBVTT\n\n00:00.480 --> 00:01.920\nठीक है, अब प्रोजेक्ट का समय है।\n\n00:02.670 --> 00:04.990\nतो अगर आपको प्लांट विलेज नीरू याद है, तो\n\n00:04.990 --> 00:07.350\nकिसानों ने इस एआई क्लासिफायर टूल का\n\n00:07.350 --> 00:09.170\nइस्तेमाल पत्तियों की तस्वीरें लेने के\n\n00:09.170 --> 00:11.670\nलिए किया था ताकि वे देख सकें कि पत्तियां\n\n00:11.670 --> 00:14.310\nबीमार हैं या नहीं। और अब आपकी बारी है\n\n00:14.310 --> 00:16.470\nअपना खुद का एआई क्लासिफायर डिजाइन करने की।\n\n00:17.220 --> 00:19.660\nअगले तीन पाठों में, आप अपनी पसंद के किसी\n\n00:19.660 --> 00:21.940\nभी विषय पर अपना खुद का एआई क्लासिफायर\n\n00:21.940 --> 00:22.700\nडिजाइन करेंगे।\n\n00:23.340 --> 00:25.520\nवे पौधों की पत्तियां हो सकती हैं, स्कूल\n\n00:25.520 --> 00:28.300\nका सामान हो सकता है, या जो कुछ भी आप सोच सकें।\n\n00:29.990 --> 00:32.250\nतो छात्रों द्वारा किए गए कुछ उदाहरण ये\n\n00:32.250 --> 00:34.750\nहैं कि, आप जानते हैं, उनमें से कुछ अपने\n\n00:34.750 --> 00:36.710\nस्कूल के बगीचे में गए और विभिन्न\n\n00:36.710 --> 00:38.890\nपत्तियों के बीच अंतर करने के लिए उनकी\n\n00:38.890 --> 00:39.690\nतस्वीरें लीं।\n\n00:40.550 --> 00:43.230\nऔर, उम, कुछ ने कांच के कप और प्लास्टिक\n\n00:43.230 --> 00:45.510\nके कप जैसी चीजों की अलग-अलग तस्वीरें ली हैं।\n\n00:46.230 --> 00:48.190\nऔर कुछ तो और भी रचनात्मक रहे हैं जहाँ\n\n00:48.190 --> 00:50.350\nउन्होंने सांकेतिक भाषा का इस्तेमाल किया,\n\n00:50.350 --> 00:52.210\nऔर हाथ की विभिन्न स्थितियों की तस्वीरें\n\n00:52.210 --> 00:54.470\nलीं यह देखने के लिए कि वे कौन से अक्षर थे।\n\n00:55.850 --> 00:57.930\nतो हर पाठ के बाद, आप अपनी वर्कशीट पर\n\n00:57.930 --> 01:00.290\nअपनी प्रतिक्रिया लिखेंगे। अगर आपके पास\n\n01:00.290 --> 01:02.450\nवर्कशीट नहीं है, तो अपनी प्रतिक्रियाएं\n\n01:02.450 --> 01:04.510\nलिखने के लिए बस कागज के एक टुकड़े का\n\n01:04.510 --> 01:05.010\nउपयोग करें।\n\n01:05.500 --> 01:07.560\nऔर जरूरत पड़ने पर आप समूहों में भी मिलकर\n\n01:07.560 --> 01:08.260\nकाम कर सकते हैं।\n\n01:09.370 --> 01:11.430\nतो यह वर्कशीट है, और पाठ खत्म होने के\n\n01:11.430 --> 01:13.490\nबाद, अंत तक आपको इसे पूरा कर लेना चाहिए।\n\n01:15.490 --> 01:17.750\nठीक है, तो सभी पाठों के बाद, आपको अपनी\n\n01:17.750 --> 01:20.050\nवर्कशीट पूरी कर लेनी चाहिए और अपने चुने\n\n01:20.050 --> 01:21.970\nहुए विषय के लिए अपना एआई क्लासिफायर\n\n01:21.970 --> 01:23.110\nडिजाइन कर लेना चाहिए।\n\n01:23.400 --> 01:25.720\nऔर इसलिए आपके शिक्षक एक वैकल्पिक\n\n01:25.720 --> 01:27.920\nप्रेजेंटेशन दिवस रख सकते हैं जहाँ आप\n\n01:27.920 --> 01:30.040\nअपना एआई क्लासिफायर और वर्कशीट की\n\n01:30.040 --> 01:31.220\nप्रतिक्रियाएं पेश करेंगे।\n\n01:32.740 --> 01:35.280\nठीक है, तो चलिए वर्कशीट पर पहले प्रश्न\n\n01:35.280 --> 01:36.620\nका उत्तर देना शुरू करते हैं।\n\n01:38.840 --> 01:40.880\nतो आप केवल पहले पाठ का उत्तर देने से\n\n01:40.880 --> 01:43.240\nशुरुआत करेंगे, जो है अपना वर्गीकरण विषय चुनें।\n\n01:43.930 --> 01:46.170\nतो एक ऐसा विषय चुनें जिसे आप अपने एआई\n\n01:46.170 --> 01:48.570\nवर्गीकरण के लिए खोजना चाहेंगे और बताएं\n\n01:48.570 --> 01:49.590\nकि आपने इसे क्यों चुना।\n\n01:50.340 --> 01:52.640\nतो यह एक उदाहरण है जो एक छात्र ने लिखा\n\n01:52.640 --> 01:55.340\nहै, \"मैं फलों का वर्गीकरण करना चाहता हूँ\n\n01:55.340 --> 01:57.760\nक्योंकि मुझे फल पसंद हैं और वे आसानी से\n\n01:57.760 --> 02:00.400\nमिल जाते हैं। मेरे आस-पास बहुत से लोग फल\n\n02:00.400 --> 02:02.460\nउगाते हैं, इसलिए मैं अपने प्रोजेक्ट के\n\n02:02.460 --> 02:04.440\nलिए अलग-अलग तरह के फल ला सकता हूँ।\"\n"}, {"id": "lesson-1/07", "title": "वर्कशीट", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=hi"}]}, {"id": "lesson-2", "kicker": "पाठ 2", "title": "मशीन लर्निंग के मुख्य भाग", "items": [{"id": "lesson-2/01", "title": "उद्देश्य", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-2-01.mp4", "vtt": "WEBVTT\n\n00:00.580 --> 00:03.240\nठीक है, पाठ दो में आपका स्वागत है, जहाँ\n\n00:03.240 --> 00:05.060\nहम मशीन लर्निंग के मुख्य हिस्सों के बारे\n\n00:05.060 --> 00:05.720\nमें बात करेंगे।\n\n00:06.880 --> 00:09.680\nतो पाठ दो का उद्देश्य है कि हम समझा सकें\n\n00:09.680 --> 00:11.940\nकि मशीन लर्निंग क्या है। हम मशीन लर्निंग\n\n00:11.940 --> 00:14.360\nके मुख्य हिस्सों की पहचान करेंगे। हम\n\n00:14.360 --> 00:17.040\nबताएंगे कि हर हिस्सा क्या करता है और वे\n\n00:17.040 --> 00:19.500\nएक साथ कैसे काम करते हैं, और आप यह\n\n00:19.500 --> 00:22.460\nसमझाएंगे कि डेटा किस तरह से AI के काम\n\n00:22.460 --> 00:24.600\nकरने की गुणवत्ता को प्रभावित करता है।\n"}, {"id": "lesson-2/02", "title": "मशीन लर्निंग क्या है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-2-02.mp4", "vtt": "WEBVTT\n\n00:00.820 --> 00:02.880\nठीक है, तो आप परीक्षा की तैयारी कैसे करते हैं?\n\n00:03.750 --> 00:05.950\nइस बारे में कुछ सेकंड के लिए सोचिए। ठीक\n\n00:05.950 --> 00:08.510\nहै, जब कोई इंसान परीक्षा की तैयारी करता\n\n00:08.510 --> 00:10.510\nहै, तो सबसे पहली चीज़ जो आप करेंगे, वह\n\n00:10.510 --> 00:13.350\nहै जानकारी इकट्ठा करना, और यह जानकारी\n\n00:13.350 --> 00:15.250\nकक्षा में लिए गए नोट्स के रूप में हो\n\n00:15.250 --> 00:15.730\nसकती है।\n\n00:16.670 --> 00:18.730\nतो जब आपके पास अपने नोट्स होते हैं, तो\n\n00:18.730 --> 00:21.170\nआप उन नोट्स को पढ़ेंगे, और तब होता यह है\n\n00:21.170 --> 00:24.810\nकि आपका दिमाग उस नई जानकारी को आपके जीवन\n\n00:24.810 --> 00:26.770\nके अनुभवों से जोड़ता है ताकि आप दुनिया\n\n00:26.770 --> 00:27.770\nको बेहतर समझ सकें।\n\n00:28.130 --> 00:31.230\nऔर समय के साथ होता यह है कि जैसे-जैसे आप\n\n00:31.230 --> 00:33.490\nनई जानकारी को अपनी पिछली जानकारी से\n\n00:33.490 --> 00:36.150\nजोड़ते हैं, आप परीक्षा देने के लिए बेहतर\n\n00:36.150 --> 00:37.790\nतरीके से तैयार होते जाते हैं।\n\n00:38.860 --> 00:41.640\nतो परीक्षा की तैयारी के चार हिस्से हैं:\n\n00:41.640 --> 00:43.860\nदिमाग, जो मूल रूप से नोट्स बनाता है;\n\n00:43.860 --> 00:45.660\nआप उन नोट्स को पढ़ते हैं;\n\n00:45.660 --> 00:48.880\nऔर नतीजतन, आपके पास एक ज्यादा तैयार\n\n00:48.880 --> 00:51.190\nदिमाग होता है जो परीक्षा देने के लिए\n\n00:51.190 --> 00:51.770\nतैयार है।\n\n00:52.870 --> 00:55.130\nऔर इसलिए, दिमाग ही वह चीज़ है जो सीखने\n\n00:55.130 --> 00:58.170\nका काम करता है। नोट्स मूल रूप से वही\n\n00:58.170 --> 00:59.930\nजानकारी है जिसे आप पढ़ने वाले हैं।\n\n01:00.250 --> 01:02.380\nपढ़ाई करना मूल रूप से वह समय और\n\n01:02.380 --> 01:04.640\nप्रक्रिया है जिसमें आप इन नए विचारों को\n\n01:04.640 --> 01:07.030\nअपनी पहले से मौजूद जानकारी से जोड़ते\n\n01:07.030 --> 01:09.640\nहैं, और तैयार दिमाग उसका परिणाम होता है।\n\n01:09.840 --> 01:12.040\nतो जब आप उन नोट्स की पढ़ाई कर लेते हैं,\n\n01:12.040 --> 01:13.980\nतब आप मूल रूप से परीक्षा देने के लिए\n\n01:13.980 --> 01:14.800\nतैयार हो जाते हैं।\n\n01:16.050 --> 01:19.110\nऔर इसलिए, मानव सीखने की मुख्य बात यह है\n\n01:19.110 --> 01:22.070\nकि आप नई जानकारी को अपने जीवन के अनुभवों\n\n01:22.070 --> 01:24.630\nसे जोड़कर समझ बना रहे हैं, ताकि आप\n\n01:24.630 --> 01:25.810\nदुनिया को समझ सकें।\n\n01:26.210 --> 01:28.710\nतो इंसानी सीखने की तुलना मशीन लर्निंग से\n\n01:28.710 --> 01:29.550\nकैसे की जाती है?\n\n01:29.900 --> 01:32.220\nतो, मशीन लर्निंग के बारे में बात यह है,\n\n01:32.220 --> 01:34.440\nऔर हम आगे विस्तार से बताएंगे कि हमारा\n\n01:34.440 --> 01:37.340\nइससे क्या मतलब है, कि यह मूल रूप से\n\n01:37.340 --> 01:40.200\nगणितीय निर्देशों का उपयोग करके डेटा में\n\n01:40.200 --> 01:42.780\nपैटर्न खोजने और भविष्यवाणी करने के लिए\n\n01:42.780 --> 01:43.200\nहोती है।\n\n01:43.490 --> 01:45.470\nऔर मशीन लर्निंग के कुछ हिस्से यह हैं कि\n\n01:45.470 --> 01:46.570\nइसमें एक मॉडल होता है।\n\n01:46.990 --> 01:49.190\nवह मॉडल डेटा लेता है, और मूल रूप से\n\n01:49.190 --> 01:51.350\nट्रेनिंग वह प्रक्रिया है जिसमें आप उस\n\n01:51.350 --> 01:54.330\nडेटा में पैटर्न खोजने की कोशिश करते हैं,\n\n01:54.330 --> 01:56.450\nऔर फिर आपके पास एक प्रशिक्षित मॉडल होता\n\n01:56.450 --> 01:58.990\nहै, जैसे कि पौधों की बीमारियों का\n\n01:58.990 --> 02:01.290\nवर्गीकरण करने वाला मॉडल, जो यह\n\n02:01.290 --> 02:03.650\nभविष्यवाणी कर सकता है कि पौधा बीमार है\n\n02:03.650 --> 02:06.590\nया नहीं। तो मशीन लर्निंग के चार मुख्य\n\n02:06.590 --> 02:09.070\nहिस्सों में विस्तार से देखें तो, मॉडल वह\n\n02:09.070 --> 02:11.050\nचीज़ है जो पैटर्न को पकड़ने का काम करता\n\n02:11.050 --> 02:13.910\nहै। डेटा बस वह जानकारी है जो हम मॉडल को\n\n02:13.910 --> 02:16.710\nदेते हैं, जिस पर वह ट्रेनिंग करेगा।\n\n02:16.710 --> 02:18.310\nट्रेनिंग मूल रूप से वह प्रक्रिया है\n\n02:18.310 --> 02:20.650\nजिसमें मॉडल डेटा का विश्लेषण करके पैटर्न\n\n02:20.650 --> 02:21.290\nखोजता है।\n\n02:21.470 --> 02:24.270\nऔर फिर से, प्रशिक्षित मॉडल मूल रूप से वह\n\n02:24.270 --> 02:26.630\nपरिणाम है जब मॉडल ने ट्रेनिंग पूरी कर ली\n\n02:26.630 --> 02:29.230\nहोती है, और अब वह भविष्यवाणी करने के लिए\n\n02:29.230 --> 02:29.950\nतैयार होता है।\n\n02:32.060 --> 02:34.620\nतो भले ही मशीन जानकारी को अलग तरीके से\n\n02:34.620 --> 02:37.120\nप्रोसेस करती है, फिर भी दोनों में कुछ\n\n02:37.120 --> 02:38.620\nसमान हिस्से होते हैं, है ना?\n\n02:39.100 --> 02:42.200\nतो दिमाग से मॉडल, नोट्स से डेटा, पढ़ाई\n\n02:42.200 --> 02:44.380\nसे ट्रेनिंग, और दिमाग को तैयार करना से\n\n02:44.380 --> 02:45.200\nप्रशिक्षित मॉडल।\n\n02:45.500 --> 02:47.320\nये बिल्कुल एक जैसे नहीं हैं, लेकिन इन\n\n02:47.320 --> 02:49.680\nदोनों में सीखने के तरीके के समान चरण\n\n02:49.680 --> 02:50.400\nजरूर होते हैं।\n"}, {"id": "lesson-2/04", "title": "न्यूरोपॉकेट का उपयोग कैसे करें", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-2-04.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:02.920\nठीक है, तो हमने मशीन लर्निंग के मुख्य\n\n00:02.920 --> 00:04.480\nहिस्सों के बारे में बात की थी, जैसे\n\n00:04.480 --> 00:06.780\nमॉडल, डेटा, ट्रेनिंग, और ट्रेन्ड मॉडल,\n\n00:06.780 --> 00:09.000\nलेकिन यह देखना वाकई मुश्किल है कि ये\n\n00:09.000 --> 00:10.920\nअलग-अलग हिस्से एक साथ कैसे आते हैं।\n\n00:11.650 --> 00:13.650\nतो चलिए देखते हैं कि ये मुख्य हिस्से एक\n\n00:13.650 --> 00:15.330\nसाथ कैसे आते हैं, इसके लिए हम Near\n\n00:15.330 --> 00:17.770\nPocket के साथ एक AI क्लासिफायर डिजाइन करेंगे।\n\n00:18.500 --> 00:19.600\nतो आखिर Near Pocket है क्या?\n\n00:20.460 --> 00:22.660\nNear Pocket एक AI ऐप है जिसमें आप इमेज\n\n00:22.660 --> 00:24.640\nजोड़ सकते हैं, एक मॉडल को ट्रेन कर सकते\n\n00:24.640 --> 00:26.760\nहैं, और देख सकते हैं कि AI चीजों को कैसे\n\n00:26.760 --> 00:27.320\nपहचानता है।\n\n00:28.420 --> 00:30.820\nऔर आपने Near Pocket में कुछ उदाहरण पहले\n\n00:30.820 --> 00:32.240\nही छात्र उदाहरण में देखे हैं।\n\n00:32.620 --> 00:34.940\nआपने देखा कि छात्र अलग-अलग पौधों की\n\n00:34.940 --> 00:37.600\nपत्तियों के बीच अंतर कर पाए, वे अलग-अलग\n\n00:37.600 --> 00:39.760\nसामग्रियों के बीच भी अंतर कर पाए, और\n\n00:39.760 --> 00:42.440\nयहां तक कि सांकेतिक भाषा को भी पहचान सके।\n\n00:43.350 --> 00:45.310\nतो हम Near Pocket को एक साथ सीखने वाले\n\n00:45.310 --> 00:46.730\nहैं, हर कदम को मिलकर करेंगे।\n\n00:47.570 --> 00:49.770\nतो जैसे-जैसे आप हर कदम पर आगे बढ़ें,\n\n00:49.770 --> 00:51.730\nवीडियो को रोकने के लिए स्वतंत्र महसूस\n\n00:51.730 --> 00:54.070\nकरें ताकि आप कार्य या चरण को पूरा कर\n\n00:54.070 --> 00:56.150\nसकें, इससे पहले कि आप अगले पर जाएं।\n\n00:57.160 --> 00:59.300\nऔर निश्चित रूप से, अगर आप समूहों में या\n\n00:59.300 --> 01:01.180\nकक्षा में काम कर रहे हैं और आप जल्दी\n\n01:01.180 --> 01:03.360\nपूरा कर लेते हैं, तो अपने आस-पास के अन्य\n\n01:03.360 --> 01:05.940\nलोगों की मदद करें ताकि हम सब मिलकर अगले\n\n01:05.940 --> 01:07.140\nचरण पर जल्दी बढ़ सकें।\n\n01:09.180 --> 01:10.800\nठीक है, तो सबसे पहले मैं अपनी Near\n\n01:10.800 --> 01:12.580\nPocket ऐप खोलूंगा, और मैं प्रोजेक्ट का\n\n01:12.580 --> 01:14.820\nनाम रखूंगा 'स्कूल सप्लाईज़ प्रोजेक्ट'।\n\n01:15.190 --> 01:17.050\nयह कोई भी नाम हो सकता है, यह सिर्फ आपके\n\n01:17.050 --> 01:18.650\nप्रोजेक्ट का नाम है, और जैसे ही आप\n\n01:18.650 --> 01:20.270\n'Create' पर क्लिक करेंगे, यह आपको उस\n\n01:20.270 --> 01:21.390\nप्रोजेक्ट के अंदर ले जाएगा।\n\n01:22.230 --> 01:24.310\nतो मैं वास्तव में दो से अधिक समूह बना\n\n01:24.310 --> 01:24.750\nसकता हूँ।\n\n01:25.170 --> 01:27.350\nमेरे मामले में, मैं वहाँ कैंची और पेन के\n\n01:27.350 --> 01:28.830\nबीच वर्गीकरण करना चाहता हूँ।\n\n01:29.790 --> 01:32.290\nअब, जब मैंने कम से कम अपने दो समूह बना\n\n01:32.290 --> 01:34.690\nलिए हैं, तो अब मैं उन प्रत्येक समूहों के\n\n01:34.690 --> 01:36.550\nलिए कुछ फोटो जोड़ने जा रहा हूँ। तो मेरे\n\n01:36.550 --> 01:38.050\nमामले में, क्योंकि मेरे पास कैंची हैं,\n\n01:38.050 --> 01:39.550\nमैं कुछ कैंचियों की फोटो लेने जा रहा हूँ।\n\n01:40.170 --> 01:42.290\nइस मामले में, मैंने लगभग छह फोटो लीं, और\n\n01:42.290 --> 01:43.250\nफिर मैंने फोटो जोड़ दीं।\n\n01:43.660 --> 01:45.480\nअगर आप चाहें तो इससे भी ज्यादा फोटो ले\n\n01:45.480 --> 01:48.280\nसकते हैं। और अब मैं कुछ पेन की फोटो लेने\n\n01:48.280 --> 01:49.860\nजा रहा हूँ, और मेरे मामले में, मैंने भी\n\n01:49.860 --> 01:51.900\nछह पेन की फोटो लीं। और जैसा कि मैंने\n\n01:51.900 --> 01:54.100\nकहा, अगर आप चाहें तो सैकड़ों फोटो ले सकते हैं।\n\n01:54.540 --> 01:56.950\nमेरे मामले में, मैं बस जल्दी कर रहा हूँ।\n\n01:56.950 --> 01:58.990\nफिर आप फोटो जोड़ेंगे, और अब आपने अपने\n\n01:58.990 --> 02:00.300\nसमूहों में डेटा जोड़ दिया है।\n\n02:01.100 --> 02:03.020\nलेकिन अगर आप चाहें तो दो से अधिक समूह भी\n\n02:03.020 --> 02:05.040\nबना सकते हैं, तो तकनीकी रूप से मैं एक\n\n02:05.040 --> 02:07.280\nसमूह जैसे रबर भी बना सकता हूँ, लेकिन\n\n02:07.280 --> 02:09.030\nसरलता के लिए हम इसी पर टिके रहेंगे।\n\n02:09.930 --> 02:11.870\nफिर आप प्रशिक्षण (ट्रेनिंग) में जाएंगे,\n\n02:11.870 --> 02:14.110\nऔर फिर आपको बस 'ट्रेन मॉडल' बटन पर क्लिक\n\n02:14.110 --> 02:14.550\nकरना है।\n\n02:14.910 --> 02:16.490\nऔर इसमें कुछ मिनट लगेंगे, तो हमें बस\n\n02:16.490 --> 02:17.370\nइंतजार करना होगा।\n\n02:25.980 --> 02:28.500\nठीक है, तो अब चलिए अपने मॉडल का परीक्षण करते हैं।\n\n02:28.870 --> 02:30.550\nतो सबसे पहले मैं क्या करने जा रहा हूँ,\n\n02:30.550 --> 02:32.770\nमैं अपने पेन की एक फोटो अलग पोजीशन में\n\n02:32.770 --> 02:34.690\nलूंगा और देखूंगा कि क्या यह सही से\n\n02:34.690 --> 02:36.670\nपहचानता है, और आप देख सकते हैं कि यह कह\n\n02:36.670 --> 02:37.970\nरहा है कि यह एक पेन है।\n\n02:38.770 --> 02:41.310\nऔर अब मैं अपनी कैंची को एक और अलग पोजीशन\n\n02:41.310 --> 02:42.690\nमें टेस्ट करने जा रहा हूँ, यह उसे\n\n02:42.690 --> 02:44.690\nक्लासिफाई करता है, और आप देख सकते हैं कि\n\n02:44.690 --> 02:46.290\nयह सच में इसे कैंची बता रहा है।\n\n02:46.650 --> 02:46.910\nठीक है।\n\n02:47.170 --> 02:49.390\nतो यह है आपका एआई क्लासिफायर, और आप\n\n02:49.390 --> 02:51.210\nहमेशा अपने क्लासिफायर को बेहतर बनाने के\n\n02:51.210 --> 02:52.570\nलिए इसमें और डेटा जोड़ सकते हैं।\n"}, {"id": "lesson-2/03", "title": "NeuroPocket खोलें", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "एआई उपकरण गलतियाँ कर सकते हैं", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-2-05.mp4", "vtt": "WEBVTT\n\n00:00.700 --> 00:02.280\nठीक है, तो एक बार फिर से स्वागत है।\n\n00:02.770 --> 00:04.450\nतो जब आपने Near Pocket के साथ कुछ समय\n\n00:04.450 --> 00:06.990\nबिताया, क्या आपका AI क्लासिफायर हमेशा सही था?\n\n00:07.720 --> 00:09.500\nऔर अगर नहीं, तो आपको क्यों लगता है कि\n\n00:09.500 --> 00:10.390\nउसने वह गलती की?\n\n00:11.180 --> 00:13.140\nतो आप चाहें तो वीडियो को रोककर कुछ सेकंड\n\n00:13.140 --> 00:14.400\nके लिए इस बारे में सोच सकते हैं।\n\n00:17.370 --> 00:19.510\nठीक है, तो AI टूल्स के बारे में बात यह\n\n00:19.510 --> 00:22.290\nहै कि वे आपको अप्रत्याशित परिणाम दे सकते हैं।\n\n00:22.910 --> 00:25.670\nजो चीज़ आपको स्पष्ट लगेगी, वह AI टूल को\n\n00:25.670 --> 00:26.670\nस्पष्ट नहीं लगेगी।\n\n00:27.450 --> 00:29.970\nतो बात यह है कि AI टूल्स इंसानों की तरह\n\n00:29.970 --> 00:32.550\nनहीं समझते, इसलिए उन्हें फोटो में हर एक\n\n00:32.550 --> 00:34.730\nडिटेल का विश्लेषण करना पड़ता है ताकि वे\n\n00:34.730 --> 00:37.250\nपैटर्न ढूंढ सकें, और कभी-कभी इसका मतलब\n\n00:37.250 --> 00:39.730\nयह होता है कि वे ऐसे पैटर्न ढूंढ लेते\n\n00:39.740 --> 00:42.090\nहैं या इस्तेमाल कर लेते हैं जिनके बारे\n\n00:42.090 --> 00:43.900\nमें हमने पहले कभी सोचा भी नहीं होता।\n\n00:44.580 --> 00:46.680\nउदाहरण के लिए, आप यहाँ देख सकते हैं कि\n\n00:46.680 --> 00:49.540\nहमारे पास स्पष्ट रूप से एक कैंची है,\n\n00:49.540 --> 00:51.700\nलेकिन क्योंकि यह उसी स्थिति में है, जैसे\n\n00:51.700 --> 00:54.000\nयहाँ रंगीन पेंसिल है, और इसका रंग भी वही\n\n00:54.000 --> 00:56.840\nहै, इसे रंगीन पेंसिल के रूप में वर्गीकृत\n\n00:56.840 --> 00:57.620\nकर दिया गया है।\n\n00:59.310 --> 01:01.550\nऔर साथ ही, AI सिस्टम्स की एक और बात यह\n\n01:01.550 --> 01:03.540\nहै कि वे अपने डेटा तक ही बहुत सीमित होते\n\n01:03.540 --> 01:05.540\nहैं। वे वास्तव में केवल उसी आधार पर\n\n01:05.540 --> 01:07.500\nभविष्यवाणी कर सकते हैं, जो उन्होंने पहले\n\n01:07.500 --> 01:08.300\nविश्लेषण किया है।\n\n01:08.760 --> 01:10.740\nतो आप देख सकते हैं कि हमारा पौधों की\n\n01:10.740 --> 01:12.880\nबीमारी पहचानने वाला क्लासिफायर फेल हो\n\n01:12.880 --> 01:15.380\nजाता है क्योंकि उसने कभी घास को देखा या\n\n01:15.380 --> 01:17.760\nविश्लेषण नहीं किया है, और आप साफ देख\n\n01:17.760 --> 01:21.020\nसकते हैं कि वह इसे एक स्वस्थ आड़ू कहता\n\n01:21.020 --> 01:23.580\nहै, जबकि ऐसा नहीं है। और यह सिर्फ\n\n01:23.580 --> 01:25.180\nतस्वीरों पर ही लागू नहीं होता, बल्कि\n\n01:25.180 --> 01:26.700\nभाषाओं पर भी लागू होता है, है ना?\n\n01:26.700 --> 01:29.380\nएक AI टूल केवल उन्हीं भाषाओं के आधार पर\n\n01:29.380 --> 01:31.640\nजवाब दे सकता है, जिन पर उसे प्रशिक्षित\n\n01:31.640 --> 01:33.460\nकिया गया है। तो इस मामले में, मैं हिंदी\n\n01:33.460 --> 01:35.340\nमें बोल रहा हूँ, जैसे कि आज का मौसम कैसा है?\n\n01:35.540 --> 01:36.320\nआपका नाम क्या है?\n\n01:36.710 --> 01:37.690\nदो और दो कितने होते हैं?\n\n01:38.100 --> 01:40.080\nऔर क्योंकि इस AI टूल ने कभी हिंदी डेटा\n\n01:40.080 --> 01:42.180\nका विश्लेषण नहीं किया है, यह बस वही\n\n01:42.180 --> 01:44.360\nअंग्रेज़ी वाक्य बार-बार दोहराता रहेगा,\n\n01:44.360 --> 01:46.800\nजो इसे पता है, \"I am good, and you?\"\n\n01:46.800 --> 01:47.240\nबार-बार।\n\n01:47.550 --> 01:49.830\nतो यह वास्तव में इसी विचार को दर्शाता है\n\n01:49.830 --> 01:52.450\nकि जैसा इनपुट होगा, वैसा ही आउटपुट मिलेगा।\n\n01:52.830 --> 01:55.410\nतो मशीन लर्निंग में, अगर डेटा सीमित है,\n\n01:55.410 --> 01:57.650\nतो इसका मतलब है कि मॉडल की भविष्यवाणी भी\n\n01:57.650 --> 01:58.310\nसीमित ही होगी।\n"}, {"id": "lesson-2/06", "title": "पुनरावलोकन क्विज़", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=hi"}, {"id": "lesson-2/07", "title": "प्रोजेक्ट का समय", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-2-07.mp4", "vtt": "WEBVTT\n\n00:00.560 --> 00:02.280\nठीक है, पाठ संख्या दो के लिए प्रोजेक्ट\n\n00:02.280 --> 00:02.900\nका समय है।\n\n00:03.960 --> 00:06.300\nतो आपके पास अभ्यास करने के लिए थोड़ा समय\n\n00:06.300 --> 00:08.880\nथा, लेकिन अब यह आपका समय है कि आप अपने\n\n00:08.880 --> 00:11.860\nपरिवेश का अन्वेषण करें और उस थीम के लिए\n\n00:11.860 --> 00:14.120\nडेटा इकट्ठा करें जिसे आपने पाठ एक में\n\n00:14.120 --> 00:16.560\nचुना था। और याद रखें, जैसे-जैसे आप\n\n00:16.560 --> 00:19.140\nवर्कशीट पर आगे बढ़ेंगे, आपकी थीम हमेशा\n\n00:19.140 --> 00:21.640\nबदल सकती है। साथ ही, अब आपको यह भी\n\n00:21.640 --> 00:23.820\nसुनिश्चित करना है कि आपने अपनी वर्कशीट\n\n00:23.820 --> 00:26.280\nपर पाठ दो का प्रश्न जरूर हल किया हो। तो\n\n00:26.280 --> 00:28.240\nपाठ संख्या दो डेटा संग्रहण के बारे में है।\n\n00:28.630 --> 00:31.290\nतो आपको हमें बताना है कि आप किन वस्तुओं\n\n00:31.290 --> 00:34.410\nको वर्गीकृत करेंगे और आप अपना डेटा कैसे\n\n00:34.410 --> 00:36.290\nइकट्ठा करेंगे। तो एक छात्र की उत्तर का\n\n00:36.290 --> 00:36.970\nउदाहरण यह है।\n\n00:37.490 --> 00:39.630\n\"जिन वस्तुओं को मैं वर्गीकृत करूंगा वे\n\n00:39.630 --> 00:42.350\nहैं केले, संतरे और एवोकाडो। मैं अपने घर\n\n00:42.350 --> 00:44.590\nसे फल लाऊंगा या स्कूल के बगीचे में जाकर\n\n00:44.590 --> 00:47.070\nतस्वीरें लूंगा।\" ठीक है?\n\n00:47.070 --> 00:49.650\nतो आप पाठ संख्या दो का उत्तर देंगे, और\n\n00:49.650 --> 00:52.190\nअगर आपके शिक्षक अनुमति देते हैं, तो आप\n\n00:52.190 --> 00:54.830\nअपने आस-पास के वातावरण में जाकर और भी\n\n00:54.830 --> 00:57.190\nतस्वीरें ले सकते हैं ताकि आप अपनी...\n\n00:57.190 --> 01:00.490\nया अपने एआई क्लासिफायर को बेहतर बना सकें।\n"}, {"id": "lesson-2/08", "title": "वर्कशीट", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=hi"}]}, {"id": "lesson-3", "kicker": "पाठ 3", "title": "मशीनें कैसे प्रशिक्षित होती हैं", "items": [{"id": "lesson-3/01", "title": "उद्देश्य", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-01.mp4", "vtt": "WEBVTT\n\n00:00.800 --> 00:03.000\nठीक है, पाठ संख्या तीन में आपका स्वागत\n\n00:03.000 --> 00:04.940\nहै: मशीनें कैसे प्रशिक्षण लेती हैं?\n\n00:06.010 --> 00:08.430\nअगर आपको पिछला पाठ याद हो, तो हमने मशीन\n\n00:08.430 --> 00:10.230\nलर्निंग के मुख्य हिस्सों के बारे में बात\n\n00:10.230 --> 00:13.190\nकी थी, जिसमें आपके पास एक मॉडल होता है,\n\n00:13.190 --> 00:15.790\nऔर उस मॉडल में आप डेटा देते हैं, और फिर\n\n00:15.790 --> 00:17.910\nअंत में एक प्रशिक्षण प्रक्रिया से गुजरते\n\n00:17.910 --> 00:20.730\nहैं, जिसमें मॉडल आपके द्वारा दिए गए सभी\n\n00:20.730 --> 00:23.290\nडेटा का विश्लेषण करने के लिए उस समय का\n\n00:23.290 --> 00:27.390\nउपयोग करता है ताकि पैटर्न खोज सके। लेकिन\n\n00:27.390 --> 00:29.270\nवास्तव में मशीन लर्निंग की प्रशिक्षण\n\n00:29.270 --> 00:30.710\nप्रक्रिया कैसे काम करती है?\n\n00:31.470 --> 00:33.570\nऔर यही हम पाठ तीन में समझने वाले हैं।\n\n00:34.350 --> 00:36.430\nतो उद्देश्य यह है कि आप बताएंगे कि\n\n00:36.430 --> 00:38.610\nएल्गोरिदम क्या है और इसके वास्तविक जीवन\n\n00:38.610 --> 00:40.770\nके उदाहरण देंगे। आप यह समझाएंगे कि\n\n00:40.770 --> 00:43.030\nमशीनों को काम करने के लिए एल्गोरिदम की\n\n00:43.030 --> 00:45.370\nआवश्यकता क्यों होती है। आप यह बताएंगे कि\n\n00:45.370 --> 00:47.850\nप्रशिक्षण के दौरान मशीन कौन-कौन से कदम\n\n00:47.850 --> 00:50.690\nउठाती है। और अंत में, आप तुलना करेंगे कि\n\n00:50.690 --> 00:53.990\nइंसान और मशीन जानकारी को किस तरह अलग-अलग\n\n00:53.990 --> 00:55.390\nतरीके से प्रोसेस करते हैं।\n"}, {"id": "lesson-3/02", "title": "डिस्क्राइबर ड्रॉअर गेम — निर्देश", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-02.mp4", "vtt": "WEBVTT\n\n00:00.420 --> 00:02.300\nठीक है, तो इसकी शुरुआत करने के लिए, चलिए\n\n00:02.300 --> 00:03.620\nडिस्क्राइबर-ड्रॉअर गेम खेलते हैं।\n\n00:04.580 --> 00:06.620\nइसके लिए दो या दो से अधिक खिलाड़ियों की\n\n00:06.620 --> 00:08.940\nआवश्यकता होगी, लेकिन चिंता न करें यदि\n\n00:08.940 --> 00:10.820\nआपके साथ कोई अन्य खिलाड़ी नहीं है और आप\n\n00:10.820 --> 00:11.760\nइसे अकेले कर रहे हैं।\n\n00:12.530 --> 00:14.390\nहमारे पास गेम खेलते हुए हमारा वीडियो\n\n00:14.390 --> 00:16.530\nप्रदर्शन है, ताकि आप देख सकें कि यह कैसे\n\n00:16.530 --> 00:17.110\nकाम करता है।\n\n00:17.840 --> 00:19.600\nतो जब तक आप साथ खेलने के लिए किसी\n\n00:19.600 --> 00:22.040\nव्यक्ति को ढूंढ पाएंगे, तब तक आप इसके\n\n00:22.040 --> 00:23.100\nलिए तैयार हो जाएंगे।\n\n00:23.710 --> 00:23.890\nठीक है?\n\n00:24.310 --> 00:26.510\nलेकिन तब तक चलिए निर्देशों को एक बार देख लेते हैं।\n\n00:27.560 --> 00:29.400\nतो यह गेम इस तरह काम करता है कि आप\n\n00:29.400 --> 00:30.500\nजोड़ियों में काम करेंगे।\n\n00:30.880 --> 00:32.560\nतो फिर से, आपको कम से कम दो लोगों की\n\n00:32.560 --> 00:33.140\nआवश्यकता है।\n\n00:33.880 --> 00:35.860\nतो एक व्यक्ति डिस्क्राइबर होगा, और एक\n\n00:35.860 --> 00:36.980\nव्यक्ति ड्रॉअर होगा।\n\n00:37.910 --> 00:40.070\nतो यदि आपके पास कोई शिक्षक है, तो वह\n\n00:40.070 --> 00:42.790\nशिक्षक किसी भी स्थिति में तीन से पांच\n\n00:42.790 --> 00:45.310\nबुनियादी आकृतियों के साथ एक सरल चित्र\n\n00:45.310 --> 00:45.790\nबनाएगा।\n\n00:46.440 --> 00:48.840\nतो चित्र इसके जितना सरल दिख सकता है, और\n\n00:48.840 --> 00:50.600\nयह इसके जितना जटिल भी दिख सकता है।\n\n00:51.880 --> 00:53.760\nअह, यदि कोई शिक्षक नहीं है, तो\n\n00:53.760 --> 00:54.940\nडिस्क्राइबर चित्र बनाएगा।\n\n00:56.540 --> 00:58.520\nअब, एक बार चित्र तैयार हो जाने के बाद,\n\n00:58.520 --> 01:00.460\nकेवल डिस्क्राइबर ही चित्र को देख सकता है।\n\n01:01.420 --> 01:03.880\nतो डिस्क्राइबर ड्रॉअर को बताएगा कि केवल\n\n01:03.880 --> 01:06.000\nमौखिक निर्देशों के माध्यम से उस चित्र को\n\n01:06.000 --> 01:07.100\nफिर से कैसे बनाया जाए।\n\n01:07.330 --> 01:09.110\nवे केवल इस बारे में बात कर सकते हैं कि\n\n01:09.110 --> 01:10.830\nउस चित्र को फिर से कैसे बनाया जाए।\n\n01:11.450 --> 01:13.870\nआपके हाथ आपकी पीठ के पीछे होने चाहिए।\n\n01:13.870 --> 01:15.770\nबिल्कुल भी इशारा करने की अनुमति नहीं है।\n\n01:16.620 --> 01:19.500\nऔर इसलिए उस समय के दौरान, जैसे ही ड्रॉअर\n\n01:19.500 --> 01:21.740\nउस चित्र को फिर से बनाने की कोशिश करता\n\n01:21.740 --> 01:24.920\nहै, अह, दो मिनट के बाद, ड्रॉअर अपने\n\n01:24.920 --> 01:27.260\nचित्र की तुलना वास्तविक चित्र या शिक्षक\n\n01:27.260 --> 01:30.060\nके चित्र से करेगा ताकि यह देख सके कि वे\n\n01:30.060 --> 01:31.180\nइसके कितने करीब थे।\n\n01:31.540 --> 01:33.740\nऔर अंत में, वह सब पूरा होने के बाद, वह\n\n01:33.740 --> 01:34.440\nएक राउंड है।\n\n01:34.820 --> 01:36.400\nआप भूमिकाएं बदलेंगे और दोहराएंगे।\n\n01:36.840 --> 01:38.860\nतो डिस्क्राइबर अब ड्रॉअर बन जाता है, और\n\n01:38.860 --> 01:40.340\nड्रॉअर डिस्क्राइबर बन जाता है।\n\n01:41.580 --> 01:43.680\nठीक है, तो चलिए यह गेम खेलना शुरू करते\n\n01:43.680 --> 01:44.200\nहैं, ठीक है?\n\n01:44.200 --> 01:46.680\nतो चलिए कम से कम दो राउंड करने की कोशिश\n\n01:46.680 --> 01:48.800\nकरते हैं, और मैं आप लोगों से अगले राउंड\n\n01:48.800 --> 01:49.240\nमें मिलूंगा।\n"}, {"id": "lesson-3/03", "title": "डिस्क्राइबर ड्रॉअर गेम — प्रदर्शन", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-03.mp4", "vtt": "WEBVTT\n\n00:02.420 --> 00:04.980\nठीक है। तो हम एक गतिविधि करने जा रहे हैं\n\n00:04.980 --> 00:07.280\nजिसे डिस्क्राइबर ड्रॉअर गेम कहा जाता है,\n\n00:07.280 --> 00:08.560\nऔर यह खेल बहुत सरल है।\n\n00:09.530 --> 00:12.070\nमैं, शिक्षक के रूप में, एक बहुत ही सरल\n\n00:12.070 --> 00:14.270\nचित्र बनाने जा रहा हूँ जिसमें केवल तीन\n\n00:14.270 --> 00:15.950\nज्यामितीय आकृतियाँ होंगी।\n\n00:16.770 --> 00:19.130\nवह या तो एक वर्ग हो सकता है, एक वृत्त हो\n\n00:19.130 --> 00:21.930\nसकता है, एक त्रिभुज हो सकता है, एक हीरा\n\n00:21.930 --> 00:24.030\nहो सकता है, वह कुछ भी हो सकता है, है ना?\n\n00:24.460 --> 00:27.760\nलेकिन मूल रूप से ये तीन सरल आकृतियाँ हैं\n\n00:27.760 --> 00:30.200\nजिन्हें आप अपनी इच्छानुसार किसी भी तरह\n\n00:30.200 --> 00:32.800\nसे रख सकते हैं। और इसलिए मैं यहाँ जो\n\n00:32.800 --> 00:34.580\nकरने जा रहा हूँ वह यह है कि मैं शायद\n\n00:34.580 --> 00:36.160\nइसके जैसा कुछ सरल बनाऊँगा।\n\n00:41.430 --> 00:44.010\nतो यह एक सरल उदाहरण है जिसे मैं बनाने जा रहा हूँ।\n\n00:44.720 --> 00:48.800\nऔर इसलिए जो होने वाला है वह यह है कि,\n\n00:48.800 --> 00:51.660\nशिक्षक के रूप में, मेरे चित्र बनाने के\n\n00:51.660 --> 00:54.160\nबाद, अब मेरे शिक्षक, या मेरे छात्र\n\n00:54.160 --> 00:56.380\nजोड़ियों में काम करने जा रहे हैं, ठीक है?\n\n00:56.380 --> 00:58.480\nऔर इसलिए मूल रूप से, अह, जब छात्र\n\n00:58.480 --> 00:59.800\nजोड़ियों में काम करते हैं, तो दो\n\n00:59.800 --> 01:01.940\nभूमिकाएँ होंगी। एक वर्णनकर्ता होगा और एक\n\n01:01.940 --> 01:02.620\nचित्रकार होगा।\n\n01:02.770 --> 01:04.970\nतो यहाँ इस स्थिति में वर्णनकर्ता कौन\n\n01:04.970 --> 01:05.590\nबनने वाला है?\n\n01:06.130 --> 01:07.170\nमैं वर्णनकर्ता बनूँगा।\n\n01:07.620 --> 01:09.140\nठीक है, और कैरेन चित्रकार होगी।\n\n01:09.970 --> 01:12.170\nतो फिर से, पूरा विचार यह है कि\n\n01:12.170 --> 01:15.030\nवर्णनकर्ता ही एकमात्र व्यक्ति है जिसे इस\n\n01:15.030 --> 01:18.010\nछिपे हुए चित्र के पीछे आने की अनुमति है\n\n01:18.010 --> 01:20.410\nऔर मूल रूप से उस चित्र को फिर से बनाने\n\n01:20.410 --> 01:23.170\nके निर्देश देने के लिए चित्रकार के पास\n\n01:23.170 --> 01:24.470\nवापस आने की अनुमति है।\n\n01:25.250 --> 01:27.710\nऔर इसलिए तरकीब यह है कि वर्णनकर्ता जितनी\n\n01:27.710 --> 01:29.370\nबार चाहे उतनी बार आ सकता है।\n\n01:29.880 --> 01:32.380\nहालाँकि, वे केवल मौखिक निर्देश दे सकते\n\n01:32.380 --> 01:34.460\nहैं, और उन्हें उन निर्देशों को देने के\n\n01:34.460 --> 01:36.700\nलिए चित्रकार के पीछे खड़ा होना चाहिए\n\n01:36.700 --> 01:38.480\nताकि वे एक-दूसरे को न देखें।\n\n01:39.530 --> 01:39.850\nठीक है।\n\n01:40.420 --> 01:42.420\nतो चलिए वास्तव में एक प्रदर्शन दिखाते\n\n01:42.420 --> 01:45.520\nहैं कि यह खेल कैसे काम करने वाला है। तो,\n\n01:45.520 --> 01:46.540\nक्या आप लोग तैयार हैं?\n\n01:47.120 --> 01:47.300\nहाँ।\n\n01:47.610 --> 01:48.650\nतैयार, चलिए शुरू करते हैं।\n\n01:49.440 --> 01:52.240\nतुम ऊपर जा सकते हो, मेसन। चित्र देखो और\n\n01:52.240 --> 01:53.260\nकैरेन को निर्देश दो।\n\n01:54.690 --> 01:55.790\nतुम यह कर सकते हो, मेसन।\n\n02:00.320 --> 02:00.540\nठीक है।\n\n02:03.440 --> 02:05.180\nतो पहली चीज़ एक वर्ग बनाना है।\n\n02:05.820 --> 02:06.080\nठीक है।\n\n02:12.020 --> 02:15.040\nवर्ग के बीच में, ध्यान से एक गोल वृत्त बनाओ।\n\n02:18.200 --> 02:20.420\nक्या यह वर्ग के किनारों को छूने वाला है\n\n02:20.420 --> 02:21.340\nया केंद्र में जैसे?\n\n02:21.860 --> 02:22.980\nअम, यह केंद्र में होगा।\n\n02:23.400 --> 02:25.100\nयह किसी भी किनारे को नहीं छुएगा।\n\n02:25.560 --> 02:26.420\nहाँ, ठीक-ठाक ही है।\n\n02:27.290 --> 02:30.610\nठीक है। और वर्ग के नीचे, यह वर्ग के बाहर\n\n02:30.610 --> 02:33.210\nहोगा और यह नीचे की ओर इशारा करता हुआ एक\n\n02:33.210 --> 02:33.890\nत्रिभुज होगा।\n\n02:35.170 --> 02:35.410\nठीक है।\n\n02:37.250 --> 02:39.430\nनीचे की रेखा को किनारे के रूप में उपयोग करना?\n\n02:40.480 --> 02:40.720\nसही।\n\n02:41.060 --> 02:43.640\nआप दाएं किनारे और बाएं किनारे का उपयोग\n\n02:43.640 --> 02:45.600\nकरेंगे, और यह त्रिभुज के बिंदु के रूप\n\n02:45.600 --> 02:46.820\nमें बिल्कुल बीच में जाएगा।\n\n02:47.180 --> 02:47.420\nठीक है।\n\n02:47.680 --> 02:48.660\nअच्छे निर्देश, मेसन।\n\n02:50.510 --> 02:50.770\nठीक है।\n\n02:51.120 --> 02:51.360\nठीक है।\n\n02:51.620 --> 02:52.500\nअच्छा काम किया, दोस्तों।\n\n02:52.810 --> 02:55.450\nजैसा आप देख सकते हैं, वे उस चित्र को फिर\n\n02:55.450 --> 02:58.050\nसे बना पाए। असल में, यह खेल का सिर्फ\n\n02:58.050 --> 03:00.970\nपहला स्तर था। शिक्षक के रूप में, आप ऐसी\n\n03:00.970 --> 03:04.070\nआकृतियाँ बनाकर खेल को और कठिन बना सकते हैं।\n\n03:04.490 --> 03:06.330\nआप अपनी आकृतियों को इस स्थिति में रख\n\n03:06.330 --> 03:08.670\nसकते हैं और शायद एक छोटा वर्ग बना सकते\n\n03:08.670 --> 03:11.190\nहैं और इसके बीच में एक त्रिभुज रख सकते\n\n03:11.190 --> 03:11.670\nहैं, है ना?\n\n03:12.590 --> 03:15.850\nमूल रूप से, मुख्य विचार यह है कि हम अपने\n\n03:15.850 --> 03:18.370\nछात्रों को चित्रकारों को स्पष्ट निर्देश\n\n03:18.370 --> 03:20.670\nदेने के लिए चुनौती देने में सक्षम होना\n\n03:20.670 --> 03:23.370\nचाहते हैं ताकि वे स्पष्ट रूप से समझ सकें\n\n03:23.370 --> 03:25.250\nकि क्या फिर से बनाना है। ठीक है।\n\n03:26.340 --> 03:26.920\nशुक्रिया दोस्तों।\n\n03:27.030 --> 03:27.550\nधन्यवाद।\n\n03:27.730 --> 03:29.110\nऔर हम आपसे अगले गेम में मिलेंगे।\n"}, {"id": "lesson-3/04", "title": "एल्गोरिदम क्या है", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-04.mp4", "vtt": "WEBVTT\n\n00:00.500 --> 00:01.600\nठीक है, वापस स्वागत है।\n\n00:01.820 --> 00:04.220\nतो अगर आपको किसी के साथ 'वर्णन करो या\n\n00:04.220 --> 00:06.660\nचित्र बनाओ' खेल खेलने का मौका मिला, या\n\n00:06.660 --> 00:08.960\nआपने वीडियो डेमोंस्ट्रेशन देखा, तो हमारा\n\n00:08.960 --> 00:12.080\nआपसे सवाल है: आपने और आपके साथी ने या\n\n00:12.080 --> 00:15.100\nआपने जो देखा, उसमें कौन-कौन सी रणनीतियाँ\n\n00:15.100 --> 00:17.440\nअपनाई गईं जिससे चित्र को दोबारा बनाना\n\n00:17.440 --> 00:18.120\nआसान हो गया?\n\n00:19.420 --> 00:21.260\nतो बस वीडियो को रोकें और कुछ सेकंड के\n\n00:21.260 --> 00:22.320\nलिए इस बारे में सोचें।\n\n00:25.220 --> 00:27.980\nठीक है, तो अब जब आपको इस पर सोचने का समय\n\n00:27.980 --> 00:30.680\nमिला, तो शायद आपने देखा होगा कि वे कुछ\n\n00:30.680 --> 00:33.400\nजिसे 'चरण-दर-चरण सोच' कहते हैं, उसका\n\n00:33.400 --> 00:36.060\nइस्तेमाल कर रहे थे। तो चरण-दर-चरण सोच,\n\n00:36.060 --> 00:38.700\nयानी जब आपने अपने साथी के साथ यह खेल\n\n00:38.700 --> 00:41.640\nखेला, तो आपको चित्र बनाने वाले को बहुत\n\n00:41.640 --> 00:44.160\nस्पष्ट चरण-दर-चरण निर्देश देने पड़े ताकि\n\n00:44.160 --> 00:46.200\nवह शिक्षक की ड्राइंग को दोबारा बना सके।\n\n00:46.750 --> 00:49.570\nतो, उदाहरण के लिए, व्यक्ति ने कुछ ऐसा\n\n00:49.570 --> 00:52.650\nकहा होगा, \"पहले एक गोला बनाओ, फिर उस\n\n00:52.650 --> 00:54.530\nगोले के अंदर एक छोटा त्रिकोण बनाओ।\"\n\n00:54.870 --> 00:56.530\nलेकिन आप देख सकते हैं कि हमने बहुत\n\n00:56.530 --> 00:58.450\nस्पष्ट चरण-दर-चरण निर्देश दिए।\n\n00:59.450 --> 01:01.530\nतो जो आपने अभी बनाया या देखा, वह एक\n\n01:01.530 --> 01:02.190\nएल्गोरिदम था।\n\n01:03.100 --> 01:05.380\nएल्गोरिदम बस किसी भी कार्य को पूरा करने\n\n01:05.380 --> 01:08.120\nके लिए स्पष्ट चरण-दर-चरण निर्देश होता है।\n\n01:09.240 --> 01:11.500\nऔर एल्गोरिदम की बात यह है कि यह जीवन की\n\n01:11.500 --> 01:13.060\nकिसी भी चीज़ पर लागू हो सकता है।\n\n01:13.420 --> 01:16.180\nयह जरूरी नहीं कि तकनीकी हो, जब तक कि वह\n\n01:16.180 --> 01:18.660\nएल्गोरिदम किसी कार्य को पूरा करने के लिए\n\n01:18.660 --> 01:20.680\nचरण-दर-चरण निर्देशों का समूह है।\n\n01:21.590 --> 01:23.890\nतो, उदाहरण के लिए, अगर मैं इसे देखूं,\n\n01:23.890 --> 01:26.410\nचाय बनाने के चरण, तो मुझे सबसे पहले पानी\n\n01:26.410 --> 01:27.170\nउबालना होगा।\n\n01:27.580 --> 01:29.480\nदूसरा चरण, मुझे एक टी बैग डालना होगा।\n\n01:30.130 --> 01:33.470\nतीसरा चरण, मुझे चीनी और दूध डालना था, और\n\n01:33.470 --> 01:36.630\nअंत में, चौथा चरण, मुझे चम्मच से हिलाना\n\n01:36.630 --> 01:37.950\nऔर परोसना था, है ना?\n\n01:37.950 --> 01:40.970\nतो यह एक एल्गोरिदम का उदाहरण है क्योंकि\n\n01:40.970 --> 01:43.430\nमैं इसे चरण-दर-चरण तोड़कर चाय बनाने का\n\n01:43.430 --> 01:44.420\nकार्य पूरा कर सका।\n\n01:45.740 --> 01:47.920\nतो हम अपने जीवन में हर दिन एल्गोरिदम का\n\n01:47.920 --> 01:49.780\nउपयोग करते हैं जब भी हम कोई काम\n\n01:49.780 --> 01:50.960\nचरण-दर-चरण करते हैं।\n\n01:51.580 --> 01:53.740\nयह खाना बनाना हो सकता है, कपड़े पहनना हो\n\n01:53.740 --> 01:55.600\nसकता है, गणित का कोई सवाल हल करना हो\n\n01:55.600 --> 01:57.920\nसकता है, या हमारे मामले में, यह खेल\n\n01:57.920 --> 01:58.920\nखेलना भी हो सकता है।\n\n02:00.900 --> 02:03.360\nतो मेरा आपसे सवाल है: ऐसी कौन सी चीज़ है\n\n02:03.360 --> 02:05.800\nजिसे आप हर दिन करते हैं और जिसके लिए\n\n02:05.800 --> 02:08.480\nस्पष्ट चरण-दर-चरण निर्देश या स्पष्ट चरण\n\n02:08.480 --> 02:09.000\nहो सकते हैं?\n\n02:09.390 --> 02:11.090\nतो बस वीडियो को रोकें और इस बारे में\n\n02:11.090 --> 02:11.690\nथोड़ा सोचें।\n\n02:15.260 --> 02:17.260\nठीक है, तो अब जब आपको इसके बारे में\n\n02:17.260 --> 02:19.220\nसोचने का समय मिल गया है, तो हम वास्तव\n\n02:19.220 --> 02:21.440\nमें चाहते हैं कि आप एल्गोरिदम की इस पूरी\n\n02:21.440 --> 02:23.500\nअवधारणा को समझें कि मशीनों को एल्गोरिदम\n\n02:23.500 --> 02:25.960\nकी आवश्यकता होती है। फिर से, मशीनें\n\n02:25.960 --> 02:28.260\nइंसानों की तरह नहीं समझतीं, और यही सबसे\n\n02:28.260 --> 02:30.280\nबड़ा कारण है कि हमें उन्हें स्पष्ट\n\n02:30.280 --> 02:32.720\nचरण-दर-चरण निर्देश देने की आवश्यकता होती\n\n02:32.720 --> 02:35.960\nहै। तो जब आप वह खेल खेल रहे होते हैं या\n\n02:35.960 --> 02:38.720\nदेख रहे होते हैं, तो जो बताने वाला है वह\n\n02:38.720 --> 02:41.260\nइंसान की तरह है जो निर्देश दे रहा है, और\n\n02:41.260 --> 02:44.240\nजो ड्रॉ कर रहा है वह मशीन की तरह है जो\n\n02:44.240 --> 02:45.720\nउन निर्देशों का पालन कर रही है।\n"}, {"id": "lesson-3/05", "title": "मानव सीखने का एल्गोरिदम", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-05.mp4", "vtt": "WEBVTT\n\n00:00.880 --> 00:02.580\nठीक है, तो अब जब आप समझ गए हैं कि\n\n00:02.580 --> 00:04.400\nएल्गोरिदम कैसे काम करता है, तो चलिए\n\n00:04.400 --> 00:06.340\nदेखते हैं कि सीखने के लिए एल्गोरिदम कैसे\n\n00:06.340 --> 00:07.220\nबनाया जाता है।\n\n00:07.930 --> 00:09.950\nतो इसे बेहतर ढंग से समझने के लिए, हम एक\n\n00:09.950 --> 00:12.530\nछोटा सा खेल खेलेंगे जिसका नाम है 'यह किस\n\n00:12.530 --> 00:13.150\nसमूह का है?'\n\n00:14.170 --> 00:15.930\nतो होगा ये कि मैं आपको एक तस्वीर\n\n00:15.930 --> 00:17.950\nदिखाऊँगा, और आपको बस ये बताना है कि वो\n\n00:17.950 --> 00:19.510\nग्रुप ए में जाएगी या ग्रुप बी में।\n\n00:19.890 --> 00:22.110\nअब, पेंच ये है कि मैं आपको पैटर्न नहीं\n\n00:22.110 --> 00:24.190\nबताऊँगा। मैं आपको नियम नहीं बताऊँगा।\n\n00:24.580 --> 00:26.920\nआपका काम मूल रूप से इसे खुद ही समझना है।\n\n00:27.330 --> 00:27.590\nठीक है?\n\n00:28.260 --> 00:29.900\nतो चलिए पहली तस्वीर से शुरू करते हैं।\n\n00:31.600 --> 00:33.750\nठीक है, तो क्या ये ग्रुप ए में जाता है\n\n00:33.750 --> 00:34.420\nया ग्रुप बी में?\n\n00:35.610 --> 00:38.970\nबस एक अंदाज़ा लगाइए। ये यहाँ ग्रुप बी\n\n00:38.970 --> 00:39.450\nमें जाता है।\n\n00:40.460 --> 00:42.420\nक्या ये ग्रुप ए में जाता है या ग्रुप बी में?\n\n00:43.990 --> 00:45.710\nये वाला यहाँ ग्रुप ए में जाता है।\n\n00:46.730 --> 00:48.730\nक्या ये वाला ग्रुप ए में जाता है या\n\n00:48.730 --> 00:49.270\nग्रुप बी में?\n\n00:51.140 --> 00:52.520\nये वाला यहाँ ग्रुप बी में जाता है।\n\n00:53.510 --> 00:55.330\nक्या ये ग्रुप ए में जाता है या ग्रुप बी में?\n\n00:57.090 --> 00:58.670\nये वाला यहाँ ग्रुप ए में जाता है।\n\n00:59.740 --> 01:01.600\nये वाला-- क्या ये वाला ग्रुप ए में जाता\n\n01:01.600 --> 01:02.780\nहै या ग्रुप बी में?\n\n01:04.310 --> 01:05.870\nये वाला यहाँ ग्रुप ए में जाता है।\n\n01:06.890 --> 01:08.730\nक्या ये वाला ग्रुप ए में जाता है या\n\n01:08.730 --> 01:09.250\nग्रुप बी में?\n\n01:11.770 --> 01:13.170\nये वाला यहाँ ग्रुप बी में जाता है।\n\n01:14.170 --> 01:15.530\nअब यहाँ एक पेचीदा सवाल है।\n\n01:16.000 --> 01:17.560\nक्या ये वाला ग्रुप ए में जाता है या\n\n01:17.560 --> 01:18.020\nग्रुप बी में?\n\n01:19.840 --> 01:21.380\nये वाला ग्रुप ए में जाता है।\n\n01:22.370 --> 01:24.470\nऔर मुझे यकीन है कि आपने शायद इसे पहले ही\n\n01:24.480 --> 01:26.670\nसमझ लिया होगा, लेकिन क्या ये ग्रुप ए में\n\n01:26.680 --> 01:27.910\nजाता है या ग्रुप बी में?\n\n01:27.910 --> 01:30.930\nये वाला यहाँ ग्रुप ए में जाता है।\n\n01:31.810 --> 01:33.730\nऔर अंत में, क्या ये वाला ग्रुप ए में\n\n01:33.740 --> 01:34.910\nजाता है या ग्रुप बी में?\n\n01:36.370 --> 01:37.630\nये वाला ग्रुप बी में जाता है।\n\n01:38.650 --> 01:39.970\nठीक है, तो पैटर्न क्या था?\n\n01:39.970 --> 01:44.430\nखैर, जैसा कि आपने शायद जान लिया होगा,\n\n01:44.430 --> 01:46.670\nअगर बाईं ओर काला हिस्सा था, तो वो ग्रुप\n\n01:46.670 --> 01:49.270\nए था, और अगर दाईं ओर काला हिस्सा था, तो\n\n01:49.270 --> 01:50.290\nवो ग्रुप बी था।\n\n01:51.290 --> 01:53.510\nऔर इसलिए मुझे लगता है कि जो बात वाकई\n\n01:53.510 --> 01:56.110\nदिलचस्प है वो ये है कि, आप ये तय करने\n\n01:56.110 --> 01:58.530\nमें बेहतर कैसे हुए कि वो ग्रुप ए में गया\n\n01:58.530 --> 02:00.390\nया ग्रुप बी में, जबकि मैंने आपको कोई\n\n02:00.390 --> 02:01.750\nनियम या पैटर्न नहीं बताया था?\n\n02:02.650 --> 02:04.690\nतो बेझिझक वीडियो को रोकें और कुछ सेकंड\n\n02:04.690 --> 02:05.910\nके लिए इस पर विचार करें।\n\n02:09.800 --> 02:11.980\nठीक है, तो इंसानी सीखने का एल्गोरिदम कुछ\n\n02:11.980 --> 02:12.940\nइस तरह दिख सकता है।\n\n02:13.760 --> 02:16.240\nबुनियादी तौर पर, आप अंदाज़ा लगाते हैं,\n\n02:16.240 --> 02:18.520\nफिर अपने जवाब की जाँच करते हैं कि आप सही\n\n02:18.520 --> 02:20.760\nजवाब से कितने दूर हैं, फिर आप दूसरी\n\n02:20.760 --> 02:23.000\nखूबियों पर ध्यान देते हैं, और फिर आप इस\n\n02:23.000 --> 02:25.080\nप्रक्रिया को तब तक दोहराते रहते हैं जब\n\n02:25.080 --> 02:27.560\nतक कि आप बिना नियमों के अलग-अलग समूहों\n\n02:27.560 --> 02:31.240\nमें फर्क न कर सकें। और इसलिए मैं इंसानों\n\n02:31.240 --> 02:33.440\nके बारे में जो बात बताना चाहता हूँ, जो\n\n02:33.440 --> 02:36.100\nइसे वास्तव में दिलचस्प बनाती है, वो ये\n\n02:36.100 --> 02:38.700\nहै कि हम उसे देखते हैं जो महत्वपूर्ण\n\n02:38.700 --> 02:39.180\nलगता है।\n\n02:39.550 --> 02:42.170\nतो इंसानों के तौर पर, हम स्वाभाविक रूप\n\n02:42.180 --> 02:44.690\nसे बहुत जिज्ञासु होते हैं। हमारे पास ये\n\n02:44.690 --> 02:46.830\nभावनाएँ और विचारों को जोड़ने में अर्थ\n\n02:46.830 --> 02:48.370\nखोजने की तीव्र इच्छा होती है।\n\n02:49.080 --> 02:51.420\nतो मिसाल के तौर पर, अगर मैं अचानक एक\n\n02:51.420 --> 02:53.360\nकाला वर्ग देखता हूँ, तो मैं सोचता हूँ,\n\n02:53.360 --> 02:55.640\n\"ठीक है, वो काला वर्ग यकीनन मुझे अलग\n\n02:55.640 --> 02:58.740\nदिखता है,\" और, जैसे कि, वो उस जगह पर क्यों है?\n\n02:59.290 --> 03:01.630\nसच तो ये है कि, मैं बस ये जानने के लिए\n\n03:01.630 --> 03:03.790\nबहुत उत्सुक हूँ कि ये सब कैसे जुड़ता है\n\n03:03.790 --> 03:04.990\nऔर इस सब का क्या मतलब है?\n\n03:06.170 --> 03:08.630\nतो जब इंसानी सीखने का एल्गोरिदम काम करता\n\n03:08.630 --> 03:10.670\nहै, तो पता है क्या होता है, सबसे पहले,\n\n03:10.670 --> 03:12.990\nआपको एक समझदारी भरा अंदाज़ा लगाना होता है, है ना?\n\n03:13.810 --> 03:15.450\nक्योंकि आप नहीं जानते कि क्या होने वाला\n\n03:15.450 --> 03:17.590\nहै। आप इसकी विशेषताओं को नहीं जानते।\n\n03:17.900 --> 03:19.920\nतो जब भी मुझसे पूछा जाता है, \"क्या यह\n\n03:19.920 --> 03:21.920\nग्रुप ए में जाता है या ग्रुप बी में?\"\n\n03:21.920 --> 03:24.200\nतो, मैं बस कहता हूँ, \"ठीक है, मुझे लगता\n\n03:24.200 --> 03:25.820\nहै कि यह ग्रुप ए है क्योंकि हम अभी\n\n03:25.820 --> 03:26.780\nशुरुआत ही कर रहे हैं।\"\n\n03:27.160 --> 03:29.100\nऔर यहीं से चीज़ें दिलचस्प होने लगती हैं।\n\n03:29.520 --> 03:31.760\nतो दूसरे चरण में, आप अपने उत्तर की जाँच\n\n03:31.760 --> 03:32.620\nकरना शुरू करते हैं।\n\n03:33.460 --> 03:35.460\nतो दूसरे चरण में, जब आप अंदाज़ा लगाते\n\n03:35.460 --> 03:37.220\nहैं और परिणाम देखते हैं, तो आपको कुछ\n\n03:37.220 --> 03:37.940\nमहसूस होगा।\n\n03:38.730 --> 03:40.870\nउदाहरण के लिए, जब भी मैंने कहा कि यह\n\n03:40.870 --> 03:42.990\nवास्तव में ग्रुप बी है, तो आप देख सकते\n\n03:42.990 --> 03:44.050\nथे कि मैं थोड़ा हैरान हूँ।\n\n03:44.450 --> 03:46.090\nमैं सोचता हूँ, \"हूँ, सच में?\n\n03:46.090 --> 03:48.430\nशायद इसका दाईं ओर होने से कुछ लेना-देना है।\"\n\n03:49.470 --> 03:52.030\nतो उत्तरों की जाँच करने की बात यह है कि\n\n03:52.030 --> 03:54.610\nइससे आपको या तो हैरानी, या शायद\n\n03:54.610 --> 03:57.070\nजिज्ञासा, या दिलचस्पी महसूस होगी।\n\n03:57.370 --> 04:00.350\nचाहे जो भी हो, आप अंततः यही सोचेंगे कि\n\n04:00.350 --> 04:03.130\nइस सब का क्या मतलब है और यह सब एक साथ\n\n04:03.130 --> 04:03.910\nकैसे जुड़ता है?\n\n04:04.250 --> 04:06.710\nऔर फिर तीसरा चरण वह है जब आप अपना ध्यान\n\n04:06.710 --> 04:08.030\nकेंद्रित करना शुरू करते हैं।\n\n04:08.350 --> 04:10.470\nतो पिछले अंदाज़े के बाद आपको कैसा महसूस\n\n04:10.470 --> 04:12.570\nहुआ, इसका असर इस पर पड़ेगा कि आप अगले\n\n04:12.570 --> 04:14.090\nअंदाज़े में किस चीज़ पर ध्यान देंगे।\n\n04:15.000 --> 04:16.840\nतो आप यहाँ देख सकते हैं कि जब मैं वही\n\n04:16.840 --> 04:18.800\nसवाल पूछता हूँ, \"क्या यह ग्रुप ए में\n\n04:18.800 --> 04:19.920\nजाता है या ग्रुप बी में?\"\n\n04:20.690 --> 04:22.950\nमैं सोचता हूँ, \"हूँ। ठीक है, अब यह बाईं\n\n04:22.950 --> 04:25.170\nओर है, तो शायद इसका ग्रुप ए में होने से\n\n04:25.170 --> 04:25.970\nकुछ लेना-देना है।\"\n\n04:26.920 --> 04:29.060\nऔर जब मैं कहता हूँ कि यह सही है, तो आप\n\n04:29.060 --> 04:30.860\nदेख सकते हैं कि मैं तुरंत बहुत उत्साहित\n\n04:30.860 --> 04:31.460\nहो जाता हूँ।\n\n04:31.610 --> 04:33.330\nमैं कहता हूँ, \"ओह, मुझे लगता है कि अब\n\n04:33.330 --> 04:34.990\nमुझे यह समझ आने लगा है,\" है ना?\n\n04:34.990 --> 04:37.650\nऔर जैसे-जैसे आप इस प्रक्रिया को दोहराते\n\n04:37.650 --> 04:39.950\nरहेंगे, समय के साथ आप जान जाएँगे कि\n\n04:39.950 --> 04:42.270\nसमूहों को अलग करने के लिए इनमें से कौन\n\n04:42.270 --> 04:44.390\nसी विशेषताएँ सबसे ज़्यादा मायने रखती हैं।\n\n04:45.700 --> 04:48.220\nठीक है, तो पता चला है कि हम वास्तव में\n\n04:48.220 --> 04:50.660\nमशीनों में भी इस सीखने के एल्गोरिदम का\n\n04:50.660 --> 04:51.780\nअनुकरण कर सकते हैं।\n"}, {"id": "lesson-3/06", "title": "मशीन लर्निंग एल्गोरिदम", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/hi-lesson-3-06.mp4", "vtt": "WEBVTT\n\n00:01.180 --> 00:03.580\nठीक है, तो पिछली बार हमने बात की थी कि\n\n00:03.580 --> 00:05.680\nहम इन लर्निंग एल्गोरिदम को मशीनों में\n\n00:05.680 --> 00:07.060\nकैसे सिम्युलेट कर सकते हैं।\n\n00:07.820 --> 00:10.480\nऔर इससे पहले कि हम उसे समझें, हमें यह\n\n00:10.480 --> 00:13.140\nसमझने की ज़रूरत है कि आखिर फीचर क्या\n\n00:13.140 --> 00:13.620\nहोता है।\n\n00:14.340 --> 00:16.500\nतो फीचर्स जानकारी के वे टुकड़े हैं जो\n\n00:16.500 --> 00:18.900\nहमें चीज़ों के बीच अंतर करने में मदद करते हैं।\n\n00:19.230 --> 00:21.270\nतो उदाहरण के लिए, यहाँ इन दो चीज़ों को देखें।\n\n00:21.960 --> 00:24.380\nखैर, पहली चीज़ जो मैं देखता हूँ वो ये है\n\n00:24.380 --> 00:27.220\nकि वे आकार के मामले में अलग हैं। उनमें\n\n00:27.220 --> 00:30.060\nसे एक चौकोर है, दूसरा गोल है, और वे रंग\n\n00:30.060 --> 00:31.240\nके मामले में भी अलग हैं।\n\n00:31.850 --> 00:34.570\nतो यह वास्तव में एक पीला चौकोर है, और जो\n\n00:34.570 --> 00:36.730\nदाईं ओर है वह एक नीला गोला है।\n\n00:37.840 --> 00:41.160\nतो ये मेरे लिए वे फीचर्स या जानकारी हैं\n\n00:41.160 --> 00:43.740\nजो मुझे इन दोनों में फर्क समझने में मदद\n\n00:43.740 --> 00:46.840\nकरती हैं। इंसान फीचर्स को ऐसे देखता है\n\n00:46.840 --> 00:49.700\nकि जब हम कोई इमेज देखते हैं, तो उसे\n\n00:49.700 --> 00:52.560\nअलग-अलग विशेषताओं में बाँटते हैं और फिर\n\n00:52.560 --> 00:55.180\nस्वाभाविक रूप से उसी पर ध्यान देते हैं\n\n00:55.180 --> 00:56.660\nजो सबसे अहम लगता है।\n\n00:57.050 --> 00:59.730\nतो अगर हम इस इमेज के इन सभी अलग-अलग\n\n00:59.730 --> 01:02.110\nफीचर्स को देखें, तो हम पाते हैं कि\n\n01:02.110 --> 01:04.610\nक्योंकि यह काला चौकोर अपनी जगह पर अकेला\n\n01:04.610 --> 01:06.930\nहै और अलग दिखता है, तो यह बाकी सभी\n\n01:06.930 --> 01:09.050\nफीचर्स में सबसे महत्वपूर्ण महसूस होता है।\n\n01:09.420 --> 01:11.580\nहालाँकि, मशीनों के बारे में बात यह है कि\n\n01:11.580 --> 01:14.340\nवे भावनाओं के साथ अंदाज़ा नहीं लगा रही\n\n01:14.340 --> 01:16.580\nहैं, वे वास्तव में कैलकुलेटेड प्रेडिक्शन\n\n01:16.580 --> 01:17.140\nकर रही हैं।\n\n01:18.070 --> 01:20.730\nतो मशीनें इन फीचर्स को भावनाओं की तरह\n\n01:20.730 --> 01:21.410\nनहीं मानती हैं।\n\n01:21.760 --> 01:24.020\nवे इन फीचर्स को नंबर्स की तरह मानती हैं, है ना?\n\n01:24.380 --> 01:26.900\nवे वास्तव में कुछ भी देखती या महसूस नहीं करती हैं।\n\n01:27.470 --> 01:29.930\nतो, उदाहरण के लिए, इसे वास्तव में\n\n01:29.930 --> 01:31.710\nप्रोसेस करने के लिए, आप जानते हैं, वे\n\n01:31.710 --> 01:34.530\nसफेद को एक और काले को शून्य में बदल देते\n\n01:34.530 --> 01:37.590\nहैं। और इंसानों और मशीनों के बीच के अंतर\n\n01:37.590 --> 01:41.090\nको देखने का एक अच्छा तरीका यह है कि हम\n\n01:41.090 --> 01:43.690\nफीचर्स को कैसे प्रोसेस करते हैं, एक\n\n01:43.690 --> 01:45.890\nइंसान के लिए, आप जानते हैं, जब भी हम कुछ\n\n01:45.890 --> 01:48.990\nऐसा देखते हैं जो काले चौकोर की तरह अलग\n\n01:48.990 --> 01:51.210\nदिखता है, तो हम कहेंगे, \"खैर, यह\n\n01:51.210 --> 01:53.950\nमहत्वपूर्ण लगता है,\" इसलिए हम मूल रूप से\n\n01:53.950 --> 01:56.170\nएक अंदाज़ा लगाएंगे। अब, मशीनों के बारे\n\n01:56.170 --> 01:59.110\nमें बात यह है कि जब भी वे, उम-- आप यहाँ\n\n01:59.110 --> 02:00.990\nदेख सकते हैं कि वे वास्तव में इसे नहीं\n\n02:00.990 --> 02:01.430\nदेखती हैं।\n\n02:01.610 --> 02:03.530\nवे मूल रूप से उसे नंबर्स में बदल देते\n\n02:03.530 --> 02:06.050\nहैं, और फिर वे उसे किसी प्रकार की\n\n02:06.050 --> 02:07.630\nइम्पोर्टेंस से गुणा करते हैं।\n\n02:08.030 --> 02:09.870\nतो परिणाम निर्धारित करने में इनमें से\n\n02:09.870 --> 02:11.450\nकौन सी चीज़ें सबसे महत्वपूर्ण हैं?\n\n02:12.210 --> 02:14.530\nऔर फिर वे अनिवार्य रूप से एक कैलकुलेटेड\n\n02:14.530 --> 02:15.330\nप्रेडिक्शन करते हैं।\n\n02:15.930 --> 02:17.190\nमैथ्स की चिंता न करें, ठीक है?\n\n02:17.370 --> 02:19.950\nमहत्वपूर्ण बात जो मैं चाहता हूँ कि आप\n\n02:19.950 --> 02:22.110\nसमझें वह यह है कि इस प्रक्रिया में बहुत\n\n02:22.110 --> 02:23.190\nसारा मैथ्स शामिल है।\n\n02:24.200 --> 02:26.800\nतो मशीन लर्निंग ट्रेनिंग एल्गोरिदम, अह,\n\n02:26.800 --> 02:28.960\nआप देख सकते हैं कि इसमें समान मात्रा में\n\n02:28.960 --> 02:31.340\nस्टेप्स हैं, जहाँ आप एक कैलकुलेटेड\n\n02:31.340 --> 02:33.920\nप्रेडिक्शन करते हैं, फिर आप एरर को मापते\n\n02:33.920 --> 02:36.960\nहैं, फिर आप अपने मैथ इक्वेशन को एडजस्ट\n\n02:36.960 --> 02:39.100\nकरते हैं, और फिर आप इस प्रक्रिया को\n\n02:39.100 --> 02:40.080\nदोहराते रहते हैं।\n\n02:40.980 --> 02:43.080\nतो मशीन लर्निंग के बारे में बात यह है कि\n\n02:43.080 --> 02:45.120\nवे मूल
