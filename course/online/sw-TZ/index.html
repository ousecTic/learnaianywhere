  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

 "kindApp": "Programu"}, "sections": [{"id": "intro", "kicker": "Anza hapa", "title": "Utangulizi", "items": [{"id": "intro/01", "title": "Karibu kwenye Kozi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-intro-01.mp4", "vtt": "WEBVTT\n\n00:00.220 --> 00:01.960\nHabari, na karibu kwenye kozi hii ya\n\n00:01.960 --> 00:03.880\noffline-first, Utangulizi wa Akili\n\n00:03.880 --> 00:05.680\nBandia kutoka LearnAIAnywhere.org.\n\n00:06.930 --> 00:08.670\nSisi ni jumuiya ya walimu na wanafunzi\n\n00:08.670 --> 00:10.750\nkutoka kote duniani, na tunafurahi sana\n\n00:10.750 --> 00:12.650\nkukuona hapa tunapojitahidi kufanya\n\n00:12.650 --> 00:14.890\nelimu ya AI ipatikane kwa kila mtu popote.\n\n00:16.350 --> 00:18.490\nSasa, hadithi tunayoisikia kuhusu AI ni\n\n00:18.490 --> 00:20.370\nkwamba ni binadamu dhidi ya mashine hizi\n\n00:20.370 --> 00:22.390\nza AI, lakini ukweli ni kwamba, AI ni\n\n00:22.390 --> 00:23.770\nzao la maamuzi ya binadamu.\n\n00:24.900 --> 00:26.760\nNa tofauti na mashine, sisi binadamu\n\n00:26.760 --> 00:28.700\ntunachagua kile tunachojali, kama vile\n\n00:28.700 --> 00:30.620\nmaadili yetu na jamii zetu.\n\n00:31.300 --> 00:33.120\nLengo la kozi yetu ni kuwapa wanafunzi\n\n00:33.120 --> 00:35.220\nwetu maarifa na busara ili wawe wabunifu\n\n00:35.220 --> 00:37.260\nwenye uwajibikaji na watumiaji makini wa\n\n00:37.260 --> 00:38.140\nzana hizi za AI.\n\n00:39.290 --> 00:41.070\nUtakua ukijifunza hasa nini maana ya\n\n00:41.070 --> 00:43.170\nakili bandia, sehemu kuu za ujifunzaji\n\n00:43.170 --> 00:45.270\nwa mashine, jinsi ujifunzaji wa mashine\n\n00:45.270 --> 00:47.510\nunavyofanya kazi, na mawazo yanayoongoza\n\n00:47.510 --> 00:48.570\nAI yenye uwajibikaji.\n\n00:49.740 --> 00:51.680\nUtaweza kujifunza haya yote kwa kubuni\n\n00:51.680 --> 00:53.580\nAI classifier yako mwenyewe kwa kutumia\n\n00:53.580 --> 00:55.660\nMirror Pocket, ambayo itakupa msingi\n\n00:55.660 --> 00:57.400\nimara wa kuelewa jinsi zana nyingi za\n\n00:57.400 --> 00:59.020\nkisasa za AI zinavyofanya kazi.\n\n00:59.670 --> 01:01.470\nTutakuongoza hatua kwa hatua kupitia\n\n01:01.470 --> 01:03.450\nmasomo yetu manne tukitumia karatasi\n\n01:03.450 --> 01:04.750\nyetu ya shughuli za kubuni AI.\n\n01:05.090 --> 01:07.050\nNa mwisho wa yote, utabuni AI classifier\n\n01:07.050 --> 01:08.870\nyako mwenyewe na kupata uelewa wa kina\n\n01:08.870 --> 01:10.730\nkuhusu jinsi zana za AI zinavyofanya\n\n01:10.730 --> 01:12.630\nkazi, ukiwa tayari kuwasilisha mradi\n\n01:12.630 --> 01:14.270\nwako na hoja zako.\n\n01:14.270 --> 01:15.970\nTunafurahi sana kukuona hapa na\n\n01:15.970 --> 01:17.850\nkushiriki katika kubadilisha jinsi AI\n\n01:17.850 --> 01:19.670\ninavyotengenezwa na kutumiwa duniani\n\n01:19.670 --> 01:21.290\nkote, popote ulipo.\n\n01:21.470 --> 01:22.350\nTutaonana darasani.\n"}, {"id": "intro/02", "title": "Sharti", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-intro-02.mp4", "vtt": "WEBVTT\n\n00:00.740 --> 00:01.920\nSawa, karibu darasani.\n\n00:03.120 --> 00:05.420\nKwa hiyo, kuna vitu viwili ambavyo utahitaji.\n\n00:06.350 --> 00:08.010\nKitu cha kwanza ni kwamba utahitaji\n\n00:08.010 --> 00:09.830\nkifaa chenye kamera ya mbele (webcam).\n\n00:11.040 --> 00:13.120\nNa kifaa hiki kinaweza kuwa kompyuta\n\n00:13.120 --> 00:15.420\nmpakato, tableti, au simu.\n\n00:16.080 --> 00:17.960\nJambo muhimu ni kwamba kifaa hicho kiwe\n\n00:17.960 --> 00:19.840\nna kamera ya mbele kwa sababu tutaenda\n\n00:19.840 --> 00:20.940\nkuitumia kupiga picha.\n\n00:21.770 --> 00:24.090\nNa hivyo, programu tutakayotumia inaitwa\n\n00:24.090 --> 00:26.070\nNear Pocket, na hii ndiyo tutatumia\n\n00:26.070 --> 00:27.970\nkubuni kifaa chetu cha kutambua picha.\n\n00:29.270 --> 00:31.070\nKwa hiyo unaweza kuipata mtandaoni\n\n00:31.070 --> 00:33.410\nkirahisi, au kama unataka kuitumia bila\n\n00:33.410 --> 00:35.670\nmtandao, kuna programu zinazopatikana\n\n00:35.670 --> 00:37.190\nkwa vifaa vya Windows na Android.\n\n00:38.470 --> 00:40.110\nKwa hiyo kama unatumia iPhone,\n\n00:40.110 --> 00:42.150\nutalazimika kuipata kupitia tovuti\n\n00:42.150 --> 00:42.820\nbadala yake.\n\n00:44.370 --> 00:46.270\nJambo lingine ni kwamba tunayo karatasi\n\n00:46.270 --> 00:48.270\nya mradi ya hiari, na kazi ya karatasi\n\n00:48.270 --> 00:50.370\nhii ya mradi ni kutuongoza kubuni kifaa\n\n00:50.370 --> 00:52.030\nchetu cha kutambua kwa kutumia AI\n\n00:52.030 --> 00:53.970\ntunapopitia kila somo.\n\n00:54.810 --> 00:56.890\nNa bila shaka, kama hutaki kuichapisha,\n\n00:56.890 --> 00:59.050\nunaweza kutumia karatasi ya kawaida tu,\n\n00:59.050 --> 01:01.170\nna itafanya kazi sawa kwa sababu maswali\n\n01:01.170 --> 01:02.110\nsi marefu sana.\n\n01:03.870 --> 01:06.010\nSawa, basi hayo ndiyo yote tunayohitaji\n\n01:06.010 --> 01:07.630\nkama mahitaji ya awali, kwa hiyo\n\n01:07.630 --> 01:09.390\ntutaonana kwenye sehemu inayofuata.\n"}, {"id": "intro/03", "title": "Ufunguo wa Alama", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-intro-03.mp4", "vtt": "WEBVTT\n\n00:00.700 --> 00:01.080\nSawa.\n\n00:01.080 --> 00:03.840\nKaribu kwenye utangulizi huu wa akili\n\n00:03.840 --> 00:05.600\nbandia kutoka LearnAnywhere.org.\n\n00:06.960 --> 00:09.020\nKwa hiyo kabla hatujaanza masomo yote,\n\n00:09.020 --> 00:10.940\nutagundua kuna alama fulani kwenye kona\n\n00:10.940 --> 00:11.820\nya chini kushoto.\n\n00:12.850 --> 00:14.910\nUkiiona alama ya kitabu, hiyo ni ishara\n\n00:14.910 --> 00:17.310\ntu kwamba tunafundisha jambo fulani.\n\n00:17.660 --> 00:19.700\nUkiiona mtu anakimbia, inamaanisha\n\n00:19.700 --> 00:21.580\ntutafanya kitu cha kuhusisha, kama\n\n00:21.580 --> 00:23.200\nmchezo au mazoezi ya vitendo.\n\n00:24.080 --> 00:26.020\nNa ukiiona alama ya wingu, inamaanisha\n\n00:26.020 --> 00:28.780\ntutapata nafasi ya kutafakari kuhusu tulichojifunza.\n\n00:28.780 --> 00:31.880\nSawa, tutaonana kwenye sehemu inayofuata.\n"}]}, {"id": "lesson-1", "kicker": "Somo la 1", "title": "AI ni Nini", "items": [{"id": "lesson-1/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-1-01.mp4", "vtt": "WEBVTT\n\n00:00.880 --> 00:02.560\nSawa, karibu kwenye somo la kwanza\n\n00:02.560 --> 00:04.860\nkuhusu hasa akili bandia ni nini.\n\n00:05.580 --> 00:07.260\nKwa hiyo, lengo la somo la kwanza ni\n\n00:07.260 --> 00:09.240\nkwamba utaelezea sifa kuu zinazofanya\n\n00:09.240 --> 00:10.970\nkitu kiwe na akili bandia, halafu\n\n00:10.970 --> 00:13.140\nutaweza kutambua mifano ya AI na isiyo\n\n00:13.140 --> 00:14.980\nya AI na kueleza kwa nini.\n"}, {"id": "lesson-1/02", "title": "AI ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-1-02.mp4", "vtt": "WEBVTT\n\n00:01.380 --> 00:03.300\nKwa hiyo kabla hata hatujaanza, fikiria\n\n00:03.300 --> 00:05.040\nkuhusu swali hili: Unadhani nini\n\n00:05.040 --> 00:07.480\nkinawafanya binadamu wawe na akili?\n\n00:08.410 --> 00:10.330\nSasa simamisha video na tafakari hilo\n\n00:10.330 --> 00:11.210\nkwa sekunde chache.\n\n00:13.750 --> 00:15.930\nSawa, sasa baada ya kupata muda kidogo,\n\n00:15.930 --> 00:17.630\nkwanza nataka kusema kwamba akili ya\n\n00:17.630 --> 00:19.450\nbinadamu ni ngumu sana.\n\n00:20.040 --> 00:22.000\nLakini tunaweza kuangalia sifa kuu mbili.\n\n00:22.920 --> 00:24.540\nBaadhi ya sifa kuu zinazowafanya\n\n00:24.540 --> 00:26.600\nbinadamu wawe na akili ni uhuru na uwezo\n\n00:26.600 --> 00:27.120\nwa kuzoea.\n\n00:28.700 --> 00:30.560\nKwa hiyo ninaposema uhuru, namaanisha\n\n00:30.560 --> 00:32.980\nbinadamu anayefanya na kufanya maamuzi mwenyewe.\n\n00:33.870 --> 00:35.910\nNa ninaposema uwezo wa kuzoea, ni uwezo\n\n00:35.910 --> 00:38.030\nwa binadamu kujifunza kutokana na uzoefu\n\n00:38.030 --> 00:38.690\nna kuboresha.\n\n00:40.230 --> 00:41.870\nNa kwa hiyo kundi la watu wenye hamu ya\n\n00:41.870 --> 00:43.790\nkujua walijiuliza, tunawezaje kujenga\n\n00:43.790 --> 00:45.770\nvipengele hivi vya akili kwenye mashine?\n\n00:46.970 --> 00:48.630\nNa hapo ndipo uwanja wa akili bandia\n\n00:48.630 --> 00:50.410\nulipoanza, uwanja wa masomo kuhusu\n\n00:50.410 --> 00:52.370\nkutengeneza teknolojia inayofanana na\n\n00:52.370 --> 00:53.810\ntabia za akili.\n\n00:54.940 --> 00:56.440\nNa kwa hiyo baadhi ya mambo muhimu\n\n00:56.440 --> 00:58.880\nyanayofanya AI ionekane ina akili pia ni\n\n00:58.880 --> 01:00.320\nuhuru wake na uwezo wa kuzoea.\n\n01:01.790 --> 01:03.890\nKwa hiyo ninaposema uhuru, namaanisha tu\n\n01:03.890 --> 01:05.970\nuwezo wa teknolojia kusaidia au kufanya\n\n01:05.970 --> 01:08.270\nkazi yenyewe bila kutegemea mtu.\n\n01:08.940 --> 01:10.900\nNa ninaposema uwezo wa kuzoea, ni uwezo\n\n01:10.900 --> 01:12.500\nwa teknolojia kuboresha kadri\n\n01:12.500 --> 01:13.800\ninavyochambua data zaidi.\n\n01:15.770 --> 01:17.530\nNa kwa hiyo baadhi ya mifano tungeweza\n\n01:17.530 --> 01:19.670\nkufikiria ni kama injini yetu ya utafutaji.\n\n01:20.180 --> 01:21.980\nKama umewahi kutumia Google, tayari\n\n01:21.980 --> 01:23.800\numeshawasiliana na aina fulani ya AI.\n\n01:24.380 --> 01:26.340\nIna uhuru kwa sababu inaweza kukusaidia\n\n01:26.340 --> 01:28.040\nkwa kupendekeza maneno yenyewe bila\n\n01:28.040 --> 01:29.140\nkuhitaji msaada wa mtu.\n\n01:29.440 --> 01:31.400\nKama unavyoona, ninapokuwa naandika,\n\n01:31.400 --> 01:33.400\nunaona napata mapendekezo mbalimbali.\n\n01:34.240 --> 01:35.940\nNa pia inakuwa na uwezo wa kuzoea kwa\n\n01:35.940 --> 01:37.900\nsababu inaweza kuboresha mapendekezo\n\n01:37.900 --> 01:39.680\nyake kwa kuchambua utafutaji wa watu wa\n\n01:39.680 --> 01:40.780\nzamani na mengine zaidi.\n\n01:43.050 --> 01:45.310\nSasa, mfano mzuri wa kitu ambacho si AI\n\n01:45.320 --> 01:45.970\nni kalkuleta.\n\n01:46.830 --> 01:48.750\nHaina uhuru kwa sababu inafanya kile tu\n\n01:48.750 --> 01:50.790\nunachoielekeza, hivyo lazima ubofye\n\n01:50.790 --> 01:53.350\nvitufe mwenyewe kwa kila kitu unachotaka kifanyike.\n\n01:54.700 --> 01:56.730\nNa hasa haina uwezo wa kuzoea kwa sababu\n\n01:56.730 --> 01:58.680\nhaiwezi kuchambua data mpya, na kila\n\n01:58.680 --> 02:01.360\nwakati inafanya kazi kwa njia ile ile.\n\n02:02.790 --> 02:04.110\nSawa, sasa ni zamu yako.\n\n02:04.110 --> 02:05.810\nTucheze AI au Sio.\n\n02:06.600 --> 02:07.960\nNitakuambia hali fulani.\n\n02:08.650 --> 02:10.530\nUtachunguza kama inahusisha uhuru na\n\n02:10.530 --> 02:11.310\nuwezo wa kuzoea.\n\n02:11.970 --> 02:14.210\nUtaamua kama ni AI au la, na utashiriki\n\n02:14.210 --> 02:14.890\nsababu zako.\n"}, {"id": "lesson-1/03", "title": "AI au Siyo", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=sw"}, {"id": "lesson-1/04", "title": "Jinsi AI Inavyoweza Kutusaidia", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-1-04.mp4", "vtt": "WEBVTT\n\n00:00.920 --> 00:02.980\nSawa, baada ya kucheza mchezo wa AI au\n\n00:02.980 --> 00:05.040\nSio, sasa nina swali kwako.\n\n00:05.820 --> 00:07.420\nJe, mifano hii ya AI ilikuwa\n\n00:07.420 --> 00:08.340\ninawasaidiaje watu?\n\n00:09.300 --> 00:11.220\nBasi jisikie huru kusitisha video na\n\n00:11.220 --> 00:13.200\nkufikiria kuhusu hilo kwa sekunde chache.\n\n00:15.350 --> 00:17.530\nSawa, baadhi ya njia ambazo teknolojia\n\n00:17.530 --> 00:19.410\nza AI zinaweza kutusaidia ni kwamba\n\n00:19.410 --> 00:21.610\nzinaweza kuboresha ubora wa kazi yetu,\n\n00:21.610 --> 00:23.830\npia zinaweza kufanya sehemu ya kazi yetu\n\n00:23.830 --> 00:26.170\nili tuweze kuzingatia majukumu mengine,\n\n00:26.170 --> 00:28.390\nau pia zinaweza kufanya uzoefu wetu kuwa\n\n00:28.390 --> 00:29.770\nrahisi zaidi.\n\n00:30.540 --> 00:31.960\nKwa hiyo baadhi ya mifano ya watu\n\n00:31.960 --> 00:34.280\nwanaotumia zana za AI kuwasaidia kutatua\n\n00:34.280 --> 00:36.200\nmatatizo halisi inaweza kuwa wakulima.\n\n00:36.910 --> 00:39.030\nUnajua, wakulima wanatumia zana hizi za\n\n00:39.030 --> 00:40.970\nAI kama Plant Village Niru, ambapo\n\n00:40.970 --> 00:42.990\nwanaweza kupiga picha ya jani la mmea na\n\n00:42.990 --> 00:45.010\nkuona kama lina ugonjwa au halina, na\n\n00:45.010 --> 00:46.410\npia kujua jinsi ya kulitibu.\n\n00:47.270 --> 00:49.090\nBaadhi ya wakulima hawa pia wanatumia\n\n00:49.090 --> 00:51.210\nkitu kinachoitwa FarmerChat, ambacho ni\n\n00:51.210 --> 00:53.230\nnjia ya kuzungumza na chatbot ili kupata\n\n00:53.230 --> 00:55.030\nushauri kuhusu kilimo.\n\n00:55.800 --> 00:57.820\nHivyo inawasaidia kufanya maamuzi bora\n\n00:57.820 --> 00:59.880\nzaidi kuhusu jinsi ya kutunza mazao yao\n\n00:59.880 --> 01:00.340\nna udongo.\n\n01:01.550 --> 01:03.610\nTukitazama kwenye muktadha wa madaktari,\n\n01:03.610 --> 01:05.710\nwengi wa hawa madaktari wanatumia picha\n\n01:05.710 --> 01:07.830\nza AI kama X-ray kuwasaidia kuchunguza\n\n01:07.830 --> 01:09.870\ndalili ndogo na ngumu za magonjwa, na\n\n01:09.870 --> 01:12.830\nhii inawasaidia kufanya maamuzi bora zaidi.\n\n01:13.660 --> 01:15.500\nHalafu Suki ni moja ya vitu ambavyo\n\n01:15.500 --> 01:17.680\ndaktari na mgonjwa wanaweza kuzungumza,\n\n01:17.680 --> 01:19.960\nna AI itachukua madokezo kwa ajili yao,\n\n01:19.960 --> 01:22.540\nna hii inamruhusu daktari kumlenga zaidi mgonjwa.\n\n01:25.030 --> 01:26.850\nKwa hiyo moja ya mambo makubwa ambayo\n\n01:26.850 --> 01:28.470\ntutaendelea kusisitiza ni kwamba\n\n01:28.470 --> 01:30.590\nteknolojia ya AI ni chombo, na nasema\n\n01:30.590 --> 01:32.670\nhivyo siyo kwa kudharau uwezo wa AI,\n\n01:32.670 --> 01:34.530\nbali kama ukumbusho kwamba sisi ndiyo\n\n01:34.530 --> 01:36.190\ntunawajibika nayo.\n\n01:36.420 --> 01:38.200\nKwa sababu jambo ni kwamba, watu ndiyo\n\n01:38.200 --> 01:40.840\nwanaamua jinsi ya kutumia hizi kwa mambo wanayoyajali.\n"}, {"id": "lesson-1/05", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=sw"}, {"id": "lesson-1/06", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-1-06.mp4", "vtt": "WEBVTT\n\n00:00.520 --> 00:02.240\nSawa basi, sasa ni muda wa mradi.\n\n00:03.310 --> 00:05.170\nKama unakumbuka Plant Village Niru,\n\n00:05.170 --> 00:06.950\nwakulima walitumia hiki kifaa cha\n\n00:06.950 --> 00:08.990\nkutambua kwa kutumia AI kupiga picha za\n\n00:08.990 --> 00:11.050\nmajani ya mimea ili kuona kama majani\n\n00:11.050 --> 00:12.750\nyao ni magonjwa au la.\n\n00:13.450 --> 00:15.390\nNa sasa ni zamu yako kubuni kifaa chako\n\n00:15.390 --> 00:16.690\ncha kutambua kwa kutumia AI.\n\n00:17.550 --> 00:19.490\nKatika masomo matatu yajayo, utabuni\n\n00:19.490 --> 00:21.470\nkifaa chako cha kutambua kwa kutumia AI\n\n00:21.470 --> 00:23.050\nkwenye mada yoyote utakayochagua.\n\n00:24.230 --> 00:26.190\nInaweza kuwa majani ya mimea, vifaa vya\n\n00:26.190 --> 00:27.990\nshule, au chochote utakachofikiria.\n\n00:30.230 --> 00:31.850\nNa baadhi ya mifano ambayo wanafunzi\n\n00:31.850 --> 00:33.690\nwamefanya ni kwamba, unajua, wengine\n\n00:33.690 --> 00:35.610\nwalizunguka bustani ya shule yao kupiga\n\n00:35.610 --> 00:37.050\npicha za majani ya mimea ili\n\n00:37.050 --> 00:39.030\nkutofautisha kati ya aina mbalimbali za\n\n00:39.030 --> 00:40.970\nmajani kwenye bustani yao ya shule, na,\n\n00:40.970 --> 00:42.950\neh, wengine walipiga picha za vitu\n\n00:42.950 --> 00:44.750\ntofauti kama vikombe vya glasi na\n\n00:44.750 --> 00:45.770\nvikombe vya plastiki.\n\n00:47.010 --> 00:48.910\nNa hata wengine walikuwa wabunifu zaidi\n\n00:48.910 --> 00:50.570\nambapo walitumia lugha ya alama,\n\n00:50.570 --> 00:52.370\nwalipiga picha za mikao mbalimbali ya\n\n00:52.370 --> 00:54.590\nmikono ili kuona ni herufi gani zilikuwa.\n\n00:56.580 --> 00:58.380\nKwa hiyo baada ya kila somo, utaandika\n\n00:58.380 --> 01:00.320\nmajibu yako kwenye karatasi yako ya kazi.\n\n01:00.950 --> 01:02.790\nKama huna karatasi ya kazi, tumia tu\n\n01:02.790 --> 01:04.890\nkipande cha karatasi kuandika majibu yako.\n\n01:06.040 --> 01:08.020\nNa pia mnaweza kufanya kazi kwa vikundi\n\n01:08.020 --> 01:08.940\nkama itahitajika.\n\n01:09.930 --> 01:11.650\nHii hapa ndiyo karatasi ya kazi, na\n\n01:11.650 --> 01:13.370\nmwisho wa haya yote, unapaswa kuwa\n\n01:13.370 --> 01:16.190\numemaliza kuiandika baada ya kumaliza masomo.\n\n01:18.130 --> 01:19.970\nSawa, kwa hiyo baada ya masomo yote,\n\n01:19.970 --> 01:22.050\nunapaswa kuwa umekamilisha karatasi yako\n\n01:22.050 --> 01:24.210\nya kazi na kubuni AI classifier yako kwa\n\n01:24.210 --> 01:25.730\nmada uliyochagua.\n\n01:25.920 --> 01:27.760\nKwa hiyo mwalimu wenu anaweza kupanga\n\n01:27.760 --> 01:29.720\nsiku ya uwasilishaji wa hiari ambapo\n\n01:29.720 --> 01:31.840\nmtaonyesha AI classifier yenu na majibu\n\n01:31.840 --> 01:33.180\nyenu kwenye karatasi ya kazi.\n\n01:35.250 --> 01:37.290\nSawa, basi hebu tuanze kujibu swali la\n\n01:37.290 --> 01:38.710\nkwanza kwenye karatasi ya kazi.\n\n01:41.480 --> 01:43.260\nKwa hiyo utaanza kwa kujibu tu somo la\n\n01:43.260 --> 01:45.840\nkwanza, ambalo ni kuchagua mada yako ya uainishaji.\n\n01:47.010 --> 01:49.010\nChagua mada ambayo ungependa kuchunguza\n\n01:49.010 --> 01:50.950\nkwa ajili ya uainishaji wa AI yako na\n\n01:50.950 --> 01:52.310\neleza kwa nini umeichagua.\n\n01:53.560 --> 01:55.360\nHuu ni mfano wa kile mwanafunzi mmoja\n\n01:55.360 --> 01:57.360\nameandika, \"Nataka kuainisha matunda kwa\n\n01:57.360 --> 01:59.680\nsababu napenda matunda na ni rahisi kuyapata.\n\n01:59.680 --> 02:02.180\nWatu wengi wanaonizunguka wanakuza\n\n02:02.180 --> 02:04.060\nmatunda, kwa hiyo naweza kuleta aina\n\n02:04.060 --> 02:06.540\nmbalimbali kutumia kwenye mradi wangu.\"\n"}, {"id": "lesson-1/07", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=sw"}]}, {"id": "lesson-2", "kicker": "Somo la 2", "title": "Sehemu Muhimu za Kujifunza kwa Mashine", "items": [{"id": "lesson-2/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-2-01.mp4", "vtt": "WEBVTT\n\n00:00.620 --> 00:02.700\nSawa, karibu kwenye somo la pili, ambapo\n\n00:02.700 --> 00:05.800\ntutaongelea sehemu kuu za ujifunzaji wa mashine.\n\n00:06.830 --> 00:08.770\nHivyo basi, lengo la somo la pili ni\n\n00:08.770 --> 00:10.790\nkwamba tutaweza kuelezea ujifunzaji wa\n\n00:10.790 --> 00:11.610\nmashine ni nini.\n\n00:12.380 --> 00:14.020\nTutaweza kutambua sehemu kuu za\n\n00:14.020 --> 00:15.060\nujifunzaji wa mashine.\n\n00:15.720 --> 00:17.480\nTutaelezea kwa nini au kila sehemu\n\n00:17.480 --> 00:19.420\ninafanya nini na jinsi zinavyofanya kazi\n\n00:19.420 --> 00:21.080\npamoja, na utaelezea jinsi data\n\n00:21.080 --> 00:23.500\ninavyoathiri jinsi AI inavyofanya kazi vizuri.\n"}, {"id": "lesson-2/02", "title": "Kujifunza kwa Mashine ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-2-02.mp4", "vtt": "WEBVTT\n\n00:00.820 --> 00:02.780\nSawa, sasa unaandaje mtihani hasa?\n\n00:04.160 --> 00:05.880\nFikiria hili kwa sekunde chache tu.\n\n00:06.900 --> 00:08.880\nSawa, basi binadamu anapojiandaa kwa\n\n00:08.880 --> 00:10.840\nmtihani, kitu cha kwanza unachofanya ni\n\n00:10.840 --> 00:12.760\nkukusanya taarifa fulani, na taarifa\n\n00:12.760 --> 00:14.540\nhizo zinaweza kuwa katika mfumo wa\n\n00:14.540 --> 00:16.120\ndondoo za darasani.\n\n00:16.330 --> 00:18.330\nKwa hiyo ukishapata dondoo zako, utaanza\n\n00:18.330 --> 00:20.090\nkuzisoma, na kinachotokea ni kwamba\n\n00:20.090 --> 00:22.030\nubongo wako utaunganisha taarifa hizo\n\n00:22.030 --> 00:23.850\nmpya na uzoefu wako wa maisha ili\n\n00:23.850 --> 00:26.330\nkuelewa vizuri zaidi mambo duniani.\n\n00:27.000 --> 00:29.020\nNa kinachotokea kadri muda unavyosonga\n\n00:29.020 --> 00:30.780\nni kwamba utakuwa umejiandaa vizuri\n\n00:30.780 --> 00:32.700\nzaidi kufanya mtihani unapounganisha\n\n00:32.700 --> 00:34.580\ntaarifa mpya na maarifa yako ya awali.\n\n00:36.070 --> 00:37.790\nKwa hiyo sehemu nne za kujiandaa kwa\n\n00:37.790 --> 00:39.790\nmtihani ni: ubongo, ambapo ubongo\n\n00:39.790 --> 00:42.050\nkimsingi unachukua dondoo, unasoma hizo\n\n00:42.050 --> 00:43.930\ndondoo, na matokeo yake, unakuwa na\n\n00:43.930 --> 00:46.730\nubongo uliojiandaa zaidi kufanya mtihani.\n\n00:47.710 --> 00:50.130\nKwa hiyo ubongo ndio kitu kinachofanya kujifunza.\n\n00:51.060 --> 00:53.260\nDondoo ni kimsingi taarifa ambazo utasoma.\n\n00:54.120 --> 00:56.080\nKusoma ni kimsingi muda na mchakato wa\n\n00:56.080 --> 00:57.920\nkuunganisha mawazo haya mapya na yale\n\n00:57.920 --> 01:00.120\nunayoyajua tayari, na ubongo uliojiandaa\n\n01:00.120 --> 01:01.660\nndio matokeo yake.\n\n01:01.950 --> 01:03.730\nKwa hiyo baada ya kusoma hizo dondoo,\n\n01:03.730 --> 01:05.830\nunakuwa tayari kimsingi kufanya mtihani.\n\n01:07.570 --> 01:09.610\nKwa hiyo kujifunza kwa binadamu, na wazo\n\n01:09.610 --> 01:11.710\nkuu la kujifunza kwa binadamu, ni kwamba\n\n01:11.710 --> 01:13.700\nunajenga uelewa kwa kuunganisha taarifa\n\n01:13.700 --> 01:15.850\nmpya na uzoefu wako wa maisha ili uweze\n\n01:15.850 --> 01:17.230\nkuelewa dunia.\n\n01:17.490 --> 01:19.050\nSasa, kujifunza kwa binadamu\n\n01:19.050 --> 01:21.370\nkunalinganishwaje hasa na kujifunza kwa mashine?\n\n01:21.370 --> 01:24.770\nSasa, kuhusu kujifunza kwa mashine, na\n\n01:24.770 --> 01:26.390\ntutaingia kwa undani zaidi kuhusu\n\n01:26.390 --> 01:28.410\ntunachomaanisha hapa, ni kwamba kimsingi\n\n01:28.410 --> 01:30.510\nkunatumia maagizo ya kihisabati kutafuta\n\n01:30.510 --> 01:32.430\nmifumo kwenye data ili kufanya utabiri.\n\n01:33.830 --> 01:35.530\nNa baadhi ya sehemu za kujifunza kwa\n\n01:35.530 --> 01:37.490\nmashine ni kwamba kuna mfano (model).\n\n01:38.430 --> 01:40.430\nMfano huo unapokea data, na kimsingi\n\n01:40.430 --> 01:42.370\nmafunzo ni pale tunapojaribu kutafuta\n\n01:42.370 --> 01:44.310\nmifumo kwenye data hiyo, halafu unakuwa\n\n01:44.310 --> 01:46.150\nna mfano uliopata mafunzo kama vile\n\n01:46.150 --> 01:48.030\nkigunduzi cha magonjwa ya mimea ambacho\n\n01:48.030 --> 01:49.990\nkinaweza kutabiri magonjwa ya mimea au\n\n01:49.990 --> 01:51.230\nkama mmea ni mgonjwa au la.\n\n01:52.690 --> 01:54.610\nKwa hiyo, sehemu nne kuu za kujifunza\n\n01:54.610 --> 01:56.310\nkwa mashine kwa undani ni kwamba mfano\n\n01:56.310 --> 01:58.630\n(model) ndio kitu kinachoshika ile mifumo.\n\n01:59.870 --> 02:01.850\nData ni taarifa tu tunazompa mfano\n\n02:01.850 --> 02:03.370\nambazo atazitumia kujifunzia.\n\n02:05.130 --> 02:07.430\nMafunzo (training) kimsingi ni mchakato\n\n02:07.430 --> 02:09.690\nambapo mfano unatumia kuchambua data ili\n\n02:09.690 --> 02:10.470\nkupata mifumo.\n\n02:11.670 --> 02:13.600\nNa tena, mfano uliopata mafunzo ni\n\n02:13.600 --> 02:15.240\nmatokeo baada ya mfano kumaliza\n\n02:15.240 --> 02:17.700\nkujifunza, na sasa uko tayari kufanya utabiri.\n\n02:20.350 --> 02:22.430\nHivyo, ingawa mashine inachakata taarifa\n\n02:22.430 --> 02:24.330\nkwa njia tofauti, bado zote mbili\n\n02:24.330 --> 02:26.550\nzinashirikiana sehemu zinazofanana, sivyo?\n\n02:27.470 --> 02:29.450\nKwa hiyo, ubongo ni sawa na mfano, noti\n\n02:29.450 --> 02:31.050\nni sawa na data, kusoma ni sawa na\n\n02:31.050 --> 02:32.810\nmafunzo, na kuandaa ubongo ni sawa na\n\n02:32.810 --> 02:34.070\nmfano uliopata mafunzo.\n\n02:34.070 --> 02:36.870\nHazifanani kabisa, lakini zinashirikiana\n\n02:36.870 --> 02:38.330\nhatua zinazofanana za jinsi\n\n02:38.330 --> 02:40.050\nzinavyokaribia kujifunza kwao.\n"}, {"id": "lesson-2/04", "title": "Jinsi ya Kutumia NeuroPocket", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-2-04.mp4", "vtt": "WEBVTT\n\n00:00.720 --> 00:02.540\nSawa, tumezungumzia sehemu kuu za\n\n00:02.540 --> 00:04.820\nujifunzaji wa mashine, kama vile mfano,\n\n00:04.820 --> 00:06.760\ndata, mafunzo, na mfano uliopata\n\n00:06.760 --> 00:08.900\nmafunzo, lakini ni vigumu sana kuona\n\n00:08.900 --> 00:11.740\njinsi sehemu hizi tofauti zinavyoungana.\n\n00:12.440 --> 00:14.420\nBasi hebu tuone jinsi sehemu hizi kuu\n\n00:14.420 --> 00:16.120\nzinavyoungana kwa kubuni kifaa cha\n\n00:16.120 --> 00:17.700\nkuchambua kwa kutumia Nearpocket.\n\n00:19.250 --> 00:20.830\nSasa, Nearpocket ni nini hasa?\n\n00:21.880 --> 00:23.880\nNearpocket ni programu ya AI ambapo\n\n00:23.880 --> 00:25.600\nunaweza kuongeza picha, kufundisha\n\n00:25.600 --> 00:28.240\nmfano, na kuona jinsi AI inavyotambua vitu.\n\n00:29.790 --> 00:31.610\nNa tayari umeona mifano kadhaa kwenye\n\n00:31.610 --> 00:33.570\nNearpocket katika mfano wa mwanafunzi.\n\n00:34.640 --> 00:36.640\nUmeona wanafunzi waliweza kutofautisha\n\n00:36.640 --> 00:38.460\nkati ya majani ya mimea tofauti,\n\n00:38.460 --> 00:40.240\nwaliweza kutofautisha kati ya vifaa\n\n00:40.240 --> 00:42.880\ntofauti, na hata lugha ya alama pia.\n\n00:43.660 --> 00:45.720\nKwa hiyo tutajifunza Nearpocket pamoja\n\n00:45.720 --> 00:47.280\nkwa kufanya kila hatua pamoja.\n\n00:48.150 --> 00:50.250\nKwa hiyo unapopita kila hatua, jisikie\n\n00:50.250 --> 00:51.990\nhuru kusitisha video ili uweze\n\n00:51.990 --> 00:54.090\nkukamilisha jukumu au hatua kabla ya\n\n00:54.090 --> 00:55.310\nkuendelea na inayofuata.\n\n00:56.860 --> 00:58.780\nNa bila shaka, kama unafanya kazi kwa\n\n00:58.780 --> 01:00.820\nmakundi au darasani, kama utamaliza\n\n01:00.820 --> 01:03.000\nmapema, saidia wengine waliokuzunguka\n\n01:03.000 --> 01:05.020\nili tuweze kwenda hatua inayofuata kwa\n\n01:05.020 --> 01:06.500\nharaka pamoja.\n\n01:08.480 --> 01:09.940\nSawa, kwa hiyo kitu cha kwanza\n\n01:09.940 --> 01:11.960\nnitakachofanya ni kufungua app yangu ya\n\n01:11.960 --> 01:14.220\nNearpocket, na nitaipa jina mradi wangu\n\n01:14.220 --> 01:15.700\nkuwa Mradi wa Vifaa vya Shuleni.\n\n01:15.990 --> 01:18.050\nInaweza kuwa jina lolote unalotaka, ni\n\n01:18.050 --> 01:19.470\njina tu la mradi wako.\n\n01:19.470 --> 01:21.810\nNa mara tu unapobofya Unda, itakupeleka\n\n01:21.820 --> 01:23.750\nmoja kwa moja ndani ya huo mradi.\n\n01:23.750 --> 01:26.030\nKwa hiyo naweza kuwa na makundi zaidi ya mawili.\n\n01:26.330 --> 01:28.210\nKwa upande wangu, nataka kutofautisha\n\n01:28.210 --> 01:30.230\nkati ya makundi ya mkasi na kalamu ndani\n\n01:30.230 --> 01:30.650\nya hapo.\n\n01:32.250 --> 01:34.210\nSasa, baada ya kuunda angalau makundi\n\n01:34.210 --> 01:36.210\nyangu mawili, sasa nitaongeza picha kwa\n\n01:36.210 --> 01:36.710\nkila kundi.\n\n01:37.610 --> 01:39.690\nKwa upande wangu, kwa sababu nina mkasi,\n\n01:39.690 --> 01:41.310\nnitapiga picha za mkasi kadhaa.\n\n01:42.310 --> 01:44.570\nKatika hali hii, nimepiga takriban picha\n\n01:44.570 --> 01:46.290\nsita, halafu naongeza hizo picha.\n\n01:47.230 --> 01:49.530\nUnaweza kupiga picha zaidi ya hizo kama unataka.\n\n01:49.740 --> 01:51.960\nHalafu sasa nitapiga picha za kalamu kadhaa.\n\n01:53.230 --> 01:55.470\nNa kwa upande wangu, pia nimepiga picha\n\n01:55.470 --> 01:56.890\nsita za kalamu.\n\n01:57.060 --> 01:58.920\nNa kama nilivyosema, unaweza kuwa na\n\n01:58.920 --> 02:00.480\nmamia ya picha kama ungependa.\n\n02:00.480 --> 02:02.420\nKwa upande wangu, nafanya haraka tu.\n\n02:02.420 --> 02:04.480\nKisha utaongeza picha, na sasa umeongeza\n\n02:04.480 --> 02:05.640\ndata kwenye makundi yako.\n\n02:06.270 --> 02:08.070\nLakini unaweza kuwa na makundi zaidi ya\n\n02:08.070 --> 02:10.110\nmawili kama ungependa, kwa hiyo kimsingi\n\n02:10.110 --> 02:11.650\nningeweza kuunda kundi kama la\n\n02:11.650 --> 02:13.410\nvipingirishi, lakini kwa urahisi,\n\n02:13.410 --> 02:14.450\ntutaendelea na haya tu.\n\n02:15.090 --> 02:16.970\nKisha utaenda kwenye sehemu ya mafunzo,\n\n02:16.970 --> 02:19.540\nhalafu utabonyeza tu kitufe cha Fundisha Mfano.\n\n02:19.540 --> 02:21.570\nNa hii itachukua dakika chache, kwa hiyo\n\n02:21.570 --> 02:22.910\ntutasubiri tu imalizike.\n\n02:31.460 --> 02:33.540\nSawa, sasa hebu tujaribu mfano wetu.\n\n02:34.290 --> 02:36.170\nKwa hiyo kitu cha kwanza nitakachofanya\n\n02:36.170 --> 02:38.110\nni kupiga picha ya kalamu yangu ikiwa\n\n02:38.110 --> 02:40.010\nkwenye nafasi tofauti na kuona kama\n\n02:40.010 --> 02:40.990\nitaigundua vizuri.\n\n02:41.740 --> 02:43.740\nNa unaweza kuona inasema hii ni kalamu.\n\n02:44.200 --> 02:46.240\nHalafu sasa nitaijaribu na mkasi wangu\n\n02:46.240 --> 02:47.880\nkwenye nafasi nyingine tofauti,\n\n02:47.880 --> 02:49.840\ninaitambua, na unaweza kuona kweli\n\n02:49.840 --> 02:51.260\ninaiita mkasi.\n\n02:51.530 --> 02:53.670\nSawa, basi huo ndiyo mtambuzi wako wa AI.\n\n02:54.340 --> 02:56.260\nNa uko huru kuongeza data zaidi ili\n\n02:56.260 --> 02:57.480\nkuboresha mtambuzi wako.\n"}, {"id": "lesson-2/03", "title": "Fungua NeuroPocket", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "Zana za AI Zinaweza Kufanya Makosa", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-2-05.mp4", "vtt": "WEBVTT\n\n00:00.880 --> 00:02.340\nSawa, basi karibu tena.\n\n00:02.790 --> 00:04.690\nBaada ya kupata muda wa kucheza na Near\n\n00:04.690 --> 00:07.030\nPocket, je, kichanganuzi chako cha AI\n\n00:07.030 --> 00:08.470\nkilikuwa sahihi kila wakati?\n\n00:09.130 --> 00:11.310\nNa kama haikuwa hivyo, unadhani kwa nini\n\n00:11.310 --> 00:12.450\nkilifanya kosa hilo?\n\n00:12.450 --> 00:14.410\nBasi jisikie huru kusitisha video na\n\n00:14.410 --> 00:16.430\nkufikiria kuhusu hilo kwa sekunde chache.\n\n00:19.410 --> 00:21.710\nSawa, kitu kuhusu zana za AI ni kwamba\n\n00:21.710 --> 00:24.490\nzinaweza kukupa matokeo usiyotarajia.\n\n00:25.010 --> 00:27.230\nKitu ambacho ni dhahiri kwako, hakiwezi\n\n00:27.230 --> 00:28.650\nkuwa dhahiri kwa zana ya AI.\n\n00:30.020 --> 00:32.060\nKwa hiyo, kitu kuhusu zana za AI ni\n\n00:32.060 --> 00:34.360\nkwamba haziwezi kuelewa kama binadamu,\n\n00:34.360 --> 00:36.500\nhivyo zinahitaji kuchambua kila undani\n\n00:36.500 --> 00:38.900\nkwenye picha ili kutafuta mifumo.\n\n00:39.490 --> 00:41.410\nNa wakati mwingine, hiyo inamaanisha\n\n00:41.410 --> 00:43.710\nkwamba zinapata au kutumia mifumo ambayo\n\n00:43.710 --> 00:46.710\nsisi hatujawahi kuifikiria kabla.\n\n00:46.710 --> 00:48.750\nKwa mfano, unaweza kuona hapa kwamba\n\n00:48.750 --> 00:50.730\ntuna mkasi wazi kabisa, lakini kwa\n\n00:50.730 --> 00:52.830\nsababu uko kwenye nafasi ile ile kama\n\n00:52.830 --> 00:55.030\npenseli ya rangi hapa, na pia una rangi\n\n00:55.030 --> 00:57.230\nsawa, umechukuliwa kama penseli ya rangi.\n\n00:59.480 --> 01:01.560\nNa pia, kitu kuhusu mifumo ya AI ni\n\n01:01.560 --> 01:03.780\nkwamba imewekewa mipaka sana na data yake.\n\n01:04.530 --> 01:06.270\nInaweza kutabiri tu kwa ufanisi\n\n01:06.270 --> 01:08.070\nkulingana na kile ilichowahi kuchambua\n\n01:08.070 --> 01:09.210\nhapo awali.\n\n01:09.210 --> 01:11.250\nKwa hiyo unaweza kuona kwamba kigunduzi\n\n01:11.250 --> 01:13.090\nchetu cha magonjwa ya mimea kinashindwa\n\n01:13.090 --> 01:14.770\nkwa sababu hakijawahi kuona wala\n\n01:14.770 --> 01:16.870\nkuchambua nyasi kabla, na unaweza kuona\n\n01:16.870 --> 01:18.890\nwazi kabisa kwamba kinaiita nyasi hiyo\n\n01:18.890 --> 01:21.030\nkuwa ni peach yenye afya, kitu ambacho\n\n01:21.030 --> 01:22.050\nsi kweli.\n\n01:22.050 --> 01:24.210\nNa hili halihusiani tu na picha, bali\n\n01:24.210 --> 01:25.530\npia na lugha pia, sivyo?\n\n01:26.150 --> 01:27.990\nKifaa cha AI kinaweza kujibu tu\n\n01:27.990 --> 01:29.930\nkulingana na lugha ambazo kilifundishwa.\n\n01:30.720 --> 01:32.800\nKwa mfano huu, nazungumza kwa Kihindi,\n\n01:32.800 --> 01:34.660\nkama vile, \"Hali ya hewa ikoje leo?\n\n01:34.660 --> 01:36.280\nJina lako nani?\n\n01:36.280 --> 01:38.500\nMbili jumlisha mbili ni ngapi?\"\n\n01:38.760 --> 01:40.440\nNa kwa sababu hiki kifaa cha AI\n\n01:40.440 --> 01:42.280\nhakijawahi kuchambua data ya Kihindi\n\n01:42.280 --> 01:44.620\nkabla, kitaendelea kurudia sentensi ile\n\n01:44.620 --> 01:46.160\nile ya Kiingereza, ambayo ndiyo\n\n01:46.160 --> 01:48.460\ninayoijua, \"I am good, and you?\" mara\n\n01:48.460 --> 01:48.880\nkwa mara.\n\n01:49.800 --> 01:51.680\nHivyo hii inaingia moja kwa moja kwenye\n\n01:51.680 --> 01:53.680\ndhana hii ya kwamba, kile kinachoingia,\n\n01:53.680 --> 01:54.620\nndicho kinachotoka.\n\n01:55.020 --> 01:57.180\nKwa hiyo, kwenye ujifunzaji wa mashine,\n\n01:57.180 --> 01:59.400\nkama data ni ndogo, inamaanisha utabiri\n\n01:59.400 --> 02:01.400\nwa mfano pia utakuwa mdogo vilevile.\n"}, {"id": "lesson-2/06", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=sw"}, {"id": "lesson-2/07", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-2-07.mp4", "vtt": "WEBVTT\n\n00:00.600 --> 00:02.640\nSawa, ni muda wa mradi kwa somo la pili.\n\n00:04.100 --> 00:05.600\nKwa hiyo umekuwa na muda wa kufanya\n\n00:05.600 --> 00:07.800\nmazoezi kidogo, lakini sasa ni wakati\n\n00:07.800 --> 00:09.460\nwako kuchunguza mazingira yako na\n\n00:09.460 --> 00:11.280\nkukusanya takwimu kwa ajili ya mada\n\n00:11.280 --> 00:13.000\nuliyoiamua kwenye somo la kwanza.\n\n00:13.920 --> 00:16.060\nNa kumbuka, mada yako inaweza kubadilika\n\n00:16.060 --> 00:18.020\nwakati wowote unapoendelea na karatasi\n\n00:18.020 --> 00:18.480\nya kazi.\n\n00:18.480 --> 00:21.600\nPia, sasa hakikisha unajibu swali la\n\n00:21.600 --> 00:23.660\nsomo la pili kwenye karatasi yako ya kazi.\n\n00:25.420 --> 00:27.160\nKwa hiyo, somo la pili linahusu\n\n00:27.160 --> 00:28.380\nukusanyaji wa takwimu.\n\n00:28.380 --> 00:30.840\nKwa hiyo utatuambia ni vitu gani\n\n00:30.840 --> 00:33.340\nutakavyopanga na utakusanya vipi takwimu zako.\n\n00:33.920 --> 00:35.640\nHivyo, mfano wa jibu kutoka kwa\n\n00:35.640 --> 00:36.480\nmwanafunzi ni huu.\n\n00:37.030 --> 00:38.730\n\"Vitu nitakavyopanga ni ndizi,\n\n00:38.730 --> 00:40.190\nmachungwa, na maparachichi.\n\n00:40.190 --> 00:43.110\nNitaleta matunda kutoka nyumbani kwangu\n\n00:43.110 --> 00:44.810\nau nitaenda kwenye bustani ya shule\n\n00:44.810 --> 00:46.190\nkupiga picha.\"\n\n00:47.190 --> 00:47.510\nSawa?\n\n00:47.940 --> 00:49.880\nKwa hiyo utajibu somo la pili, na pia\n\n00:49.880 --> 00:52.080\nkama mwalimu wako atakuruhusu, unaweza\n\n00:52.080 --> 00:53.720\npia kuzunguka kwenye mazingira yako\n\n00:53.720 --> 00:55.860\nkupiga picha zaidi ili kuongeza kwenye...\n\n00:55.860 --> 00:57.800\nau kuboresha kifaa chako cha kutambua\n\n00:57.800 --> 00:58.920\nvitu kwa kutumia AI.\n"}, {"id": "lesson-2/08", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=sw"}]}, {"id": "lesson-3", "kicker": "Somo la 3", "title": "Mashine Hujifunzaje", "items": [{"id": "lesson-3/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-01.mp4", "vtt": "WEBVTT\n\n00:00.880 --> 00:02.920\nSawa, karibu kwenye somo la tatu:\n\n00:02.920 --> 00:04.240\nMashine hujifunza vipi?\n\n00:06.030 --> 00:08.270\nKama unakumbuka kwenye somo lililopita,\n\n00:08.270 --> 00:10.230\ntulizungumza kuhusu sehemu kuu za\n\n00:10.230 --> 00:12.670\nujifunzaji wa mashine, ambapo una mfano\n\n00:12.670 --> 00:15.290\nwako, na kwenye huo mfano unaupa data,\n\n00:15.290 --> 00:17.250\nhalafu mwisho kuna mchakato wa mafunzo\n\n00:17.250 --> 00:19.370\nambapo mfano huo hutumia muda huo\n\n00:19.370 --> 00:21.310\nkuchambua data zote ulizompa ili\n\n00:21.310 --> 00:22.950\nkutafuta mifumo.\n\n00:24.210 --> 00:26.330\nLakini mchakato wa mafunzo ya ujifunzaji\n\n00:26.330 --> 00:28.170\nwa mashine hufanya kazi vipi hasa?\n\n00:29.280 --> 00:31.060\nNa hicho ndicho tutakachoelewa kwenye\n\n00:31.060 --> 00:31.840\nsomo la tatu.\n\n00:32.590 --> 00:34.310\nHivyo lengo ni kwamba utaelezea\n\n00:34.310 --> 00:36.530\nalgorithm ni nini na kutoa mifano halisi\n\n00:36.530 --> 00:37.030\nya maisha.\n\n00:38.410 --> 00:40.450\nUtaelezea kwa nini mashine zinahitaji\n\n00:40.450 --> 00:42.050\nalgorithms ili kufanya kazi.\n\n00:42.700 --> 00:45.000\nUtaelezea hatua ambazo mashine hufuata\n\n00:45.000 --> 00:45.980\nwakati wa mafunzo.\n\n00:46.740 --> 00:49.060\nNa mwisho, utalinganisha jinsi binadamu\n\n00:49.060 --> 00:51.100\nna mashine wanavyoshughulikia taarifa\n\n00:51.100 --> 00:52.140\nkwa njia tofauti.\n"}, {"id": "lesson-3/02", "title": "Mchezo wa Describer Drawer — Maelekezo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-02.mp4", "vtt": "WEBVTT\n\n00:00.360 --> 00:02.700\nSawa, basi kuanza hili, hebu tucheze\n\n00:02.700 --> 00:04.560\nmchezo wa mwelekezi na mchoraji.\n\n00:04.560 --> 00:07.700\nMchezo huu unahitaji wachezaji wawili au\n\n00:07.700 --> 00:09.980\nzaidi, lakini usijali kama huna mtu\n\n00:09.980 --> 00:12.220\nmwingine wa kucheza naye na unafanya mwenyewe.\n\n00:12.730 --> 00:14.890\nTuna video inayoonyesha sisi tukicheza\n\n00:14.890 --> 00:18.990\nmchezo huu, hivyo utaweza kuona jinsi unavyofanyika.\n\n00:18.990 --> 00:21.130\nKwa hiyo, ukishapata mtu wa kucheza\n\n00:21.130 --> 00:24.650\nnaye, utakuwa tayari kabisa kwa ajili ya mchezo.\n\n00:24.650 --> 00:25.170\nSawa?\n\n00:25.660 --> 00:27.680\nLakini bado hebu tuendelee kupitia\n\n00:27.680 --> 00:29.500\nmaelekezo hadi wakati huo.\n\n00:29.500 --> 00:32.020\nSasa, jinsi mchezo unavyofanya kazi ni\n\n00:32.020 --> 00:34.120\nkwamba mtakuwa mnafanya kazi kwa jozi.\n\n00:34.120 --> 00:36.400\nKwa hiyo tena, unahitaji kuwa na watu\n\n00:36.400 --> 00:37.540\nwawili angalau.\n\n00:37.540 --> 00:39.960\nMtu mmoja atakuwa anaelezea, na mwingine\n\n00:39.960 --> 00:40.960\natakuwa anachora.\n\n00:41.800 --> 00:44.060\nKama una mwalimu, basi mwalimu huyo\n\n00:44.060 --> 00:46.340\natachora mchoro rahisi wenye umbo tatu\n\n00:46.340 --> 00:48.820\nhadi tano za msingi katika nafasi yoyote.\n\n00:50.100 --> 00:52.480\nKwa hiyo mchoro unaweza kuwa rahisi kama\n\n00:52.480 --> 00:55.660\nhuu, na unaweza pia kuwa mgumu kama huu.\n\n00:56.840 --> 00:59.400\nKama hakuna mwalimu, basi yule anaelezea\n\n00:59.400 --> 01:00.900\nndiye atakayefanya mchoro.\n\n01:03.050 --> 01:05.590\nSasa, mara tu mchoro utakapokuwa tayari,\n\n01:05.590 --> 01:07.230\nni yule anaelezea pekee ndiye\n\n01:07.230 --> 01:08.630\nanayeruhusiwa kuutazama.\n\n01:10.160 --> 01:12.480\nKwa hiyo anaelezea atamwambia mchoraji\n\n01:12.480 --> 01:14.680\njinsi ya kuuchora tena ule mchoro kwa\n\n01:14.680 --> 01:16.620\nkutumia maelekezo ya mdomo pekee.\n\n01:17.490 --> 01:19.810\nWanaweza tu kuzungumza kuhusu jinsi ya\n\n01:19.810 --> 01:21.350\nkuuchora tena ule mchoro.\n\n01:21.350 --> 01:24.130\nMikono yako inapaswa kuwa nyuma ya\n\n01:24.130 --> 01:24.830\nmgongo wako.\n\n01:24.830 --> 01:28.190\nHakuna kuruhusiwa kuonyesha kwa kidole kabisa.\n\n01:28.190 --> 01:31.350\nNa hivyo basi, wakati huo mchoraji\n\n01:31.350 --> 01:33.850\nanapojaribu kuuchora tena ule mchoro,\n\n01:33.850 --> 01:35.690\nbaada ya dakika mbili, mchoraji\n\n01:35.690 --> 01:37.910\natalinganisha mchoro wake na ule mchoro\n\n01:37.910 --> 01:40.170\nhalisi au mchoro wa mwalimu ili aone\n\n01:40.170 --> 01:41.750\nkama umefanana kiasi gani.\n\n01:41.950 --> 01:44.050\nNa hivyo mwishowe, baada ya hayo yote\n\n01:44.050 --> 01:46.170\nkukamilika, hiyo ni raundi moja.\n\n01:46.170 --> 01:48.530\nMtabadilishana nafasi na kurudia tena.\n\n01:48.690 --> 01:50.450\nKwa hiyo sasa anaelezea anakuwa\n\n01:50.450 --> 01:52.990\nmchoraji, na mchoraji anakuwa anaelezea.\n\n01:52.990 --> 01:56.390\nSawa, basi hebu tuanze kucheza huu\n\n01:56.390 --> 01:57.900\nmchezo, sawa?\n\n01:57.900 --> 02:00.100\nBasi tujaribu kufanya angalau raundi\n\n02:00.100 --> 02:02.450\nmbili, na nitawaona kwenye ile inayofuata.\n"}, {"id": "lesson-3/03", "title": "Mchezo wa Describer Drawer — Onyesho", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-03.mp4", "vtt": "WEBVTT\n\n00:02.460 --> 00:04.320\nSawa, kwa hivyo tutafanya shughuli\n\n00:04.320 --> 00:06.520\ninayoitwa Mchezo wa Mwelezaji na Mchoraji.\n\n00:07.630 --> 00:10.650\nNa mchezo huu ni rahisi sana.\n\n00:10.650 --> 00:13.050\nMimi, mwalimu, nitachora mchoro rahisi\n\n00:13.050 --> 00:14.950\nsana ambao utakuwa na maumbo matatu tu\n\n00:14.950 --> 00:16.410\nya kijiometri.\n\n00:17.120 --> 00:19.180\nHiyo inaweza kuwa mraba, inaweza kuwa\n\n00:19.180 --> 00:21.580\nduara, inaweza kuwa pembetatu, inaweza\n\n00:21.580 --> 00:24.700\nkuwa almasi, inaweza kuwa chochote, sivyo?\n\n00:25.080 --> 00:27.140\nLakini kimsingi ni maumbo matatu rahisi\n\n00:27.140 --> 00:29.700\nambayo unaweza kuyaweka kwa njia yoyote unayotaka.\n\n00:30.670 --> 00:32.330\nNa kwa hivyo nitakachofanya hapa...\n\n00:32.330 --> 00:35.450\nNi kwamba nitachora labda kitu rahisi\n\n00:35.450 --> 00:35.950\nkama hiki.\n\n00:41.810 --> 00:43.670\nKwa hivyo huu ni mfano rahisi ambao\n\n00:43.670 --> 00:44.610\nnitakuwa nikichora.\n\n00:45.280 --> 00:47.020\nNa kwa hivyo kitakachotokea ni kama\n\n00:47.020 --> 00:48.920\nmwalimu, baada ya kutengeneza michoro\n\n00:48.920 --> 00:50.540\nyangu, sasa nitakuwa na walimu wangu.\n\n00:51.500 --> 00:53.420\nAu wanafunzi wangu watafanya kazi kwa\n\n00:53.420 --> 00:54.240\njozi, sivyo?\n\n00:54.440 --> 00:56.160\nNa kwa hivyo kimsingi, wanafunzi\n\n00:56.160 --> 00:58.160\nwanapofanya kazi kwa jozi, kutakuwa na\n\n00:58.160 --> 00:59.000\nmajukumu mawili.\n\n00:59.080 --> 01:01.280\nKutakuwa na mwelezaji na kutakuwa na mchoraji.\n\n01:01.280 --> 01:04.200\nKwa hivyo nani hapa atakuwa mwelezaji\n\n01:04.200 --> 01:05.100\nkatika nafasi hii?\n\n01:06.170 --> 01:07.910\nOh, mimi nitakuwa mwelezaji.\n\n01:08.230 --> 01:10.210\nSawa, na Karen atakuwa mchoraji.\n\n01:10.210 --> 01:13.370\nKwa hivyo tena, wazo zima ni kwamba\n\n01:13.370 --> 01:15.630\nmwelezaji ndiye mtu pekee anayeruhusiwa\n\n01:15.630 --> 01:17.470\nkuja nyuma ya mchoro huu uliofichwa.\n\n01:18.810 --> 01:20.850\nNa kimsingi kurudi kwa mchoraji kutoa\n\n01:20.850 --> 01:22.630\nmaelekezo ya jinsi ya kuchora tena\n\n01:22.630 --> 01:23.310\nmichoro hiyo.\n\n01:24.610 --> 01:26.530\nNa kwa hivyo ujanja ni kwamba mwelezaji\n\n01:26.530 --> 01:28.890\nanaweza kuja mara nyingi kadiri anavyotaka.\n\n01:29.410 --> 01:31.570\nHata hivyo, wanaweza kutoa maelekezo ya\n\n01:31.570 --> 01:33.550\nmaneno tu na lazima wasimame nyuma ya\n\n01:33.550 --> 01:35.290\nmchoraji kutoa maelekezo hayo.\n\n01:36.500 --> 01:37.320\nIli msionane.\n\n01:38.560 --> 01:38.760\nHaya.\n\n01:39.420 --> 01:41.180\nKwa hivyo hebu tuonyeshe onyesho la\n\n01:41.180 --> 01:43.160\njinsi mchezo huu utakavyofanya kazi.\n\n01:43.160 --> 01:45.700\nKwa hivyo, mko tayari?\n\n01:46.010 --> 01:46.450\nNdiyo.\n\n01:46.800 --> 01:47.760\nImara, twende.\n\n01:48.900 --> 01:51.190\nUnaweza kwenda juu Mason, uone mchoro na\n\n01:51.190 --> 01:52.470\numpe Karen maelekezo.\n\n01:52.470 --> 01:55.800\nUnaweza hili, Mason.\n\n01:56.020 --> 01:56.290\nSawa.\n\n02:00.100 --> 02:00.420\nSawa.\n\n02:03.770 --> 02:06.150\nKwa hivyo jambo la kwanza ni kuchora mraba.\n\n02:06.620 --> 02:07.040\nSawa.\n\n02:13.430 --> 02:15.370\nKatikati ya mraba, chora duara.\n\n02:19.660 --> 02:22.820\nJe, itakuwa inagusa kingo za mraba au katikati?\n\n02:23.770 --> 02:25.270\nEeh, itakuwa katikati.\n\n02:25.270 --> 02:28.110\nHaitakuwa inagusa kingo zozote.\n\n02:28.360 --> 02:29.220\nSawa sawa.\n\n02:30.820 --> 02:31.160\nSawa.\n\n02:31.620 --> 02:34.200\nNa chini ya mraba, itakuwa nje ya mraba,\n\n02:34.200 --> 02:37.220\nna itakuwa pembetatu inayoelekea chini.\n\n02:38.540 --> 02:39.400\nSawa sawa.\n\n02:39.400 --> 02:44.460\nUkitumia mstari wa chini kama ukingo?\n\n02:45.050 --> 02:45.540\nSahihi.\n\n02:45.540 --> 02:48.580\nUngetumia ukingo wa kulia na ukingo wa\n\n02:48.580 --> 02:51.120\nkushoto, na itaenda katikati kabisa kama\n\n02:51.120 --> 02:52.230\nncha ya pembetatu.\n\n02:52.720 --> 02:53.180\nSawa sawa.\n\n02:53.380 --> 02:54.940\nMaelekezo mazuri, Mason.\n\n02:55.090 --> 02:55.770\nHapo sawa.\n\n02:56.870 --> 02:57.270\nHaya.\n\n02:58.100 --> 02:59.420\nKazi nzuri, jamani.\n\n02:59.420 --> 03:01.620\nNa kama unavyoweza kuona pale, waliweza\n\n03:01.620 --> 03:02.920\nkuchora tena mchoro huo.\n\n03:03.410 --> 03:05.310\nNa sasa hapa kuna jambo, sivyo?\n\n03:05.310 --> 03:07.250\nWazo zima la mchezo huu ni kwamba hiyo\n\n03:07.250 --> 03:08.630\nilikuwa tu kiwango cha kwanza.\n\n03:09.020 --> 03:11.000\nKama mwalimu, unaweza kuzidi kufanya\n\n03:11.000 --> 03:13.180\nmchezo huu kuwa mgumu kwa mfano, kufanya\n\n03:13.180 --> 03:14.580\nmaumbo kama haya, sivyo?\n\n03:15.060 --> 03:17.270\nUnaweza kuweka maumbo yako katika nafasi\n\n03:17.270 --> 03:19.400\nhii na labda kutengeneza mraba mdogo na\n\n03:19.400 --> 03:21.660\nkuweka pembetatu katikati ya hii, sivyo?\n\n03:23.090 --> 03:25.370\nKimsingi, wazo kuu ni kwamba tunataka tu\n\n03:25.370 --> 03:27.550\nkuweza kuwapa changamoto wanafunzi wetu\n\n03:27.550 --> 03:29.490\nkutoa maelekezo ya wazi kwa wachoraji.\n\n03:30.780 --> 03:32.260\nIli waweze kuelewa vizuri cha\n\n03:32.260 --> 03:33.160\nkutengeneza upya.\n\n03:33.300 --> 03:33.900\nHaya basi.\n\n03:33.900 --> 03:35.860\nAsanteni sana jamani.\n\n03:36.070 --> 03:36.610\nAsante.\n\n03:37.030 --> 03:38.770\nNa tutaonana kwenye mchezo ujao.\n"}, {"id": "lesson-3/04", "title": "Alogarithimu ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-04.mp4", "vtt": "WEBVTT\n\n00:00.420 --> 00:01.560\nSawa, karibu tena.\n\n00:01.820 --> 00:03.860\nKwa hiyo kama ulipata nafasi ya kucheza\n\n00:03.860 --> 00:05.880\nmchezo wa kuelezea au kuchora na mtu\n\n00:05.880 --> 00:08.000\nmwingine, au uliweza kutazama video ya\n\n00:08.000 --> 00:10.340\nmaonyesho, swali letu kwako ni hili: ni\n\n00:10.340 --> 00:12.660\nmbinu gani wewe na mwenzako mlitumia au\n\n00:12.660 --> 00:14.580\nmliona zikitumika ili kurahisisha\n\n00:14.580 --> 00:15.680\nkuchora tena mchoro?\n\n00:17.440 --> 00:19.560\nSasa, simamisha video na fikiria kuhusu\n\n00:19.560 --> 00:20.720\nhilo kwa sekunde chache.\n\n00:23.720 --> 00:25.520\nSawa, sasa kwa kuwa umepata muda wa\n\n00:25.520 --> 00:27.660\nkufikiria, labda umeona kwamba walikuwa\n\n00:27.660 --> 00:29.520\nwanatumia kitu kinachoitwa kufikiri\n\n00:29.520 --> 00:30.420\nhatua kwa hatua.\n\n00:31.580 --> 00:33.460\nKwa hiyo kufikiri hatua kwa hatua,\n\n00:33.460 --> 00:35.480\nwakati unacheza mchezo na mwenzako,\n\n00:35.480 --> 00:37.600\nilibidi utoe maelekezo ya wazi kabisa\n\n00:37.600 --> 00:39.620\nhatua kwa hatua ili yule anayechora\n\n00:39.620 --> 00:41.540\naweze kuelewa jinsi ya kuchora tena\n\n00:41.540 --> 00:43.020\nmchoro wa mwalimu.\n\n00:43.650 --> 00:45.970\nKwa mfano, mtu angeweza kusema kitu kama\n\n00:45.970 --> 00:48.070\nhiki, \"Kwanza chora duara, halafu ndani\n\n00:48.070 --> 00:50.150\nya hilo duara, chora pembetatu ndogo.\"\n\n00:51.410 --> 00:53.330\nLakini unaweza kuona kwamba tulitoa\n\n00:53.330 --> 00:55.450\nmaelekezo ya wazi kabisa hatua kwa hatua.\n\n00:56.290 --> 00:58.230\nKwa hiyo ulichokiumba au ulichokiona\n\n00:58.230 --> 00:59.470\nsasa hivi ni algoriti.\n\n01:00.700 --> 01:02.660\nAlgoriti ni maelekezo yoyote ya wazi\n\n01:02.660 --> 01:05.100\nhatua kwa hatua ya kukamilisha jukumu fulani.\n\n01:06.710 --> 01:08.550\nNa jambo kuhusu algoriti ni kwamba\n\n01:08.550 --> 01:10.790\ninaweza kutumika kwenye kitu chochote maishani.\n\n01:11.130 --> 01:13.550\nHaihitaji kuwa ya kiteknolojia, mradi tu\n\n01:13.550 --> 01:15.500\nhiyo algoriti ni seti ya maelekezo ya\n\n01:15.500 --> 01:18.210\nhatua kwa hatua ya kukamilisha jukumu.\n\n01:18.980 --> 01:21.060\nKwa mfano, nikitazama hili, hatua za\n\n01:21.060 --> 01:23.240\nkutengeneza kikombe cha chai, unajua,\n\n01:23.240 --> 01:25.580\nhatua ya kwanza ni kuchemsha maji.\n\n01:25.750 --> 01:27.970\nHatua ya pili, ni kuongeza mfuko wa chai.\n\n01:28.460 --> 01:30.480\nHatua ya tatu, nilihitaji kuongeza\n\n01:30.480 --> 01:32.320\nsukari na maziwa, na hatimaye kwenye\n\n01:32.320 --> 01:33.860\nhatua ya nne, nilichanganya na\n\n01:33.860 --> 01:34.940\nkutumikia, sawa?\n\n01:34.940 --> 01:37.480\nHivyo huu ni mfano wa algoriti kwa\n\n01:37.480 --> 01:39.400\nsababu niliweza kuigawanya hatua kwa\n\n01:39.400 --> 01:41.100\nhatua hadi kukamilisha jukumu la\n\n01:41.100 --> 01:43.180\nkutengeneza kikombe cha chai.\n\n01:44.380 --> 01:46.360\nKwa hiyo tunatumia algoriti kila siku\n\n01:46.360 --> 01:48.060\nkwenye maisha yetu kila tunapofanya\n\n01:48.060 --> 01:48.940\njambo hatua kwa hatua.\n\n01:50.220 --> 01:52.260\nHiyo inaweza kuwa kupika, inaweza kuwa\n\n01:52.260 --> 01:54.560\nkuvaa nguo, kutatua tatizo la hisabati,\n\n01:54.560 --> 01:56.600\nau kwa upande wetu, hata kucheza mchezo\n\n01:56.600 --> 01:57.680\nhuu pia.\n\n01:59.570 --> 02:01.630\nKwa hiyo swali langu kwako ni hili: ni\n\n02:01.630 --> 02:03.550\nkitu gani unaweza kufikiria ambacho\n\n02:03.550 --> 02:05.750\nunafanya kila siku ambacho kinaweza kuwa\n\n02:05.750 --> 02:07.950\nna maelekezo ya wazi hatua kwa hatua au\n\n02:07.950 --> 02:09.130\nkina hatua zilizo wazi?\n\n02:10.370 --> 02:12.330\nKwa hiyo simamisha tu video na ufikirie\n\n02:12.330 --> 02:13.450\nhilo kwa muda kidogo.\n\n02:17.140 --> 02:19.080\nSawa, sasa kwa kuwa umepata muda wa\n\n02:19.080 --> 02:21.560\nkufikiria hilo, jambo tunalotaka uelewe\n\n02:21.560 --> 02:23.500\nkuhusu wazo hili la algoriti ni kwamba\n\n02:23.500 --> 02:25.120\nmashine zinahitaji algoriti.\n\n02:26.020 --> 02:28.080\nTena, mashine haziwezi kuelewa kama\n\n02:28.080 --> 02:30.160\nbinadamu, na hiyo ndiyo sababu kubwa\n\n02:30.160 --> 02:32.500\ntunahitaji kutoa maelekezo ya wazi hatua\n\n02:32.500 --> 02:33.720\nkwa hatua.\n\n02:34.290 --> 02:36.130\nKwa hiyo unapocheza ule mchezo au\n\n02:36.130 --> 02:38.270\nkuutazama, yule anaye elezea ni kama\n\n02:38.270 --> 02:40.690\nbinadamu anayetoa maelekezo, na mchoraji\n\n02:40.690 --> 02:43.010\nni kama mashine inayofuata hayo maelekezo.\n"}, {"id": "lesson-3/05", "title": "Alogarithimu ya Kujifunza kwa Binadamu", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-05.mp4", "vtt": "WEBVTT\n\n00:00.800 --> 00:02.580\nSawa, sasa kwa kuwa umeelewa jinsi\n\n00:02.580 --> 00:04.900\nalgoriti inavyofanya kazi, hebu tuelewe\n\n00:04.900 --> 00:07.020\njinsi tunavyoweza kuunda algoriti kwa\n\n00:07.020 --> 00:07.940\najili ya kujifunza.\n\n00:08.750 --> 00:10.910\nIli kuelewa hili vizuri zaidi, tutacheza\n\n00:10.910 --> 00:13.430\nmchezo mdogo unaoitwa kundi gani linahusika?\n\n00:14.950 --> 00:16.370\nNa kitakachotokea ni kwamba\n\n00:16.370 --> 00:18.530\nnitakuonyesha picha, na utaniambia tu\n\n00:18.530 --> 00:20.510\nkama inaenda kundi A au kundi B.\n\n00:20.510 --> 00:22.510\nSasa, ujanja ni kwamba sitakuambia\n\n00:22.510 --> 00:25.250\nmpangilio, sitakuambia sheria zake.\n\n00:25.530 --> 00:28.010\nKazi yako kimsingi ni kugundua hilo mwenyewe.\n\n00:28.880 --> 00:29.180\nSawa?\n\n00:29.180 --> 00:32.040\nBasi hebu tuanze na picha ya kwanza.\n\n00:33.750 --> 00:36.070\nSawa, hii inaenda kundi A au kundi B?\n\n00:37.770 --> 00:38.990\nJaribu kubahatisha tu.\n\n00:38.990 --> 00:42.590\nHii hapa inaenda kundi B.\n\n00:42.590 --> 00:45.090\nJe, hii inaenda kundi A au kundi B?\n\n00:47.110 --> 00:48.470\nHii hapa inaenda kundi A.\n\n00:48.470 --> 00:50.730\nJe, hii inaenda kundi A au kundi B?\n\n00:53.190 --> 00:54.810\nHii hapa inaenda kundi B.\n\n00:54.810 --> 00:56.850\nJe, inaenda kundi A au kundi B?\n\n00:59.220 --> 01:00.500\nHii hapa inaenda kundi A.\n\n01:00.500 --> 01:02.920\nHii hapa-- Je, hii inaenda kundi A au\n\n01:02.920 --> 01:03.380\nkundi B?\n\n01:05.510 --> 01:06.870\nHii hapa inaenda kundi A.\n\n01:06.870 --> 01:09.130\nJe, hii inaenda kundi A au kundi B?\n\n01:12.250 --> 01:13.790\nHii hapa inaenda kundi B.\n\n01:13.790 --> 01:15.890\nSasa hii hapa ni ya kukuchanganya kidogo.\n\n01:16.940 --> 01:19.140\nJe, hii inaenda kundi A au kundi B?\n\n01:20.780 --> 01:21.820\nHii inaenda kundi A.\n\n01:21.820 --> 01:23.900\nNa nina uhakika tayari umeshagundua,\n\n01:23.900 --> 01:26.540\nlakini je, hii inaenda kundi A au kundi B?\n\n01:28.890 --> 01:30.180\nHii hapa inaenda kundi A.\n\n01:30.180 --> 01:32.580\nNa mwisho kabisa, je, hii inaenda kundi\n\n01:32.580 --> 01:33.520\nA au kundi B?\n\n01:35.590 --> 01:36.990\nHii inaenda kundi B.\n\n01:36.990 --> 01:38.970\nSawa, sasa ni ipi ilikuwa muundo?\n\n01:41.600 --> 01:43.780\nNaam, kama tayari umeshagundua, kama\n\n01:43.780 --> 01:45.700\nkulikuwa na nyeusi upande wa kushoto,\n\n01:45.700 --> 01:47.780\nhiyo ilikuwa kundi A, na kama kulikuwa\n\n01:47.780 --> 01:49.920\nna nyeusi upande wa kulia, hiyo ilikuwa\n\n01:49.920 --> 01:50.520\nkundi B.\n\n01:50.520 --> 01:52.600\nNa kwa hiyo, nadhani jambo la kuvutia\n\n01:52.600 --> 01:54.780\nzaidi ni, unawezaje kuwa bora zaidi\n\n01:54.780 --> 01:57.080\nkatika kuamua kama inaenda kundi A au\n\n01:57.080 --> 01:58.860\nkundi B wakati sikukueleza sheria\n\n01:58.860 --> 02:01.000\nyoyote, au sikukueleza sheria wala\n\n02:01.000 --> 02:01.720\nmuundo wowote?\n\n02:03.200 --> 02:05.060\nKwa hiyo jisikie huru kusitisha video na\n\n02:05.060 --> 02:06.800\nkutafakari hili kwa sekunde chache.\n\n02:11.330 --> 02:13.370\nSawa, kwa hiyo algoriti ya kujifunza ya\n\n02:13.370 --> 02:15.270\nbinadamu inaweza kuonekana kama hii.\n\n02:16.080 --> 02:18.560\nKimsingi, unatoa hisia, halafu unakagua\n\n02:18.560 --> 02:20.960\njibu lako ili kuona umeenda mbali kiasi\n\n02:20.960 --> 02:23.180\ngani na jibu halisi, kisha unabadilisha\n\n02:23.180 --> 02:25.220\numakini wako kwenye sifa nyingine, na\n\n02:25.220 --> 02:27.120\nunaendelea kurudia mchakato huu hadi\n\n02:27.120 --> 02:29.440\nufikie hatua ambapo unaweza kutofautisha\n\n02:29.440 --> 02:32.420\nkati ya makundi tofauti bila kupewa sheria.\n\n02:33.490 --> 02:35.410\nNa kitu ninachotaka kusisitiza kuhusu\n\n02:35.410 --> 02:37.210\nbinadamu, kinachofanya hii iwe ya\n\n02:37.210 --> 02:39.350\nkuvutia sana, ni kwamba tunatafuta kile\n\n02:39.350 --> 02:40.750\nkinachoonekana kuwa muhimu.\n\n02:40.750 --> 02:43.050\nKwa hiyo kama binadamu, sisi ni watu wa\n\n02:43.050 --> 02:44.530\nhamu ya kujua mambo kwa asili.\n\n02:44.790 --> 02:46.890\nTuna hisia hizi na hamu kubwa ya kupata\n\n02:46.890 --> 02:48.270\nmaana kwa kuunganisha mawazo.\n\n02:49.620 --> 02:51.600\nKwa mfano, nikiona tu mraba mweusi\n\n02:51.600 --> 02:53.880\nkutoka mahali popote, nashangaa, \"Sawa,\n\n02:53.880 --> 02:56.080\nhuu mraba mweusi kweli unanivutia,\" na\n\n02:56.080 --> 02:58.220\nnajiuliza kwa nini uko kwenye nafasi hiyo?\n\n02:59.360 --> 03:01.660\nUnajua, mwisho wa siku, ninashangaa sana\n\n03:01.660 --> 03:03.580\njinsi haya yote yanavyoungana na maana\n\n03:03.580 --> 03:04.980\nyake ni nini?\n\n03:05.950 --> 03:07.630\nKwa hiyo, pale ambapo algoriti ya\n\n03:07.630 --> 03:09.670\nkujifunza ya binadamu inafanya kazi,\n\n03:09.670 --> 03:11.690\nunajua, kinachotokea ni kwamba, kwanza\n\n03:11.690 --> 03:13.450\nkabisa, lazima ufanye ubashiri wa\n\n03:13.450 --> 03:14.310\nkisomi, sivyo?\n\n03:14.310 --> 03:16.310\nKwa sababu hujui nini kitatokea.\n\n03:16.310 --> 03:17.290\nHujui sifa zake.\n\n03:17.940 --> 03:19.940\nKwa hiyo kila ninapoulizwa, \"Je, hiki\n\n03:19.940 --> 03:22.420\nkinaenda kundi A au kundi B?\" Unajua,\n\n03:22.420 --> 03:23.660\nmimi husema tu, \"Sawa.\n\n03:23.660 --> 03:26.480\nNaam, nadhani ni kundi A kwa kuwa ndio\n\n03:26.480 --> 03:27.060\ntunaanza tu.\"\n\n03:27.320 --> 03:29.080\nNa hapa ndipo mambo yanapovutia.\n\n03:29.600 --> 03:31.340\nKwa hiyo katika hatua ya pili, hapo\n\n03:31.340 --> 03:33.100\nndipo unaanza kukagua jibu lako.\n\n03:33.100 --> 03:35.880\nKwa hiyo katika hatua ya pili,\n\n03:35.880 --> 03:38.040\nunapofanya ubashiri na kuona matokeo,\n\n03:38.040 --> 03:39.880\nhilo litakufanya uhisi kitu fulani.\n\n03:40.590 --> 03:42.610\nKwa mfano, kila niliposema kwamba hii\n\n03:42.610 --> 03:44.690\nkwa kweli ni kundi B, unaweza kuona\n\n03:44.690 --> 03:45.870\nkwamba nimeshtuka kidogo.\n\n03:46.900 --> 03:49.100\nNiko kama, \"Eh, kweli?\n\n03:49.100 --> 03:51.600\nLabda hii inahusiana na kuwa upande wa kulia.\"\n\n03:53.240 --> 03:55.480\nNa jambo kuhusu kukagua majibu ni kwamba\n\n03:55.480 --> 03:57.700\nlitakupa hisia ya kushangaa, labda kuwa\n\n03:57.700 --> 03:59.980\nna hamu, au kuvutiwa.\n\n04:00.190 --> 04:01.950\nUnajua, chochote kile, mwishowe\n\n04:01.950 --> 04:04.310\nutajiuliza, hii yote inamaanisha nini na\n\n04:04.310 --> 04:05.510\ninaunganishaje pamoja?\n\n04:07.180 --> 04:09.040\nKisha hatua ya tatu ni pale unapaanza\n\n04:09.040 --> 04:10.420\nkubadilisha mtazamo wako.\n\n04:11.100 --> 04:12.420\nKwa hiyo, kulingana na jinsi\n\n04:12.420 --> 04:14.500\nulivyojisikia baada ya kubashiri mara ya\n\n04:14.500 --> 04:16.420\nmwisho, itaathiri kile utakacholenga\n\n04:16.420 --> 04:18.160\nkwenye jaribio lako linalofuata.\n\n04:18.160 --> 04:19.940\nKwa hiyo unaweza kuona hapa kwamba\n\n04:19.940 --> 04:21.740\nninapouliza swali lile lile, \"Hii\n\n04:21.740 --> 04:23.380\ninaenda kundi A au kundi B?\"\n\n04:24.000 --> 04:25.420\nNiko kama, \"Eh, sawa.\n\n04:25.420 --> 04:28.200\nSasa iko upande wa kushoto, kwa hiyo\n\n04:28.200 --> 04:30.080\nlabda hii inahusiana na kuwa kwenye\n\n04:30.080 --> 04:30.540\nkundi A.\"\n\n04:32.280 --> 04:34.140\nNa ninaposema kwamba hii ni sahihi,\n\n04:34.140 --> 04:36.060\nunaweza kuona nashangilia mara moja.\n\n04:36.990 --> 04:39.250\nNiko kama, \"Ah, nafikiri naanza kuelewa\n\n04:39.250 --> 04:39.810\nhii,\" sivyo?\n\n04:40.520 --> 04:42.200\nNa kwa hiyo unavyoendelea kurudia\n\n04:42.200 --> 04:44.320\nmchakato huu, baada ya muda utajifunza\n\n04:44.320 --> 04:46.580\nni sifa zipi kati ya hizi zinazosaidia\n\n04:46.580 --> 04:48.040\nzaidi kutofautisha makundi.\n\n04:50.150 --> 04:52.530\nSawa, kwa hiyo inageuka kwamba tunaweza\n\n04:52.530 --> 04:54.770\npia kuiga hizi algoriti za kujifunza\n\n04:54.770 --> 04:55.390\nkwenye mashine.\n"}, {"id": "lesson-3/06", "title": "Alogarithimu ya Kujifunza kwa Mashine", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-06.mp4", "vtt": "WEBVTT\n\n00:01.180 --> 00:02.600\nSawa, kwa hiyo mara ya mwisho\n\n00:02.600 --> 00:04.620\ntulizungumza kuhusu jinsi tunavyoweza\n\n00:04.620 --> 00:07.080\nkuiga hizi algoriti za kujifunza kwenye mashine.\n\n00:08.110 --> 00:09.870\nNa kabla hatujaelewa hilo, kitu\n\n00:09.870 --> 00:11.730\ntunachopaswa kuelewa ni kipengele ni\n\n00:11.730 --> 00:12.970\nnini hasa.\n\n00:13.660 --> 00:15.280\nKwa hiyo vipengele ni vipande vya\n\n00:15.280 --> 00:18.280\ntaarifa vinavyotusaidia kutofautisha vitu.\n\n00:18.510 --> 00:20.430\nChukua mfano, vitu hivi viwili hapa.\n\n00:21.260 --> 00:23.000\nKitu cha kwanza ninachokiona ni kwamba\n\n00:23.000 --> 00:24.200\nvinatofautiana kwa umbo.\n\n00:24.990 --> 00:27.190\nMoja ni mraba, nyingine ni duara, na pia\n\n00:27.190 --> 00:28.470\nzinatofautiana kwa rangi.\n\n00:29.630 --> 00:31.510\nHii hapa ni mraba wa njano, na ile\n\n00:31.510 --> 00:33.630\niliyoko upande wa kulia ni duara la buluu.\n\n00:35.210 --> 00:37.410\nHivyo hizi kimsingi ni sifa au taarifa\n\n00:37.410 --> 00:39.870\nzinazoniwezesha kutofautisha hivi vitu viwili.\n\n00:42.360 --> 00:44.310\nNa jinsi binadamu wanavyoona sifa ni\n\n00:44.310 --> 00:46.720\nkwamba, unajua, kila tunapotazama picha,\n\n00:46.720 --> 00:48.450\nkimsingi tunaigawa katika tabia\n\n00:48.450 --> 00:50.150\nmbalimbali, halafu tunajikuta\n\n00:50.160 --> 00:52.340\ntunazingatia ile ambayo inaonekana kuwa\n\n00:52.340 --> 00:53.490\nmuhimu zaidi, sivyo?\n\n00:54.370 --> 00:56.610\nKwa hiyo tukitazama sifa zote tofauti za\n\n00:56.610 --> 00:58.430\npicha hii, tunachogundua ni kwamba kwa\n\n00:58.430 --> 01:00.770\nsababu mraba mweusi huu upo peke yake na\n\n01:00.770 --> 01:02.870\nunajitokeza wazi, basi unahisi kama\n\n01:02.870 --> 01:04.810\nndiyo muhimu zaidi kuliko sifa nyingine\n\n01:04.810 --> 01:05.990\nzote pia.\n\n01:06.220 --> 01:08.080\nHata hivyo, jambo kuhusu mashine ni\n\n01:08.080 --> 01:10.230\nkwamba hazikisi kwa hisia, bali zinatoa\n\n01:10.230 --> 01:11.400\nutabiri kwa mahesabu.\n\n01:12.900 --> 01:14.900\nKwa hiyo mashine hazichukulii hizi sifa\n\n01:14.900 --> 01:17.100\nkama hisia, zinachukulia hizi sifa kama\n\n01:17.100 --> 01:17.820\nnamba, sivyo?\n\n01:18.720 --> 01:20.560\nHazioni wala kuhisi chochote kwa kweli.\n\n01:21.880 --> 01:24.220\nKwa mfano, ili ziweze kuchakata, unajua,\n\n01:24.220 --> 01:26.140\nzinageuza nyeupe kuwa moja na nyeusi\n\n01:26.140 --> 01:26.780\nkuwa sifuri.\n\n01:29.180 --> 01:31.100\nNa hivyo basi, njia nzuri ya kuona\n\n01:31.100 --> 01:33.100\ntofauti kati ya binadamu na mashine na\n\n01:33.100 --> 01:35.120\njinsi tunavyoshughulikia sifa ni kwamba\n\n01:35.120 --> 01:37.360\nkwa binadamu, unajua, kila tunapoona\n\n01:37.360 --> 01:39.600\nkitu kinachojitokeza kama mraba mweusi,\n\n01:39.
