600 --> 01:41.760\ntutasema, \"Hicho kinaonekana muhimu,\"\n\n01:41.760 --> 01:43.980\nkwa hiyo kimsingi tutakisia.\n\n01:44.870 --> 01:46.630\nSasa, kuhusu mashine ni kwamba kila\n\n01:46.630 --> 01:48.790\nzinapofanya hivi, unaweza kuona hapa\n\n01:48.790 --> 01:50.790\nkwamba hazioni kwa kweli, zinabadilisha\n\n01:50.790 --> 01:52.770\ntu hiyo kuwa namba, halafu zinazidisha\n\n01:52.770 --> 01:54.890\nhiyo na aina fulani ya umuhimu, kwa hiyo\n\n01:54.890 --> 01:56.910\nni vitu gani kati ya hivi vina umuhimu\n\n01:56.910 --> 01:59.010\nzaidi katika kuamua matokeo, na kisha\n\n01:59.010 --> 02:00.710\nzinatoa utabiri uliohesabiwa.\n\n02:02.050 --> 02:03.650\nUsijali kuhusu hesabu, sawa?\n\n02:03.650 --> 02:06.410\nJambo muhimu nataka uelewe ni kwamba\n\n02:06.410 --> 02:08.270\nkuna, kuna, eh, hesabu nyingi sana\n\n02:08.270 --> 02:09.890\nzinazohusika kwenye mchakato huu.\n\n02:10.920 --> 02:12.760\nKwa hiyo, ule algoriti wa mafunzo ya\n\n02:12.760 --> 02:14.620\nmashine, unaweza kuona una hatua\n\n02:14.620 --> 02:16.660\nzinazofanana ambapo unafanya utabiri\n\n02:16.660 --> 02:18.770\nuliohesabiwa, kisha unapima makosa,\n\n02:18.770 --> 02:20.550\nhalafu unaboresha mlinganyo wako wa\n\n02:20.550 --> 02:23.520\nhesabu, na unaendelea kurudia mchakato huu.\n\n02:24.280 --> 02:26.360\nKwa hiyo, kuhusu ujifunzaji wa mashine\n\n02:26.360 --> 02:28.860\nni kwamba kimsingi wanakokotoa utabiri, sawa?\n\n02:30.160 --> 02:32.160\nKwa hiyo, badala ya kuona sifa moja kwa\n\n02:32.160 --> 02:34.280\nmoja, wanachukua sifa na kuizidisha na,\n\n02:34.280 --> 02:36.300\nsawa, ni kwa kiasi gani kila sifa ni\n\n02:36.300 --> 02:38.260\nmuhimu katika kuamua matokeo, sio?\n\n02:39.320 --> 02:40.760\nJe, ni zaidi sifa ya kwanza?\n\n02:41.470 --> 02:42.850\nAu ni zaidi sifa ya pili?\n\n02:43.440 --> 02:44.500\nNa kadhalika, sivyo?\n\n02:44.500 --> 02:47.160\nInajaribu kuamua hilo ili kuona\n\n02:47.160 --> 02:48.480\ninafikaje kwenye jibu hilo.\n\n02:49.480 --> 02:51.600\nSasa hebu tuone algoriti ya ujifunzaji\n\n02:51.600 --> 02:52.920\nwa mashine ikifanya kazi.\n\n02:52.920 --> 02:55.260\nKwa hiyo hatua ya kwanza, kimsingi\n\n02:55.260 --> 02:56.620\nunakokotoa utabiri wako.\n\n02:57.430 --> 02:59.230\nKwa hiyo wanaanza kwa kukokotoa sifa\n\n02:59.230 --> 03:01.350\nkama namba, halafu wanazijumlisha pamoja\n\n03:01.350 --> 03:03.890\nna thamani za umuhimu za kubahatisha.\n\n03:04.230 --> 03:06.190\nKumbuka, mwanzoni, unajua, sawa na\n\n03:06.190 --> 03:08.950\nbinadamu, tulilazimika kutoa utabiri wa kubahatisha.\n\n03:09.460 --> 03:11.560\nKwa hiyo hata hizi mashine, zinaweka tu\n\n03:11.560 --> 03:13.540\nkitu cha kubahatisha kuhusu ni ipi kati\n\n03:13.540 --> 03:15.580\nya hizi sifa ni muhimu kweli.\n\n03:16.230 --> 03:17.970\nNa hivyo wanakuja na aina fulani ya\n\n03:17.970 --> 03:19.290\nutabiri uliokokotolewa.\n\n03:20.110 --> 03:22.100\nKwa hiyo baada ya kufanya utabiri huo,\n\n03:22.100 --> 03:23.420\ntunatakiwa kupima makosa.\n\n03:24.850 --> 03:26.800\nKwa hiyo kile ambacho mfano unafanya ni\n\n03:26.800 --> 03:28.320\nkulinganisha jinsi utabiri\n\n03:28.320 --> 03:30.530\nuliokokotolewa ulivyokuwa mbali na jibu\n\n03:30.530 --> 03:32.340\nsahihi halisi, na umbali huu ndio\n\n03:32.340 --> 03:33.220\ntunauita kosa.\n\n03:34.070 --> 03:35.910\nNa kwa hiyo kosa hili litakuwa muhimu\n\n03:35.910 --> 03:37.830\nsana kwetu kwa sababu tunachofanya ni\n\n03:37.830 --> 03:39.650\nkutumia hilo kosa kama kioo, na\n\n03:39.650 --> 03:41.550\ntunalitumia kutusaidia kurekebisha\n\n03:41.550 --> 03:43.450\numuhimu wa kila sifa tofauti kwenye\n\n03:43.450 --> 03:45.610\nmlinganyo wetu, tukilenga kupata kosa\n\n03:45.610 --> 03:48.270\ndogo zaidi kwenye utabiri unaofuata.\n\n03:48.990 --> 03:50.710\nKwa hiyo kimsingi, tunachofanya ni\n\n03:50.710 --> 03:52.850\nkuchukua hilo kosa, halafu tunaliboresha\n\n03:52.850 --> 03:55.290\ntofauti kwa kila sifa ili kuona ipi kati\n\n03:55.290 --> 03:57.730\nya hizo ni muhimu zaidi katika kuamua matokeo.\n\n03:59.090 --> 04:00.790\nHalafu tunakuja na aina fulani ya\n\n04:00.790 --> 04:02.870\nmlinganyo ulioboreshwa ambao tutaendelea\n\n04:02.870 --> 04:04.150\nkuuboresha mara kwa mara.\n\n04:05.690 --> 04:07.470\nNa baada ya kurudia mara za kutosha,\n\n04:07.470 --> 04:09.610\nunakuwa na mfano uliopata mafunzo ambao\n\n04:09.610 --> 04:10.890\nunaweza kufanya utabiri.\n\n04:12.250 --> 04:14.270\nKwa hiyo unaweza kuona hapa kwamba tuna\n\n04:14.270 --> 04:16.350\nmlinganyo wa hesabu ulioboreshwa vizuri\n\n04:16.350 --> 04:18.250\nambao unaweza kufanya maamuzi sahihi\n\n04:18.250 --> 04:19.050\nkabisa, sivyo?\n\n04:20.050 --> 04:21.770\nUnaweza kuona inaonyesha asilimia\n\n04:21.770 --> 04:23.290\nthemanini na saba kundi B.\n\n04:23.290 --> 04:24.970\nKwa hiyo wazo kuu, na ni sawa kama\n\n04:24.970 --> 04:27.150\nhuelewi hesabu inayohusika, kitu pekee\n\n04:27.150 --> 04:29.330\nnataka uelewe ni kwamba mfano uliopata\n\n04:29.330 --> 04:32.610\nmafunzo unategemea milinganyo ya hesabu.\n\n04:32.610 --> 04:34.930\nKwa hiyo, mifano ya AI iliyopata mafunzo\n\n04:34.930 --> 04:37.530\nkimsingi hubadilisha data kuwa namba.\n\n04:37.810 --> 04:40.030\nInafanya mahesabu mengi juu yake, halafu\n\n04:40.030 --> 04:41.730\npia inatoa namba ambayo baadaye\n\n04:41.730 --> 04:43.870\ninabadilishwa kuwa kitu ambacho binadamu\n\n04:43.870 --> 04:45.190\nanaweza kuelewa, sawa?\n\n04:46.620 --> 04:48.700\nNa ndiyo maana kila undani wa picha yetu\n\n04:48.700 --> 04:50.780\nau data ni muhimu sana kwa sababu kila\n\n04:50.780 --> 04:52.820\nundani ni muhimu kwenye mifano ya AI kwa\n\n04:52.820 --> 04:54.580\nsababu kila namba ni muhimu kwenye\n\n04:54.580 --> 04:55.520\nmlinganyo, sivyo?\n\n04:56.710 --> 04:58.730\nAI haichakati taarifa kama sisi, kwa\n\n04:58.730 --> 05:00.810\nhiyo utabiri wake unaweza usilingane na\n\n05:00.810 --> 05:02.810\nmatarajio yetu, sivyo?\n\n05:03.060 --> 05:05.080\nKwa hiyo unaweza kuona hapa kwamba kila\n\n05:05.080 --> 05:07.200\nmoja ya hivi vinaweza kuwakilisha namba\n\n05:07.200 --> 05:09.460\nambayo tutakuwa tunahesabu kwenye ule mlinganyo.\n\n05:11.290 --> 05:13.090\nNa wazo hili linatumika kwa ujumla\n\n05:13.090 --> 05:15.190\nkwenye aina yoyote ya mfano wa AI, sivyo?\n\n05:16.280 --> 05:18.440\nHata hivyo, kama vile mifano ya lugha au\n\n05:18.440 --> 05:20.500\nzana za AI za mazungumzo, kimsingi\n\n05:20.500 --> 05:22.160\nzinachukua maneno yako, lazima\n\n05:22.160 --> 05:24.280\nyazigeuzwe kuwa namba, unafanya hesabu\n\n05:24.280 --> 05:26.160\njuu yake, halafu unazirudisha kuwa\n\n05:26.160 --> 05:28.700\nmaneno ili uweze kuelewa, sivyo?\n\n05:29.390 --> 05:31.190\nKwa hiyo, kimsingi, mengi yake ni\n\n05:31.190 --> 05:33.010\nkufanya hesabu nyingi, mlinganyo na\n\n05:33.010 --> 05:35.510\nmahesabu mwishoni mwa siku ili kupata utabiri.\n\n05:38.200 --> 05:40.300\nKwa hiyo jambo kuu ambalo nataka uelewe\n\n05:40.300 --> 05:41.540\nni kwamba AI si uchawi.\n\n05:42.570 --> 05:44.310\nKimsingi ni hesabu zinazoongozwa na\n\n05:44.310 --> 05:45.910\nmaamuzi ya binadamu.\n\n05:46.110 --> 05:47.970\nNa nasema hivi si kwa kudharau, bali\n\n05:47.970 --> 05:50.150\nnataka iwe wazi kabisa kwamba ni hesabu\n\n05:50.150 --> 05:52.190\ntu zinazoongozwa na maamuzi ya binadamu.\n\n05:53.580 --> 05:55.740\nKwa mfano, kila tunapotazama jinsi AI\n\n05:55.740 --> 05:57.320\ninavyoweza kujiendesha, sivyo?\n\n05:58.050 --> 06:00.050\nAI inabadilika kimsingi kwa kutumia\n\n06:00.050 --> 06:02.070\nalgoriti za kujifunza zilizoandikwa na\n\n06:02.070 --> 06:04.050\nbinadamu na zinazoendeshwa kwenye mashine.\n\n06:04.940 --> 06:06.400\nKwa hiyo, kama tulivyosema na\n\n06:06.400 --> 06:08.440\ntulivyoona, hili linahitaji mahesabu\n\n06:08.440 --> 06:11.320\nmengi sana, ambayo yanatumia nishati nyingi.\n\n06:12.000 --> 06:13.780\nKwa hiyo NearPod kimsingi inatumia\n\n06:13.780 --> 06:16.140\nnishati au, au inafanya mahesabu moja\n\n06:16.140 --> 06:17.840\nkwa moja kwenye kifaa chako, sivyo?\n\n06:18.750 --> 06:20.650\nKwa hiyo, sehemu kubwa ya hesabu nzito\n\n06:20.650 --> 06:22.470\nitatumia nishati nyingi, na kufanya\n\n06:22.470 --> 06:24.510\nkifaa chako kianze kuwa na joto, na pia\n\n06:24.510 --> 06:26.330\nitapunguza chaji ya betri kama hivyo.\n\n06:27.860 --> 06:29.580\nSasa, ukweli ni kwamba gharama ya\n\n06:29.580 --> 06:31.260\nkimazingira ya AI ni kwamba wakati\n\n06:31.260 --> 06:33.220\nNearPod inafanya kazi moja kwa moja\n\n06:33.220 --> 06:35.200\nkwenye kifaa chako, jambo kuhusu AI\n\n06:35.200 --> 06:36.700\nnyingi ni kwamba zinaendeshwa kwenye\n\n06:36.700 --> 06:38.520\nmajengo makubwa yaliyojaa maelfu ya\n\n06:38.520 --> 06:39.440\nkompyuta, sivyo?\n\n06:40.310 --> 06:42.270\nKwa hiyo majengo haya yanatumia umeme\n\n06:42.270 --> 06:44.330\nmwingi sawa na miji midogo na mabilioni\n\n06:44.330 --> 06:46.670\nya galoni za maji ili tu kujipoza wakati\n\n06:46.670 --> 06:48.610\nwa kufanya aina hizi nyingi za mahesabu\n\n06:48.610 --> 06:49.950\nya kihesabu.\n\n06:50.190 --> 06:52.070\nKwa hiyo, hii inaweza kuwa na gharama\n\n06:52.070 --> 06:53.570\nkubwa sana kwa mazingira yetu.\n\n06:54.840 --> 06:56.480\nJambo lingine sasa ni uhuru wa AI.\n\n06:57.470 --> 06:59.810\nSasa, uhuru wa AI ni kama vile, unajua,\n\n06:59.810 --> 07:01.840\nAI inatabiri kwa kutafuta mifumo yake\n\n07:01.840 --> 07:03.970\nyenyewe kwenye data nyingi sana.\n\n07:04.750 --> 07:06.810\nKwa hiyo sisi kama binadamu, kimsingi\n\n07:06.810 --> 07:09.110\ntunatoa mifano au mrejesho ili kusaidia\n\n07:09.110 --> 07:10.790\nkuelekeza utabiri wake, sivyo?\n\n07:11.680 --> 07:13.900\nKwa mfano, wewe ndiye ulikusanya data za\n\n07:13.900 --> 07:15.700\nkufundisha programu yako ya NearPod.\n\n07:16.590 --> 07:18.470\nKwa hiyo, kwa kweli, unajua, katika\n\n07:18.470 --> 07:20.710\nmpangilio mkubwa wa mambo, kuna binadamu\n\n07:20.710 --> 07:22.470\nwengi ambao wapo nyuma ya hizi AI.\n\n07:23.710 --> 07:26.010\nUnajua, kwenye NearPod, ilikuwa wewe tu\n\n07:26.010 --> 07:27.730\nau labda marafiki wachache wengine\n\n07:27.730 --> 07:29.690\nmlikuwa mnakusanya data, lakini AI\n\n07:29.690 --> 07:31.470\nnyingi zinahitaji mamilioni ya watu\n\n07:31.470 --> 07:33.910\nkusafisha data na kuelekeza yale mifano ya AI.\n\n07:35.170 --> 07:37.330\nKwa hiyo bila zile chaguo za kibinadamu,\n\n07:37.330 --> 07:39.390\nmashine isingejua jinsi ya kupata ile\n\n07:39.390 --> 07:40.210\nmifumo sahihi.\n\n07:41.100 --> 07:42.960\nKwa hiyo mwisho wa siku, unachotakiwa\n\n07:42.960 --> 07:45.280\nkuelewa kuhusu jinsi AI inavyofanya kazi\n\n07:45.280 --> 07:47.340\nni kwamba zana za AI ni zao la maamuzi\n\n07:47.340 --> 07:48.960\nya kibinadamu tu.\n"}, {"id": "lesson-3/07", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=sw"}, {"id": "lesson-3/08", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-3-08.mp4", "vtt": "WEBVTT\n\n00:00.460 --> 00:02.700\nSawa, somo namba tatu, muda wa mradi.\n\n00:03.340 --> 00:05.360\nKwa hiyo ni wakati wako kuanza kufikiria\n\n00:05.360 --> 00:06.940\nkuhusu sifa zako.\n\n00:06.940 --> 00:09.060\nKwa hiyo, ukizingatia data ya somo la\n\n00:09.060 --> 00:11.120\npili, nataka ufikirie kwa undani zaidi.\n\n00:11.730 --> 00:13.820\nFikiria kuhusu sifa kuu ulizotumia\n\n00:13.820 --> 00:15.230\nkutofautisha makundi yako.\n\n00:16.660 --> 00:18.380\nJe, labda ilikuwa rangi?\n\n00:18.380 --> 00:19.640\nJe, ilikuwa ukubwa?\n\n00:20.050 --> 00:21.070\nJe, ilikuwa umbo?\n\n00:21.070 --> 00:24.170\nNi sifa gani nyingine ulikuwa unafikiria\n\n00:24.170 --> 00:26.810\nambazo zilitofautisha makundi yako?\n\n00:27.690 --> 00:29.770\nSawa, kwa hiyo utajibu hilo kwenye swali\n\n00:29.770 --> 00:31.690\nla somo la tatu kwenye karatasi yako ya\n\n00:31.690 --> 00:34.050\nkazi, na kama utamaliza mapema, endelea\n\n00:34.050 --> 00:35.610\nkuboresha AI classifier yako.\n\n00:35.610 --> 00:37.750\nKama mwalimu wako atakuruhusu, nenda\n\n00:37.750 --> 00:39.590\nukakusanye data zaidi ili uendelee\n\n00:39.590 --> 00:41.550\nkufanya kazi kwenye AI classifier yako.\n\n00:41.990 --> 00:44.710\nKwa hiyo, kusanya data zaidi kama inahitajika.\n\n00:44.710 --> 00:48.290\nKwa mfano wa majibu ya somo la tatu,\n\n00:48.290 --> 00:50.510\nambalo ni kutambua sifa, ni sifa gani\n\n00:50.510 --> 00:52.730\nclassifier yako itatumia kupanga data?\n\n00:54.090 --> 00:56.580\nKwa mfano huu, mwanafunzi alisema hivi:\n\n00:56.580 --> 00:58.950\n\"Nitatumia rangi, umbo, na ukubwa.\n\n00:58.950 --> 01:02.120\nKwa mfano, ndizi ni ndefu na za manjano,\n\n01:02.120 --> 01:03.780\nmachungwa ni mviringo na ya rangi ya\n\n01:03.790 --> 01:05.740\nchungwa, na maparachichi ni mviringo\n\n01:05.750 --> 01:06.870\nmrefu na ya kijani.\n\n01:06.870 --> 01:09.620\nSifa hizi zinawafanya kuwa rahisi\n\n01:09.620 --> 01:11.120\nkutofautisha.\"\n"}, {"id": "lesson-3/09", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=sw"}]}, {"id": "lesson-4", "kicker": "Somo la 4", "title": "Je Mashine Zinaweza Kuwajibika", "items": [{"id": "lesson-4/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-01.mp4", "vtt": "WEBVTT\n\n00:00.380 --> 00:03.360\nSawa, somo la nne: Je, mashine zinaweza kuwajibika?\n\n00:04.830 --> 00:06.850\nKwa hiyo, tunachojifunza katika lengo la\n\n00:06.850 --> 00:09.010\nsomo la nne ni kwamba tutaelezea jinsi\n\n00:09.010 --> 00:11.290\nupendeleo wa data unavyopelekea utabiri\n\n00:11.290 --> 00:13.290\nusio sahihi, tutaelezea kwa nini\n\n00:13.290 --> 00:15.490\nbinadamu wanawajibika kwa AI na jinsi ya\n\n00:15.490 --> 00:17.110\nkupunguza madhara.\n\n00:17.360 --> 00:19.140\nTutaelezea njia rahisi za kulinda\n\n00:19.140 --> 00:21.200\nfaragha ya watu, na tutatambua jinsi\n\n00:21.200 --> 00:23.200\nupendeleo, faragha, na uwajibikaji\n\n00:23.200 --> 00:26.160\nvinavyohusiana na AI yenye uwajibikaji.\n"}, {"id": "lesson-4/02", "title": "Changamoto ya Bearly a Dog", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-02.mp4", "vtt": "WEBVTT\n\n00:00.260 --> 00:02.020\nTunaenda kufanya changamoto inayoitwa\n\n00:02.020 --> 00:03.800\nChangamoto ya Karibu na Mbwa, na lengo\n\n00:03.800 --> 00:05.860\nlako ni kutengeneza mfano ambao unaweza\n\n00:05.860 --> 00:07.500\nkutofautisha kati ya dubu na mbwa na\n\n00:07.500 --> 00:08.820\nupite majaribio yote.\n\n00:09.920 --> 00:12.040\nKizuizi chako ni kwamba una dakika 3,\n\n00:12.040 --> 00:13.940\nunaweza kuchagua hadi dubu 10, na\n\n00:13.940 --> 00:16.120\nunaweza kuchagua hadi mbwa 10.\n\n00:16.770 --> 00:18.670\nIli kupata changamoto hii, rudi kwenye\n\n00:18.670 --> 00:19.710\napp ya Neural Pocket.\n\n00:20.210 --> 00:21.710\nUtaona kitu kinachoitwa Jaribu\n\n00:21.710 --> 00:22.750\nChangamoto ya Upendeleo.\n\n00:23.400 --> 00:25.020\nBonyeza hapo, kisha bonyeza Anza\n\n00:25.020 --> 00:26.980\nChangamoto, na utaona mara moja kwamba\n\n00:26.980 --> 00:29.000\nunaweza kuchagua hadi dubu 10 na hadi\n\n00:29.000 --> 00:29.460\nmbwa 10.\n\n00:30.750 --> 00:32.650\nNa kama vile ulivyokuwa unatumia Neural\n\n00:32.650 --> 00:34.630\nPocket, baada ya kukusanya data zako,\n\n00:34.630 --> 00:36.430\nunaenda kwenye mafunzo, halafu unaenda\n\n00:36.430 --> 00:38.190\nkwenye modeli yako ambapo utaendesha\n\n00:38.190 --> 00:40.170\nkesi zote za majaribio na kuona kama\n\n00:40.170 --> 00:42.010\numepita kila kitu.\n\n00:42.010 --> 00:43.970\nSawa, basi hebu tuanze na changamoto\n\n00:43.970 --> 00:46.090\nhii, na nitawaona mwishoni mwa hii changamoto.\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "Upendeleo ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-03.mp4", "vtt": "WEBVTT\n\n00:01.320 --> 00:02.500\nSawa, karibu tena.\n\n00:03.050 --> 00:05.010\nBaada ya kucheza changamoto ya 'barely a\n\n00:05.010 --> 00:06.470\ndog', sasa nina swali kwako.\n\n00:07.390 --> 00:09.370\nMatokeo yako yalikuwa vipi, na kwa nini\n\n00:09.370 --> 00:10.650\nunadhani yalitokea hivyo?\n\n00:11.500 --> 00:13.360\nJe, uliweza kupita majaribio yote?\n\n00:13.360 --> 00:15.300\nJe, ulipita baadhi ya majaribio?\n\n00:15.630 --> 00:17.190\nJe, ulishindwa yote?\n\n00:17.190 --> 00:19.450\nBasi simamisha video na tafakari kidogo\n\n00:19.450 --> 00:20.990\nkuhusu hilo kwa sekunde chache.\n\n00:23.450 --> 00:25.590\nSawa, kama hukuweza kupita majaribio\n\n00:25.590 --> 00:27.530\nyote, huenda hii imesababishwa na\n\n00:27.530 --> 00:28.750\nupendeleo wa kibinadamu.\n\n00:30.190 --> 00:32.230\nSasa, kuhusu binadamu, ni kwamba sote\n\n00:32.230 --> 00:33.970\ntunaona dunia kwa namna tofauti kwa\n\n00:33.970 --> 00:36.090\nsababu, unajua, kila mmoja wetu ana\n\n00:36.090 --> 00:38.110\nuzoefu tofauti wa maisha, na tunaita\n\n00:38.110 --> 00:40.930\nmtazamo huu mdogo wa dunia kuwa upendeleo.\n\n00:41.570 --> 00:43.530\nHii picha inaelezea vizuri jambo hili.\n\n00:44.270 --> 00:46.450\nUnajua, kuna hawa watu watatu, na yule\n\n00:46.450 --> 00:48.810\nmtu wa kushoto ana, kama, mkia wa tembo\n\n00:48.810 --> 00:50.630\nna anafikiri ni nyoka.\n\n00:51.350 --> 00:53.580\nYule mtu wa katikati anafikiri ni ukuta,\n\n00:53.580 --> 00:55.650\nna yule mwenye mkia anafikiri kimsingi\n\n00:55.650 --> 00:56.060\nni kamba.\n\n00:57.300 --> 00:59.280\nKwa hiyo wote wana uzoefu tofauti na\n\n00:59.280 --> 01:01.280\ntembo yule yule, na hiyo ndiyo sababu\n\n01:01.280 --> 01:02.640\nwana mtazamo huu mdogo.\n\n01:04.940 --> 01:06.400\nKwa hiyo kinachotokea ni kwamba\n\n01:06.400 --> 01:08.640\nupendeleo wetu au mtazamo wetu mdogo\n\n01:08.640 --> 01:10.860\nunaweza kuathiri sana sifa tunazochagua\n\n01:10.860 --> 01:12.340\nkwenye data yetu.\n\n01:12.530 --> 01:14.450\nKwa mfano, chukua changamoto ya 'mbwa\n\n01:14.450 --> 01:15.530\nambaye si mbwa kabisa'.\n\n01:15.860 --> 01:17.580\nKwa hiyo labda mtu anaweza kuwa\n\n01:17.580 --> 01:19.580\namechagua dubu weusi na mbwa weupe tu\n\n01:19.580 --> 01:21.700\nkwa sababu labda ndivyo alivyozoea zaidi.\n\n01:22.960 --> 01:24.960\nLakini ukweli ni kwamba dubu wanaweza\n\n01:24.960 --> 01:26.960\npia kuwa weupe, na mbwa wanaweza pia\n\n01:26.960 --> 01:28.020\nkuwa weusi vilevile.\n\n01:29.630 --> 01:31.410\nNa kile ambacho data yenye upendeleo\n\n01:31.410 --> 01:33.510\ninaweza kusababisha ni kitu kinachoitwa\n\n01:33.510 --> 01:34.750\nupendeleo wa kialgorithimu.\n\n01:35.270 --> 01:37.270\nKwa hiyo kila mara data yenye upendeleo\n\n01:37.270 --> 01:39.530\ninapomwonyesha AI mtazamo mdogo badala\n\n01:39.530 --> 01:41.670\nya picha kamili, hii husababisha matokeo\n\n01:41.670 --> 01:42.410\nyasiyo sahihi.\n\n01:44.040 --> 01:45.760\nKwa mfano, unaweza kuona hapa\n\n01:45.760 --> 01:47.960\nkwamba—kumbuka kwenye seti yetu ya data,\n\n01:47.960 --> 01:49.920\ntulihakikisha kwamba dubu wote walikuwa\n\n01:49.920 --> 01:51.660\nweusi na mbwa wote walikuwa weupe.\n\n01:53.120 --> 01:55.180\nKwa hiyo kila ilipoona mnyama mweupe,\n\n01:55.180 --> 01:56.800\niliuhusisha na mbwa.\n\n01:57.120 --> 01:59.000\nNa kila ilipoona mnyama mweusi,\n\n01:59.000 --> 02:00.580\niliuhusisha na dubu, sivyo?\n\n02:01.730 --> 02:03.450\nKwa hiyo kimsingi, upendeleo wetu\n\n02:03.450 --> 02:05.930\nulikuwa unaonyesha mtazamo mdogo kuliko uhalisia.\n\n02:08.620 --> 02:10.680\nKwa hiyo ndiyo, dubu wetu alitafsiriwa\n\n02:10.680 --> 02:11.740\nkimakosa kama mbwa.\n\n02:13.570 --> 02:15.410\nSasa, kitu ambacho nataka kuwa wazi\n\n02:15.410 --> 02:17.190\nkabisa ni kwamba, unajua, kuwa na\n\n02:17.190 --> 02:19.670\nupendeleo ni jambo la kibinadamu kabisa, sivyo?\n\n02:20.520 --> 02:22.820\nInaanza tu kuwa tatizo pale unapoutumia\n\n02:22.820 --> 02:24.820\nkwa wengine bila kuzingatia uzoefu na\n\n02:24.820 --> 02:25.720\nmaadili yao wenyewe.\n\n02:27.150 --> 02:29.030\nKwa hiyo, kimsingi, data yetu yenye\n\n02:29.030 --> 02:31.090\nupendeleo inaweza kupelekea AI yetu\n\n02:31.090 --> 02:33.510\nkuwabagua watu ambao tunajaribu kuwasaidia.\n\n02:35.090 --> 02:37.050\nBaadhi ya mifano ya hili inaweza kuwa,\n\n02:37.050 --> 02:38.810\nkama vile, matokeo yasiyo sahihi ya\n\n02:38.810 --> 02:39.870\nkitabibu, sivyo?\n\n02:39.870 --> 02:42.850\nKwa hiyo wakati mwingine AI inaweza\n\n02:42.850 --> 02:45.010\nkuchambua picha za X-ray, na, unajua,\n\n02:45.010 --> 02:46.730\nkama haijapata kuchambua wagonjwa wa\n\n02:46.730 --> 02:48.510\nkutosha wakati wa mafunzo, inaweza\n\n02:48.510 --> 02:49.910\nkufanya makosa.\n\n02:50.530 --> 02:52.510\nKwa hiyo unaweza kuona kwamba ilitoa\n\n02:52.510 --> 02:54.390\nuamuzi wa uchunguzi usio sahihi.\n\n02:54.390 --> 02:58.070\nNa kuhusu madaktari, kama wataamini sana\n\n02:58.070 --> 03:00.290\nmatokeo, sivyo, na wasihakiki mara\n\n03:00.290 --> 03:02.730\nmbili, basi mtu anaweza kupata uchunguzi\n\n03:02.730 --> 03:05.910\nusio sahihi, na hilo linaweza kuwa baya sana.\n\n03:06.180 --> 03:07.820\nJambo lingine ni kwamba kumekuwa na\n\n03:07.820 --> 03:10.180\nmatukio ambapo watu wamekamatwa, sivyo?\n\n03:11.080 --> 03:12.940\nKwa hiyo wakati mwingine mfumo wa AI\n\n03:12.940 --> 03:15.060\numewatambua watu kimakosa kwa sababu\n\n03:15.060 --> 03:17.240\nhaukuwa na data kamili ya mafunzo kuhusu\n\n03:17.240 --> 03:18.880\naina mbalimbali za sura na rangi.\n\n03:20.140 --> 03:22.280\nNa hili limesababisha watu kama Robert\n\n03:22.280 --> 03:24.100\nWilliam kukamatwa kimakosa pia.\n\n03:25.710 --> 03:27.900\nNa hili halihusiani tu na picha, bali\n\n03:27.900 --> 03:29.080\npia na lugha, sivyo?\n\n03:29.920 --> 03:31.780\nWakati mwingine zana za AI zinashindwa\n\n03:31.780 --> 03:33.580\nkufanya kazi kwa sababu data zao za\n\n03:33.580 --> 03:35.360\nmafunzo hazina lugha hiyo ya eneo,\n\n03:35.360 --> 03:37.300\nlahaja ya wenyeji, au misemo ya mitaani\n\n03:37.300 --> 03:37.900\nya kutosha.\n\n03:37.900 --> 03:39.560\nKuna wakati ambapo mwanaume mmoja\n\n03:39.560 --> 03:41.480\naliyekuwa akizungumza Kiarabu alikuwa\n\n03:41.480 --> 03:43.520\nanasalimia asubuhi njema, lakini hilo\n\n03:43.520 --> 03:45.680\nlilitafsiriwa kimakosa kama shambulieni,\n\n03:45.680 --> 03:47.600\nna kusababisha mwanaume huyo kukamatwa\n\n03:47.600 --> 03:49.400\nkimakosa lakini baadaye aliachiwa.\n\n03:49.600 --> 03:51.640\nKwa hiyo kuna matukio mengi kama haya\n\n03:51.640 --> 03:53.780\nambapo tunaposhindwa kuzingatia uzoefu\n\n03:53.780 --> 03:55.600\nau hali ya mtu mwingine, kutokana na\n\n03:55.600 --> 03:58.760\nupendeleo wetu, inaweza kusababisha makosa.\n\n04:00.500 --> 04:02.440\nSasa basi, swali langu kwako ni hili.\n\n04:02.440 --> 04:05.440\nPale makosa yanapotokea, nani\n\n04:05.440 --> 04:07.860\nanawajibika, AI au binadamu, na kwa nini\n\n04:07.860 --> 04:08.760\nunafikiri hivyo?\n\n04:08.760 --> 04:12.060\nTutajibu swali hilo kwenye sehemu inayofuata.\n"}, {"id": "lesson-4/04", "title": "Nani Anawajibika", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-04.mp4", "vtt": "WEBVTT\n\n00:00.740 --> 00:03.040\nSawa, hebu tuangalie swali hili.\n\n00:03.230 --> 00:04.870\nPale makosa yanapotokea, nani\n\n00:04.870 --> 00:06.610\nanawajibika, AI au binadamu?\n\n00:08.180 --> 00:09.820\nSasa, kama bado hujapata muda wa\n\n00:09.820 --> 00:11.740\nkufikiria kuhusu swali hili, simamisha\n\n00:11.740 --> 00:13.920\nvideo haraka na litafakari kwa sekunde chache.\n\n00:16.440 --> 00:18.020\nSawa, moja ya mambo muhimu sana\n\n00:18.020 --> 00:20.160\ntunayotaka uelewe kuhusu mifumo hii ya\n\n00:20.160 --> 00:21.560\nAI ni kwamba ni zana tu.\n\n00:22.640 --> 00:24.720\nMwisho wa siku, watu ndio wanaowajibika.\n\n00:25.540 --> 00:28.460\nZana za AI hazijali matokeo ya vitendo vyao.\n\n00:28.680 --> 00:30.440\nKutokana na tulichokiona, chini yake\n\n00:30.440 --> 00:31.280\nkuna hesabu nyingi.\n\n00:32.520 --> 00:34.220\nInajaribu kutafuta mifumo kati ya\n\n00:34.220 --> 00:35.880\nviingilio na matokeo yake kupitia\n\n00:35.880 --> 00:37.700\nmlinganyo wa hesabu, kwa hiyo hakuna\n\n00:37.700 --> 00:39.300\nhisia wala hisia zinazohusika.\n\n00:40.540 --> 00:42.200\nNa tulichokiona, hizi zana za AI\n\n00:42.200 --> 00:43.900\nzimetumika kusababisha kukamatwa\n\n00:43.900 --> 00:45.880\nkimakosa, kugundua ugonjwa vibaya kwa\n\n00:45.880 --> 00:48.760\nmtu, na hata kusababisha ajali mbaya za vifo.\n\n00:49.510 --> 00:51.410\nNa sababu ya hili ni kwa sababu ni zana\n\n00:51.410 --> 00:53.130\ntu, hivyo watu wanaotengeneza na\n\n00:53.130 --> 00:55.770\nkuitumia ndio wanaowajibika kwa kile kinachotokea.\n\n00:57.350 --> 00:59.260\nSasa kwa kuwa tumeelewa kwamba binadamu\n\n00:59.260 --> 01:01.090\nwako katikati ya hili, ni njia gani\n\n01:01.090 --> 01:02.780\ntunaweza kutumia kupunguza madhara\n\n01:02.780 --> 01:04.600\nyanayotokana na makosa haya ya AI?\n\n01:05.830 --> 01:07.740\nBasi simamisha video na fikiria kuhusu\n\n01:07.740 --> 01:08.850\nhili kwa sekunde chache.\n\n01:11.390 --> 01:13.240\nTunaweza kuangalia hili kwa kuzingatia\n\n01:13.240 --> 01:15.030\nmajukumu mawili ya binadamu na jinsi\n\n01:15.030 --> 01:16.990\nwanavyoweza kupunguza madhara haya,\n\n01:16.990 --> 01:18.690\nkutoka mtazamo wa mtengenezaji na\n\n01:18.700 --> 01:19.810\nmtazamo wa mtumiaji.\n\n01:21.250 --> 01:23.310\nSasa, kama mtengenezaji wa zana hizi za\n\n01:23.310 --> 01:25.330\nAI, ni muhimu kuongeza data mbalimbali\n\n01:25.330 --> 01:27.370\nzenye ubora wa hali ya juu na utofauti\n\n01:27.370 --> 01:30.190\nili kupunguza upendeleo kadri ya uwezo wako.\n\n01:30.400 --> 01:32.160\nLakini kumbuka, binadamu wote wana\n\n01:32.160 --> 01:34.300\nupendeleo kwa sababu kila mmoja wetu ana\n\n01:34.300 --> 01:36.380\nmtazamo tofauti, hivyo ni muhimu sana\n\n01:36.380 --> 01:38.260\nkusikiliza mitazamo tofauti ya watu\n\n01:38.260 --> 01:40.200\nwengine na kuwa mkweli kuhusu mipaka ya\n\n01:40.200 --> 01:41.120\nzana zako za AI.\n\n01:42.650 --> 01:44.810\nSasa, kama mtumiaji wa zana hizi za AI,\n\n01:44.810 --> 01:46.830\nni muhimu kila wakati uhakiki mara mbili\n\n01:46.830 --> 01:48.790\nmatokeo ya zana ya AI pale ambapo kuna\n\n01:48.790 --> 01:50.670\nhatari yoyote kwenye uamuzi wako, na\n\n01:50.670 --> 01:52.890\nkuhakikisha unatoa mrejesho ili kusaidia\n\n01:52.890 --> 01:55.790\nkuboresha zana hizi za AI kwa watengenezaji.\n\n01:56.980 --> 01:59.100\nSasa hebu tufanye mazoezi kidogo kuhusu\n\n01:59.100 --> 02:01.160\njinsi tunavyoweza kuboresha kifaa chetu\n\n02:01.160 --> 02:02.480\ncha kutofautisha dubu na mbwa.\n\n02:03.730 --> 02:05.550\nKwa hiyo, mbali na sifa za rangi nyeusi\n\n02:05.550 --> 02:07.330\nna nyeupe tulizozungumzia, ambapo\n\n02:07.330 --> 02:09.050\ntuliongelea kuhusu dubu weusi na mbwa\n\n02:09.050 --> 02:10.630\nweupe, ni sifa gani nyingine na\n\n02:10.630 --> 02:12.230\nmabadiliko ya sifa hizo yanaweza\n\n02:12.230 --> 02:14.510\nkusaidia kuboresha kifaa chetu cha kutofautisha?\n\n02:16.120 --> 02:18.060\nSawa, basi simamisha video na fikiria\n\n02:18.060 --> 02:20.120\nhili kwa dakika moja, na uone ni sifa\n\n02:20.120 --> 02:22.000\ngani nyingine na utofauti wa sifa hizo\n\n02:22.000 --> 02:23.960\ntunapaswa pia kuzingatia.\n\n02:27.100 --> 02:29.040\nSawa, kuna mambo mengi sana tunayoweza\n\n02:29.040 --> 02:30.840\nkufikiria kuhusu jinsi tunavyoweza\n\n02:30.840 --> 02:32.920\nkupunguza upendeleo na kuongeza mtazamo\n\n02:32.920 --> 02:35.480\nmpana zaidi kwenye mifano yetu ya AI.\n\n02:35.840 --> 02:37.800\nLakini, unajua, kama ulivyoona, kuna\n\n02:37.800 --> 02:39.700\nukomo wa aina za dubu na mbwa tulizonazo.\n\n02:40.480 --> 02:42.500\nKwa hiyo, unajua, kuzingatia tu aina\n\n02:42.500 --> 02:44.620\ntofauti za dubu, aina tofauti za mbwa,\n\n02:44.620 --> 02:46.560\nkuamua kama hao dubu na mbwa wako kwenye\n\n02:46.560 --> 02:48.260\numri wa utotoni au watu wazima,\n\n02:48.260 --> 02:50.520\nmazingira tofauti wanayokaa, na hasa pia\n\n02:50.520 --> 02:51.480\nukubwa wao tofauti.\n\n02:52.280 --> 02:54.040\nNa kuna mambo mengi sana ya kufikiria,\n\n02:54.040 --> 02:55.660\nlakini haya ni baadhi ya mambo ambayo\n\n02:55.660 --> 02:56.600\nunaweza kuzingatia.\n"}, {"id": "lesson-4/05", "title": "Faragha ya Data", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-05.mp4", "vtt": "WEBVTT\n\n00:00.880 --> 00:02.620\nSawa, kwa hiyo tunaelewa kwamba data\n\n00:02.620 --> 00:04.780\ntofauti ni muhimu, lakini je, kwa sababu\n\n00:04.780 --> 00:06.640\ntunaweza kukusanya data, inamaanisha\n\n00:06.640 --> 00:07.740\ntunapaswa kufanya hivyo?\n\n00:08.590 --> 00:10.830\nSasa, data inaweza kutoka mahali popote,\n\n00:10.830 --> 00:12.650\nkama vile tunavyoweza kupiga picha\n\n00:12.650 --> 00:14.550\nsehemu mbalimbali.\n\n00:14.550 --> 00:16.470\nKwa mfano, hii picha ya bustani, tuna\n\n00:16.470 --> 00:18.290\npicha za binadamu na mbwa, na hizi ni\n\n00:18.290 --> 00:20.130\ndata ambazo tunaweza kuongeza kwenye\n\n00:20.130 --> 00:21.050\nmfano wetu wa AI.\n\n00:22.370 --> 00:24.410\nHata hivyo, si data yote inapatikana kwa\n\n00:24.410 --> 00:26.470\nmatumizi, kwa hiyo tunaweza kuiangalia\n\n00:26.470 --> 00:28.310\nkwa njia mbili: data ya umma dhidi ya\n\n00:28.310 --> 00:29.670\ndata binafsi.\n\n00:30.320 --> 00:32.080\nKwa hiyo data ya umma ni taarifa ambayo\n\n00:32.080 --> 00:34.260\nmtu yeyote anaweza kuona lakini inaweza\n\n00:34.260 --> 00:36.680\nkuwa na sheria za jinsi inavyotumika.\n\n00:37.470 --> 00:39.530\nSasa, data binafsi ni taarifa inayoweza\n\n00:39.530 --> 00:41.450\nkumtambua mtu au kushiriki kitu cha\n\n00:41.450 --> 00:43.430\nkibinafsi kumhusu, na hii inahitaji\n\n00:43.430 --> 00:46.370\nruhusa kila mara ili itumike au ionekane.\n\n00:47.680 --> 00:49.660\nBaadhi ya mifano ya data binafsi inaweza\n\n00:49.660 --> 00:51.980\nkuwa, kama vile, uso wako, barua pepe na\n\n00:51.980 --> 00:54.060\nnamba za simu, taarifa zako za afya au\n\n00:54.060 --> 00:56.300\nmatibabu, jina au sahihi yako, taarifa\n\n00:56.300 --> 00:58.880\nza kifedha, na hata anuani ya nyumbani.\n\n00:59.170 --> 01:01.130\nTaarifa hizi zote zinaweza kutoa data\n\n01:01.130 --> 01:02.010\nbinafsi kukuhusu.\n\n01:02.900 --> 01:04.740\nKwa hiyo nataka ufikirie kuhusu swali\n\n01:04.740 --> 01:06.660\nhili: Itakuwaje kama chombo cha AI\n\n01:06.660 --> 01:08.360\nkingefunzwa kwa kutumia picha zako\n\n01:08.360 --> 01:09.720\nbinafsi bila ruhusa yako?\n\n01:11.170 --> 01:12.680\nHilo lingekufanya ujisikieje?\n\n01:13.100 --> 01:15.040\nSasa simamisha video hii na tafakari\n\n01:15.040 --> 01:16.420\nkuhusu hili kwa sekunde chache.\n\n01:19.550 --> 01:22.170\nSawa, labda unahisi hisia nyingi tofauti tofauti.\n\n01:23.100 --> 01:25.100\nLabda unahisi umevamiwa, labda unahisi\n\n01:25.100 --> 01:26.700\naibu, au labda unahisi hasira.\n\n01:27.900 --> 01:29.400\nJambo muhimu la kusema ni kwamba\n\n01:29.400 --> 01:31.500\nhaijalishi unahisi hisia gani, una haki\n\n01:31.500 --> 01:33.420\nya faragha yako, kwa hiyo una haki ya\n\n01:33.420 --> 01:36.000\nkudhibiti jinsi data zako binafsi zinavyotumiwa.\n\n01:37.150 --> 01:38.830\nKitu kuhusu watengenezaji ni kwamba\n\n01:38.830 --> 01:40.930\nwanapaswa kuwa wazi kabisa kuhusu data\n\n01:40.940 --> 01:42.910\nwanazokusanya na waheshimu maamuzi yako\n\n01:42.920 --> 01:43.970\nkama utasema hapana.\n\n01:45.080 --> 01:47.020\nKwa hiyo tuseme ulikuwa na aina tofauti\n\n01:47.020 --> 01:47.840\nza data binafsi.\n\n01:48.750 --> 01:50.750\nUnaweza kuwapa ruhusa waone uso wako,\n\n01:50.750 --> 01:52.650\nlakini usiwape taarifa yoyote kuhusu\n\n01:52.650 --> 01:53.850\ntaarifa zako za kifedha.\n\n01:56.260 --> 01:57.820\nLakini jambo ni kwamba, kumekuwa na\n\n01:57.820 --> 01:59.860\nmatukio ambapo watengenezaji wametumia\n\n01:59.860 --> 02:02.000\nvibaya data binafsi na wamekumbana na madhara.\n\n02:02.710 --> 02:04.730\nKulikuwa na kampuni inaitwa Alva Album\n\n02:04.730 --> 02:06.650\nambayo ilishtakiwa kwa kutumia picha za\n\n02:06.650 --> 02:08.810\nwatu kufundisha mifumo ya AI bila ruhusa\n\n02:08.810 --> 02:10.490\nsahihi, na serikali ya Marekani\n\n02:10.490 --> 02:12.670\niligundua hilo na kuwaamuru kufuta data\n\n02:12.670 --> 02:13.950\nzao na mifumo yao ya AI.\n\n02:16.550 --> 02:18.370\nKwa kuwa sasa tunaelewa hili, nataka\n\n02:18.370 --> 02:20.530\nkukuuliza swali hili: Tunawezaje kulinda\n\n02:20.530 --> 02:22.570\nfaragha tunapotengeneza na kutumia zana\n\n02:22.570 --> 02:23.170\nhizi za AI?\n\n02:24.640 --> 02:26.600\nSitisha video hii na fikiria kuhusu hilo\n\n02:26.600 --> 02:27.440\nkwa sekunde chache.\n\n02:30.930 --> 02:32.890\nSawa, basi tunaweza kuangalia hili kwa\n\n02:32.890 --> 02:35.070\nmitazamo miwili, upande wa mtengenezaji\n\n02:35.070 --> 02:36.190\nna upande wa mtumiaji.\n\n02:37.710 --> 02:39.830\nSasa, kama mtengenezaji, unapaswa kila\n\n02:39.830 --> 02:41.830\nwakati kuomba ruhusa kabla ya kutumia\n\n02:41.830 --> 02:42.450\ndata binafsi.\n\n02:43.700 --> 02:45.480\nUnahitaji kuwa wazi kuhusu jinsi\n\n02:45.480 --> 02:47.420\ninavyotumika na uondoe taarifa yoyote\n\n02:47.420 --> 02:48.760\nbinafsi ambayo haitakiwi.\n\n02:50.120 --> 02:51.940\nSasa, kutoka mtazamo wa mtumiaji,\n\n02:51.940 --> 02:53.880\nunapaswa kusoma jinsi data yako binafsi\n\n02:53.880 --> 02:55.640\ninavyotumika, na unapaswa kuuliza\n\n02:55.640 --> 02:58.640\nmaswali kuhusu jinsi taarifa zako zinavyotumika.\n\n02:59.000 --> 03:01.060\nUna haki juu ya taarifa zako binafsi na\n\n03:01.060 --> 03:03.240\nunaweza kukataa au kuweka mipaka juu ya\n\n03:03.240 --> 03:04.300\nkile kinachoshirikiwa.\n\n03:06.470 --> 03:08.290\nSawa, sasa tufanye zoezi hili kuhusu\n\n03:08.290 --> 03:10.170\njinsi tunavyoweza kulinda faragha kwenye\n\n03:10.170 --> 03:12.010\nkifaa chetu cha kutofautisha dubu na mbwa.\n\n03:12.560 --> 03:14.360\nKwa hiyo tuseme tuna picha hii hapa na\n\n03:14.360 --> 03:16.280\ntunataka kuiweka kwenye kifaa chetu cha\n\n03:16.280 --> 03:18.300\nkutofautisha dubu na mbwa, kwenye huyu mbwa.\n\n03:19.140 --> 03:21.020\nUtafanyaje kuhakikisha kwamba picha hii\n\n03:21.020 --> 03:22.840\ninaheshimu faragha kabla ya kuitumia\n\n03:22.840 --> 03:24.920\nkwenye kifaa chetu cha kutofautisha dubu na mbwa?\n\n03:26.160 --> 03:27.780\nNa kwa taarifa tu, huyu mbwa kwenye\n\n03:27.780 --> 03:29.240\npicha hii hana mmiliki yeyote.\n\n03:31.420 --> 03:33.320\nSawa, sasa simamisha video na fikiria\n\n03:33.320 --> 03:34.660\nkuhusu hili kwa sekunde chache.\n\n03:37.580 --> 03:39.420\nSawa, jambo ni kwamba, kuna baadhi ya\n\n03:39.420 --> 03:41.540\ntaarifa binafsi ambazo tumekuta ndani ya\n\n03:41.540 --> 03:41.980\npicha hii.\n\n03:42.860 --> 03:44.700\nTuna anuani ya nyumba ya mtu huyu, namba\n\n03:44.700 --> 03:46.920\nya gari lake, na sura ya mtu huyo ndani ya picha.\n\n03:48.310 --> 03:50.250\nKwa hiyo tuseme tunataka kutumia picha\n\n03:50.250 --> 03:50.850\nkama ilivyo.\n\n03:51.630 --> 03:53.450\nKatika hali kama hizo, tunapaswa kila\n\n03:53.450 --> 03:54.410\nmara kuomba ruhusa.\n\n03:55.450 --> 03:56.950\nSasa, jambo lingine ni kwamba,\n\n03:56.950 --> 03:58.910\ntukishapata picha hii, unajua, kitu\n\n03:58.910 --> 04:00.830\nkingine ni kwamba tuondoe taarifa zote\n\n04:00.830 --> 04:02.350\nbinafsi ambazo hazihitajiki.\n\n04:03.240 --> 04:05.040\nKuhusu kigeuzi chetu cha kutofautisha\n\n04:05.040 --> 04:06.960\ndubu na mbwa, tunachojali ni mbwa tu,\n\n04:06.960 --> 04:08.740\nkwa hiyo hii ni njia ya kulinda faragha\n\n04:08.740 --> 04:10.920\nya mtu, kwa kuchukua taarifa zote nje,\n\n04:10.920 --> 04:12.560\nna pia unaweza kuficha kwa ukungu\n\n04:12.560 --> 04:14.720\ntaarifa binafsi kama utaamua kutokukata\n\n04:14.720 --> 04:15.240\npicha yote.\n"}, {"id": "lesson-4/06", "title": "AI Inayowajibika", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-06.mp4", "vtt": "WEBVTT\n\n00:00.720 --> 00:02.800\nSawa, tumezungumza kuhusu wazo hili la\n\n00:02.800 --> 00:04.760\nupendeleo wa data na faragha ya data na\n\n00:04.760 --> 00:06.960\njinsi, mwishoni mwa siku, binadamu ndio\n\n00:06.960 --> 00:08.420\nwanaowajibika kwa mambo haya.\n\n00:09.700 --> 00:11.700\nHii ndiyo tunaita AI yenye uwajibikaji.\n\n00:12.970 --> 00:14.670\nNi kuhusu kuhakikisha watu wanakuwa\n\n00:14.670 --> 00:16.750\nwabunifu wenye uwajibikaji na watumiaji\n\n00:16.750 --> 00:18.130\nmakini wa hizi zana za AI.\n\n00:19.590 --> 00:21.130\nNa moja ya mambo muhimu kabisa\n\n00:21.130 --> 00:23.330\nninayotaka ukumbuke ni kwamba kila mmoja\n\n00:23.330 --> 00:25.710\nwetu ana jukumu katika kuamua jinsi zana\n\n00:25.710 --> 00:27.610\nza AI zinavyotengenezwa na kutumiwa.\n\n00:28.830 --> 00:30.930\nKumbuka, na hili halihusiani tu na AI,\n\n00:30.930 --> 00:32.810\nbali teknolojia kwa ujumla, kwamba\n\n00:32.810 --> 00:35.010\nteknolojia ni zao la maamuzi ya binadamu.\n"}, {"id": "lesson-4/07", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=sw"}, {"id": "lesson-4/08", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-TZ-lesson-4-08.mp4", "vtt": "WEBVTT\n\n00:00.540 --> 00:02.720\nSawa, sasa ni wakati wa mradi kwa somo\n\n00:02.720 --> 00:04.300\nla nne, somo letu la mwisho.\n\n00:05.830 --> 00:08.210\nKwa hiyo sasa nataka upanue mtazamo wako.\n\n00:09.510 --> 00:11.530\nSasa fikiria kuhusu sifa ulizotumia\n\n00:11.530 --> 00:13.610\nkutofautisha kati ya makundi mbalimbali\n\n00:13.610 --> 00:15.610\nkwenye somo la tatu, na uone jinsi\n\n00:15.610 --> 00:17.810\nunavyoweza kuongeza utofauti zaidi,\n\n00:17.810 --> 00:20.050\nkuchunguza sifa nyingine, au hata kupata\n\n00:20.050 --> 00:21.870\n     var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
