n\n00:32.480 --> 00:38.140\nMwalimu akiruhusu, kusanya data zaidi\nkwa ajili ya AI classifier yako.\n\n00:38.930 --> 00:42.430\nKwa hiyo, kusanya data\nzaidi kama inahitajika.\n\n00:42.430 --> 00:47.960\nKwa mfano wa jibu la somo la tatu,\nambalo ni kutambua sifa, ni sifa gani\n\n00:47.960 --> 00:50.910\nclassifier yako itatumia kupanga data?\n\n00:51.680 --> 00:54.500\nKwa mfano huu, mwanafunzi alisema hivi:\n\n00:54.500 --> 00:57.240\n\"Nitatumia rangi, umbo, na ukubwa. Kwa\n\n00:57.240 --> 00:59.840\nmfano, ndizi ni ndefu na za manjano,\n\n00:59.840 --> 01:02.440\nmachungwa ni mviringo na ya rangi ya\n\n01:02.440 --> 01:04.890\nchungwa, na parachichi ni mviringo\n\n01:04.890 --> 01:06.990\nmrefu na ya kijani. Sifa hizi\n\n01:06.990 --> 01:09.730\nzinazifanya ziwe rahisi kutofautisha.\"\n"}, {"id": "lesson-3/09", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=3&lang=sw"}]}, {"id": "lesson-4", "kicker": "Somo la 4", "title": "Je Mashine Zinaweza Kuwajibika", "items": [{"id": "lesson-4/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-01.mp4", "vtt": "WEBVTT\n\n00:00.180 --> 00:03.990\nSawa, somo la nne: Je,\nmashine zinaweza kuwajibika?\n\n00:04.670 --> 00:09.380\nKwa hiyo, tunachojifunza katika lengo la\nsomo la nne ni kwamba tutaelezea jinsi\n\n00:09.380 --> 00:13.680\nupendeleo wa data unavyopelekea utabiri\nusio sahihi, tutaelezea kwa nini\n\n00:13.680 --> 00:17.180\nbinadamu wanawajibika kwa AI na jinsi ya\nkupunguza madhara.\n\n00:17.520 --> 00:21.830\nTutaelezea njia rahisi za kulinda\nfaragha ya watu, na tutatambua jinsi\n\n00:21.830 --> 00:26.390\nupendeleo, faragha, na uwajibikaji\nvinavyohusiana na AI yenye uwajibikaji.\n"}, {"id": "lesson-4/02", "title": "Changamoto ya Bearly a Dog", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-02.mp4", "vtt": "WEBVTT\n\n00:00.100 --> 00:04.230\nTunaenda kufanya changamoto inayoitwa\nchangamoto ya 'karibu sio mbwa', na\n\n00:04.230 --> 00:08.430\nlengo lako ni kutengeneza mfano ambao\nunaweza kutofautisha kati ya dubu na\n\n00:08.430 --> 00:10.090\nmbwa na upite majaribio yote.\n\n00:10.090 --> 00:14.400\nKizuizi chako ni kwamba una dakika tatu,\nunaweza kuchagua hadi dubu kumi, na\n\n00:14.400 --> 00:16.230\nunaweza kuchagua hadi mbwa kumi.\n\n00:17.120 --> 00:20.300\nIli kupata changamoto hii,\nrudi kwenye app ya NeuroPocket.\n\n00:20.620 --> 00:24.020\nUtaona kitu kinachoitwa\nchangamoto ya kujaribu upendeleo.\n\n00:24.020 --> 00:28.400\nBonyeza hapo, bonyeza anza changamoto,\nna utaona mara moja kwamba unaweza\n\n00:28.400 --> 00:30.900\nkuchagua hadi dubu kumi na hadi mbwa\nkumi.\n\n00:31.740 --> 00:35.660\nNa kama vile umezoea kutumia\nNeuroPocket, baada ya kukusanya data zako,\n\n00:35.660 --> 00:39.690\nunaenda kwenye mafunzo, halafu unaenda\nkwenye modeli yako ambapo utaendesha\n\n00:39.690 --> 00:42.350\nkesi zote za majaribio na kuona kama\numepita zote.\n\n00:42.350 --> 00:46.820\nSawa, basi hebu tuanze na changamoto hii,\nna nitawaona mwishoni mwa hii changamoto.\n", "action": "challenge"}, {"id": "lesson-4/03", "title": "Upendeleo ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-03.mp4", "vtt": "WEBVTT\n\n00:01.100 --> 00:02.610\nSawa, karibu tena.\n\n00:02.910 --> 00:06.670\nBaada ya kucheza changamoto ya 'Bearly\na Dog', sasa kuna swali kwako.\n\n00:07.270 --> 00:11.040\nMatokeo yako yalikuwa gani,\nna kwa nini unadhani yalitokea hivyo?\n\n00:11.040 --> 00:13.050\nJe, uliweza kupita majaribio yote?\n\n00:13.050 --> 00:15.350\nJe, uliweza kupita baadhi ya majaribio?\n\n00:15.680 --> 00:17.100\nAu ulianguka kwenye yote?\n\n00:17.100 --> 00:21.070\nBasi simamisha video kidogo na tafakari\nkuhusu hilo kwa sekunde chache.\n\n00:23.340 --> 00:28.470\nSawa, kama hukuweza kupita majaribio\nyote, huenda ni kwa sababu ya upendeleo\n\n00:28.470 --> 00:29.430\nwa kibinadamu.\n\n00:29.640 --> 00:33.970\nSasa, kuhusu binadamu ni kwamba sote\ntunaona dunia kwa njia tofauti kwa\n\n00:33.970 --> 00:38.360\nsababu, unajua, kila mmoja wetu ana\nuzoefu tofauti wa maisha, na tunaita\n\n00:38.360 --> 00:40.890\nmtazamo huu mdogo wa dunia kuwa\nupendeleo.\n\n00:40.890 --> 00:43.240\nHii picha inaelezea vizuri jambo hili.\n\n00:43.830 --> 00:48.860\nUnajua, kuna hawa watu watatu, na yule\nmtu wa kushoto ana shina la tembo na\n\n00:48.860 --> 00:50.150\nanafikiri ni nyoka.\n\n00:50.810 --> 00:56.020\nYule mtu wa katikati anafikiri ni ukuta,\nna yule mwenye mkia anafikiri kimsingi\n\n00:56.020 --> 00:56.620\nni kamba.\n\n00:57.130 --> 01:02.630\nKwa hiyo wote wana uzoefu tofauti na\ntembo yule yule, na hiyo ndiyo sababu\n\n01:02.630 --> 01:04.360\nwana mtazamo huu mdogo.\n\n01:05.950 --> 01:10.030\nKwa hiyo kinachotokea ni kwamba\nupendeleo wetu au mtazamo wetu mdogo\n\n01:10.030 --> 01:13.430\nunaweza kuathiri sana sifa tunazochagua\nkwenye data yetu.\n\n01:13.660 --> 01:17.220\nKwa mfano, chukua changamoto\nya 'huyu si mbwa kabisa'.\n\n01:17.220 --> 01:22.340\nLabda mtu anaweza kuwa amechagua dubu\nweusi na mbwa weupe tu kwa sababu labda\n\n01:22.340 --> 01:24.020\nhao ndiyo anaozoea zaidi.\n\n01:24.690 --> 01:30.210\nLakini ukweli ni kwamba dubu wanaweza\nkuwa weupe pia, na mbwa wanaweza kuwa\n\n01:30.210 --> 01:31.320\nweusi vilevile.\n\n01:32.220 --> 01:36.900\nNa kile ambacho data yenye upendeleo\ninaweza kusababisha ni kitu kinachoitwa\n\n01:36.900 --> 01:38.580\nupendeleo wa kialgorithimu.\n\n01:38.580 --> 01:43.390\nKwa hiyo kila mara data yenye upendeleo\ninapomwonyesha AI mtazamo mdogo badala\n\n01:43.390 --> 01:46.760\nya picha kamili, hii husababisha matokeo\nyasiyo sahihi.\n\n01:46.760 --> 01:51.060\nKwa mfano, unaweza kuona hapa kwamba\nkumbuka kwenye seti yetu ya data,\n\n01:51.060 --> 01:55.180\ntulihakikisha dubu wote walikuwa weusi\nna mbwa wote walikuwa weupe.\n\n01:56.410 --> 02:00.980\nKwa hiyo kila ilipoona mnyama mweupe,\niliuhusisha na mbwa.\n\n02:01.140 --> 02:05.930\nNa kila ilipoona mnyama mweusi,\niliuhusisha na dubu, sivyo?\n\n02:06.210 --> 02:10.700\nKwa hiyo, upendeleo wetu ulikuwa\nunaonyesha mtazamo mdogo kuliko uhalisia.\n\n02:12.700 --> 02:16.910\nKwa hiyo ndiyo, dubu wetu alichanganywa\nna kutambulika kama mbwa.\n\n02:16.910 --> 02:21.380\nSasa, kitu ambacho nataka kuwa wazi\nkabisa ni kwamba, unajua, kuwa na\n\n02:21.380 --> 02:24.400\nupendeleo ni jambo la kibinadamu kabisa,\nsivyo?\n\n02:24.810 --> 02:30.320\nInaanza tu kuwa tatizo pale unapoutumia\nkwa wengine bila kuzingatia uzoefu na\n\n02:30.320 --> 02:31.770\nmaadili yao wenyewe.\n\n02:32.460 --> 02:38.280\nKwa hiyo, data yetu yenye upendeleo\ninaweza kuongoza AI yetu kuwabagua watu\n\n02:38.280 --> 02:40.480\nambao tunajaribu kuwasaidia.\n\n02:41.310 --> 02:45.930\nMfano wa hili unaweza kuwa kama matokeo\nyasiyo sahihi ya kitabibu, sivyo?\n\n02:46.430 --> 02:50.800\nKwa hiyo wakati mwingine AI inaweza\nkuchambua picha za X-ray, na unajua,\n\n02:50.800 --> 02:55.110\nkama haijapata kuchambua wagonjwa wa\nkutosha wakati wa mafunzo, inaweza\n\n02:55.110 --> 02:56.030\nkufanya makosa.\n\n02:56.730 --> 03:00.260\nKwa hiyo unaweza kuona kwamba ilitoa\nuamuzi wa uchunguzi usio sahihi.\n\n03:00.850 --> 03:05.980\nNa kuhusu madaktari, kama wataamini sana\nmatokeo, sivyo, na wasikague mara ya\n\n03:05.980 --> 03:11.570\npili, basi mtu anaweza kupata uchunguzi\nusio sahihi, na hilo linaweza kuwa baya sana.\n\n03:12.620 --> 03:17.570\nJambo lingine ni kwamba kumekuwa na\nvisa ambapo watu wamekamatwa, sivyo?\n\n03:17.760 --> 03:22.780\nWakati mwingine mfumo wa AI umewatambua\nwatu vibaya kwa sababu haukuwa na data\n\n03:22.780 --> 03:26.560\nkamili ya mafunzo kuhusu aina mbalimbali\nza nyuso na rangi.\n\n03:27.180 --> 03:32.170\nNa hii imesababisha watu kama Robert\nWilliams kukamatwa kimakosa pia.\n\n03:32.170 --> 03:36.500\nNa hii haihusiani tu na picha pekee,\nbali pia lugha, sivyo?\n\n03:36.500 --> 03:42.090\nWakati mwingine zana za AI zinashindwa\nkwa sababu data zao za mafunzo hazina\n\n03:42.090 --> 03:46.940\nlugha hiyo ya kutosha, lahaja ya eneo\nhilo, au misemo ya kienyeji.\n\n03:47.500 --> 03:52.280\nKuna wakati ambapo mwanaume mmoja\naliyekuwa akizungumza Kiarabu alikuwa\n\n03:52.280 --> 03:57.410\nakitoa salamu ya asubuhi njema, lakini\nilitafsiriwa vibaya kuwa shambulieni,\n\n03:57.410 --> 04:02.400\njambo lililosababisha mwanaume huyo\nkukamatwa kimakosa, ingawa aliachiliwa\n\n04:02.400 --> 04:02.950\nbaadaye.\n\n04:02.950 --> 04:07.730\nKwa hiyo kuna visa vingi kama hivi\nambapo tukikosa kuzingatia uzoefu au\n\n04:07.730 --> 04:12.380\nhali ya mtu mwingine, kutokana na\nupendeleo wetu, inaweza kusababisha\n\n04:12.380 --> 04:12.860\nmakosa.\n\n04:13.630 --> 04:16.290\nSasa basi, swali langu kwako ni hili.\n\n04:16.290 --> 04:21.250\nPale makosa yanapotokea, nani\nanawajibika, AI au binadamu, na kwa nini\n\n04:21.250 --> 04:22.400\nunafikiri hivyo?\n\n04:22.400 --> 04:25.560\nTutajibu swali hilo\nkwenye sehemu inayofuata.\n"}, {"id": "lesson-4/04", "title": "Nani Anawajibika", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-04.mp4", "vtt": "WEBVTT\n\n00:00.600 --> 00:02.780\nSawa, hebu tuangalie swali hili.\n\n00:02.800 --> 00:07.140\nWakati makosa yanatokea,\nnani anawajibika, AI au binadamu?\n\n00:07.880 --> 00:11.910\nSasa, kama bado hujapata nafasi ya\nkufikiria kuhusu swali hili, simamisha\n\n00:11.910 --> 00:14.320\nvideo haraka na ufikirie kwa sekunde\nchache.\n\n00:16.100 --> 00:21.230\nSawa, moja ya mambo muhimu sana\ntunayotaka uelewe kuhusu mifumo hii ya\n\n00:21.230 --> 00:23.010\nAI ni kwamba ni zana tu.\n\n00:23.680 --> 00:26.330\nMwisho wa siku, watu ndio wanawajibika.\n\n00:26.430 --> 00:29.760\nZana za AI hazijali kuhusu\nmatokeo ya vitendo vyake.\n\n00:29.860 --> 00:33.270\nKutokana na kile tumeona,\nchini yake kuna hesabu nyingi tu.\n\n00:33.740 --> 00:38.270\nInajaribu kutafuta mifumo kati ya kile\ninachoingiza na kinachotoka kupitia\n\n00:38.270 --> 00:42.370\nmlinganyo wa hesabu, kwa hiyo hakuna\nhisia wala hisia zinazohusika.\n\n00:42.370 --> 00:46.350\nNa kile tumeona, hizi zana za AI\nzimetumika kusababisha kukamatwa\n\n00:46.350 --> 00:50.940\nkimakosa, kugundua ugonjwa vibaya kwa\nmtu, na hata kusababisha ajali mbaya.\n\n00:51.960 --> 00:56.900\nNa sababu ya hili ni kwa sababu ni zana\ntu, hivyo watu wanaotengeneza na kutumia\n\n00:56.900 --> 00:59.400\nndio wanawajibika kwa kile kinachotokea.\n\n01:00.290 --> 01:04.600\nSasa kwa kuwa tumeelewa kwamba binadamu\nwako katikati ya hili, ni njia gani\n\n01:04.600 --> 01:08.800\ntunaweza kutumia kupunguza madhara\nyanayosababishwa na makosa haya ya AI?\n\n01:09.320 --> 01:13.160\nBasi simamisha video na fikiria\nkuhusu hili kwa sekunde chache.\n\n01:14.920 --> 01:19.070\nTunaweza kuangalia hili kwa mitazamo\nmiwili ya binadamu na jinsi wanavyoweza\n\n01:19.070 --> 01:23.210\nkupunguza madhara haya, kutoka upande wa\nmtengenezaji na upande wa mtumiaji.\n\n01:23.940 --> 01:29.010\nSasa, kama mtengenezaji wa hizi zana za\nAI, ni muhimu kuongeza data mbalimbali\n\n01:29.010 --> 01:33.880\nzenye ubora wa juu na utofauti ili\nkupunguza upendeleo kadri ya uwezo wako.\n\n01:34.090 --> 01:38.730\nLakini kumbuka, binadamu wote wana\nupendeleo kwa sababu kila mmoja wetu ana\n\n01:38.730 --> 01:43.240\nmtazamo tofauti, hivyo ni muhimu sana\nkusikiliza mitazamo tofauti ya watu\n\n01:43.240 --> 01:46.690\nwengine na kuwa mkweli kuhusu mipaka ya\nzana zako za AI.\n\n01:47.640 --> 01:53.890\nKama mtumiaji wa AI, ni lazima uhakiki\nmatokeo pale uamuzi una hatari, na utoe\n\n01:53.890 --> 01:56.250\nmrejesho kuboresha zana hizi.\n\n01:56.250 --> 02:02.330\nHebu tufanye mazoezi ya kuboresha kifaa\nchetu cha kutofautisha dubu na mbwa.\n\n02:02.330 --> 02:08.090\nZaidi ya rangi nyeusi na nyeupe\ntulizozungumzia, ni sifa gani zingine na\n\n02:08.090 --> 02:12.070\nmabadiliko yake yatasaidia kuboresha\nutambuzi huu?\n\n02:13.430 --> 02:13.790\nSawa.\n\n02:13.830 --> 02:18.500\nSasa, simamisha video na fikiria kuhusu\nhili kwa dakika moja, uh, na uone ni\n\n02:18.500 --> 02:22.670\nsifa gani zingine na utofauti wa hizo\nsifa tunapaswa pia kuzingatia.\n\n02:25.750 --> 02:29.980\nSawa, kwa hiyo kuna mambo mengi sana\ntunayoweza kufikiria kuhusu jinsi\n\n02:29.980 --> 02:34.270\ntunavyoweza kupunguza upendeleo na\nkuongeza mtazamo mpana kwenye mifano\n\n02:34.270 --> 02:34.940\nyetu ya AI.\n\n02:35.310 --> 02:39.910\nLakini, unajua, kama ulivyoona,\nkuna ukomo wa dubu na mbwa tulionao.\n\n02:40.000 --> 02:44.510\nKwa hiyo, unajua, kuzingatia tu aina\ntofauti za dubu, aina tofauti za mbwa,\n\n02:44.510 --> 02:49.190\nkuamua kama hao dubu na mbwa wako kwenye\numri wa mtoto au mtu mzima, mazingira\n\n02:49.190 --> 02:52.170\ntofauti wanayokaa, na hasa pia ukubwa\nwao tofauti.\n\n02:52.170 --> 02:56.730\nNa kuna mambo mengi sana ya kufikiria,\nlakini haya ni baadhi ya mambo ambayo\n\n02:56.730 --> 02:57.890\nunaweza kuzingatia.\n"}, {"id": "lesson-4/05", "title": "Faragha ya Data", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-05.mp4", "vtt": "WEBVTT\n\n00:00.800 --> 00:05.180\nSawa, kwa hiyo tunaelewa kwamba data\ntofauti ni muhimu, lakini je, kwa sababu\n\n00:05.180 --> 00:08.630\ntunaweza kukusanya data, inamaanisha\ntunapaswa kufanya hivyo?\n\n00:08.630 --> 00:12.890\nSasa, data inaweza kutoka mahali popote,\nkama vile tunavyoweza kupiga picha\n\n00:12.890 --> 00:13.930\nsehemu mbalimbali.\n\n00:13.930 --> 00:18.190\nKwa mfano, hii picha ya bustani, tuna\npicha za binadamu na mbwa, na hizi ni\n\n00:18.190 --> 00:21.300\ndata ambazo tunaweza kuongeza kwenye\nmodeli yetu ya AI.\n\n00:22.370 --> 00:26.990\nHata hivyo, si data yote inapatikana kwa\nmatumizi, kwa hiyo tunaweza kuiangalia\n\n00:26.990 --> 00:30.140\nkwa njia mbili: data ya umma dhidi ya\ndata ya binafsi.\n\n00:30.790 --> 00:35.010\nKwa hiyo data ya umma ni taarifa ambayo\nmtu yeyote anaweza kuona lakini inaweza\n\n00:35.010 --> 00:37.220\nkuwa na sheria kuhusu jinsi inavyotumiwa.\n\n00:37.860 --> 00:42.700\nSasa, data ya binafsi, hiyo ni taarifa\ninayoweza kumtambua mtu au kushiriki\n\n00:42.700 --> 00:47.540\nkitu cha kibinafsi kumhusu, na hii\ninahitaji ruhusa kila wakati ili itumike\n\n00:47.540 --> 00:48.330\nau ionekane.\n\n00:49.670 --> 00:54.580\nBaadhi ya mifano ya data ya binafsi\ninaweza kuwa, kama vile, uso wako, barua\n\n00:54.580 --> 00:59.690\npepe na nambari za simu, taarifa zako za\nafya au matibabu, jina au sahihi yako,\n\n00:59.690 --> 01:03.020\ntaarifa za kifedha, na hata anwani yako\nya nyumbani.\n\n01:03.430 --> 01:07.440\nTaarifa hizi zote zinaweza\nkutoa data binafsi kukuhusu.\n\n01:07.560 --> 01:12.240\nKwa hiyo nataka ufikirie kuhusu swali\nhili: Itakuwaje kama chombo cha AI\n\n01:12.240 --> 01:15.870\nkingefunzwa kutumia picha zako binafsi\nbila ruhusa yako?\n\n01:15.870 --> 01:17.780\nHilo lingekufanya ujisikieje?\n\n01:18.050 --> 01:22.050\nSasa simamisha video hii na tafakari\nkuhusu hili kwa sekunde chache.\n\n01:24.580 --> 01:27.620\nSawa, labda unahisi\nhisia tofauti tofauti.\n\n01:27.730 --> 01:31.990\nLabda unahisi umevamiwa, labda unahisi\naibu, au labda unahisi hasira.\n\n01:32.410 --> 01:37.140\nJambo muhimu la kusema ni kwamba\nhaijalishi unahisi hisia gani, una haki\n\n01:37.140 --> 01:41.800\nya faragha yako, kwa hiyo una haki ya\nkudhibiti jinsi data zako binafsi\n\n01:41.800 --> 01:42.740\nzinavyotumiwa.\n\n01:43.270 --> 01:47.620\nKitu kuhusu watengenezaji ni kwamba\nwanapaswa kuwa wazi kabisa kuhusu data\n\n01:47.620 --> 01:51.130\nwanazokusanya na waheshimu maamuzi yako\nkama utasema hapana.\n\n01:51.650 --> 01:54.700\nKwa hiyo tuseme ulikuwa na\naina tofauti za data binafsi.\n\n01:54.820 --> 01:59.250\nUnaweza kuwapa ruhusa waone uso wako,\nlakini usiwape taarifa zozote kuhusu\n\n01:59.250 --> 02:00.650\nhabari zako za kifedha.\n\n02:02.330 --> 02:06.940\nLakini jambo ni kwamba, kumekuwa na visa\nambapo watengenezaji wametumia vibaya\n\n02:06.940 --> 02:09.450\ndata binafsi na wamekumbana na athari\nzake.\n\n02:09.450 --> 02:14.060\nKulikuwa na kampuni inaitwa Everalbum\nambayo ilishtakiwa kwa kutumia picha za\n\n02:14.060 --> 02:18.310\nwatu kufundisha mifumo ya AI bila ruhusa\nsahihi, na serikali ya Marekani\n\n02:18.310 --> 02:22.080\niligundua hilo na kuwaamuru kufuta data\nzao na mifumo yao ya AI.\n\n02:24.390 --> 02:29.690\nKwa kuwa sasa tunaelewa hili, nataka\nkukuuliza swali hili: Tunawezaje kulinda\n\n02:29.690 --> 02:32.820\nfaragha tunapounda na kutumia zana hizi\nza AI?\n\n02:32.820 --> 02:37.000\nSitisha video hii na ufikirie\nkuhusu hilo kwa sekunde chache.\n\n02:40.450 --> 02:44.940\nSawa, basi tunaweza kuangalia hili kwa\nmitazamo miwili, upande wa mtengenezaji\n\n02:44.940 --> 02:46.230\nna upande wa mtumiaji.\n\n02:46.940 --> 02:51.860\nSasa, kama mtengenezaji, unapaswa kila\nwakati kuomba ruhusa kabla ya kutumia\n\n02:51.860 --> 02:52.710\ndata binafsi.\n\n02:53.200 --> 02:57.230\nUnahitaji kuwa wazi kuhusu jinsi\ninavyotumika na uondoe taarifa binafsi\n\n02:57.230 --> 02:58.380\nambazo hazihitajiki.\n\n02:59.010 --> 03:03.500\nSasa, kutoka kwa mtazamo wa mtumiaji,\nunapaswa kusoma jinsi data yako binafsi\n\n03:03.500 --> 03:07.210\ninavyotumika, na unapaswa kuuliza\nmaswali kuhusu jinsi data yako\n\n03:07.210 --> 03:07.980\ninavyotumika.\n\n03:07.980 --> 03:12.580\nUna haki juu ya taarifa zako binafsi na\nunaweza kukataa au kuweka mipaka juu ya\n\n03:12.580 --> 03:13.880\nkile kinachoshirikiwa.\n\n03:13.880 --> 03:18.360\nSawa, basi tufanye zoezi hili kuhusu\njinsi tunavyoweza kulinda faragha kwenye\n\n03:18.360 --> 03:20.780\nkifaa chetu cha kutofautisha dubu na\nmbwa.\n\n03:21.790 --> 03:26.230\nKwa hiyo tuseme tuna picha hii hapa na\ntunataka kuiongeza kwenye kifaa chetu\n\n03:26.230 --> 03:28.960\ncha kutofautisha dubu na mbwa kuhusu\nhuyu mbwa.\n\n03:29.190 --> 03:33.060\nUtafanyaje kuhakikisha kwamba picha hii\ninaheshimu faragha kabla ya kuitumia\n\n03:33.060 --> 03:35.540\nkwenye kifaa chetu cha kutofautisha dubu\nna mbwa?\n\n03:36.140 --> 03:40.430\nNa kwa taarifa tu, huyu mbwa kwenye\npicha hii hana mmiliki yeyote.\n\n03:40.430 --> 03:44.910\nSawa, basi simamisha video na fikiria\nkuhusu hili kwa sekunde chache.\n\n03:47.770 --> 03:52.750\nSawa, jambo ni kwamba, kuna baadhi ya\ntaarifa binafsi ambazo tumepata ndani ya\n\n03:52.750 --> 03:53.400\npicha hii.\n\n03:53.570 --> 03:57.820\nTuna anuani ya nyumba ya mtu huyu, namba\nya gari lake, na uso wa mtu huyo ndani\n\n03:57.820 --> 03:58.310\nya picha.\n\n03:59.040 --> 04:02.030\nKwa hiyo tuseme tunataka\nkutumia picha hii kama ilivyo.\n\n04:02.330 --> 04:05.860\nKatika hali kama hizi,\ntunapaswa kila mara kuomba ruhusa.\n\n04:05.860 --> 04:09.960\nSasa, jambo lingine ni kwamba,\ntukishapata picha hii, unajua, kitu\n\n04:09.960 --> 04:14.130\nkingine ni kwamba tuondoe taarifa zote\nbinafsi ambazo hazihitajiki.\n\n04:14.490 --> 04:19.210\nKuhusu kigeuzi chetu cha kutambua dubu\nna mbwa, tunachojali ni mbwa tu, kwa\n\n04:19.210 --> 04:23.810\nhiyo hii ni njia ya kulinda faragha ya\nmtu kwa kutoa taarifa zote, na pia\n\n04:23.810 --> 04:28.530\nunaweza kuficha ( blur) taarifa binafsi\nkama utaamua kutokukata picha yote.\n"}, {"id": "lesson-4/06", "title": "AI Inayowajibika", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-06.mp4", "vtt": "WEBVTT\n\n00:00.520 --> 00:05.620\nSawa, tumezungumza kuhusu wazo hili la\nupendeleo wa data na faragha ya data na\n\n00:05.620 --> 00:09.540\njinsi, mwishowe, binadamu ndio\nwanaowajibika kwa mambo haya.\n\n00:10.140 --> 00:12.790\nHii ndiyo tunaita AI yenye uwajibikaji.\n\n00:12.790 --> 00:17.830\nNi kuhusu kuhakikisha watu wanakuwa\nwabunifu wenye uwajibikaji na watumiaji\n\n00:17.830 --> 00:19.600\nmakini wa hizi zana za AI.\n\n00:20.350 --> 00:24.990\nNa moja ya mambo muhimu sana nataka\nukumbuke ni kwamba kila mmoja wetu ana\n\n00:24.990 --> 00:29.260\njukumu katika kuamua jinsi zana za AI\nzinavyotengenezwa na kutumiwa.\n\n00:29.810 --> 00:34.660\nKumbuka, na hili halihusiani tu na AI,\nbali teknolojia kwa ujumla, kwamba\n\n00:34.660 --> 00:37.430\nteknolojia ni zao la maamuzi ya binadamu.\n"}, {"id": "lesson-4/07", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=4&lang=sw"}, {"id": "lesson-4/08", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-4-08.mp4", "vtt": "WEBVTT\n\n00:00.340 --> 00:05.010\nSawa, sasa ni wakati wa mradi kwa\nsomo la nne, somo letu la mwisho.\n\n00:05.740 --> 00:08.360\nKwa hiyo sasa nataka\nupanue mtazamo wako.\n\n00:08.830 --> 00:13.120\nSasa fikiria kuhusu sifa ulizotumia\nkutofautisha kati ya makundi mbalimbali\n\n00:13.120 --> 00:17.120\nkwenye somo la tatu, na uone jinsi\nunavyoweza kuongeza utofauti zaidi,\n\n00:17.120 --> 00:21.350\nkuchunguza sifa nyingine, au hata kupata\nmaoni kutoka kwa watu wengine ili\n\n00:21.350 --> 00:22.740\nkupunguza upendeleo huo.\n\n00:23.430 --> 00:27.760\nKumbuka, hakuna kigawanyaji kilicho\nkamili, na hiyo ni sehemu tu ya jinsi AI\n\n00:27.760 --> 00:28.740\ninavyofanya kazi.\n\n00:29.190 --> 00:32.870\nEleza upendeleo wake na eleza\njinsi unavyoweza kuupunguza.\n\n00:34.060 --> 00:36.480\nHivyo basi, hili ndilo somo la mwisho.\n\n00:36.480 --> 00:36.990\nHongera.\n\n00:37.460 --> 00:42.070\nKwa hiyo utaendelea kufanya kazi kwenye\nswali la somo la nne, na kama utamaliza\n\n00:42.070 --> 00:46.740\nmapema, na mwalimu wako akiruhusu,\nunaweza kuendelea kuboresha kigawanyaji chako.\n\n00:46.740 --> 00:51.000\nSawa, basi hili ndilo swali letu la\nmwisho, kujenga AI yenye uwajibikaji.\n\n00:51.810 --> 00:56.290\nUnaweza kufanya nini kuongeza utofauti\nkwenye sifa zako ili kupunguza upendeleo?\n\n00:57.030 --> 00:58.990\nNa hiki ndicho mwanafunzi alijibu.\n\n00:58.990 --> 01:00.900\n\"Nitapiga picha za matunda kutoka\n\n01:00.900 --> 01:02.630\nsehemu tofauti tofauti, ili AI\n\n01:02.630 --> 01:04.720\nisichambue tu kutoka sehemu moja, na\n\n01:04.720 --> 01:06.860\npia nitaomba marafiki zangu waangalie\n\n01:06.860 --> 01:09.050\nkama inafanya kazi vizuri kwao pia. Na\n\n01:09.050 --> 01:10.960\nkama nitatumia uso wa mtu au kitu\n\n01:10.960 --> 01:13.100\nchochote cha faragha, nitaomba ruhusa\n\n01:13.100 --> 01:13.560\nkwanza.\"\n\n01:14.060 --> 01:17.820\nKwa hiyo kumbuka tena kuhusu taarifa\nbinafsi, kama utatumia kitu chochote\n\n01:17.820 --> 01:20.690\nchenye taarifa za mtu binafsi, hakikisha\numeomba ruhusa.\n"}, {"id": "lesson-4/09", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=4&lang=sw"}]}, {"id": "resources", "kicker": "Kwa walimu na wanafunzi", "title": "Rasilimali", "items": [{"id": "resources/1", "title": "Mwongozo wa Mwalimu", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1OYVEWdK0yx6qKDPqnhWfBNE2K_vvOf_h7QNV-_NeDLQ/preview", "size": 83062}, {"id": "resources/2", "title": "Karatasi ya Kazi", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1H48KtxIKzO2c3iwfhedNHdlj3XBfwvAeA_ftyQYOcr0/preview", "size": 50112}, {"id": "resources/3", "title": "Karatasi ya Kazi (Mfano)", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/document/d/1pYrwidAVmyf41gMm9vwslK57wATqaYdPnZO493Uf1WA/preview", "size": 54023}, {"id": "resources/4", "title": "Slaidi", "type": "pdf", "kind": "PDF", "src": "https://docs.google.com/presentation/d/14PybhAz564OIopPkKB1VEBgMDbz90l8q4L2LnMdUylk/preview", "size": 7429977}]}]};

      var title = step.querySelector('.it-title');
      var sr = title.querySelector('.sr-only');
      if (value && !sr) title.insertAdjacentHTML('beforeend', '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>');
      if (!value && sr) sr.remove();
    }
  }
  function countDone(list) {
    return list.reduce(function (n, it) { return n + (done[it.id] ? 1 : 0); }, 0);
  }

  // ---------- Routing ----------
  var current = null; // current item, or null on the home screen
  var expanded = {};

  function routeId() {
    var h = location.hash || '';
    if (h.charAt(0) === '#') h = h.slice(1);
    if (h.charAt(0) === '/') h = h.slice(1);
    return decodeURIComponent(h);
  }
  function go(item) {
    location.hash = item ? '#/' + item.id : '#/';
  }
  function onRoute() {
    var id = routeId();
    current = byId[id] || null;
    if (id && !current) { history.replaceState(null, '', '#/'); }
    if (current) {
      expanded[current.section.id] = true;
      state.last = current.id;
      save();
    }
    closeMenu();
    renderView();
    renderSidebar();
    renderPager();
    scrollCurrentIntoView();
  }

  // ---------- Sidebar ----------
  function renderSidebar() {
    var total = items.length, n = countDone(items);
    var html = '';
    html += '<a class="side-link' + (current ? '' : ' current') + '" href="#/">' + icon('home') + esc(t('courseHome')) + '</a>';
    html += '<div class="side-progress">' + esc(t('yourProgress', { done: n, total: total })) +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + n + '"><span style="width:' + (100 * n / total) + '%"></span></div></div>';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), open = !!expanded[section.id];
      html += '<div class="group">' +
        '<button class="group-head" type="button" data-section="' + esc(section.id) + '" aria-expanded="' + open + '">' +
        '<span class="group-titles"><span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span></span>' +
        '<span class="g-count' + (sd === section.items.length ? ' all' : '') + '">' + sd + '/' + section.items.length + '</span>' +
        '<span class="flip">' + icon('chev', 'chev') + '</span></button><ol class="group-items">';
      section.items.forEach(function (item) {
        var cls = 'it' + (done[item.id] ? ' done' : '') + (current === item ? ' current' : '');
        html += '<li><a class="' + cls + '" href="#/' + esc(item.id) + '"' + (current === item ? ' aria-current="page"' : '') + '>' +
          '<span class="status">' + icon('check') + '</span>' +
          '<span class="it-title">' + esc(item.title) + (done[item.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
          '<span class="it-kind" title="' + esc(kindText(item.kind)) + '">' + icon(item.kind) + '</span></a></li>';
      });
      html += '</ol></div>';
    });
    html += appSettingsLink('side-link app-settings');
    html += '<div class="side-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</div>';
    sideContent.innerHTML = html;
  }
  sideContent.addEventListener('click', function (e) {
    var head = e.target.closest('.group-head');
    if (!head) return;
    var id = head.getAttribute('data-section');
    expanded[id] = !expanded[id];
    head.setAttribute('aria-expanded', String(expanded[id]));
  });
  function scrollCurrentIntoView() {
    var el = sideContent.querySelector('.it.current');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  // ---------- Mobile drawer ----------
  function openMenu() {
    sidebar.classList.add('open'); scrim.classList.add('open'); menuBtn.setAttribute('aria-expanded', 'true');
    scrollCurrentIntoView();
  }
  function closeMenu() {
    sidebar.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', openMenu);
  document.getElementById('closeMenu').addEventListener('click', closeMenu);
  scrim.addEventListener('click', closeMenu);

  // ---------- Views ----------
  function firstOpenItem(list) {
    for (var i = 0; i < list.length; i++) if (!done[list[i].id]) return list[i];
    return list[0];
  }

  function renderHome() {
    var total = items.length, n = countDone(items);
    var resume = byId[state.last] || null;
    var primary = n === total ? null : (resume && !done[resume.id] ? resume : firstOpenItem(items));
    var html = '<div class="home"><section class="hero">' +
      '<span class="kicker">' + esc(t('brand')) + '</span>' +
      '<h1 tabindex="-1">' + esc(COURSE.courseName) + '</h1>' +
      '<p>' + esc(n === total ? t('heroFinished') : t('heroText')) + '</p>' +
      '<div class="hero-progress">' + esc(t('activitiesDone', { done: n, total: total })) +
      '<div class="bar"><span style="width:' + (100 * n / total) + '%"></span></div></div>' +
      '<div class="hero-actions">' +
      (primary
        ? '<a class="btn" href="#/' + esc(primary.id) + '">' + icon('play') + '<span>' +
          esc(n === 0 ? t('startCourse') : t('continue', { title: primary.title })) + '</span></a>'
        : '') +
      '<button class="btn secondary" type="button" data-open-np><span class="np-icon" aria-hidden="true"></span>' + esc(t('openNeuroPocket')) + '</button>' +
      '</div></section>' +
      '<h2 class="section-title">' + esc(t('lessons')) + '</h2><div class="cards">';
    SECTIONS.forEach(function (section) {
      var sd = countDone(section.items), len = section.items.length;
      var tag = sd === len ? '<span class="tag done">' + esc(t('tagDone')) + '</span>'
        : sd ? '<span class="tag progress">' + esc(t('tagInProgress')) + '</span>'
        : '<span class="tag">' + esc(t('activities', { total: len })) + '</span>';
      html += '<a class="card" href="#/' + esc(firstOpenItem(section.items).id) + '">' + tag +
        '<span class="g-kicker">' + esc(section.kicker) + '</span><span class="g-title">' + esc(section.title) + '</span>' +
        '<span class="card-meta">' + esc(t('sectionDone', { done: sd, total: len })) +
        '<span class="bar"><span style="width:' + (100 * sd / len) + '%"></span></span></span></a>';
    });
    html += '</div><p class="home-version">' + esc(COURSE.courseName) + ' · ' + esc(t('version', { version: COURSE.version })) + '</p>' +
      appSettingsLink('chip-btn home-settings') + '</div>';
    return html;
  }

  var pdfInline = navigator.pdfViewerEnabled === true ||
    (navigator.pdfViewerEnabled === undefined && !/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent));

  function renderItem(item) {
    var section = item.section;
    var actions = '';
    var stage = '';
    var extra = '';
    if (item.type === 'video') {
      stage = '<div class="stage stage-video"><video id="video" controls playsinline preload="metadata" src="' + esc(item.src) + '"></video></div>';
    } else if (item.type === 'html') {
      stage = '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>';
    } else if (item.type === 'pdf') {
      actions += '<a class="chip-btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a>';
      stage = pdfInline
        ? '<div class="stage stage-frame"><iframe src="' + esc(item.src) + '" title="' + esc(item.title) + '"></iframe></div>'
        : '<div class="stage stage-card"><div>' + icon('PDF', 'big-icon') + '<h2>' + esc(item.title) + '</h2>' +
          '<p>' + esc(t('pdfDocument')) + ' · ' + fmtSize(item.size) + '</p>' +
          '<a class="btn" href="' + esc(item.src) + '" target="_blank" rel="noopener">' + icon('external') + esc(t('openPdf')) + '</a></div></div>';
    } else if (item.type === 'app') {
      actions += '<button class="chip-btn" type="button" data-open-np>' + icon('full') + esc(t('fullScreen')) + '</button>';
      stage = '<div class="stage stage-app" id="npSlot">' + esc(t('loadingNeuroPocket')) + '</div>';
    }
    if (item.action === 'challenge') {
      extra = '<div class="callout"><p>' + esc(t('challengePrompt')) + '</p>' +
        '<button class="btn" type="button" data-challenge>' + icon('play') + esc(t('tryChallenge')) + '</button></div>';
    }
    return '<div class="item"><div class="item-head"><div class="item-titles">' +
      '<div class="crumb">' + icon(item.kind) + esc(section.kicker || section.title) + ' · ' + esc(kindText(item.kind)) + '</div>' +
      '<h1 tabindex="-1">' + esc(item.title) + '</h1></div>' +
      '<div class="head-actions">' + actions +
      '<button class="chip-btn done-btn" id="doneBtn" type="button" aria-pressed="false"></button></div></div>' +
      stage + extra + renderSteps(item) + '</div>';
  }

  // The steps of the current lesson, under the content. On phones and tablets the sidebar
  // is behind the menu button, so this keeps the lesson in view; on computers it's hidden.
  function renderSteps(item) {
    var section = item.section;
    var html = '<nav class="steps" aria-label="' + esc(section.title) + '"><div class="steps-head">' +
      (section.kicker ? '<span class="g-kicker">' + esc(section.kicker) + '</span>' : '') +
      '<span class="g-title">' + esc(section.title) + '</span></div><ol class="group-items">';
    section.items.forEach(function (it) {
      var cls = 'it' + (done[it.id] ? ' done' : '') + (it === item ? ' current' : '');
      html += '<li><a class="' + cls + '" href="#/' + esc(it.id) + '"' + (it === item ? ' aria-current="step"' : '') + '>' +
        '<span class="status">' + icon('check') + '</span>' +
        '<span class="it-title">' + esc(it.title) + (done[it.id] ? '<span class="sr-only"> ' + esc(t('doneForScreenReaders')) + '</span>' : '') + '</span>' +
        '<span class="it-kind" title="' + esc(kindText(it.kind)) + '">' + icon(it.kind) + '</span></a></li>';
    });
    return html + '</ol></nav>';
  }

  function renderView() {
    view.innerHTML = current ? renderItem(current) : renderHome();
    view.scrollTop = 0;
    document.title = current ? current.title + ' · ' + COURSE.courseName : COURSE.courseName;
    var h1 = view.querySelector('h1');
    if (h1 && document.activeElement !== document.body) {
      try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); }
    }
    updateDoneBtn();
    wireVideo();
    syncNp();
  }

  function updateDoneBtn() {
    var btn = document.getElementById('doneBtn');
    if (!btn || !current) return;
    var d = !!done[current.id];
    btn.setAttribute('aria-pressed', String(d));
    btn.innerHTML = icon('check') + esc(d ? t('done') : t('markDone'));
  }

  // Captions come inside the course data and are served from Blob URLs, since a page
  // opened from disk can't load a separate .vtt file. They start on; turning them off
  // in the player is remembered on this device.
  var CAPTIONS_KEY = 'aile_captions_off';
  var captionsOff = false;
  try { captionsOff = localStorage.getItem(CAPTIONS_KEY) === '1'; } catch (e) { /* ignore */ }

  function addCaptions(video, item) {
    if (!item.vtt) return;
    if (!item.vttUrl) item.vttUrl = URL.createObjectURL(new Blob([item.vtt], { type: 'text/vtt' }));
    var track = document.createElement('track');
    track.kind = 'subtitles';
    track.srclang = COURSE.lang;
    track.label = COURSE.captionLabel;
    track.src = item.vttUrl;
    if (!captionsOff) track.default = true;
    video.appendChild(track);
    video.textTracks.addEventListener('change', function () {
      var on = Array.prototype.some.call(video.textTracks, function (tr) { return tr.mode === 'showing'; });
      captionsOff = !on;
      try { localStorage.setItem(CAPTIONS_KEY, on ? '0' : '1'); } catch (e) { /* ignore */ }
    });
  }

  // A video counts as finished once it's (nearly) watched to the end.
  function wireVideo() {
    var video = document.getElementById('video');
    if (!video) return;
    var item = current;
    addCaptions(video, item);
    function check() {
      if (video.duration && video.currentTime / video.duration >= 0.9) setDone(item.id, true);
    }
    video.addEventListener('timeupdate', check);
    video.addEventListener('ended', function () { setDone(item.id, true); });
  }

  view.addEventListener('click', function (e) {
    if (e.target.closest('#doneBtn') && current) setDone(current.id, !done[current.id]);
    else if (e.target.closest('[data-open-np]')) openNp();
    else if (e.target.closest('[data-challenge]')) openNp('#/challenge');
  });

  // ---------- Pager ----------
  function renderPager() {
    pager.hidden = !current;
    if (!current) return;
    var prev = items[current.index - 1], next = items[current.index + 1];
    prevBtn.disabled = !prev;
    document.getElementById('prevSub').textContent = prev ? prev.title : '';
    document.getElementById('nextLabel').textContent = next ? t('next') : t('finish');
    document.getElementById('nextSub').textContent = next ? next.title : t('backToHome');
    document.getElementById('pgPos').innerHTML = '<span class="pg-pos-wide">' + esc(current.section.kicker || current.section.title) + ' · </span>' +
      esc(t('position', { n: current.indexInSection + 1, total: current.section.items.length }));
  }
  function goPrev() {
    if (current && items[current.index - 1]) go(items[current.index - 1]);
  }
  function goNext() {
    if (!current) { go(firstOpenItem(items)); return; }
    // Moving on counts as finishing anything that isn't a video.
    if (current.type !== 'video') setDone(current.id, true);
    go(items[current.index + 1] || null);
  }
  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (np.classList.contains('overlay')) closeNp(); else closeMenu();
      return;
    }
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (np.classList.contains('overlay')) return;
    var target = e.target;
    if (target && (/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(target.tagName) || target.isContentEditable)) return;
    // The arrow pointing the way the page reads goes forward.
    var forward = RTL ? 'ArrowLeft' : 'ArrowRight';
    var back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === back) goPrev();
    else if (e.key === forward && current) goNext();
  });

  // ---------- NeuroPocket ----------
  // One iframe for the whole visit: it's created on first use and only ever shown or
  // hidden (never moved in the DOM, which would reload it), so the app and its AI
  // model load once and work in progress survives moving around the course.
  var npFrame = null;
  var npMode = 'hidden'; // 'hidden' | 'inline' | 'overlay'

  function ensureNp(hash) {
    var src = COURSE.neuropocket + (hash || '');
    if (!npFrame) {
      npFrame = document.createElement('iframe');
      npFrame.className = 'np-frame';
      npFrame.title = 'NeuroPocket';
      npFrame.setAttribute('allow', 'camera *; fullscreen *');
      npFrame.setAttribute('allowfullscreen', '');
      npFrame.src = src;
      np.appendChild(npFrame);
    } else if (hash) {
      npFrame.src = src;
    }
  }
  function setNpMode(mode) {
    npMode = mode;
    np.classList.toggle('inline', mode === 'inline');
    np.classList.toggle('overlay', mode === 'overlay');
    document.getElementById('npBtn').setAttribute('aria-pressed', String(mode === 'overlay'));
    if (mode !== 'inline') np.style.top = np.style.left = np.style.width = np.style.height = '';
    placeNp();
  }
  function placeNp() {
    if (npMode !== 'inline') return;
    var slot = document.getElementById('npSlot');
    if (!slot) return;
    var r = slot.getBoundingClientRect();
    np.style.top = r.top + 'px';
    np.style.left = r.left + 'px';
    np.style.width = r.width + 'px';
    np.style.height = r.height + 'px';
  }
  // Inline when the current item is the app step, otherwise hidden (unless the overlay is open).
  function syncNp() {
    if (npMode === 'overlay') return;
    if (current && current.type === 'app') {
      ensureNp();
      setNpMode('inline');
      setTimeout(placeNp, 0);
    } else {
      setNpMode('hidden');
    }
  }
  function openNp(hash) {
    ensureNp(hash);
    setNpMode('overlay');
    closeMenu();
    document.getElementById('npClose').focus();
  }
  function closeNp() {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    npMode = 'hidden';
    syncNp();
    document.getElementById('npBtn').focus();
  }
  document.getElementById('npBtn').addEventListener('click', function () {
    if (npMode === 'overlay') closeNp(); else openNp();
  });
  document.getElementById('npClose').addEventListener('click', closeNp);
  var npFull = document.getElementById('npFull');
  var canFullscreen = !!(np.requestFullscreen || np.webkitRequestFullscreen) && document.fullscreenEnabled !== false;
  if (!canFullscreen) npFull.hidden = true;
  npFull.addEventListener('click', function () {
    var req = np.requestFullscreen || np.webkitRequestFullscreen;
    if (req) req.call(np);
  });

  // ---------- Layout ----------
  function setAppHeight() {
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
    placeNp();
  }
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 200); });
  view.addEventListener('scroll', placeNp, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(placeNp).observe(view);
  setAppHeight();

  // ---------- Start ----------
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
