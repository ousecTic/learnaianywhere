  /* Brand tokens from learnaianywhere.org. Light only, like the site. */
  :root {
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f3f4f6;
    --text: #000000;
    --muted: #71717a;
    --line: #e5e7eb;
    --brand: #258ec2;
    --brand-dark: #1c6e99;
    --brand-ink: #ffffff;
    --brand-soft: #eff6ff;
    --done: #10b981;
    --done-ink: #047857;
    --done-soft: #ecfdf5;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .05);
    --header-h: 60px;
    --pager-h: 64px;
    --side-w: 304px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  /* Arrows point the way the page reads. */
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* ---------- App shell ---------- */
  .app { display: flex; flex-direction: column; height: 100vh; height: var(--app-h, 100vh); }
  .topbar {
    flex: none; height: var(--header-h); display: flex; align-items: center; gap: 8px;
    padding-block: 0; padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
  }
  .brand { display: flex; align-items: center; text-decoration: none; min-width: 0; height: 100%; }
  .brand-logo { display: block; height: 30px; width: auto; max-width: 100%; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .np-btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-block: 0; padding-inline: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; flex: none;
  }
  .np-btn:hover { border-color: var(--brand); color: var(--brand); }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--side-w); flex: none; overflow-y: auto; background: var(--surface); border-inline-end: 1px solid var(--line);
    padding: 12px 10px 24px;
  }
  .side-head { display: none; }
  .side-link {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-weight: 600; min-height: 44px;
  }
  .side-link:hover { background: var(--surface-2); }
  .side-link.current { background: var(--brand-soft); color: var(--brand); }
  .side-progress { padding: 8px 12px 14px; font-size: 14px; color: var(--muted); }
  .side-version { padding: 14px 12px 0; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .app-settings { width: 100%; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; cursor: pointer; font-weight: 500; text-align: start; }
  .home-settings { margin: 12px 4px 0; }
  .bar { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--done); transition: width .3s ease; }
  .group { border-top: 1px solid var(--line); padding: 6px 0; }
  .group-head {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 52px; border: 0; background: transparent;
    border-radius: 10px; text-align: start; cursor: pointer;
  }
  .group-head:hover { background: var(--surface-2); }
  .group-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .g-kicker { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .g-title { font-weight: 650; }
  .g-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .g-count.all { color: var(--done-ink); font-weight: 700; }
  .chev { transition: transform .2s ease; color: var(--muted); }
  .group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .group-items { list-style: none; margin: 2px 0 4px; padding: 0; }
  .group-head[aria-expanded="false"] + .group-items { display: none; }
  .it {
    display: flex; align-items: center; gap: 10px; padding-block: 8px; padding-inline: 14px 12px; min-height: 44px; border-radius: 10px;
    text-decoration: none; font-size: 15px; line-height: 1.3;
  }
  .it:hover { background: var(--surface-2); }
  .it.current { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .status {
    width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent;
  }
  .status svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .it.current .status { border-color: var(--brand); }
  .it.done .status { background: var(--done); border-color: var(--done); color: #fff; }
  .it-title { flex: 1; min-width: 0; }
  .it-kind { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex: none; }
  .it-kind svg.i { width: 16px; height: 16px; }
  .it.current .it-kind { color: inherit; }

  /* ---------- Pager ---------- */
  .pager {
    flex: none; min-height: var(--pager-h); display: flex; align-items: center; gap: 12px;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom));
    padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
    background: var(--surface); border-top: 1px solid var(--line);
    position: relative; z-index: 25; /* above NeuroPocket, which follows its slot as the view scrolls */
  }
  .pager[hidden] { display: none; }
  .pg-btn {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; max-width: 42%; text-align: start;
  }
  .pg-btn:hover:not(:disabled) { border-color: var(--brand); }
  .pg-btn:disabled { opacity: .4; cursor: default; }
  .pg-btn.next { margin-inline-start: auto; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); text-align: end; }
  .pg-btn.next:hover:not(:disabled) { background: var(--brand-dark); border-color: var(--brand-dark); }
  .pg-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .pg-label { font-weight: 600; }
  .pg-sub { font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pg-pos { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Item view ---------- */
  .item {
    display: flex; flex-direction: column; gap: 14px; height: 100%; max-width: 1180px; margin: 0 auto;
    padding-block: 18px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right));
  }
  .item-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; flex: none; }
  .item-titles { flex: 1; min-width: 200px; }
  .crumb { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
  .crumb svg.i { width: 16px; height: 16px; }
  .item h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 2px 0 0; outline: none; }
  .head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-btn {
    display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--brand); color: var(--brand); }
  .chip-btn svg.i { width: 16px; height: 16px; }
  .done-btn[aria-pressed="true"] { background: var(--done-soft); border-color: var(--done); color: var(--done-ink); }

  .stage { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; position: relative; }
  .stage-video { background: #000; display: flex; align-items: center; justify-content: center; }
  .stage-video video { width: 100%; height: 100%; display: block; background: #000; }
  .stage-frame { background: #fff; border: 1px solid var(--line); }
  .stage-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .stage-app { background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
  .stage-card { background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; padding: 24px; text-align: center; }
  .stage-card .big-icon { width: 56px; height: 56px; color: var(--brand); margin: 0 auto 8px; }
  .stage-card p { color: var(--muted); margin: 4px 0 18px; }

  .callout {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px;
    background: var(--brand-soft); border: 1px solid var(--line);
  }
  .callout p { margin: 0; flex: 1; min-width: 200px; font-weight: 600; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: var(--radius);
    border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.secondary { background: var(--surface); color: var(--text); border-color: var(--line); }
  .btn.secondary:hover { border-color: var(--brand); color: var(--brand); background: var(--surface); }

  /* ---------- Home ---------- */
  .home { max-width: 1100px; margin: 0 auto; padding-block: 28px 40px; padding-inline: max(20px, env(safe-area-inset-left)) max(20px, env(safe-area-inset-right)); }
  .hero {
    background: linear-gradient(var(--brand-soft), var(--surface)); border: 1px solid var(--line); border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .hero .kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
  .hero h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 700; line-height: 1.15; letter-spacing: -.01em; outline: none; }
  .hero p { margin: 0; color: var(--muted); font-size: 1.125rem; max-width: 60ch; }
  .hero-progress { max-width: 420px; font-size: 14px; color: var(--muted); }
  .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-actions .btn { max-width: 100%; }
  .hero-actions .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 1.5rem; font-weight: 600; margin: 32px 4px 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; gap: 6px; text-align: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; text-decoration: none; box-shadow: var(--shadow); min-height: 150px;
  }
  .card:hover { border-color: var(--brand); }
  .card .g-title { font-size: 1.1rem; }
  .card-meta { display: block; font-size: 14px; color: var(--muted); margin-top: auto; }
  .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .tag.done { background: var(--done-soft); color: var(--done-ink); }
  .tag.progress { background: var(--brand-soft); color: var(--brand); }
  .home-version { margin: 28px 4px 0; font-size: 13px; color: var(--muted); }

  /* Letter spacing and capitals are for Latin script; they break Arabic joining. */
  :lang(ar) .g-kicker, :lang(ar) .crumb, :lang(ar) .hero .kicker,
  :lang(ur) .g-kicker, :lang(ur) .crumb, :lang(ur) .hero .kicker,
  :lang(hi) .g-kicker, :lang(hi) .crumb, :lang(hi) .hero .kicker { letter-spacing: 0; text-transform: none; }
  :lang(ur) body { line-height: 1.8; }

  /* ---------- NeuroPocket host ---------- */
  .np { position: fixed; display: none; flex-direction: column; background: var(--surface); z-index: 20; }
  .np.inline { display: flex; border-radius: 14px; overflow: hidden; }
  .np.overlay { display: flex; inset: 0; top: 0; left: 0; width: 100% !important; height: 100% !important; z-index: 60; }
  .np-bar {
    display: none; flex: none; align-items: center; gap: 8px; height: var(--header-h);
    padding-block: 0; padding-inline: max(8px, env(safe-area-inset-left)) max(8px, env(safe-area-inset-right));
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .np.overlay .np-bar { display: flex; }
  .np-bar strong { font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; justify-content: center; min-width: 0; }
  .np-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; background: #fff; }
  .np:fullscreen .np-bar { display: none; }

  .scrim { display: none; }
  .steps { display: none; }

  /* ---------- Mobile ---------- */
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 340px); z-index: 50; transform: translateX(-102%);
      transition: transform .25s ease; box-shadow: var(--shadow); padding-top: 0; padding-inline-start: max(10px, env(safe-area-inset-left));
    }
    [dir="rtl"] .sidebar { transform: translateX(102%); }
    .sidebar.open, [dir="rtl"] .sidebar.open { transform: none; }
    .side-head {
      display: flex; align-items: center; gap: 10px; height: var(--header-h); position: sticky; top: 0; background: var(--surface);
      z-index: 1; margin: 0 -10px 4px; padding-block: 0; padding-inline: 14px 6px; border-bottom: 1px solid var(--line);
    }
    .side-head .brand-logo { height: 26px; }
    .side-head .spacer { flex: 1; }
    .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 45; }
    .scrim.open { display: block; }
    .item { padding-top: 14px; padding-bottom: 14px; gap: 12px; }
    .item h1 { font-size: 1.25rem; }
    .stage-video { flex: none; }
    .stage-video video { height: auto; max-height: 70vh; }
    /* A set height, since the item grows with its content: the space between the bars, less the title. */
    .stage-frame, .stage-app, .stage-card {
      flex: none; height: max(60vh, calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 120px));
    }
    .pg-sub, .pg-pos-wide { display: none; }
    .pg-btn { max-width: none; }
    .hero { padding: 22px; }
    /* The lesson's steps follow the content, so the item grows and the view scrolls. */
    .item { height: auto; min-height: 100%; }
    .steps {
      display: block; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 6px;
    }
    .steps-head { display: flex; flex-direction: column; padding: 10px 12px 6px; line-height: 1.25; }
  }
  @media (max-width: 599px) {
    .cards { gap: 10px; }
    .card { min-height: 0; padding: 14px 16px; }
  }
  /* A phone held sideways: slimmer bars and a video that fits above the pager with its controls in view. */
  @media (orientation: landscape) and (max-height: 500px) {
    :root { --header-h: 48px; --pager-h: 52px; }
    .pager { padding-block: 4px calc(4px + env(safe-area-inset-bottom)); }
    .pg-btn { min-height: 40px; }
    .item { padding-block: 8px; gap: 8px; }
    .item-head { align-items: center; }
    .crumb { display: none; }
    .item h1 { font-size: 1.05rem; }
    .chip-btn { min-height: 36px; }
    .stage-video video { max-height: calc(var(--app-h, 100vh) - var(--header-h) - var(--pager-h) - 72px); }
  }
  @media (min-width: 900px) {
    #menuBtn { display: none; }
  }
  @media (max-width: 420px) {
    .np-btn .np-label { display: none; }
    .np-btn { padding: 0 7px; }
    .topbar .brand-logo { height: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

 "kindApp": "Programu"}, "sections": [{"id": "intro", "kicker": "Anza hapa", "title": "Utangulizi", "items": [{"id": "intro/01", "title": "Karibu kwenye Kozi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-intro-01.mp4", "vtt": "WEBVTT\n\n00:00.100 --> 00:04.650\nHabari, na karibu kwenye kozi hii ya\noffline-first, Utangulizi wa Akili\n\n00:04.650 --> 00:06.860\nBandia kutoka LearnAIAnywhere.org.\n\n00:06.860 --> 00:11.930\nSisi ni jumuiya ya walimu na wanafunzi\nkutoka kote duniani, na tunafurahia sana\n\n00:11.930 --> 00:16.740\nkukuona hapa tunapojitahidi kufanya\nelimu ya AI ipatikane kwa kila mtu kila\n\n00:16.740 --> 00:17.190\nmahali.\n\n00:17.190 --> 00:22.590\nSasa, hadithi tunayoskia kuhusu AI ni\nkwamba ni binadamu dhidi ya mashine hizi za AI.\n\n00:23.620 --> 00:27.720\nLakini ukweli ni kwamba,\nAI ni zao la maamuzi ya binadamu tu.\n\n00:28.110 --> 00:32.620\nNa tofauti na mashine, sisi binadamu\ntunachagua kile tunachojali, kama vile\n\n00:32.620 --> 00:34.270\nmaadili yetu na jamii zetu.\n\n00:34.270 --> 00:39.020\nLengo la kozi yetu ni kuwapa wanafunzi\nwetu maarifa na busara ili wawe wabunifu\n\n00:39.020 --> 00:42.430\nwenye uwajibikaji na watumiaji makini wa\nzana hizi za AI.\n\n00:43.140 --> 00:47.120\nUtakua ukijifunza hasa nini maana ya\nakili bandia, sehemu kuu za ujifunzaji\n\n00:47.120 --> 00:51.360\nwa mashine, jinsi ujifunzaji wa mashine\nunavyofanya kazi, na mawazo yanayoongoza\n\n00:51.360 --> 00:52.490\nAI yenye uwajibikaji.\n\n00:53.020 --> 00:57.000\nUtaweza kujifunza haya yote kwa kubuni\nAI classifier yako mwenyewe kwa kutumia\n\n00:57.000 --> 01:00.770\nNeuroPocket, ambayo itakupa msingi\nimara wa kuelewa jinsi zana nyingi za\n\n01:00.770 --> 01:02.370\nkisasa za AI zinavyofanya kazi.\n\n01:03.020 --> 01:06.740\nTutakuongoza hatua kwa hatua kupitia\nmasomo yetu manne tukitumia karatasi\n\n01:06.740 --> 01:08.290\nyetu ya shughuli za kubuni AI.\n\n01:08.430 --> 01:13.130\nNa mwisho wa yote, utabuni AI classifier\nyako mwenyewe na kupata uelewa wa kina\n\n01:13.130 --> 01:17.480\nkuhusu jinsi zana za AI zinavyofanya\nkazi, ukiwa tayari kuwasilisha mradi\n\n01:17.480 --> 01:18.560\nwako na hoja zako.\n\n01:18.860 --> 01:22.660\nTunafurahi sana kukuwa hapa nasi na\nkuchangia jinsi AI inavyobuniwa na\n\n01:22.660 --> 01:24.630\nkutumiwa duniani kote, popote ulipo.\n\n01:24.630 --> 01:25.680\nTutaonana darasani.\n"}, {"id": "intro/02", "title": "Sharti", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-intro-02.mp4", "vtt": "WEBVTT\n\n00:00.540 --> 00:02.350\nSawa, karibuni darasani.\n\n00:02.750 --> 00:05.650\nKwa hiyo, kutakuwa na vitu\nviwili ambavyo utahitaji.\n\n00:05.650 --> 00:09.860\nKitu cha kwanza ni kwamba utahitaji\nkifaa chenye kamera ya mbele ( webcam).\n\n00:10.720 --> 00:15.410\nNa kifaa hiki kinaweza kuwa\nlaptop, tablet, au simu.\n\n00:15.980 --> 00:20.120\nJambo muhimu ni kwamba iwe na kamera ya\nmbele kwa sababu tutaenda kuitumia\n\n00:20.120 --> 00:20.860\nkupiga picha.\n\n00:21.610 --> 00:26.850\nNa hivyo, programu tutakayotumia inaitwa\nNeuroPocket, na hii ndiyo tutatumia\n\n00:26.850 --> 00:29.510\nkubuni kifaa chetu cha kutambua picha.\n\n00:30.100 --> 00:34.590\nKwa hiyo unaweza kuipata mtandaoni\nkirahisi, au kama unataka kuitumia bila\n\n00:34.590 --> 00:38.880\nmtandao, kuna programu zinazopatikana\nkwa vifaa vya Windows na Android.\n\n00:39.450 --> 00:43.490\nKwa hiyo kama unatumia iPhone,\nutalazimika kuipata kupitia tovuti yao\n\n00:43.490 --> 00:44.200\nbadala yake.\n\n00:45.260 --> 00:48.770\nJambo lingine ni kwamba tunayo\nkaratasi ya mradi ya hiari.\n\n00:48.900 --> 00:53.620\nNa hivyo, hii karatasi ya mradi\nitatuongoza kubuni kifaa chetu cha\n\n00:53.620 --> 00:56.900\nkutambua kwa kutumia AI tunapopitia kila\nsomo.\n\n00:57.730 --> 01:02.540\nNa bila shaka, kama hutaki kuichapisha,\nunaweza kutumia karatasi ya kawaida tu,\n\n01:02.540 --> 01:05.930\nna itafanya kazi sawa kwa sababu maswali\nsi marefu sana.\n\n01:05.930 --> 01:10.300\nSawa, basi hayo ndiyo yote tunayohitaji\nkama mahitaji ya awali, kwa hiyo\n\n01:10.300 --> 01:12.460\ntutaonana kwenye sehemu inayofuata.\n"}, {"id": "intro/03", "title": "Ufunguo wa Alama", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-intro-03.mp4", "vtt": "WEBVTT\n\n00:00.440 --> 00:00.800\nSawa.\n\n00:00.800 --> 00:05.730\nKaribu kwenye utangulizi huu wa akili\nbandia kutoka LearnAIAnywhere.org.\n\n00:06.350 --> 00:10.800\nKwa hiyo kabla hatujaanza masomo yote,\nutaona alama fulani kwenye kona ya chini\n\n00:10.800 --> 00:11.250\nkushoto.\n\n00:11.970 --> 00:16.420\nUkiiona alama ya kitabu, hiyo ni ishara\ntu kwamba tutakuwa tunafundisha kitu.\n\n00:16.530 --> 00:20.430\nUkiiona mtu anakimbia, inamaanisha\ntutafanya kitu cha kuhusisha, kama\n\n00:20.430 --> 00:22.080\nmchezo au mazoezi ya vitendo.\n\n00:22.240 --> 00:27.020\nNa ukiiona alama ya wingu, inamaanisha\ntutapata nafasi ya kutafakari kuhusu\n\n00:27.020 --> 00:27.990\ntulichojifunza.\n\n00:27.990 --> 00:30.570\nSawa, tutaonana kwenye\nsehemu inayofuata.\n"}]}, {"id": "lesson-1", "kicker": "Somo la 1", "title": "AI ni Nini", "items": [{"id": "lesson-1/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-1-01.mp4", "vtt": "WEBVTT\n\n00:00.680 --> 00:04.710\nSawa, karibu kwenye somo la kwanza\nkuhusu hasa akili bandia ni nini.\n\n00:05.330 --> 00:10.170\nKwa hivyo, lengo la somo la kwanza ni\nkwamba utaelezea sifa kuu zinazofanya\n\n00:10.170 --> 00:14.940\nkitu kiwe na akili bandia, halafu\nutatambua mifano ya AI na isiyo ya AI na\n\n00:14.940 --> 00:16.120\nkuelezea kwa nini.\n"}, {"id": "lesson-1/02", "title": "AI ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-1-02.mp4", "vtt": "WEBVTT\n\n00:01.260 --> 00:05.720\nKwa hiyo kabla hata hatujaanza, fikiria\nkuhusu swali hili: Unadhani nini\n\n00:05.720 --> 00:07.980\nkinachofanya binadamu wawe na akili?\n\n00:07.980 --> 00:11.930\nSasa simamisha video na tafakari\nkuhusu hilo kwa sekunde chache.\n\n00:14.130 --> 00:19.380\nSawa, sasa baada ya kupata muda, kwanza\nnataka kusema kwamba akili ya binadamu\n\n00:19.380 --> 00:20.260\nni tata sana.\n\n00:20.790 --> 00:23.580\nLakini tunaweza kuangalia\nsifa mbili kuu.\n\n00:23.690 --> 00:28.230\nBaadhi ya sifa kuu zinazofanya binadamu\nkuwa na akili ni uhuru na uwezo wa\n\n00:28.230 --> 00:28.670\nkuzoea.\n\n00:28.670 --> 00:33.280\nKwa hiyo ninaposema uhuru, namaanisha\nbinadamu anayechukua hatua na kufanya\n\n00:33.280 --> 00:34.340\nmaamuzi mwenyewe.\n\n00:35.030 --> 00:39.930\nNa ninaposema uwezo wa kuzoea, ni uwezo\nwa binadamu kujifunza kutokana na uzoefu\n\n00:39.930 --> 00:40.740\nna kuboresha.\n\n00:41.650 --> 00:44.870\nNa kwa hiyo kundi la watu wenye hamu ya\nkujua walijiuliza,\n\n00:44.870 --> 00:47.010\n\"Tunawezaje kujenga vipengele hivi vya\n\n00:47.010 --> 00:48.260\nakili kwenye mashine?\"\n\n00:48.870 --> 00:53.730\nNa hapo ndipo uwanja wa akili bandia\nulipoanza, uwanja wa masomo kuhusu\n\n00:53.730 --> 00:57.340\nkutengeneza teknolojia inayofanana na\ntabia za akili.\n\n00:58.470 --> 01:02.990\nNa kwa hiyo baadhi ya mambo muhimu\nyanayofanya AI ionekane ina akili pia ni\n\n01:02.990 --> 01:04.830\nuhuru wake na uwezo wa kuzoea.\n\n01:05.570 --> 01:10.690\nKwa hiyo ninaposema uhuru, namaanisha tu\nuwezo wa teknolojia kusaidia au kufanya\n\n01:10.690 --> 01:12.760\nkazi yenyewe bila kutegemea mtu.\n\n01:13.380 --> 01:18.530\nNa ninaposema uwezo wa kuzoea, ni uwezo\nwa teknolojia kuboresha kadri\n\n01:18.530 --> 01:20.430\ninavyochambua data zaidi.\n\n01:20.610 --> 01:23.840\nKwa mfano, fikiria injini ya utafutaji.\n\n01:23.840 --> 01:27.150\nKama umewahi kutumia\nGoogle, umetumia AI.\n\n01:27.150 --> 01:32.030\nIna uhuru kwa sababu inakusaidia\nkupendekeza maneno yenyewe.\n\n01:32.380 --> 01:37.600\nKama unavyoona, ninapokuwa naandika,\nunaona napata mapendekezo mbalimbali, na\n\n01:37.600 --> 01:42.540\npia inakuwa inabadilika kwa sababu\ninaweza kuboresha mapendekezo yake kwa\n\n01:42.540 --> 01:46.250\nkuchambua utafutaji wa watu wa zamani na\nmengine zaidi.\n\n01:46.250 --> 01:49.820\nSasa, mfano mzuri wa kitu\nambacho si AI ni kalkuleta.\n\n01:50.340 --> 01:55.220\nHaina uhuru kwa sababu inafanya tu kile\nunachoielekeza, kwa hiyo lazima ubofye\n\n01:55.220 --> 01:58.270\nvitufe mwenyewe kwa kila kitu unachotaka\nkufanya.\n\n01:58.970 --> 02:04.080\nNa hasa haina uwezo wa kuzoea kwa sababu\nhaiwezi kuchambua data mpya, na kila\n\n02:04.080 --> 02:06.640\nwakati inafanya kazi kwa njia ile ile.\n\n02:08.180 --> 02:10.280\nSawa, sasa ni zamu yako.\n\n02:10.280 --> 02:11.850\nTucheze AI au Sio.\n\n02:11.850 --> 02:13.950\nNitakuambia hali fulani.\n\n02:14.170 --> 02:17.400\nUtatazama kama inahusisha\nuhuru na uwezo wa kubadilika.\n\n02:17.500 --> 02:21.440\nUtaamua kama ni AI au la,\nna utashiriki sababu zako.\n"}, {"id": "lesson-1/03", "title": "AI au Siyo", "type": "html", "kind": "Quiz", "src": "/course/apps/ai-or-not/index.html?lang=sw"}, {"id": "lesson-1/04", "title": "Jinsi AI Inavyoweza Kutusaidia", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-1-04.mp4", "vtt": "WEBVTT\n\n00:00.700 --> 00:05.190\nSawa, baada ya kucheza mchezo wa\nAI au Sio, sasa nina swali kwako.\n\n00:05.840 --> 00:08.670\nJe, mifano hii ya AI\nilikuwa inawasaidiaje watu?\n\n00:08.670 --> 00:13.320\nBasi jisikie huru kusitisha video na\nkufikiria kuhusu hilo kwa sekunde chache.\n\n00:15.460 --> 00:19.760\nSawa, baadhi ya njia ambazo teknolojia\nza AI zinaweza kutusaidia ni kwamba\n\n00:19.760 --> 00:24.360\nzinaweza kuboresha ubora wa kazi yetu,\npia zinaweza kufanya sehemu ya kazi yetu\n\n00:24.360 --> 00:29.010\nili tuweze kuzingatia majukumu mengine,\nau pia zinaweza kufanya uzoefu wetu kuwa\n\n00:29.010 --> 00:29.780\nrahisi zaidi.\n\n00:29.780 --> 00:34.140\nKwa hivyo baadhi ya mifano ya watu\nwanaotumia zana za AI kuwasaidia kutatua\n\n00:34.140 --> 00:36.380\nmatatizo halisi inaweza kuwa wakulima.\n\n00:37.470 --> 00:41.720\nUnajua, wakulima wanatumia zana hizi za\nAI kama PlantVillage Nuru, ambapo\n\n00:41.720 --> 00:46.210\nwanaweza kupiga picha ya jani la mmea na\nkuona kama lina ugonjwa au halina, na\n\n00:46.210 --> 00:47.840\npia kujua jinsi ya kulitibu.\n\n00:47.840 --> 00:52.320\nBaadhi ya hawa wakulima pia wanatumia\nkitu kinachoitwa Farmer Chat, ambacho ni\n\n00:52.320 --> 00:56.510\nnjia ya wao kuzungumza na chatbot ili\nkupata ushauri kuhusu kilimo, hivyo\n\n00:56.510 --> 01:00.940\ninawasaidia kufanya maamuzi bora kuhusu\njinsi ya kutunza mazao na udongo wao.\n\n01:02.280 --> 01:06.810\nTukitazama upande wa madaktari, wengi wa\nhawa madaktari wanatumia picha za AI,\n\n01:06.810 --> 01:11.220\nkama vile X-ray, kuwasaidia kuchunguza\ndalili ndogo na ngumu za magonjwa, na\n\n01:11.220 --> 01:13.690\nhii inawasaidia kufanya maamuzi bora\nzaidi.\n\n01:14.640 --> 01:20.180\nHalafu Suki ni moja ya mambo hayo ambapo\ndaktari na mgonjwa wanaweza kuzungumza,\n\n01:20.180 --> 01:25.430\nna AI itachukua madokezo kwa ajili yao,\nna hii inamruhusu daktari kumakinika\n\n01:25.430 --> 01:26.760\nzaidi kwa wagonjwa.\n\n01:28.700 --> 01:33.140\nKwa hiyo moja ya mambo makubwa ambayo\ntutaendelea kusisitiza ni kwamba\n\n01:33.140 --> 01:38.100\nteknolojia ya AI ni chombo, na nasema\nhivyo si kama njia ya kupunguza uwezo wa\n\n01:38.100 --> 01:42.220\nAI, bali zaidi kama ukumbusho kwamba\nsisi ndio tunawajibika nayo.\n\n01:42.560 --> 01:46.670\nKwa sababu jambo ni kwamba, watu ndio\nwanaamua jinsi ya kuzitumia kwa mambo\n\n01:46.670 --> 01:47.390\nwanayoyajali.\n"}, {"id": "lesson-1/05", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=1&lang=sw"}, {"id": "lesson-1/06", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-1-06.mp4", "vtt": "WEBVTT\n\n00:00.320 --> 00:02.670\nSawa basi, sasa ni wakati wa mradi.\n\n00:03.190 --> 00:06.930\nKama unakumbuka PlantVillage Nuru,\nwakulima walitumia hiki kifaa cha\n\n00:06.930 --> 00:11.060\nkutambua kwa AI kupiga picha za majani\nya mimea ili kuona kama majani yao ni\n\n00:11.060 --> 00:11.890\nmagonjwa au la.\n\n00:12.680 --> 00:16.510\nNa sasa ni zamu yako kubuni\nkifaa chako cha kutambua kwa AI.\n\n00:16.510 --> 00:21.320\nKatika masomo matatu yajayo, utaweza\nkubuni kifaa chako cha kutambua kwa AI\n\n00:21.320 --> 00:23.460\nkwenye mada yoyote utakayochagua.\n\n00:24.060 --> 00:28.830\nHiyo inaweza kuwa majani ya mimea, vifaa\nvya shule, au chochote utakachofikiria.\n\n00:30.310 --> 00:34.460\nNa kwa hivyo baadhi ya mifano ambayo\nwanafunzi wamefanya ni kwamba, unajua,\n\n00:34.460 --> 00:38.670\nwengine walizunguka bustani ya shule yao\nkupiga picha za majani ya mimea ili\n\n00:38.670 --> 00:43.050\nkutofautisha kati ya aina mbalimbali za\nmajani kwenye bustani yao ya shule, na,\n\n00:43.050 --> 00:47.270\neh, wengine walipiga picha tofauti za\nvitu kama vikombe vya glasi na vikombe\n\n00:47.270 --> 00:51.650\nvya plastiki, na hata wengine walikuwa\nwabunifu zaidi ambapo walifanya lugha ya\n\n00:51.650 --> 00:55.630\nishara, walipiga picha za mikao\nmbalimbali ya mikono ili kuona ni herufi\n\n00:55.630 --> 00:56.420\ngani zilikuwa.\n\n00:58.250 --> 01:02.970\nKwa hiyo baada ya kila somo, utaandika\nmajibu yako kwenye karatasi yako ya kazi.\n\n01:02.970 --> 01:07.510\nKama huna karatasi ya kazi, tumia tu\nkaratasi yoyote kuandika majibu yako, na\n\n01:07.510 --> 01:10.670\npia mnaweza kufanya kazi kwa vikundi\nkama inahitajika.\n\n01:11.750 --> 01:15.590\nHii hapa ndiyo karatasi ya kazi, na\nkufikia mwisho wa haya yote, unapaswa\n\n01:15.590 --> 01:18.050\nkuwa umemaliza kujaza baada ya kumaliza\nmasomo.\n\n01:19.890 --> 01:24.220\nSawa, kwa hiyo baada ya masomo yote,\nunapaswa kuwa umekamilisha karatasi yako\n\n01:24.220 --> 01:27.470\nya kazi na kubuni AI classifier yako kwa\nmada uliyochagua.\n\n01:27.470 --> 01:31.690\nKwa hivyo mwalimu wako anaweza kupanga\nsiku ya hiari ya uwasilishaji ambapo\n\n01:31.690 --> 01:35.570\nutaonyesha AI classifier yako na majibu\nyako kwenye karatasi ya kazi.\n\n01:37.170 --> 01:41.520\nSawa, basi hebu tuanze kujibu swali\nla kwanza kwenye karatasi ya kazi.\n\n01:43.520 --> 01:48.130\nKwa hiyo utaanza kwa kujibu tu somo la\nkwanza, ambalo ni kuchagua mada yako ya\n\n01:48.130 --> 01:48.790\nuainishaji.\n\n01:49.260 --> 01:53.840\nChagua mada ambayo ungependa kuchunguza\nkwa ajili ya uainishaji wa AI yako na\n\n01:53.840 --> 01:55.410\neleza kwa nini umeichagua.\n\n01:56.000 --> 01:58.750\nHivi ndivyo mfano wa kile mwanafunzi\nameandika,\n\n01:58.750 --> 02:00.910\n\"Nataka kuainisha matunda kwa sababu\n\n02:00.910 --> 02:03.180\nnapenda matunda na ni rahisi kuyapata.\n\n02:03.180 --> 02:05.210\nWatu wengi wanaonizunguka wanakuza\n\n02:05.210 --> 02:07.370\nmatunda, kwa hiyo naweza kuleta aina\n\n02:07.370 --> 02:09.520\ntofauti tofauti kutumia kwenye mradi\n\n02:09.520 --> 02:09.940\nwangu.\"\n"}, {"id": "lesson-1/07", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=1&lang=sw"}]}, {"id": "lesson-2", "kicker": "Somo la 2", "title": "Sehemu Muhimu za Kujifunza kwa Mashine", "items": [{"id": "lesson-2/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-2-01.mp4", "vtt": "WEBVTT\n\n00:00.420 --> 00:04.790\nSawa, karibu kwenye somo la pili, ambapo\ntutaongea kuhusu sehemu kuu za\n\n00:04.790 --> 00:06.160\nujifunzaji wa mashine.\n\n00:06.160 --> 00:10.790\nHivyo basi, lengo la somo la pili ni\nkwamba tutaweza kuelezea ujifunzaji wa\n\n00:10.790 --> 00:11.780\nmashine ni nini.\n\n00:11.780 --> 00:15.090\nTutaweza kutambua sehemu kuu\nza ujifunzaji wa mashine.\n\n00:15.090 --> 00:19.720\nTutaelezea kwa nini au kila sehemu\ninafanya nini na jinsi zinavyofanya kazi\n\n00:19.720 --> 00:24.020\npamoja, na utaelezea jinsi data\ninavyoathiri jinsi AI inavyofanya kazi\n\n00:24.020 --> 00:24.460\nvizuri.\n"}, {"id": "lesson-2/02", "title": "Kujifunza kwa Mashine ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-2-02.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:03.400\nSawa, sasa unaandaa vipi mtihani hasa?\n\n00:03.880 --> 00:06.570\nFikiria hili kwa sekunde chache tu.\n\n00:06.650 --> 00:11.070\nSawa, basi binadamu anapojiandaa kwa\nmtihani, kitu cha kwanza unachofanya ni\n\n00:11.070 --> 00:15.200\nkukusanya taarifa fulani, na taarifa\nhizo zinaweza kuwa katika mfumo wa\n\n00:15.200 --> 00:16.260\nmadokezo darasani.\n\n00:17.130 --> 00:21.930\nUkishapata madokezo yako, utaanza kusoma\nhayo madokezo, na kinachotokea ni kwamba\n\n00:21.930 --> 00:26.120\nubongo wako utaunganisha taarifa hizo\nmpya na uzoefu wako wa maisha ili\n\n00:26.120 --> 00:28.220\nkuelewa vizuri zaidi mambo duniani.\n\n00:28.500 --> 00:33.250\nNa kinachotokea kadri muda unavyosonga\nni kwamba utakuwa umejiandaa vizuri\n\n00:33.250 --> 00:38.060\nzaidi kufanya mtihani unapounganisha\ntaarifa mpya na maarifa yako ya awali.\n\n00:38.950 --> 00:43.320\nKwa hiyo sehemu nne za kujiandaa kwa\nmtihani ni: ubongo, ambapo ubongo\n\n00:43.320 --> 00:48.070\nkimsingi unachukua madokezo, unasoma\nhayo madokezo, na matokeo yake, unakuwa\n\n00:48.070 --> 00:50.850\nna ubongo uliyojiandaa zaidi kufanya\nmtihani.\n\n00:51.950 --> 00:55.670\nKwa hiyo, ubongo ndio kitu\nkinachofanya kujifunza.\n\n00:55.670 --> 00:59.160\nMadokezo kimsingi ndiyo\ntaarifa utakazojifunza.\n\n00:59.450 --> 01:04.150\nKusoma kimsingi ni muda na mchakato wa\nkuunganisha mawazo haya mapya na yale\n\n01:04.150 --> 01:07.850\nunayoyajua tayari, na ubongo\nuliyojiandaa ndio matokeo yake.\n\n01:08.130 --> 01:13.260\nKwa hiyo baada ya kusoma hayo madokezo,\nuko tayari kimsingi kufanya mtihani.\n\n01:14.230 --> 01:18.750\nKwa hiyo, kujifunza kwa binadamu, na\nwazo kuu la kujifunza kwa binadamu, ni\n\n01:18.750 --> 01:23.400\nkwamba unajenga uelewa kwa kuunganisha\ntaarifa mpya na uzoefu wako wa maisha,\n\n01:23.400 --> 01:24.870\nili uweze kuelewa dunia.\n\n01:25.700 --> 01:29.380\nSasa, kujifunza kwa binadamu\nkunalinganishwaje na kujifunza kwa\n\n01:29.380 --> 01:29.860\nmashine?\n\n01:29.990 --> 01:34.910\nSasa, kuhusu kujifunza kwa mashine, na\ntutaingia kwa undani zaidi kuhusu\n\n01:34.910 --> 01:40.440\ntunachomaanisha hapa, ni kwamba kimsingi\nkunatumia maagizo ya kihisabati kutafuta\n\n01:40.440 --> 01:43.140\nmifumo kwenye data ili kufanya utabiri.\n\n01:43.450 --> 01:48.090\nNa baadhi ya vipengele vya kujifunza kwa\nmashine ni kwamba kuna mfano ( model).\n\n01:48.150 --> 01:52.550\nMfano huo unapokea data, na kimsingi\nmafunzo ni pale unapojaribu kutafuta\n\n01:52.550 --> 01:57.070\nmifumo kwenye data hiyo, halafu unakuwa\nna mfano uliopata mafunzo kama vile\n\n01:57.070 --> 02:02.200\nkigunduzi cha magonjwa ya mimea ambacho\nkinaweza kutabiri kama mmea una ugonjwa au la.\n\n02:02.200 --> 02:06.900\nKwa hiyo, sehemu nne kuu za kujifunza\nkwa mashine kwa undani ni kwamba mfano (\n\n02:06.900 --> 02:09.960\nmodel) ndio kitu kinachoshika au kunasa\nile mifumo.\n\n02:09.960 --> 02:13.750\nData ni taarifa tu tunazompa mfano\nambazo atazitumia kujifunza.\n\n02:15.410 --> 02:21.170\nMafunzo ( training) kimsingi ni mchakato\nambapo mfano unatumia kuchambua data ili\n\n02:21.170 --> 02:22.320\nkutafuta mifumo.\n\n02:22.410 --> 02:26.420\nNa tena, mfano uliopata mafunzo ni\nmatokeo baada ya mfano kumaliza\n\n02:26.420 --> 02:29.190\nkujifunza, na sasa uko tayari kufanya\nutabiri.\n\n02:31.180 --> 02:36.030\nHivyo, ingawa mashine huchakata\ntofauti, zote zinafanana.\n\n02:36.030 --> 02:42.800\nUbongo ni mfano, noti ni data, kusoma ni\nmafunzo, na ubongo uliopata mafunzo ni\n\n02:42.800 --> 02:43.930\nmfano kamili.\n\n02:44.390 --> 02:48.240\nHazifanani kabisa, lakini zinashiriki\nhatua zinazofanana za jinsi\n\n02:48.240 --> 02:50.590\nzinavyokaribia kujifunza kwao kimsingi.\n"}, {"id": "lesson-2/04", "title": "Jinsi ya Kutumia NeuroPocket", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-2-04.mp4", "vtt": "WEBVTT\n\n00:00.500 --> 00:05.610\nSawa, tumezungumza kuhusu sehemu kuu za\nujifunzaji wa mashine, kama vile mfano,\n\n00:05.610 --> 00:10.910\ndata, mafunzo, na mfano uliopata mafunzo,\nlakini ni vigumu sana kuona jinsi sehemu\n\n00:10.910 --> 00:12.680\nhizi tofauti zinavyoungana.\n\n00:13.440 --> 00:17.540\nBasi hebu tuone jinsi sehemu hizi kuu\nzinavyoungana kwa kubuni kifaa cha\n\n00:17.540 --> 00:19.440\nkuchambua kwa kutumia NeuroPocket.\n\n00:20.230 --> 00:22.420\nSasa, NeuroPocket ni nini hasa?\n\n00:22.900 --> 00:27.680\nNeuroPocket ni programu ya AI ambapo\nunaweza kuongeza picha, kufundisha mfano,\n\n00:27.680 --> 00:29.950\nna kuona jinsi AI inavyotambua vitu.\n\n00:30.810 --> 00:35.100\nNa tayari umeona mifano kadhaa kwenye\nNeuroPocket katika mfano wa mwanafunzi.\n\n00:35.680 --> 00:40.050\nUmeona wanafunzi waliweza kutofautisha\nkati ya majani ya mimea tofauti,\n\n00:40.050 --> 00:44.540\nwaliweza kutofautisha kati ya vifaa\ntofauti, na hata lugha ya ishara pia.\n\n00:45.330 --> 00:50.320\nKwa hiyo tutaenda kujifunza NeuroPocket\npamoja kwa kufanya kila hatua pamoja.\n\n00:50.430 --> 00:55.260\nKwa hiyo unapopitia kila hatua, jisikie\nhuru kusitisha video ili uweze\n\n00:55.260 --> 00:59.470\nkukamilisha jukumu au hatua kabla ya\nkuendelea na inayofuata.\n\n01:00.360 --> 01:05.240\nNa bila shaka, kama unafanya kazi kwa\nmakundi au darasani, ukimaliza mapema,\n\n01:05.240 --> 01:10.060\nsaidia wengine waliokuzunguka ili tuweze\nkwenda hatua inayofuata kwa haraka\n\n01:10.060 --> 01:10.510\npamoja.\n\n01:12.570 --> 01:16.810\nSawa, jambo la kwanza nitakalofanya ni\nkufungua app yangu ya NeuroPocket, na\n\n01:16.810 --> 01:19.910\nnitaipa jina mradi wangu kuwa Mradi wa\nVifaa vya Shule.\n\n01:20.140 --> 01:23.870\nInaweza kuwa jina lolote unalotaka,\nni jina tu la mradi wako.\n\n01:23.870 --> 01:27.030\nNa ukishabofya Unda,\nitakuingiza ndani ya huo mradi.\n\n01:27.030 --> 01:30.010\nKwa hivyo naweza kuwa na\nmakundi zaidi ya mawili.\n\n01:30.440 --> 01:35.120\nKwa upande wangu, nataka kugawanya kati\nya makundi ya mkasi na kalamu humo ndani.\n\n01:35.840 --> 01:40.270\nSasa, baada ya kuunda angalau makundi\nyangu mawili, nitaongeza picha kwa kila\n\n01:40.270 --> 01:41.380\nkundi kati ya hayo.\n\n01:41.530 --> 01:45.610\nKwa upande wangu, kwa sababu nina mkasi,\nnitapiga picha za mkasi kadhaa.\n\n01:46.200 --> 01:50.720\nKatika hali hii, nimepiga takriban sita,\nhalafu naongeza hizo picha.\n\n01:50.720 --> 01:53.490\nUnaweza kupiga zaidi\nya hizo kama unataka.\n\n01:53.730 --> 01:56.690\nHalafu sasa nitapiga\npicha za kalamu kadhaa.\n\n01:57.180 --> 02:00.420\nNa kwa upande wangu,\npia nimepiga picha sita za kalamu.\n\n02:00.420 --> 02:03.840\nNa kama nilivyosema, unaweza\nkuwa na mamia kama ungependa.\n\n02:04.180 --> 02:06.270\nKwa upande wangu, nafanya haraka tu.\n\n02:06.270 --> 02:10.060\nKisha utaongeza picha, na sasa\numeongeza data kwenye makundi yako.\n\n02:10.700 --> 02:15.710\nUnaweza kuwa na makundi zaidi ukipenda,\nlakini tutaendelea na haya.\n\n02:15.710 --> 02:19.520\nIngia kwenye mafunzo,\nkisha bonyeza Fundisha Mfano.\n\n02:19.520 --> 02:23.320\nHii itachukua dakika chache,\nbasi tusubiri imalize.\n\n02:32.000 --> 02:34.470\nSawa, sasa hebu tujaribu mfano wetu.\n\n02:34.870 --> 02:39.150\nKwa hiyo kitu cha kwanza nitakachofanya\nni kupiga picha ya kalamu yangu ikiwa\n\n02:39.150 --> 02:42.140\nkwenye nafasi tofauti na kuona kama\nitaigundua vizuri.\n\n02:42.140 --> 02:44.340\nNa unaweza kuona inasema hii ni kalamu.\n\n02:44.830 --> 02:49.740\nHalafu sasa nitajaribu na mkasi wangu\nukiwa kwenye nafasi nyingine tofauti,\n\n02:49.740 --> 02:52.860\ninatambua, na unaweza kuona kweli\ninaiita mkasi.\n\n02:52.860 --> 02:53.520\nSawa basi.\n\n02:53.520 --> 02:55.450\nHuo ndio mtambuzi wako wa AI.\n\n02:55.450 --> 02:59.360\nNa uko huru kuongeza data zaidi\nili kuboresha mtambuzi wako.\n"}, {"id": "lesson-2/03", "title": "Fungua NeuroPocket", "type": "app", "kind": "App"}, {"id": "lesson-2/05", "title": "Zana za AI Zinaweza Kufanya Makosa", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-2-05.mp4", "vtt": "WEBVTT\n\n00:00.660 --> 00:02.420\nSawa, basi karibu tena.\n\n00:02.560 --> 00:06.770\nBaada ya kupata muda wa kucheza na\nNeuroPocket, je, kichunguzi chako cha AI\n\n00:06.770 --> 00:08.370\nkilikuwa sahihi kila wakati?\n\n00:08.370 --> 00:11.780\nNa kama haikuwa hivyo,\nunadhani kwa nini kilifanya kosa hilo?\n\n00:11.780 --> 00:16.170\nBasi jisikie huru kusitisha video na\nkufikiria kuhusu hilo kwa sekunde chache.\n\n00:19.190 --> 00:24.960\nSawa, kitu kuhusu zana za AI ni kwamba\nzinaweza kukupa matokeo usiyotarajia.\n\n00:25.360 --> 00:29.750\nKitu ambacho ni dhahiri kwako,\nhakiwezi kuwa dhahiri kwa zana ya AI.\n\n00:30.320 --> 00:35.540\nKwa hiyo kitu kuhusu zana za AI ni\nkwamba haziwezi kuelewa kama binadamu,\n\n00:35.540 --> 00:40.920\nkwa hiyo zinahitaji kuchambua kila\nundani kwenye picha ili kutafuta mifumo.\n\n00:41.520 --> 00:46.390\nNa wakati mwingine hiyo inamaanisha\nkwamba zinapata au kutumia mifumo ambayo\n\n00:46.390 --> 00:48.540\nsisi hatujawahi kuifikiria kabla.\n\n00:48.540 --> 00:53.090\nKwa mfano, unaweza kuona hapa kwamba\ntuna mkasi wazi kabisa, lakini kwa\n\n00:53.090 --> 00:58.100\nsababu uko kwenye nafasi sawa na penseli\nya rangi hapa, na pia una rangi sawa,\n\n00:58.100 --> 01:00.310\numeainishwa kama penseli ya rangi.\n\n01:02.160 --> 01:06.780\nNa pia, kitu kuhusu mifumo ya AI ni\nkwamba imewekewa mipaka sana na data yake.\n\n01:06.780 --> 01:10.970\nInaweza kutabiri tu kulingana na kile\nilichowahi kuchambua hapo awali.\n\n01:11.650 --> 01:16.430\nKwa hiyo unaweza kuona kwamba kigunduzi\nchetu cha magonjwa ya mimea kinashindwa\n\n01:16.430 --> 01:20.770\nkwa sababu hakijawahi kuona wala\nkuchambua nyasi kabla, na unaweza kuona\n\n01:20.770 --> 01:24.510\nwazi kwamba kinaiita kama peach yenye\nafya, ambayo siyo kweli.\n\n01:24.510 --> 01:28.240\nNa hili halihusiani tu na picha,\nbali pia na lugha pia, sivyo?\n\n01:28.240 --> 01:32.830\nKifaa cha AI kinaweza kujibu tu\nkulingana na lugha ambazo kilifundishwa nazo.\n\n01:33.480 --> 01:36.380\nKwa mfano huu, naongea kwa Kihindi, kama\nvile,\n\n01:36.380 --> 01:38.760\n\"Hali ya hewa iko vipi leo? Jina lako\n\n01:38.760 --> 01:41.140\nnani? Mbili jumlisha mbili ni ngapi?\"\n\n01:41.430 --> 01:45.600\nNa kwa sababu hiki kifaa cha AI\nhakijawahi kuchambua data ya Kihindi\n\n01:45.600 --> 01:50.460\nkabla, kitaendelea kurudia sentensi ile\nile ya Kiingereza, ambayo ndiyo inajua,\n\n01:50.460 --> 01:52.700\n\"I am good. And you?\" mara kwa mara.\n\n01:53.010 --> 01:56.940\nHii inaingia tu kwenye dhana hii ya\nkwamba, kile kinachoingia, ndicho\n\n01:56.940 --> 01:57.630\nkinachotoka.\n\n01:57.810 --> 02:02.380\nKwa hiyo kwenye machine learning, kama\ndata ni ndogo, inamaanisha utabiri wa\n\n02:02.380 --> 02:04.510\nmodeli pia utakuwa mdogo vile vile.\n"}, {"id": "lesson-2/06", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=2&lang=sw"}, {"id": "lesson-2/07", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-2-07.mp4", "vtt": "WEBVTT\n\n00:00.380 --> 00:02.940\nSawa, ni wakati wa\nmradi kwa somo la pili.\n\n00:02.940 --> 00:07.490\nKwa hivyo ulikuwa na muda wa kufanya\nmazoezi kidogo, lakini sasa ni wakati\n\n00:07.490 --> 00:11.980\nwako kuchunguza mazingira yako na\nkukusanya data kuhusu mada uliyouchagua\n\n00:11.980 --> 00:13.350\nkwenye somo la kwanza.\n\n00:14.040 --> 00:18.310\nKumbuka, mada inaweza kubadilika\nunapoendelea na karatasi.\n\n00:18.310 --> 00:21.840\nSharti ujibu swali la pili\nkwenye karatasi yako.\n\n00:21.840 --> 00:24.910\nSomo la pili ni kuhusu\nukusanyaji wa data.\n\n00:25.600 --> 00:29.890\nKwa hiyo, utatuambia ni vitu gani\nutakavyopanga na jinsi utakavyokusanya\n\n00:29.890 --> 00:30.500\ndata yako.\n\n00:30.500 --> 00:33.760\nHivyo basi, mfano wa jibu\nkutoka kwa mwanafunzi ni huu.\n\n00:34.340 --> 00:36.360\n\"Vitu nitakavyopanga ni ndizi,\n\n00:36.360 --> 00:38.660\nmachungwa, na parachichi. Nitaleta\n\n00:38.660 --> 00:40.880\nmatunda kutoka nyumbani kwangu au\n\n00:40.880 --> 00:43.910\nnitaenda bustani ya shule kupiga picha.\"\nSawa?\n\n00:43.910 --> 00:48.970\nKwa hiyo utajibu somo la pili, na pia\nkama mwalimu wako atakuruhusu, unaweza\n\n00:48.970 --> 00:54.090\npia kuzunguka kwenye mazingira yako\nkupiga picha zaidi ili kuongeza kwenye ...\n\n00:54.090 --> 00:57.930\nau kuboresha kifaa chako cha\nkutambua vitu kwa kutumia AI.\n"}, {"id": "lesson-2/08", "title": "Karatasi ya Kazi", "type": "html", "kind": "Worksheet", "src": "/course/apps/worksheet/index.html?lesson=2&lang=sw"}]}, {"id": "lesson-3", "kicker": "Somo la 3", "title": "Mashine Hujifunzaje", "items": [{"id": "lesson-3/01", "title": "Malengo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-01.mp4", "vtt": "WEBVTT\n\n00:00.430 --> 00:05.270\nSawa, karibu kwenye somo la\ntatu, mashine hujifunzaje?\n\n00:05.530 --> 00:10.810\nKama unakumbuka, kwenye somo lililopita,\ntuliongelea sehemu kuu za ujifunzaji wa mashine\n\n00:10.810 --> 00:16.750\nambapo unakuwa na mfano wako na kwenye huo\nmfano unaupa data halafu mwisho kuna mchakato\n\n00:16.750 --> 00:23.470\nwa mafunzo ambapo mfano huo unatumia muda huo\nkuchambua data zote ulizompa ili kutafuta mifumo.\n\n00:23.470 --> 00:28.890\nLakini mchakato wa mafunzo wa\nujifunzaji wa mashine hufanyikaje hasa?\n\n00:28.890 --> 00:32.330\nNa hicho ndicho tutakachoelewa\nkwenye somo la tatu.\n\n00:32.330 --> 00:37.910\nHivyo, lengo ni kwamba utaelezea algorithimu\nni nini na utoe mifano halisi ya maisha.\n\n00:37.910 --> 00:42.710\nUtaelezea kwa nini mashine zinahitaji\nalgorithimu ili zifanye kazi.\n\n00:42.710 --> 00:47.150\nUtaelezea hatua ambazo mashine\nhufuata wakati wa mafunzo.\n\n00:47.150 --> 00:53.650\nNa mwisho, utalinganisha jinsi binadamu na mashine\nwanavyoshughulikia taarifa kwa njia tofauti.\n"}, {"id": "lesson-3/02", "title": "Mchezo wa Describer Drawer — Maelekezo", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-02.mp4", "vtt": "WEBVTT\n\n00:00.260 --> 00:04.550\nSawa, basi kuanza hii, hebu tucheze\nmchezo wa mwelekezi na mchoraji.\n\n00:04.550 --> 00:09.360\nMchezo huu unahitaji wachezaji wawili au\nzaidi, lakini usijali kama huna mtu\n\n00:09.360 --> 00:11.990\nmwingine wa kucheza naye na uko peke\nyako.\n\n00:12.710 --> 00:16.740\nTuna video inayoonyesha sisi tukicheza\nhuu mchezo, ili uweze kuona jinsi\n\n00:16.740 --> 00:17.540\nunavyofanyika.\n\n00:18.050 --> 00:23.640\nKwa hiyo, ukishapata mtu wa kucheza\nnaye, utakuwa tayari kabisa, sawa?\n\n00:24.040 --> 00:27.540\nLakini bado hebu tuendelee kupitia\nmaelekezo hadi wakati huo.\n\n00:27.540 --> 00:31.740\nSasa jinsi mchezo unavyofanya kazi ni\nkwamba mtakuwa mnafanya kazi wawili\n\n00:31.740 --> 00:35.240\nwawili, kwa hiyo tena, unahitaji kuwa na\nwatu wawili angalau.\n\n00:35.240 --> 00:39.090\nKwa hiyo mtu mmoja atakuwa anaelezea,\nna mwingine atakuwa anachora.\n\n00:40.130 --> 00:45.960\nKama kuna mwalimu, huyo mwalimu atachora\nmchoro rahisi wenye maumbo matatu hadi\n\n00:45.960 --> 00:48.790\nmatano ya msingi katika nafasi yoyote.\n\n00:49.280 --> 00:54.190\nKwa hiyo mchoro unaweza kuwa rahisi kama\nhuu, na unaweza pia kuwa mgumu kama huu.\n\n00:55.230 --> 00:59.300\nEe, kama hakuna mwalimu, yule\nanaelezea ndiye atakayefanya mchoro.\n\n01:00.500 --> 01:05.420\nSasa, mara tu mchoro ukiwa tayari, ni\nyule anaelezea pekee ndiye anayeruhusiwa\n\n01:05.420 --> 01:06.510\nkuutazama mchoro.\n\n01:07.250 --> 01:12.270\nKwa hiyo anaelezea atamwambia anayechora\njinsi ya kuiga huo mchoro kwa kutumia\n\n01:12.270 --> 01:13.900\nmaelekezo ya mdomo pekee.\n\n01:14.050 --> 01:17.060\nWanaweza tu kuzungumza kuhusu\njinsi ya kuiga huo mchoro.\n\n01:17.540 --> 01:20.620\nMikono yako inapaswa kuwa\nnyuma ya mgongo wako.\n\n01:20.620 --> 01:23.900\nHakuna kuonyesha kwa kidole\nkunakokubaliwa kabisa.\n\n01:23.900 --> 01:29.120\nNa hivyo wakati huo mchora anapojaribu\nkuiga ule mchoro, baada ya dakika mbili,\n\n01:29.120 --> 01:34.270\nmchora atalinganisha mchoro wake na ule\nmchoro halisi au mchoro wa mwalimu ili\n\n01:34.270 --> 01:36.420\nkuona kama umefanana kiasi gani.\n\n01:37.010 --> 01:40.750\nNa hivyo mwishowe, baada ya hayo yote\nkukamilika, hiyo ni raundi moja.\n\n01:40.860 --> 01:43.740\nMtabadilishana majukumu na kurudia tena.\n\n01:43.800 --> 01:47.870\nKwa hiyo sasa anaelezea anakuwa mchora,\nna mchora anakuwa anaelezea.\n\n01:48.910 --> 01:49.510\nSawa.\n\n01:49.550 --> 01:52.230\nBasi hebu tuanze kucheza\nhuu mchezo, sawa?\n\n01:52.350 --> 01:55.920\nBasi tujaribu kufanya angalau raundi\nmbili, na nitawaona kwenye ile\n\n01:55.920 --> 01:56.510\ninayofuata.\n"}, {"id": "lesson-3/03", "title": "Mchezo wa Describer Drawer — Onyesho", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-03.mp4", "vtt": "WEBVTT\n\n00:02.240 --> 00:06.410\nSawa, kwa hivyo tutafanya shughuli\ninayoitwa mchezo wa mwelezaji na\n\n00:06.410 --> 00:08.880\nmchoraji, na mchezo huu ni rahisi sana.\n\n00:09.610 --> 00:14.330\nMimi, mwalimu, nitachora mchoro rahisi\nsana ambao utakuwa na maumbo matatu tu\n\n00:14.330 --> 00:15.200\nya kijiometri.\n\n00:15.800 --> 00:20.320\nHiyo inaweza kuwa mraba, inaweza kuwa\nduara, inaweza kuwa pembetatu, inaweza\n\n00:20.320 --> 00:22.780\nkuwa almasi, inaweza kuwa chochote, sawa?\n\n00:23.130 --> 00:28.530\nLakini kimsingi ni maumbo matatu rahisi\nambayo unaweza kuyaweka kwa njia yoyote\n\n00:28.530 --> 00:29.220\nunayotaka.\n\n00:29.220 --> 00:34.130\nNa kwa hivyo nitakachofanya hapa ni\nkuchora labda kitu rahisi kama hiki.\n\n00:39.430 --> 00:42.430\nKwa hivyo huu ni mfano rahisi\nambao nitakuwa nikichora.\n\n00:42.850 --> 00:47.130\nNa kwa hivyo kitakachokuwa kikifanyika\nni kama mwalimu, baada ya kutengeneza\n\n00:47.130 --> 00:51.520\nmichoro yangu, sasa nitakuwa na walimu\nwangu au wanafunzi wangu watafanya kazi\n\n00:51.520 --> 00:52.370\nkwa jozi, sawa?\n\n00:52.370 --> 00:56.590\nNa kwa hivyo kimsingi, uh, wanafunzi\nwanapofanya kazi kwa jozi, kutakuwa na\n\n00:56.590 --> 00:57.510\nmajukumu mawili.\n\n00:57.510 --> 01:00.070\nKutakuwa na mwelezaji na\nkutakuwa na mchoraji.\n\n01:00.070 --> 01:03.380\nKwa hivyo ni nani hapa atakuwa\nmwelezaji katika nafasi hii?\n\n01:04.270 --> 01:05.320\nNitakuwa mwelezaji.\n\n01:05.720 --> 01:08.170\nSawa, na Karen atakuwa mchoraji.\n\n01:08.210 --> 01:12.860\nKwa hivyo tena, wazo zima ni kwamba\nmwelezaji ndiye mtu pekee anayeruhusiwa\n\n01:12.860 --> 01:17.390\nkuja nyuma ya mchoro huu uliofichwa na\nkimsingi kurudi kwa mchoraji kutoa\n\n01:17.390 --> 01:20.340\nmaelekezo ya jinsi ya kuchora tena\nmichoro hiyo.\n\n01:20.680 --> 01:25.180\nNa kwa hivyo ujanja ni kwamba, mwelezaji\nanaweza kuja mara nyingi apendavyo.\n\n01:25.480 --> 01:30.210\nHata hivyo, wanaweza tu kutoa maelekezo\nya maneno, na lazima wasimame nyuma ya\n\n01:30.210 --> 01:32.860\nmchoraji kutoa maelekezo hayo ili\nwasionane.\n\n01:33.870 --> 01:38.250\nHaya, basi hebu tuonyeshe onyesho la\njinsi mchezo huu utakavyofanya kazi.\n\n01:38.810 --> 01:40.570\nKwa hivyo mko tayari?\n\n01:40.820 --> 01:41.260\nNdiyo.\n\n01:41.320 --> 01:42.040\nImara.\n\n01:42.040 --> 01:42.880\nTwende.\n\n01:43.440 --> 01:44.880\nUnaweza kwenda juu, Mason.\n\n01:45.100 --> 01:48.250\nAngalia mchoro na umpe Karen maelekezo.\n\n01:48.250 --> 01:50.500\nUnaweza kufanya hivi, Mason.\n\n01:54.770 --> 01:55.140\nSawa.\n\n01:57.930 --> 02:00.780\nKwa hivyo jambo la\nkwanza ni kuchora mraba.\n\n02:01.230 --> 02:01.760\nSawa.\n\n02:07.420 --> 02:11.740\nKatikati ya mraba, chora\nduara taratibu, tafadhali.\n\n02:14.610 --> 02:17.700\nJe, itakuwa ikigusa kingo\nza mraba au katikati?\n\n02:18.250 --> 02:19.920\nUm, itakuwa katikati.\n\n02:20.000 --> 02:22.180\nHaitakuwa ikigusa kingo zozote.\n\n02:22.210 --> 02:23.480\nSawa kabisa.\n\n02:24.350 --> 02:24.790\nSawa.\n\n02:24.790 --> 02:31.750\nNa chini ya mraba, itakuwa nje ya mraba,\nna itakuwa pembetatu inayoelekea chini.\n\n02:32.900 --> 02:33.450\nSawa.\n\n02:33.450 --> 02:37.530\nUkitumia mstari wa chini kama ukingo?\n\n02:38.380 --> 02:38.830\nSahihi.\n\n02:38.830 --> 02:43.890\nUngetumia ukingo wa kulia na ukingo wa\nkushoto, na itaenda katikati kabisa kama\n\n02:43.890 --> 02:45.060\nncha ya pembetatu.\n\n02:45.250 --> 02:45.880\nSawa\n\n02:45.880 --> 02:47.500\nMaelekezo mazuri, Mason.\n\n02:49.120 --> 02:49.890\nHaya basi.\n\n02:49.890 --> 02:50.350\nNdiyo.\n\n02:50.430 --> 02:51.500\nKazi nzuri, jamani.\n\n02:51.500 --> 02:55.030\nNa kama unavyoweza kuona pale,\nwaliweza kuchora tena mchoro huo.\n\n02:55.030 --> 02:57.060\nNa sasa hapa ndipo kuna jambo, sawa?\n\n02:57.060 --> 03:00.880\nWazo zima la mchezo huu ni kwamba\nhiyo ilikuwa tu kiwango cha kwanza.\n\n03:01.440 --> 03:05.820\nKama mwalimu, unaweza kuzidi kufanya\nmchezo huu kuwa mgumu kwa, kama, kufanya\n\n03:05.820 --> 03:07.150\nmaumbo kama haya, sawa?\n\n03:07.350 --> 03:12.030\nUnaweza kuweka maumbo yako katika nafasi\nhii na labda kutengeneza mraba mdogo na\n\n03:12.030 --> 03:14.340\nkuweka pembetatu katikati ya hii, sawa?\n\n03:15.010 --> 03:19.790\nKimsingi, wazo kuu ni kwamba tunataka tu\nkuweza kuwapa changamoto wanafunzi wetu\n\n03:19.790 --> 03:24.570\nkutoa maelekezo wazi kwa wachoraji ili\nwaweze kuelewa wazi nini cha kuchora tena.\n\n03:25.250 --> 03:26.210\nHaya basi.\n\n03:26.210 --> 03:27.550\nAsanteni sana.\n\n03:27.650 --> 03:28.370\nAsante.\n\n03:28.370 --> 03:30.370\nNa tutawaona kwenye mchezo ujao.\n"}, {"id": "lesson-3/04", "title": "Alogarithimu ni Nini", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-04.mp4", "vtt": "WEBVTT\n\n00:00.320 --> 00:01.640\nSawa, karibu tena.\n\n00:01.700 --> 00:06.850\nKwa hiyo kama ulipata nafasi ya kucheza\nmchezo wa kuelezea au kuchora na mtu\n\n00:06.850 --> 00:12.140\nmwingine, au uliweza kutazama video ya\nmaonyesho, swali letu kwako ni hili: ni\n\n00:12.140 --> 00:17.090\nmbinu gani wewe na mwenzako mlitumia au\numeona zikitumika ili kurahisisha\n\n00:17.090 --> 00:18.740\nkuchora tena mchoro ule?\n\n00:18.740 --> 00:23.130\nSasa, simamisha video na tafakari\nkuhusu hilo kwa sekunde chache.\n\n00:26.340 --> 00:31.240\nSawa, sasa kwa kuwa umepata muda wa\nkufikiria, labda umeona kwamba walikuwa\n\n00:31.240 --> 00:34.620\nwanatumia kitu kinachoitwa kufikiri\nhatua kwa hatua.\n\n00:34.620 --> 00:39.180\nKwa hiyo kufikiri hatua kwa hatua,\nwakati unacheza mchezo na mwenzako,\n\n00:39.180 --> 00:44.210\nilibidi utoe maelekezo wazi kabisa hatua\nkwa hatua ili yule anayechora aelewe\n\n00:44.210 --> 00:46.860\njinsi ya kuchora tena mchoro wa mwalimu.\n\n00:47.830 --> 00:52.630\nKwa mfano, mtu angeweza kusema kitu\nkama hiki: kwanza chora duara.\n\n00:53.290 --> 00:56.800\nHalafu ndani ya hilo duara,\nchora pembetatu ndogo.\n\n00:56.800 --> 01:02.040\nLakini unaweza kuona kwamba tulitoa\nmaelekezo wazi kabisa hatua kwa hatua.\n\n01:02.040 --> 01:06.420\nKwa hiyo ulichokiumba au ulichokiona\nsasa hivi ni algorithimu.\n\n01:06.420 --> 01:11.650\nAlgorithimu ni maelekezo yoyote wazi\nhatua kwa hatua ya kukamilisha jukumu\n\n01:11.650 --> 01:12.150\nfulani.\n\n01:13.510 --> 01:17.290\nNa jambo kuhusu algorithimu ni kwamba\ninaweza kutumika kwenye kitu chochote\n\n01:17.290 --> 01:17.750\nmaishani.\n\n01:17.930 --> 01:23.200\nHaihitaji kuwa ya kiteknolojia, mradi tu\nhiyo algorithimu ni seti ya maelekezo ya\n\n01:23.200 --> 01:25.700\nhatua kwa hatua ya kukamilisha jukumu.\n\n01:26.410 --> 01:31.100\nKwa mfano, nikitazama hili, hatua za\nkutengeneza kikombe cha chai, unajua,\n\n01:31.100 --> 01:33.290\nhatua ya kwanza ni kuchemsha maji.\n\n01:33.450 --> 01:35.800\nHatua ya pili, ni\nkuongeza mfuko wa chai.\n\n01:35.800 --> 01:39.920\nHatua ya tatu, nilihitaji kuongeza\nsukari na maziwa, na hatimaye kwenye\n\n01:39.920 --> 01:42.630\nhatua ya nne, nilichanganya na kutumikia,\nsawa?\n\n01:42.630 --> 01:46.920\nHivyo huu ni mfano wa algorithimu kwa\nsababu niliweza kuigawanya hatua kwa\n\n01:46.920 --> 01:50.510\nhatua hadi kukamilisha jukumu la\nkutengeneza kikombe cha chai.\n\n01:52.080 --> 01:56.650\nKwa hiyo tunatumia algorithimu kila siku\nkwenye maisha yetu kila tunapofanya kitu\n\n01:56.650 --> 01:57.560\nhatua kwa hatua.\n\n01:57.920 --> 02:02.780\nHiyo inaweza kuwa kupika, kuvaa nguo,\nkutatua tatizo la hesabu, au kwa upande\n\n02:02.780 --> 02:04.950\nwetu, hata kucheza mchezo huu pia.\n\n02:06.800 --> 02:11.440\nKwa hiyo swali langu kwako ni hili: ni\nkitu gani unaweza kufikiria ambacho\n\n02:11.440 --> 02:16.480\nunafanya kila siku ambacho kinaweza kuwa\nna maelekezo ya wazi hatua kwa hatua au\n\n02:16.480 --> 02:17.940\nkina hatua zilizo wazi?\n\n02:18.620 --> 02:21.970\nKwa hiyo simamisha tu video na\nufikirie kidogo kuhusu hilo.\n\n02:25.280 --> 02:30.060\nSawa, sasa kwa kuwa umepata muda wa\nkufikiria kuhusu hilo, jambo tunalotaka\n\n02:30.060 --> 02:35.170\nuelewe kuhusu wazo hili la algorithimu\nni kwamba mashine zinahitaji algorithimu.\n\n02:35.400 --> 02:40.260\nTena, mashine haziwezi kuelewa kama\nbinadamu, na hiyo ndiyo sababu kubwa kwa\n\n02:40.260 --> 02:43.830\nnini tunahitaji kutoa maelekezo ya wazi\nhatua kwa hatua.\n\n02:43.830 --> 02:48.300\nKwa hiyo unapocheza ule mchezo au\nkuutazama, yule anaye elezea ni kama\n\n02:48.300 --> 02:52.910\nbinadamu anayetoa maelekezo, na mchoraji\nni kama mashine inayofuata hayo\n\n02:52.910 --> 02:53.550\nmaelekezo.\n"}, {"id": "lesson-3/05", "title": "Alogarithimu ya Kujifunza kwa Binadamu", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-05.mp4", "vtt": "WEBVTT\n\n00:00.720 --> 00:04.350\nSawa, sasa kwa kuwa umeelewa jinsi\nalgorithimu inavyofanya kazi, hebu\n\n00:04.350 --> 00:07.670\ntuelewe jinsi tunavyoweza kutengeneza\nalgorithimu ya kujifunza.\n\n00:08.390 --> 00:13.010\nIli kuelewa hili vizuri zaidi, tutacheza\nmchezo mdogo unaoitwa kundi gani\n\n00:13.010 --> 00:13.780\nlinastahili?\n\n00:14.580 --> 00:18.770\nNa kitakachotokea ni kwamba\nnitakuonyesha picha, na utaniambia tu\n\n00:18.770 --> 00:20.870\nkama inaenda kundi A au kundi B.\n\n00:20.870 --> 00:24.070\nSasa, ujanja ni kwamba\nsitakuambia mpangilio wake.\n\n00:24.370 --> 00:26.050\nSitakuambia sheria zake.\n\n00:26.110 --> 00:28.940\nKazi yako ni kugundua hilo mwenyewe.\n\n00:28.980 --> 00:29.720\nSawa?\n\n00:30.020 --> 00:31.740\nBasi tuanze na picha ya kwanza.\n\n00:33.140 --> 00:36.110\nSawa, hii inaenda kundi A au kundi B?\n\n00:36.890 --> 00:39.080\nJaribu tu kubahatisha.\n\n00:39.080 --> 00:41.570\nHii hapa inaenda kundi B.\n\n00:41.570 --> 00:45.050\nJe, hii inaenda kundi A au kundi B?\n\n00:46.410 --> 00:48.790\nHii hapa inaenda kundi A.\n\n00:48.790 --> 00:52.120\nJe, hii inaenda kundi A au kundi B?\n\n00:53.700 --> 00:55.980\nHii hapa inaenda kundi B.\n\n00:55.980 --> 00:58.810\nJe, inaenda kundi A au kundi B?\n\n01:00.320 --> 01:01.950\nHii hapa inaenda kundi A.\n\n01:01.950 --> 01:04.940\nHii hapa -- Je, hii inaenda\nkundi A au kundi B?\n\n01:06.210 --> 01:08.700\nHii hapa inaenda kundi A.\n\n01:08.700 --> 01:12.190\nJe, hii inaenda kundi A au kundi B?\n\n01:14.430 --> 01:16.040\nHii hapa inaenda kundi B.\n\n01:16.040 --> 01:18.360\nSasa hii ni ya kukuchanganya kidogo.\n\n01:18.550 --> 01:20.730\nJe, hii inaenda kundi A au kundi B?\n\n01:22.170 --> 01:23.460\nHii inaenda kundi A.\n\n01:23.460 --> 01:28.430\nNa nina uhakika tayari umeshagundua,\nlakini je, hii inaenda kundi A au kundi B?\n\n01:30.080 --> 01:32.180\nHii hapa inaenda kundi A.\n\n01:32.180 --> 01:35.950\nNa mwisho, je, hii inaenda\nkundi A au kundi B?\n\n01:37.240 --> 01:39.250\nHii inaenda kundi B.\n\n01:39.250 --> 01:42.670\nSawa, sasa ilikuwa mpangilio gani?\n\n01:44.110 --> 01:49.140\nNaam, kama tayari umeshagundua, kama\nkulikuwa na nyeusi upande wa kushoto,\n\n01:49.140 --> 01:54.440\nhiyo ilikuwa kundi A, na kama kulikuwa\nna nyeusi upande wa kulia, hiyo ilikuwa\n\n01:54.440 --> 01:54.990\nkundi B.\n\n01:54.990 --> 02:00.500\nNa kwa hivyo nadhani jambo la kuvutia ni,\nunawezaje kuwa bora zaidi katika kuamua\n\n02:00.500 --> 02:05.600\nkama inaenda kundi A au kundi B wakati\nsikukuambia sheria yoyote, au wakati\n\n02:05.600 --> 02:08.290\nsikukuambia sheria au mpangilio wowote?\n\n02:09.450 --> 02:13.850\nKwa hivyo jisikie huru kusitisha video\nna kutafakari hili kwa sekunde chache.\n\n02:17.510 --> 02:21.750\nSawa, kwa hiyo algoriti ya kujifunza ya\nbinadamu inaweza kuonekana kama hii.\n\n02:22.310 --> 02:27.640\nKimsingi, unatoa hisia, kisha unakagua\njibu lako ili kuona umeenda mbali kiasi\n\n02:27.640 --> 02:32.970\ngani na jibu halisi, halafu unabadilisha\numakini wako kwenye sifa nyingine, na\n\n02:32.970 --> 02:38.230\nunaendelea kurudia mchakato huu hadi\nufikie hatua ambapo unaweza kutofautisha\n\n02:38.230 --> 02:41.140\nkati ya makundi tofauti bila kupewa\nsheria.\n\n02:42.550 --> 02:46.620\nNa jambo ambalo nataka kusisitiza kuhusu\nbinadamu, kinachofanya hili liwe la\n\n02:46.620 --> 02:49.930\nkuvutia sana, ni kwamba tunatafuta kile\nkinachoonekana muhimu.\n\n02:50.130 --> 02:53.410\nKwa hiyo kama binadamu,\nsisi ni watu wa hamu sana kiasili.\n\n02:53.730 --> 02:58.350\nTuna hisia hizi na tamaa kubwa ya\nkupata maana kwa kuunganisha mawazo.\n\n02:58.880 --> 03:03.050\nKwa mfano, nikiona tu mraba mweusi\nkutoka mahali popote, nashangaa,\n\n03:03.050 --> 03:05.200\n\"Sawa, huu mraba mweusi bila shaka\n\n03:05.200 --> 03:08.610\nunanivutia,\" na, kama, kwa nini uko\nkwenye nafasi hiyo?\n\n03:09.060 --> 03:13.910\nUnajua, mwisho wa siku, ninashangaa sana\njinsi haya yote yanaunganishwa na maana\n\n03:13.910 --> 03:14.710\nyake ni nini?\n\n03:14.710 --> 03:18.890\nKwa hiyo pale ambapo algoriti ya\nkujifunza ya binadamu inafanya kazi,\n\n03:18.890 --> 03:23.440\nunajua, kinachotokea ni kwamba, kwanza\nkabisa, lazima utoe hisia au makisio\n\n03:23.440 --> 03:24.660\nyenye msingi, sivyo?\n\n03:24.660 --> 03:26.630\nKwa sababu hujui nini kitatokea.\n\n03:26.630 --> 03:27.610\nHujui sifa zake.\n\n03:28.210 --> 03:31.630\nKwa hiyo kila mara nikiulizwa,\n\"Hii inaenda kundi A au kundi B?\"\n\n03:32.070 --> 03:33.470\nUnajua, mimi husema tu,\n\n03:33.470 --> 03:35.600\n\"Sawa, basi, nadhani ni kundi A kwa\n\n03:35.600 --> 03:37.250\nsababu bado tuko mwanzoni.\"\n\n03:37.430 --> 03:39.730\nNa hapa ndipo mambo yanapovutia.\n\n03:39.810 --> 03:43.910\nKwa hiyo katika hatua ya pili,\nhapo ndipo unaanza kukagua jibu lako.\n\n03:43.910 --> 03:48.130\nKwa hiyo katika hatua ya pili, unapotoa\nmakisio na kuona matokeo, hilo\n\n03:48.130 --> 03:49.960\nlitakufanya uhisi kitu fulani.\n\n03:50.670 --> 03:54.990\nKwa mfano, kila niliposema kwamba hii\nkwa kweli ni kundi B, unaweza kuona\n\n03:54.990 --> 03:56.490\nkwamba nimeshtuka kidogo.\n\n03:56.710 --> 03:57.510\nNiko kama,\n\n03:57.510 --> 04:00.310\n\"Eh, kweli? Labda hii inahusiana na\n\n04:00.310 --> 04:02.080\nkuwa upande wa kulia.\"\n\n04:02.980 --> 04:09.670\nNa jambo kuhusu kukagua majibu ni kwamba\nlitakupa hisia ya kushangaa, labda kuwa\n\n04:09.670 --> 04:11.440\nna hamu, au kuvutiwa.\n\n04:11.630 --> 04:16.010\nUnajua, chochote kile, mwishowe\nutajiuliza, hii yote inamaanisha nini,\n\n04:16.010 --> 04:18.290\nna inaunganishaje mambo yote pamoja?\n\n04:19.180 --> 04:23.220\nHalafu hatua ya tatu ni pale\nunapaanza kubadilisha mtazamo wako.\n\n04:23.300 --> 04:27.590\nKwa hiyo, jinsi ulivyojisikia baada ya\nkubashiri mara ya mwisho itaathiri kile\n\n04:27.590 --> 04:30.090\nutakacholenga kwenye jaribio lako\nlinalofuata.\n\n04:30.090 --> 04:33.550\nKwa hiyo unaweza kuona hapa kwamba\nninapouliza swali lile lile,\n\n04:33.550 --> 04:35.380\n\"Hii inaenda kundi A au kundi B?\"\n\n04:36.100 --> 04:36.710\nNiko kama,\n\n04:36.710 --> 04:39.010\n\"Eh. Sawa, sasa iko upande wa kushoto,\n\n04:39.010 --> 04:41.260\nkwa hiyo labda hii inahusiana na kuwa\n\n04:41.260 --> 04:42.230\nkwenye kundi A.\"\n\n04:43.070 --> 04:47.660\nNa ninaposema kwamba hii ni sahihi,\nunaweza kuona ninapata furaha mara moja.\n\n04:47.770 --> 04:50.640\nNiko kama,\n\"Ah, nafikiri naanza kuelewa hii,\" sio?\n\n04:51.140 --> 04:55.910\nNa kwa hiyo ukiendelea kurudia mchakato\nhuu, baada ya muda, utajifunza ni sifa\n\n04:55.910 --> 04:59.690\nzipi kati ya hizi ambazo ni muhimu zaidi\nkutofautisha makundi.\n\n05:00.930 --> 05:05.520\nSawa, kwa hiyo inageuka kwamba tunaweza\npia kuiga hizi algoriti za kujifunza\n\n05:05.520 --> 05:06.430\nkwenye mashine.\n"}, {"id": "lesson-3/06", "title": "Alogarithimu ya Kujifunza kwa Mashine", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-06.mp4", "vtt": "WEBVTT\n\n00:01.020 --> 00:05.380\nSawa, kwa hivyo mara ya mwisho\ntulizungumza kuhusu jinsi tunavyoweza\n\n00:05.380 --> 00:08.640\nkuiga hizi algorithimu za kujifunza\nkwenye mashine.\n\n00:08.640 --> 00:13.130\nNa kabla hatujaelewa hilo, kitu\ntunachopaswa kuelewa ni hasa kipengele\n\n00:13.130 --> 00:13.650\nni nini.\n\n00:14.570 --> 00:19.320\nKwa hiyo, vipengele ni vipande vya\ntaarifa vinavyotusaidia kutofautisha vitu.\n\n00:19.500 --> 00:21.870\nKwa mfano, chukua hivi vitu viwili hapa.\n\n00:21.870 --> 00:25.600\nKitu cha kwanza ninachogundua ni\nkwamba vinatofautiana kwa umbo.\n\n00:26.040 --> 00:30.610\nMoja ni mraba, nyingine ni duara,\nna pia zinatofautiana kwa rangi.\n\n00:30.960 --> 00:36.760\nHii hapa ni mraba wa manjano, na ile\niliyoko upande wa kulia ni duara la\n\n00:36.760 --> 00:37.250\nbuluu.\n\n00:38.140 --> 00:43.260\nHivyo basi, hizi ni vipengele au taarifa\nzinazoniwezesha kutofautisha hivi vitu\n\n00:43.260 --> 00:43.720\nviwili.\n\n00:45.490 --> 00:50.040\nNa jinsi binadamu wanavyoona vipengele\nni kwamba, kila tunapotazama picha,\n\n00:50.040 --> 00:54.540\ntunaiweka katika sifa tofauti tofauti,\nhalafu tunajikuta tunazingatia ile\n\n00:54.540 --> 00:57.160\nambayo inaonekana kuwa muhimu zaidi,\nsivyo?\n\n00:57.570 --> 01:02.420\nKwa hiyo tukitazama vipengele vyote\ntofauti vya picha hii, tunagundua kwamba\n\n01:02.420 --> 01:06.690\nkwa sababu mraba mweusi huu umewekwa\npeke yake na unajitokeza, basi\n\n01:06.690 --> 01:11.090\nunaonekana kama ndio muhimu zaidi kuliko\nvipengele vingine vyote pia.\n\n01:11.470 --> 01:16.480\nHata hivyo, jambo kuhusu mashine ni\nkwamba hazibahatishi kwa hisia, bali\n\n01:16.480 --> 01:18.810\nzinatoa makadirio yaliyohesabiwa.\n\n01:19.590 --> 01:23.830\nKwa hiyo mashine hazichukulii vipengele\nhivi kama hisia, zinavichukulia kama\n\n01:23.830 --> 01:24.670\nnambari, sivyo?\n\n01:24.850 --> 01:27.460\nHazioni wala kuhisi chochote kwa kweli.\n\n01:27.960 --> 01:33.120\nKwa mfano, ili ziweze kuchakata,\nzinageuza nyeupe kuwa moja na nyeusi\n\n01:33.120 --> 01:34.040\nkuwa sifuri.\n\n01:35.730 --> 01:40.360\nNa hivyo basi, njia nzuri ya kuona\ntofauti kati ya binadamu na mashine na\n\n01:40.360 --> 01:44.870\njinsi tunavyoshughulikia vipengele ni\nkwamba kwa binadamu, unajua, kila\n\n01:44.870 --> 01:48.660\ntunapoona kitu kinachojitokeza, kama\nmraba mweusi, tutasema,\n\n01:48.660 --> 01:52.460\n\"Hicho kinaonekana muhimu,\" kwa hiyo\nkimsingi tutabahatisha.\n\n01:53.560 --> 01:58.170\nSasa, kuhusu mashine ni kwamba kila\nzinapokutana na kitu, unaweza kuona hapa\n\n01:58.170 --> 02:02.970\nkwamba haziioni kwa kweli, zinabadilisha\ntu kuwa nambari, halafu zinazidisha na\n\n02:02.970 --> 02:07.640\naina fulani ya umuhimu, kwa hiyo ni vitu\ngani kati ya hivi vina umuhimu zaidi\n\n02:07.640 --> 02:11.330\nkatika kuamua matokeo, na kisha zinatoa\nutabiri uliohesabiwa.\n\n02:11.800 --> 02:13.540\nUsijali kuhusu hesabu, sawa?\n\n02:13.540 --> 02:17.880\nJambo muhimu nataka uelewe ni kwamba\nkuna, kuna, eh, hesabu nyingi sana\n\n02:17.880 --> 02:19.920\nzinazohusika kwenye mchakato huu.\n\n02:20.740 --> 02:25.250\nKwa hiyo, ule algoriti wa mafunzo ya\nmashine, unaweza kuona una hatua\n\n02:25.250 --> 02:29.820\nzinazofanana ambapo unatoa utabiri\nuliohesabiwa, kisha unapima makosa,\n\n02:29.820 --> 02:35.060\nhalafu unarekebisha mlinganyo wako wa\nhesabu, na unaendelea kurudia mchakato huu.\n\n02:36.040 --> 02:41.710\nKwa hiyo, kuhusu kujifunza kwa mashine\nni kwamba kimsingi wanakokotoa utabiri, sawa?\n\n02:42.220 --> 02:47.410\nKwa hiyo, badala ya kuona sifa moja kwa\nmoja, wanachukua sifa na kuizidisha na,\n\n02:47.410 --> 02:52.060\nsawa, ni kwa kiasi gani kila sifa ni\nmuhimu katika kuamua matokeo, sio?\n\n02:52.420 --> 02:54.370\nJe, ni zaidi sifa ya kwanza?\n\n02:54.510 --> 02:56.040\nAu ni zaidi sifa ya pili?\n\n02:56.120 --> 02:57.540\nNa kadhalika, sivyo?\n\n02:57.540 --> 03:01.230\nInajaribu kuamua hilo ili\nkuona inafikiaje jibu hilo.\n\n03:02.150 --> 03:05.840\nSasa hebu tuone algoriti ya\nkujifunza kwa mashine ikifanya kazi.\n\n03:05.840 --> 03:09.230\nKwa hiyo hatua ya kwanza,\nkimsingi unakokotoa utabiri wako.\n\n03:10.020 --> 03:14.790\nKwa hiyo wanaanza kwa kukokotoa sifa\nkama nambari, halafu wanazijumlisha\n\n03:14.790 --> 03:17.670\npamoja na thamani za umuhimu za\nkubahatisha.\n\n03:18.030 --> 03:22.230\nKumbuka, mwanzoni, unajua, sawa na\nbinadamu, tulilazimika kutoa dondoo ya\n\n03:22.230 --> 03:22.930\nkubahatisha.\n\n03:23.270 --> 03:27.890\nKwa hiyo hata hizi mashine, zinaweka tu\nkitu cha kubahatisha kuhusu ni ipi kati\n\n03:27.890 --> 03:29.600\nya hizi sifa ni muhimu kweli.\n\n03:30.150 --> 03:34.200\nNa hivyo wanakuja na aina fulani\nya utabiri uliokokotolewa.\n\n03:34.200 --> 03:38.380\nKwa hiyo baada ya kufanya utabiri huo,\ntunapaswa kupima kosa.\n\n03:39.110 --> 03:43.250\nKile ambacho mfano unafanya ni\nkulinganisha jinsi utabiri\n\n03:43.250 --> 03:48.580\nuliokokotolewa ulivyokuwa mbali na jibu\nsahihi halisi, na umbali huu ndio\n\n03:48.580 --> 03:49.540\ntunaita kosa.\n\n03:50.420 --> 03:55.110\nNa kwa hiyo kosa hili litakuwa muhimu\nsana kwetu kwa sababu tunachofanya ni\n\n03:55.110 --> 03:59.620\nkutumia hilo kosa, na tunalitumia\nkutusaidia kurekebisha umuhimu wa kila\n\n03:59.620 --> 04:04.000\nsifa tofauti kwenye mlinganyo wetu,\ntukilenga kupata kosa kidogo zaidi\n\n04:04.000 --> 04:05.590\nkwenye utabiri unaofuata.\n\n04:06.510 --> 04:12.150\nKwa hiyo kimsingi, tunachofanya ni\nkuchukua hilo kosa halafu tunaliboresha\n\n04:12.150 --> 04:17.790\ntofauti kwa kila sifa ili kuona ipi ni\nmuhimu zaidi katika kuamua matokeo.\n\n04:18.460 --> 04:22.700\nHalafu kimsingi tunakuja na aina fulani\nya mlinganyo ulioboreshwa ambao\n\n04:22.700 --> 04:24.940\ntutaendelea kuuboresha mara kwa mara.\n\n04:25.700 --> 04:30.840\nNa baada ya kurudia vya kutosha, unakuwa\nna mfano uliopata mafunzo ambao unaweza\n\n04:30.840 --> 04:31.880\nkufanya utabiri.\n\n04:32.510 --> 04:37.260\nKwa hiyo unaweza kuona hapa kwamba tuna\nmlinganyo wa hesabu ulioboreshwa vizuri\n\n04:37.260 --> 04:40.300\nambao unaweza kufanya maamuzi sahihi\nkabisa, sivyo?\n\n04:40.550 --> 04:44.420\nUnaweza kuona imeandikwa asilimia\nthemanini na saba kundi B.\n\n04:44.420 --> 04:49.140\nKwa hiyo wazo kuu, na ni sawa kama\nhuelewi hesabu inayohusika, kitu pekee\n\n04:49.140 --> 04:54.200\nnataka uelewe ni kwamba mfano uliopata\nmafunzo unategemea mlinganyo wa hesabu.\n\n04:54.200 --> 04:59.380\nKwa hiyo, mifano ya AI iliyopata mafunzo\nkimsingi hubadilisha data kuwa nambari.\n\n04:59.940 --> 05:05.460\nHufanya mahesabu mengi juu yake, halafu\npia hutoa nambari ambayo baadaye\n\n05:05.460 --> 05:10.200\nhubadilishwa kuwa kitu ambacho binadamu\nanaweza kuelewa, sawa?\n\n05:11.000 --> 05:16.500\nNa ndiyo maana kila undani wa picha yetu\nau data ni muhimu sana kwa sababu kila\n\n05:16.500 --> 05:21.870\nundani ni muhimu kwenye mifano ya AI kwa\nsababu kila nambari ni muhimu kwenye\n\n05:21.870 --> 05:23.070\nmlinganyo, sivyo?\n\n05:23.650 --> 05:29.080\nAI haisindiki taarifa kama sisi, kwa\nhiyo utabiri wake huenda usilingane na\n\n05:29.080 --> 05:30.700\nmatarajio yetu, sivyo?\n\n05:30.930 --> 05:35.080\nKwa hiyo unaweza kuona hapa kwamba kila\nmoja ya hizi inaweza kuwa inawakilisha\n\n05:35.080 --> 05:38.040\nnambari ambayo tutakuwa tunahesabu\nkwenye mlinganyo huo.\n\n05:39.120 --> 05:43.660\nNa wazo hili linatumika kwa ujumla\nkwenye aina yoyote ya mfano wa AI, sivyo?\n\n05:43.880 --> 05:48.910\nHata kama ni mifano ya lugha au zana za\nAI za mazungumzo, kimsingi zinachukua\n\n05:48.910 --> 05:53.540\nmaneno yako, lazima yazungushwe kuwa\nnambari, unafanya hesabu juu yake,\n\n05:53.540 --> 05:57.390\nhalafu yanarudishwa kuwa maneno ili\nuweze kuyaelewa, sivyo?\n\n05:58.240 --> 06:02.950\nKwa hiyo, kimsingi, mengi yake ni\nkufanya hesabu nyingi, mlinganyo na\n\n06:02.950 --> 06:06.060\nmahesabu mwishoni mwa siku ili kupata\nutabiri.\n\n06:08.130 --> 06:12.510\nKwa hiyo jambo kuu nataka\nuchukue ni kwamba AI si uchawi.\n\n06:12.740 --> 06:16.220\nKimsingi ni hesabu zinazoongozwa\nna maamuzi ya binadamu.\n\n06:16.330 --> 06:21.280\nNa nasema hivi si kwa kudharau, ila\nnataka iwe wazi kabisa kwamba ni hesabu\n\n06:21.280 --> 06:23.950\ntu zinazoongozwa na maamuzi ya binadamu.\n\n06:24.700 --> 06:29.010\nKwa mfano, kila tunapotazama jinsi\nAI inavyoweza kubadilika, sivyo?\n\n06:29.140 --> 06:33.070\nAI inabadilika kimsingi kwa kutumia\nalgorithimu za kujifunza zilizoandikwa\n\n06:33.070 --> 06:35.440\nna binadamu na zinazoendeshwa kwenye\nmashine.\n\n06:36.040 --> 06:40.670\nKama tulivyosema na tulivyoona, hili\nlinahitaji mahesabu mengi sana, ambayo\n\n06:40.670 --> 06:42.230\nyanatumia nishati nyingi.\n\n06:42.850 --> 06:46.880\nKwa hiyo NeuroPocket kimsingi inatumia\nnishati au inafanya mahesabu moja kwa\n\n06:46.880 --> 06:48.640\nmoja kwenye kifaa chako, sivyo?\n\n06:48.830 --> 06:53.340\nKwa hiyo, sehemu kubwa ya mahesabu\nmazito itatumia nishati nyingi, na\n\n06:53.340 --> 06:58.840\nkufanya kifaa chako kianze kuwa na joto,\nna pia itapunguza chaji ya betri kama hivyo.\n\n06:58.840 --> 07:03.280\nSasa, ukweli ni kwamba gharama ya\nkimazingira ya AI ni kwamba wakati\n\n07:03.280 --> 07:07.520\nNeuroPocket inafanya kazi moja kwa moja\nkwenye kifaa chako, AI nyingi\n\n07:07.520 --> 07:12.230\nzinaendeshwa kwenye majengo makubwa\nyaliyojaa maelfu ya kompyuta, sivyo?\n\n07:12.950 --> 07:17.560\nKwa hiyo majengo haya yanatumia umeme\nmwingi sawa na miji midogo na mabilioni\n\n07:17.560 --> 07:22.170\nya galoni za maji ili tu kujipoza na\nkufanya aina hizi tofauti za mahesabu ya\n\n07:22.170 --> 07:22.600\nhesabu.\n\n07:22.850 --> 07:27.100\nKwa hiyo, hii inaweza kuwa na gharama\nkubwa sana kwa mazingira yetu.\n\n07:27.180 --> 07:29.690\nJambo lingine sasa ni uhuru wa AI.\n\n07:29.860 --> 07:35.240\nSasa, uhuru wa AI ni kama vile, unajua,\nAI inatabiri kwa kutafuta mifumo yake\n\n07:35.240 --> 07:37.500\nyenyewe kwenye data nyingi sana.\n\n07:38.240 --> 07:42.890\nKwa hiyo kama binadamu, kimsingi tunatoa\nmifano au mrejesho ili kusaidia\n\n07:42.890 --> 07:44.850\nkuelekeza utabiri wake, sivyo?\n\n07:45.020 --> 07:49.650\nKwa mfano, wewe ndiye ulikusanya data\nya kufundisha programu yako ya NeuroPocket.\n\n07:50.230 --> 07:55.150\nKwa hiyo, kwa kweli, unajua, katika\nmpangilio mkubwa wa mambo, kuna binadamu\n\n07:55.150 --> 07:57.390\nwengi ambao wako nyuma ya hizi AI.\n\n07:57.860 --> 08:02.780\nUnajua, kwa NeuroPocket, ilikuwa ni wewe tu\nau labda marafiki wachache wengine ambao\n\n08:02.780 --> 08:04.410\nwalikuwa wanakusanya data.\n\n08:04.410 --> 08:09.210\nLakini AI nyingi zinahitaji mamilioni ya\nwatu kusafisha data na kuelekeza yale\n\n08:09.210 --> 08:10.020\nmifano ya AI.\n\n08:10.340 --> 08:16.470\nKwa hiyo bila hizo chaguo za kibinadamu,\nmashine isingejua jinsi ya kupata mifumo\n\n08:16.470 --> 08:17.010\nsahihi.\n\n08:17.170 --> 08:22.360\nKwa hiyo mwisho wa siku, unachotaka\nkuelewa kuhusu jinsi AI inavyofanya kazi\n\n08:22.360 --> 08:25.880\nni kwamba zana za AI ni zao la chaguo za\nkibinadamu.\n"}, {"id": "lesson-3/07", "title": "Jaribio la Marudio", "type": "html", "kind": "Quiz", "src": "/course/apps/recap-quiz/index.html?quiz=3&lang=sw"}, {"id": "lesson-3/08", "title": "Muda wa Mradi", "type": "video", "kind": "Video", "src": "https://github.com/ousecTic/learnaianywhere/releases/download/course-videos-v1.1/sw-KE-lesson-3-08.mp4", "vtt": "WEBVTT\n\n00:00.360 --> 00:02.660\nSawa, somo la tatu, ni muda wa mradi.\n\n00:02.660 --> 00:06.210\nKwa hiyo ni wakati wako kuanza\nkufikiria kuhusu sifa zako.\n\n00:06.760 --> 00:12.100\nKwa hiyo, ukizingatia data yako ya somo\nla pili, nataka ufikirie kwa undani\n\n00:12.100 --> 00:12.540\nzaidi.\n\n00:12.540 --> 00:16.870\nFikiria kuhusu sifa kuu ulizotumia\nkutofautisha makundi yako.\n\n00:16.870 --> 00:18.600\nJe, labda ilikuwa rangi?\n\n00:18.600 --> 00:19.980\nJe, ilikuwa ukubwa?\n\n00:20.510 --> 00:21.500\nJe, ni umbo?\n\n00:21.500 --> 00:25.270\nSifa gani nyingine\nzilitofautisha makundi yako?\n\n00:25.270 --> 00:31.170\nJibu hilo kwenye swali la tatu la\nkaratasi yako, na ukimaliza, boresha AI\n\n00:31.170 --> 00:32.480\nclassifier yako.\
