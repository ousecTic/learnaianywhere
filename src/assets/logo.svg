<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Network Graph Icon -->
    <g transform="translate(0,20)">
      <!-- Nodes -->
      <circle cx="20" cy="80" r="8" fill="#258EC2"/>
      <circle cx="60" cy="40" r="8" fill="#258EC2"/>
      <circle cx="60" cy="120" r="8" fill="#258EC2"/>
      <circle cx="100" cy="80" r="8" fill="#258EC2"/>
      <circle cx="100" cy="20" r="8" fill="#258EC2"/>
      <circle cx="100" cy="140" r="8" fill="#258EC2"/>
      <circle cx="140" cy="60" r="8" fill="#258EC2"/>
      <circle cx="140" cy="100" r="8" fill="#258EC2"/>
      
      <!-- Connecting Lines -->
      <line x1="20" y1="80" x2="60" y2="40" stroke="#258EC2" stroke-width="2"/>
      <line x1="20" y1="80" x2="60" y2="120" stroke="#258EC2" stroke-width="2"/>
      <line x1="60" y1="40" x2="100" y2="20" stroke="#258EC2" stroke-width="2"/>
      <line x1="60" y1="40" x2="100" y2="80" stroke="#258EC2" stroke-width="2"/>
      <line x1="60" y1="120" x2="100" y2="80" stroke="#258EC2" stroke-width="2"/>
      <line x1="60" y1="120" x2="100" y2="140" stroke="#258EC2" stroke-width="2"/>
      <line x1="100" y1="20" x2="140" y2="60" stroke="#258EC2" stroke-width="2"/>
      <line x1="100" y1="80" x2="140" y2="60" stroke="#258EC2" stroke-width="2"/>
      <line x1="100" y1="80" x2="140" y2="100" stroke="#258EC2" stroke-width="2"/>
      <line x1="100" y1="140" x2="140" y2="100" stroke="#258EC2" stroke-width="2"/>
    </g>
    
    <!-- Text -->
    <text x="180" y="110" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="#258EC2">LEARN AI ANYWHERE</text>
  </g>
</svg>
