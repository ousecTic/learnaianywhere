name: Release the Android app

# Builds the AI Literacy app (course/app) when a tag like app-v1.0.0 is pushed, signs it
# with the permanent key in the repository secrets and attaches it to a release:
#
# - app-v1.2.0       publishes the release and updates app.json and ai-literacy.apk on the
#                    app-latest release, where installed apps and the website find it.
# - app-v1.2.0-test  (anything after the version) makes a draft only, for checking.
#
# The version in the tag becomes the APK's versionName; versionCode is
# major * 10000 + minor * 100 + patch, so it always goes up. See "Release the app" in
# course/app/README.md.
on:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: v
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^app-v([0-9]+)\.([0-9]+)\.([0-9]+)(-.+)?$ ]]; then
            echo "::error::Tag $TAG should look like app-v1.2.0 (or app-v1.2.0-test for a draft)."
            exit 1
          fi
          MA=${BASH_REMATCH[1]} MI=${BASH_REMATCH[2]} PA=${BASH_REMATCH[3]}
          VERSION="$MA.$MI.$PA"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))" >> "$GITHUB_OUTPUT"
          if [ -n "${BASH_REMATCH[4]}" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
          echo "file=ai-literacy-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Stop if this version is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$GITHUB_REF_NAME is already published; people may have installed it. Tag a new version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the legacy "tools" package, which is no
          # longer in the SDK repository and makes sdkmanager fail.
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare the app
        working-directory: course/app
        run: |
          npm ci
          npm run sync

      - name: Stamp the version into build.gradle
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.v.outputs.version }}\"/" course/app/android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.v.outputs.code }}/" course/app/android/app/build.gradle
          grep -E "versionName|versionCode" course/app/android/app/build.gradle

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. See 'Release the app' in course/app/README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ailiteracy-release.jks"
          echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/ailiteracy-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        working-directory: course/app/android
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the signature
        run: |
          APK=course/app/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          rm -f "$APP_KEYSTORE_FILE"
          cp "$APK" "${{ steps.v.outputs.file }}"

      - name: Describe the APK for installed apps
        run: |
          FILE="${{ steps.v.outputs.file }}"
          cat > app.json <<EOF
          {
            "versionCode": ${{ steps.v.outputs.code }},
            "versionName": "${{ steps.v.outputs.version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$FILE",
            "sha256": "$(sha256sum "$FILE" | cut -d' ' -f1)",
            "bytes": $(stat -c %s "$FILE")
          }
          EOF
          cat app.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DRAFT=""
          [ "${{ steps.v.outputs.publish }}" = "true" ] || DRAFT="--draft"
          NOTES="The AI Literacy for Everyone app for Android, version ${{ steps.v.outputs.version }}. Install the APK, open AI Literacy and choose a language: it downloads the course once, then works without internet."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.v.outputs.file }}" app.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.v.outputs.file }}" app.json $DRAFT --latest=false \
              --title "AI Literacy app ${{ steps.v.outputs.version }}" --notes "$NOTES"
          fi

      - name: Update app-latest
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app-latest >/dev/null 2>&1; then
            gh release create app-latest --target "$GITHUB_SHA" --latest=false --title "AI Literacy app: newest version" \
              --notes "The newest AI Literacy app for Android. Every published app version replaces these files: ai-literacy.apk to install, and app.json, where installed apps look for updates."
          fi
          cp "${{ steps.v.outputs.file }}" ai-literacy.apk
          gh release upload app-latest ai-literacy.apk app.json --clobber
